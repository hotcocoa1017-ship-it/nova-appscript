<script>
(() => {
  'use strict';

  // QM_SCHEMA_CACHE_BYPASS_V4
  // 기존 QM 비즈니스 로직은 그대로 두고 브라우저가 직접 호출하는 QM RPC의 전송계층만
  // PostgREST에서 direct DB Edge로 우회합니다. Edge 자체가 불가한 경우에만 기존 PostgREST로 후퇴합니다.
  if (!window.__novaQmSchemaCacheBypassV4 && typeof window.fetch === 'function') {
    window.__novaQmSchemaCacheBypassV4 = true;
    const nativeFetch = window.fetch.bind(window);
    const rpcNames = new Set([
      'nova_qm_begin_inspection_v1',
      'nova_qm_prepare_new_draft_v1',
      'nova_save_qm_draft',
      'nova_qm_inspection_finalize_v2',
      'nova_create_qm_houseman_order',
      'nova_mobile_my_houseman_orders_v1',
      'nova_qm_last_qm_cards_v1',
      'nova_qm_clear_v1'
    ]);
    const transportFallbackCodes = new Set([
      'QM_DB_DIRECT_UNAVAILABLE',
      'QM_DB_DIRECT_ERROR',
      'QM_DB_DIRECT_EMPTY'
    ]);

    window.fetch = async function(input, init) {
      const url = typeof input === 'string' ? input : String(input?.url || '');
      const method = String(init?.method || input?.method || 'GET').trim().toUpperCase();
      const match = method === 'POST'
        ? url.match(/\/rest\/v1\/rpc\/(nova_qm_begin_inspection_v1|nova_qm_prepare_new_draft_v1|nova_save_qm_draft|nova_qm_inspection_finalize_v2|nova_create_qm_houseman_order|nova_mobile_my_houseman_orders_v1|nova_qm_last_qm_cards_v1|nova_qm_clear_v1)(?:\?|$)/)
        : null;
      const rpc = String(match?.[1] || '');
      if (!rpcNames.has(rpc)) return nativeFetch(input, init);

      let args = {};
      try {
        const rawBody = typeof init?.body === 'string' ? init.body : '';
        args = rawBody ? JSON.parse(rawBody) : {};
      } catch (_) {
        return nativeFetch(input, init);
      }

      const sourceHeaders = new Headers(init?.headers || input?.headers || {});
      const authorization = String(sourceHeaders.get('Authorization') || '');
      const apikey = String(sourceHeaders.get('apikey') || '');
      if (!authorization || !apikey) return nativeFetch(input, init);

      try {
        const supabaseOrigin = new URL(url).origin;
        const edgeResponse = await nativeFetch(`${supabaseOrigin}/functions/v1/nova-qm-db-resilient-v1`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': authorization,
            'apikey': apikey
          },
          body: JSON.stringify({ rpc, args })
        });
        if (edgeResponse.ok) return edgeResponse;

        let edgeBody = {};
        try { edgeBody = await edgeResponse.clone().json(); } catch (_) {}
        const edgeCode = String(edgeBody?.code || '').trim().toUpperCase();

        // 권한·업무검증·동시성 오류는 authoritative DB 결과이므로 그대로 전달합니다.
        if (edgeCode && !transportFallbackCodes.has(edgeCode)) return edgeResponse;
        if (!transportFallbackCodes.has(edgeCode) && edgeResponse.status < 500) return edgeResponse;

        console.warn(`[NOVA QM] direct DB edge transport fallback · ${rpc} · ${edgeCode || edgeResponse.status}`);
      } catch (error) {
        console.warn(`[NOVA QM] direct DB edge network fallback · ${rpc}:`, error?.message || error);
      }
      return nativeFetch(input, init);
    };
  }

  // QM_DBFIRST_SAVE_UNBLOCK_V2
  // Supabase DB-first 점검은 이미 시작됐지만 레거시 Sheet mirror만 지연/실패한 경우,
  // 임시 저장/점검 완료를 Sheet mirror에 묶지 않습니다.
  // 점검 시작 자체가 아직 진행 중이거나 실제 저장/완료 요청이 처리 중인 동안에는 잠금을 유지합니다.
  const ROOT_ID = 'modalRoot';
  const LEGACY_MIRROR_TITLE = 'Supabase 점검 시작은 완료됐습니다. 기존 이력 동기화가 끝나면 저장할 수 있습니다.';
  const START_PENDING_TEXT = '점검 시작 처리 중';
  const MIRROR_PENDING_TEXT = '저장 준비 중';
  const MIRROR_ERROR_TEXT = '저장 준비 오류';
  let scheduled = false;
  let operationActive = false;
  let operationButton = null;
  let operationOriginalText = '';

  function scheduleCheck_() {
    if (scheduled) return;
    scheduled = true;
    queueMicrotask(() => {
      scheduled = false;
      reconcileControls_();
    });
  }

  function resetOperation_() {
    if (operationButton?.isConnected && operationOriginalText) {
      operationButton.textContent = operationOriginalText;
      operationButton.removeAttribute('aria-busy');
    }
    operationActive = false;
    operationButton = null;
    operationOriginalText = '';
  }

  function mirrorOnlyLock_(submit, status) {
    const title = String(submit?.getAttribute('title') || '').trim();
    const text = String(status?.textContent || '').trim();
    if (text.includes(START_PENDING_TEXT)) return false;
    if (title === LEGACY_MIRROR_TITLE) return true;
    if (text.includes('점검 시작 완료') && text.includes(MIRROR_PENDING_TEXT)) return true;
    if (text.includes(MIRROR_ERROR_TEXT)) return true;
    return false;
  }

  function reconcileControls_() {
    const root = document.getElementById(ROOT_ID);
    if (!root || root.classList.contains('hidden')) {
      if (operationActive) resetOperation_();
      return;
    }

    const submit = root.querySelector('#qmChecklistSubmit');
    const saveOnly = root.querySelector('#qmInspectionSaveOnly');
    const status = root.querySelector('#qmDraftSaveStatus');
    if (!submit || !saveOnly) {
      if (operationActive) resetOperation_();
      return;
    }

    // 실제 저장/완료 요청에서 기존 Client가 버튼을 다시 활성화하면 작업 표시만 원복합니다.
    if (operationActive) {
      if (!operationButton?.isConnected) {
        resetOperation_();
      } else if (!operationButton.disabled) {
        resetOperation_();
      } else {
        return;
      }
    }

    // DB는 이미 QM_CHECKING + draft 상태이므로 Sheet mirror만 지연된 잠금은 해제합니다.
    // startPending 잠금은 상태문구로 구분하여 절대 해제하지 않습니다.
    if (!mirrorOnlyLock_(submit, status)) return;
    saveOnly.disabled = false;
    submit.disabled = false;
    submit.removeAttribute('title');
    saveOnly.removeAttribute('title');
    submit.dataset.novaQmDbFirstSaveUnblock = '2';
    saveOnly.dataset.novaQmDbFirstSaveUnblock = '2';
  }

  const root = document.getElementById(ROOT_ID);
  if (!root) return;

  new MutationObserver(scheduleCheck_).observe(root, {
    childList: true,
    subtree: true,
    attributes: true,
    characterData: true,
    attributeFilter: ['disabled', 'title', 'class']
  });

  document.addEventListener('click', event => {
    const target = event.target?.closest?.('#qmChecklistSubmit, #qmInspectionSaveOnly');
    if (!target) {
      scheduleCheck_();
      return;
    }
    if (target.disabled) {
      scheduleCheck_();
      return;
    }

    // 기존 Client 핸들러는 그대로 실행합니다. 여기서는 사용자가 눌렀다는 즉시 피드백만 표시하고
    // 처리 중 MutationObserver가 버튼을 잘못 재활성화하지 않도록 보호합니다.
    operationActive = true;
    operationButton = target;
    operationOriginalText = String(target.textContent || '');
    target.setAttribute('aria-busy', 'true');
    target.textContent = target.id === 'qmChecklistSubmit' ? '점검 완료 처리 중…' : '저장 중…';

    const status = root.querySelector('#qmDraftSaveStatus');
    if (status) status.textContent = target.id === 'qmChecklistSubmit' ? '점검 완료·결과 저장 처리 중…' : '임시 저장 처리 중…';

    window.setTimeout(scheduleCheck_, 0);
  }, true);

  scheduleCheck_();
})();
</script>
