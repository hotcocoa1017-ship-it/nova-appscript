<script>
(() => {
  'use strict';

  // QM_DBFIRST_SAVE_UNBLOCK_V2
  // Supabase DB-first 점검은 이미 시작됐지만 레거시 Sheet mirror만 지연/실패한 경우,
  // 임시 저장/점검 완료를 Sheet mirror에 묶지 않습니다.
  // 점검 시작 자체가 아직 진행 중이거나 실제 저장/완료 요청이 처리 중인 동안에는 잠금을 유지합니다.
  const ROOT_ID = 'modalRoot';
  const LEGACY_MIRROR_TITLE = 'Supabase 점검 시작은 완료됐습니다. 기존 이력 동기화가 끝나면 저장할 수 있습니다.';
  const START_PENDING_TEXT = '점검 시작 처리 중';
  const MIRROR_PENDING_TEXT = '저장 준비 중';
  const MIRROR_ERROR_TEXT = '저장 준비 오류';
  let scheduled = false;
  let operationActive = false;
  let operationButton = null;
  let operationOriginalText = '';

  function scheduleCheck_() {
    if (scheduled) return;
    scheduled = true;
    queueMicrotask(() => {
      scheduled = false;
      reconcileControls_();
    });
  }

  function resetOperation_() {
    if (operationButton?.isConnected && operationOriginalText) {
      operationButton.textContent = operationOriginalText;
      operationButton.removeAttribute('aria-busy');
    }
    operationActive = false;
    operationButton = null;
    operationOriginalText = '';
  }

  function mirrorOnlyLock_(submit, status) {
    const title = String(submit?.getAttribute('title') || '').trim();
    const text = String(status?.textContent || '').trim();
    if (text.includes(START_PENDING_TEXT)) return false;
    if (title === LEGACY_MIRROR_TITLE) return true;
    if (text.includes('점검 시작 완료') && text.includes(MIRROR_PENDING_TEXT)) return true;
    if (text.includes(MIRROR_ERROR_TEXT)) return true;
    return false;
  }

  function reconcileControls_() {
    const root = document.getElementById(ROOT_ID);
    if (!root || root.classList.contains('hidden')) {
      if (operationActive) resetOperation_();
      return;
    }

    const submit = root.querySelector('#qmChecklistSubmit');
    const saveOnly = root.querySelector('#qmInspectionSaveOnly');
    const status = root.querySelector('#qmDraftSaveStatus');
    if (!submit || !saveOnly) {
      if (operationActive) resetOperation_();
      return;
    }

    // 실제 저장/완료 요청에서 기존 Client가 버튼을 다시 활성화하면 작업 표시만 원복합니다.
    if (operationActive) {
      if (!operationButton?.isConnected) {
        resetOperation_();
      } else if (!operationButton.disabled) {
        resetOperation_();
      } else {
        return;
      }
    }

    // DB는 이미 QM_CHECKING + draft 상태이므로 Sheet mirror만 지연된 잠금은 해제합니다.
    // startPending 잠금은 상태문구로 구분하여 절대 해제하지 않습니다.
    if (!mirrorOnlyLock_(submit, status)) return;
    saveOnly.disabled = false;
    submit.disabled = false;
    submit.removeAttribute('title');
    saveOnly.removeAttribute('title');
    submit.dataset.novaQmDbFirstSaveUnblock = '2';
    saveOnly.dataset.novaQmDbFirstSaveUnblock = '2';
  }

  const root = document.getElementById(ROOT_ID);
  if (!root) return;

  new MutationObserver(scheduleCheck_).observe(root, {
    childList: true,
    subtree: true,
    attributes: true,
    characterData: true,
    attributeFilter: ['disabled', 'title', 'class']
  });

  document.addEventListener('click', event => {
    const target = event.target?.closest?.('#qmChecklistSubmit, #qmInspectionSaveOnly');
    if (!target) {
      scheduleCheck_();
      return;
    }
    if (target.disabled) {
      scheduleCheck_();
      return;
    }

    // 기존 Client 핸들러는 그대로 실행합니다. 여기서는 사용자가 눌렀다는 즉시 피드백만 표시하고
    // 처리 중 MutationObserver가 버튼을 잘못 재활성화하지 않도록 보호합니다.
    operationActive = true;
    operationButton = target;
    operationOriginalText = String(target.textContent || '');
    target.setAttribute('aria-busy', 'true');
    target.textContent = target.id === 'qmChecklistSubmit' ? '점검 완료 처리 중…' : '저장 중…';

    const status = root.querySelector('#qmDraftSaveStatus');
    if (status) status.textContent = target.id === 'qmChecklistSubmit' ? '점검 완료·결과 저장 처리 중…' : '임시 저장 처리 중…';

    // 유효성 검사에서 기존 핸들러가 같은 이벤트 안에서 즉시 버튼을 다시 활성화할 수 있습니다.
    window.setTimeout(scheduleCheck_, 0);
  }, true);

  scheduleCheck_();
})();
</script>

<script>
(() => {
  'use strict';

  // DATA_API_INFRA_RETRY_GUARD_V1
  // Supabase Data API가 schema-cache/host-storage 장애를 명시적으로 반환한 경우에만
  // QM·객실업로드의 5xx 자동 재시도 폭주를 차단합니다.
  // QM_AUTH_FAILURE_RETRY_GUARD_V1 · QM 시작 RPC의 반복 401/403만 별도 회로차단합니다.
  // 첫 401은 기존 토큰 갱신 기회를 유지하고, 짧은 시간 내 두 번째 인증/권한 실패부터 차단합니다.
  if (typeof window.fetch !== 'function' || window.fetch.__novaDataApiInfraRetryGuardV1) return;

  const nativeFetch = window.fetch.bind(window);
  const guardedRpcNames = [
    'nova_qm_begin_inspection_v1',
    'nova_qm_prepare_new_draft_v1',
    'nova_save_qm_draft',
    'nova_qm_inspection_finalize_v2',
    'nova_room_upload_state_v3',
    'nova_room_upload_apply_v5',
    'nova_room_upload_mark_stage_v1'
  ];
  const CIRCUIT_MS = 15000;
  const AUTH_FAILURE_WINDOW_MS = 4000;
  const AUTH_FAILURE_CIRCUIT_MS = 60000;
  const AUTH_FAILURE_THRESHOLD = 2;
  const AUTH_CIRCUIT_STORAGE_KEY = 'novaQmAuthFailureCircuitUntilV1';
  let circuitUntil = 0;
  let authCircuitUntil = 0;
  let authFailureWindowStartedAt = 0;
  let authFailureCount = 0;

  function requestUrl_(input) {
    if (typeof input === 'string') return input;
    if (input && typeof input.url === 'string') return input.url;
    return '';
  }

  function isGuardedRpc_(url) {
    const text = String(url || '');
    if (!text.includes('/rest/v1/rpc/')) return false;
    return guardedRpcNames.some(name => text.includes(`/rpc/${name}`));
  }

  function isQmBeginRpc_(url) {
    return String(url || '').includes('/rest/v1/rpc/nova_qm_begin_inspection_v1');
  }

  function isInfrastructureFailure_(text) {
    return /could not query the database for the schema cache|schema[ -]?cache|databasestoragecapacityexhausted|hostoutofdiskspace|host out of disk space|out of disk space/i.test(String(text || ''));
  }

  function readAuthCircuitUntil_() {
    let stored = 0;
    try { stored = Number(window.localStorage?.getItem(AUTH_CIRCUIT_STORAGE_KEY) || 0); } catch (ignore) {}
    return Math.max(Number(authCircuitUntil || 0), Number(stored || 0));
  }

  function writeAuthCircuitUntil_(until) {
    authCircuitUntil = Math.max(Number(authCircuitUntil || 0), Number(until || 0));
    try { window.localStorage?.setItem(AUTH_CIRCUIT_STORAGE_KEY, String(authCircuitUntil)); } catch (ignore) {}
  }

  function clearAuthFailureState_() {
    authFailureWindowStartedAt = 0;
    authFailureCount = 0;
    authCircuitUntil = 0;
    try { window.localStorage?.removeItem(AUTH_CIRCUIT_STORAGE_KEY); } catch (ignore) {}
  }

  function noteAuthFailure_() {
    const now = Date.now();
    if (!authFailureWindowStartedAt || now - authFailureWindowStartedAt > AUTH_FAILURE_WINDOW_MS) {
      authFailureWindowStartedAt = now;
      authFailureCount = 1;
      return false;
    }
    authFailureCount += 1;
    if (authFailureCount < AUTH_FAILURE_THRESHOLD) return false;
    writeAuthCircuitUntil_(now + AUTH_FAILURE_CIRCUIT_MS);
    return true;
  }

  function unavailableResponse_(originalStatus) {
    return new Response(JSON.stringify({
      message: 'Supabase Data API가 일시적으로 불안정합니다. 잠시 후 다시 시도해 주세요.',
      code: 'NOVA_DATA_API_INFRA_UNAVAILABLE',
      details: 'schema cache 또는 database host storage 상태를 확인해야 합니다.',
      originalStatus: Number(originalStatus || 503)
    }), {
      status: 409,
      statusText: 'NOVA Data API temporarily unavailable',
      headers: { 'Content-Type': 'application/json' }
    });
  }

  function authSuppressedResponse_(originalStatus) {
    return new Response(JSON.stringify({
      message: 'QM DB 인증 확인이 반복 실패해 추가 요청을 잠시 차단했습니다. 로그인 상태를 다시 확인해 주세요.',
      code: 'NOVA_QM_AUTH_RETRY_SUPPRESSED',
      details: '반복 401/403으로 인한 Data API 재요청 폭주를 방지했습니다.',
      originalStatus: Number(originalStatus || 401)
    }), {
      status: 409,
      statusText: 'NOVA QM auth retry suppressed',
      headers: { 'Content-Type': 'application/json' }
    });
  }

  const guardedFetch = async function(input, init) {
    const url = requestUrl_(input);
    if (!isGuardedRpc_(url)) return nativeFetch(input, init);

    const qmBegin = isQmBeginRpc_(url);
    if (qmBegin && Date.now() < readAuthCircuitUntil_()) {
      return authSuppressedResponse_(401);
    }

    // 같은 브라우저에서 이미 인프라 오류가 확인된 직후에는 짧은 회로차단으로
    // 재귀 retry와 연속 클릭이 Data API에 추가 부하를 만들지 않게 합니다.
    if (Date.now() < circuitUntil) return unavailableResponse_(503);

    const response = await nativeFetch(input, init);
    const status = Number(response?.status || 0);

    if (qmBegin && response?.ok) clearAuthFailureState_();
    if (qmBegin && (status === 401 || status === 403)) {
      if (noteAuthFailure_()) {
        console.warn('[NOVA] Repeated QM auth/permission failure detected; QM begin retries are temporarily suppressed.');
        return authSuppressedResponse_(status);
      }
      return response;
    }

    if (status < 500) return response;

    let bodyText = '';
    try { bodyText = await response.clone().text(); } catch (ignore) {}
    if (!isInfrastructureFailure_(bodyText)) return response;

    circuitUntil = Date.now() + CIRCUIT_MS;
    console.warn('[NOVA] Supabase Data API infrastructure failure detected; QM/upload retries are temporarily suppressed.');
    return unavailableResponse_(response.status);
  };

  guardedFetch.__novaDataApiInfraRetryGuardV1 = true;
  guardedFetch.__novaQmAuthFailureRetryGuardV1 = true;
  guardedFetch.__novaNativeFetch = nativeFetch;
  window.fetch = guardedFetch;
})();
</script>
