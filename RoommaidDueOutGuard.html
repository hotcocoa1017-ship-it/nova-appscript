<script>
(() => {
  'use strict';

  // ROOMMAID_DUE_OUT_START_GUARD_V2
  // 표시언어와 무관하게 객실상태 코드 DUE_OUT만 청소시작을 비활성화합니다.
  // STOCK/STOCK_RC/STOCK_HU/CHECKED_OUT 및 기존 허용상태는 그대로 유지합니다.
  function roommaidDueOutGuardStatus_(card) {
    const status = String(card?.dataset?.roomStatus || '').trim().toUpperCase();
    return status === 'DUE_OUT';
  }

  function syncRoommaidDueOutStartGuard_(root) {
    const scope = root && typeof root.querySelectorAll === 'function' ? root : document;
    scope.querySelectorAll('.mobile-room-card').forEach(card => {
      const startButton = card.querySelector('button[data-room-action="START"]');
      if (!startButton) return;
      const dueOut = roommaidDueOutGuardStatus_(card);
      if (dueOut) {
        startButton.hidden = false;
        startButton.disabled = true;
        startButton.dataset.dueOutStartGuard = 'Y';
        startButton.setAttribute('aria-disabled', 'true');
        startButton.setAttribute('title', '퇴실 확인 후 청소를 시작할 수 있습니다.');
      } else if (startButton.dataset.dueOutStartGuard === 'Y') {
        startButton.hidden = false;
        startButton.disabled = false;
        delete startButton.dataset.dueOutStartGuard;
        startButton.removeAttribute('aria-disabled');
        startButton.removeAttribute('title');
      }
    });
  }

  const observer = new MutationObserver(mutations => {
    let needsSync = false;
    for (const mutation of mutations) {
      if (mutation.type === 'childList' || mutation.type === 'characterData') {
        needsSync = true;
        break;
      }
    }
    if (needsSync) syncRoommaidDueOutStartGuard_(document.getElementById('mobileList') || document);
  });

  document.addEventListener('click', event => {
    const button = event.target?.closest?.('button[data-room-action="START"]');
    if (!button) return;
    const card = button.closest('.mobile-room-card');
    if (!card || !roommaidDueOutGuardStatus_(card)) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    button.hidden = false;
    button.disabled = true;
    button.dataset.dueOutStartGuard = 'Y';
    button.setAttribute('aria-disabled', 'true');
  }, true);

  if (document.documentElement) {
    observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  }
  syncRoommaidDueOutStartGuard_(document);
})();
</script>
