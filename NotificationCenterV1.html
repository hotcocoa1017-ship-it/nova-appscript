<style>
.nova-notification-wrap.nova-unified-active{display:inline-flex!important}.nova-notification-panel.nova-unified-panel{overflow:auto}.nova-unified-server{border-bottom:1px solid #e5e7eb}.nova-unified-head,.nova-unified-task-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#f8fafc;color:#475569;font-size:11px;font-weight:800}.nova-unified-actions{display:flex;gap:6px}.nova-unified-btn{min-height:28px;padding:0 8px;border:1px solid #dbe2ea;border-radius:7px;background:#fff;color:#334155;font-size:10px;font-weight:800}.nova-unified-list{max-height:260px;overflow:auto}.nova-unified-empty{padding:20px 14px;color:#64748b;font-size:11px;text-align:center}.nova-unified-item{position:relative;display:block;width:100%;padding:11px 13px 11px 17px;border:0;border-bottom:1px solid #f1f5f9;background:#fff;color:#111827;text-align:left}.nova-unified-item.unread{background:#f8fbff}.nova-unified-item.unread:before{content:'';position:absolute;left:7px;top:17px;width:6px;height:6px;border-radius:50%;background:#2563eb}.nova-unified-item.high:before{background:#dc2626}.nova-unified-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}.nova-unified-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900}.nova-unified-time{flex:0 0 auto;color:#94a3b8;font-size:10px}.nova-unified-body{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#475569;font-size:11px}.nova-unified-meta{display:block;margin-top:3px;color:#94a3b8;font-size:10px}.nova-notification-list{max-height:250px}.nova-unified-highlight{outline:3px solid rgba(37,99,235,.24)!important;outline-offset:2px;border-radius:10px}.nova-unified-toast{position:fixed;top:72px;right:14px;z-index:10080;width:min(360px,calc(100vw - 28px));padding:12px 14px;border:1px solid #dbe2ea;border-radius:12px;background:#fff;box-shadow:0 16px 38px rgba(15,23,42,.2);opacity:0;transform:translateY(-8px);transition:.16 </style>
<script>
(()=>{'use strict';
const U={auth:null,client:null,channel:null,employee:'',token:'',items:[],known:new Set(),unread:0,legacy:0,writing:false,badgeObs:null,badge:null,audio:null,audioReady:false,sound:localStorage.getItem('novaNotificationSound')!=='0',soundType:String(localStorage.getItem('novaNotificationSoundType')||'CHIME').toUpperCase(),soundVolume:Math.max(0,Math.min(100,Number(localStorage.getItem('novaNotificationSoundVolume')||70))),busy:false,authBusy:false,authTimer:null,pollTimer:null,toastTimer:null,pwaRouteDone:false};
const PWA_ORIGIN='https://nova-pwa-hotcocoa1017-3826.vercel.app'; // NOVA_PWA_WEB_PUSH_V2
const tok=()=>String(localStorage.getItem('novaToken')||'').trim();
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const logged=()=>{const m=document.getElementById('mainView');return!!(tok()&&m&&!m.classList.contains('hidden'))};
function call(method,...args){return new Promise((res,rej)=>{const r=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e?.message||String(e))));r[method](...args)})}
function claims(jwt){try{const p=String(jwt||'').split('.')[1]||'',b=p.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(p.length/4)*4,'='),raw=atob(b);return JSON.parse(new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0))))}catch(_){return{}}}
function shell(){const w=document.getElementById('novaNotificationWrap'),p=document.getElementById('novaNotificationPanel'),list=document.getElementById('novaNotificationList');if(!w||!p||!list)return false;w.classList.add('nova-unified-active');p.classList.add('nova-unified-panel');if(!document.getElementById('novaUnifiedServer')){const s=document.createElement('section');s.id='novaUnifiedServer';s.className='nova-unified-server';s.innerHTML=`<div class="nova-unified-head"><span>새 알림</span><div class="nova-unified-actions"><button id="novaUnifiedSound" class="nova-unified-btn" type="button">${U.sound?'🔊 알림음':'🔇 알림음'}</button><button id="novaUnifiedReadAll" class="nova-unified-btn" type="button">모두 읽음</button></div></div><div id="novaUnifiedList" class="nova-unified-list"><div class="nova-unified-empty">알림을 연결하고 있습니다.</div></div><div class="nova-unified-task-head"><span>현재 처리할 업무</span><span id="novaUnifiedTaskCount">0건</span></div>`;list.parentNode.insertBefore(s,list);document.getElementById('novaUnifiedSound').onclick=toggleSound;document.getElementById('novaUnifiedReadAll').onclick=readAll}wireBadge();return true}
function wireBadge(){const b=document.getElementById('novaNotificationBadge');if(!b||U.badge===b)return;U.badgeObs?.disconnect();U.badge=b;U.legacy=Number(String(b.textContent||'0').replace(/\D/g,''))||0;U.badgeObs=new MutationObserver(()=>{if(U.writing)return;const r=String(b.textContent||'0');U.legacy=r.includes('99+')?99:(Number(r.replace(/\D/g,''))||0);paintBadge()});U.badgeObs.observe(b,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});paintBadge()}
function paintBadge(){const b=document.getElementById('novaNotificationBadge');if(!b)return;document.getElementById('novaNotificationWrap')?.classList.add('nova-unified-active');const n=Math.max(0,U.legacy)+Math.max(0,U.unread);U.writing=true;b.textContent=n>99?'99+':String(n);b.classList.toggle('hidden',n<1);const c=document.getElementById('novaNotificationCountText');if(c)c.textContent=`새 알림 ${U.unread} · 업무 ${U.legacy}`;const t=document.getElementById('novaUnifiedTaskCount');if(t)t.textContent=`${U.legacy}건`;setTimeout(()=>U.writing=false,0);pushBridge()}
const ago=v=>{const ms=Date.now()-new Date(v||'').getTime();if(!Number.isFinite(ms))return'';const s=Math.max(0,ms/1000);return s<60?'방금':s<3600?`${Math.floor(s/60)}분 전`:s<86400?`${Math.floor(s/3600)}시간 전`:`${Math.floor(s/86400)}일 전`};
function render(){if(!shell())return;const root=document.getElementById('novaUnifiedList'),snd=document.getElementById('novaUnifiedSound');if(snd)snd.textContent=U.sound?'🔊 알림음':'🔇 알림음';if(!U.items.length){root.innerHTML='<div class="nova-unified-empty">새 알림이 없습니다.</div>';paintBadge();return}root.innerHTML=U.items.slice(0,30).map(x=>`<button class="nova-unified-item ${x.read_at?'':'unread'} ${String(x.priority||'').toUpperCase()==='HIGH'?'high':''}" type="button" data-nid="${esc(x.notification_id)}"><span class="nova-unified-top"><strong class="nova-unified-title">${esc(x.title||'NOVA 알림')}</strong><span class="nova-unified-time">${esc(ago(x.created_at))}</span></span><span class="nova-unified-body">${esc(x.body||'')}</span><span class="nova-unified-meta">${esc([x.site,x.room_no?`${x.room_no}호`:''].filter(Boolean).join(' · '))}</span></button>`).join('');root.querySelectorAll('[data-nid]').forEach(b=>b.onclick=()=>openItem(String(b.dataset.nid||'')));paintBadge()}
function pushBridge(){
  if(!U.auth||!U.employee||window.top===window)return;
  try{
    window.top.postMessage({
      type:'NOVA_PUSH_BRIDGE_V2',
      supabaseUrl:String(U.auth.supabaseUrl||''),
      publishableKey:String(U.auth.publishableKey||''),
      token:String(U.auth.token||''),
      employeeNo:String(U.employee||''),
      unread:Number(U.unread||0)
    },PWA_ORIGIN);
  }catch(_){ }
}
function applyPwaRoute(){
  if(U.pwaRouteDone)return;
  const p=window.__NOVA_PWA_ROUTE_V2__;
  if(!p||!String(p.route||''))return;
  U.pwaRouteDone=true;
  route({payload:p,room_no:String(p.roomNo||'')});
}
async function authBundle(){const nt=tok(),cfg=await call('getNovaRealtimeClientConfig',nt);if(!cfg?.ok||!cfg?.enabled||!cfg?.apiBase)throw new Error('알림 Realtime 설정 오류');const base=String(cfg.apiBase).replace(/\/+$/,''),r=await fetch(`${base}/v1/auth/realtime-token`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${nt}`},body:'{}'});let a={};try{a=await r.json()}catch(_){}if(!r.ok||!a?.token||!a?.supabaseUrl||!a?.publishableKey)throw new Error(a?.message||`알림 인증 실패 (${r.status})`);const emp=String(claims(a.token)?.employee_no||'').trim();if(!emp)throw new Error('알림 사용자 식별 실패');return{...a,employee:emp}}
async function rest(path,opt={}){if(!U.auth)throw new Error('알림 인증 없음');const r=await fetch(`${String(U.auth.supabaseUrl).replace(/\/+$/,'')}/rest/v1/${path}`,{method:opt.method||'GET',headers:Object.assign({'apikey':U.auth.publishableKey,'Authorization':`Bearer ${U.auth.token}`,'Content-Type':'application/json'},opt.headers||{}),body:opt.body});if(!r.ok){const e=new Error(`알림 API 오류 (${r.status})`);e.status=r.status;throw e}return r}
async function load(pop=false){if(!U.auth||U.busy)return;U.busy=true;try{const r=await rest('nova_notifications?select=notification_id,kind,title,body,site,room_no,entity_type,entity_id,priority,payload,created_at,read_at&order=created_at.desc&limit=50'),rows=await r.json(),next=Array.isArray(rows)?rows:[],fresh=next.filter(x=>!x.read_at&&!U.known.has(String(x.notification_id)));U.items=next;U.unread=next.filter(x=>!x.read_at).length;next.forEach(x=>U.known.add(String(x.notification_id)));render();if(pop&&fresh.length){sound();toast(fresh[0])}}catch(e){console.warn('[NOVA Notification] load',e);if(e?.status===401)void disconnect(false).then(()=>setTimeout(connect,500))}finally{U.busy=false}}
async function readOne(id){const x=U.items.find(v=>String(v.notification_id)===id);if(!x||x.read_at)return;x.read_at=new Date().toISOString();U.unread=Math.max(0,U.unread-1);render();try{await rest(`nova_notifications?notification_id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({read_at:x.read_at})})}catch(e){console.warn('[NOVA Notification] read',e);void load(false)}}
async function readAll(){unlock();if(!U.auth||!U.unread)return;const at=new Date().toISOString();U.items.forEach(x=>{if(!x.read_at)x.read_at=at});U.unread=0;render();try{await rest('nova_notifications?read_at=is.null',{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({read_at:at})})}catch(e){console.warn('[NOVA Notification] read all',e);void load(false)}}
async function openItem(id){unlock();const x=U.items.find(v=>String(v.notification_id)===id);if(!x)return;await readOne(id);document.getElementById('novaNotificationPanel')?.classList.add('hidden');route(x)}
function route(x){const p=x?.payload&&typeof x.payload==='object'?x.payload:{},r=String(p.route||''),buttons=[...document.querySelectorAll('#menu button')];if(r==='archive'){const settings=buttons.find(b=>String(b.textContent||'').trim()==='설정');if(settings&&!settings.classList.contains('active'))settings.click();setTimeout(()=>document.querySelector('[data-settings-tab=\"archive\"]')?.click(),120);return}const map={cleaning:['오늘의 정비','룸메이드'],qm:['QM 점검'],houseman:['하우스맨 오더','하우스맨'],indicator:['통합 인디케이터']},labels=map[r]||[],btn=buttons.find(b=>labels.some(l=>String(b.textContent||'').includes(l)));if(btn&&!btn.classList.contains('active'))btn.click();const room=String(p.roomNo||x.room_no||''),entity=String(p.orderId||x.entity_id||'');setTimeout(()=>focus(room,entity),700);setTimeout(()=>focus(room,entity),1400)}
function focus(room,entity){let el=entity?[...document.querySelectorAll('[data-mobile-order-id],[data-order-id]')].find(e=>String(e.dataset.mobileOrderId||e.dataset.orderId||'')===entity):null;if(!el&&room)el=[...document.querySelectorAll('.mobile-room-card,.mobile-task-card,.order-mini-row,[data-room-no]')].find(e=>String(e.dataset.roomNo||e.querySelector?.('.mobile-card-top strong,.order-room')?.textContent||e.textContent||'').includes(room));if(!el)return;el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('nova-unified-highlight');setTimeout(()=>el.classList.remove('nova-unified-highlight'),2400)}
function unlock(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return Promise.resolve(false);try{U.audio=U.audio||new C();if(U.audio.state==='running'){U.audioReady=true;return Promise.resolve(true)}return Promise.resolve(U.audio.resume()).then(()=>{U.audioReady=U.audio?.state==='running';return U.audioReady}).catch(e=>{U.audioReady=false;console.warn('[NOVA Notification] audio unlock',e);return false})}catch(e){U.audioReady=false;console.warn('[NOVA Notification] audio init',e);return Promise.resolve(false)}}
function normalizeSoundPrefs(p={}){const type=String(p.soundType||U.soundType||'CHIME').toUpperCase();return{soundEnabled:p.soundEnabled==null?U.sound:p.soundEnabled!==false,soundType:['CHIME','BELL','DOUBLE','ALERT'].includes(type)?type:'CHIME',volume:Math.max(0,Math.min(100,Number(p.volume??U.soundVolume??70)))}}
function applySoundPrefs(p={}){const n=normalizeSoundPrefs(p);U.sound=n.soundEnabled;U.soundType=n.soundType;U.soundVolume=n.volume;localStorage.setItem('novaNotificationSound',U.sound?'1':'0');localStorage.setItem('novaNotificationSoundType',U.soundType);localStorage.setItem('novaNotificationSoundVolume',String(U.soundVolume));render();return n}
async function loadSoundPrefs(){try{const r=await call('getNovaNotificationPreferences',tok());if(r?.ok)applySoundPrefs(r)}catch(e){console.warn('[NOVA Notification] preference load',e)}}
function tonePattern(type){if(type==='BELL')return[[880,0,.34,'sine'],[1320,.02,.42,'sine']];if(type==='DOUBLE')return[[740,0,.18,'triangle'],[980,.16,.22,'triangle']];if(type==='ALERT')return[[880,0,.16,'square'],[880,.20,.16,'square'],[1175,.40,.24,'square']];return[[659,0,.18,'sine'],[880,.13,.22,'sine'],[1047,.29,.28,'sine']]}
function playSoundPrefs(p,force=false){const n=normalizeSoundPrefs(p);if((!n.soundEnabled&&!force)||!U.audioReady||!U.audio||n.volume<=0)return;try{const now=U.audio.currentTime,peak=Math.max(.008,Math.min(.36,(n.volume/100)*.36));tonePattern(n.soundType).forEach(([f,d,len,type])=>{const o=U.audio.createOscillator(),g=U.audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,now+d);g.gain.exponentialRampToValueAtTime(peak,now+d+.025);g.gain.exponentialRampToValueAtTime(.0001,now+d+len);o.connect(g);g.connect(U.audio.destination);o.start(now+d);o.stop(now+d+len+.03)})}catch(_){}}
function sound(){playSoundPrefs({soundEnabled:U.sound,soundType:U.soundType,volume:U.soundVolume})}
async function toggleSound(){await unlock();U.sound=!U.sound;const prefs=applySoundPrefs({soundEnabled:U.sound,soundType:U.soundType,volume:U.soundVolume});void call('saveNovaNotificationPreferences',tok(),prefs).catch(e=>console.warn('[NOVA Notification] preference save',e));if(U.sound)sound()}
window.NOVA_NOTIFICATION_PREFS_V2={get:()=>normalizeSoundPrefs({soundEnabled:U.sound,soundType:U.soundType,volume:U.soundVolume}),apply:p=>applySoundPrefs(p),preview:async p=>{const ready=await unlock();if(!ready)throw new Error('기기에서 오디오 재생을 시작할 수 없습니다. 미디어 음량과 브라우저 소리 권한을 확인해 주세요.');playSoundPrefs(p,true);return true}}; // NOVA_PERSONAL_NOTIFICATION_SETTINGS_V2 NOVA_NOTIFICATION_PREVIEW_AUDIO_UNLOCK_V1
function toast(x){let t=document.getElementById('novaUnifiedToast');if(!t){t=document.createElement('div');t.id='novaUnifiedToast';t.className='nova-unified-toast';document.body.appendChild(t)}t.innerHTML=`<strong>${esc(x.title||'NOVA 알림')}</strong><span>${esc(x.body||'')}</span>`;clearTimeout(U.toastTimer);requestAnimationFrame(()=>t.classList.add('show'));U.toastTimer=setTimeout(()=>t.classList.remove('show'),4200)}
async function connect(){const nt=tok();if(!logged()||!nt||U.authBusy)return;if(U.token===nt&&U.auth&&U.channel){shell();pushBridge();return}U.authBusy=true;try{await disconnect(false);const a=await authBundle();if(tok()!==nt)return;U.token=nt;U.auth=a;U.employee=a.employee;await loadSoundPrefs();pushBridge();setTimeout(pushBridge,700);setTimeout(pushBridge,2200);U.client=window.supabase?.createClient?.(a.supabaseUrl,a.publishableKey,{auth:{persistSession:false,autoRefreshToken:false}})||null;/* NOVA_PWA_BRIDGE_LOGIN_RESILIENCE_V1 */if(U.client){await U.client.realtime.setAuth(a.token);const topic=`nova:user:${a.employee}:notifications`;U.channel=U.client.channel(topic,{config:{private:true}}).on('broadcast',{event:'NOTIFICATION'},()=>void load(true)).subscribe(s=>{if(s==='SUBSCRIBED')void load(false);if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(String(s||'').toUpperCase())){const c=U.channel;U.channel=null;if(U.client&&c)void U.client.removeChannel(c).catch(()=>{});setTimeout(connect,1800)}})}await load(false);applyPwaRoute();scheduleAuth();schedulePoll()}catch(e){console.warn('[NOVA Notification] connect',e);setTimeout(connect,2500)}finally{U.authBusy=false}}
async function renew(){if(!logged())return;try{const a=await authBundle();if(a.employee!==U.employee)return connect();U.auth=a;if(U.client)await U.client.realtime.setAuth(a.token);pushBridge();scheduleAuth()}catch(e){console.warn('[NOVA Notification] renew',e);setTimeout(renew,3000)}}
function scheduleAuth(){clearTimeout(U.authTimer);U.authTimer=setTimeout(renew,9*60*1000)}function schedulePoll(){clearTimeout(U.pollTimer);U.pollTimer=setTimeout(async()=>{if(logged())await load(false);schedulePoll()},45000)}
async function disconnect(clear=true){clearTimeout(U.authTimer);clearTimeout(U.pollTimer);if(U.client&&U.channel)try{await U.client.removeChannel(U.channel)}catch(_){}U.client=null;U.channel=null;U.auth=null;if(clear){U.token='';U.employee='';U.items=[];U.unread=0;U.known.clear();render()}}
function life(){if(logged()){shell();void connect()}else if(U.token||U.auth)void disconnect(true)}
function start(){document.addEventListener('pointerdown',unlock,{passive:true});document.addEventListener('keydown',unlock,{passive:true});setInterval(life,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&logged()){shell();void load(false);void connect()}});window.addEventListener('focus',()=>{if(logged())void load(false)});life();console.info('[NOVA_NOTIFICATION_CENTER_V1] ready')}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
