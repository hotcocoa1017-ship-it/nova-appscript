<style>
  /* 룸메이드 하우스맨 요청 사진 모듈 */
  .nova-hm-photo-field {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #f8fafc;
  }
  .nova-hm-photo-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: 800;
    color: #111827;
  }
  .nova-hm-photo-title small {
    font-size: 11px;
    font-weight: 700;
    color: #6b7280;
  }
  .nova-hm-photo-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .nova-hm-photo-camera {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 0 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    color: #111827;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    user-select: none;
  }
  .nova-hm-photo-camera:active { background: #f3f4f6; }
  .nova-hm-photo-camera.disabled {
    cursor: default;
    background: #f3f4f6;
    color: #9ca3af;
    border-color: #e5e7eb;
  }
  .nova-hm-photo-input {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }
  .nova-hm-photo-status {
    margin-top: 8px;
    font-size: 11px;
    line-height: 1.45;
    color: #6b7280;
  }
  .nova-hm-photo-status.error { color: #b91c1c; }
  .nova-hm-photo-status.success { color: #166534; }
  .nova-hm-photo-preview-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .nova-hm-photo-preview-list:empty { display: none; }
  .nova-hm-photo-preview-item {
    position: relative;
    overflow: hidden;
    min-width: 0;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    background: #fff;
  }
  .nova-hm-photo-preview-item img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    background: #111;
  }
  .nova-hm-photo-preview-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 7px 8px;
    color: #4b5563;
    font-size: 10px;
    font-weight: 700;
  }
  .nova-hm-photo-preview-remove {
    min-width: 46px;
    min-height: 28px;
    padding: 0 8px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
    color: #b91c1c;
    font-size: 10px;
    font-weight: 800;
  }
  .nova-hm-photo-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 100000;
    transform: translateX(-50%);
    width: min(92vw, 520px);
    padding: 11px 14px;
    border-radius: 10px;
    background: #111827;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.45;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
  }
  .nova-hm-photo-toast.error { background: #991b1b; }
  @media (max-width: 760px) {
    .nova-hm-photo-actions { display: grid; grid-template-columns: 1fr; }
    .nova-hm-photo-camera { width: 100%; min-height: 46px; }
    .nova-hm-photo-preview-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
<script>
(() => {
  'use strict';

  const PHOTO_FIELD_ID = 'novaHmRequestPhotoField';
  const PHOTO_INPUT_ID = 'novaHmRequestPhotoInput';
  const PHOTO_CAMERA_ID = 'novaHmRequestPhotoCamera';
  const PHOTO_COUNT_ID = 'novaHmRequestPhotoCount';
  const PHOTO_STATUS_ID = 'novaHmRequestPhotoStatus';
  const PHOTO_PREVIEW_LIST_ID = 'novaHmRequestPhotoPreviewList';
  const PHOTO_RESUME_KEY = 'novaHmRequestPhotoResume';
  const PHOTO_RESUME_TTL_MS = 5 * 60 * 1000;
  const MAX_PHOTO_BYTES = 2500000;
  const DEFAULT_MAX_PHOTOS_PER_ORDER = 5;

  let activeRoomNo = '';
  let activeRequestMenu = 'cleaning'; // PUBLIC_HOUSEMAN_REQUEST_V1
  let photoSelectionActive = false;
  let preparedPhotos = [];
  let photoPrepareError = null;
  let photoPreparePromise = Promise.resolve([]);
  let photoSequence = 0;
  let maxPhotosAllowed = DEFAULT_MAX_PHOTOS_PER_ORDER;
  let capabilityToken = '';
  let capabilityPromise = null;
  let toastTimer = null;
  let nativeCapturePending = false;
  let nativeCaptureReturnTimer = null;

  document.addEventListener('click', handleHousemanPhotoClickCapture_, true); // (룸메이드 요청사진 클릭 선처리)
  document.addEventListener('visibilitychange', handleHousemanPhotoVisibilityChange_); // (기기 카메라 취소·복귀 감지)
  window.setTimeout(restoreHousemanPhotoRequestAfterReload_, 250); // (카메라 중 페이지 재생성 시 요청창 복원)

  function handleHousemanPhotoClickCapture_(event) { // (하우스맨 요청 열기·사진 포함 제출 가로채기)
    const requestButton = event.target && event.target.closest ? event.target.closest('[data-houseman-request]') : null;
    if (requestButton) {
      activeRoomNo = String(requestButton.dataset.housemanRequest || '').trim();
      activeRequestMenu = String(requestButton.dataset.housemanRequestMenu || 'cleaning').trim() || 'cleaning'; // PUBLIC_HOUSEMAN_REQUEST_V1
      resetHousemanPhotoSelection_();
      window.setTimeout(() => prepareHousemanPhotoUi_(activeRoomNo), 0);
      return;
    }

    const submitButton = event.target && event.target.closest ? event.target.closest('#mobileRequestSubmit') : null;
    if (!submitButton || !photoSelectionActive) return; // 사진이 없으면 기존 Client 제출 흐름을 100% 유지

    event.preventDefault();
    event.stopImmediatePropagation();
    submitHousemanRequestWithPhotos_(submitButton).catch(error => {
      setHousemanPhotoStatus_(error && error.message ? error.message : '요청을 처리하지 못했습니다.', 'error');
      showHousemanPhotoToast_(error && error.message ? error.message : '요청을 처리하지 못했습니다.', true);
      restoreHousemanPhotoSubmitButton_(submitButton);
    });
  }

  async function prepareHousemanPhotoUi_(roomNo) { // (룸메이드 요청 모달에 사진 UI 지연 삽입)
    if (!roomNo || activeRoomNo !== roomNo) return;
    const submit = document.getElementById('mobileRequestSubmit');
    const part = document.getElementById('mobileRequestPart');
    const item = document.getElementById('mobileRequestItem');
    if (!submit || !part || !item || document.getElementById(PHOTO_FIELD_ID)) return;

    const token = String(localStorage.getItem('novaToken') || '').trim();
    if (!token) return;
    const capability = await getHousemanPhotoCapability_(token).catch(() => null);
    if (!capability || !capability.ok || capability.enabled !== true || activeRoomNo !== roomNo) return;
    if (!document.getElementById('mobileRequestSubmit') || document.getElementById(PHOTO_FIELD_ID)) return;

    maxPhotosAllowed = Math.max(1, Math.min(
      DEFAULT_MAX_PHOTOS_PER_ORDER,
      Number(capability.maxPhotos || DEFAULT_MAX_PHOTOS_PER_ORDER)
    ));

    const field = document.createElement('div');
    field.id = PHOTO_FIELD_ID;
    field.className = 'nova-hm-photo-field';
    field.innerHTML = `
      <div class="nova-hm-photo-title">
        <span>요청 사진</span>
        <small id="${PHOTO_COUNT_ID}">0/${maxPhotosAllowed}장</small>
      </div>
      <div class="nova-hm-photo-actions">
        <button id="${PHOTO_CAMERA_ID}" class="nova-hm-photo-camera" type="button">사진 촬영</button>
        <input id="${PHOTO_INPUT_ID}" class="nova-hm-photo-input" type="file" accept="image/*" capture="environment">
      </div>
      <div id="${PHOTO_STATUS_ID}" class="nova-hm-photo-status">사진은 선택사항이며 최대 ${maxPhotosAllowed}장까지 등록할 수 있습니다.</div>
      <div id="${PHOTO_PREVIEW_LIST_ID}" class="nova-hm-photo-preview-list"></div>`;

    const modalActions = submit.closest('.modal-actions');
    if (modalActions && modalActions.parentNode) modalActions.parentNode.insertBefore(field, modalActions);
    else if (submit.parentNode) submit.parentNode.insertBefore(field, submit);

    const input = document.getElementById(PHOTO_INPUT_ID);
    const camera = document.getElementById(PHOTO_CAMERA_ID);
    const previewList = document.getElementById(PHOTO_PREVIEW_LIST_ID);
    if (input) input.addEventListener('change', handleHousemanPhotoSelection_);
    if (camera) camera.addEventListener('click', handleHousemanPhotoCameraClick_);
    if (previewList) previewList.addEventListener('click', handleHousemanPhotoRemoveClick_);
    renderHousemanPhotoPreviews_();
  }

  function readHousemanPhotoResumeContext_() { // (카메라 복귀용 임시 요청내용 조회)
    try {
      const context = JSON.parse(localStorage.getItem(PHOTO_RESUME_KEY) || 'null');
      if (!context || !context.roomNo || !Number(context.savedAt || 0)) return null;
      if (Date.now() - Number(context.savedAt || 0) > PHOTO_RESUME_TTL_MS) {
        localStorage.removeItem(PHOTO_RESUME_KEY);
        return null;
      }
      return context;
    } catch (ignore) {
      localStorage.removeItem(PHOTO_RESUME_KEY);
      return null;
    }
  }

  function persistHousemanPhotoResumeContext_() { // (기기 카메라 실행 직전 요청화면·입력값 보존)
    if (!activeRoomNo) return;
    const context = {
      savedAt: Date.now(),
      roomNo: activeRoomNo,
      menu: activeRequestMenu, // PUBLIC_HOUSEMAN_REQUEST_V1
      part: String(document.getElementById('mobileRequestPart')?.value || ''),
      item: String(document.getElementById('mobileRequestItem')?.value || ''),
      quantity: String(document.getElementById('mobileRequestQty')?.value || '1'),
      note: String(document.getElementById('mobileRequestNote')?.value || ''),
      businessDate: String(document.getElementById('mobileDate')?.value || ''),
      site: String(document.getElementById('mobileSite')?.value || '')
    };
    try {
      localStorage.setItem(PHOTO_RESUME_KEY, JSON.stringify(context));
      sessionStorage.setItem('novaActiveMenu', activeRequestMenu || 'cleaning'); // PUBLIC_HOUSEMAN_REQUEST_V1
    } catch (ignore) {}
  }

  function clearHousemanPhotoResumeContext_() { // (카메라 복귀 임시정보 정리)
    try { localStorage.removeItem(PHOTO_RESUME_KEY); } catch (ignore) {}
  }

  function handleHousemanPhotoCameraClick_(event) { // (요청내용 보존 후 기기 후면카메라 실행)
    event.preventDefault();
    const camera = event.currentTarget;
    if (!camera || camera.classList.contains('disabled') || camera.getAttribute('aria-disabled') === 'true') return;
    const input = document.getElementById(PHOTO_INPUT_ID);
    if (!input || input.disabled) return;
    persistHousemanPhotoResumeContext_();
    nativeCapturePending = true;
    input.click();
  }

  function handleHousemanPhotoVisibilityChange_() { // (사진촬영 취소 시 오래된 복원정보 제거)
    if (document.hidden || !nativeCapturePending) return;
    if (nativeCaptureReturnTimer) window.clearTimeout(nativeCaptureReturnTimer);
    nativeCaptureReturnTimer = window.setTimeout(() => {
      if (!nativeCapturePending) return;
      const input = document.getElementById(PHOTO_INPUT_ID);
      if (!input || !input.files || !input.files.length) {
        nativeCapturePending = false;
        clearHousemanPhotoResumeContext_();
      }
    }, 1400);
  }

  function restoreHousemanPhotoRequestAfterReload_() { // (카메라 복귀 중 WebView 재생성 시 같은 요청창 자동 복원)
    const context = readHousemanPhotoResumeContext_();
    if (!context) return;
    activeRequestMenu = String(context.menu || 'cleaning').trim() || 'cleaning'; // PUBLIC_HOUSEMAN_REQUEST_V1
    try { sessionStorage.setItem('novaActiveMenu', activeRequestMenu); } catch (ignore) {}
    const startedAt = Date.now();

    const tryRestore = () => {
      if (Date.now() - startedAt > 20000) {
        clearHousemanPhotoResumeContext_();
        return;
      }

      let submit = document.getElementById('mobileRequestSubmit');
      if (!submit) {
        const requestButton = Array.from(document.querySelectorAll('[data-houseman-request]'))
          .find(button => String(button.dataset.housemanRequest || '').trim() === String(context.roomNo || '').trim());
        if (requestButton) {
          requestButton.click();
          window.setTimeout(tryRestore, 160);
          return;
        }
        window.setTimeout(tryRestore, 260);
        return;
      }

      activeRoomNo = String(context.roomNo || '').trim();
      const part = document.getElementById('mobileRequestPart');
      const item = document.getElementById('mobileRequestItem');
      const quantity = document.getElementById('mobileRequestQty');
      const note = document.getElementById('mobileRequestNote');
      if (part && context.part) part.value = String(context.part);
      if (item) item.value = String(context.item || '');
      if (quantity) quantity.value = String(context.quantity || '1');
      if (note) note.value = String(context.note || '');

      Promise.resolve(prepareHousemanPhotoUi_(activeRoomNo)).finally(() => {
        window.setTimeout(() => {
          setHousemanPhotoStatus_('카메라 복귀 후 요청내용을 복원했습니다. 사진을 다시 촬영해 주세요.', '');
        }, 80);
      });
      clearHousemanPhotoResumeContext_();
    };

    tryRestore();
  }

  function getHousemanPhotoCapability_(token) { // (현재 토큰의 룸메이드 사진기능 권한 조회·세션 캐시)
    if (capabilityPromise && capabilityToken === token) return capabilityPromise;
    capabilityToken = token;
    capabilityPromise = callHousemanPhotoCapabilityServer_(token).then(result => result || { ok: false, enabled: false });
    return capabilityPromise;
  }

  async function handleHousemanPhotoSelection_(event) { // (촬영 사진을 최대 5장까지 순차 압축·추가)
    const input = event.currentTarget;
    const file = input && input.files && input.files[0];
    nativeCapturePending = false;
    if (nativeCaptureReturnTimer) window.clearTimeout(nativeCaptureReturnTimer);
    nativeCaptureReturnTimer = null;
    if (input) input.value = ''; // 같은 사진을 다시 선택해도 change가 동작하도록 초기화
    if (!file) {
      clearHousemanPhotoResumeContext_();
      return;
    }

    if (preparedPhotos.length >= maxPhotosAllowed) {
      setHousemanPhotoStatus_(`사진은 최대 ${maxPhotosAllowed}장까지 등록할 수 있습니다.`, 'error');
      renderHousemanPhotoPreviews_();
      return;
    }

    photoSelectionActive = true;
    photoPrepareError = null;
    setHousemanPhotoStatus_(`사진을 준비하고 있습니다. · ${preparedPhotos.length}/${maxPhotosAllowed}장`, '');

    const previousPrepare = photoPreparePromise;
    photoPreparePromise = previousPrepare
      .then(async () => {
        if (preparedPhotos.length >= maxPhotosAllowed) return preparedPhotos.slice();
        const photo = await compressHousemanRequestPhoto_(file);
        photoSequence += 1;
        preparedPhotos.push(Object.assign({}, photo, { localId: `hmphoto_${Date.now()}_${photoSequence}` }));
        photoPrepareError = null;
        renderHousemanPhotoPreviews_();
        const totalKb = Math.max(1, Math.round(preparedPhotos.reduce((sum, item) => sum + Number(item.byteSize || 0), 0) / 1024));
        setHousemanPhotoStatus_(`${preparedPhotos.length}장 준비 완료 · 총 약 ${totalKb.toLocaleString('ko-KR')}KB`, 'success');
        return preparedPhotos.slice();
      })
      .catch(error => {
        photoPrepareError = error instanceof Error ? error : new Error(String(error || '사진 준비 오류'));
        setHousemanPhotoStatus_(photoPrepareError.message, 'error');
        renderHousemanPhotoPreviews_();
        return preparedPhotos.slice();
      });

    await photoPreparePromise;
    clearHousemanPhotoResumeContext_();
  }

  function handleHousemanPhotoRemoveClick_(event) { // (선택 사진 개별 삭제)
    const button = event.target && event.target.closest ? event.target.closest('[data-hm-photo-remove]') : null;
    if (!button) return;
    const localId = String(button.dataset.hmPhotoRemove || '').trim();
    if (!localId) return;
    preparedPhotos = preparedPhotos.filter(photo => photo.localId !== localId);
    photoSelectionActive = preparedPhotos.length > 0;
    photoPrepareError = null;
    renderHousemanPhotoPreviews_();
    if (preparedPhotos.length) {
      setHousemanPhotoStatus_(`${preparedPhotos.length}장 준비 완료 · 최대 ${maxPhotosAllowed}장`, 'success');
    } else {
      setHousemanPhotoStatus_(`사진은 선택사항이며 최대 ${maxPhotosAllowed}장까지 등록할 수 있습니다.`, '');
    }
  }

  function renderHousemanPhotoPreviews_() { // (사진 개수·미리보기·추가촬영 상태 갱신)
    const list = document.getElementById(PHOTO_PREVIEW_LIST_ID);
    const input = document.getElementById(PHOTO_INPUT_ID);
    const camera = document.getElementById(PHOTO_CAMERA_ID);
    const count = document.getElementById(PHOTO_COUNT_ID);
    const atLimit = preparedPhotos.length >= maxPhotosAllowed;

    if (count) count.textContent = `${preparedPhotos.length}/${maxPhotosAllowed}장`;
    if (input) input.disabled = atLimit;
    if (camera) {
      camera.classList.toggle('disabled', atLimit);
      camera.textContent = atLimit ? `최대 ${maxPhotosAllowed}장 선택됨` : (preparedPhotos.length ? '사진 추가 촬영' : '사진 촬영');
      camera.setAttribute('aria-disabled', atLimit ? 'true' : 'false');
    }
    if (!list) return;

    list.innerHTML = preparedPhotos.map((photo, index) => {
      const kb = Math.max(1, Math.round(Number(photo.byteSize || 0) / 1024));
      return `
        <div class="nova-hm-photo-preview-item">
          <img src="data:image/jpeg;base64,${photo.base64}" alt="요청 사진 ${index + 1}">
          <div class="nova-hm-photo-preview-meta">
            <span>사진 ${index + 1} · ${kb.toLocaleString('ko-KR')}KB</span>
            <button class="nova-hm-photo-preview-remove" type="button" data-hm-photo-remove="${photo.localId}">삭제</button>
          </div>
        </div>`;
    }).join('');
  }

  async function submitHousemanRequestWithPhotos_(button) { // (Realtime 오더 즉시확정 후 사진은 후행 저장)
    if (!activeRoomNo) throw new Error('요청 객실번호를 확인하지 못했습니다. 요청창을 닫고 다시 열어 주세요.');
    const token = String(localStorage.getItem('novaToken') || '').trim();
    if (!token) throw new Error('로그인 정보가 없습니다. 다시 로그인해 주세요.');

    const partEl = document.getElementById('mobileRequestPart');
    const itemEl = document.getElementById('mobileRequestItem');
    const qtyEl = document.getElementById('mobileRequestQty');
    const noteEl = document.getElementById('mobileRequestNote');
    const dateEl = document.getElementById('mobileDate');
    const siteEl = document.getElementById('mobileSite');
    const part = String(partEl && partEl.value || '').trim();
    const item = String(itemEl && itemEl.value || '').trim();
    const businessDate = String(dateEl && dateEl.value || '').trim();
    const site = String(siteEl && siteEl.value || '').trim();
    if (!part || !item) throw new Error('파트와 품목을 입력하세요.');
    if (!businessDate) throw new Error('업무일자를 확인하지 못했습니다.');

    setHousemanPhotoSubmitBusy_(button, true, '사진 준비 중…');
    await photoPreparePromise;
    const photos = preparedPhotos.slice();
    if (!photos.length) {
      if (photoPrepareError) throw photoPrepareError;
      throw new Error('사진을 다시 촬영하거나 선택해 주세요.');
    }
    if (photos.length > maxPhotosAllowed) throw new Error(`사진은 최대 ${maxPhotosAllowed}장까지 등록할 수 있습니다.`);

    const createPayload = {
      businessDate,
      site,
      roomNo: activeRoomNo,
      part,
      items: [{ name: item, quantity: clampHousemanPhotoQuantity_(qtyEl && qtyEl.value) }],
      note: String(noteEl && noteEl.value || '').trim(),
      sourceLanguage: String(window.NOVA_I18N?.getLanguage?.() || 'ko').toLowerCase() // NOVA_I18N_V1 · 사진 오더 원문언어
    };
    setHousemanPhotoSubmitBusy_(button, true, '요청 등록 중…');
    const fastCreate = typeof window.novaCreateRoommaidHousemanRequestFast_ === 'function'
      ? window.novaCreateRoommaidHousemanRequestFast_
      : null;
    const createResult = fastCreate
      ? await fastCreate(createPayload)
      : await callCreateMobileHousemanRequestServer_(token, createPayload);
    if (!createResult || !createResult.ok) {
      throw new Error(createResult && createResult.message ? createResult.message : '하우스맨 요청을 등록하지 못했습니다.');
    }

    const order = createResult.order || {};
    const orderId = String(order.orderId || '').trim();
    if (!orderId) throw new Error('사진 연결용 요청번호를 확인하지 못했습니다.');

    // 오더 등록 반응은 DB 확정 시점에서 끝내고, 기존 Sheet/사진 저장은 사용자 대기와 분리한다.
    closeHousemanPhotoModal_();
    showHousemanPhotoToast_(`하우스맨 요청 등록 완료 · 사진 ${photos.length}장 저장 중…`, false);

    let mirrorResult = createResult;
    if (createResult.mirrorPromise && typeof createResult.mirrorPromise.then === 'function') {
      try {
        mirrorResult = await createResult.mirrorPromise;
      } catch (error) {
        showHousemanPhotoToast_(`요청은 등록되었습니다. 사진 저장 준비 오류 · ${error?.message || '이력 동기화 실패'}`, true);
        return;
      }
    }
    if (!mirrorResult?.ok) {
      showHousemanPhotoToast_('요청은 등록되었습니다. 사진 저장 준비에 실패했습니다.', true);
      return;
    }

    const sheetOrder = mirrorResult.order || order;
    let savedCount = 0;
    const failedMessages = [];
    for (let index = 0; index < photos.length; index += 1) {
      const photo = photos[index];
      try {
        const uploadResult = await callUploadHousemanRequestPhotoServer_(token, {
          orderId,
          rowNumber: Number(sheetOrder.rowNumber || 0),
          fileName: `${String(index + 1).padStart(2, '0')}_${photo.fileName}`,
          mimeType: photo.mimeType,
          base64: photo.base64
        });
        if (uploadResult && uploadResult.ok) savedCount += 1;
        else failedMessages.push(uploadResult && uploadResult.message ? uploadResult.message : `사진 ${index + 1} 저장 오류`);
      } catch (error) {
        failedMessages.push(error && error.message ? error.message : `사진 ${index + 1} 저장 오류`);
      }
    }

    if (savedCount !== photos.length) {
      showHousemanPhotoToast_(`하우스맨 요청 등록완료 · 사진 ${savedCount}/${photos.length}장 저장${failedMessages.length ? ` · ${failedMessages[0]}` : ''}`, true);
      return;
    }
    showHousemanPhotoToast_(`하우스맨 요청과 사진 ${savedCount}장을 저장했습니다.`, false);
  }

  function callHousemanPhotoCapabilityServer_(token) { // (사진기능 권한 서버 호출)
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error && error.message ? error.message : '사진기능 확인 오류')))
        .getMobileHousemanRequestPhotoCapability(token);
    });
  }

  function callCreateMobileHousemanRequestServer_(token, payload) { // (기존 모바일 하우스맨 요청 API 직접 호출)
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error && error.message ? error.message : '하우스맨 요청 등록 오류')))
        .createMobileHousemanRequest(token, payload);
    });
  }

  function callUploadHousemanRequestPhotoServer_(token, payload) { // (요청사진 서버 저장 호출)
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error && error.message ? error.message : '요청사진 저장 오류')))
        .uploadMobileHousemanRequestPhoto(token, payload);
    });
  }

  async function compressHousemanRequestPhoto_(file) { // (요청사진 1600px JPEG 압축·원본 Base64 복제 방지)
    if (!file || !String(file.type || '').startsWith('image/')) throw new Error('이미지 파일만 등록할 수 있습니다.');
    if (!window.URL || typeof window.URL.createObjectURL !== 'function') throw new Error('현재 브라우저에서 사진을 처리할 수 없습니다.');

    const objectUrl = window.URL.createObjectURL(file);
    let image = null;
    let canvas = null;
    try {
      image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.decoding = 'async';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('지원하지 않는 사진 형식입니다.'));
        img.src = objectUrl;
      });
      const max = 1600;
      const scale = Math.min(1, max / Math.max(image.naturalWidth, image.naturalHeight));
      canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) throw new Error('사진 압축을 시작하지 못했습니다.');
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      const compressed = canvas.toDataURL('image/jpeg', 0.78);
      const base64 = compressed.split(',')[1] || '';
      const byteSize = Math.ceil(base64.length * 0.75);
      if (!base64 || byteSize > MAX_PHOTO_BYTES) throw new Error('사진 용량이 큽니다. 더 낮은 해상도로 촬영해 주세요.');
      const sourceName = String(file.name || 'houseman-request').replace(/\.[^.]+$/, '') || 'houseman-request';
      return { fileName: `${sourceName}.jpg`, mimeType: 'image/jpeg', base64, byteSize };
    } finally {
      try { if (image) image.src = ''; } catch (ignore) {}
      try { if (canvas) { canvas.width = 1; canvas.height = 1; } } catch (ignore) {}
      try { window.URL.revokeObjectURL(objectUrl); } catch (ignore) {}
    }
  }

  function clampHousemanPhotoQuantity_(value) { // (요청수량 1~99 정리)
    return Math.max(1, Math.min(99, Number(value || 1)));
  }

  function resetHousemanPhotoSelection_() { // (요청사진 선택 전체 초기화)
    photoSelectionActive = false;
    preparedPhotos = [];
    photoPrepareError = null;
    photoPreparePromise = Promise.resolve([]);
    photoSequence = 0;
    const input = document.getElementById(PHOTO_INPUT_ID);
    if (input) {
      input.value = '';
      input.disabled = false;
    }
    renderHousemanPhotoPreviews_();
    setHousemanPhotoStatus_(`사진은 선택사항이며 최대 ${maxPhotosAllowed}장까지 등록할 수 있습니다.`, '');
  }

  function setHousemanPhotoStatus_(message, type) { // (사진 준비·오류 상태 표시)
    const status = document.getElementById(PHOTO_STATUS_ID);
    if (!status) return;
    status.textContent = String(message || '');
    status.classList.toggle('error', type === 'error');
    status.classList.toggle('success', type === 'success');
  }

  function setHousemanPhotoSubmitBusy_(button, busy, label) { // (사진 포함 요청 중복 제출 방지)
    if (!button) return;
    if (!button.dataset.novaHmOriginalText) button.dataset.novaHmOriginalText = button.textContent || '요청 등록';
    button.disabled = Boolean(busy);
    if (busy && label) button.textContent = label;
    else if (!busy) button.textContent = button.dataset.novaHmOriginalText || '요청 등록';
  }

  function restoreHousemanPhotoSubmitButton_(button) { // (오류 후 제출버튼 복원)
    setHousemanPhotoSubmitBusy_(button, false, '');
  }

  function closeHousemanPhotoModal_() { // (룸메이드 하우스맨 요청 모달만 닫기)
    const root = document.getElementById('modalRoot');
    if (!root) return;
    root.classList.add('hidden');
    root.setAttribute('aria-hidden', 'true');
    root.innerHTML = '';
    resetHousemanPhotoSelection_();
  }

  function showHousemanPhotoToast_(message, isError) { // (분리모듈 전용 결과 안내)
    let toast = document.getElementById('novaHmPhotoToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'novaHmPhotoToast';
      toast.className = 'nova-hm-photo-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = String(message || '');
    toast.classList.toggle('error', Boolean(isError));
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => {
      const current = document.getElementById('novaHmPhotoToast');
      if (current) current.remove();
    }, isError ? 6000 : 2800);
  }
})();
</script>
