<script>
(() => {
  'use strict';

  const ARCHIVE_RT_TOPIC_ = 'nova:archive:status';
  const ARCHIVE_RT_EVENT_ = 'STATUS';
  const ARCHIVE_RT_TOKEN_REFRESH_MS_ = 9 * 60 * 1000;

  const archiveRt_ = {
    client: null,
    channel: null,
    connecting: false,
    subscribed: false,
    apiBase: '',
    tokenRefreshTimer: null,
    reconnectTimer: null,
    queryRefreshTimer: null,
    fallbackTimer: null,
    fallbackBusy: false,
    lastToken: '',
    pageActive: false
  };

  function archiveRtToken_() {
    return String(localStorage.getItem('novaToken') || '').trim();
  }

  function archiveRtPageVisible_() {
    return Boolean(document.getElementById('novaArchiveStatusGrid'));
  }

  function archiveRtAdminMenuPresent_() {
    return Array.from(document.querySelectorAll('#menu button')).some(button =>
      String(button.textContent || '').trim() === 'Archive 이력'
    );
  }

  function archiveRtEscape_(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function archiveRtCallServer_(method, ...args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))));
      runner[method](...args);
    });
  }

  async function archiveRtAuthBundle_() {
    const token = archiveRtToken_();
    if (!token) throw new Error('로그인 정보가 없습니다.');

    const config = await archiveRtCallServer_('getNovaRealtimeClientConfig', token);
    if (!config?.ok || !config?.enabled || !config?.apiBase) {
      throw new Error('Realtime 연결이 비활성화되어 있습니다.');
    }
    const apiBase = String(config.apiBase || '').replace(/\/+$/, '');
    const response = await fetch(`${apiBase}/v1/auth/realtime-token`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: '{}'
    });

    let auth = {};
    try { auth = await response.json(); } catch (ignore) {}
    if (!response.ok || !auth?.ok || !auth?.token || !auth?.supabaseUrl || !auth?.publishableKey) {
      throw new Error(auth?.message || `Realtime 인증 실패 (${response.status})`);
    }
    archiveRt_.apiBase = apiBase;
    archiveRt_.lastToken = token;
    return auth;
  }

  function archiveRtRenderIntegrity_(integrity, sourceLabel) {
    if (!integrity || typeof integrity !== 'object' || !archiveRtPageVisible_()) return;

    const healthy = integrity.ok === true;
    const line = document.getElementById('novaArchiveStatusLine');
    if (line) {
      const suffix = archiveRt_.subscribed ? '실시간 연결됨' : (sourceLabel || '서버 확인');
      line.innerHTML = `<span class="nova-archive-dot ${healthy ? 'good' : 'bad'}"></span><span>${healthy ? '정상' : '확인 필요'} · ${suffix}</span>`;
    }

    const grid = document.getElementById('novaArchiveStatusGrid');
    if (!grid) return;
    grid.innerHTML = `
      <div class="nova-archive-status-card ${healthy ? 'good' : 'bad'}"><span>전체 상태</span><strong>${healthy ? '정상' : '확인 필요'}</strong></div>
      <div class="nova-archive-status-card"><span>VERIFIED 배치</span><strong>${archiveRtEscape_(integrity.verifiedBatchesTotal ?? '-')}</strong></div>
      <div class="nova-archive-status-card"><span>Storage 객체</span><strong>${archiveRtEscape_(integrity.storageObjects ?? '-')}</strong></div>
      <div class="nova-archive-status-card"><span>WORK_HISTORY 인덱스</span><strong>${archiveRtEscape_(integrity.workHistoryIndexRowsPast ?? '-')}</strong></div>`;
  }

  function archiveRtMarkConnected_() {
    if (!archiveRtPageVisible_()) return;
    const line = document.getElementById('novaArchiveStatusLine');
    if (!line) return;
    const currentText = String(line.textContent || '').trim();
    if (currentText.includes('실시간 연결됨')) return;

    const firstValue = document.querySelector('#novaArchiveStatusGrid .nova-archive-status-card strong')?.textContent?.trim();
    if (firstValue === '정상') {
      line.innerHTML = '<span class="nova-archive-dot good"></span><span>정상 · 실시간 연결됨</span>';
    } else if (firstValue === '확인 필요') {
      line.innerHTML = '<span class="nova-archive-dot bad"></span><span>확인 필요 · 실시간 연결됨</span>';
    } else {
      line.innerHTML = '<span class="nova-archive-dot"></span><span>실시간 연결됨 · 상태 확인 중</span>';
    }
  }

  function archiveRtScheduleQueryRefresh_() {
    window.clearTimeout(archiveRt_.queryRefreshTimer);
    archiveRt_.queryRefreshTimer = window.setTimeout(() => {
      if (!archiveRtPageVisible_()) return;
      const count = document.getElementById('novaArchiveResultCount');
      if (!count || String(count.textContent || '').trim() === '조회 전') return;
      const button = document.getElementById('novaArchiveSearch');
      if (!button) return;
      if (button.disabled) {
        archiveRt_.queryRefreshTimer = window.setTimeout(archiveRtScheduleQueryRefresh_, 2500);
        return;
      }
      button.click();
    }, 1200);
  }

  function archiveRtHandleMessage_(message) {
    if (!archiveRtPageVisible_()) return;
    const payload = message?.payload && typeof message.payload === 'object'
      ? message.payload
      : (message && typeof message === 'object' ? message : {});
    const integrity = payload?.integrity;
    if (!integrity || typeof integrity !== 'object') return;

    archiveRtRenderIntegrity_(integrity, '실시간 반영');
    archiveRtScheduleQueryRefresh_();
  }

  async function archiveRtEnsureClient_() {
    if (archiveRt_.connecting || archiveRt_.subscribed) return;
    if (!archiveRtPageVisible_() || !archiveRtAdminMenuPresent_() || !archiveRtToken_()) return;
    if (!window.supabase?.createClient) return archiveRtStartFallback_();

    archiveRt_.connecting = true;
    try {
      const auth = await archiveRtAuthBundle_();
      if (!archiveRtPageVisible_() || !archiveRtToken_()) {
        archiveRt_.connecting = false;
        return;
      }

      if (!archiveRt_.client) {
        archiveRt_.client = window.supabase.createClient(auth.supabaseUrl, auth.publishableKey, {
          auth: { persistSession: false, autoRefreshToken: false }
        });
      }
      await archiveRt_.client.realtime.setAuth(auth.token);

      if (!archiveRtPageVisible_() || !archiveRtToken_()) {
        archiveRt_.connecting = false;
        return;
      }

      if (archiveRt_.channel) {
        const oldChannel = archiveRt_.channel;
        archiveRt_.channel = null;
        try { await archiveRt_.client.removeChannel(oldChannel); } catch (ignore) {}
      }

      const channel = archiveRt_.client
        .channel(ARCHIVE_RT_TOPIC_, { config: { private: true } })
        .on('broadcast', { event: ARCHIVE_RT_EVENT_ }, archiveRtHandleMessage_)
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            if (!archiveRtPageVisible_()) {
              archiveRt_.connecting = false;
              archiveRt_.subscribed = false;
              void archiveRtDisconnect_();
              return;
            }
            archiveRt_.subscribed = true;
            archiveRt_.connecting = false;
            archiveRtStopFallback_();
            archiveRtMarkConnected_();
            archiveRtScheduleTokenRefresh_();
            return;
          }
          if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(status)) {
            archiveRt_.subscribed = false;
            archiveRt_.connecting = false;
            if (!archiveRtPageVisible_()) return;
            archiveRtStartFallback_();
            archiveRtScheduleReconnect_();
          }
        });
      archiveRt_.channel = channel;
    } catch (error) {
      archiveRt_.connecting = false;
      archiveRt_.subscribed = false;
      if (!archiveRtPageVisible_()) return;
      console.warn('[NOVA Archive Realtime] 연결 실패 · 서버조회 fallback 유지', error);
      archiveRtStartFallback_();
      archiveRtScheduleReconnect_();
    }
  }

  function archiveRtScheduleTokenRefresh_() {
    window.clearTimeout(archiveRt_.tokenRefreshTimer);
    archiveRt_.tokenRefreshTimer = window.setTimeout(async () => {
      if (!archiveRtPageVisible_()) {
        void archiveRtDisconnect_();
        return;
      }
      if (!archiveRt_.client || !archiveRtToken_()) return;
      try {
        const auth = await archiveRtAuthBundle_();
        if (!archiveRtPageVisible_()) {
          void archiveRtDisconnect_();
          return;
        }
        await archiveRt_.client.realtime.setAuth(auth.token);
        archiveRtScheduleTokenRefresh_();
      } catch (error) {
        archiveRt_.subscribed = false;
        if (!archiveRtPageVisible_()) return;
        archiveRtStartFallback_();
        archiveRtScheduleReconnect_();
      }
    }, ARCHIVE_RT_TOKEN_REFRESH_MS_);
  }

  function archiveRtScheduleReconnect_() {
    window.clearTimeout(archiveRt_.reconnectTimer);
    archiveRt_.reconnectTimer = window.setTimeout(() => {
      if (!archiveRtPageVisible_() || !archiveRtToken_() || document.hidden) return;
      void archiveRtEnsureClient_();
    }, 1800);
  }

  function archiveRtStartFallback_() {
    if (!archiveRtPageVisible_() || archiveRt_.fallbackTimer) return;
    archiveRt_.fallbackTimer = window.setInterval(() => {
      if (!archiveRtPageVisible_()) {
        archiveRtStopFallback_();
        return;
      }
      if (archiveRt_.subscribed || archiveRt_.fallbackBusy) return;
      const token = archiveRtToken_();
      if (!token) return;
      archiveRt_.fallbackBusy = true;
      archiveRtCallServer_('getNovaArchiveAdminStatus', token)
        .then(result => {
          if (result?.ok && result?.current && archiveRtPageVisible_()) {
            archiveRtRenderIntegrity_(result.current, '서버 확인');
          }
        })
        .catch(() => {})
        .finally(() => { archiveRt_.fallbackBusy = false; });
    }, 30000);
  }

  function archiveRtStopFallback_() {
    if (!archiveRt_.fallbackTimer) return;
    window.clearInterval(archiveRt_.fallbackTimer);
    archiveRt_.fallbackTimer = null;
  }

  async function archiveRtDisconnect_() {
    window.clearTimeout(archiveRt_.tokenRefreshTimer);
    window.clearTimeout(archiveRt_.reconnectTimer);
    window.clearTimeout(archiveRt_.queryRefreshTimer);
    archiveRtStopFallback_();
    archiveRt_.subscribed = false;
    archiveRt_.connecting = false;
    const channel = archiveRt_.channel;
    archiveRt_.channel = null;
    if (archiveRt_.client && channel) {
      try { await archiveRt_.client.removeChannel(channel); } catch (ignore) {}
    }
  }

  function archiveRtSyncLifecycle_() {
    const visible = archiveRtPageVisible_();
    if (visible) {
      archiveRt_.pageActive = true;
      if (archiveRt_.subscribed) archiveRtMarkConnected_();
      if (archiveRtAdminMenuPresent_() && archiveRtToken_() && !archiveRt_.subscribed && !archiveRt_.connecting) {
        void archiveRtEnsureClient_();
      }
      return;
    }

    if (archiveRt_.pageActive) {
      archiveRt_.pageActive = false;
      if (archiveRt_.channel || archiveRt_.subscribed || archiveRt_.connecting || archiveRt_.fallbackTimer) {
        void archiveRtDisconnect_();
      }
    }
  }

  const archiveRtObserver_ = new MutationObserver(archiveRtSyncLifecycle_);

  function archiveRtStart_() {
    const content = document.getElementById('content');
    if (content) archiveRtObserver_.observe(content, { childList: true, subtree: true });
    archiveRtSyncLifecycle_();

    window.setInterval(() => {
      const token = archiveRtToken_();
      if (!token) {
        if (archiveRt_.channel || archiveRt_.subscribed || archiveRt_.connecting) void archiveRtDisconnect_();
        return;
      }
      if (!archiveRtPageVisible_()) return;
      if (token !== archiveRt_.lastToken && archiveRt_.lastToken) {
        void archiveRtDisconnect_().then(() => archiveRtEnsureClient_());
        return;
      }
      if (!archiveRt_.subscribed && !archiveRt_.connecting) {
        void archiveRtEnsureClient_();
      }
    }, 15000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && archiveRtPageVisible_() && archiveRtAdminMenuPresent_() && archiveRtToken_() && !archiveRt_.subscribed) {
        void archiveRtEnsureClient_();
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', archiveRtStart_, { once: true });
  } else {
    archiveRtStart_();
  }
})();
</script>
