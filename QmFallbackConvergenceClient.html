<script>
(() => {
  'use strict';

  // QM_FALLBACK_DB_CONVERGENCE_CLIENT_V1
  // PGRST002 circuit mode에서만 동작합니다.
  // 사용자의 QM 시작/완료 UI 응답은 기다리지 않고, Sheet 상태가 확정된 뒤 단일 큐로 DB 수렴을 검증합니다.
  const BREAKER_KEY = 'novaQmSchemaCacheBreakerUntilV1';
  const pending = new Map();
  let chain = Promise.resolve();

  function breakerActive_() {
    try { return Number(localStorage.getItem(BREAKER_KEY) || 0) > Date.now(); }
    catch (ignore) { return false; }
  }

  function token_() {
    try { return String(localStorage.getItem('novaToken') || '').trim(); }
    catch (ignore) { return ''; }
  }

  function selection_() {
    return {
      businessDate: String(document.getElementById('mobileDate')?.value || '').trim(),
      site: String(document.getElementById('mobileSite')?.value || '').trim()
    };
  }

  function modalRoomNo_() {
    const title = String(document.querySelector('.qm-checklist-modal .modal-header h2')?.textContent || '').trim();
    const match = title.match(/^\s*([^\s]+)\s+장소별\s+체크리스트/);
    return String(match?.[1] || '').trim();
  }

  function callSync_(payload) {
    return new Promise((resolve, reject) => {
      const token = token_();
      if (!token || !window.google?.script?.run) {
        resolve({ ok: false, deferred: true, reason: 'CLIENT_NOT_READY' });
        return;
      }
      google.script.run
        .withSuccessHandler(result => resolve(result || { ok: false }))
        .withFailureHandler(error => reject(error || new Error('QM fallback DB 동기화 실패')))
        .syncQmFallbackRoomToRealtime(token, payload);
    });
  }

  async function converge_(key, expectedStatus) {
    const current = pending.get(key);
    if (!current || current.expectedStatus !== expectedStatus || !breakerActive_()) return;
    const retryDelays = [0, 1400, 3200, 6200];
    for (let index = 0; index < retryDelays.length; index += 1) {
      const latest = pending.get(key);
      if (!latest || latest.expectedStatus !== expectedStatus || !breakerActive_()) return;
      if (retryDelays[index]) await new Promise(resolve => setTimeout(resolve, retryDelays[index]));
      try {
        const result = await callSync_(latest);
        if (result?.converged === true) {
          if (pending.get(key)?.expectedStatus === expectedStatus) pending.delete(key);
          console.info('[NOVA QM] fallback DB 수렴 완료', latest.roomNo, expectedStatus, result.dbVersion || '');
          return;
        }
        const reason = String(result?.reason || '').toUpperCase();
        if (!['SHEET_STATUS_NOT_READY', 'QM_OWNER_NOT_READY', 'CLIENT_NOT_READY'].includes(reason)) {
          console.warn('[NOVA QM] fallback DB 수렴 보류', latest.roomNo, expectedStatus, reason || result);
          return;
        }
      } catch (error) {
        if (index === retryDelays.length - 1) {
          console.warn('[NOVA QM] fallback DB 수렴 지연 · 다음 화면 갱신에서 재검증', error?.message || error);
        }
      }
    }
  }

  function enqueue_(roomNo, expectedStatus, initialDelay) {
    const selected = selection_();
    const room = String(roomNo || '').trim();
    if (!room || !selected.businessDate || !selected.site) return;
    const key = [selected.businessDate, selected.site, room].join('|');
    const next = {
      businessDate: selected.businessDate,
      site: selected.site,
      roomNo: room,
      expectedStatus
    };
    const previous = pending.get(key);
    // 완료가 시작보다 우선합니다. 완료가 예약된 뒤 시작 상태로 되돌리지 않습니다.
    if (previous?.expectedStatus === 'QM_COMPLETED' && expectedStatus === 'QM_CHECKING') return;
    pending.set(key, next);

    setTimeout(() => {
      if (!breakerActive_()) return;
      chain = chain
        .catch(() => {})
        .then(() => converge_(key, expectedStatus));
    }, Math.max(0, Number(initialDelay || 0)));
  }

  function rememberUntilBreaker_(roomNo, expectedStatus, initialDelay) {
    const started = Date.now();
    const poll = () => {
      if (breakerActive_()) {
        enqueue_(roomNo, expectedStatus, initialDelay);
        return;
      }
      if (Date.now() - started < 12000) setTimeout(poll, 250);
    };
    poll();
  }

  document.addEventListener('click', event => {
    const start = event.target?.closest?.('[data-room-action="START"], [data-qm-browse-inspect]');
    if (start) {
      const roomNo = String(start.dataset.roomNo || start.dataset.qmBrowseInspect || '').trim();
      rememberUntilBreaker_(roomNo, 'QM_CHECKING', 2600);
      return;
    }

    const submit = event.target?.closest?.('.qm-checklist-modal #qmChecklistSubmit');
    if (submit) {
      const roomNo = modalRoomNo_();
      rememberUntilBreaker_(roomNo, 'QM_COMPLETED', 4200);
    }
  }, true);
})();
</script>
