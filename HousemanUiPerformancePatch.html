<style>
.nova-notification-wrap{position:relative;display:none;align-items:center}.nova-notification-wrap.active{display:inline-flex}.nova-notification-button{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#171717;font-size:18px}.nova-notification-badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:999px;background:#dc2626;color:#fff;font-size:10px;font-weight:900}.nova-notification-badge.hidden,.nova-notification-panel.hidden{display:none!important}.nova-notification-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:10020;width:min(390px,calc(100vw - 24px));max-height:min(520px,calc(100vh - 90px));overflow:hidden;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 18px 42px rgba(15,23,42,.18)}.nova-notification-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid #eef2f7}.nova-notification-head strong{font-size:14px}.nova-notification-head span{color:#6b7280;font-size:11px;font-weight:700}.nova-notification-list{max-height:430px;overflow-y:auto}.nova-notification-empty{padding:28px 16px;color:#6b7280;font-size:12px;text-align:center}.nova-notification-item{display:block;width:100%;padding:11px 13px;border-bottom:1px solid #f1f5f9;background:#fff;color:#171717;text-align:left}.nova-notification-item:hover{background:#f8fafc}.nova-notification-item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.nova-notification-room{font-size:13px;font-weight:900}.nova-notification-status{padding:3px 7px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:10px;font-weight:900}.nova-notification-item-main,.nova-notification-item-sub{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.nova-notification-item-main{font-size:12px;font-weight:800}.nova-notification-item-sub{margin-top:4px;color:#6b7280;font-size:11px}@media(max-width:760px){.nova-notification-button{width:40px;height:40px}.nova-notification-panel{position:fixed;top:64px;right:8px;left:8px;width:auto;max-height:calc(100vh - 76px)}.nova-notification-list{max-height:calc(100vh - 132px)}}
</style>
<script>
(()=>{'use strict';
const S={mode:'',count:0,items:[],timer:null,observer:null,hold:null,holdTimer:null,lastRoom:'',rtSeen:false,rtGateDone:false,userKey:'',opBusy:false};
const ACTIVE=new Set(['SAVING','REGISTERED','ASSIGNED','ACCEPTED','PROCESSING']),DONE=new Set(['COMPLETED','UNABLE']);
document.addEventListener('DOMContentLoaded',init);document.addEventListener('submit',onSubmit,true);document.addEventListener('click',onDocClick,true);
function init(){shell();S.observer=new MutationObserver(()=>schedule(70));const c=document.getElementById('content'),y=document.getElementById('syncStatus');if(c)S.observer.observe(c,{childList:true,subtree:true,characterData:true});if(y)S.observer.observe(y,{childList:true,subtree:true,characterData:true});schedule(0)}
function shell(){const a=document.querySelector('.topbar-actions');if(!a||document.getElementById('novaNotificationWrap'))return;const w=document.createElement('div');w.id='novaNotificationWrap';w.className='nova-notification-wrap';w.innerHTML='<button id="novaNotificationButton" class="nova-notification-button" type="button" aria-label="알림" aria-expanded="false">🔔<span id="novaNotificationBadge" class="nova-notification-badge hidden">0</span></button><section id="novaNotificationPanel" class="nova-notification-panel hidden"><div class="nova-notification-head"><strong>알림</strong><span id="novaNotificationCountText">처리할 알림 0건</span></div><div id="novaNotificationList" class="nova-notification-list"></div></section>';const u=document.getElementById('userText');u&&u.parentNode===a?a.insertBefore(w,u):a.prepend(w);document.getElementById('novaNotificationButton').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();toggle()})}
function schedule(ms){clearTimeout(S.timer);S.timer=setTimeout(refresh,Math.max(0,ms||0))}
function refresh(){shell();rtSignal();const user=t(document.getElementById('userText'));if(S.userKey&&user&&user!==S.userKey){S.mode='';S.count=0;S.items=[]}const o=document.getElementById('orderScroll'),h=document.querySelector('#mobilePage[data-mobile-menu="houseman"]');if(o){S.userKey=user;S.mode='INDICATOR';S.items=[...o.querySelectorAll('.order-mini-row[data-order-id]')].map(indItem).filter(x=>ACTIVE.has(x.code));S.count=S.items.length}else if(h){S.userKey=user;S.mode='HOUSEMAN';const list=[...document.querySelectorAll('#mobileList .mobile-task-card[data-mobile-order-id]')].map(mobItem).filter(x=>ACTIVE.has(x.code));const n=summaryCount();if(list.length||n===0)S.items=list;S.count=Math.max(n,list.length);if(S.count>S.items.length&&!S.items.some(x=>x.placeholder))S.items=S.items.concat([{room:'추가 알림',item:`${S.count-S.items.length}건의 처리할 오더가 더 있습니다.`,sub:'하우스맨 오더 화면에서 확인',status:'진행',placeholder:true}])}render()}
function indItem(r){const c=r.querySelector('.status-chip');return{key:r.dataset.orderId,room:t(r.querySelector('.order-room')),item:t(r.querySelector('.order-item')).replace(/^●\s*/,''),sub:t(r.querySelector('.order-person')),status:t(c),code:status(c),el:r}}
function mobItem(r){const c=r.querySelector('.status-chip');return{key:r.dataset.mobileOrderId,room:t(r.querySelector('.mobile-card-top strong')),item:t(r.querySelector('.mobile-task-title')),sub:t(r.querySelector('.mobile-task-meta')),status:t(c),code:status(c),el:r}}
function summaryCount(){let a=0,w=0;document.querySelectorAll('#mobileSummary .mobile-summary-card').forEach(c=>{const l=t(c.querySelector('span')),n=Number(t(c.querySelector('strong')).replace(/\D/g,'')||0);if(l==='배정')a=n;if(l==='처리중')w=n});return a+w}
function status(c){if(!c)return'';const k=[...c.classList].find(x=>x.startsWith('status-'));if(k)return k.slice(7).toUpperCase();return({저장중:'SAVING',등록:'REGISTERED',배정:'ASSIGNED',접수:'ACCEPTED',처리중:'PROCESSING',완료:'COMPLETED',처리불가:'UNABLE'})[t(c)]||''}
function render(){const w=document.getElementById('novaNotificationWrap'),b=document.getElementById('novaNotificationBadge'),c=document.getElementById('novaNotificationCountText'),l=document.getElementById('novaNotificationList');if(!w||!b||!c||!l)return;const ok=S.mode==='INDICATOR'||S.mode==='HOUSEMAN';w.classList.toggle('active',ok);if(!ok)return;const n=Math.max(0,S.count||0);b.textContent=n>99?'99+':String(n);b.classList.toggle('hidden',n<1);c.textContent=`처리할 알림 ${n}건`;const items=S.items.slice(0,12);l.innerHTML=items.length?items.map((x,i)=>`<button class="nova-notification-item" type="button" data-ni="${i}"><span class="nova-notification-item-top"><strong class="nova-notification-room">${esc(x.room||'공용')}</strong><span class="nova-notification-status">${esc(x.status||'진행')}</span></span><span class="nova-notification-item-main">${esc(x.item||'-')}</span><span class="nova-notification-item-sub">${esc(x.sub||'')}</span></button>`).join(''):'<div class="nova-notification-empty">현재 처리할 하우스맨 알림이 없습니다.</div>';l.querySelectorAll('[data-ni]').forEach(x=>x.addEventListener('click',()=>focus(Number(x.dataset.ni||0))))}
function focus(i){const x=S.items[i];if(!x||x.placeholder)return;close();if(x.el?.isConnected){x.el.scrollIntoView({behavior:'smooth',block:'center'});x.el.click()}}
function toggle(){const p=document.getElementById('novaNotificationPanel'),b=document.getElementById('novaNotificationButton');if(!p||!b)return;const open=p.classList.contains('hidden');p.classList.toggle('hidden',!open);b.setAttribute('aria-expanded',open?'true':'false');if(open)refresh()}
function close(){document.getElementById('novaNotificationPanel')?.classList.add('hidden');document.getElementById('novaNotificationButton')?.setAttribute('aria-expanded','false')}
function onDocClick(e){const w=document.getElementById('novaNotificationWrap');if(w&&!w.contains(e.target))close()}
function onSubmit(e){const f=e.target;if(!f||f.id!=='housemanOrderForm'||!valid())return;if(f.dataset.novaRtGate==='pass'){delete f.dataset.novaRtGate;holdGrid();return}if(!S.rtSeen&&!S.rtGateDone&&f.dataset.novaRtGate!=='waiting'){e.preventDefault();e.stopImmediatePropagation();f.dataset.novaRtGate='waiting';waitRt(650).finally(()=>{S.rtGateDone=true;if(f.isConnected){f.dataset.novaRtGate='pass';f.requestSubmit()}});return}if(f.dataset.novaRtGate==='waiting'){e.preventDefault();e.stopImmediatePropagation();return}holdGrid()}
function valid(){const label=String(document.getElementById('itemPickerLabel')?.textContent||'').trim();return !!(String(document.getElementById('indicatorSite')?.value||'').trim()&&String(document.getElementById('orderRoomNo')?.value||'').trim()&&String(document.getElementById('orderPart')?.value||'').trim()&&label&&label!=='품목 선택')}
function rtSignal(){if(/Realtime 관리자 연결 준비 완료|고속 API 연결 준비 완료|Realtime 연결 ·/.test(t(document.getElementById('syncStatus'))))S.rtSeen=true}
function waitRt(ms){const st=Date.now();return new Promise(r=>{const q=()=>{rtSignal();if(S.rtSeen||Date.now()-st>=ms)return r(S.rtSeen);setTimeout(q,45)};q()})}
function holdGrid(){release();const g=document.getElementById('roomGrid');if(!g)return;S.lastRoom=String(document.getElementById('orderRoomNo')?.value||'').trim();S.hold={g,st:Date.now(),busy:false};g.id='roomGridNOVAOrderSaveHold';g.dataset.novaOrderSaveHold='true';const q=()=>{const h=S.hold;if(!h||h.g!==g)return;const b=document.getElementById('orderSubmitButton'),busy=!!(b?.disabled||/등록중|저장중|처리중/.test(String(b?.textContent||'')));if(busy)h.busy=true;const e=Date.now()-h.st;if((h.busy&&!busy)||(!h.busy&&e>350)||e>8500)return setTimeout(release,h.busy?700:0);S.holdTimer=setTimeout(q,45)};S.holdTimer=setTimeout(q,45)}
function release(){clearTimeout(S.holdTimer);S.holdTimer=null;const h=S.hold;S.hold=null;if(!h?.g)return;if(h.g.id==='roomGridNOVAOrderSaveHold')h.g.id='roomGrid';delete h.g.dataset.novaOrderSaveHold;syncRoomBadge(S.lastRoom);schedule(0)}
function syncRoomBadge(room){room=String(room||'').trim();if(!room)return;const g=document.getElementById('roomGrid');if(!g)return;const card=[...g.querySelectorAll('[data-room-no]')].find(x=>String(x.dataset.roomNo||'')===room);if(!card)return;const n=[...document.querySelectorAll('#orderScroll .order-mini-row[data-order-id]')].filter(r=>t(r.querySelector('.order-room'))===room&&!DONE.has(status(r.querySelector('.status-chip')))).length;let b=card.querySelector('.room-order-count');if(!n){b?.remove();return}if(!b){b=document.createElement('span');b.className='room-order-count';b.title='미완료 하우스맨 오더';card.appendChild(b)}b.textContent=String(n)}
function onOperationalStatusClickCapture(e){const b=e.target?.closest?.('[data-room-action="UPDATE_ROOM_OPERATION_STATUS"]');if(!b)return;if(b.dataset.novaOperationalReplay==='1'){delete b.dataset.novaOperationalReplay;return}if(S.opBusy||b.disabled)return;const m=b.closest('.room-work-modal-card');if(!m)return;const active=m.querySelector('.room-operational-status-button.active');const expected=String(active?.dataset.roomOperationalStatus||'').trim();const requested=String(b.dataset.roomOperationalStatus||'').trim();if(expected===requested)return;const title=t(m.querySelector('.modal-header h2'));const roomNo=title.replace(/호\s*객실\s*작업.*$/,'').trim();const token=String(localStorage.getItem('novaToken')||'').trim();const businessDate=String(document.getElementById('indicatorDate')?.value||'').trim();const site=String(document.getElementById('indicatorSite')?.value||'').trim();if(!token||!roomNo||!businessDate)return;e.preventDefault();e.stopImmediatePropagation();S.opBusy=true;const buttons=[...m.querySelectorAll('.room-operational-status-button')];const states=buttons.map(x=>({el:x,disabled:x.disabled,text:x.textContent}));buttons.forEach(x=>x.disabled=true);b.textContent='처리 중…';setRawSync_(`${roomNo}호 객실조치 저장 중`);callOperationalStatusGas_(token,{businessDate,site,roomNo,expectedOperationalStatus:expected,operationalStatus:requested}).then(r=>{if(!r?.ok)throw new Error(r?.message||'객실조치 상태를 저장하지 못했습니다.');states.forEach(s=>{if(s.el.isConnected){s.el.disabled=s.disabled;s.el.textContent=s.text}});S.opBusy=false;if(!b.isConnected)return;b.dataset.novaOperationalReplay='1';b.disabled=false;b.click()}).catch(err=>{states.forEach(s=>{if(s.el.isConnected){s.el.disabled=s.disabled;s.el.textContent=s.text}});S.opBusy=false;setRawSync_('객실조치 저장 오류');showRawToast_(err?.message||String(err||'객실조치 상태를 저장하지 못했습니다.'))})}
function callOperationalStatusGas_(token,payload){return new Promise((resolve,reject)=>{try{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).updateRoomOperationalStatusSafe(token,payload)}catch(error){reject(error)}})}
function setRawSync_(message){const e=document.getElementById('syncStatus');if(e)e.textContent=String(message||'')}
function showRawToast_(message){const e=document.getElementById('toast');if(!e)return;e.textContent=String(message||'오류가 발생했습니다.');e.classList.remove('hidden');clearTimeout(showRawToast_.timer);showRawToast_.timer=setTimeout(()=>e.classList.add('hidden'),3600)}
function t(e){return String(e?.textContent||'').replace(/\s+/g,' ').trim()}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
})();
</script>
