name: Deploy QM Houseman Request Parity V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-qm-houseman-request-parity-v1.yml'
      - 'scripts/patch_qm_houseman_request_parity_v1.py'
      - 'scripts/validate_qm_houseman_request_parity_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply QM houseman request parity V1
        run: python3 scripts/patch_qm_houseman_request_parity_v1.py

      - name: Validate QM houseman request parity V1
        run: python3 scripts/validate_qm_houseman_request_parity_v1.py

      - name: Validate existing NOVA production regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check HousemanRequestPhoto.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('Client script block missing')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html HousemanRequestPhoto.js | sha256sum | awk '{print $1}')"
          python3 scripts/patch_qm_houseman_request_parity_v1.py
          after="$(sha256sum Client.html HousemanRequestPhoto.js | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated production sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html HousemanRequestPhoto.js; then
            echo 'Production sources already contain QM houseman parity V1.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Client.html HousemanRequestPhoto.js
            git commit -m 'Persist QM houseman request parity V1 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo '::error::Apps Script OAuth secret is missing.'
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA QM houseman parity ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo 'QM HOUSEMAN REQUEST PARITY V1 deployed.'
          echo "Commit: $GITHUB_SHA"
