name: Validate QM Roommaid Name

on:
  push:
    branches: [fix/qm-roommaid-name-20260829]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch syntax
        run: |
          python3 -m py_compile scripts/patch_realtime_client.py
          python3 -m py_compile scripts/patch_qm_mobile_browse.py
          python3 -m py_compile scripts/patch_qm_mobile_browse_v2.py
          python3 -m py_compile scripts/patch_qm_immediate_checklist.py
          python3 -m py_compile scripts/patch_qm_roommaid_name_display.py

      - name: Apply production patch chain
        run: |
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py

      - name: Validate QM name preservation scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "QM 점검대상 정비자 이름 보존 v1" Client.html
          test "$(grep -c "preserveQmMobileRoommaidNames_" Client.html)" -eq 4
          grep -q "if (legacyRoom) return preserveQmMobileRoommaidNames_" Client.html
          grep -q "mobileRooms\[mobileIndex\] = preserveQmMobileRoommaidNames_" Client.html
          grep -q "rooms\[index\] = preserveQmMobileRoommaidNames_" Client.html
          grep -q "QM 추가탭 체크리스트 즉시노출 v1" Client.html
          grep -q "API 설정과 보조 Realtime 연결을 분리해 고속 API 유지" Client.html
          grep -q "updateRoomOperationalStatusSafe" Client.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Client.html').read_text(encoding='utf-8')
          js = text.split('<script>', 1)[1].rsplit('</script>', 1)[0]
          Path('/tmp/nova-client.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/nova-client.js

      - name: Confirm generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "Client.html"
