name: Deploy Monthly Houseman Columns V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_monthly_houseman_columns_v1.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly houseman columns patch
        run: python3 scripts/patch_monthly_houseman_columns_v1.py

      - name: Validate monthly houseman fields and layout
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MONTHLY_HOUSEMAN_COLUMNS_V1" 11_Monthly.js
          grep -q "registeredByName" 11_Monthly.js
          grep -q "handlerEmployeeNo" 11_Monthly.js
          grep -q "handlerName" 11_Monthly.js
          grep -q "MONTHLY_HOUSEMAN_COLUMNS_V1" Client.html
          grep -q "의뢰자(등록)" Client.html
          grep -q "담당자(접수.처리)" Client.html
          grep -q "등록.시작" Client.html
          grep -q "monthlyTableHeaderRow" Client.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 11_Monthly.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(Client.html 11_Monthly.js)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_monthly_houseman_columns_v1.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist patched sources to main
        shell: bash
        run: |
          set -euo pipefail
          generated=(Client.html 11_Monthly.js)
          if git diff --quiet -- "${generated[@]}"; then
            echo "Monthly houseman column sources already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${generated[@]}"
            git commit -m "feat: show houseman requester registrant and handler [skip ci]"
            pushed=0
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "GitHub push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 2))
            done
            test "$pushed" = "1"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA monthly houseman columns ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "Monthly houseman columns V1 deployed."
          echo "Commit: $GITHUB_SHA"
