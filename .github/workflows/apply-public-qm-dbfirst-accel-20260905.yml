name: Apply PUBLIC QM DB-first Accel 20260905

on:
  push:
    branches: [feat/public-qm-dbfirst-accel-20260905]
    paths:
      - .github/workflows/apply-public-qm-dbfirst-accel-20260905.yml

permissions:
  contents: write

jobs:
  validate-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical Client patch
        run: python3 scripts/patch_public_qm_dbfirst_accel_20260905.py

      - name: Validate acceleration invariants
        run: python3 scripts/validate_public_qm_dbfirst_accel_20260905.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check RealtimeBridge.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No Client script block found')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Verify patch scope and idempotence
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "Client.html"
          before="$(sha256sum Client.html | awk '{print $1}')"
          python3 scripts/patch_public_qm_dbfirst_accel_20260905.py
          after="$(sha256sum Client.html | awk '{print $1}')"
          test "$before" = "$after"
          python3 scripts/validate_public_qm_dbfirst_accel_20260905.py

      - name: Run release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Commit materialized Client source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html; then
            echo "Client source already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Client.html
          git commit -m "Materialize PUBLIC QM DB-first acceleration [skip ci]"
          git push origin HEAD:feat/public-qm-dbfirst-accel-20260905
