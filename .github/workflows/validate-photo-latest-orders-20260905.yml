name: Validate Photo + Latest Orders 20260905

on:
  push:
    branches: [release/photo-latest-orders-20260905-one]
    paths:
      - scripts/patch_latest_houseman_lists_20260905.py
      - .github/workflows/validate-photo-latest-orders-20260905.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/photo-latest-orders-20260905-one
          fetch-depth: 0

      - name: Apply targeted order-list patch
        run: |
          set -euo pipefail
          python3 scripts/patch_latest_houseman_lists_20260905.py
          node --check 11_Monthly.js
          node --check HousemanRequestPhotoBatch.js
          node --check HousemanRequestPhotoMetadata.js
          node --check HousemanRequestPhoto.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Client.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          Path('/tmp/client.js').write_text('\n'.join(scripts), encoding='utf-8')
          batch=Path('HousemanRequestPhotoBatch.js').read_text(encoding='utf-8')
          upload=batch.split('function uploadMobileHousemanRequestPhotos',1)[1].split('function readHousemanRequestPhotoMetadata_',1)[0]
          assert 'LockService' not in upload and 'acquireWriteLock_' not in upload, 'photo upload path acquired global lock'
          assert "NOVA_HOUSEMAN_PHOTO_METADATA_HEADER_ = '요청사진JSON'" in batch
          monthly=Path('11_Monthly.js').read_text(encoding='utf-8')
          client=Path('Client.html').read_text(encoding='utf-8')
          assert 'HOUSEMAN_LATEST_REGISTERED_LISTS_V1' in monthly
          assert "a.typeCode === 'HOUSEMAN' && b.typeCode === 'HOUSEMAN'" in monthly
          assert "String(b.registeredAt || '').localeCompare(String(a.registeredAt || ''))" in monthly
          assert 'HOUSEMAN_LATEST_REGISTERED_LISTS_V1' in client
          assert "const orders = [...(state.indicator.data?.orders || [])].sort" in client
          assert "HOUSEMAN_LATEST_FIRST_V1" in Path('07_Houseman.js').read_text(encoding='utf-8')
          assert "getHousemanRequestPhotosForDisplay_" in monthly
          assert "getHousemanRequestPhotosForDisplay_" in Path('HousemanRequestPhoto.js').read_text(encoding='utf-8')
          assert "include_('HousemanRequestPhotoBatchClient')" in Path('Index.html').read_text(encoding='utf-8')
          PY
          node --check /tmp/client.js

      - name: Apply production patch chain and release gate
        run: |
          set -euo pipefail
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_sync_status_autohide.py
          python3 scripts/patch_telegram_self_connect.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          python3 scripts/patch_roommaid_performance_attribution.py
          python3 scripts/patch_roommaid_close_read_acceleration.py
          python3 scripts/fix_patch_site_scope_v2.py
          python3 scripts/patch_site_scope_indicator_close_v2.py
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/patch_houseman_realtime_push.py
          python3 scripts/patch_concurrent_write_resilience_v1.py
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          python3 scripts/patch_mobile_view_state_persistence_20260904.py
          python3 scripts/validate_site_scope_indicator_close_v2.py
          python3 scripts/validate_order_site_context_v1.py
          python3 scripts/validate_nova_release.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          monthly=Path('11_Monthly.js').read_text(encoding='utf-8')
          client=Path('Client.html').read_text(encoding='utf-8')
          batch=Path('HousemanRequestPhotoBatch.js').read_text(encoding='utf-8')
          upload=batch.split('function uploadMobileHousemanRequestPhotos',1)[1].split('function readHousemanRequestPhotoMetadata_',1)[0]
          assert 'LockService' not in upload and 'acquireWriteLock_' not in upload
          assert 'HOUSEMAN_LATEST_REGISTERED_LISTS_V1' in monthly
          assert 'HOUSEMAN_LATEST_REGISTERED_LISTS_V1' in client
          assert "String(b.registeredAt || '').localeCompare(String(a.registeredAt || ''))" in monthly
          assert "const orders = [...(state.indicator.data?.orders || [])].sort" in client
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', client, flags=re.S|re.I)
          Path('/tmp/client-after.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/client-after.js
          node --check 11_Monthly.js
          node --check HousemanRequestPhotoBatch.js

      - name: Validate sort semantics
        run: |
          node - <<'NODE'
          const cmpMonthly=(a,b)=>{
            const d=String(b.businessDate||'').localeCompare(String(a.businessDate||''));
            if(d) return d;
            if(a.typeCode==='HOUSEMAN'&&b.typeCode==='HOUSEMAN') return String(b.registeredAt||'').localeCompare(String(a.registeredAt||''))||Number(b.rowNumber||0)-Number(a.rowNumber||0)||String(a.roomNo||'').localeCompare(String(b.roomNo||''),'ko',{numeric:true});
            return String(b.eventAt||'').localeCompare(String(a.eventAt||''))||String(a.roomNo||'').localeCompare(String(b.roomNo||''),'ko',{numeric:true});
          };
          const house=[
            {typeCode:'HOUSEMAN',businessDate:'2026-09-05',registeredAt:'2026-09-05 10:00:00',eventAt:'2026-09-05 13:00:00',rowNumber:1,roomNo:'101'},
            {typeCode:'HOUSEMAN',businessDate:'2026-09-05',registeredAt:'2026-09-05 12:00:00',eventAt:'2026-09-05 12:01:00',rowNumber:2,roomNo:'102'},
          ].sort(cmpMonthly);
          if(house[0].roomNo!=='102') throw new Error('Monthly HOUSEMAN is not latest-registration first');
          const indicator=[...house].sort((a,b)=>String(b.registeredAt||'').localeCompare(String(a.registeredAt||''))||Number(b.rowNumber||0)-Number(a.rowNumber||0));
          if(indicator[0].roomNo!=='102') throw new Error('Indicator HOUSEMAN is not latest-registration first');
          console.log('LATEST_REGISTRATION_SORT=PASS');
          NODE

      - name: Commit validated source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 11_Monthly.js Client.html
          if git diff --cached --quiet; then
            echo 'No generated source changes'
          else
            git commit -m 'Show Houseman orders by latest registration'
            git push origin HEAD:release/photo-latest-orders-20260905-one
          fi
