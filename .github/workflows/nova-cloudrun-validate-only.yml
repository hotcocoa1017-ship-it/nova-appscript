name: NOVA DB-First Validate Only

on:
  push:
    branches:
      - perf/room-actions-v16
    paths:
      - 'cloudrun/**'
      - '.github/workflows/nova-cloudrun-validate-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudrun-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cloud Run branch
        uses: actions/checkout@v4
        with:
          ref: perf/room-actions-v16

      - name: Apply operation flags patch
        run: python3 cloudrun/patch_operation_flags_sync_v1.py

      - name: Apply previous-cycle metadata patch
        run: python3 cloudrun/patch_room_previous_cycle_metadata_v1.py

      - name: Apply CHECKED_OUT DB-first patch
        run: python3 cloudrun/patch_checkout_dbfirst_v1.py

      - name: Validate generated Cloud Run source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudrun/index.js
          grep -q 'ROOM_OPERATION_FLAGS_SYNC_V1' cloudrun/index.js
          grep -q 'ROOM_PREVIOUS_CYCLE_METADATA_SYNC_V1' cloudrun/index.js
          grep -q 'CHECKOUT_DB_FIRST_V1' cloudrun/index.js
          test "$(grep -Fc 'const n = i * 20;' cloudrun/index.js)" -eq 2
          if grep -Fq 'const n = i * 15;' cloudrun/index.js; then exit 21; fi
          grep -Fq "lastRoomStatus: r.last_room_status || ''" cloudrun/index.js
          grep -Fq 'last_room_status=excluded.last_room_status' cloudrun/index.js
          grep -Fq 'previous_room_status=excluded.previous_room_status' cloudrun/index.js
          grep -Fq 'previous_cleaning_status=excluded.previous_cleaning_status' cloudrun/index.js
          grep -Fq 'previous_roommaid_employee_no=excluded.previous_roommaid_employee_no' cloudrun/index.js
          grep -Fq 'previous_secondary_roommaid_employee_no=excluded.previous_secondary_roommaid_employee_no' cloudrun/index.js
          grep -Fq 'preassigned=excluded.preassigned' cloudrun/index.js
          grep -Fq 'vip=excluded.vip' cloudrun/index.js
          grep -Fq 'important_room=excluded.important_room' cloudrun/index.js
          if grep -q 'CHECKOUT_LEGACY_ONLY' cloudrun/index.js; then exit 22; fi

      - name: Validate Cloud Run patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum cloudrun/index.js | cut -d' ' -f1)"
          python3 cloudrun/patch_operation_flags_sync_v1.py
          python3 cloudrun/patch_room_previous_cycle_metadata_v1.py
          python3 cloudrun/patch_checkout_dbfirst_v1.py
          after="$(sha256sum cloudrun/index.js | cut -d' ' -f1)"
          test "$before" = "$after"

  appsscript-metadata-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps Script main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply existing upload convergence/read-authority patch
        run: python3 scripts/patch_room_upload_realtime_sync_20260907.py

      - name: Apply previous-cycle metadata DB authority patch
        run: python3 scripts/patch_room_previous_cycle_db_authority_20260907.py

      - name: Validate previous-cycle metadata DB authority
        run: python3 scripts/validate_room_previous_cycle_db_authority_20260907.py

      - name: Validate existing upload convergence/read authority
        run: python3 scripts/validate_room_upload_realtime_sync_20260907.py

      - name: Validate full NOVA release regression
        run: python3 scripts/validate_nova_release.py

      - name: Validate generated Apps Script JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Validate Apps Script patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before_client="$(sha256sum Client.html | cut -d' ' -f1)"
          before_sync="$(sha256sum RealtimeDailySync.js | cut -d' ' -f1)"
          python3 scripts/patch_room_upload_realtime_sync_20260907.py
          python3 scripts/patch_room_previous_cycle_db_authority_20260907.py
          after_client="$(sha256sum Client.html | cut -d' ' -f1)"
          after_sync="$(sha256sum RealtimeDailySync.js | cut -d' ' -f1)"
          test "$before_client" = "$after_client"
          test "$before_sync" = "$after_sync"

  no-deploy-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation workflow
        uses: actions/checkout@v4
        with:
          ref: perf/room-actions-v16

      - name: Confirm validation workflow cannot deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/nova-cloudrun-validate-only.yml').read_text(encoding='utf-8')
          forbidden = ['gcloud run ' + 'deploy', 'update-' + 'traffic', 'clasp ' + 'push']
          found = [item for item in forbidden if item in text]
          if found:
              raise SystemExit('Validate-only workflow contains deployment commands: ' + ', '.join(found))
          print('PASS: validation workflow has no deployment commands.')
          PY
