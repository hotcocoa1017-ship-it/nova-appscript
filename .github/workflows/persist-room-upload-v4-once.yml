name: Persist Room Upload V4 Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.persist_room_upload_v4_once_20260908'

permissions:
  contents: write

concurrency:
  group: nova-source-persistence-room-upload-v4
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact V4 source patch
        run: |
          set -euo pipefail
          python3 scripts/fix_room_upload_db_first_app_v4_generator_20260907.py
          python3 scripts/patch_room_upload_db_first_app_v4_20260907.py
          python3 scripts/validate_room_upload_realtime_sync_20260907.py
      - name: Persist corrected generator and canonical V4 source
        run: |
          set -euo pipefail
          targets=(scripts/patch_room_upload_db_first_app_v4_20260907.py 09_RoomStatusUpload.js Client.html)
          if git diff --quiet -- "${targets[@]}"; then
            echo 'V4 generator and canonical source already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${targets[@]}"
          git commit -m 'Persist corrected room upload DB-first app V4 [skip ci]'
          git push origin HEAD:main
