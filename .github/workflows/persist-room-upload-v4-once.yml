name: Persist Room Upload V4 Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.persist_room_upload_v4_once_20260908'

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact V4 source patch
        run: |
          set -euo pipefail
          python3 scripts/fix_room_upload_db_first_app_v4_generator_20260907.py
          python3 scripts/patch_room_upload_db_first_app_v4_20260907.py
          python3 scripts/validate_room_upload_realtime_sync_20260907.py
      - name: Commit only canonical V4 source files
        run: |
          set -euo pipefail
          git diff --exit-code -- scripts/patch_room_upload_db_first_app_v4_20260907.py || {
            echo '::error::Generator unexpectedly changed after fix; aborting source persistence.'
            exit 2
          }
          if git diff --quiet -- 09_RoomStatusUpload.js Client.html; then
            echo 'V4 source already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 09_RoomStatusUpload.js Client.html
          git commit -m 'Persist room upload DB-first app V4 [skip ci]'
          git push origin HEAD:main
