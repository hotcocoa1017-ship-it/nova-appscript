name: Fix whole DB validator Next API once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-whole-db-validator-next-api-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align stale auth-route validator only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/validate_whole_db_transition_v2_20260908.py')
          text = path.read_text(encoding='utf-8')
          old = "require(bridge, '/v1/auth/realtime-token', 'existing Realtime auth bridge')"
          new = "require(bridge, '/api/auth/realtime-token', 'existing Realtime auth bridge')"
          if text.count(old) != 1:
              raise SystemExit(f'validator target count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          bridge = Path('DbFirstBridge.js').read_text(encoding='utf-8')
          route = Path('src/app/api/auth/realtime-token/route.ts').read_text(encoding='utf-8')
          assert '/api/auth/realtime-token' in bridge
          assert 'employee_no: user.employeeNo' in route
          assert '/v1/auth/realtime-token' not in bridge
          PY

          python3 scripts/validate_whole_db_transition_v2_20260908.py
          git diff --check
          git diff -- scripts/validate_whole_db_transition_v2_20260908.py

      - name: Commit validator-only correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-whole-db-validator-next-api-once.yml
          git add scripts/validate_whole_db_transition_v2_20260908.py
          git diff --cached --check
          git commit -m 'fix(ci): validate current Next realtime auth route'
          git push origin HEAD:main
