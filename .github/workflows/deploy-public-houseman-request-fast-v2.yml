name: Deploy Public Houseman Request Fast V2

on:
  workflow_run:
    workflows: ["Deploy NOVA Apps Script"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main after generic deployment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply public houseman request fast V2
        run: python3 scripts/patch_public_houseman_request_fast_v2.py

      - name: Validate acceleration scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PUBLIC_HOUSEMAN_REQUEST_FAST_V2" Client.html
          grep -q "PUBLIC_HOUSEMAN_REQUEST_FAST_V2" 10_Mobile.js
          grep -q "PUBLIC_HOUSEMAN_REQUEST_FAST_V2" 12_Shifts.js
          grep -q "function resolveHousemanPublicFastAssignee_" 12_Shifts.js
          grep -q "resolveHousemanPublicFastAssignee_(businessDate, site, roomNo)" 10_Mobile.js
          grep -q "prefetchPublicHousemanAssignment_(roomNo)" Client.html
          grep -q "getPublicHousemanAssignmentFast_(payload)" Client.html
          grep -q "getHousemanOrdersForDate_" 12_Shifts.js

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 10_Mobile.js
          node --check 12_Shifts.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(Client.html 10_Mobile.js 12_Shifts.js)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_public_houseman_request_fast_v2.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist patched sources to main
        shell: bash
        run: |
          set -euo pipefail
          generated=(Client.html 10_Mobile.js 12_Shifts.js)
          if git diff --quiet -- "${generated[@]}"; then
            echo "Public houseman request fast V2 already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${generated[@]}"
            git commit -m "perf: accelerate public houseman request save [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to persist accelerated sources to main."
                exit 1
              fi
              git pull --rebase origin main
              sleep $((attempt * 2))
            done
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA public houseman request fast V2 ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "Public houseman request fast V2 deployed."
          echo "Commit: $GITHUB_SHA"
