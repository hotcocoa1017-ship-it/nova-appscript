name: Validate Roommaid Due-Out Start Guard V2

on:
  push:
    branches: [fix/roommaid-dueout-start-guard-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Roommaid due-out start guard V2
        run: python3 scripts/patch_roommaid_dueout_start_guard_v2.py

      - name: Validate requested policy
        run: python3 scripts/validate_roommaid_dueout_start_guard_v2.py

      - name: Validate existing NOVA release regression
        run: python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 10_Mobile.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for source in ['Client.html', 'RoommaidDueOutGuard.html']:
              text = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No script block found in {source}')
              target = Path('/tmp') / f'{Path(source).stem}.js'
              target.write_text('\n'.join(scripts), encoding='utf-8')
              subprocess.run(['node', '--check', str(target)], check=True)
          PY

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(Client.html 10_Mobile.js RoommaidDueOutGuard.html)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_roommaid_dueout_start_guard_v2.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Summary
        run: echo 'ROOMMAID_DUE_OUT_START_GUARD_V2 validation PASS'
