name: NOVA Cloud Run Deploy

on:
  push:
    branches:
      - perf/room-actions-v16
    paths:
      - 'cloudrun/**'
      - '.github/workflows/nova-cloudrun-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nova-cloudrun-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: perf/room-actions-v16

      - name: Validate Cloud Run source
        run: node --check cloudrun/index.js

      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/nova-github-pool/providers/nova-github
          service_account: 479836905263-compute@developer.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Google Cloud project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ID="$(gcloud projects describe 479836905263 --format='value(projectId)')"
          [[ -n "$PROJECT_ID" ]] || { echo 'Google Cloud project ID not found.' >&2; exit 1; }
          echo "id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Google Cloud project resolved: $PROJECT_ID"

      - name: Deploy nova-realtime-api
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy nova-realtime-api \
            --source ./cloudrun \
            --region asia-southeast1 \
            --project "$PROJECT_ID" \
            --no-traffic \
            --tag nova-candidate \
            --quiet

      - name: Verify Cloud Run revision
        env:
          PROJECT_ID: ${{ steps.project.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_JSON="$RUNNER_TEMP/nova-cloudrun-service.json"
          gcloud run services describe nova-realtime-api \
            --region asia-southeast1 \
            --project "$PROJECT_ID" \
            --format=json > "$SERVICE_JSON"

          CANDIDATE_URL="$(node -e "const s=require(process.argv[1]);const t=(s?.status?.traffic||[]).find(x=>x.tag==='nova-candidate');process.stdout.write(String(t?.url||''));" "$SERVICE_JSON")"
          CANDIDATE_REVISION="$(node -e "const s=require(process.argv[1]);const t=(s?.status?.traffic||[]).find(x=>x.tag==='nova-candidate');process.stdout.write(String(t?.revisionName||''));" "$SERVICE_JSON")"
          [[ -n "$CANDIDATE_URL" && -n "$CANDIDATE_REVISION" ]] || {
            echo 'Cloud Run candidate route was not found.' >&2
            exit 1
          }

          curl -fsSL \
            --max-time 30 \
            --retry 12 \
            --retry-delay 3 \
            --retry-all-errors \
            "$CANDIDATE_URL/healthz" > "$RUNNER_TEMP/nova-cloudrun-candidate-health.json"
          cat "$RUNNER_TEMP/nova-cloudrun-candidate-health.json"
          node - "$RUNNER_TEMP/nova-cloudrun-candidate-health.json" <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (health?.build !== 'phase1-v3.9-houseman-manual-assign') {
            throw new Error('Unexpected NOVA build.');
          }
          if (health?.eventTimeReady !== true) {
            throw new Error('event_time schema is not ready.');
          }
          NODE

          gcloud run services update-traffic nova-realtime-api \
            --region asia-southeast1 \
            --project "$PROJECT_ID" \
            --to-revisions "$CANDIDATE_REVISION=100" \
            --quiet

          URL="$(gcloud run services describe nova-realtime-api --region asia-southeast1 --project "$PROJECT_ID" --format='value(status.url)')"
          [[ -n "$URL" ]] || { echo 'Cloud Run service URL not found.' >&2; exit 1; }
          curl -fsSL \
            --max-time 30 \
            --retry 12 \
            --retry-delay 3 \
            --retry-all-errors \
            "$URL/healthz" > "$RUNNER_TEMP/nova-cloudrun-health.json"
          cat "$RUNNER_TEMP/nova-cloudrun-health.json"
          node - "$RUNNER_TEMP/nova-cloudrun-health.json" <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (health?.build !== 'phase1-v3.9-houseman-manual-assign' || health?.eventTimeReady !== true) {
            throw new Error('Cloud Run production smoke check failed.');
          }
          NODE
          echo "Cloud Run production smoke check: PASS ($CANDIDATE_REVISION)"

      - name: Deployment summary
        run: |
          echo '### NOVA Cloud Run deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Authentication: Workload Identity Federation' >> "$GITHUB_STEP_SUMMARY"
          echo '- Service: nova-realtime-api' >> "$GITHUB_STEP_SUMMARY"
          echo '- Region: asia-southeast1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source validation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production health check: PASS' >> "$GITHUB_STEP_SUMMARY"
