name: Repair Cloud Run Realtime Through WIF

on:
  push:
    branches: [diag/realtime-token-after-secret-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Repair serving revision without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          SERVICE='nova-realtime-api'

          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service.json

          python3 - <<'PY' > /tmp/repair.env
          import json, shlex
          s=json.load(open('/tmp/service.json'))
          status=s.get('status') or {}
          print('LATEST_CREATED='+shlex.quote(str(status.get('latestCreatedRevisionName') or '')))
          print('LATEST_READY='+shlex.quote(str(status.get('latestReadyRevisionName') or '')))

          containers=((s.get('spec') or {}).get('template') or {}).get('spec',{}).get('containers',[])
          if not containers:
              containers=(s.get('template') or {}).get('containers',[])
          envs=containers[0].get('env',[]) if containers else []
          by={str(e.get('name','')):e for e in envs}

          def literal(name):
              e=by.get(name) or {}
              return str(e.get('value') or '')

          jwt=literal('SUPABASE_JWT_SECRET')
          url=literal('SUPABASE_URL')
          key=literal('SUPABASE_PUBLISHABLE_KEY')
          print('JWT='+shlex.quote(jwt))
          print('SBURL='+shlex.quote(url))
          print('SBKEY='+shlex.quote(key))
          print('JWT_PRESENT='+('Y' if jwt else 'N'))
          print('URL_PRESENT='+('Y' if url else 'N'))
          print('KEY_PRESENT='+('Y' if key else 'N'))
          PY

          # shellcheck disable=SC1091
          source /tmp/repair.env
          echo "LATEST_CREATED=$LATEST_CREATED"
          echo "LATEST_READY=$LATEST_READY"
          echo "TEMPLATE_SUPABASE_URL=$URL_PRESENT"
          echo "TEMPLATE_SUPABASE_PUBLISHABLE_KEY=$KEY_PRESENT"
          echo "TEMPLATE_SUPABASE_JWT_SECRET=$JWT_PRESENT"

          if [ "$JWT_PRESENT" != 'Y' ] || [ "$URL_PRESENT" != 'Y' ] || [ "$KEY_PRESENT" != 'Y' ]; then
            echo 'REPAIR_ABORT_TEMPLATE_ENV_MISSING'
            exit 20
          fi

          SUFFIX="rtfix$(date +%H%M%S)"
          gcloud run services update "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --update-env-vars="SUPABASE_URL=$SBURL,SUPABASE_PUBLISHABLE_KEY=$SBKEY,SUPABASE_JWT_SECRET=$JWT" \
            --revision-suffix="$SUFFIX" \
            --quiet

          unset JWT SBURL SBKEY

          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT" \
            --region="$REGION" \
            --to-latest=100 \
            --quiet

          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/after.json
          python3 - <<'PY'
          import json, subprocess
          s=json.load(open('/tmp/after.json'))
          status=s.get('status') or {}
          latest=status.get('latestReadyRevisionName') or ''
          print('AFTER_LATEST_READY='+latest)
          for t in status.get('traffic') or []:
              print('AFTER_TRAFFIC='+str(t.get('revisionName','LATEST'))+':'+str(t.get('percent',0)))
          if not latest:
              raise SystemExit('latest ready revision missing')
          raw=subprocess.check_output(['gcloud','run','revisions','describe',latest,'--project=project-6a8144e9-31f3-4d5c-b9b','--region=asia-southeast1','--format=json'], text=True)
          r=json.loads(raw)
          containers=(r.get('spec') or {}).get('containers',[])
          envs=containers[0].get('env',[]) if containers else []
          by={str(e.get('name','')):e for e in envs}
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']:
              e=by.get(name)
              state='MISSING' if not e else ('SECRET_REF' if e.get('valueFrom') or e.get('valueSource') else ('SET' if str(e.get('value','')).strip() else 'EMPTY'))
              print('AFTER_'+name+'='+state)
          PY

          echo 'CLOUD_RUN_REALTIME_REPAIR_DONE'
