name: NOVA Core 3 Cloud Run Dev Preflight

on:
  push:
    branches:
      - nova-core3-room-state-20260906
    paths:
      - '.github/workflows/core3-cloudrun-preflight.yml'
      - 'core3/server/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nova-core3-cloudrun-dev-preflight
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: project-6a8144e9-31f3-4d5c-b9b
  GCP_REGION: asia-southeast1
  SOURCE_SERVICE: nova-realtime-api
  TARGET_SERVICE: nova-core3-api-dev

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with existing NOVA WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate isolated dev deployment prerequisites
        shell: bash
        run: |
          set -euo pipefail

          gcloud run services describe "$SOURCE_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > /tmp/source-service.json

          python3 - <<'PY'
          import json, sys
          s=json.load(open('/tmp/source-service.json'))
          template=((s.get('spec') or {}).get('template') or {}).get('spec') or {}
          containers=template.get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')): e for e in envs}
          for name in ('SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY'):
              e=by.get(name)
              if not e:
                  print(f'::error::{name} is missing from source Cloud Run service.', file=sys.stderr)
                  sys.exit(20)
              if str(e.get('value','')).strip():
                  mode='VALUE'
              elif e.get('valueFrom') or e.get('valueSource'):
                  mode='SECRET_REF'
              else:
                  print(f'::error::{name} has no usable value/reference.', file=sys.stderr)
                  sys.exit(21)
              print(f'{name}_MODE={mode}')
          print('SOURCE_ENV_PREFLIGHT=OK')
          PY

          if gcloud run services describe "$TARGET_SERVICE" \
              --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(metadata.name)' \
              >/tmp/target-name.txt 2>/tmp/target-error.txt; then
            echo "TARGET_SERVICE_STATE=EXISTS"
            cat /tmp/target-name.txt
          else
            echo "TARGET_SERVICE_STATE=ABSENT"
          fi

          gcloud config set project "$GCP_PROJECT_ID" >/dev/null
          gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .
          echo 'CORE3_CLOUDRUN_WIF=OK'

      - name: Re-run Core server tests before any future dev deploy
        working-directory: core3/server
        run: |
          npm run check
          npm test

      - name: Build container locally in CI
        run: docker build -t nova-core3-preflight core3/server
