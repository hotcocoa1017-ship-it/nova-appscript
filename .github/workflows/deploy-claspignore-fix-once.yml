name: Deploy claspignore fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-claspignore-fix-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Apps Script deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-apps-script.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f deploy=true
