name: NOVA Core 3 Flutter Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - nova-core3-room-state-20260906
    paths:
      - '.github/workflows/core3-mobile-scaffold.yml'
      - 'core3/mobile/nova_mobile/pubspec.yaml'

permissions:
  contents: write

concurrency:
  group: nova-core3-flutter-scaffold
  cancel-in-progress: true

jobs:
  generate-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova-core3-room-state-20260906

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate official Flutter Android and iOS scaffolds
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          flutter create \
            --platforms=android,ios \
            --org=kr.co.novaworks \
            --project-name=nova_mobile \
            "$TMP/nova_mobile"
          rm -rf core3/mobile/nova_mobile/android core3/mobile/nova_mobile/ios
          cp -R "$TMP/nova_mobile/android" core3/mobile/nova_mobile/android
          cp -R "$TMP/nova_mobile/ios" core3/mobile/nova_mobile/ios
          cp "$TMP/nova_mobile/.metadata" core3/mobile/nova_mobile/.metadata

      - name: Commit generated platform scaffolds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NOVA Core 3 Automation'
          git config user.email 'nova-core3@users.noreply.github.com'
          git add core3/mobile/nova_mobile/android core3/mobile/nova_mobile/ios core3/mobile/nova_mobile/.metadata
          if git diff --cached --quiet; then
            echo 'Flutter platform scaffolds already current.'
            exit 0
          fi
          git commit -m 'Generate Flutter Android and iOS platform scaffolds'
          git push origin HEAD:nova-core3-room-state-20260906
