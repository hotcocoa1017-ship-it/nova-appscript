name: Apply NOVA Runtime Performance V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_runtime_performance_v1_20260908'

permissions:
  contents: write
  actions: write

concurrency:
  group: nova-runtime-performance-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch indicator full reconcile interval only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client = Path('Client.html')
          s = client.read_text(encoding='utf-8')
          old_comment = "    // 시작/복귀 즉시 현재 DB 전체상태를 1회 맞추고, 이후 Broadcast + 2.5초 이벤트 + 15초 전체보정을 병행합니다."
          new_comment = "    // 시작/복귀 즉시 현재 DB 전체상태를 1회 맞추고, 이후 Broadcast + 2.5초 이벤트 + 60초 전체보정을 병행합니다. // INDICATOR_FULL_RECONCILE_PERF_V1"
          if old_comment not in s and 'INDICATOR_FULL_RECONCILE_PERF_V1' not in s:
              raise SystemExit('Expected indicator reconcile comment not found')
          s = s.replace(old_comment, new_comment, 1)
          old_interval = ">= 15000;"
          new_interval = ">= 60000; // INDICATOR_FULL_RECONCILE_PERF_V1"
          if old_interval not in s and new_interval not in s:
              raise SystemExit('Expected 15s reconcile interval not found')
          if old_interval in s:
              if s.count(old_interval) != 1:
                  raise SystemExit(f'Unexpected 15s interval count: {s.count(old_interval)}')
              s = s.replace(old_interval, new_interval, 1)
          client.write_text(s, encoding='utf-8')

          validator = Path('scripts/validate_room_state_sync_hardening_20260906.py')
          v = validator.read_text(encoding='utf-8')
          old_check = "    ('indicator full reconcile every 15s', '>= 15000' in text),"
          new_check = "    ('indicator full reconcile every 60s', '>= 60000' in text and 'INDICATOR_FULL_RECONCILE_PERF_V1' in text),"
          if old_check not in v and new_check not in v:
              raise SystemExit('Expected room-state validator interval check not found')
          v = v.replace(old_check, new_check, 1)
          validator.write_text(v, encoding='utf-8')
          PY

      - name: Validate focused and release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_room_state_sync_hardening_20260906.py
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_nova_release.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Client.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No Client script block')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          git diff --check

      - name: Commit minimal runtime tuning
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html scripts/validate_room_state_sync_hardening_20260906.py; then
            echo 'Runtime performance patch already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Client.html scripts/validate_room_state_sync_hardening_20260906.py
            git commit -m 'Tune indicator full reconcile interval [skip ci]'
            git push origin HEAD:main
          fi

      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-apps-script.yml/dispatches" \
            -d '{"ref":"main","inputs":{"deploy":"true"}}'
