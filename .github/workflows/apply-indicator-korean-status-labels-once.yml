name: Apply Indicator Korean Status Labels Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-indicator-korean-status-labels-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused display patch
        run: python3 scripts/patch_indicator_korean_status_labels_20260909.py
      - name: Validate requested behavior and regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "INDICATOR_KOREAN_STATUS_FALLBACK_V1" Client.html
          grep -q "VACANT_CLEAN: '공실'" Client.html
          grep -q "DUE_OUT: '퇴실예정'" Client.html
          grep -q "QM_WAITING: 'QM대기'" Client.html
          python3 scripts/validate_site_scope_indicator_close_v2.py
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_room_upload_db_first_v4_20260907.py
          python3 scripts/validate_nova_release.py
      - name: Validate Client JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Client.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Client.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore Korean room status labels [skip ci]"
            git push origin HEAD:main
          fi
      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy=true
