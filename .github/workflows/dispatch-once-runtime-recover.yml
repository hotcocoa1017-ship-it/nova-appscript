name: Dispatch Runtime Recovery Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-once-runtime-recover.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Apps Script deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --repo hotcocoa1017-ship-it/nova-appscript --ref main -f deploy=true
