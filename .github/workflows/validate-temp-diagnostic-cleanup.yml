name: Validate Temporary Diagnostic Cleanup

on:
  push:
    branches: [cleanup/temp-realtime-diagnostic-20260829]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --check 04_Api.js
          test ! -f RealtimeDiagnostics.js
          ! grep -q "nova_diag" 04_Api.js
          ! grep -q "runNovaRealtimeLiveDiagnostic_" 04_Api.js
          grep -q "createTemplateFromFile('Index')" 04_Api.js
      - name: Run production regression gate
        run: python3 scripts/validate_nova_release.py
