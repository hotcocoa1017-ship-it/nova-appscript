name: Dispatch Monthly QM Status V2 Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-monthly-qm-status-v2-deploy-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected production Apps Script deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-apps-script.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f deploy=true
