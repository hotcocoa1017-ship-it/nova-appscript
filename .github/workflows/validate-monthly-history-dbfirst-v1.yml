name: Validate Monthly History DB First V1

on:
  push:
    branches:
      - feat/full-db-houseman-ui-20260907
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Apply monthly DB-first patch
        run: python3 scripts/patch_monthly_history_dbfirst_v1.py

      - name: Apply operation-settings read DB-first patch
        run: python3 scripts/patch_operation_settings_read_dbfirst_v1.py

      - name: Apply roommaid performance DB-first patch
        run: python3 scripts/patch_roommaid_performance_dbfirst_v1.py

      - name: Validate markers and safety gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MONTHLY_HISTORY_DB_FIRST_V1' 11_Monthly.js
          grep -q 'readMonthlyHistoryRowsDbFirst_' 11_Monthly.js
          grep -q 'monthlyHistoryDbDateRange_' 11_Monthly.js
          grep -q 'novaMonthlyHistoryDbRead_' 11_Monthly.js
          grep -q 'MONTHLY_HISTORY_DB_FIRST_V1' MonthlyDbFirstServer.js
          grep -q 'nova_monthly_history_v1' db/monthly_history_db_first_v1.sql
          grep -q 'OPERATION_SETTINGS_READ_DB_FIRST_V1' RealtimeDbFirstServer.js
          grep -q 'OPERATION_SETTINGS_READ_DB_FIRST_V1' 15_AdminSettings.js
          grep -q 'operationDb: operationDb ?' 15_AdminSettings.js
          grep -q 'nova_operation_settings_read_v1' db/operation_settings_read_v1.sql
          grep -q 'ROOMMAID_PERFORMANCE_DB_FIRST_V1' 17_RoommaidPerformance.js
          grep -q 'ROOMMAID_PERFORMANCE_DB_FIRST_V1' RoommaidPerformanceDbFirstServer.js
          grep -q 'readRoommaidPerformanceHistoryDbFirst_(request, token)' 17_RoommaidPerformance.js
          grep -q 'readMonthlyHistoryRowsDbFirst_(request, \[NOVA.RECORD_TYPES.CLEANING\], token)' RoommaidPerformanceDbFirstServer.js
          python3 - <<'PY'
          from pathlib import Path
          text = Path('11_Monthly.js').read_text(encoding='utf-8')
          assert "const dbReplaceTypes = new Set([" in text
          replace_block = text[text.index('const dbReplaceTypes = new Set(['):text.index(']);', text.index('const dbReplaceTypes = new Set(['))]
          assert "NOVA.RECORD_TYPES.HOUSEMAN_ORDER" not in replace_block
          assert "return keptSheet.concat(dbRows);" in text
          assert "rowNumber: -(index + 1)" in text
          admin = Path('15_AdminSettings.js').read_text(encoding='utf-8')
          assert 'operationDb && operationDb.confirmed === true' in admin
          perf = Path('17_RoommaidPerformance.js').read_text(encoding='utf-8')
          bridge = Path('RoommaidPerformanceDbFirstServer.js').read_text(encoding='utf-8')
          assert 'readRoommaidPerformanceHistoryDbFirst_(request, token)' in perf
          assert 'readMonthlyHistoryRows_(request, [NOVA.RECORD_TYPES.CLEANING])' not in perf
          assert "if (role !== 'ROOMMAID')" in bridge
          assert 'readMonthlyHistoryRowsDbFirst_(request, [NOVA.RECORD_TYPES.CLEANING], token)' in bridge
          assert "nova_roommaid_performance_history_v1" in bridge
          assert 'return keptSheet.concat(dbRows);' in bridge
          print('reporting DB hybrid gates and current roommaid performance bridge OK')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check 11_Monthly.js
          node --check MonthlyDbFirstServer.js
          node --check RealtimeDbFirstServer.js
          node --check 15_AdminSettings.js
          node --check 17_RoommaidPerformance.js
          node --check RoommaidPerformanceDbFirstServer.js

      - name: Validate NOVA regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum 11_Monthly.js RealtimeDbFirstServer.js 15_AdminSettings.js 17_RoommaidPerformance.js RoommaidPerformanceDbFirstServer.js | sha256sum | awk '{print $1}')"
          python3 scripts/patch_monthly_history_dbfirst_v1.py
          python3 scripts/patch_operation_settings_read_dbfirst_v1.py
          python3 scripts/patch_roommaid_performance_dbfirst_v1.py
          after="$(sha256sum 11_Monthly.js RealtimeDbFirstServer.js 15_AdminSettings.js 17_RoommaidPerformance.js RoommaidPerformanceDbFirstServer.js | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated reporting DB-first sources
        shell: bash
        run: |
          set -euo pipefail
          files=(11_Monthly.js RealtimeDbFirstServer.js 15_AdminSettings.js 17_RoommaidPerformance.js RoommaidPerformanceDbFirstServer.js)
          if git diff --quiet -- "${files[@]}"; then
            echo 'Validated reporting DB-first sources already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Persist reporting DB-first reads v1 [skip ci]'
          git push origin HEAD:feat/full-db-houseman-ui-20260907
