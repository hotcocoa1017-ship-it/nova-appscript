name: Drain archive queue through WORK_HISTORY

on:
  push:
    branches:
      - test/dbfirst-1000-20260905
    paths:
      - .github/workflows/drain-archive-to-work-history-20260905.yml

permissions:
  contents: read

jobs:
  drain-to-work-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Drain queued archives until WORK_HISTORY canary is verified
        shell: bash
        run: |
          set -euo pipefail
          EDGE_URL="https://evoetxfjmkkjptucwxsv.supabase.co/functions/v1/nova-archive-worker-v1"
          SUPABASE_ANON_KEY="$(sed -n 's/^[[:space:]]*SUPABASE_ANON_KEY:[[:space:]]*//p' .github/workflows/validate-dbfirst-1000-20260905.yml | head -n 1)"
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Could not read existing Supabase anon key"
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ANON_KEY"

          target_found=0
          for attempt in $(seq 1 20); do
            body_file="$(mktemp)"
            code=$(curl --silent --show-error --max-time 120 \
              --output "$body_file" --write-out '%{http_code}' \
              -X POST "$EDGE_URL" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H 'Content-Type: application/json' \
              --data '{}')

            cat "$body_file"
            echo
            if [ "$code" != "200" ]; then
              echo "HTTP $code"
              exit 1
            fi

            marker=$(node - "$body_file" <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!data.ok) throw new Error(`archive worker failed: ${JSON.stringify(data)}`);
          if (!data.processed) {
            console.log('NO_JOB');
            process.exit(0);
          }
          if (!data.verified || !data.hotDataRetained || !(Number(data.rowCount) > 0) || !data.batchId || !data.objectPath || !data.checksumSha256) {
            throw new Error(`archive result incomplete: ${JSON.stringify(data)}`);
          }
          const isTarget = data.sourceType === 'WORK_HISTORY' && data.businessDate === '2026-09-03' && data.site === '쏘라노';
          console.log(isTarget ? 'TARGET' : 'CONTINUE');
          NODE
          )

            if [ "$marker" = "TARGET" ]; then
              target_found=1
              echo "WORK_HISTORY_ARCHIVE_CANARY_SUCCESS"
              break
            fi
            if [ "$marker" = "NO_JOB" ]; then
              echo "WORK_HISTORY target was not reached before the queue became empty"
              exit 1
            fi
          done

          if [ "$target_found" != "1" ]; then
            echo "WORK_HISTORY target was not reached within 20 archive jobs"
            exit 1
          fi
