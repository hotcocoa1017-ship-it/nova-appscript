name: Apply NOVA PWA Bridge Alias Compatibility V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_pwa_bridge_alias_compat_v1_20260908'

permissions:
  contents: write

concurrency:
  group: nova-pwa-bridge-alias-compat-v1
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Patch exact PWA bridge origins only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('NotificationCenterV1.html')
          s=p.read_text(encoding='utf-8')
          old="const PWA_ORIGIN='https://nova-pwa-hotcocoa1017-3826.vercel.app'; // NOVA_PWA_WEB_PUSH_V2"
          new="const PWA_ORIGINS=Object.freeze(['https://nova-pwa-hotcocoa1017-3826.vercel.app','https://nova-pwa-orpin.vercel.app']); // NOVA_PWA_WEB_PUSH_V2_ALIAS_COMPAT_V1"
          if old not in s:
              raise SystemExit('PWA_ORIGIN anchor not found')
          s=s.replace(old,new,1)
          old_block="""function pushBridge(){
            if(!U.auth||!U.employee||window.top===window)return;
            try{
              window.top.postMessage({
                type:'NOVA_PUSH_BRIDGE_V2',
                supabaseUrl:String(U.auth.supabaseUrl||''),
                publishableKey:String(U.auth.publishableKey||''),
                token:String(U.auth.token||''),
                employeeNo:String(U.employee||''),
                unread:Number(U.unread||0)
              },PWA_ORIGIN);
            }catch(_){ }
          }
          """
          new_block="""function pushBridge(){
            if(!U.auth||!U.employee||window.top===window)return;
            const payload={
              type:'NOVA_PUSH_BRIDGE_V2',
              supabaseUrl:String(U.auth.supabaseUrl||''),
              publishableKey:String(U.auth.publishableKey||''),
              token:String(U.auth.token||''),
              employeeNo:String(U.employee||''),
              unread:Number(U.unread||0)
            };
            PWA_ORIGINS.forEach(origin=>{try{window.top.postMessage(payload,origin)}catch(_){ }});
          }
          """
          if old_block not in s:
              raise SystemExit('pushBridge anchor not found')
          s=s.replace(old_block,new_block,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'NOVA_PWA_WEB_PUSH_V2_ALIAS_COMPAT_V1' NotificationCenterV1.html
          grep -q 'nova-pwa-orpin.vercel.app' NotificationCenterV1.html
          if grep -q '},PWA_ORIGIN);' NotificationCenterV1.html; then exit 2; fi

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('NotificationCenterV1.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          if not scripts: raise SystemExit('No script block')
          Path('/tmp/NovaNotificationCenter.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/NovaNotificationCenter.js

      - name: Persist minimal source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add NotificationCenterV1.html
          git diff --cached --quiet && { echo 'Patch already present'; exit 0; }
          git commit -m 'Support both NOVA PWA production aliases'
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo '::error::Apps Script OAuth secret missing'; exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Deploy existing NOVA web app
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "NOVA PWA bridge alias compatibility v1 ${GITHUB_SHA::12}"
