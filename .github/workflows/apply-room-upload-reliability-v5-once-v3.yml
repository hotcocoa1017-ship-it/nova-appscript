name: Apply room upload reliability V5 once v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-room-upload-reliability-v5-once-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-room-upload-reliability-v5
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused reliability patch
        run: |
          python3 scripts/patch_room_upload_reliability_v5_20260910.py
          python3 scripts/patch_room_upload_reliability_v5_followup_20260910.py

      - name: Validate focused and existing invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_room_upload_reliability_v5_20260910.py
          python3 scripts/validate_room_upload_db_first_v4_20260907.py
          python3 scripts/validate_room_upload_realtime_sync_20260907.py
          python3 scripts/validate_room_state_sync_hardening_20260906.py
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 09_RoomStatusUpload.js
          node --check RealtimeDailySync.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Client.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts: raise SystemExit('No Client script block')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          python3 -m py_compile scripts/validate_room_upload_realtime_sync_20260907.py

      - name: Verify minimal patch scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(09_RoomStatusUpload\.js|Client\.html|RealtimeDailySync\.js|scripts/validate_room_upload_realtime_sync_20260907\.py)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected changed files"
            printf '%s\n' "$unexpected"
            exit 2
          fi
          test -n "$changed"

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NOVA Automation'
          git config user.email 'nova-automation@users.noreply.github.com'
          git add 09_RoomStatusUpload.js Client.html RealtimeDailySync.js scripts/validate_room_upload_realtime_sync_20260907.py
          git commit -m 'Harden room upload recovery and mirror safety [skip ci]'
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret missing"
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Check Apps Script version capacity
        shell: bash
        run: |
          set -euo pipefail
          versions="$(clasp versions)"
          printf '%s\n' "$versions"
          count="$(printf '%s\n' "$versions" | grep -Ec '^[[:space:]]*[0-9]+[[:space:]]*-' || true)"
          echo "Apps Script versions: ${count}/200"
          test "$count" -lt 200

      - name: Deploy production Apps Script
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "NOVA room upload reliability V5 ${GITHUB_SHA::12}"

      - name: Summary
        run: echo 'Room upload reliability V5 passed all gates, was committed, and production deployment was updated.'
