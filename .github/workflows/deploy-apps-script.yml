name: Deploy NOVA Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf
  GCP_PROJECT_ID: project-6a8144e9-31f3-4d5c-b9b
  GCP_REGION: asia-southeast1
  CLOUD_RUN_REALTIME_SERVICE: nova-realtime-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud preflight
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud preflight
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate Cloud Run Realtime production preflight
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_REALTIME_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/nova-cloudrun-service.json

          ACTIVE_REV="$(python3 - <<'PY'
          import json, sys
          s=json.load(open('/tmp/nova-cloudrun-service.json'))
          status=s.get('status') or {}
          active=[]
          for t in status.get('traffic') or []:
              pct=int(t.get('percent') or 0)
              rev=str(t.get('revisionName') or '')
              if pct>0:
                  active.append((rev,pct))
          if len(active)!=1 or active[0][1]!=100 or not active[0][0]:
              print('::error::Cloud Run Realtime traffic must point 100% to one explicit revision.', file=sys.stderr)
              for rev,pct in active:
                  print(f'active_revision={rev or "UNKNOWN"} traffic={pct}%', file=sys.stderr)
              sys.exit(20)
          print(active[0][0])
          PY
          )"
          echo "Cloud Run active revision: $ACTIVE_REV"

          gcloud run revisions describe "$ACTIVE_REV" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format=json > /tmp/nova-cloudrun-revision.json

          python3 - <<'PY'
          import json, sys
          r=json.load(open('/tmp/nova-cloudrun-revision.json'))
          conditions=(r.get('status') or {}).get('conditions') or []
          ready=any(c.get('type')=='Ready' and str(c.get('status'))=='True' for c in conditions)
          if not ready:
              print('::error::Active Cloud Run Realtime revision is not Ready.', file=sys.stderr)
              sys.exit(21)
          containers=(r.get('spec') or {}).get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')):e for e in envs}
          required=['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']
          missing=[]
          for name in required:
              e=by.get(name)
              present=bool(e and (e.get('valueFrom') or e.get('valueSource') or str(e.get('value','')).strip()))
              print(f'{name}=' + ('CONFIGURED' if present else 'MISSING'))
              if not present: missing.append(name)
          if missing:
              print('::error::Cloud Run Realtime configuration missing: '+','.join(missing), file=sys.stderr)
              sys.exit(22)
          print('CLOUD_RUN_REALTIME_ENV=OK')
          PY

          SERVICE_URL="$(python3 - <<'PY'
          import json
          s=json.load(open('/tmp/nova-cloudrun-service.json'))
          print((s.get('status') or {}).get('url') or '')
          PY
          )"
          test -n "$SERVICE_URL"
          HEALTH_HTTP="$(curl -sS --retry 2 --retry-delay 1 -o /tmp/nova-cloudrun-health.json -w '%{http_code}' "$SERVICE_URL/health")"
          echo "Cloud Run health HTTP: $HEALTH_HTTP"
          test "$HEALTH_HTTP" = "200"
          python3 - <<'PY'
          import json, sys
          try:
              body=json.load(open('/tmp/nova-cloudrun-health.json'))
          except Exception:
              body={}
          if body.get('ok') is not True:
              print('::error::Cloud Run Realtime health response is not ok.', file=sys.stderr)
              sys.exit(23)
          build=str(body.get('build') or body.get('version') or '')
          if not build:
              print('::error::Cloud Run Realtime health build identifier is empty.', file=sys.stderr)
              sys.exit(24)
          print('Cloud Run health build: '+build)
          print('CLOUD_RUN_REALTIME_PREFLIGHT=OK')
          PY

      - name: Apply stable Realtime init hotfix
        run: python3 scripts/patch_realtime_client.py

      - name: Apply Realtime subscription resilience patch
        run: python3 scripts/patch_realtime_subscription_resilience.py

      - name: Apply QM lazy browse patch
        run: python3 scripts/patch_qm_mobile_browse.py

      - name: Apply QM browse filter and inspection patch
        run: python3 scripts/patch_qm_mobile_browse_v2.py

      - name: Apply QM immediate checklist hotfix
        run: python3 scripts/patch_qm_immediate_checklist.py

      - name: Apply QM roommaid display-name patch
        run: python3 scripts/patch_qm_roommaid_name_display.py

      - name: Apply QM notification bell patch
        run: python3 scripts/patch_qm_notification_bell.py

      - name: Apply Roommaid notification bell patch
        run: python3 scripts/patch_roommaid_notification_bell.py

      - name: Apply Realtime assignment batch merge patch
        run: python3 scripts/patch_realtime_assignment_batch_merge.py

      - name: Validate full Realtime routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q "API 설정과 보조 Realtime 연결을 분리해 고속 API 유지" Client.html
          grep -q "REALTIME_SUBSCRIPTION_RESILIENCE_V1" Client.html
          grep -q "await novaRealtime_.supabase.realtime.setAuth(auth.token)" Client.html
          grep -q "'CLEANING_RESET', 'ASSIGN_ROOMMAID', 'QM_ASSIGN', 'QM_START', 'QM_COMPLETE', 'QM_REWORK', 'UPDATE_ROOM_OPERATION_STATUS', 'UPDATE_OPERATION_FLAGS', 'CLEAR_ASSIGNMENT'" Client.html
          grep -q "updateRoomOperationalStatusSafe" Client.html
          grep -q "action === 'ASSIGN_ROOMMAID'" RealtimeDailySync.js
          grep -q "action === 'UPDATE_ROOM_OPERATION_STATUS'" RealtimeDailySync.js
          grep -q "action === 'QM_ASSIGN'" RealtimeDailySync.js
          grep -q "action === 'CHANGE_ROOM_STATUS'" RealtimeDailySync.js
          grep -q "REALTIME_ASSIGNMENT_BATCH_MERGE_V1" RealtimeDailySync.js
          grep -q "QM 추가조회 탭 · 기존 점검대상 화면 보존" Client.html
          grep -q "QM 추가탭 동·층 필터 + 안전 즉시점검" Client.html
          grep -q "QM 추가탭 체크리스트 즉시노출 v1" Client.html
          grep -q "QM 점검대상 정비자 이름 보존 v1" Client.html
          grep -q "function getQmMobileBrowseRooms" QmMobileBrowse.js
          grep -q "function startQmMobileBrowseInspection" QmMobileBrowse.js
          grep -q "data-qm-browse-inspect" Client.html
          grep -q "qmBrowseLocationFilters" Client.html
          grep -q "QM_NOTIFICATION_BELL_V1" HousemanUiPerformancePatch.html
          grep -q "ROOMMAID_NOTIFICATION_BELL_V1" HousemanUiPerformancePatch.html
          grep -q "S.mode==='QM'" HousemanUiPerformancePatch.html
          grep -q "S.mode==='ROOMMAID'" HousemanUiPerformancePatch.html
          grep -q "function qmItem" HousemanUiPerformancePatch.html
          grep -q "function roommaidItem" HousemanUiPerformancePatch.html
          if grep -q "include_('OperationalStatusHotfix')" Index.html; then
            echo "::error::OperationalStatusHotfix must not intercept the Realtime path."
            exit 2
          fi
          if grep -q "addEventListener('click',onOperationalStatusClickCapture,true)" HousemanUiPerformancePatch.html; then
            echo "::error::Houseman UI patch must not intercept operational-status clicks."
            exit 2
          fi

      - name: Validate production release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check RealtimeDailySync.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for source, target in [
              ('Client.html', '/tmp/NovaClient.js'),
              ('HousemanUiPerformancePatch.html', '/tmp/NovaNotification.js'),
          ]:
              text = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No script block found in {source}')
              Path(target).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          node --check /tmp/NovaNotification.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html HousemanUiPerformancePatch.html RealtimeDailySync.js | sha256sum | awk '{print $1}')"
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          after="$(sha256sum Client.html HousemanUiPerformancePatch.html RealtimeDailySync.js | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist generated production sources to main
        shell: bash
        run: |
          set -euo pipefail
          generated=(Client.html HousemanUiPerformancePatch.html RealtimeDailySync.js)
          if git diff --quiet -- "${generated[@]}"; then
            echo "Generated production sources already match repository source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated[@]}"
          git commit -m "Persist generated NOVA production patches [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::warning::Could not persist generated production sources to main. Deployment will continue with the validated patched workspace."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing. Add repository secret CLASPRC_JSON (or CLASPRC_JSON_B64)."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA automated deploy ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "NOVA Apps Script source pushed and existing web app deployment updated."
          echo "Commit: $GITHUB_SHA"
