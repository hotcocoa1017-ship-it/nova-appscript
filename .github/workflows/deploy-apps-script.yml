name: Deploy NOVA Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy validated sources to the existing Apps Script web app'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

# NOVA_CANONICAL_CI_V2
# main is the canonical production source. CI validates source as-is and never reapplies historical patch generators.
# Validation is read-only; historical patch generators are retained only as manual recovery history.
# ROOM_UPLOAD_NETWORK_FALLBACK_DEPLOY_ONCE_V1: exact deploy commit message is temporary and removed after deployment.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate critical Realtime source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "REALTIME_SUBSCRIPTION_RESILIENCE_V1" Client.html
          grep -q "QM_CLEAR_DB_FIRST_V2" Client.html
          grep -q "ROOM_PREVIOUS_CYCLE_DB_AUTHORITY_V1" Client.html
          grep -q "CHECKOUT_DB_FIRST_CLIENT_V1" Client.html
          grep -q "ROOM_UPLOAD_REALTIME_CONVERGENCE_V1" Client.html
          grep -q "nova_room_upload_apply_v5" Client.html
          grep -q "ROOM_UPLOAD_DURABLE_MIRROR_RECOVERY_V1" Client.html
          grep -q "ROOM_UPLOAD_NETWORK_FALLBACK_V1" RoomUploadNetworkFallback.js
          grep -q "ROOM_UPLOAD_NETWORK_FALLBACK_V1" RoomUploadNetworkFallbackClient.html
          grep -q "include_('RoomUploadNetworkFallbackClient')" Index.html
          grep -q "QM_MODAL_CLOSE_DRAFT_DB_FIRST_V1" Client.html
          grep -q "ROOM_OPERATION_FLAGS_FORWARD_SYNC_V2" RealtimeDailySync.js
          grep -q "QM_CLEAR_EVENT_MIRROR_V2" RealtimeDailySync.js
          grep -q "REALTIME_ASSIGNMENT_BATCH_MERGE_V1" RealtimeDailySync.js
          if grep -q "include_('OperationalStatusHotfix')" Index.html; then
            echo "::error::OperationalStatusHotfix must not intercept the Realtime path."
            exit 2
          fi
          if grep -q "addEventListener('click',onOperationalStatusClickCapture,true)" HousemanUiPerformancePatch.html; then
            echo "::error::Houseman UI patch must not intercept operational-status clicks."
            exit 2
          fi

      - name: Validate DB-first and operational invariants
        shell: bash
        run: |
          set -euo pipefail
          validators=(
            scripts/validate_qm_start_dbfirst_direct_20260905.py
            scripts/validate_qm_end_to_end_accel_20260906.py
            scripts/validate_qm_houseman_dbfirst_20260906.py
            scripts/validate_room_state_sync_hardening_20260906.py
            scripts/validate_qm_clear_dbfirst_operation_flags_20260907.py
            scripts/validate_room_previous_cycle_db_authority_20260907.py
            scripts/validate_room_upload_db_first_v4_20260907.py
            scripts/validate_room_upload_reliability_v5_20260910.py
            scripts/validate_room_upload_network_fallback_v1_20260914.py
            scripts/validate_checkout_dbfirst_20260907.py
            scripts/validate_room_upload_realtime_sync_20260907.py
            scripts/validate_qm_finalize_dbfirst_v2_20260907.py
            scripts/validate_qm_finalize_preflight_v2_20260907.py
            scripts/validate_site_scope_indicator_close_v2.py
            scripts/validate_order_site_context_v1.py
            scripts/validate_whole_db_transition_v2_20260908.py
            scripts/validate_admin_operation_settings_dbfirst_v1_20260908.py
            scripts/validate_admin_code_settings_dbfirst_v1_20260908.py
            scripts/validate_qm_checklist_definition_shape_v1_20260908.py
            scripts/validate_qm_checklist_codes_dbfirst_v1_20260908.py
            scripts/validate_indicator_houseman_order_ui_20260908.py
            scripts/validate_roommaid_close_single_bundle_v5_20260909.py
          )
          for validator in "${validators[@]}"; do
            echo "==> ${validator}"
            python3 "$validator"
          done

      - name: Validate production release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
          python3 - <<'PY'
          from pathlib import Path
          import re
          pairs = [
              ('Client.html', '/tmp/NovaClient.js'),
              ('RoomUploadNetworkFallbackClient.html', '/tmp/NovaRoomUploadNetworkFallback.js'),
              ('HousemanUiPerformancePatch.html', '/tmp/NovaNotification.js'),
              ('NotificationCenterV1.html', '/tmp/NovaNotificationCenter.js'),
          ]
          for source, target in pairs:
              text = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No script block found in {source}')
              Path(target).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          node --check /tmp/NovaRoomUploadNetworkFallback.js
          node --check /tmp/NovaNotification.js
          node --check /tmp/NovaNotificationCenter.js

      - name: Verify validators are read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Validation modified canonical repository source."
            git status --short
            git diff -- . || true
            exit 2
          fi

      - name: Setup Node
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing. Add repository secret CLASPRC_JSON (or CLASPRC_JSON_B64)."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Check Apps Script version capacity
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        shell: bash
        run: |
          set -euo pipefail
          versions="$(clasp versions)"
          printf '%s\n' "$versions"
          version_count="$(printf '%s\n' "$versions" | grep -Ec '^[[:space:]]*[0-9]+[[:space:]]*-' || true)"
          echo "Apps Script versions: ${version_count}/200"
          if [ "$version_count" -ge 200 ]; then
            echo "::error::Apps Script version limit reached (${version_count}/200). Delete unused versions in Project history before deploying. Source push has not started."
            exit 4
          fi

      - name: Push source to Apps Script
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        run: clasp push --force

      - name: Update existing web app deployment
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA automated deploy ${GITHUB_SHA::12}"

      - name: Deployment summary
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production') }}
        run: |
          echo "NOVA Apps Script source pushed and existing web app deployment updated."
          echo "Commit: $GITHUB_SHA"

      - name: Validation-only summary
        if: ${{ !((github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.event.head_commit.message == 'deploy-upload-network-fallback-production')) }}
        run: |
          echo "NOVA canonical-source validation completed. Deployment was intentionally skipped."
          echo "Commit: $GITHUB_SHA"
