name: NOVA Core 3 Mobile CI

on:
  push:
    branches:
      - nova-core3-room-state-20260906
    paths:
      - 'core3/mobile/nova_mobile/**'
      - '.github/workflows/core3-mobile-ci.yml'
  pull_request:
    paths:
      - 'core3/mobile/nova_mobile/**'
      - '.github/workflows/core3-mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-core3-mobile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: core3/mobile/nova_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify committed Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          test -d android
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=NOVA_API_BASE_URL=https://nova-core3-api-dev-479836905263.asia-southeast1.run.app

  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core3/mobile/nova_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify committed iOS scaffold
        shell: bash
        run: |
          set -euo pipefail
          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign --dart-define=NOVA_API_BASE_URL=https://nova-core3-api-dev-479836905263.asia-southeast1.run.app
