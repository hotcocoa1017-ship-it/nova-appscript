name: Validate Cleaning Complete Server DB First V1

on:
  push:
    branches:
      - feat/full-db-houseman-ui-20260907
    paths:
      - scripts/patch_cleaning_complete_server_dbfirst_v1.py
      - .github/workflows/validate-cleaning-complete-server-dbfirst-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-db-houseman-ui-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_cleaning_complete_server_dbfirst_v1.py
      - name: Validate server DB-first guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CLEANING_COMPLETE_SERVER_DB_FIRST_V1' 06_Indicator.js
          grep -q 'completeIndicatorRoomCleaningDbFirst_' 06_Indicator.js
          python - <<'PY'
          from pathlib import Path
          s=Path('06_Indicator.js').read_text(encoding='utf-8')
          branch=s.index("if (action === 'CLEANING_COMPLETE')")
          helper=s.index('function completeIndicatorRoomCleaningDbFirst_')
          legacy=s.index('function completeIndicatorRoomCleaningFast_')
          assert branch < helper < legacy
          segment=s[branch:helper]
          assert 'novaMobileRealtimeEnabled_()' in segment
          assert 'completeIndicatorRoomCleaningDbFirst_(token' in segment
          helper_text=s[helper:legacy]
          required=[
            "action: 'CLEANING_COMPLETE'",
            'novaMobileRealtimeActionFetch_',
            'expectedVersion: 0',
            'expectedState',
            'mirrorPending: true',
            'alreadyCompleted:',
            'deferredNotification: null',
          ]
          missing=[x for x in required if x not in helper_text]
          assert not missing, missing
          forbidden=['getRequiredSheet_', 'updateRowByHeaders_', 'appendUnifiedHistory_', 'reserveDataVersion_']
          present=[x for x in forbidden if x in helper_text]
          assert not present, present
          print('cleaning complete server DB-first guard validated')
          PY
      - name: Validate DB event mirror and QM notification ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path('RealtimeDailySync.js').read_text(encoding='utf-8')
          generic=r.index('roomUpdates.push({', r.index("if (['QM_START', 'QM_COMPLETE', 'QM_REWORK'].includes(action))"))
          notify=r.index("if (action === 'CLEANING_COMPLETE' && afterStatus === 'QM_WAITING'", generic)
          end=r.index('alreadyApplied.add(requestId);', notify)
          block=r[generic:end]
          required=[
            "status: action === 'CLEANING_START' ? 'ROOMMAID_START' : 'ROOMMAID_COMPLETE'",
            'primaryEmployeeNo: performancePrimaryEmployeeNo',
            'secondaryEmployeeNo: performanceSecondaryEmployeeNo',
            'creditUnit: getRoommaidCleaningCreditUnit_(cleaningType)',
            'qmNotifications.push({',
          ]
          missing=[x for x in required if x not in block]
          assert not missing, missing
          print('CLEANING_COMPLETE DB event mirror owns Sheet history and QM notification')
          PY
      - name: JavaScript syntax checks
        run: node --check 06_Indicator.js && node --check RealtimeDailySync.js
      - name: NOVA regression validation
        run: python scripts/validate_nova_release.py
      - name: Patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          git diff -- 06_Indicator.js > /tmp/first.diff
          python scripts/patch_cleaning_complete_server_dbfirst_v1.py
          git diff -- 06_Indicator.js > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
      - name: Persist generated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 06_Indicator.js; then
            echo 'No generated source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06_Indicator.js
          git commit -m 'Persist cleaning complete server DB-first v1 [skip ci]'
          git push origin HEAD:feat/full-db-houseman-ui-20260907
