name: Validate Houseman Popup Extras

on:
  pull_request:
    branches: [main]
    paths:
      - 'HousemanOrderPopupExtras.js'
      - 'HousemanOrderPopupExtrasClient.html'
      - 'HousemanPopupThumbQuarter.html'
      - 'Index.html'
      - 'scripts/validate_houseman_popup_creator_photo_v1_20260911.py'
      - '.github/workflows/validate-houseman-popup-extras.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify minimal blast radius
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          for protected in Client.html 07_Houseman.js HousemanRequestPhoto.js HousemanRequestPhotoClient.html HousemanRequestPhotoDirectClient.html HousemanRequestPhotoBatchClient.html HousemanUiPerformancePatch.html; do
            if printf '%s\n' "$changed" | grep -Fxq "$protected"; then
              echo "::error::Existing houseman core path was modified: $protected"
              exit 2
            fi
          done

      - name: Validate popup nonblocking and read-only invariants
        run: python3 scripts/validate_houseman_popup_creator_photo_v1_20260911.py

      - name: Validate existing houseman UI invariants
        run: python3 scripts/validate_indicator_houseman_order_ui_20260908.py

      - name: Validate production release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check HousemanOrderPopupExtras.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          pairs = [
              ('HousemanOrderPopupExtrasClient.html', '/tmp/HousemanOrderPopupExtrasClient.js'),
              ('HousemanPopupThumbQuarter.html', '/tmp/HousemanPopupThumbQuarter.js'),
          ]
          for source, target in pairs:
              text = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              if len(scripts) != 1:
                  raise SystemExit(f'Expected one script block in {source}, found {len(scripts)}')
              Path(target).write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/HousemanOrderPopupExtrasClient.js
          node --check /tmp/HousemanPopupThumbQuarter.js

      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Validation modified repository source."
            git status --short
            exit 2
          fi
