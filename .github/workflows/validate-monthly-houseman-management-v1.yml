name: Validate Monthly Houseman Management V1

on:
  push:
    branches: [feature/monthly-houseman-management-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly Houseman management V1
        run: python3 scripts/patch_monthly_houseman_management_v1.py

      - name: Validate requested management functions
        run: python3 scripts/validate_monthly_houseman_management_v1.py

      - name: Validate existing NOVA release regression
        run: python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 07_Houseman.js
          node --check 11_Monthly.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          target = Path('/tmp/Client.js')
          target.write_text('\n'.join(scripts), encoding='utf-8')
          subprocess.run(['node', '--check', str(target)], check=True)
          PY

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(07_Houseman.js 11_Monthly.js Client.html)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_monthly_houseman_management_v1.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated source files
        shell: bash
        run: |
          set -euo pipefail
          generated=(07_Houseman.js 11_Monthly.js Client.html)
          if git diff --quiet -- "${generated[@]}"; then
            echo 'Validated source already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${generated[@]}"
          git commit -m 'Persist monthly Houseman management V1'
          git push origin HEAD:feature/monthly-houseman-management-v1

      - name: Summary
        run: echo 'MONTHLY_HOUSEMAN_MANAGEMENT_V1 validation PASS'
