name: Validate QM fallback convergence V1
on:
  push:
    branches: [main]
    paths:
      - 'QmSchemaCacheFallbackHotfix.html'
      - 'QmFallbackConvergence.js'
      - 'QmFallbackConvergenceClient.html'
      - 'QmWriteSerialGuard.html'
      - 'QmDbReadAuthorityClient.html'
      - 'Index.html'
      - 'scripts/validate_qm_fallback_convergence_v1.js'
      - '.github/workflows/validate-qm-fallback-convergence-v1.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run QM fallback convergence simulation
        run: node scripts/validate_qm_fallback_convergence_v1.js
