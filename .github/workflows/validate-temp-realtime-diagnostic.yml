name: Validate Temporary Realtime Diagnostic

on:
  push:
    branches: [diag/live-realtime-token-20260829]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic JavaScript syntax
        run: |
          set -euo pipefail
          node --check 04_Api.js
          node --check RealtimeDiagnostics.js
      - name: Validate diagnostic isolation
        run: |
          set -euo pipefail
          grep -q "runNovaRealtimeLiveDiagnostic_" 04_Api.js
          grep -q "Never returns tokens, keys, employee numbers or secrets" RealtimeDiagnostics.js
          grep -q "createTemplateFromFile('Index')" 04_Api.js
      - name: Run production regression gate
        run: python3 scripts/validate_nova_release.py
