name: Probe Archive Gateway Cloud Run

on:
  push:
    branches: [feat/archive-admin-gateway-20260905]
    paths:
      - 'cloudrun/archive-gateway-probe/**'
      - '.github/workflows/probe-archive-gateway-cloudrun-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-6a8144e9-31f3-4d5c-b9b
  GCP_REGION: asia-southeast1
  PROBE_SERVICE: nova-archive-gateway-probe
  RUNTIME_SERVICE_ACCOUNT: 479836905263-compute@developer.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy no-secret probe with same runtime identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$PROBE_SERVICE" \
            --source=cloudrun/archive-gateway-probe \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port=8080 \
            --min=0 \
            --max=1 \
            --quiet
      - name: Verify probe health
        shell: bash
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$PROBE_SERVICE" --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          test -n "$url"
          code="$(curl -sS --max-time 15 -o /tmp/probe.json -w '%{http_code}' "$url/health")"
          test "$code" = '200'
          python3 - <<'PY'
          import json,sys
          b=json.load(open('/tmp/probe.json'))
          if b.get('ok') is not True or b.get('probe')!='nova-archive-gateway-probe': sys.exit(1)
          print('CLOUD_RUN_PROBE=OK')
          PY
