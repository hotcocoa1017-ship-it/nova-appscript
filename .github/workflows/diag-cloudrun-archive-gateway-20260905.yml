name: Diagnose Cloud Run Archive Gateway

on:
  push:
    branches: [diag/wif-cloudrun-access-20260829]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: project-6a8144e9-31f3-4d5c-b9b
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: nova-realtime-api

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google Cloud with existing WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Inspect current service without exposing secret values
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > /tmp/service.json

          gcloud run services get-iam-policy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > /tmp/iam.json

          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))
          status=s.get('status') or {}
          spec=s.get('spec') or {}
          tmpl=spec.get('template') or {}
          tspec=tmpl.get('spec') or {}
          containers=tspec.get('containers') or []
          c=containers[0] if containers else {}
          md=s.get('metadata') or {}
          annotations=md.get('annotations') or {}
          labels=md.get('labels') or {}
          envs=c.get('env') or []
          by={str(e.get('name') or ''):e for e in envs}

          print('SERVICE_READY=' + ('YES' if status.get('latestReadyRevisionName') else 'NO'))
          print('LATEST_READY_REV=' + str(status.get('latestReadyRevisionName') or ''))
          print('SERVICE_URL_PRESENT=' + ('YES' if status.get('url') else 'NO'))
          print('IMAGE_PRESENT=' + ('YES' if c.get('image') else 'NO'))
          print('SERVICE_ACCOUNT_PRESENT=' + ('YES' if tspec.get('serviceAccountName') else 'NO'))
          print('CONTAINER_CONCURRENCY=' + str(tspec.get('containerConcurrency') or 'default'))
          print('INGRESS=' + str(annotations.get('run.googleapis.com/ingress') or 'default'))
          print('CLIENT_NAME=' + str(labels.get('run.googleapis.com/client-name') or annotations.get('run.googleapis.com/client-name') or ''))
          print('BUILD_SOURCE_ANNOTATION=' + ('YES' if annotations.get('run.googleapis.com/build-source-location') else 'NO'))

          wanted=[
            'NOVA_TOKEN_SECRET','DATABASE_URL','PG_HOST','PG_PORT','PG_DATABASE','PG_USER','PG_PASSWORD','PG_POOL_MAX','PG_SSL',
            'SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET','SUPABASE_SERVICE_ROLE_KEY'
          ]
          for name in wanted:
            e=by.get(name)
            if not e:
              state='MISSING'
            elif e.get('valueFrom') or e.get('valueSource'):
              state='SECRET_REF'
            elif 'value' in e and str(e.get('value') or ''):
              state='LITERAL_CONFIGURED'
            else:
              state='PRESENT_EMPTY_OR_UNKNOWN'
            print(name + '=' + state)

          iam=json.load(open('/tmp/iam.json'))
          public=False
          for b in iam.get('bindings') or []:
            if b.get('role')=='roles/run.invoker' and 'allUsers' in (b.get('members') or []):
              public=True
          print('PUBLIC_INVOKER=' + ('YES' if public else 'NO'))
          print('ARCHIVE_GATEWAY_DIAG=OK')
          PY

      - name: Recover active Cloud Run build source when permitted
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current-source
          SOURCE="$(python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))
          print(((s.get('metadata') or {}).get('annotations') or {}).get('run.googleapis.com/build-source-location') or '')
          PY
          )"
          if [[ "$SOURCE" != gs://* ]]; then
            echo "SOURCE_DOWNLOAD=NO_NON_GS"
            echo "Current Cloud Run source could not be recovered from a gs:// annotation." > /tmp/current-source/SOURCE_NOT_AVAILABLE.txt
            exit 0
          fi
          echo "SOURCE_SCHEME=GS"
          if gcloud storage cp "$SOURCE" /tmp/cloudrun-source.tgz >/tmp/source-copy.log 2>&1; then
            python3 - <<'PY'
          import os, tarfile, zipfile, shutil
          src='/tmp/cloudrun-source.tgz'
          out='/tmp/current-source'
          ok=False
          try:
              if tarfile.is_tarfile(src):
                  with tarfile.open(src, 'r:*') as t:
                      t.extractall(out)
                  ok=True
              elif zipfile.is_zipfile(src):
                  with zipfile.ZipFile(src) as z:
                      z.extractall(out)
                  ok=True
          except Exception as e:
              print('SOURCE_EXTRACT_ERROR=' + type(e).__name__)
          if not ok:
              shutil.copy2(src, os.path.join(out, 'cloudrun-source.bin'))
          print('SOURCE_EXTRACTED=' + ('YES' if ok else 'NO'))
          PY
            echo "SOURCE_DOWNLOAD=YES"
            find /tmp/current-source -maxdepth 3 -type f -printf '%P\n' | sort | head -100
          else
            echo "SOURCE_DOWNLOAD=NO_PERMISSION_OR_NOT_FOUND"
            echo "Cloud Run source annotation exists but the WIF deployer could not download it." > /tmp/current-source/SOURCE_NOT_AVAILABLE.txt
          fi

      - name: Upload recovered source for exact diffing
        uses: actions/upload-artifact@v4
        with:
          name: current-cloudrun-source
          path: /tmp/current-source
          if-no-files-found: error
          retention-days: 1
