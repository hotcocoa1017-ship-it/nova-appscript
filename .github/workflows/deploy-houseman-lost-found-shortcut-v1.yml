name: Deploy Houseman Lost Found Shortcut V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_houseman_lost_found_shortcut_v1.py'
      - '.github/workflows/deploy-houseman-lost-found-shortcut-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply houseman lost-found shortcut patch
        run: python3 scripts/patch_houseman_lost_found_shortcut_v1.py

      - name: Validate shortcut scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "HOUSEMAN_LOST_FOUND_SHORTCUT_V1" Client.html
          grep -q "\['ADMIN', 'ORDER', 'HOUSEMAN'\].includes(role)" Client.html
          grep -q "if (role === 'HOUSEMAN') return items;" Client.html
          grep -q "label: '습득물 관리 ↗'" Client.html
          grep -q "label: 'NOVA 통합 인사시스템 ↗'" Client.html

      - name: Validate Client JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html | awk '{print $1}')"
          python3 scripts/patch_houseman_lost_found_shortcut_v1.py
          after="$(sha256sum Client.html | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist patched Client to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html; then
            echo "Houseman lost-found shortcut already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Client.html
            git commit -m "feat: add houseman lost-found shortcut [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to persist patched Client.html to main."
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA houseman lost-found shortcut ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "Houseman lost-found shortcut deployed."
          echo "Commit: $GITHUB_SHA"
