name: Deploy NOVA ORDER Shared Site Context

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply ORDER shared site context V1
        run: python3 scripts/patch_order_site_context_v1.py

      - name: Apply ORDER shared site context V2
        run: python3 scripts/patch_order_site_context_v2.py

      - name: Validate ORDER shared site simulations
        run: python3 scripts/validate_order_site_context_v1.py

      - name: Validate existing production protections
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SITE_SCOPE_INDICATOR_CLOSE_V2" Client.html
          grep -q "ORDER_SHARED_SITE_CONTEXT_V1" Client.html
          grep -q "ORDER_SHARED_SITE_CONTEXT_V2" Client.html
          grep -q "indicatorQueryButton" Client.html
          grep -q "markIndicatorQueryDirty_" Client.html
          grep -q "loadIndicatorSnapshot" Client.html
          grep -q "API 설정과 보조 Realtime 연결을 분리해 고속 API 유지" Client.html
          grep -q "SYNC_STATUS_AUTO_HIDE_V1" Client.html
          grep -q "REALTIME_SUBSCRIPTION_RESILIENCE_V1" Client.html
          if grep -q "include_('OperationalStatusHotfix')" Index.html; then
            echo "::error::OperationalStatusHotfix must not intercept the Realtime path."
            exit 2
          fi

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html | awk '{print $1}')"
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/validate_order_site_context_v1.py
          after="$(sha256sum Client.html | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated Client source to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html; then
            echo "Client.html already matches validated source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Client.html
            git commit -m "Persist ORDER shared site context V2 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA ORDER shared site V2 ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "ORDER shared site context V2 validated and deployed."
          echo "Commit: $GITHUB_SHA"
