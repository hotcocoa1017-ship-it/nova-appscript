name: Apply NOVA Bootstrap Realtime Config Perf V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_bootstrap_realtime_config_perf_v1_20260908'

permissions:
  contents: write
  actions: write

concurrency:
  group: nova-bootstrap-realtime-config-perf-v1
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Client bootstrap config reuse only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Client.html')
          s=p.read_text(encoding='utf-8')
          anchor="""  function applyBootstrapResult_(bootstrap, networkElapsed, serverElapsed) { // (초기데이터 공통 반영)\n    state.bootstrap = bootstrap;\n    const bootstrapRole = String(bootstrap.user?.role || '').toUpperCase();"""
          replacement="""  function applyBootstrapResult_(bootstrap, networkElapsed, serverElapsed) { // (초기데이터 공통 반영)\n    state.bootstrap = bootstrap;\n    const bootstrapRealtime = bootstrap?.realtimeConfig; // BOOTSTRAP_REALTIME_CONFIG_PERF_V1\n    if (bootstrapRealtime?.ok) {\n      novaRealtime_.configLoaded = true;\n      novaRealtime_.enabled = Boolean(bootstrapRealtime.enabled && bootstrapRealtime.apiBase);\n      novaRealtime_.apiBase = String(bootstrapRealtime.apiBase || '').replace(/\\/+$/, '');\n      novaRealtime_.qmDraftDbFirstEnabled = Boolean(bootstrapRealtime.qmDraftDbFirstEnabled);\n    }\n    const bootstrapRole = String(bootstrap.user?.role || '').toUpperCase();"""
          if 'BOOTSTRAP_REALTIME_CONFIG_PERF_V1' not in s:
              if anchor not in s:
                  raise SystemExit('applyBootstrapResult anchor not found')
              s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate startup performance and regression gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q "BOOTSTRAP_REALTIME_CONFIG_PERF_V1" Client.html
          grep -q "realtimeConfig: buildNovaRealtimeClientConfig_(user)" 04_Api.js
          grep -q "function buildNovaRealtimeClientConfig_(user, properties)" RealtimeBridge.js
          grep -q "callServer('getNovaRealtimeClientConfig', state.token)" Client.html
          python3 scripts/validate_room_state_sync_hardening_20260906.py
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_nova_release.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Client.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          if not blocks: raise SystemExit('No Client script block')
          Path('/tmp/NovaClient.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          node --check 04_Api.js
          node --check RealtimeBridge.js
          git diff --check

      - name: Commit minimal Client patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html; then
            echo 'Client startup performance patch already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Client.html
            git commit -m 'Reuse bootstrap Realtime config [skip ci]'
            git push origin HEAD:main
          fi

      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-apps-script.yml/dispatches" \
            -d '{"ref":"main","inputs":{"deploy":"true"}}'
