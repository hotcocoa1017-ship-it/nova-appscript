name: Emergency rollback Push permission settings V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rollback:
    if: github.event.head_commit.message == 'Trigger emergency rollback of Push permission settings V1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last known good NOVA login/PWA files
        shell: bash
        run: |
          set -euo pipefail
          git checkout eeb817bf58351c6cb8de0b6dbc1cd1c04fe7c127 -- \
            Client.html \
            pwa/v2/index.html \
            scripts/patch_realtime_subscription_resilience.py

          if git diff --quiet -- Client.html pwa/v2/index.html scripts/patch_realtime_subscription_resilience.py; then
            echo 'Rollback already applied.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Client.html pwa/v2/index.html scripts/patch_realtime_subscription_resilience.py
          git commit -m 'Emergency rollback NOVA Push permission settings V1 [skip ci]'
          git push origin HEAD:main
