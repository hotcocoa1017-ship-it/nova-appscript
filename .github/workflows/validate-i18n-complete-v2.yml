name: Validate NOVA I18N Complete V2

on:
  push:
    branches: [i18n-complete-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate V2 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "NOVA_I18N_COMPLETE_V2" I18nClient.html
          grep -q "NOVA_I18N_COMPLETE_V2" I18nServer.js
          grep -q "'비품': 'ของใช้'" I18nClient.html
          grep -q "'린넨': 'ผ้าลินิน'" I18nClient.html
          grep -q "'시설': 'งานซ่อมบำรุง'" I18nClient.html
          grep -q "'문의': 'สอบถาม'" I18nClient.html
          grep -q "function translateNovaUiTextBatch" I18nServer.js
          grep -q "function flushAutoTranslations" I18nClient.html
          grep -q "MutationObserver" I18nClient.html
          grep -q "wrapNativeDialogs_" I18nClient.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check I18nServer.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('I18nClient.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in I18nClient.html')
          Path('/tmp/NovaI18nV2.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaI18nV2.js

      - name: Validate no storage or status schema changes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "nova_rooms_current" I18nClient.html
          ! grep -q "cleaning_status" I18nClient.html
          ! grep -q "operational_status" I18nClient.html
          ! grep -q "updateRowByHeaders_" I18nServer.js
