name: Deploy NOVA Archive Gateway

on:
  push:
    branches: [feat/archive-admin-gateway-20260905]
    paths:
      - 'cloudrun/archive-gateway/**'
      - '.github/workflows/deploy-archive-gateway-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nova-archive-gateway-feature
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-6a8144e9-31f3-4d5c-b9b
  GCP_REGION: asia-southeast1
  SOURCE_SERVICE: nova-realtime-api
  TARGET_SERVICE: nova-archive-gateway

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate Google Cloud with existing WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate gateway source
        shell: bash
        run: |
          set -euo pipefail
          cd cloudrun/archive-gateway
          node --check index.js
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          echo 'ARCHIVE_GATEWAY_SOURCE=OK'

      - name: Clone required runtime configuration without logging values
        id: config
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SOURCE_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > /tmp/source-service.json

          python3 - <<'PY'
          import json, os
          s=json.load(open('/tmp/source-service.json'))
          tspec=(((s.get('spec') or {}).get('template') or {}).get('spec') or {})
          containers=tspec.get('containers') or []
          if not containers:
              raise SystemExit('Source Cloud Run container is unavailable')
          envs=containers[0].get('env') or []
          by={str(e.get('name') or ''):e for e in envs}
          required=['NOVA_TOKEN_SECRET','PG_HOST','PG_PORT','PG_DATABASE','PG_USER','PG_PASSWORD','SUPABASE_URL']
          optional=['PG_POOL_MAX','PG_SSL']
          out={}
          for name in required + optional:
              e=by.get(name)
              if not e:
                  if name in required:
                      raise SystemExit(f'Missing required runtime configuration: {name}')
                  continue
              if e.get('valueFrom') or e.get('valueSource'):
                  raise SystemExit(f'Runtime configuration must be literal for safe clone: {name}')
              value=str(e.get('value') or '')
              if not value and name in required:
                  raise SystemExit(f'Empty required runtime configuration: {name}')
              if value:
                  out[name]=value
          with open('/tmp/archive-env.json','w') as f:
              json.dump(out,f)
          service_account=str(tspec.get('serviceAccountName') or '').strip()
          if not service_account:
              raise SystemExit('Source Cloud Run service account is unavailable')
          with open('/tmp/source-service-account.txt','w') as f:
              f.write(service_account)
          print('ARCHIVE_RUNTIME_CONFIG=OK')
          print('ARCHIVE_RUNTIME_CONFIG_KEYS=' + ','.join(sorted(out.keys())))
          PY

          echo "service_account=$(cat /tmp/source-service-account.txt)" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated archive gateway
        shell: bash
        env:
          SERVICE_ACCOUNT: ${{ steps.config.outputs.service_account }}
        run: |
          set -euo pipefail
          if ! gcloud run deploy "$TARGET_SERVICE" \
            --source=cloudrun/archive-gateway \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --platform=managed \
            --service-account="$SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --port=8080 \
            --concurrency=20 \
            --min=0 \
            --max=2 \
            --cpu=1 \
            --memory=512Mi \
            --timeout=90 \
            --env-vars-file=/tmp/archive-env.json \
            --quiet >/tmp/archive-gateway-deploy.log 2>&1; then
              echo '::error::Archive Gateway deployment failed. No existing NOVA service was modified.'
              exit 20
          fi
          echo 'ARCHIVE_GATEWAY_DEPLOY=OK'

      - name: Resolve gateway URL and verify health
        id: gateway
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$TARGET_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

          ok='false'
          for i in $(seq 1 15); do
            code="$(curl -sS --max-time 15 -o /tmp/archive-health.json -w '%{http_code}' "$SERVICE_URL/health" || true)"
            if [ "$code" = '200' ]; then
              if python3 - <<'PY'
          import json,sys
          b=json.load(open('/tmp/archive-health.json'))
          if b.get('ok') is not True or b.get('db') is not True or b.get('vaultAccess') is not True:
              sys.exit(1)
          if b.get('build') != 'archive-gateway-v1':
              sys.exit(2)
          PY
              then
                ok='true'
                break
              fi
            fi
            sleep 3
          done
          if [ "$ok" != 'true' ]; then
            echo '::error::Archive Gateway health/vault verification failed. Existing Realtime service remains unchanged.'
            cat /tmp/archive-health.json 2>/dev/null || true
            exit 30
          fi
          echo 'ARCHIVE_GATEWAY_HEALTH=OK'

      - name: Verify unauthenticated archive access is blocked
        shell: bash
        env:
          SERVICE_URL: ${{ steps.gateway.outputs.service_url }}
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$SERVICE_URL/v1/archive/status")"
          if [ "$code" != '401' ]; then
            echo "::error::Unauthenticated archive status returned HTTP $code instead of 401"
            exit 40
          fi
          echo 'ARCHIVE_GATEWAY_UNAUTH=BLOCKED'

      - name: Verify ADMIN status, query and restore end to end
        shell: bash
        env:
          SERVICE_URL: ${{ steps.gateway.outputs.service_url }}
        run: |
          set -euo pipefail
          cd cloudrun/archive-gateway
          SERVICE_URL="$SERVICE_URL" node --input-type=module <<'NODE'
          import fs from 'fs';
          import crypto from 'crypto';
          import pg from 'pg';

          const env = JSON.parse(fs.readFileSync('/tmp/archive-env.json','utf8'));
          const { Pool } = pg;
          const pool = new Pool({
            host: env.PG_HOST,
            port: Number(env.PG_PORT || 6543),
            database: env.PG_DATABASE || 'postgres',
            user: env.PG_USER,
            password: env.PG_PASSWORD,
            max: 2,
            connectionTimeoutMillis: 5000,
            ssl: String(env.PG_SSL || 'true').toLowerCase() === 'false' ? false : { rejectUnauthorized:false }
          });

          function b64url(v) { return Buffer.from(v).toString('base64url'); }
          function novaToken(employeeNo) {
            const body=b64url(JSON.stringify({ employeeNo:String(employeeNo), expiresAt:Date.now()+5*60*1000 }));
            const sig=crypto.createHmac('sha256',env.NOVA_TOKEN_SECRET).update(body).digest('base64url');
            return `${body}.${sig}`;
          }
          async function signedPost(path, payload, token) {
            const body=JSON.stringify(payload || {});
            const timestamp=String(Date.now());
            const signature=crypto.createHmac('sha256',env.NOVA_TOKEN_SECRET).update(`${timestamp}.${body}`).digest('hex');
            const response=await fetch(process.env.SERVICE_URL + path, {
              method:'POST',
              headers:{
                'content-type':'application/json',
                'authorization':`Bearer ${token}`,
                'x-nova-timestamp':timestamp,
                'x-nova-signature':signature
              },
              body
            });
            const text=await response.text();
            let data={};
            try { data=text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok) throw new Error(`${path} HTTP ${response.status} ${data?.code || ''}`);
            return data;
          }

          let adminEmployeeNo='';
          try {
            const q=await pool.query("select employee_no from public.nova_users where enabled=true and upper(role)='ADMIN' order by employee_no limit 1");
            adminEmployeeNo=String(q.rows[0]?.employee_no || '');
          } finally {
            await pool.end();
          }
          if (!adminEmployeeNo) throw new Error('Enabled ADMIN account not found for E2E verification');

          const token=novaToken(adminEmployeeNo);
          const status=await signedPost('/v1/archive/status',{},token);
          if (status?.ok !== true || status?.healthy !== true || status?.current?.ok !== true) {
            throw new Error('Archive status health mismatch');
          }
          console.log('ARCHIVE_GATEWAY_ADMIN_STATUS=OK');

          const query=await signedPost('/v1/archive/query',{sourceType:'WORK_HISTORY',limit:1},token);
          if (query?.ok !== true || !Array.isArray(query.rows) || query.rows.length < 1 || !query.rows[0]?.archive_key) {
            throw new Error('Archive query did not return a restorable pointer');
          }
          console.log('ARCHIVE_GATEWAY_ADMIN_QUERY=OK');

          const archiveKey=String(query.rows[0].archive_key);
          const restore=await signedPost('/v1/archive/restore',{archiveKey},token);
          if (restore?.ok !== true || restore?.restored !== true || String(restore?.archiveKey || '') !== archiveKey) {
            throw new Error('Archive restore verification failed');
          }
          if (String(restore?.record?.request_id || '') !== String(restore?.pointer?.sourceRecordId || '')) {
            throw new Error('Archive restored identity mismatch');
          }
          console.log('ARCHIVE_GATEWAY_ADMIN_RESTORE=OK');
          NODE

      - name: Verify existing Realtime service remains healthy
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(gcloud run services describe "$SOURCE_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')"
          code="$(curl -sS --max-time 15 -o /tmp/realtime-health.json -w '%{http_code}' "$SOURCE_URL/health")"
          test "$code" = '200'
          python3 - <<'PY'
          import json,sys
          b=json.load(open('/tmp/realtime-health.json'))
          if b.get('ok') is not True:
              sys.exit(1)
          print('EXISTING_REALTIME_HEALTH=OK')
          PY
