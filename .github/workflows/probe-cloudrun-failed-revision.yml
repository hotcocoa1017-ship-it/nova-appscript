name: Probe Failed Cloud Run Realtime Revision

on:
  push:
    branches: [diag/realtime-token-after-secret-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect current and latest-created revisions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          SERVICE='nova-realtime-api'
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/svc.json
          python3 - <<'PY'
          import json, subprocess
          s=json.load(open('/tmp/svc.json'))
          st=s.get('status') or {}
          latest_created=st.get('latestCreatedRevisionName') or ''
          latest_ready=st.get('latestReadyRevisionName') or ''
          print('LATEST_CREATED='+latest_created)
          print('LATEST_READY='+latest_ready)
          spec=s.get('spec') or {}
          tmpl=spec.get('template') or {}
          tspec=tmpl.get('spec') or {}
          print('RUNTIME_SERVICE_ACCOUNT='+str(tspec.get('serviceAccountName') or ''))
          containers=tspec.get('containers') or []
          if containers:
              image=str(containers[0].get('image') or '')
              if image:
                  # Image name is not secret; omit digest detail from output.
                  print('IMAGE_REPOSITORY='+image.split('@')[0].split(':')[0])
          for label,rev in [('CREATED',latest_created),('READY',latest_ready)]:
              if not rev: continue
              raw=subprocess.check_output(['gcloud','run','revisions','describe',rev,'--project='+PROJECT,'--region='+REGION,'--format=json'], text=True)
              r=json.loads(raw)
              status=r.get('status') or {}
              print(label+'_READY=' + str(status.get('conditions',[{}])[0].get('status','')))
              for c in status.get('conditions') or []:
                  ctype=str(c.get('type',''))
                  if ctype in ('Ready','ContainerHealthy','ResourcesAvailable'):
                      print(label+'_COND_'+ctype+'='+str(c.get('status',''))+'|'+str(c.get('reason',''))+'|'+str(c.get('message',''))[:240])
              rspec=r.get('spec') or {}
              rc=(rspec.get('containers') or [])
              envs=rc[0].get('env',[]) if rc else []
              by={str(e.get('name','')):e for e in envs}
              for n in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']:
                  e=by.get(n)
                  state='MISSING' if not e else ('SECRET_REF' if e.get('valueFrom') or e.get('valueSource') else ('SET' if str(e.get('value','')).strip() else 'EMPTY'))
                  print(label+'_'+n+'='+state)
          PY
