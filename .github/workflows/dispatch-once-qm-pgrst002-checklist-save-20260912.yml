name: Dispatch Once QM PGRST002 Checklist Save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-once-qm-pgrst002-checklist-save-20260912.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --repo hotcocoa1017-ship-it/nova-appscript --ref main -f deploy=true
