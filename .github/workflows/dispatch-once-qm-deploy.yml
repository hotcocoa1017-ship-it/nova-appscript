name: Dispatch NOVA QM Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-once-qm-deploy.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --ref main -f deploy=true
