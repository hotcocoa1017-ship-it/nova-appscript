name: Apply NOVA PWA VAPID V5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_pwa_vapid_v5_20260908'

permissions:
  contents: write

concurrency:
  group: nova-pwa-vapid-v5-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact VAPID V5 client patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old_public='BCx-wnFcdo7z-Xk2DtjIcsBHTySpAxbL5CfMf2b7ltnxhlCF99n2AROSvQwkrSdZHNbniaGHUZaBWNUVJnRkWTk'
          new_public='BChAXSYu9Ek8PxyUPQIDutnL3Nx1AV-2GlljuOO5L074gO1keV8zThPAWILU1_9JpAislux--l3USxuTZYQthNI'
          p=Path('pwa/v2/index.html')
          text=p.read_text(encoding='utf-8')
          assert text.count(old_public)==1, 'unexpected v4 public key count'
          assert "VAPID_VERSION='20260908-v4'" in text, 'unexpected VAPID version baseline'
          assert 'NOVA_PUSH_SUBSCRIPTION_KEY_GUARD_V1' in text, 'subscription key guard missing'
          text=text.replace(old_public,new_public,1)
          text=text.replace("VAPID_VERSION='20260908-v4'","VAPID_VERSION='20260908-v5'",1)
          text=text.replace('NOVA_PUSH_VAPID_RECOVERY_V4','NOVA_PUSH_VAPID_RECOVERY_V5',1)
          text=text.replace('novaPushPromptDismissedAtV4','novaPushPromptDismissedAtV5',1)
          p.write_text(text,encoding='utf-8')

          p=Path('pwa/v2/sw.js')
          text=p.read_text(encoding='utf-8')
          assert "nova-pwa-v2-vercel-7" in text, 'unexpected SW cache baseline'
          text=text.replace("nova-pwa-v2-vercel-7","nova-pwa-v2-vercel-8",1)
          text=text.replace('NOVA_PUSH_VAPID_RECOVERY_V4_KEY_GUARD_V1','NOVA_PUSH_VAPID_RECOVERY_V5_KEY_GUARD_V1',1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Validate V5 patch
        shell: bash
        run: |
          set -euo pipefail
          node --check pwa/v2/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('pwa/v2/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          assert blocks
          subprocess.run(['node','--check','-'],input='\n'.join(blocks),text=True,check=True)
          assert 'BChAXSYu9Ek8PxyUPQIDutnL3Nx1AV-2GlljuOO5L074gO1keV8zThPAWILU1_9JpAislux--l3USxuTZYQthNI' in text
          assert "VAPID_VERSION='20260908-v5'" in text
          assert 'NOVA_PUSH_SUBSCRIPTION_KEY_GUARD_V1' in text
          sw=Path('pwa/v2/sw.js').read_text(encoding='utf-8')
          assert "nova-pwa-v2-vercel-8" in sw
          assert 'NOVA_PUSH_VAPID_RECOVERY_V5_KEY_GUARD_V1' in sw
          PY
          git diff --check

      - name: Commit VAPID V5 client recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/v2/index.html pwa/v2/sw.js
          git commit -m "Deploy NOVA PWA VAPID recovery v5"
          git push origin HEAD:main
