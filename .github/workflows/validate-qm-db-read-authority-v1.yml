name: Validate QM DB Read Authority V1

on:
  pull_request:
    paths:
      - 'QmDbReadAuthority.js'
      - 'QmDbReadAuthorityClient.html'
      - 'Index.html'
      - 'scripts/validate_qm_db_read_authority_v1_20260911.py'
      - '.github/workflows/validate-qm-db-read-authority-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate QM DB read authority invariants
        run: python3 scripts/validate_qm_db_read_authority_v1_20260911.py
      - name: Validate production release regression gate
        run: python3 scripts/validate_nova_release.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check QmDbReadAuthority.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('QmDbReadAuthorityClient.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found')
          Path('/tmp/QmDbReadAuthorityClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/QmDbReadAuthorityClient.js
      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 2
          fi
