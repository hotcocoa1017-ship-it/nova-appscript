# retry: validator fixture fixed
name: Apply Room Upload XLSX Token Hardening V1 Once

on:
  push:
    branches:
      - fix/room-upload-xlsx-token-hardening-20260910
    paths:
      - .github/workflows/_tmp_apply_room_upload_xlsx_token_hardening_20260910.yml

permissions:
  contents: write

concurrency:
  group: nova-room-upload-xlsx-hardening-once
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  patch-validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/room-upload-xlsx-token-hardening-20260910
          fetch-depth: 0

      - name: Apply minimal source patch
        run: python3 scripts/_tmp_patch_room_upload_xlsx_token_hardening_20260910.py

      - name: Validate targeted room upload invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_room_upload_xlsx_token_hardening_20260910.py
          python3 scripts/validate_room_upload_db_first_v4_20260907.py
          python3 scripts/validate_room_upload_realtime_sync_20260907.py
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_nova_release.py
          node --check 09_RoomStatusUpload.js

      - name: Commit canonical patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nova-automation"
          git config user.email "nova-automation@users.noreply.github.com"
          git add 09_RoomStatusUpload.js .github/workflows/deploy-apps-script.yml scripts/validate_room_upload_xlsx_token_hardening_20260910.py
          git commit -m "Harden XLSX room status token parsing [skip ci]"
          git push origin HEAD:fix/room-upload-xlsx-token-hardening-20260910

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Check Apps Script version capacity
        shell: bash
        run: |
          set -euo pipefail
          versions="$(clasp versions)"
          printf '%s\n' "$versions"
          version_count="$(printf '%s\n' "$versions" | grep -Ec '^[[:space:]]*[0-9]+[[:space:]]*-' || true)"
          echo "Apps Script versions: ${version_count}/200"
          if [ "$version_count" -ge 200 ]; then
            echo "::error::Apps Script version limit reached (${version_count}/200)."
            exit 4
          fi

      - name: Deploy patched Apps Script
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA XLSX token hardening $(git rev-parse --short=12 HEAD)"

      - name: Remove one-time files and commit cleanup
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_tmp_patch_room_upload_xlsx_token_hardening_20260910.py
          rm -f .github/workflows/_tmp_apply_room_upload_xlsx_token_hardening_20260910.yml
          git add -A
          git commit -m "Remove one-time XLSX hardening automation [skip ci]"
          git push origin HEAD:fix/room-upload-xlsx-token-hardening-20260910
