name: Probe WIF Cloud Run Access

on:
  push:
    branches: [diag/wif-cloudrun-access-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Inspect active Cloud Run revision without secret values
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          SERVICE='nova-realtime-api'
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))
          status=s.get('status') or {}
          print('LATEST_CREATED='+str(status.get('latestCreatedRevisionName','')))
          print('LATEST_READY='+str(status.get('latestReadyRevisionName','')))
          for t in status.get('traffic') or []:
              print('TRAFFIC='+str(t.get('revisionName') or t.get('type') or 'LATEST')+':'+str(t.get('percent',0)))
          print('SERVICE_URL='+str(status.get('url','')))
          PY
          ACTIVE_REV=$(python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))
          st=s.get('status') or {}
          traffic=st.get('traffic') or []
          rev=''
          for t in traffic:
              if int(t.get('percent') or 0)>0 and t.get('revisionName'):
                  rev=t['revisionName']; break
          print(rev or st.get('latestReadyRevisionName') or '')
          PY
          )
          echo "ACTIVE_REV=$ACTIVE_REV"
          gcloud run revisions describe "$ACTIVE_REV" --project="$PROJECT" --region="$REGION" --format=json > /tmp/rev.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/rev.json'))
          containers=((((r.get('spec') or {}).get('containers')) or []))
          if not containers:
              containers=((((r.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or [])
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')):e for e in envs}
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']:
              e=by.get(name)
              if not e: state='MISSING'
              elif e.get('valueFrom') or e.get('valueSource'): state='SECRET_REF'
              elif str(e.get('value','')).strip(): state='SET'
              else: state='EMPTY'
              print(name+'='+state)
          print('ENV_COUNT='+str(len(envs)))
          PY
