name: Verify DB Broadcast End To End

on:
  push:
    branches: [diag/wif-cloudrun-access-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  broadcast-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Verify DB to Realtime to WebSocket without changing room data
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          REV='nova-realtime-api-rtfix133009'
          gcloud run revisions describe "$REV" --project="$PROJECT" --region="$REGION" --format=json > /tmp/rev.json
          python3 - <<'PY' > /tmp/nova-e2e-config.json
          import json
          r=json.load(open('/tmp/rev.json'))
          containers=(r.get('spec') or {}).get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')):e for e in envs}
          def v(name,default=''):
              e=by.get(name) or {}
              if e.get('valueFrom') or e.get('valueSource'):
                  raise SystemExit('SECRET_REF_UNSUPPORTED:'+name)
              return str(e.get('value',default))
          cfg={
            'url':v('SUPABASE_URL'),'key':v('SUPABASE_PUBLISHABLE_KEY'),'secret':v('SUPABASE_JWT_SECRET'),
            'databaseUrl':v('DATABASE_URL'),'pgHost':v('PG_HOST'),'pgPort':v('PG_PORT','6543'),
            'pgUser':v('PG_USER'),'pgPassword':v('PG_PASSWORD'),'pgDatabase':v('PG_DATABASE','postgres'),
            'pgSsl':v('PG_SSL','true')
          }
          if not cfg['url'] or not cfg['key'] or not cfg['secret']: raise SystemExit('REALTIME_CONFIG_MISSING')
          if not cfg['databaseUrl'] and not (cfg['pgHost'] and cfg['pgUser'] and cfg['pgPassword']): raise SystemExit('DB_CONFIG_MISSING')
          print(json.dumps(cfg,ensure_ascii=False))
          PY
          chmod 600 /tmp/nova-e2e-config.json
          mkdir -p /tmp/nova-e2e && cd /tmp/nova-e2e
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @supabase/supabase-js@2 jsonwebtoken@9 pg@8 >/dev/null 2>&1
          cat > /tmp/nova-e2e/test.mjs <<'JS'
          import fs from 'node:fs';
          import { createClient } from '@supabase/supabase-js';
          import jwt from 'jsonwebtoken';
          import pg from 'pg';
          import crypto from 'node:crypto';

          const cfg=JSON.parse(fs.readFileSync('/tmp/nova-e2e-config.json','utf8'));
          const now=Math.floor(Date.now()/1000);
          const token=jwt.sign({aud:'authenticated',role:'authenticated',sub:'00000000-0000-4000-8000-000000000001',employee_no:'REALTIME_DIAG',nova_role:'ADMIN',sites:['별관','쏘라노'],iat:now},cfg.secret,{algorithm:'HS256',expiresIn:'5m',issuer:'nova-realtime'});
          const supabase=createClient(cfg.url,cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
          supabase.realtime.setAuth(token);
          const topic='nova:site:별관:rooms';
          const nonce='NOVA-E2E-'+crypto.randomUUID();
          const channel=supabase.channel(topic,{config:{private:true}});
          let resolveReceived;
          const received=new Promise(resolve=>{resolveReceived=resolve;});
          channel.on('broadcast',{event:'nova_diag'},({payload})=>{
            if(payload && payload.nonce===nonce) resolveReceived(true);
          });
          const joined=await new Promise(resolve=>{
            const timer=setTimeout(()=>resolve(false),12000);
            channel.subscribe((status)=>{
              if(status==='SUBSCRIBED'){clearTimeout(timer);resolve(true);}
              else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){clearTimeout(timer);resolve(false);}
            });
          });
          console.log('PRIVATE_CHANNEL_SUBSCRIBED='+String(joined));
          if(!joined) process.exit(30);

          const poolConfig=cfg.databaseUrl ? {connectionString:cfg.databaseUrl} : {
            host:cfg.pgHost,port:Number(cfg.pgPort||6543),user:cfg.pgUser,password:cfg.pgPassword,database:cfg.pgDatabase||'postgres'
          };
          if(cfg.pgSsl!=='false') poolConfig.ssl={rejectUnauthorized:false};
          const db=new pg.Client(poolConfig);
          await db.connect();
          await db.query("select realtime.send($1::jsonb,$2,$3,$4)",[JSON.stringify({source:'NOVA_E2E_DIAG',nonce}),'nova_diag',topic,true]);
          await db.end();
          const got=await Promise.race([received,new Promise(resolve=>setTimeout(()=>resolve(false),8000))]);
          console.log('DB_BROADCAST_RECEIVED='+String(Boolean(got)));
          console.log('REALTIME_E2E='+(got?'OK':'FAIL'));
          await supabase.removeChannel(channel);
          supabase.realtime.disconnect();
          if(!got) process.exit(31);
          JS
          node /tmp/nova-e2e/test.mjs
          rm -f /tmp/nova-e2e-config.json
