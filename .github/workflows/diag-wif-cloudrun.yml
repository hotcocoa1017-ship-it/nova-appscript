name: Test Private Realtime Handshake

on:
  push:
    branches: [diag/wif-cloudrun-access-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  realtime-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Test private Supabase channels without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          REV='nova-realtime-api-rtfix133009'
          gcloud run revisions describe "$REV" --project="$PROJECT" --region="$REGION" --format=json > /tmp/rev.json
          python3 - <<'PY' > /tmp/rt-config.json
          import json,sys,os
          r=json.load(open('/tmp/rev.json'))
          containers=(r.get('spec') or {}).get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')):e for e in envs}
          def literal(name):
              e=by.get(name) or {}
              if e.get('valueFrom') or e.get('valueSource'):
                  raise SystemExit('SECRET_REF_UNSUPPORTED_FOR_DIAG:'+name)
              return str(e.get('value',''))
          cfg={
              'url': literal('SUPABASE_URL'),
              'key': literal('SUPABASE_PUBLISHABLE_KEY'),
              'secret': literal('SUPABASE_JWT_SECRET')
          }
          if not all(cfg.values()): raise SystemExit('REALTIME_CONFIG_MISSING')
          print(json.dumps(cfg,ensure_ascii=False))
          PY
          chmod 600 /tmp/rt-config.json
          mkdir -p /tmp/nova-rt-test && cd /tmp/nova-rt-test
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund @supabase/supabase-js@2 jsonwebtoken@9 >/dev/null 2>&1
          cat > /tmp/nova-rt-test/test.mjs <<'JS'
          import fs from 'node:fs';
          import { createClient } from '@supabase/supabase-js';
          import jwt from 'jsonwebtoken';

          const cfg = JSON.parse(fs.readFileSync('/tmp/rt-config.json','utf8'));
          const now = Math.floor(Date.now()/1000);
          const token = jwt.sign({
            aud:'authenticated', role:'authenticated',
            sub:'00000000-0000-4000-8000-000000000001',
            employee_no:'REALTIME_DIAG', nova_role:'ADMIN',
            sites:['별관','쏘라노'], iat:now
          }, cfg.secret, {algorithm:'HS256',expiresIn:'5m',issuer:'nova-realtime'});

          const client = createClient(cfg.url, cfg.key, {
            auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}
          });
          client.realtime.setAuth(token);

          async function check(site) {
            const topic = `nova:site:${site}:rooms`;
            return await new Promise((resolve) => {
              let settled=false;
              const channel=client.channel(topic,{config:{private:true}});
              const timer=setTimeout(()=>finish('TIMEOUT'),12000);
              function finish(status,err='') {
                if(settled) return;
                settled=true; clearTimeout(timer);
                Promise.resolve(client.removeChannel(channel)).finally(()=>resolve({site,status,err:String(err||'').slice(0,180)}));
              }
              channel.subscribe((status,err)=>{
                if(status==='SUBSCRIBED') finish('SUBSCRIBED');
                else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)) finish(status,err?.message||err||'');
              });
            });
          }

          const results=[];
          for (const site of ['별관','쏘라노']) results.push(await check(site));
          for (const r of results) console.log(`SITE=${r.site} STATUS=${r.status}${r.err?' ERROR='+r.err:''}`);
          const ok=results.every(r=>r.status==='SUBSCRIBED');
          console.log('PRIVATE_REALTIME_HANDSHAKE='+(ok?'OK':'FAIL'));
          client.realtime.disconnect();
          if(!ok) process.exit(30);
          JS
          node /tmp/nova-rt-test/test.mjs
          rm -f /tmp/rt-config.json
