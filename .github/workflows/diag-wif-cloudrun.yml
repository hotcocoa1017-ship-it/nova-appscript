name: Probe WIF Cloud Run Access

on:
  push:
    branches: [diag/wif-cloudrun-access-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Inspect latest created and ready revisions
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          SERVICE='nova-realtime-api'
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/service.json'))
          st=s.get('status') or {}
          print('LATEST_CREATED='+str(st.get('latestCreatedRevisionName','')))
          print('LATEST_READY='+str(st.get('latestReadyRevisionName','')))
          for t in st.get('traffic') or []:
              print('TRAFFIC='+str(t.get('revisionName') or t.get('type') or 'LATEST')+':'+str(t.get('percent',0)))
          PY
          CREATED=$(python3 - <<'PY'
          import json
          print((json.load(open('/tmp/service.json')).get('status') or {}).get('latestCreatedRevisionName') or '')
          PY
          )
          READY=$(python3 - <<'PY'
          import json
          print((json.load(open('/tmp/service.json')).get('status') or {}).get('latestReadyRevisionName') or '')
          PY
          )
          for REV in "$CREATED" "$READY"; do
            [ -n "$REV" ] || continue
            echo "--- REVISION=$REV ---"
            gcloud run revisions describe "$REV" --project="$PROJECT" --region="$REGION" --format=json > /tmp/rev.json
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/rev.json'))
          st=r.get('status') or {}
          for c in st.get('conditions') or []:
              print('CONDITION='+str(c.get('type',''))+':'+str(c.get('status',''))+':'+str(c.get('reason',''))+':'+str(c.get('message','')).replace('\n',' ')[:500])
          spec=r.get('spec') or {}
          containers=spec.get('containers') or []
          envs=(containers[0].get('env') or []) if containers else []
          by={str(e.get('name','')):e for e in envs}
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']:
              e=by.get(name)
              if not e: state='MISSING'
              elif e.get('valueFrom') or e.get('valueSource'): state='SECRET_REF'
              elif str(e.get('value','')).strip(): state='SET'
              else: state='EMPTY'
              print(name+'='+state)
          if containers:
              image=str(containers[0].get('image',''))
              print('IMAGE='+image)
          PY
          done
