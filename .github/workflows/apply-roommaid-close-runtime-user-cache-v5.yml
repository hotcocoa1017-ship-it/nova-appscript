name: Apply Roommaid Close Runtime User Cache V5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_roommaid_close_runtime_user_cache_v5_20260908'

permissions:
  contents: write

concurrency:
  group: nova-roommaid-close-runtime-cache-v5
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact runtime user-index cache patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('02_Repository.js')
          text = p.read_text(encoding='utf-8')
          marker = 'NOVA_USER_INDEX_RUNTIME_CACHE_V1'
          if marker not in text:
              text = text.replace(
                  ": { spreadsheet: null, sheets: {}, headerMaps: {} }; // (동일 실행 내 시트·헤더 재사용)",
                  ": { spreadsheet: null, sheets: {}, headerMaps: {}, userIndex: null }; // NOVA_USER_INDEX_RUNTIME_CACHE_V1 · 동일 실행 내 사용자 인덱스 재사용",
                  1
              )
              old = "function getUserIndex_() { // (사용자계정 인덱스 조회)\n  const cache = CacheService.getScriptCache();\n  const cached = cache.get('NOVA_USER_INDEX_V2');\n  if (cached) return JSON.parse(cached);"
              new = "function getUserIndex_() { // (사용자계정 인덱스 조회)\n  if (NOVA_RUNTIME_CACHE_.userIndex) return NOVA_RUNTIME_CACHE_.userIndex; // NOVA_USER_INDEX_RUNTIME_CACHE_V1\n  const cache = CacheService.getScriptCache();\n  const cached = cache.get('NOVA_USER_INDEX_V2');\n  if (cached) {\n    const parsed = JSON.parse(cached);\n    NOVA_RUNTIME_CACHE_.userIndex = parsed;\n    return parsed;\n  }"
              if old not in text:
                  raise SystemExit('getUserIndex cache anchor not found')
              text = text.replace(old, new, 1)
              old_return = "  if (serialized.length < 95000) {\n    cache.put('NOVA_USER_INDEX_V2', serialized, NOVA.CACHE_SECONDS);\n  }\n  return index;"
              new_return = "  if (serialized.length < 95000) {\n    cache.put('NOVA_USER_INDEX_V2', serialized, NOVA.CACHE_SECONDS);\n  }\n  NOVA_RUNTIME_CACHE_.userIndex = index; // NOVA_USER_INDEX_RUNTIME_CACHE_V1\n  return index;"
              if old_return not in text:
                  raise SystemExit('getUserIndex return anchor not found')
              text = text.replace(old_return, new_return, 1)
              old_clear = "  NOVA_RUNTIME_CACHE_.spreadsheet = null;\n  NOVA_RUNTIME_CACHE_.sheets = {};\n  NOVA_RUNTIME_CACHE_.headerMaps = {};"
              new_clear = "  NOVA_RUNTIME_CACHE_.spreadsheet = null;\n  NOVA_RUNTIME_CACHE_.sheets = {};\n  NOVA_RUNTIME_CACHE_.headerMaps = {};\n  NOVA_RUNTIME_CACHE_.userIndex = null; // NOVA_USER_INDEX_RUNTIME_CACHE_V1"
              if old_clear not in text:
                  raise SystemExit('clear cache anchor not found')
              text = text.replace(old_clear, new_clear, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact V5 safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NOVA_USER_INDEX_RUNTIME_CACHE_V1' 02_Repository.js
          grep -q 'NOVA_RUNTIME_CACHE_.userIndex' 02_Repository.js
          grep -q "cache.get('NOVA_USER_INDEX_V2')" 02_Repository.js
          grep -q 'NOVA_RUNTIME_CACHE_.userIndex = null' 02_Repository.js

      - name: Validate canonical operational invariants
        shell: bash
        run: |
          set -euo pipefail
          validators=(
            scripts/validate_qm_start_dbfirst_direct_20260905.py
            scripts/validate_qm_end_to_end_accel_20260906.py
            scripts/validate_qm_houseman_dbfirst_20260906.py
            scripts/validate_room_state_sync_hardening_20260906.py
            scripts/validate_qm_clear_dbfirst_operation_flags_20260907.py
            scripts/validate_room_previous_cycle_db_authority_20260907.py
            scripts/validate_room_upload_db_first_v4_20260907.py
            scripts/validate_checkout_dbfirst_20260907.py
            scripts/validate_room_upload_realtime_sync_20260907.py
            scripts/validate_qm_finalize_dbfirst_v2_20260907.py
            scripts/validate_qm_finalize_preflight_v2_20260907.py
            scripts/validate_site_scope_indicator_close_v2.py
            scripts/validate_order_site_context_v1.py
            scripts/validate_whole_db_transition_v2_20260908.py
            scripts/validate_admin_operation_settings_dbfirst_v1_20260908.py
            scripts/validate_admin_code_settings_dbfirst_v1_20260908.py
            scripts/validate_qm_checklist_definition_shape_v1_20260908.py
            scripts/validate_qm_checklist_codes_dbfirst_v1_20260908.py
            scripts/validate_indicator_houseman_order_ui_20260908.py
          )
          for validator in "${validators[@]}"; do
            python3 "$validator"
          done
          python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Persist minimal V5 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 02_Repository.js
          if git diff --cached --quiet; then
            echo 'V5 runtime user cache already present.'
          else
            git commit -m 'Reuse user index within Apps Script execution V5'
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo '::error::Apps Script OAuth secret is missing.'
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Check Apps Script version capacity
        shell: bash
        run: |
          set -euo pipefail
          versions="$(clasp versions)"
          version_count="$(printf '%s\n' "$versions" | grep -Ec '^[[:space:]]*[0-9]+[[:space:]]*-' || true)"
          echo "Apps Script versions: ${version_count}/200"
          if [ "$version_count" -ge 200 ]; then
            echo "::error::Apps Script version limit reached (${version_count}/200)."
            exit 4
          fi

      - name: Deploy existing NOVA web app
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --description "NOVA roommaid close runtime cache V5 ${GITHUB_SHA::12}"

      - name: Summary
        run: echo 'Roommaid close runtime user cache V5 validated and deployed.'
