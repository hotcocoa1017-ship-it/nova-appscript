name: Clean Release Validator Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.clean_release_validator_once_20260908'

permissions:
  contents: write

concurrency:
  group: nova-validator-cleanup-release
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Make release gate canonical-source aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/validate_nova_release.py')
          s = p.read_text(encoding='utf-8')
          if '# 8) Deployment repeatability / source-of-truth protection' in s:
              start = s.index('# 8) Deployment repeatability / source-of-truth protection')
              end = s.index('\npassed = ', start)
              replacement = '''# 8) Deployment repeatability / canonical source-of-truth protection\nrequire(workflow, 'NOVA_CANONICAL_CI_V2', 'Deploy uses canonical main source')\nrequire(workflow, 'Validate DB-first and operational invariants', 'Deploy validates DB-first invariants')\nrequire(workflow, 'Verify validators are read-only', 'Deploy enforces read-only validators')\nrequire(workflow, 'python3 scripts/validate_nova_release.py', 'Deploy runs release regression gate')\nrequire(workflow, 'clasp push --force', 'Deploy pushes canonical source only on explicit deploy')\nrequire(workflow, 'APPS_SCRIPT_DEPLOYMENT_ID', 'Deploy preserves existing web app deployment id')\nforbid(workflow, '      - name: Apply stable Realtime init hotfix', 'Historical patch stage removed from deploy')\nforbid(workflow, 'Persist generated production sources to main', 'CI no longer commits generated runtime source')\n'''
              s = s[:start] + replacement + s[end:]
              p.write_text(s, encoding='utf-8')
          PY
          python3 scripts/validate_whole_db_transition_v2_20260908.py
          python3 scripts/validate_nova_release.py
          git diff --check
      - name: Commit validator cleanup only
        shell: bash
        run: |
          set -euo pipefail
          target=scripts/validate_nova_release.py
          if git diff --quiet -- "$target"; then
            echo 'Canonical release validator already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Align NOVA release gate with canonical read-only CI [skip ci]'
          git push origin HEAD:main
