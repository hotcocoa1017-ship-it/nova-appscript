name: Repair Apps Script Version Limit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-apps-script-version-limit.yml'
      - 'scripts/prune_unused_apps_script_versions.js'
  workflow_run:
    workflows: ['Deploy NOVA Apps Script']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate pruning helper syntax
        run: node --check scripts/prune_unused_apps_script_versions.js

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json >/dev/null

      - name: Prune only unused old versions
        id: prune
        run: node scripts/prune_unused_apps_script_versions.js

      - name: Push current source after pruning
        if: steps.prune.outputs.pruned == 'true'
        run: clasp push --force

      - name: Update existing web app deployment
        if: steps.prune.outputs.pruned == 'true'
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA version-limit repair ${GITHUB_SHA::12}"

      - name: Repair summary
        run: |
          echo "Pruned: ${{ steps.prune.outputs.pruned }}"
          echo "Deleted versions: ${{ steps.prune.outputs.deleted_count }}"
