name: Validate Archive Production Predeploy

on:
  push:
    branches: [feat/archive-admin-gateway-20260905]
    paths:
      - '.github/workflows/validate-archive-production-predeploy-20260905.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot Archive integration before production patch chain
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ArchiveAdmin.js ArchiveAdminClient.html > /tmp/archive-before.sha
          grep -q "{ id: 'archive', label: 'Archive 이력' }" 04_Api.js
          grep -q "include_('ArchiveAdminClient')" Index.html
          echo 'ARCHIVE_PREPATCH_ANCHORS=OK'

      - name: Apply production patch chain exactly as main deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_sync_status_autohide.py
          python3 scripts/patch_telegram_self_connect.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          python3 scripts/patch_roommaid_performance_attribution.py
          python3 scripts/patch_roommaid_close_read_acceleration.py
          python3 scripts/fix_patch_site_scope_v2.py
          python3 scripts/patch_site_scope_indicator_close_v2.py
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/patch_houseman_realtime_push.py
          python3 scripts/patch_concurrent_write_resilience_v1.py
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          python3 scripts/patch_mobile_view_state_persistence_20260904.py
          echo 'PRODUCTION_PATCH_CHAIN=OK'

      - name: Verify Archive integration survives production patch chain
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/archive-before.sha
          grep -q "{ id: 'archive', label: 'Archive 이력' }" 04_Api.js
          grep -q "include_('ArchiveAdminClient')" Index.html
          python3 - <<'PY'
          from pathlib import Path
          api=Path('04_Api.js').read_text(encoding='utf-8')
          admin=api.split('ADMIN: [',1)[1].split('],',1)[0]
          order=api.split('ORDER: [',1)[1].split('],',1)[0]
          if "id: 'archive'" not in admin: raise SystemExit('Archive menu removed from ADMIN')
          if "id: 'archive'" in order: raise SystemExit('Archive menu leaked to ORDER')
          print('ARCHIVE_POSTPATCH_SCOPE=ADMIN_ONLY')
          PY
          echo 'ARCHIVE_PATCH_CHAIN_COMPATIBILITY=OK'

      - name: Run production release validation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_site_scope_indicator_close_v2.py
          python3 scripts/validate_order_site_context_v1.py
          python3 scripts/validate_nova_release.py
          echo 'PRODUCTION_RELEASE_GATES=OK'

      - name: Validate generated JavaScript syntax including Archive
        shell: bash
        run: |
          set -euo pipefail
          node --check 03_Auth.js
          node --check 05_Performance.js
          node --check 10_Mobile.js
          node --check 16_QmChecklist.js
          node --check QmMobileBrowse.js
          node --check RealtimeDailySync.js
          node --check 17_RoommaidPerformance.js
          node --check 19_RoommaidCloseJournal.js
          node --check TelegramSelfConnect.js
          node --check ArchiveAdmin.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for source, target in [
              ('Client.html', '/tmp/NovaClient.js'),
              ('HousemanUiPerformancePatch.html', '/tmp/NovaNotification.js'),
              ('ArchiveAdminClient.html', '/tmp/NovaArchiveAdminClient.js'),
          ]:
              text=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
              if not scripts: raise SystemExit(f'No script block found in {source}')
              Path(target).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          node --check /tmp/NovaNotification.js
          node --check /tmp/NovaArchiveAdminClient.js
          echo 'PRODUCTION_AND_ARCHIVE_SYNTAX=OK'

      - name: Verify clasp inclusion rules for Archive files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          cfg=json.load(open('.clasp.json'))
          if cfg.get('rootDir','') not in ('',None): raise SystemExit('Unexpected clasp rootDir')
          if '.js' not in (cfg.get('scriptExtensions') or []): raise SystemExit('JS not pushed by clasp')
          if '.html' not in (cfg.get('htmlExtensions') or []): raise SystemExit('HTML not pushed by clasp')
          if __import__('pathlib').Path('.claspignore').exists(): raise SystemExit('Unexpected .claspignore requires manual review')
          print('ARCHIVE_CLASP_INCLUSION=OK')
          PY

      - name: Verify existing production sources still satisfy core routing anchors
        shell: bash
        run: |
          set -euo pipefail
          grep -q "API 설정과 보조 Realtime 연결을 분리해 고속 API 유지" Client.html
          grep -q "REALTIME_SUBSCRIPTION_RESILIENCE_V1" Client.html
          grep -q "CONCURRENT_WRITE_RESILIENCE_V1" 05_Performance.js
          grep -q "HOUSEMAN_REALTIME_PUSH_V1" Client.html
          grep -q "MOBILE_VIEW_STATE_PERSIST_V2" Client.html
          if grep -q "include_('OperationalStatusHotfix')" Index.html; then
            echo '::error::OperationalStatusHotfix must not intercept the Realtime path.'
            exit 2
          fi
          echo 'EXISTING_REALTIME_CORE_ANCHORS=OK'
