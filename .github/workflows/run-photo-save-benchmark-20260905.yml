name: Run Photo Save Benchmark 20260905

on:
  push:
    branches: [diag/photo-save-speed-20260905]
    paths:
      - PhotoSpeedDiag.js
      - .github/workflows/run-photo-save-benchmark-20260905.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret missing"
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
      - name: Push diagnostic function to HEAD only
        run: clasp push --force
      - name: Run photo save benchmark
        shell: bash
        run: |
          set -euo pipefail
          echo 'PHOTO_BENCHMARK_BEGIN'
          clasp run diagnoseHousemanPhotoSaveSpeed20260905 --params '[]'
          echo 'PHOTO_BENCHMARK_END'
      - name: Restore Apps Script HEAD to production main source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          clasp push --force
          echo 'APPS_SCRIPT_HEAD_RESTORED=main'
