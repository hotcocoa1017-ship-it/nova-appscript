name: Emergency repoint NOVA production to stable 333

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repoint:
    if: github.event.head_commit.message == 'Emergency repoint NOVA production to stable 333'
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo '::error::Apps Script OAuth secret is missing.'
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Repoint existing NOVA web app to stable version 333
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --versionNumber 333 \
            --description 'NOVA emergency login recovery stable 333' \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp list-deployments | tee /tmp/deployments.txt
          grep -F "$APPS_SCRIPT_DEPLOYMENT_ID" /tmp/deployments.txt
          grep -F '@333' /tmp/deployments.txt
