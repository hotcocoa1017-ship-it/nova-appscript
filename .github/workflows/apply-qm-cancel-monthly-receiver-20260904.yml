name: Apply QM cancel and monthly receiver patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-qm-cancel-monthly-receiver-20260904.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply QM cancel and monthly receiver patch
        run: python scripts/patch_qm_cancel_monthly_receiver_20260904.py

      - name: Validate source diff and behavior anchors
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path

          indicator = Path('06_Indicator.js').read_text(encoding='utf-8')
          monthly = Path('11_Monthly.js').read_text(encoding='utf-8')
          client = Path('Client.html').read_text(encoding='utf-8')

          assert "case 'QM_CLEAR'" in indicator
          block = indicator[indicator.index("case 'QM_CLEAR'"):indicator.index("case 'CLEAR_ASSIGNMENT'", indicator.index("case 'QM_CLEAR'"))]
          assert "previousCleaningStatus !== 'QM_WAITING'" in block
          assert "updates['QM사번'] = ''" in block
          assert "updates['청소상태'] = 'COMPLETED'" in block
          for forbidden in ["updates['룸메이드사번']", "updates['보조룸메이드사번']", "updates['정비유형']", "updates['배정유형']"]:
              assert forbidden not in block, forbidden
          assert "action === 'QM_CLEAR'" in indicator
          assert 'syncNovaRealtimeRoomForAction(token' in indicator
          assert 'previousQmEmployeeNo' in indicator

          assert "const registeredEmployeeNo = String(data['등록사번']" in monthly
          assert "const qmReceiverEmployeeNo = typeCode === 'QM'" in monthly
          assert "processorEmployeeNo || assignedEmployeeNo || targetEmployeeNo || qmReceiverEmployeeNo" in monthly
          assert "QM_CLEAR: 'QM 배정 취소'" in monthly

          assert 'data-room-action="QM_CLEAR"' in client
          assert "if (action === 'QM_CLEAR')" in client
          assert "cleaningStatus: 'COMPLETED'" in client
          assert "QM_CLEAR: 'QM 배정 취소'" in client
          assert "qmClearAvailable" in client
          print('Static QM cancel / monthly receiver validation passed.')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 06_Indicator.js
          node --check 11_Monthly.js
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No Client.html script blocks found')
          Path('/tmp/NovaClientQmCancel.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClientQmCancel.js

      - name: Validate monthly QM receiver fallback scenarios
        run: |
          python - <<'PY'
          def resolve(type_code, target='', assigned='', processor='', registered=''):
              qm_receiver = registered if type_code == 'QM' and not processor and not assigned and not target else ''
              employee_nos = []
              for value in (target, assigned, processor, qm_receiver):
                  if value and value not in employee_nos:
                      employee_nos.append(value)
              primary = processor or assigned or target or qm_receiver
              return primary, employee_nos

          assert resolve('QM', registered='1001') == ('1001', ['1001'])
          assert resolve('QM', target='2002', registered='1001') == ('2002', ['2002'])
          assert resolve('QM', assigned='3003', registered='1001') == ('3003', ['3003'])
          assert resolve('CLEANING', registered='1001') == ('', [])
          print('Monthly QM receiver fallback scenarios passed.')
          PY

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06_Indicator.js 11_Monthly.js Client.html
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add QM assignment cancel and monthly receiver fallback"
          git push origin HEAD:main
