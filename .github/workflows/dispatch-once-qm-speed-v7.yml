name: Dispatch QM speed hotfix once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-once-qm-speed-v7.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger canonical Apps Script deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --repo hotcocoa1017-ship-it/nova-appscript --ref main -f deploy=true
