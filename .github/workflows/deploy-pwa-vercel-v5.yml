name: Deploy NOVA PWA V5 to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.deploy_pwa_vercel_v5_20260908'

permissions:
  contents: read

concurrency:
  group: nova-pwa-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate PWA V5 source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VAPID_VERSION='20260908-v5'" pwa/v2/index.html
          grep -q "BChAXSYu9Ek8PxyUPQIDutnL3Nx1AV-2GlljuOO5L074gO1keV8zThPAWILU1_9JpAislux--l3USxuTZYQthNI" pwa/v2/index.html
          grep -q "nova-pwa-v2-vercel-8" pwa/v2/sw.js
          grep -q "NOVA_PUSH_SUBSCRIPTION_KEY_GUARD_V1" pwa/v2/index.html

      - name: Check Vercel deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN repository secret is missing"; exit 3; }
          test -n "${VERCEL_ORG_ID:-}" || { echo "::error::VERCEL_ORG_ID repository secret is missing"; exit 3; }
          test -n "${VERCEL_PROJECT_ID:-}" || { echo "::error::VERCEL_PROJECT_ID repository secret is missing"; exit 3; }
          echo "Vercel deployment credentials are configured."

      - name: Link existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pwa/v2/.vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > pwa/v2/.vercel/project.json

      - name: Deploy production PWA
        shell: bash
        run: |
          set -euo pipefail
          cd pwa/v2
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
