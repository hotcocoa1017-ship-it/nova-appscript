name: Probe Cloud Run Access

on:
  push:
    branches: [diag/cloudrun-oauth-access-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check existing repository GCP credential hooks
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID_SECRET: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT_SECRET: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GCP_REGION_SECRET: ${{ secrets.GCP_REGION }}
          GCP_PROJECT_ID_VAR: ${{ vars.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_PROJECT_VAR: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GCP_REGION_VAR: ${{ vars.GCP_REGION }}
          CLOUD_RUN_REGION_VAR: ${{ vars.CLOUD_RUN_REGION }}
        run: |
          set -euo pipefail
          found=0
          for name in \
            GCP_SA_KEY GCP_CREDENTIALS GOOGLE_CREDENTIALS GOOGLE_APPLICATION_CREDENTIALS_JSON \
            GCP_SERVICE_ACCOUNT_KEY GCP_WORKLOAD_IDENTITY_PROVIDER WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT GOOGLE_SERVICE_ACCOUNT GCP_PROJECT_ID_SECRET GOOGLE_CLOUD_PROJECT_SECRET \
            GCP_REGION_SECRET GCP_PROJECT_ID_VAR GOOGLE_CLOUD_PROJECT_VAR GCP_REGION_VAR CLOUD_RUN_REGION_VAR
          do
            if [ -n "${!name:-}" ]; then
              echo "$name PRESENT"
              found=$((found+1))
            else
              echo "$name ABSENT"
            fi
          done
          echo "GCP_HOOK_COUNT $found"
