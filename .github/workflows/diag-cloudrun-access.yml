name: Probe Cloud Run Access

on:
  push:
    branches: [diag/cloudrun-oauth-access-20260829]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe existing Google OAuth for Cloud Run read access
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.parse, urllib.error

          raw = os.environ.get('CLASPRC_JSON','')
          if not raw and os.environ.get('CLASPRC_JSON_B64',''):
              raw = base64.b64decode(os.environ['CLASPRC_JSON_B64']).decode('utf-8')
          if not raw:
              raise SystemExit('CLASPRC secret missing')
          root = json.loads(raw)

          def find_creds(node):
              if isinstance(node, dict):
                  if node.get('refresh_token') and node.get('client_id'):
                      return node
                  for v in node.values():
                      r = find_creds(v)
                      if r: return r
              elif isinstance(node, list):
                  for v in node:
                      r = find_creds(v)
                      if r: return r
              return None

          cred = find_creds(root)
          if not cred:
              raise SystemExit('No refresh-token credentials found in clasp auth')
          data = {
              'client_id': cred['client_id'],
              'refresh_token': cred['refresh_token'],
              'grant_type': 'refresh_token',
          }
          if cred.get('client_secret'):
              data['client_secret'] = cred['client_secret']
          req = urllib.request.Request(
              'https://oauth2.googleapis.com/token',
              data=urllib.parse.urlencode(data).encode(),
              headers={'Content-Type':'application/x-www-form-urlencoded'},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  token_body = json.load(r)
          except urllib.error.HTTPError as e:
              print('OAUTH_REFRESH_STATUS', e.code)
              raise SystemExit(2)
          token = token_body.get('access_token','')
          if not token:
              raise SystemExit('OAuth refresh returned no access token')

          headers = {'Authorization': 'Bearer ' + token, 'Accept':'application/json'}
          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read().decode() or '{}')
                  except Exception: body={}
                  return e.code, body

          status, projects = get_json('https://cloudresourcemanager.googleapis.com/v1/projects?pageSize=100')
          print('RESOURCE_MANAGER_STATUS', status)
          if status != 200:
              err = (projects.get('error') or {}) if isinstance(projects, dict) else {}
              print('RESOURCE_MANAGER_ERROR', err.get('status','UNKNOWN'))
              raise SystemExit(3)

          active = [p for p in projects.get('projects',[]) if p.get('lifecycleState') == 'ACTIVE']
          print('ACTIVE_PROJECT_COUNT', len(active))
          found = []
          for p in active:
              pid = p.get('projectId','')
              if not pid: continue
              loc_status, loc_body = get_json(f'https://run.googleapis.com/v2/projects/{pid}/locations?pageSize=100')
              if loc_status != 200:
                  continue
              for loc in loc_body.get('locations',[]):
                  lid = loc.get('locationId') or str(loc.get('name','')).split('/')[-1]
                  if not lid: continue
                  svc_status, svc_body = get_json(f'https://run.googleapis.com/v2/projects/{pid}/locations/{lid}/services?pageSize=100')
                  if svc_status != 200:
                      continue
                  for svc in svc_body.get('services',[]):
                      name = str(svc.get('name',''))
                      if not name.endswith('/services/nova-realtime-api'):
                          continue
                      envs = []
                      containers = ((svc.get('template') or {}).get('containers') or [])
                      if containers:
                          envs = containers[0].get('env') or []
                      env_by_name = {str(e.get('name','')): e for e in envs}
                      def kind(var):
                          e=env_by_name.get(var)
                          if not e: return 'MISSING'
                          if e.get('valueSource'): return 'SECRET_REF'
                          return 'SET' if str(e.get('value','')) else 'EMPTY'
                      found.append((pid,lid,kind('SUPABASE_URL'),kind('SUPABASE_PUBLISHABLE_KEY'),kind('SUPABASE_JWT_SECRET')))

          print('NOVA_SERVICE_COUNT', len(found))
          for pid,lid,a,b,c in found:
              print('NOVA_SERVICE', pid, lid)
              print('SUPABASE_URL', a)
              print('SUPABASE_PUBLISHABLE_KEY', b)
              print('SUPABASE_JWT_SECRET', c)
          if not found:
              raise SystemExit(4)
          PY
