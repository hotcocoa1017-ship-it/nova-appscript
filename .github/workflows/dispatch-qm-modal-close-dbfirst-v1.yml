name: Dispatch QM Modal Close DB First V1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.dispatch_qm_modal_close_dbfirst_v1_20260908'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --ref main -f deploy=true
