name: Validate NOVA I18N Branch

on:
  push:
    branches: [i18n-login-order-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wire production workflow
        run: python3 scripts/patch_i18n_workflow_v1.py

      - name: Apply i18n source patch
        run: python3 scripts/patch_i18n_login_order_v1.py

      - name: Validate i18n scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "NOVA_I18N_V1" Index.html
          grep -q "include_('I18nClient')" Index.html
          grep -q "function translateNovaHousemanOrderPayload" I18nServer.js
          grep -q "Realtime 오더 번역" Client.html
          grep -q "sourceLanguage: String(window.NOVA_I18N" Client.html
          grep -q "사진 오더 원문언어" HousemanRequestPhotoClient.html
          grep -q "모바일 오더 저장 전 한국어 변환" 10_Mobile.js
          grep -q "원문/한국어 번역 메타" 07_Houseman.js
          grep -q "Apply login language and bilingual order storage V1" .github/workflows/deploy-apps-script.yml

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check 07_Houseman.js
          node --check 10_Mobile.js
          node --check I18nServer.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for source, target in [
              ('Client.html', '/tmp/NovaClient.js'),
              ('HousemanRequestPhotoClient.html', '/tmp/NovaPhoto.js'),
              ('I18nClient.html', '/tmp/NovaI18n.js'),
          ]:
              text = Path(source).read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No script block found in {source}')
              Path(target).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js
          node --check /tmp/NovaPhoto.js
          node --check /tmp/NovaI18n.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(Index.html Client.html HousemanRequestPhotoClient.html 07_Houseman.js 10_Mobile.js .github/workflows/deploy-apps-script.yml)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_i18n_workflow_v1.py
          python3 scripts/patch_i18n_login_order_v1.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated branch sources
        shell: bash
        run: |
          set -euo pipefail
          files=(Index.html Client.html HousemanRequestPhotoClient.html 07_Houseman.js 10_Mobile.js)
          if git diff --quiet -- "${files[@]}"; then
            echo "Validated branch sources already persisted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Persist validated NOVA i18n sources [skip ci]"
          git push origin HEAD:i18n-login-order-v1
