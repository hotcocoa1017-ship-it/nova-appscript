name: Validate QM DB-first Hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - 'QmDbFirstControlsHotfix.html'
      - 'Index.html'
      - 'scripts/validate_qm_dbfirst_save_unblock_20260911.py'
      - '.github/workflows/validate-qm-dbfirst-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify minimal blast radius
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed"
          for protected in Client.html 16_QmChecklist.js 07_Houseman.js HousemanOrderPopupExtrasClient.html HousemanPopupThumbQuarter.html; do
            if printf '%s\n' "$changed" | grep -Fxq "$protected"; then
              echo "::error::Protected core path was modified: $protected"
              exit 2
            fi
          done

      - name: Validate QM DB-first unblock invariants
        run: python3 scripts/validate_qm_dbfirst_save_unblock_20260911.py

      - name: Validate production release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate hotfix JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('QmDbFirstControlsHotfix.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one script block, found {len(scripts)}')
          Path('/tmp/QmDbFirstControlsHotfix.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/QmDbFirstControlsHotfix.js

      - name: Verify validation is read-only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Validation modified repository source."
            git status --short
            exit 2
          fi
