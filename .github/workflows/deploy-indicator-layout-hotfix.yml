name: Deploy NOVA Indicator Layout Hotfix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_mobile_indicator_layout_v1.py'
      - '.github/workflows/deploy-indicator-layout-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply indicator layout optimization
        run: python3 scripts/patch_mobile_indicator_layout_v1.py

      - name: Validate indicator UI markers and structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MOBILE_INDICATOR_LAYOUT_V1" Client.html
          grep -q "MOBILE_INDICATOR_LAYOUT_V1" Styles.html
          grep -q "INDICATOR_DESKTOP_LAYOUT_V1" Styles.html
          grep -q "INDICATOR_DESKTOP_LAYOUT_V2" Styles.html
          grep -q 'class="indicator-query-row"' Client.html
          grep -q 'id="indicatorQueryButton"' Client.html
          grep -q -- '-webkit-line-clamp: 2' Styles.html
          grep -q 'grid-template-columns: 220px 220px 104px minmax(220px, 320px) minmax(0, 1fr)' Styles.html
          grep -q 'grid-column: 4' Styles.html
          grep -q 'max-width: 320px' Styles.html

      - name: Validate existing site-scope and explicit-query protections
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SITE_SCOPE_INDICATOR_CLOSE_V2" Index.html
          grep -q "SITE_SCOPE_INDICATOR_CLOSE_V2" 03_Auth.js
          grep -q "SITE_SCOPE_INDICATOR_CLOSE_V2" Client.html
          grep -q "indicatorQueryButton" Client.html
          grep -q "markIndicatorQueryDirty_" Client.html
          grep -q "loadIndicatorSnapshot" Client.html
          if grep -q "include_('OperationalStatusHotfix')" Index.html; then
            echo "::error::OperationalStatusHotfix must not intercept the Realtime path."
            exit 2
          fi

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html Styles.html | sha256sum | awk '{print $1}')"
          python3 scripts/patch_mobile_indicator_layout_v1.py
          after="$(sha256sum Client.html Styles.html | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist validated UI sources to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html Styles.html; then
            echo "UI sources already match repository source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Client.html Styles.html
            git commit -m "Persist NOVA indicator layout optimization [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA indicator layout ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: |
          echo "NOVA indicator layout validated and deployed."
          echo "Commit: $GITHUB_SHA"
