name: Validate Photo Batch Nonblocking 20260905

on:
  push:
    branches: [perf/photo-batch-nonblocking-20260905]
    paths:
      - HousemanRequestPhotoBatch.js
      - HousemanRequestPhotoBatchClient.html
      - HousemanRequestPhotoMetadata.js
      - HousemanRequestPhoto.js
      - 11_Monthly.js
      - Index.html
      - PhotoBatchPerfDiag.js
      - PhotoBatchPerfDiagWeb.js
      - .github/workflows/validate-photo-batch-nonblocking-20260905.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production delta and syntax
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node --check HousemanRequestPhotoBatch.js
          node --check HousemanRequestPhotoMetadata.js
          node --check HousemanRequestPhoto.js
          node --check 11_Monthly.js
          node --check PhotoBatchPerfDiag.js
          node --check PhotoBatchPerfDiagWeb.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('HousemanRequestPhotoBatchClient.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one photo batch script, got {len(scripts)}')
          Path('/tmp/NovaPhotoBatchClient.js').write_text(scripts[0], encoding='utf-8')
          index = Path('Index.html').read_text(encoding='utf-8')
          old = "<?!= include_('HousemanRequestPhotoClient'); ?>"
          new = "<?!= include_('HousemanRequestPhotoBatchClient'); ?>"
          if old not in index or new not in index or index.index(new) < index.index(old):
              raise SystemExit('Photo batch client must load after existing photo UI client')
          server = Path('HousemanRequestPhotoBatch.js').read_text(encoding='utf-8')
          upload_block = server.split('function uploadMobileHousemanRequestPhotos', 1)[1].split('function readHousemanRequestPhotoMetadata_', 1)[0]
          if 'LockService' in upload_block or 'acquireWriteLock_' in upload_block:
              raise SystemExit('Photo upload path must not acquire any Apps Script lock')
          PY
          node --check /tmp/NovaPhotoBatchClient.js
          grep -q "HOUSEMAN_PHOTO_BATCH_FAST_V2" HousemanRequestPhotoBatch.js
          grep -q "window.addEventListener('click', handlePhotoBatchClickCapture_, true)" HousemanRequestPhotoBatchClient.html
          grep -q "void persistPhotosAfterMirror_" HousemanRequestPhotoBatchClient.html
          grep -q "event.stopImmediatePropagation" HousemanRequestPhotoBatchClient.html
          grep -q "NOVA_HOUSEMAN_PHOTO_METADATA_HEADER_ = '요청사진JSON'" HousemanRequestPhotoBatch.js
          grep -q "HOUSEMAN_PHOTO_METADATA_COLUMN_V1" HousemanRequestPhoto.js
          grep -q "HOUSEMAN_PHOTO_METADATA_COLUMN_V1" 11_Monthly.js

      - name: Apply production patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_sync_status_autohide.py
          python3 scripts/patch_telegram_self_connect.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          python3 scripts/patch_roommaid_performance_attribution.py
          python3 scripts/patch_roommaid_close_read_acceleration.py
          python3 scripts/fix_patch_site_scope_v2.py
          python3 scripts/patch_site_scope_indicator_close_v2.py
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/patch_houseman_realtime_push.py
          python3 scripts/patch_concurrent_write_resilience_v1.py
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          python3 scripts/patch_mobile_view_state_persistence_20260904.py
          python3 scripts/validate_site_scope_indicator_close_v2.py
          python3 scripts/validate_order_site_context_v1.py
          python3 scripts/validate_nova_release.py
          grep -q "include_('HousemanRequestPhotoBatchClient')" Index.html
          grep -q "HOUSEMAN_PHOTO_METADATA_COLUMN_V1" HousemanRequestPhoto.js
          grep -q "HOUSEMAN_PHOTO_METADATA_COLUMN_V1" 11_Monthly.js
          node --check HousemanRequestPhotoBatch.js
          node --check HousemanRequestPhotoMetadata.js
          node --check HousemanRequestPhoto.js
          node --check 11_Monthly.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('HousemanRequestPhotoBatchClient.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          Path('/tmp/NovaPhotoBatchClientAfterPatch.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaPhotoBatchClientAfterPatch.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret missing"
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"

      - name: Push diagnostic branch to Apps Script HEAD
        run: clasp push --force

      - name: Create temporary deployment and benchmark zero-lock photo path
        id: diag
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(clasp create-deployment --description 'TEMP NOVA photo batch zero-lock diag 20260905')"
          printf '%s\n' "$DEPLOY_OUTPUT"
          DEPLOY_ID="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -oE 'AKfy[a-zA-Z0-9_-]+' | tail -1)"
          test -n "$DEPLOY_ID"
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          URL="https://script.google.com/macros/s/${DEPLOY_ID}/exec"

          echo 'PHOTO_BATCH_PREPARE_BEGIN'
          curl --max-time 60 -fsSL -d '' "${URL}?mode=prepare" > /tmp/photo-prepare.json
          cat /tmp/photo-prepare.json
          echo
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/photo-prepare.json', encoding='utf-8'))
          assert p.get('ok') is True, p
          PY
          echo 'PHOTO_BATCH_PREPARE_END'

          echo 'PHOTO_BATCH_BENCHMARK_BEGIN'
          curl --max-time 180 -fsSL -d '' "${URL}?mode=batch" > /tmp/photo-batch-result.json &
          BATCH_PID=$!
          sleep 2
          for i in 1 2 3 4 5; do
            curl --max-time 30 -fsSL -d '' "${URL}?mode=lockProbe" > "/tmp/photo-lock-${i}.json"
            cat "/tmp/photo-lock-${i}.json"
            echo
            sleep 0.5
          done
          wait "$BATCH_PID"
          cat /tmp/photo-batch-result.json
          echo
          echo 'PHOTO_BATCH_BENCHMARK_END'

          python3 - <<'PY'
          import json
          batch=json.load(open('/tmp/photo-batch-result.json', encoding='utf-8'))
          assert batch.get('ok') is True, batch
          assert batch.get('photoCount') == 5, batch
          pp=batch.get('photoPerformance') or {}
          assert pp.get('lockWaitMs') == 0, pp
          assert pp.get('metadataWriteMs', 999999) < 3000, pp
          probes=[]
          for i in range(1,6):
              p=json.load(open(f'/tmp/photo-lock-{i}.json', encoding='utf-8'))
              probes.append(p)
              assert p.get('acquired') is True, p
              assert p.get('waitMs', 999999) < 750, p
          print('PHOTO_BATCH_RESULT', json.dumps(batch, ensure_ascii=False))
          print('PHOTO_LOCK_PROBES', json.dumps(probes, ensure_ascii=False))
          PY

          curl --max-time 60 -fsSL -d '' "${URL}?mode=cleanup" > /tmp/photo-cleanup.json
          cat /tmp/photo-cleanup.json
          echo
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/photo-cleanup.json', encoding='utf-8'))
          assert c.get('ok') is True and c.get('cleaned') is True, c
          PY

      - name: Remove temporary deployment
        if: always() && steps.diag.outputs.deployment_id != ''
        shell: bash
        run: clasp undeploy "${{ steps.diag.outputs.deployment_id }}" || true

      - name: Restore Apps Script HEAD to production main source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          clasp push --force
          echo 'APPS_SCRIPT_HEAD_RESTORED=main'
