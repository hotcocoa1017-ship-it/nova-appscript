name: Restore verified Realtime v95

on:
  push:
    branches:
      - fix/realtime-full-restore-20260829

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json
      - name: Recover verified deployed version 95
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nova-v95
          mkdir -p /tmp/nova-v95
          cd /tmp/nova-v95
          clasp clone 1eBwsaCPGbbtiWINYD4IB0I0GBTGHn-2Dag3dWVHoet8weX2YD_FS5kR8 95
      - name: Restore verified source
        shell: bash
        run: |
          set -euo pipefail
          for f in 06_Indicator.js 07_Houseman.js 09_RoomStatusUpload.js 10_Mobile.js 11_Monthly.js 14_DailyClose.js 16_QmChecklist.js 19_RoommaidCloseJournal.js HousemanRequestPhoto.js HousemanRequestPhotoClient.html RealtimeDailySync.js Styles.html; do
            cp "/tmp/nova-v95/$f" "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def function_span(text, name):
              match = re.search(r'(?m)^\s*(?:async\s+)?function\s+' + re.escape(name) + r'\s*\(', text)
              if not match:
                  raise RuntimeError(f'function not found: {name}')
              start, brace = match.start(), text.find('{', match.end())
              depth, i, quote, escaped, line_comment, block_comment = 0, brace, None, False, False, False
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 1
                  elif quote:
                      if escaped: escaped = False
                      elif ch == '\\': escaped = True
                      elif ch == quote: quote = None
                  else:
                      if ch == '/' and nxt == '/': line_comment = True; i += 1
                      elif ch == '/' and nxt == '*': block_comment = True; i += 1
                      elif ch in ('\'', '"', '`'): quote = ch
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0: return start, i + 1
                  i += 1
              raise RuntimeError(f'unclosed function: {name}')

          def replace_function(target, source, name):
              ts, te = function_span(target, name)
              ss, se = function_span(source, name)
              return target[:ts] + source[ss:se] + target[te:]

          v95 = Path('/tmp/nova-v95/Client.html').read_text(encoding='utf-8')
          main = subprocess.check_output(['git', 'show', 'origin/main:Client.html'], text=True)
          client = v95
          for name in ('initNovaRealtime_', 'novaRealtimeRoomChangesFetch_'):
              client = replace_function(client, main, name)

          old = """    if (!novaRealtimeIsEnabled_()) {\n      return callServer(legacyMethod, state.token, legacySafe);\n    }"""
          new = """    if (!novaRealtimeIsEnabled_()) {\n      if (mappedAction === 'UPDATE_ROOM_OPERATION_STATUS') {\n        const safeOperationalPayload = Object.assign({}, legacySafe, {\n          expectedOperationalStatus: String(legacySafe?.expectedState?.operationalStatus || '')\n        });\n        return callServer('updateRoomOperationalStatusSafe', state.token, safeOperationalPayload);\n      }\n      return callServer(legacyMethod, state.token, legacySafe);\n    }"""
          if client.count(old) != 1:
              raise RuntimeError('legacy fallback block mismatch')
          Path('Client.html').write_text(client.replace(old, new, 1), encoding='utf-8')

          index_path = Path('Index.html')
          index = index_path.read_text(encoding='utf-8').replace("  <?!= include_('OperationalStatusHotfix'); ?>\n", '')
          index_path.write_text(index, encoding='utf-8')

          patch_path = Path('HousemanUiPerformancePatch.html')
          patch = patch_path.read_text(encoding='utf-8')
          old_listener = "document.addEventListener('DOMContentLoaded',init);document.addEventListener('submit',onSubmit,true);document.addEventListener('click',onOperationalStatusClickCapture,true);document.addEventListener('click',onDocClick,true);"
          new_listener = "document.addEventListener('DOMContentLoaded',init);document.addEventListener('submit',onSubmit,true);document.addEventListener('click',onDocClick,true);"
          if patch.count(old_listener) != 1:
              raise RuntimeError('operational click capture marker mismatch')
          patch_path.write_text(patch.replace(old_listener, new_listener, 1), encoding='utf-8')
          PY
      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          grep -q "'CLEANING_RESET', 'ASSIGN_ROOMMAID', 'QM_ASSIGN', 'QM_START', 'QM_COMPLETE', 'QM_REWORK', 'UPDATE_ROOM_OPERATION_STATUS', 'UPDATE_OPERATION_FLAGS', 'CLEAR_ASSIGNMENT'" Client.html
          grep -q "API 설정과 보조 Realtime 연결을 분리해 고속 API 유지" Client.html
          grep -q "updateRoomOperationalStatusSafe" Client.html
          for action in ASSIGN_ROOMMAID QM_ASSIGN UPDATE_ROOM_OPERATION_STATUS CHANGE_ROOM_STATUS QM_START QM_COMPLETE QM_REWORK CLEANING_RESET CLEAR_ASSIGNMENT UPDATE_OPERATION_FLAGS; do
            grep -q "$action" RealtimeDailySync.js
          done
          ! grep -q "include_('OperationalStatusHotfix')" Index.html
          ! grep -q "addEventListener('click',onOperationalStatusClickCapture,true)" HousemanUiPerformancePatch.html
          for f in 06_Indicator.js 07_Houseman.js 09_RoomStatusUpload.js 10_Mobile.js 11_Monthly.js 14_DailyClose.js 16_QmChecklist.js 19_RoommaidCloseJournal.js HousemanRequestPhoto.js RealtimeDailySync.js RoomOperationalStatusFix.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for file_name in ['Client.html','HousemanRequestPhotoClient.html','HousemanUiPerformancePatch.html']:
              text = Path(file_name).read_text(encoding='utf-8')
              for index, script in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)):
                  tmp = Path(f'/tmp/{file_name.replace(".", "_")}_{index}.js')
                  tmp.write_text(script, encoding='utf-8')
                  subprocess.run(['node','--check',str(tmp)], check=True)
          PY
      - name: Commit source recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06_Indicator.js 07_Houseman.js 09_RoomStatusUpload.js 10_Mobile.js 11_Monthly.js 14_DailyClose.js 16_QmChecklist.js 19_RoommaidCloseJournal.js Client.html HousemanRequestPhoto.js HousemanRequestPhotoClient.html HousemanUiPerformancePatch.html Index.html RealtimeDailySync.js Styles.html
          git status --short
          git commit -m "Restore full Realtime routing from verified Apps Script v95 [skip ci]"
          git push origin HEAD:fix/realtime-full-restore-20260829
