name: One-time webapp latency check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-webapp-latency-check.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure deployed web app HTML latency
        shell: bash
        run: |
          set -euo pipefail
          url='https://script.google.com/macros/s/AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf/exec'
          for i in 1 2 3 4 5; do
            curl -L -sS -o /tmp/nova-webapp.html \
              --connect-timeout 10 --max-time 30 \
              -w "run=${i} http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s size=%{size_download}\n" \
              "$url"
            sleep 1
          done
          grep -q 'NOVA' /tmp/nova-webapp.html
