name: Validate Room Status Server DB First V1

on:
  push:
    branches:
      - feat/full-db-houseman-ui-20260907
    paths:
      - scripts/patch_room_status_server_dbfirst_v1.py
      - .github/workflows/validate-room-status-server-dbfirst-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-db-houseman-ui-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_room_status_server_dbfirst_v1.py
      - name: Validate server DB-first guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ROOM_STATUS_SERVER_DB_FIRST_V1' 06_Indicator.js
          grep -q 'changeIndicatorRoomStatusDbFirst_' 06_Indicator.js
          python - <<'PY'
          from pathlib import Path
          s=Path('06_Indicator.js').read_text(encoding='utf-8')
          branch=s.index("if (action === 'CHANGE_ROOM_STATUS'\n        && String(safe.roomStatus || '').trim().toUpperCase() !== 'CHECKED_OUT'")
          checkout_branch=s.index("if (action === 'CHANGE_ROOM_STATUS'\n        && String(safe.roomStatus || '').trim().toUpperCase() === 'CHECKED_OUT'", branch)
          helper=s.index('function changeIndicatorRoomStatusDbFirst_')
          checkout_helper=s.index('function changeIndicatorRoomCheckoutDbFirst_')
          assert branch < checkout_branch < helper < checkout_helper
          segment=s[branch:checkout_branch]
          assert 'novaMobileRealtimeEnabled_()' in segment
          assert 'changeIndicatorRoomStatusDbFirst_(token' in segment
          helper_text=s[helper:checkout_helper]
          required=[
            "action: 'CHANGE_ROOM_STATUS'",
            'roomStatus: requestedRoomStatus',
            'novaMobileRealtimeActionFetch_',
            'expectedVersion: 0',
            'expectedState',
            'mirrorPending: true',
            "requestedRoomStatus === 'CHECKED_OUT'",
          ]
          missing=[x for x in required if x not in helper_text]
          assert not missing, missing
          forbidden=['getRequiredSheet_', 'updateRowByHeaders_', 'appendUnifiedHistory_', 'reserveDataVersion_', 'getCodes_']
          present=[x for x in forbidden if x in helper_text]
          assert not present, present
          print('room status server DB-first guard validated')
          PY
      - name: Validate DB event mirror preserves room status semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          r=Path('RealtimeDailySync.js').read_text(encoding='utf-8')
          start=r.index("if (action === 'CHANGE_ROOM_STATUS')")
          end=r.index("if (['QM_START', 'QM_COMPLETE', 'QM_REWORK'].includes(action))", start)
          block=r[start:end]
          required=[
            'buildIndicatorPreviousCycleArchiveUpdates_',
            "updates['객실상태'] = requestedRoomStatus",
            'resolveIndicatorLastRoomStatusAfterChange_',
            "requestedRoomStatus === 'VACANT_CLEAN'",
            'resolveManualRoomStatusState_',
            "status: 'CHANGE_ROOM_STATUS'",
            'specialDepartureStarted:',
          ]
          missing=[x for x in required if x not in block]
          assert not missing, missing
          print('CHANGE_ROOM_STATUS DB event mirror preserves Sheet/history semantics')
          PY
      - name: JavaScript syntax checks
        run: node --check 06_Indicator.js && node --check RealtimeDailySync.js
      - name: NOVA regression validation
        run: python scripts/validate_nova_release.py
      - name: Patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          git diff -- 06_Indicator.js > /tmp/first.diff
          python scripts/patch_room_status_server_dbfirst_v1.py
          git diff -- 06_Indicator.js > /tmp/second.diff
          diff -u /tmp/first.diff /tmp/second.diff
      - name: Persist generated source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- 06_Indicator.js; then
            echo 'No generated source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 06_Indicator.js
          git commit -m 'Persist room status server DB-first v1 [skip ci]'
          git push origin HEAD:feat/full-db-houseman-ui-20260907
