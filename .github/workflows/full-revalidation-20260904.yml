name: NOVA Full Revalidation 2026-09-04

on:
  push:
    branches: [full-revalidation-20260904]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply current production patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_sync_status_autohide.py
          python3 scripts/patch_telegram_self_connect.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          python3 scripts/patch_roommaid_performance_attribution.py
          python3 scripts/patch_roommaid_close_read_acceleration.py
          python3 scripts/fix_patch_site_scope_v2.py
          python3 scripts/patch_site_scope_indicator_close_v2.py
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/patch_houseman_realtime_push.py
          python3 scripts/patch_concurrent_write_resilience_v1.py
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          python3 scripts/patch_mobile_view_state_persistence_20260904.py
          python3 scripts/patch_mobile_persistent_login_20260904.py
          python3 scripts/patch_mobile_persistent_login_visibility_20260904.py
          python3 scripts/patch_qm_houseman_request_parity_v1.py
          python3 scripts/patch_public_houseman_request_v1.py
          python3 scripts/patch_public_houseman_request_fast_v2.py
          python3 scripts/patch_monthly_houseman_columns_v1.py
          python3 scripts/patch_houseman_lost_found_shortcut_v1.py
          python3 scripts/patch_i18n_login_order_v1.py

      - name: Core release regression suites
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_site_scope_indicator_close_v2.py
          python3 scripts/validate_order_site_context_v1.py
          python3 scripts/validate_qm_houseman_request_parity_v1.py
          python3 scripts/validate_nova_release.py

      - name: Validate login and persistent mobile session
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LOGIN_TOKEN_HOURS: 12' 00_Config.js
          grep -q 'persistentSessionToken: mobilePersistent ? createPersistentLoginSession_(user)' 03_Auth.js
          grep -q 'function resumePersistentLogin' 03_Auth.js
          grep -q 'function revokePersistentLogin' 03_Auth.js
          grep -q 'id="loginRemember"' Index.html
          grep -q '이름·사번 저장' Index.html
          grep -q "NOVA_PERSISTENT_SESSION_KEY_ = 'novaPersistentSessionV1'" Client.html
          grep -q 'restoreRememberedLogin_();' Client.html
          grep -q 'handleVisibilityChange_' Client.html

      - name: Validate QM rework separation and mobile view persistence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QM_REWORK_OPERATIONAL_STATUS_V1' 10_Mobile.js
          grep -q "updates\[indicatorRoomOperationalStatusHeader_()\] = 'REWORK'" 10_Mobile.js
          grep -q "const targetCleaningStatus = 'QM_COMPLETED'" 16_QmChecklist.js
          grep -q 'qualityOnly: true' 16_QmChecklist.js
          grep -q 'reworkRequested: false' 16_QmChecklist.js
          grep -q 'MOBILE_LOCATION_FILTER_PERSIST_V1' Client.html
          grep -q 'MOBILE_VIEW_STATE_PERSIST_V2' Client.html
          grep -q 'restoreMobileViewPreference_' Client.html
          grep -q 'saveMobileViewPreference_' Client.html
          grep -q 'restoreScrollPending: true' Client.html
          grep -q "role === 'PUBLIC' || role === 'ROOMMAID' || (role === 'QM'" Client.html

      - name: Validate Houseman request flows
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QM_HOUSEMAN_REQUEST_PARITY_V1' Client.html
          grep -q 'PUBLIC_HOUSEMAN_REQUEST_V1' Client.html
          grep -q 'PUBLIC_HOUSEMAN_REQUEST_FAST_V2' Client.html
          grep -q 'PUBLIC_HOUSEMAN_REQUEST_FAST_V2' 10_Mobile.js
          grep -q 'PUBLIC_HOUSEMAN_REQUEST_FAST_V2' 12_Shifts.js
          grep -q 'resolveHousemanPublicFastAssignee_' 12_Shifts.js
          grep -q 'prefetchPublicHousemanAssignment_' Client.html
          grep -q "\['습득물', '기타'\]" 10_Mobile.js
          grep -q "'PUBLIC'" HousemanRequestPhoto.js
          grep -q 'HOUSEMAN_REALTIME_PUSH_V1' Client.html
          grep -q 'HOUSEMAN_LATEST_FIRST_V1' 07_Houseman.js
          grep -q 'HOUSEMAN_LATEST_FIRST_V1' 10_Mobile.js
          grep -q 'HOUSEMAN_LOST_FOUND_SHORTCUT_V1' Client.html
          grep -q "if (role === 'HOUSEMAN') return items;" Client.html

      - name: Validate monthly Houseman view
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MONTHLY_HOUSEMAN_COLUMNS_V1' 11_Monthly.js
          grep -q 'registeredByName' 11_Monthly.js
          grep -q 'handlerEmployeeNo' 11_Monthly.js
          grep -q 'handlerName' 11_Monthly.js
          grep -q '의뢰자(등록)' Client.html
          grep -q '담당자(접수.처리)' Client.html
          grep -q '등록.시작' Client.html

      - name: Validate multilingual UI and translated order storage
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NOVA_I18N_COMPLETE_V2' I18nClient.html
          grep -q 'NOVA_I18N_COMPLETE_V2' I18nServer.js
          grep -q "'비품': 'ของใช้'" I18nClient.html
          grep -q "'린넨': 'ผ้าลินิน'" I18nClient.html
          grep -q "'시설': 'งานซ่อมบำรุง'" I18nClient.html
          grep -q "'문의': 'สอบถาม'" I18nClient.html
          grep -q 'function translateNovaUiTextBatch' I18nServer.js
          grep -q 'function prepareNovaHousemanOrderPayloadForStorage_' I18nServer.js
          grep -q 'function translateNovaHousemanOrderPayload' I18nServer.js
          grep -q "translatedTo: 'ko'" I18nServer.js
          grep -q 'originalItems' I18nServer.js
          grep -q 'originalNote' I18nServer.js
          grep -q 'translatedItemsKo' I18nServer.js
          grep -q 'translatedNoteKo' I18nServer.js
          grep -q 'ORDER_TRANSLATION_FAILED' I18nServer.js
          grep -q 'MutationObserver' I18nClient.html
          grep -q 'flushAutoTranslations' I18nClient.html
          grep -q 'wrapNativeDialogs_' I18nClient.html
          if grep -q 'nova_rooms_current' I18nServer.js; then exit 2; fi
          if grep -q 'cleaning_status' I18nServer.js; then exit 2; fi
          if grep -q 'operational_status' I18nServer.js; then exit 2; fi

      - name: Validate all server JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do
            node --check "$f"
          done

      - name: Validate all HTML script blocks syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          checked = 0
          for source in sorted(Path('.').glob('*.html')):
              text = source.read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              for idx, script in enumerate(scripts):
                  # Skip script tags that contain only Apps Script templating directives.
                  cleaned = re.sub(r'<\?[!=].*?\?>', 'null', script, flags=re.S)
                  if not cleaned.strip():
                      continue
                  path = Path('/tmp') / f'nova_{source.stem}_{idx}.js'
                  path.write_text(cleaned, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
                  checked += 1
          if checked == 0:
              raise SystemExit('No HTML JavaScript blocks validated')
          print(f'Validated {checked} HTML JavaScript blocks.')
          PY

      - name: Validate patch-chain idempotence
        shell: bash
        run: |
          set -euo pipefail
          tracked=(00_Config.js 03_Auth.js 06_Indicator.js 07_Houseman.js 10_Mobile.js 11_Monthly.js 12_Shifts.js 16_QmChecklist.js 17_RoommaidPerformance.js 19_RoommaidCloseJournal.js Client.html Index.html Styles.html HousemanRequestPhoto.js HousemanRequestPhotoClient.html HousemanUiPerformancePatch.html I18nClient.html I18nServer.js RealtimeDailySync.js QmMobileBrowse.js)
          before="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_sync_status_autohide.py
          python3 scripts/patch_telegram_self_connect.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          python3 scripts/patch_roommaid_performance_attribution.py
          python3 scripts/patch_roommaid_close_read_acceleration.py
          python3 scripts/fix_patch_site_scope_v2.py
          python3 scripts/patch_site_scope_indicator_close_v2.py
          python3 scripts/patch_order_site_context_v1.py
          python3 scripts/patch_order_site_context_v2.py
          python3 scripts/patch_houseman_realtime_push.py
          python3 scripts/patch_concurrent_write_resilience_v1.py
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          python3 scripts/patch_mobile_view_state_persistence_20260904.py
          python3 scripts/patch_mobile_persistent_login_20260904.py
          python3 scripts/patch_mobile_persistent_login_visibility_20260904.py
          python3 scripts/patch_qm_houseman_request_parity_v1.py
          python3 scripts/patch_public_houseman_request_v1.py
          python3 scripts/patch_public_houseman_request_fast_v2.py
          python3 scripts/patch_monthly_houseman_columns_v1.py
          python3 scripts/patch_houseman_lost_found_shortcut_v1.py
          python3 scripts/patch_i18n_login_order_v1.py
          after="$(sha256sum "${tracked[@]}" | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Summary
        run: |
          echo 'NOVA FULL REVALIDATION PASS'
          echo 'Core regression, roles, Realtime, QM rework, mobile persistence, Houseman requests, monthly view, multilingual UI/order translation, JS syntax, and idempotence all passed.'
