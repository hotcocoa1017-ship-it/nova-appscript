name: Apply NOVA PWA VAPID V4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_pwa_vapid_v4_20260908'

permissions:
  contents: write

concurrency:
  group: nova-pwa-vapid-v4-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact VAPID V4 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_public = 'BKjiczDO9sG0qlh0rJDduCzQqT9tURU69oKN7mKmlyU4mnjx05x1FkUy-4Kaeqy40DReDmnQ1DR2s0ELu-SAgYM'
          new_public = 'BCx-wnFcdo7z-Xk2DtjIcsBHTySpAxbL5CfMf2b7ltnxhlCF99n2AROSvQwkrSdZHNbniaGHUZaBWNUVJnRkWTk'

          p = Path('pwa/v2/index.html')
          text = p.read_text(encoding='utf-8')
          assert text.count(old_public) == 1, 'unexpected PWA old public-key count'
          text = text.replace(old_public, new_public, 1)
          text = text.replace("VAPID_VERSION='20260908-v3'", "VAPID_VERSION='20260908-v4'", 1)
          text = text.replace('NOVA_PUSH_VAPID_RECOVERY_V3', 'NOVA_PUSH_VAPID_RECOVERY_V4', 1)
          text = text.replace('novaPushPromptDismissedAtV3', 'novaPushPromptDismissedAtV4', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('pwa/v2/sw.js')
          text = p.read_text(encoding='utf-8')
          assert "nova-pwa-v2-vercel-5" in text, 'unexpected SW cache baseline'
          text = text.replace('Push recovery V3', 'Push recovery V4', 1)
          text = text.replace("nova-pwa-v2-vercel-5", "nova-pwa-v2-vercel-6", 1)
          text = text.replace('NOVA_PUSH_VAPID_RECOVERY_V3', 'NOVA_PUSH_VAPID_RECOVERY_V4', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('db/nova_pwa_web_push_v2.sql')
          text = p.read_text(encoding='utf-8')
          if '--   nova_web_push_vapid_public_v2' not in text:
              text = text.replace('-- Required Vault secret names:\n', '-- Required Vault secret names:\n--   nova_web_push_vapid_public_v2\n', 1)
          start = text.index('create or replace function public.nova_web_push_config_service()')
          end = text.index('create or replace function nova_private.nova_notification_web_push_trigger()')
          config = '''create or replace function public.nova_web_push_config_service()\nreturns jsonb\nlanguage plpgsql\nstable\nsecurity definer\nset search_path to ''\nas $function$\ndeclare\n  v_public text;\n  v_private text;\nbegin\n  select s.decrypted_secret into v_public\n  from vault.decrypted_secrets s\n  where s.name='nova_web_push_vapid_public_v2'\n  limit 1;\n  select s.decrypted_secret into v_private\n  from vault.decrypted_secrets s\n  where s.name='nova_web_push_vapid_private_v2'\n  limit 1;\n  if coalesce(v_public,'')='' then raise exception 'VAPID public key unavailable'; end if;\n  if coalesce(v_private,'')='' then raise exception 'VAPID private key unavailable'; end if;\n  return jsonb_build_object(\n    'publicKey',v_public,\n    'privateKey',v_private,\n    'subject','https://evoetxfjmkkjptucwxsv.supabase.co'\n  );\nend;\n$function$;\nrevoke all on function public.nova_web_push_config_service() from public, anon, authenticated;\ngrant execute on function public.nova_web_push_config_service() to service_role;\n\n'''
          text = text[:start] + config + text[end:]
          p.write_text(text, encoding='utf-8')

          migration = Path('supabase/migrations/20260908_web_push_vapid_recovery_v4.sql')
          migration.write_text("""-- NOVA Web Push VAPID recovery V4\n-- Public/private key pair is provisioned atomically in Vault; secret values are never stored in Git.\n-- Required Vault secrets: nova_web_push_vapid_public_v2, nova_web_push_vapid_private_v2\n\ncreate or replace function public.nova_web_push_config_service()\nreturns jsonb\nlanguage plpgsql\nstable\nsecurity definer\nset search_path to ''\nas $function$\ndeclare\n  v_public text;\n  v_private text;\nbegin\n  select s.decrypted_secret into v_public\n  from vault.decrypted_secrets s\n  where s.name='nova_web_push_vapid_public_v2'\n  limit 1;\n  select s.decrypted_secret into v_private\n  from vault.decrypted_secrets s\n  where s.name='nova_web_push_vapid_private_v2'\n  limit 1;\n  if coalesce(v_public,'')='' then raise exception 'VAPID public key unavailable'; end if;\n  if coalesce(v_private,'')='' then raise exception 'VAPID private key unavailable'; end if;\n  return jsonb_build_object(\n    'publicKey',v_public,\n    'privateKey',v_private,\n    'subject','https://evoetxfjmkkjptucwxsv.supabase.co'\n  );\nend;\n$function$;\n\nrevoke all on function public.nova_web_push_config_service() from public, anon, authenticated;\ngrant execute on function public.nova_web_push_config_service() to service_role;\n""", encoding='utf-8')

          p = Path('scripts/validate_push_delivery_roles_v3_20260908.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(f"NEW_VAPID = '{old_public}'", f"NEW_VAPID = '{new_public}'", 1)
          old_v2 = 'BIcs42B7cfuzFyx_-h0Ji8G8TfsU7CvoX8RBZo65MZe-J1VQvP9VrFOL_o2VCHQo0Y01zxN4vDbkcbcvspg3Hr8'
          text = text.replace(f"OLD_VAPID = '{old_v2}'", f"OLD_VAPID = '{old_public}'", 1)
          text = text.replace("migration = read('supabase/migrations/20260908_web_push_vapid_recovery_v3.sql')", "migration = read('supabase/migrations/20260908_web_push_vapid_recovery_v4.sql')", 1)
          text = text.replace("require(base, NEW_VAPID, 'baseline DB current public VAPID key')", "require(base, 'nova_web_push_vapid_public_v2', 'baseline DB public VAPID Vault source')", 1)
          text = text.replace("require(migration, NEW_VAPID, 'migration current public VAPID key')", "require(migration, 'nova_web_push_vapid_public_v2', 'migration public VAPID Vault source')", 1)
          text = text.replace("VAPID_VERSION='20260908-v3'", "VAPID_VERSION='20260908-v4'", 1)
          text = text.replace('NOVA_PUSH_VAPID_RECOVERY_V3', 'NOVA_PUSH_VAPID_RECOVERY_V4')
          text = text.replace('nova-pwa-v2-vercel-5', 'nova-pwa-v2-vercel-6', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_push_permission_settings_v1.py
          python3 scripts/validate_push_delivery_roles_v3_20260908.py
          node --check pwa/v2/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          text=Path('pwa/v2/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
          assert blocks
          subprocess.run(['node','--check','-'],input='\n'.join(blocks),text=True,check=True)
          assert 'BCx-wnFcdo7z-Xk2DtjIcsBHTySpAxbL5CfMf2b7ltnxhlCF99n2AROSvQwkrSdZHNbniaGHUZaBWNUVJnRkWTk' in text
          assert "VAPID_VERSION='20260908-v4'" in text
          PY
          git diff --check

      - name: Commit VAPID V4 recovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwa/v2/index.html pwa/v2/sw.js db/nova_pwa_web_push_v2.sql supabase/migrations/20260908_web_push_vapid_recovery_v4.sql scripts/validate_push_delivery_roles_v3_20260908.py
          git commit -m "Deploy NOVA PWA VAPID recovery v4"
          git push origin HEAD:main
