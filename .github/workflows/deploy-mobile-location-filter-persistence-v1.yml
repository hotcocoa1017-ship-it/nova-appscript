name: Deploy Mobile Location Filter Persistence V1

on:
  workflow_run:
    workflows: ["Deploy NOVA Apps Script"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main after generic deployment
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply mobile location filter persistence V1
        run: python3 scripts/patch_mobile_location_filter_persistence_20260904.py

      - name: Validate persistence scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MOBILE_LOCATION_FILTER_PERSIST_V1" Client.html
          grep -q "function restoreMobileLocationPreference_" Client.html
          grep -q "function saveMobileLocationPreference_" Client.html
          grep -q "function restoreQmBrowseLocationPreference_" Client.html
          grep -q "role === 'PUBLIC' || role === 'ROOMMAID' || (role === 'QM'" Client.html
          grep -q "\['PUBLIC', 'ROOMMAID', 'QM'\].includes" Client.html

      - name: Validate generated JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('Client.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No script block found in Client.html')
          Path('/tmp/NovaClient.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/NovaClient.js

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html | awk '{print $1}')"
          python3 scripts/patch_mobile_location_filter_persistence_20260904.py
          after="$(sha256sum Client.html | awk '{print $1}')"
          test "$before" = "$after"

      - name: Persist patched source to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Client.html; then
            echo "Client source already contains mobile location persistence."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Client.html
            git commit -m "feat: persist mobile building floor filters [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 2))
            done
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo "::error::Apps Script OAuth secret is missing."
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update existing web app deployment
        shell: bash
        run: |
          set -euo pipefail
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "NOVA mobile location persistence ${GITHUB_SHA::12}"

      - name: Deployment summary
        run: echo "Mobile location filter persistence deployed to existing NOVA web app."
