name: Dispatch Houseman Server Thumbnail V3 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-once-houseman-thumb-v3.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-apps-script.yml --repo hotcocoa1017-ship-it/nova-appscript --ref main -f deploy=true
