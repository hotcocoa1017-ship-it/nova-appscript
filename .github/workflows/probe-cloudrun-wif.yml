name: Probe Cloud Run Through WIF

on:
  push:
    branches: [diag/realtime-token-after-secret-20260829]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/479836905263/locations/global/workloadIdentityPools/github-nova/providers/nova-appscript
          service_account: nova-github-deployer@project-6a8144e9-31f3-4d5c-b9b.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Probe serving revision without secret values
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='project-6a8144e9-31f3-4d5c-b9b'
          REGION='asia-southeast1'
          SERVICE='nova-realtime-api'
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json, subprocess
          s=json.load(open('/tmp/service.json'))
          status=s.get('status') or {}
          latest=status.get('latestReadyRevisionName') or ''
          print('LATEST_READY='+latest)
          for t in status.get('traffic') or []:
              print('TRAFFIC='+str(t.get('revisionName','LATEST'))+':'+str(t.get('percent',0)))
          print('SERVICE_URL='+str(status.get('url','')))
          if not latest:
              raise SystemExit('latest revision missing')
          raw=subprocess.check_output([
              'gcloud','run','revisions','describe',latest,
              '--project=project-6a8144e9-31f3-4d5c-b9b','--region=asia-southeast1','--format=json'
          ], text=True)
          r=json.loads(raw)
          containers=((((r.get('spec') or {}).get('containers')) or [])
                      or ((((r.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or []))
          envs=containers[0].get('env',[]) if containers else []
          by={str(e.get('name','')):e for e in envs}
          for name in ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','SUPABASE_JWT_SECRET']:
              e=by.get(name)
              if not e: state='MISSING'
              elif e.get('valueFrom') or e.get('valueSource'): state='SECRET_REF'
              elif str(e.get('value','')).strip(): state='SET'
              else: state='EMPTY'
              print(name+'='+state)
          PY
