name: Audit Apps Script v95

on:
  push:
    branches:
      - audit/apps-script-v95

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json
      - name: Clone deployed source version 95
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/nova-v95 /tmp/current-main-full /tmp/nova-diff
          mkdir -p /tmp/nova-v95 /tmp/current-main-full /tmp/nova-diff
          cd /tmp/nova-v95
          clasp clone 1eBwsaCPGbbtiWINYD4IB0I0GBTGHn-2Dag3dWVHoet8weX2YD_FS5kR8 95
      - name: Capture full current main and diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git archive origin/main | tar -x -C /tmp/current-main-full
          for f in Client.html RealtimeDailySync.js RealtimeBridge.js 06_Indicator.js 07_Houseman.js 10_Mobile.js 11_Monthly.js 16_QmChecklist.js 19_RoommaidCloseJournal.js HousemanRequestPhoto.js HousemanRequestPhotoClient.html Index.html; do
            if [[ -f "/tmp/current-main-full/$f" && -f "/tmp/nova-v95/$f" ]]; then
              safe="${f//\//_}"
              diff -u "/tmp/current-main-full/$f" "/tmp/nova-v95/$f" > "/tmp/nova-diff/${safe}.main_to_v95.diff" || true
            fi
          done
          echo '--- changed files summary ---'
          for f in /tmp/nova-v95/*; do
            base="$(basename "$f")"
            [[ -f "/tmp/current-main-full/$base" ]] || continue
            if ! cmp -s "$f" "/tmp/current-main-full/$base"; then
              printf '%-34s current=%-9s v95=%-9s\n' "$base" "$(wc -c < "/tmp/current-main-full/$base")" "$(wc -c < "$f")"
            fi
          done
      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-v95-full-main-diff
          path: |
            /tmp/nova-v95/
            /tmp/current-main-full/
            /tmp/nova-diff/
          retention-days: 1
