name: Apply Roommaid Close Read Performance V3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.apply_roommaid_close_read_perf_v3_20260908'

permissions:
  contents: write

concurrency:
  group: nova-apps-script-production
  cancel-in-progress: false

env:
  APPS_SCRIPT_DEPLOYMENT_ID: AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact roommaid close read performance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bridge = Path('RoommaidReportingDbFirstBridge.js')
          text = bridge.read_text(encoding='utf-8')
          marker = 'ROOMMAID_CLOSE_TODAY_DIRECT_SHEET_V3'
          if marker not in text:
              anchor = "function readRoommaidCloseHistoryBundleDbFirst_(token, businessDate, site) {\n  const db = novaDbFirstRpc_(token, 'nova_roommaid_close_history_v1', {\n"
              replacement = "function readRoommaidCloseHistoryBundleDbFirst_(token, businessDate, site) {\n  const dateText = normalizeBusinessDate_(businessDate);\n  const todayText = Utilities.formatDate(new Date(), Session.getScriptTimeZone() || 'Asia/Seoul', 'yyyy-MM-dd');\n  if (dateText === todayText) { // ROOMMAID_CLOSE_TODAY_DIRECT_SHEET_V3\n    const fast = readRoommaidCloseHistoryBundleFast_(dateText, site);\n    return Object.assign({}, fast, {\n      dbFirst: false,\n      nativeComplete: false,\n      readPath: 'SHEET_TODAY_DIRECT'\n    });\n  }\n\n  const db = novaDbFirstRpc_(token, 'nova_roommaid_close_history_v1', {\n"
              if anchor not in text:
                  raise SystemExit('Bridge insertion anchor not found')
              text = text.replace(anchor, replacement, 1)
              text = text.replace("p_business_date: normalizeBusinessDate_(businessDate),", "p_business_date: dateText,", 1)
              bridge.write_text(text, encoding='utf-8')

          helper = Path('RoommaidCloseReadPerformance.js')
          helper.write_text("""/** ROOMMAID_CLOSE_READ_PERFORMANCE_V3\n * Read-only performance helpers for the roommaid close journal.\n * Business logic remains in 19_RoommaidCloseJournal.js.\n */\nfunction readRoomMasterIndexForCloseCached_(site) { // ROOMMAID_CLOSE_MASTER_CACHE_V1\n  const siteText = String(site || '').trim();\n  const configVersion = getSyncVersion_(['CONFIG'], '', '');\n  const cacheKey = buildDeltaCacheKey_('ROOMMAID_CLOSE_MASTER_V1', [\n    NOVA_ROOMMAID_CLOSE.SCHEMA_VERSION, siteText, configVersion\n  ]);\n  const cached = getCachedJson_(cacheKey);\n  if (cached && cached.byRoomNo && cached.maintenanceTypes && cached.buildings) return cached;\n  const master = readRoomMasterIndexForClose_(siteText);\n  putCachedJson_(cacheKey, master, 300);\n  return master;\n}\n""", encoding='utf-8')

          journal = Path('19_RoommaidCloseJournal.js')
          text = journal.read_text(encoding='utf-8')
          original = text
          text = text.replace('ROOMMAID_CLOSE_READ_ACCEL_V2', 'ROOMMAID_CLOSE_READ_ACCEL_V3')
          text = text.replace("buildDeltaCacheKey_('ROOMMAID_CLOSE_READ_V2'", "buildDeltaCacheKey_('ROOMMAID_CLOSE_READ_V3'", 1)
          text = text.replace("readRoomMasterIndexForClose_(site);", "readRoomMasterIndexForCloseCached_(site);")
          old_cache = "putCachedJson_(cacheKey, result, Math.min(30, Number(NOVA.SNAPSHOT_CACHE_SECONDS || 45)));"
          if old_cache not in text:
              raise SystemExit('Result cache anchor not found')
          text = text.replace(old_cache, "putCachedJson_(cacheKey, result, 120); // ROOMMAID_CLOSE_RESULT_CACHE_120S_V1", 1)
          old_lookup = "historyLookup: 'DATE_TEXTFINDER'"
          if old_lookup not in text:
              raise SystemExit('historyLookup anchor not found')
          text = text.replace(old_lookup, "historyLookup: String(historyBundle.readPath || (historyBundle.dbFirst ? 'DB_NATIVE' : 'DATE_TEXTFINDER'))", 1)
          if text == original:
              raise SystemExit('Journal patch made no changes')
          if 'readRoomMasterIndexForCloseCached_(site);' not in text:
              raise SystemExit('Master cache call not installed')
          journal.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact markers and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ROOMMAID_CLOSE_TODAY_DIRECT_SHEET_V3' RoommaidReportingDbFirstBridge.js
          grep -q 'ROOMMAID_CLOSE_READ_ACCEL_V3' 19_RoommaidCloseJournal.js
          grep -q 'ROOMMAID_CLOSE_RESULT_CACHE_120S_V1' 19_RoommaidCloseJournal.js
          grep -q 'readRoomMasterIndexForCloseCached_' 19_RoommaidCloseJournal.js
          grep -q 'ROOMMAID_CLOSE_MASTER_CACHE_V1' RoommaidCloseReadPerformance.js
          node --check RoommaidReportingDbFirstBridge.js
          node --check RoommaidCloseReadPerformance.js
          node --check 19_RoommaidCloseJournal.js

      - name: Show minimal diff
        run: git diff -- RoommaidReportingDbFirstBridge.js RoommaidCloseReadPerformance.js 19_RoommaidCloseJournal.js

      - name: Persist performance patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RoommaidReportingDbFirstBridge.js RoommaidCloseReadPerformance.js 19_RoommaidCloseJournal.js
          git commit -m 'Optimize roommaid close journal read path v3'
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure Apps Script authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${CLASPRC_JSON:-}" ]; then
            printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          elif [ -n "${CLASPRC_JSON_B64:-}" ]; then
            printf '%s' "$CLASPRC_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"
          else
            echo '::error::Apps Script OAuth secret missing.'
            exit 3
          fi
          chmod 600 "$HOME/.clasprc.json"
          clasp show-authorized-user --json

      - name: Deploy existing NOVA web app
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "Roommaid close read performance v3 ${GITHUB_SHA::12}"

      - name: Summary
        run: echo 'Roommaid close read performance V3 source and existing production deployment updated.'
