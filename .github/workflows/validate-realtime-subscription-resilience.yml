name: Validate Realtime Subscription Resilience

on:
  push:
    branches: [fix/realtime-subscription-resilience-20260829]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_realtime_client.py
          python3 -m py_compile scripts/patch_realtime_subscription_resilience.py
          python3 -m py_compile scripts/patch_qm_mobile_browse.py
          python3 -m py_compile scripts/patch_qm_mobile_browse_v2.py
          python3 -m py_compile scripts/patch_qm_immediate_checklist.py
          python3 -m py_compile scripts/patch_qm_roommaid_name_display.py
          python3 -m py_compile scripts/patch_qm_notification_bell.py
          python3 -m py_compile scripts/patch_roommaid_notification_bell.py
          python3 -m py_compile scripts/patch_realtime_assignment_batch_merge.py
          python3 -m py_compile scripts/validate_nova_release.py

      - name: Apply production patch chain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py

      - name: Run release regression gate
        run: python3 scripts/validate_nova_release.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check RealtimeDailySync.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for source, target in [('Client.html','/tmp/Client.js'),('HousemanUiPerformancePatch.html','/tmp/Notification.js')]:
              text=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',text,flags=re.S|re.I)
              if not scripts: raise SystemExit(f'No script block in {source}')
              Path(target).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/Client.js
          node --check /tmp/Notification.js

      - name: Validate subscription source semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'REALTIME_SUBSCRIPTION_RESILIENCE_V1' Client.html
          grep -q 'await novaRealtime_.supabase.realtime.setAuth(auth.token)' Client.html
          grep -q 'await novaRealtime_.supabase.realtime.setAuth(next.token)' Client.html
          grep -q "\['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'\]" Client.html
          grep -q 'novaRealtime_.channels.delete(site)' Client.html
          grep -q 'novaRealtimeEnsureSubscriptions_().catch(retryError' Client.html

      - name: Validate patch idempotence
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum Client.html HousemanUiPerformancePatch.html RealtimeDailySync.js | sha256sum | awk '{print $1}')"
          python3 scripts/patch_realtime_client.py
          python3 scripts/patch_realtime_subscription_resilience.py
          python3 scripts/patch_qm_mobile_browse.py
          python3 scripts/patch_qm_mobile_browse_v2.py
          python3 scripts/patch_qm_immediate_checklist.py
          python3 scripts/patch_qm_roommaid_name_display.py
          python3 scripts/patch_qm_notification_bell.py
          python3 scripts/patch_roommaid_notification_bell.py
          python3 scripts/patch_realtime_assignment_batch_merge.py
          after="$(sha256sum Client.html HousemanUiPerformancePatch.html RealtimeDailySync.js | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: Validate generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(Client\.html|HousemanUiPerformancePatch\.html|RealtimeDailySync\.js)$' || true)"
          test -z "$unexpected"
