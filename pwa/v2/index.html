<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NOVA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://evoetxfjmkkjptucwxsv.supabase.co/storage/v1/object/public/nova-pwa-v2/icon-192.png">
  <title>NOVA</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827}
    #novaFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #pushGate{position:fixed;z-index:50;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:none;max-width:min(360px,calc(100vw - 24px));padding:10px 10px 10px 12px;border:1px solid #d1d5db;border-radius:14px;background:rgba(255,255,255,.98);box-shadow:0 10px 28px rgba(0,0,0,.18);font:600 12px/1.35 system-ui,-apple-system,sans-serif;color:#111827}
    #pushGate.show{display:flex;align-items:center;gap:8px}
    #pushGateText{min-width:0;flex:1}
    #pushGateButton{border:0;border-radius:10px;background:#111827;color:#fff;padding:9px 11px;font-weight:800;white-space:nowrap}
    #pushGateClose{border:0;background:transparent;color:#6b7280;width:28px;height:28px;border-radius:8px;font-size:16px;line-height:1;cursor:pointer}
    #pushGateClose:hover{background:#f3f4f6;color:#111827}
  </style>
</head>
<body>
  <iframe id="novaFrame" title="NOVA" allow="autoplay"></iframe>
  <div id="pushGate" aria-live="polite">
    <span id="pushGateText">NOVA 앱 알림을 켜면 앱을 닫아도 알림을 받을 수 있습니다.</span>
    <button id="pushGateButton" type="button">알림 켜기</button>
    <button id="pushGateClose" type="button" aria-label="알림 안내 닫기">×</button>
  </div>
<script>
(()=>{'use strict';
const FRAME=document.getElementById('novaFrame'),GATE=document.getElementById('pushGate'),BTN=document.getElementById('pushGateButton'),CLOSE=document.getElementById('pushGateClose'),TEXT=document.getElementById('pushGateText');
const VAPID='BKjiczDO9sG0qlh0rJDduCzQqT9tURU69oKN7mKmlyU4mnjx05x1FkUy-4Kaeqy40DReDmnQ1DR2s0ELu-SAgYM',VAPID_VERSION='20260908-v3',VAPID_VERSION_KEY='novaPushVapidVersion'; // NOVA_PUSH_VAPID_RECOVERY_V3
const PUB='sb_publishable_yKpHBqwrzlNdpIYzgmUMXg_5wApTA7L';
const APPS='https://script.google.com/macros/s/AKfycbyhUrA919fns7Sshld421vtvEeOYEWSfO-QzkTGAu4NkJOv7NJaMu827BpuQwOM1_yf/exec',SUPABASE='https://evoetxfjmkkjptucwxsv.supabase.co';
const PROMPT_KEY='novaPushPromptDismissedAtV3',PROMPT_SNOOZE_MS=24*60*60*1000;
let bridge=null,registration=null,syncBusy=false,gateTimer=null,gateClosedSession=false; // NOVA_PUSH_PERMISSION_SETTINGS_V1

function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function standalone(){return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true}
function b64uToBytes(v){const p='='.repeat((4-v.length%4)%4),b=atob((v+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
function subscriptionJSON(s){const j=s.toJSON();return {endpoint:j.endpoint,keys:{p256dh:j.keys?.p256dh||'',auth:j.keys?.auth||''}}}
async function badge(n){try{if('setAppBadge' in navigator){if(Number(n)>0)await navigator.setAppBadge(Number(n));else await navigator.clearAppBadge()}}catch(_){}}
function claims(jwt){try{const p=String(jwt||'').split('.')[1]||'',b=p.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(p.length/4)*4,'='),raw=atob(b);return JSON.parse(new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0))))}catch(_){return{}}}
function iframeUrl(){const src=new URL(APPS),q=new URLSearchParams(location.search);['route','site','roomNo','notificationId'].forEach(k=>{const v=q.get(k);if(v)src.searchParams.set(k,v)});return src.toString()}
async function registerSW(){if(!('serviceWorker' in navigator))return null;registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});await navigator.serviceWorker.ready;return registration}
function promptSnoozed(){const at=Number(localStorage.getItem(PROMPT_KEY)||0);return at>0&&Date.now()-at<PROMPT_SNOOZE_MS}
function showGate(message='',options={}){
  const force=Boolean(options.force),sticky=Boolean(options.sticky);
  if(!bridge&&!force)return;
  if(!force&&gateClosedSession)return;
  if(!force&&promptSnoozed()&&Notification.permission!=='default')return;
  clearTimeout(gateTimer);
  TEXT.textContent=message||'NOVA 앱 알림을 켜면 앱을 닫아도 알림을 받을 수 있습니다.';
  GATE.classList.add('show');
  if(!sticky)gateTimer=setTimeout(()=>hideGate(true),8000);
}
function hideGate(snooze=false){clearTimeout(gateTimer);GATE.classList.remove('show');if(snooze){gateClosedSession=true;localStorage.setItem(PROMPT_KEY,String(Date.now()))}}
async function reportPushPermissionState(){
  let permission='unsupported',subscribed=false;
  try{
    if('Notification' in window)permission=String(Notification.permission||'default');
    const reg=registration||(('serviceWorker' in navigator)?await registerSW():null);
    if(reg?.pushManager)subscribed=Boolean(await reg.pushManager.getSubscription());
    if(isiOS()&&!standalone()&&permission!=='granted')permission='standalone-required';
  }catch(e){console.warn('[NOVA PWA] permission state',e)}
  try{FRAME.contentWindow?.postMessage({type:'NOVA_PUSH_PERMISSION_STATE_V1',permission,subscribed,standalone:standalone()},'*')}catch(_){ }
}
async function upsertSubscription(sub){
  if(!bridge)throw new Error('NOVA 로그인 인증을 확인하고 있습니다. 잠시 후 다시 시도하세요.');
  const j=subscriptionJSON(sub);
  const body={employee_no:bridge.employeeNo,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth_secret:j.keys.auth,user_agent:navigator.userAgent,platform:isiOS()?'iOS':(/android/i.test(navigator.userAgent)?'Android':'Web'),enabled:true,updated_at:new Date().toISOString(),last_seen_at:new Date().toISOString()};
  const url=`${bridge.supabaseUrl}/rest/v1/nova_push_subscriptions?on_conflict=endpoint`;
  const r=await fetch(url,{method:'POST',headers:{apikey:bridge.publishableKey||PUB,Authorization:`Bearer ${bridge.token}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(`Push 구독 저장 실패 (${r.status})`);
  localStorage.setItem(VAPID_VERSION_KEY,VAPID_VERSION);
}
async function currentPushSubscription(reg){
  let sub=await reg.pushManager.getSubscription();
  const version=String(localStorage.getItem(VAPID_VERSION_KEY)||'');
  if(sub&&version!==VAPID_VERSION){
    try{await sub.unsubscribe()}catch(e){console.warn('[NOVA PWA] old push unsubscribe',e)}
    sub=null;
  }
  if(Notification.permission==='granted'&&!sub){
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID)});
  }
  return sub;
}
async function syncExisting(){
  if(syncBusy||!bridge)return;syncBusy=true;
  try{
    const reg=registration||await registerSW();if(!reg)return;
    if(Notification.permission==='denied'){hideGate(false);await reportPushPermissionState();return}
    const sub=await currentPushSubscription(reg);
    if(sub){await upsertSubscription(sub);localStorage.removeItem(PROMPT_KEY);hideGate(false);await reportPushPermissionState();return}
    if(Notification.permission==='default')showGate('NOVA 앱 알림을 켜면 앱을 닫아도 업무 알림을 받을 수 있습니다.',{sticky:true});
    await reportPushPermissionState();
  }catch(e){console.warn('[NOVA PWA] push sync',e);hideGate(false);await reportPushPermissionState()}finally{syncBusy=false}
}
async function enablePush(){
  try{
    clearTimeout(gateTimer);
    if(isiOS()&&!standalone()){showGate('iPhone은 먼저 공유 버튼 → 홈 화면에 추가 후 NOVA 앱에서 알림을 켜세요.',{force:true,sticky:true});return}
    if(!bridge){showGate('NOVA 로그인 인증을 확인하고 있습니다. 잠시 후 다시 눌러주세요.',{force:true});return}
    const reg=registration||await registerSW();
    const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
    if(permission!=='granted'){hideGate(true);await reportPushPermissionState();return}
    const sub=await currentPushSubscription(reg);
    if(!sub)throw new Error('Push 구독을 생성하지 못했습니다.');
    await upsertSubscription(sub);localStorage.removeItem(PROMPT_KEY);gateClosedSession=false;hideGate(false);await reportPushPermissionState();
  }catch(e){console.error('[NOVA PWA] enable push',e);showGate(e.message||'알림 설정을 확인하세요.',{force:true});await reportPushPermissionState()}
}
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(e.source===FRAME.contentWindow&&d.type==='NOVA_PUSH_PERMISSION_UI_V1'){
    const action=String(d.action||'STATUS').toUpperCase();
    if(action==='SHOW'){
      gateClosedSession=false;localStorage.removeItem(PROMPT_KEY);
      if(!('Notification' in window))void reportPushPermissionState();
      else if(Notification.permission==='granted')void syncExisting().finally(reportPushPermissionState);
      else showGate(Notification.permission==='denied'?'브라우저에서 NOVA 알림이 차단되어 있습니다. 사이트 알림 권한을 허용해 주세요.':'아래 버튼을 눌러 NOVA Push 알림 권한을 허용해 주세요.',{force:true,sticky:true});
    }
    void reportPushPermissionState();return;
  }
  if(d.type!=='NOVA_PUSH_BRIDGE_V2'||!d.token||!d.employeeNo)return;
  const supabaseUrl=String(d.supabaseUrl||'').replace(/\/+$/,'');
  const employeeNo=String(d.employeeNo||'').trim(),c=claims(d.token);
  if(supabaseUrl!==SUPABASE||String(c?.employee_no||'').trim()!==employeeNo)return;
  bridge={supabaseUrl:SUPABASE,publishableKey:String(d.publishableKey||PUB),token:String(d.token),employeeNo};
  badge(Number(d.unread||0));void syncExisting();void reportPushPermissionState();
});
navigator.serviceWorker?.addEventListener('message',e=>{const d=e.data||{};if(d.type==='NOVA_PUSH_FOREGROUND'&&d.badgeCount!=null)badge(d.badgeCount)});
BTN.addEventListener('click',enablePush);
CLOSE.addEventListener('click',()=>hideGate(true));
FRAME.src=iframeUrl();
registerSW().then(()=>{if(Notification.permission==='granted'&&bridge)void syncExisting();else void reportPushPermissionState()}).catch(e=>console.warn('[NOVA PWA] sw',e));
})();
</script>
</body>
</html>
