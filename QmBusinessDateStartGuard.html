<script>
(() => {
  'use strict';

  // QM_BUSINESS_DATE_START_GUARD_V2
  // Client.html 내부 callServer/startQmInspection은 IIFE lexical scope이므로
  // window.callServer 래핑만으로는 실제 QM 시작 호출을 보정할 수 없습니다.
  // 기존 mobileDate change handler를 그대로 이용해 점검시작 클릭 직전에
  // 화면에 이미 표시된 업무일자를 state.mobile.businessDate/sessionStorage로
  // 동기화합니다. 기존 업무일자 선택/DB-first/상태변경 로직은 변경하지 않습니다.

  function currentBusinessDate_() {
    try {
      const input = document.getElementById('mobileDate');
      const value = String(input && input.value || '').trim();
      if (value) return value;
    } catch (ignore) {}
    try {
      return String(sessionStorage.getItem('novaMobileBusinessDate') || '').trim();
    } catch (ignore) {}
    return '';
  }

  function syncBusinessDateIntoClientState_() {
    const input = document.getElementById('mobileDate');
    const businessDate = currentBusinessDate_();
    if (!input || !businessDate) return;

    // Client.html의 기존 change listener가 lexical state.mobile.businessDate를
    // 동기적으로 갱신합니다. 값/업무규칙 자체는 바꾸지 않습니다.
    if (String(input.value || '').trim() !== businessDate) input.value = businessDate;
    input.dispatchEvent(new Event('change', { bubbles: false }));
  }

  document.addEventListener('click', event => {
    const button = event.target && event.target.closest
      ? event.target.closest('[data-room-action]')
      : null;
    if (!button) return;

    const action = String(button.dataset.roomAction || '').trim().toUpperCase();
    if (!['START', 'CONTINUE', 'COMPLETE'].includes(action)) return;

    syncBusinessDateIntoClientState_();
  }, true);
})();
</script>
