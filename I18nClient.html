      '업무를 불러오고 있습니다.': 'Ажлыг ачаалж байна.', '시스템을 준비하고 байна.': 'Системийг бэлтгэж байна.'
    }
  };

  function normalizeLanguage(value) {
    const lang = String(value || 'ko').trim().toLowerCase();
    return SUPPORTED.has(lang) ? lang : 'ko';
  }

  function getLanguage() {
    try { return normalizeLanguage(localStorage.getItem(STORAGE_KEY) || 'ko'); }
    catch (ignore) { return 'ko'; }
  }

  function readAutoCache(lang) {
    if (autoCache.has(lang)) return autoCache.get(lang);
    let value = {};
    try {
      const parsed = JSON.parse(localStorage.getItem(`${AUTO_CACHE_PREFIX}${lang}`) || '{}');
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) value = parsed;
    } catch (ignore) {}
    autoCache.set(lang, value);
    return value;
  }

  function writeAutoCache(lang) {
    const value = readAutoCache(lang);
    try {
      const keys = Object.keys(value);
      if (keys.length > 500) {
        keys.slice(0, keys.length - 500).forEach(key => delete value[key]);
      }
      localStorage.setItem(`${AUTO_CACHE_PREFIX}${lang}`, JSON.stringify(value));
    } catch (ignore) {}
  }

  function patternTranslate(source, lang) {
    if (lang === 'ko') return source;
    let match = source.match(/^(\d+)층$/);
    if (match) return lang === 'en' ? `Floor ${match[1]}` : lang === 'th' ? `ชั้น ${match[1]}` : `${match[1]}-р давхар`;
    match = source.match(/^(\d+)실$/);
    if (match) return lang === 'en' ? `${match[1]} rooms` : lang === 'th' ? `${match[1]} ห้อง` : `${match[1]} өрөө`;
    match = source.match(/^(\d+)건$/);
    if (match) return lang === 'en' ? `${match[1]} items` : lang === 'th' ? `${match[1]} รายการ` : `${match[1]} зүйл`;
    match = source.match(/^(.+?) 하우스맨 요청$/);
    if (match) return lang === 'en' ? `${match[1]} Houseman Request` : lang === 'th' ? `${match[1]} เรียก Houseman` : `${match[1]} Houseman хүсэлт`;
    match = source.match(/^(.+?) 재정비 요청$/);
    if (match) return lang === 'en' ? `${match[1]} Rework Request` : lang === 'th' ? `${match[1]} ขอทำใหม่` : `${match[1]} Дахин цэвэрлэх хүсэлт`;
    match = source.match(/^(\d+)호 객실 작업$/);
    if (match) return lang === 'en' ? `Room ${match[1]} Work` : lang === 'th' ? `งานห้อง ${match[1]}` : `${match[1]} өрөөний ажил`;
    match = source.match(/^공동접수\s+(\d+)명$/);
    if (match) return lang === 'en' ? `Shared ${match[1]}` : lang === 'th' ? `รับร่วม ${match[1]} คน` : `Хамтран ${match[1]} хүн`;
    return source;
  }

  function likelyPersonalOrIdentifierText(core, element) {
    if (!core) return true;
    if (['쏘라노', '별관', 'NOVA'].includes(core)) return true;
    if (/^[가-힣]{2,4}$/.test(core)) {
      const tag = element && element.tagName;
      if (!['BUTTON', 'OPTION', 'LABEL', 'TH'].includes(tag)) return true;
    }
    if (/^[가-힣]{2,4}\s*\(\d{4,8}\)$/.test(core)) return true;
    if (element && element.closest('#userText, .mobile-assigned-names, [data-i18n-skip], [data-user-name], [data-employee-no]')) return true;
    return false;
  }

  function shouldAutoTranslate(core, element) {
    if (!core || core.length > 180 || !/[가-힣]/.test(core)) return false;
    const forceContent = Boolean(element && element.closest('.mobile-task-title, .mobile-task-card > p, .mobile-unable-reason span'));
    if (!forceContent && likelyPersonalOrIdentifierText(core, element)) return false;
    return true;
  }

  function queueAutoTranslation(core, lang, element) {
    if (lang === 'ko' || !shouldAutoTranslate(core, element)) return;
    const cache = readAutoCache(lang);
    if (cache[core]) return;
    const failedAt = Number(failedRecently.get(`${lang}|${core}`) || 0);
    if (failedAt && Date.now() - failedAt < 60000) return;
    if (!pending.has(lang)) pending.set(lang, new Set());
    pending.get(lang).add(core);
    if (!flushTimer) flushTimer = window.setTimeout(flushAutoTranslations, 80);
  }

  function callUiTranslationBatch_(lang, texts) {
    return new Promise((resolve, reject) => {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('Apps Script bridge unavailable'));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .translateNovaUiTextBatch({ targetLanguage: lang, texts });
    });
  }

  async function flushAutoTranslations() {
    flushTimer = null;
    if (flushInFlight) {
      flushTimer = window.setTimeout(flushAutoTranslations, 120);
      return;
    }
    const entry = [...pending.entries()].find(([, set]) => set && set.size);
    if (!entry) return;
    const [lang, set] = entry;
    const texts = [...set].slice(0, 40);
    texts.forEach(text => set.delete(text));
    flushInFlight = true;
    try {
      const result = await callUiTranslationBatch_(lang, texts);
      const translations = result && result.translations && typeof result.translations === 'object'
        ? result.translations
        : {};
      const cache = readAutoCache(lang);
      texts.forEach(text => {
        const translated = String(translations[text] || '').trim();
        if (translated && translated !== text) cache[text] = translated;
        else failedRecently.set(`${lang}|${text}`, Date.now());
      });
      writeAutoCache(lang);
      applyLanguage(getLanguage());
    } catch (error) {
      texts.forEach(text => failedRecently.set(`${lang}|${text}`, Date.now()));
      console.warn('[NOVA I18N] UI 자동번역 지연:', error);
    } finally {
      flushInFlight = false;
      if ([...pending.values()].some(set => set && set.size)) flushTimer = window.setTimeout(flushAutoTranslations, 120);
    }
  }

  function translate(source, lang = getLanguage(), element = null) {
    const original = String(source == null ? '' : source);
    if (lang === 'ko' || !original.trim()) return original;
    const leading = original.match(/^\s*/)?.[0] || '';
    const trailing = original.match(/\s*$/)?.[0] || '';
    const core = original.trim();
    const direct = (DICT[lang] && DICT[lang][core]) || patternTranslate(core, lang);
    if (direct !== core) return `${leading}${direct}${trailing}`;
    const cached = String(readAutoCache(lang)[core] || '').trim();
    if (cached) return `${leading}${cached}${trailing}`;
    queueAutoTranslation(core, lang, element);
    return original;
  }

  function shouldSkipTextNode(node) {
    const parent = node && node.parentElement;
    if (!parent) return true;
    if (parent.closest('[data-i18n-skip]')) return true;
    return ['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'NOSCRIPT'].includes(parent.tagName);
  }

  function translateTextNode(node, lang) {
    if (!node || shouldSkipTextNode(node)) return;
    if (!textOriginal.has(node)) textOriginal.set(node, node.nodeValue || '');
    const original = textOriginal.get(node) || '';
    const next = translate(original, lang, node.parentElement);
    if (node.nodeValue !== next) node.nodeValue = next;
  }

  function translateAttributes(element, lang) {
    if (!(element instanceof Element) || element.closest('[data-i18n-skip]')) return;
    let originals = attrOriginal.get(element);
    if (!originals) {
      originals = {};
      attrOriginal.set(element, originals);
    }
    ['placeholder', 'title', 'aria-label'].forEach(attr => {
      if (!element.hasAttribute(attr)) return;
      if (!Object.prototype.hasOwnProperty.call(originals, attr)) originals[attr] = element.getAttribute(attr) || '';
      const next = translate(originals[attr], lang, element);
      if (element.getAttribute(attr) !== next) element.setAttribute(attr, next);
    });
    if (element.tagName === 'INPUT' && ['button', 'submit', 'reset'].includes(String(element.type || '').toLowerCase())) {
      if (!Object.prototype.hasOwnProperty.call(originals, 'value')) originals.value = element.value || '';
      const nextValue = translate(originals.value, lang, element);
      if (element.value !== nextValue) element.value = nextValue;
    }
  }

  function applySubtree(root, lang = getLanguage()) {
    if (!root || applying) return;
    applying = true;
    try {
      if (root.nodeType === Node.TEXT_NODE) {
        translateTextNode(root, lang);
        return;
      }
      if (!(root instanceof Element) && root !== document) return;
      if (root instanceof Element) translateAttributes(root, lang);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      while (node) {
        if (node.nodeType === Node.TEXT_NODE) translateTextNode(node, lang);
        else translateAttributes(node, lang);
        node = walker.nextNode();
      }
    } finally {
      applying = false;
    }
  }

  function applyLanguage(lang) {
    const normalized = normalizeLanguage(lang);
    document.documentElement.lang = normalized;
    const select = document.getElementById('loginLanguage');
    if (select && select.value !== normalized) select.value = normalized;
    applySubtree(document, normalized);
    if (originalTitle) document.title = translate(originalTitle, normalized, document.documentElement);
  }

  function setLanguage(value) {
    const lang = normalizeLanguage(value);
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (ignore) {}
    applyLanguage(lang);
    return lang;
  }

  function wrapNativeDialogs_() {
    if (window.__novaI18nDialogsWrapped) return;
    window.__novaI18nDialogsWrapped = true;
    const nativeAlert = window.alert ? window.alert.bind(window) : null;
    const nativeConfirm = window.confirm ? window.confirm.bind(window) : null;
    const nativePrompt = window.prompt ? window.prompt.bind(window) : null;
    if (nativeAlert) window.alert = message => nativeAlert(translate(message, getLanguage()));
    if (nativeConfirm) window.confirm = message => nativeConfirm(translate(message, getLanguage()));
    if (nativePrompt) window.prompt = (message, defaultValue) => nativePrompt(translate(message, getLanguage()), defaultValue);
  }

  function init() {
    const select = document.getElementById('loginLanguage');
    const language = getLanguage();
    if (select) {
      select.value = language;
      select.addEventListener('change', event => setLanguage(event.currentTarget.value));
    }
    wrapNativeDialogs_();
    applyLanguage(language);
    const observer = new MutationObserver(mutations => {
      if (applying) return;
      const lang = getLanguage();
      mutations.forEach(mutation => {
        if (mutation.type === 'characterData') applySubtree(mutation.target, lang);
        else mutation.addedNodes.forEach(node => applySubtree(node, lang));
      });
    });
    observer.observe(document.body, { subtree: true, childList: true, characterData: true });
  }

  window.NOVA_I18N = Object.freeze({
    getLanguage,
    setLanguage,
    translate,
    apply: () => applyLanguage(getLanguage()),
    flush: () => flushAutoTranslations()
  });

  window.setTimeout(init, 0);
})();
</script>
