  function normalizeLanguage(value) {
    const lang = String(value || 'ko').trim().toLowerCase();
    return SUPPORTED.has(lang) ? lang : 'ko';
  }

  function getLanguage() {
    try { return normalizeLanguage(localStorage.getItem(STORAGE_KEY) || 'ko'); }
    catch (ignore) { return 'ko'; }
  }

  function patternTranslate(source, lang) {
    if (lang === 'ko') return source;
    let match = source.match(/^(\d+)층$/);
    if (match) return lang === 'en' ? `Floor ${match[1]}` : lang === 'th' ? `ชั้น ${match[1]}` : `${match[1]}-р давхар`;
    match = source.match(/^(\d+)실$/);
    if (match) return lang === 'en' ? `${match[1]} rooms` : lang === 'th' ? `${match[1]} ห้อง` : `${match[1]} өрөө`;
    match = source.match(/^(\d+)건$/);
    if (match) return lang === 'en' ? `${match[1]} items` : lang === 'th' ? `${match[1]} รายการ` : `${match[1]} зүйл`;
    match = source.match(/^(.+?) 하우스맨 요청$/);
    if (match) return lang === 'en' ? `${match[1]} Houseman Request` : lang === 'th' ? `${match[1]} เรียก Houseman` : `${match[1]} Houseman хүсэлт`;
    match = source.match(/^(.+?) 재정비 요청$/);
    if (match) return lang === 'en' ? `${match[1]} Rework Request` : lang === 'th' ? `${match[1]} ขอทำใหม่` : `${match[1]} Дахин цэвэрлэх хүсэлт`;
    return source;
  }

  function translate(source, lang = getLanguage()) {
    const original = String(source == null ? '' : source);
    if (lang === 'ko' || !original.trim()) return original;
    const leading = original.match(/^\s*/)?.[0] || '';
    const trailing = original.match(/\s*$/)?.[0] || '';
    const core = original.trim();
    const translated = (DICT[lang] && DICT[lang][core]) || patternTranslate(core, lang);
    return `${leading}${translated}${trailing}`;
  }

  function shouldSkipTextNode(node) {
    const parent = node && node.parentElement;
    if (!parent) return true;
    if (parent.closest('[data-i18n-skip]')) return true;
    return ['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'NOSCRIPT'].includes(parent.tagName);
  }

  function translateTextNode(node, lang) {
    if (!node || shouldSkipTextNode(node)) return;
    if (!textOriginal.has(node)) textOriginal.set(node, node.nodeValue || '');
    const original = textOriginal.get(node) || '';
    const next = translate(original, lang);
    if (node.nodeValue !== next) node.nodeValue = next;
  }

  function translateAttributes(element, lang) {
    if (!(element instanceof Element) || element.closest('[data-i18n-skip]')) return;
    let originals = attrOriginal.get(element);
    if (!originals) {
      originals = {};
      attrOriginal.set(element, originals);
    }
    ['placeholder', 'title', 'aria-label'].forEach(attr => {
      if (!element.hasAttribute(attr)) return;
      if (!Object.prototype.hasOwnProperty.call(originals, attr)) originals[attr] = element.getAttribute(attr) || '';
      const next = translate(originals[attr], lang);
      if (element.getAttribute(attr) !== next) element.setAttribute(attr, next);
    });
  }

  function applySubtree(root, lang = getLanguage()) {
    if (!root || applying) return;
    applying = true;
    try {
      if (root.nodeType === Node.TEXT_NODE) {
        translateTextNode(root, lang);
        return;
      }
      if (!(root instanceof Element) && root !== document) return;
      if (root instanceof Element) translateAttributes(root, lang);
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      while (node) {
        if (node.nodeType === Node.TEXT_NODE) translateTextNode(node, lang);
        else translateAttributes(node, lang);
        node = walker.nextNode();
      }
    } finally {
      applying = false;
    }
  }

  function applyLanguage(lang) {
    const normalized = normalizeLanguage(lang);
    document.documentElement.lang = normalized;
    const select = document.getElementById('loginLanguage');
    if (select && select.value !== normalized) select.value = normalized;
    applySubtree(document, normalized);
  }

  function setLanguage(value) {
    const lang = normalizeLanguage(value);
    try { localStorage.setItem(STORAGE_KEY, lang); } catch (ignore) {}
    applyLanguage(lang);
    return lang;
  }

  function init() {
    const select = document.getElementById('loginLanguage');
    const language = getLanguage();
    if (select) {
      select.value = language;
      select.addEventListener('change', event => setLanguage(event.currentTarget.value));
    }
    applyLanguage(language);
    const observer = new MutationObserver(mutations => {
      if (applying) return;
      const lang = getLanguage();
      mutations.forEach(mutation => {
        if (mutation.type === 'characterData') applySubtree(mutation.target, lang);
        else mutation.addedNodes.forEach(node => applySubtree(node, lang));
      });
    });
    observer.observe(document.body, { subtree: true, childList: true, characterData: true });
  }

  window.NOVA_I18N = Object.freeze({
    getLanguage,
    setLanguage,
    translate,
    apply: () => applyLanguage(getLanguage())
  });

  window.setTimeout(init, 0);
})();
</script>
