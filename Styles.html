  .login-card { width: min(380px, calc(100vw - 32px)); padding: 28px; background: #fff; border: 1px solid var(--border); border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.07); text-align: left; }
  .login-card h1, .login-card p { text-align: center; }
  label { display: grid; gap: 7px; margin-top: 15px; font-weight: 650; }
  input, select, textarea { width: 100%; border: 1px solid #d7d7d7; border-radius: 9px; outline: none; background: #fff; color: #171717; }
  input, select { height: 34px; padding: 0 9px; }
  textarea { min-height: 86px; padding: 9px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: #171717; box-shadow: 0 0 0 3px rgba(0,0,0,.07); }
  .login-card input { height: 44px; padding: 0 13px; border-radius: 12px; }
  .login-card button { width: 100%; margin-top: 20px; padding: 13px 16px; border-radius: 12px; background: #171717; color: #fff; font-weight: 700; }
  .muted { color: var(--muted); }
  .message { min-height: 22px; color: #b42318; }
  .main-view { min-height: 100vh; }
  .topbar { position: sticky; top: 0; z-index: 50; height: var(--topbar-h); display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); }
  .topbar-brand, .topbar-actions { display: flex; align-items: center; gap: 9px; }
  .topbar-brand #versionText { font-size: 10px; white-space: nowrap; }
  .text-button { background: transparent; padding: 7px 9px; border-radius: 8px; }
  .text-button:hover { background: #f3f4f6; }
  .workspace { display: grid; grid-template-columns: var(--sidebar-w) minmax(0,1fr); min-height: calc(100vh - var(--topbar-h)); }
  .sidebar { position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); padding: 10px; border-right: 1px solid var(--border); background: #fff; overflow: auto; }
  .menu-button { width: 100%; min-height: 38px; text-align: left; margin-bottom: 5px; padding: 0 11px; border-radius: 9px; background: transparent; }
  .menu-button:hover { background: #f3f4f6; }
  .menu-button.active { background: #171717; color: #fff; }
  .content { padding: 12px 14px 36px; min-width: 0; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 15px; padding: 18px; }
  .metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-top: 15px; }
  .metric { padding: 14px; border: 1px solid #ececec; border-radius: 12px; background: #fafafa; }
  .metric strong { display: block; margin-top: 5px; font-size: 20px; }
  .sync-status { position: fixed; right: 12px; bottom: 12px; z-index: 80; padding: 7px 10px; border-radius: 999px; background: rgba(23,23,23,.9); color: #fff; font-size: 11px; pointer-events: none; }

  /* 통합 인디케이터 */
  .indicator-page { min-width: 980px; }
  .indicator-controls { display: grid; grid-template-columns: 190px 150px minmax(190px, 1fr) auto auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .indicator-controls .control-group { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px; align-items: center; }
  .indicator-controls .control-label { font-size: 12px; font-weight: 700; color: #4b5563; white-space: nowrap; }
  .indicator-summary { display: flex; justify-content: flex-end; gap: 6px; font-size: 12px; white-space: nowrap; }
  .upload-button { height: 31px; padding: 0 11px; border-radius: 8px; background: #171717; color: #fff; font-size: 11px; font-weight: 800; white-space: nowrap; }
  .upload-button:hover { background: #000; }
  .summary-pill { padding: 6px 8px; border: 1px solid var(--border); border-radius: 999px; background: #fff; }

  .indicator-sticky { position: sticky; top: calc(var(--topbar-h) + 1px); z-index: 35; margin: 0 -2px 8px; padding: 2px 2px 8px; background: #f5f5f5; box-shadow: 0 7px 10px -10px rgba(15,23,42,.38); }
  .houseman-fixed-row { height: 132px; display: grid; grid-template-columns: minmax(610px, 1.35fr) minmax(420px, .95fr); gap: 8px; }
  .compact-panel { min-width: 0; height: 132px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .compact-titlebar { height: 29px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; border-bottom: 1px solid #eef0f2; background: #fafafa; font-size: 12px; font-weight: 800; }
  .compact-titlebar small { color: var(--muted); font-weight: 500; }
  .houseman-form { height: calc(100% - 29px); display: grid; grid-template-rows: 43px 43px; gap: 5px; padding: 6px 8px; }
  .order-form-row { min-width: 0; display: grid; gap: 5px; align-items: center; }
  .order-form-main { grid-template-columns: 74px 92px minmax(145px,1fr) 54px 108px 66px; }
  .order-form-sub { grid-template-columns: minmax(145px,1fr) 92px auto auto minmax(185px,1fr) 76px; }
  .order-routing-preview { min-width: 0; height: 31px; display: flex; align-items: center; padding: 0 9px; border-radius: 8px; background: #f3f4f6; color: #4b5563; font-size: 10px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-routing-preview.success { background: #ecfdf5; color: #047857; }
  .order-routing-preview.warning { background: #fffbeb; color: #92400e; }
  .order-routing-preview.danger { background: #fef2f2; color: #b91c1c; }
  .order-routing-preview.muted { background: #f3f4f6; color: #6b7280; }
  .compact-input, .compact-select, .compact-button { height: 31px; border-radius: 8px; font-size: 12px; }
  .compact-button { padding: 0 9px; background: #eef0f2; color: #222; font-weight: 700; white-space: nowrap; }
  .compact-button:hover { background: #e2e5e9; }
  .primary-button { background: #171717; color: #fff; }
  .primary-button:hover { background: #000; }
  .item-picker-button { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1px solid #d7d7d7; background: #fff; font-weight: 500; overflow: hidden; }
  .item-picker-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toggle-compact { height: 31px; display: inline-flex; align-items: center; align-self: center; gap: 4px; margin-top: 0; padding: 0 5px; border: 1px solid #e3e5e8; border-radius: 8px; font-size: 11px; font-weight: 700; white-space: nowrap; background: #fff; }
  .toggle-compact input { width: 14px; height: 14px; margin: 0; box-shadow: none; }

  .order-scroll { height: 102px; overflow-y: auto; scrollbar-gutter: stable; background: #fff; }
  .order-mini-row { height: 34px; display: grid; grid-template-columns: 58px minmax(100px,1fr) 64px 64px; gap: 5px; align-items: center; padding: 0 7px; border-bottom: 1px solid #f0f1f2; font-size: 11px; cursor: pointer; }
  .order-mini-row:hover { background: #f8fafc; }
  .order-mini-row:last-child { border-bottom: 0; }
  .order-room { font-size: 13px; font-weight: 850; }
  .order-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-person { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #4b5563; }
  .status-chip { justify-self: end; min-width: 52px; padding: 4px 6px; border-radius: 999px; text-align: center; font-size: 10px; font-weight: 800; background: #eef0f2; }
  .status-REGISTERED { background: #f3f4f6; }
  .status-ASSIGNED { background: #e0f2fe; }
  .status-ACCEPTED { background: #ede9fe; }

  /* 모달 */
  .modal-root { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(15,23,42,.38); backdrop-filter: blur(2px); }
  .modal-card { width: min(640px, calc(100vw - 28px)); max-height: calc(100vh - 36px); overflow: auto; border-radius: 16px; background: #fff; box-shadow: 0 24px 80px rgba(0,0,0,.22); }

  /* 객실 작업 팝업 하단 버튼 (한 행 수평 정렬·미니멀 디자인) */
  .room-work-actions {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: max-content;
    align-items: center;

    gap: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
  }
  .room-work-actions .action-button {
    height: 34px;
    min-height: 34px;
    margin: 0;
    padding: 0 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    background: #f6f7f8;
    color: #20252b;
    font-size: 12px;
    font-weight: 780;
    line-height: 1;

    background: #eef7fb;
    border-color: #d8ebf5;
    color: #075985;
  }

    color: #be123c;

    }

  .item-editor-row { display: grid; grid-template-columns: minmax(0,1fr) 72px 34px; gap: 6px; margin-bottom: 7px; }

/* NOVA v1.0 RC2: QM 체크리스트 관리·점검 팝업 */
.qm-checklist-admin-page { display: grid; gap: 14px; }
.qm-checklist-admin-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
.qm-checklist-admin-header h1 { margin: 3px 0 5px; font-size: 24px; }
.qm-checklist-admin-header p { margin: 0; color: var(--muted); font-size: 11px; }
.qm-checklist-add-card { padding: 15px; }
.qm-checklist-add-grid { display: grid; grid-template-columns: minmax(260px,1fr) 100px auto auto auto; gap: 9px; align-items: end; }
.qm-checklist-add-grid label:not(.toggle-field),
.qm-checklist-admin-main label:not(.toggle-field),
.qm-checklist-inspection-item label { display: grid; gap: 5px; color: var(--muted); font-size: 10px; font-weight: 800; }
.qm-checklist-add-grid input,
.qm-checklist-admin-main input,
.qm-checklist-inspection-item select,
.qm-checklist-inspection-item textarea,
.qm-checklist-inspection-item input { width: 100%; min-height: 38px; border: 1px solid var(--border); border-radius: 9px; background: #fff; padding: 8px 10px; color: var(--text); font: inherit; }
.qm-checklist-inspection-item textarea { min-height: 66px; resize: vertical; }
.toggle-field { min-height: 38px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--border); border-radius: 9px; background: #fff; color: var(--text); font-size: 10px; font-weight: 800; white-space: nowrap; }
.toggle-field input { width: 15px; min-height: auto; }
.qm-checklist-admin-summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px; background: #fff; font-size: 11px; }
.qm-checklist-admin-summary span { color: var(--muted); }
.qm-checklist-admin-list { display: grid; gap: 9px; }
.qm-checklist-admin-item { display: flex; align-items: end; justify-content: space-between; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 11px; background: #fff; }
.qm-checklist-admin-main { flex: 1; display: grid; grid-template-columns: minmax(260px,1fr) 95px auto auto; gap: 8px; align-items: end; }
.qm-checklist-admin-main .wide { min-width: 0; }
.qm-checklist-admin-actions { display: flex; gap: 7px; flex: 0 0 auto; }
.qm-checklist-modal { width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
.qm-checklist-modal .modal-body { overflow: auto; }
.qm-checklist-guide { margin-bottom: 10px; padding: 10px 12px; border-radius: 9px; background: #f8fafc; color: #475569; font-size: 11px; line-height: 1.5; }
.qm-checklist-inspection-list { display: grid; gap: 10px; }
.qm-checklist-inspection-item { display: grid; grid-template-columns: minmax(190px,.75fr) minmax(220px,1fr); gap: 9px 12px; padding: 12px; border: 1px solid var(--border); border-radius: 11px; background: #fff; }
.qm-checklist-inspection-heading { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.qm-checklist-inspection-heading strong { font-size: 13px; }
.qm-checklist-inspection-heading div { display: flex; flex-wrap: wrap; gap: 5px; }
.qm-checklist-inspection-heading span { padding: 3px 7px; border-radius: 999px; background: #f1f5f9; color: #475569; font-size: 9px; font-weight: 850; }
.qm-checklist-inspection-heading .required-badge { background: #fee2e2; color: #991b1b; }
.qm-checklist-inspection-heading .photo-badge { background: #ede9fe; color: #5b21b6; }
@media (max-width: 980px) {
  .qm-checklist-add-grid { grid-template-columns: 1fr 100px; }
  .qm-checklist-add-grid .toggle-field { justify-content: flex-start; }
  .qm-checklist-add-grid button { grid-column: 1 / -1; }
  .qm-checklist-admin-item { align-items: stretch; flex-direction: column; }
  .qm-checklist-admin-main { grid-template-columns: 1fr 95px; }
  .qm-checklist-admin-actions { justify-content: flex-end; }
}
@media (max-width: 760px) {
  .qm-checklist-admin-header { flex-direction: column; align-items: stretch; }
  .qm-checklist-add-grid, .qm-checklist-admin-main { grid-template-columns: 1fr; }
  .qm-checklist-admin-actions { display: grid; grid-template-columns: 1fr 1fr; }
  .qm-checklist-inspection-item { grid-template-columns: 1fr; }
  .qm-checklist-inspection-heading { align-items: flex-start; flex-direction: column; }
}
