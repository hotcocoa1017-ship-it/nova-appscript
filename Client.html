            <label class="modal-field room-assignment-type-field"><span>배정유형</span><select id="assignmentTypeSelect">${assignmentTypes.map(type => `<option value="${escapeAttr(type.code)}"${type.code === (room.assignmentType || 'SOLO') ? ' selected' : ''}>${escapeHtml(type.label)}</option>`).join('')}</select></label>
            <label class="modal-field room-qm-assignment-field"><span>QM 배정</span><select id="qmSelect"><option value="">선택</option>${qms.map(user => `<option value="${escapeAttr(user.employeeNo)}"${user.employeeNo === room.qmEmployeeNo ? ' selected' : ''}>${escapeHtml(user.name)}</option>`).join('')}</select></label>
            <label class="modal-field roommaid-assignment-picker primary-roommaid-field"><span>주담당 룸메이드</span><input id="roommaidSearchInput" class="roommaid-assignment-search" type="search" placeholder="이름·사번 검색" autocomplete="off"><select id="roommaidSelect">${roommaidAssignmentOptionsHtml_(roommaids, room.roommaidEmployeeNo)}</select></label>
            <label class="modal-field roommaid-assignment-picker secondary-roommaid-field"><span>보조 룸메이드</span><input id="secondaryRoommaidSearchInput" class="roommaid-assignment-search" type="search" placeholder="이름·사번 검색" autocomplete="off"><select id="secondaryRoommaidSelect">${roommaidAssignmentOptionsHtml_(roommaids, room.secondaryRoommaidEmployeeNo)}</select></label>
            <div class="modal-field full room-operation-flag-editor"><span>운영표시</span><div class="room-operation-flag-options"><label><input id="roomPreassignedFlag" type="checkbox"${room.preassigned ? ' checked' : ''}>선배정</label><label><input id="roomVipFlag" type="checkbox"${room.vip ? ' checked' : ''}>VIP</label><label><input id="roomImportantFlag" type="checkbox"${room.importantRoom ? ' checked' : ''}>중요객실</label></div></div>
            <div class="modal-field full room-operational-status-editor"><span>객실조치 상태</span><div class="room-operational-status-options"><button class="room-operational-status-button${operationalStatus === 'BROKEN' ? ' active' : ''}" type="button" data-room-action="UPDATE_ROOM_OPERATION_STATUS" data-room-operational-status="BROKEN">고장</button><button class="room-operational-status-button${operationalStatus === 'ROOM_CHECK' ? ' active' : ''}" type="button" data-room-action="UPDATE_ROOM_OPERATION_STATUS" data-room-operational-status="ROOM_CHECK">객실확인</button><button class="room-operational-status-button complete" type="button" data-room-action="UPDATE_ROOM_OPERATION_STATUS" data-room-operational-status=""${operationalStatus ? '' : ' disabled'}>완료</button></div></div>
          </div>
          <div class="modal-actions room-work-actions">
            <button class="action-button operational-flags" type="button" data-room-action="UPDATE_OPERATION_FLAGS">운영표시 저장</button>
            <button class="action-button status-change" type="button" data-room-action="CHANGE_ROOM_STATUS">상태변경</button>
            <button class="action-button checkout" type="button" data-room-action="CHANGE_ROOM_STATUS" data-room-status="CHECKED_OUT">퇴실</button>
            <button class="action-button" type="button" data-room-action="ASSIGN_ROOMMAID">배정</button>
            <button class="action-button" type="button" data-room-action="CLEANING_START">청소시작</button>
            <button class="action-button primary" type="button" data-room-action="CLEANING_COMPLETE"${cleaningCompletionLocked ? ' disabled title="룸메이드 청소완료가 이미 기록된 객실입니다." aria-label="완료 처리됨"' : ''}>${cleaningCompletionLocked ? '완료 처리됨' : '청소완료'}</button>
            <button class="action-button" type="button" data-room-action="QM_ASSIGN">QM배정</button>
            ${cleaningResetAvailable ? '<button class="action-button danger" type="button" data-room-action="CLEANING_RESET">청소 초기화</button>' : ''}
          </div>
        </div>
      </div>`);
    bindRoommaidAssignmentSearch_('roommaidSearchInput', 'roommaidSelect', roommaids);
    bindRoommaidAssignmentSearch_('secondaryRoommaidSearchInput', 'secondaryRoommaidSelect', roommaids);

    const syncSecondaryState = () => {
      const pair = ['PAIR', 'PAIR_TRAINING'].includes($('assignmentTypeSelect')?.value || 'SOLO');
      if ($('secondaryRoommaidSelect')) {
        $('secondaryRoommaidSelect').disabled = !pair;
        if (!pair) $('secondaryRoommaidSelect').value = '';
      }
      if ($('secondaryRoommaidSearchInput')) {
        $('secondaryRoommaidSearchInput').disabled = !pair;
        if (!pair) $('secondaryRoommaidSearchInput').value = '';
      }
    };
    $('assignmentTypeSelect')?.addEventListener('change', syncSecondaryState);
    syncSecondaryState();
    $('modalRoot').querySelectorAll('[data-room-action]').forEach(button => button.addEventListener('click', () => runRoomAction(room, button.dataset.roomAction, button.dataset.roomStatus || '', button, button.dataset.roomOperationalStatus ?? '')));
  }
  function validateRoomActionPayload_(payload) { // (즉시반영 전 필수 선택값 확인)
    const action = String(payload?.action || '').trim().toUpperCase();
    if (action === 'CHANGE_ROOM_STATUS' && !String(payload?.roomStatus || '').trim()) {
      return '변경할 객실상태를 선택하세요.';
    }
    if (action === 'ASSIGN_ROOMMAID') {
      if (!String(payload?.employeeNo || '').trim()) return '주담당 룸메이드를 선택하세요.';
      const assignmentType = String(payload?.assignmentType || 'SOLO').trim().toUpperCase();
      if (['PAIR', 'PAIR_TRAINING'].includes(assignmentType)) {
        if (!String(payload?.secondaryEmployeeNo || '').trim()) return '보조 룸메이드를 선택하세요.';
        if (String(payload.employeeNo) === String(payload.secondaryEmployeeNo)) return '2인1조는 서로 다른 룸메이드 2명을 선택해야 합니다.';
      }
    }
    if (action === 'QM_ASSIGN' && !String(payload?.employeeNo || '').trim()) {
      return '배정할 QM을 선택하세요.';
    }
    if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
      const rawOperationalStatus = String(payload?.operationalStatus || '').trim();
      if (rawOperationalStatus && !normalizeIndicatorRoomOperationalStatus_(rawOperationalStatus)) return '사용할 수 없는 객실 조치상태입니다.';
    }
    return '';
  }

  function emptyRoomAssignmentPatch_() { // (객실 배정정보 화면 초기화값)
    return {
      cleaningType: '',
      assignmentType: '',
      roommaidEmployeeNo: '',
      roommaidName: '',
      secondaryRoommaidEmployeeNo: '',
      secondaryRoommaidName: '',
      qmEmployeeNo: '',
      qmName: ''
    };
  }

  function buildOptimisticRoomPatch_(room, payload) { // (객실카드 전체 작업 즉시 화면 반영값)
    const action = String(payload?.action || '').trim().toUpperCase();
    const roomStatusCode = codeValue_(state.indicator.data?.codes?.roomStatuses, room.roomStatus || '');
    const cleaningStatusCode = codeValue_(state.indicator.data?.codes?.cleaningStatuses, room.cleaningStatus || 'WAITING');

    if (action === 'UPDATE_OPERATION_FLAGS') {
      return { preassigned: Boolean(payload.preassigned), vip: Boolean(payload.vip), importantRoom: Boolean(payload.importantRoom) };
    }

    if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
      return { operationalStatus: normalizeIndicatorRoomOperationalStatus_(payload.operationalStatus) };
    }

    if (action === 'CHANGE_ROOM_STATUS') {
      const nextRoomStatus = String(payload.roomStatus || '').trim().toUpperCase();
      const resetAssignment = emptyRoomAssignmentPatch_();
      const activeCleaningStatuses = new Set(['ASSIGNED', 'CLEANING', 'QM_WAITING', 'QM_CHECKING', 'REWORK']);
      if (nextRoomStatus === 'VACANT_CLEAN') {
        // 통합 인디게이터에서 공실을 직접 선택하면 이전 재고·퇴실 상태를 남기지 않는다.
        return Object.assign({
          roomStatus: nextRoomStatus,
          displayBaseRoomStatus: '',
          previousCycle: null,
          cleaningStatus: 'COMPLETED'
        }, resetAssignment);
      }
      if (nextRoomStatus === 'RECHECKIN') {
        return Object.assign({ roomStatus: nextRoomStatus, displayBaseRoomStatus: '', cleaningStatus: 'COMPLETED' }, resetAssignment);
      }
      if (['CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU', 'STOCK', 'STOCK_RC', 'STOCK_HU'].includes(nextRoomStatus)) {
        return { roomStatus: nextRoomStatus, displayBaseRoomStatus: nextRoomStatus, cleaningStatus: 'WAITING' };
      }
      if (['STAY', 'DUE_OUT'].includes(nextRoomStatus)) {
        return Object.assign({ roomStatus: nextRoomStatus, displayBaseRoomStatus: '', cleaningStatus: 'NOT_REQUIRED' }, resetAssignment);
      }
      if (activeCleaningStatuses.has(cleaningStatusCode)) {
        return { roomStatus: nextRoomStatus };
      }
      return Object.assign({ roomStatus: nextRoomStatus, cleaningStatus: 'WAITING' }, resetAssignment);
    }

    if (action === 'ASSIGN_ROOMMAID') {
      const staff = state.indicator.data?.staff?.roommaids || [];
      const primary = staff.find(user => user.employeeNo === payload.employeeNo);
      const secondary = staff.find(user => user.employeeNo === payload.secondaryEmployeeNo);
      return {
        cleaningType: payload.cleaningType || 'NORMAL',
        assignmentType: payload.assignmentType || 'SOLO',
        roommaidEmployeeNo: payload.employeeNo || '',
        roommaidName: primary?.name || '',
        secondaryRoommaidEmployeeNo: payload.secondaryEmployeeNo || '',
        secondaryRoommaidName: secondary?.name || '',
        cleaningStatus: 'ASSIGNED'
      };
    }

    if (action === 'CLEANING_START') {
      return { cleaningStatus: 'CLEANING' };
    }

    if (action === 'CLEANING_COMPLETE') {
      // 청소완료는 청소상태만 변경하고 재고·퇴실 계열 객실상태는 그대로 유지한다.
      return { cleaningStatus: 'COMPLETED' };
    }

    if (action === 'CLEANING_RESET') {
      // 해당 객실의 금일 완료실적 전체를 취소하므로 현재 배정도 미배정·미완료 상태로 되돌린다.
      return Object.assign({ cleaningStatus: 'WAITING' }, emptyRoomAssignmentPatch_());
    }

    if (action === 'QM_ASSIGN') {
      const staff = state.indicator.data?.staff?.qms || [];
      const qm = staff.find(user => user.employeeNo === payload.employeeNo);
      return {
        qmEmployeeNo: payload.employeeNo || '',
        qmName: qm?.name || '',
        cleaningStatus: 'QM_WAITING'
      };
    }

    if (action === 'CLEAR_ASSIGNMENT') {
      return Object.assign({ cleaningStatus: 'WAITING' }, emptyRoomAssignmentPatch_());
    }

    return null;
  }

  function renderIndicatorRoomLocal_(roomNo, site) { // (변경 객실카드 1개만 즉시 갱신)
    const grid = $('roomGrid');
    const rooms = state.indicator.data?.rooms || [];
    const room = rooms.find(item => item.roomNo === roomNo && (!site || item.site === site));
    if (!grid || !room) return;
    const existing = Array.from(grid.querySelectorAll('[data-room-no]'))
      .find(card => card.dataset.roomNo === roomNo);
    const visible = roomMatchesIndicatorFilter_(room);
    if (existing && visible) {
      existing.outerHTML = roomCardHtml_(room);
    } else if (existing && !visible) {
      existing.remove();
      if (!grid.querySelector('[data-room-no]')) {
        grid.innerHTML = '<div class="room-empty">선택한 조건에 표시할 객실이 없습니다.</div>';
      }
    } else if (!existing && visible) {
      renderRoomGrid();
    }
    renderIndicatorSummary();
  }

  function roomVisualSignature_(room) { // (서버확정 후 재렌더 필요 여부 비교)
    if (!room) return '';
    return JSON.stringify([
      room.roomStatus || '', room.displayBaseRoomStatus || '', room.cleaningStatus || '', room.cleaningType || '', room.assignmentType || '',
      room.roommaidEmployeeNo || '', room.roommaidName || '', room.secondaryRoommaidEmployeeNo || '',
      room.secondaryRoommaidName || '', room.qmEmployeeNo || '', room.qmName || '', normalizeIndicatorRoomOperationalStatus_(room.operationalStatus), Number(room.pendingOrderCount || 0)
    ]);
  }

  function clearIndicatorRoomPendingMark_(roomNo) { // (화면 재구성 없이 저장중 표시만 해제)
    const grid = $('roomGrid');
    if (!grid) return;
    const card = Array.from(grid.querySelectorAll('[data-room-no]')).find(item => item.dataset.roomNo === roomNo);
    if (!card) return;
    card.classList.remove('room-card-saving');
    card.querySelector('.room-save-pending')?.remove();
  }

  function showRoomActionToast_(message) { // (객실작업 전용 경량 안내·전체객실 재렌더 금지)
    const toast = $('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.remove('hidden');
    if (state.toastTimer) window.clearTimeout(state.toastTimer);
    state.toastTimer = window.setTimeout(() => toast.classList.add('hidden'), 1800);
  }

  function waitForUiPaint_() { // (서버 호출 전 화면 변경을 먼저 그리기)
    return new Promise(resolve => window.requestAnimationFrame(() => resolve()));
  }

  async function runRoomAction(room, action, forcedRoomStatus = '', sourceButton = null, forcedOperationalStatus = '') { // (객실 작업 즉시반영·서버확정)
    if (action === 'CLEANING_COMPLETE' && isIndicatorCleaningCompletionLocked_(room?.cleaningStatus)) {
      showRoomActionToast_(`${room.roomNo}호는 이미 청소완료 처리되었습니다.`);
      return;
    }
    if (action === 'CLEANING_RESET') {
      const confirmed = window.confirm(
        `${room.roomNo}호의 금일 청소완료 실적을 모두 초기화합니다.\n\n`
        + '일반정비와 정비유형(D/S·5S·평가원·직원숙소·딥크리닝 등)의 모든 완료이력이 취소되어 룸메이드 실적과 마감일지에서 제외됩니다.\n'
        + '현재 룸메이드·QM 배정도 취소되고 객실은 미배정·미완료 상태로 돌아갑니다.\n\n'
        + '계속하시겠습니까?'
      );
      if (!confirmed) return;
    }
    const clickedAt = performance.now();
    const payload = {
      businessDate: state.indicator.businessDate,
      site: room.site,
      roomNo: room.roomNo,
      rowNumber: Number(room.rowNumber || 0),
      action,
      employeeNo: action === 'QM_ASSIGN' ? $('qmSelect')?.value : $('roommaidSelect')?.value,
      secondaryEmployeeNo: action === 'ASSIGN_ROOMMAID' ? ($('secondaryRoommaidSelect')?.value || '') : '',
      assignmentType: action === 'ASSIGN_ROOMMAID' ? ($('assignmentTypeSelect')?.value || 'SOLO') : '',
      cleaningType: action === 'ASSIGN_ROOMMAID' ? ($('cleaningTypeSelect')?.value || 'NORMAL') : '',
      roomStatus: action === 'CHANGE_ROOM_STATUS' ? (forcedRoomStatus || $('roomStatusSelect')?.value || '') : '',
      preassigned: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomPreassignedFlag')?.checked) : Boolean(room.preassigned),
      vip: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomVipFlag')?.checked) : Boolean(room.vip),
      importantRoom: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomImportantFlag')?.checked) : Boolean(room.importantRoom),
      operationalStatus: action === 'UPDATE_ROOM_OPERATION_STATUS' ? normalizeIndicatorRoomOperationalStatus_(forcedOperationalStatus) : normalizeIndicatorRoomOperationalStatus_(room.operationalStatus),
      expectedVersion: Number(room.version || 0)
    };
    const validationError = validateRoomActionPayload_(payload);
    if (validationError) {
      showRoomActionToast_(validationError);
      return;
    }

    const actionKey = `${room.site}|${room.roomNo}`;
    if (state.indicator.roomActionInFlight[actionKey]) return;

    const rooms = state.indicator.data?.rooms || [];
    const index = rooms.findIndex(item => item.roomNo === room.roomNo && item.site === room.site);
    const beforeRoom = index >= 0 ? Object.assign({}, rooms[index]) : null;
    const optimisticPatch = buildOptimisticRoomPatch_(room, payload);
    const fastAction = Boolean(optimisticPatch);
    const originalButtonText = sourceButton?.textContent || '';
    const actionLabel = {
      CHANGE_ROOM_STATUS: payload.roomStatus === 'CHECKED_OUT' ? '퇴실 전환' : '객실상태 변경',
      ASSIGN_ROOMMAID: '룸메이드 배정',
      CLEANING_START: '청소시작',
      CLEANING_COMPLETE: '청소완료',
      CLEANING_RESET: '청소 초기화',
      QM_ASSIGN: 'QM 배정',
      CLEAR_ASSIGNMENT: '배정 초기화',
      UPDATE_OPERATION_FLAGS: '운영표시 저장',
      UPDATE_ROOM_OPERATION_STATUS: payload.operationalStatus === 'BROKEN' ? '고장 등록' : payload.operationalStatus === 'ROOM_CHECK' ? '객실확인 등록' : '객실조치 완료'
    }[action] || '객실 작업';

    state.indicator.roomActionInFlight[actionKey] = true;
    if (sourceButton) {
      sourceButton.disabled = true;
      sourceButton.textContent = '처리 중';
    }

    if (fastAction && index >= 0) {
      closeModal();
      rooms[index] = Object.assign({}, rooms[index], optimisticPatch, { __pendingAction: action });
      renderIndicatorRoomLocal_(room.roomNo, room.site);
      showRoomActionToast_(`${room.roomNo}호 ${actionLabel} 화면 반영`);
      setSyncStatus(`${room.roomNo}호 화면 반영 · 서버 저장 중`);
      await waitForUiPaint_();
    }

    try {
      const result = await saveRoomActionRealtimeOrLegacy_('updateRoomOperation', payload);
      if (!result?.ok) throw new Error(result?.message || '객실 작업을 저장하지 못했습니다.');
      const resultRoom = Object.assign({}, result.room || {});
      if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
        // 서버 저장 성공 응답에서는 요청한 조치상태를 화면 확정값으로 강제 병합한다.
        // stale delta/부분응답이 끼어도 '저장완료인데 표시 없음' 상태가 생기지 않게 한다.
        resultRoom.operationalStatus = normalizeIndicatorRoomOperationalStatus_(payload.operationalStatus);
      }
      if (action === 'CHANGE_ROOM_STATUS' && payload.roomStatus === 'CHECKED_OUT') {
        resultRoom.roomStatus = 'CHECKED_OUT';
      }
      const resultRoomNo = String(resultRoom.roomNo || room.roomNo);
      const resultRoomSite = String(resultRoom.site || room.site);
      const resultIndex = rooms.findIndex(item => item.roomNo === resultRoomNo && item.site === resultRoomSite);
      const optimisticVisual = resultIndex >= 0 ? roomVisualSignature_(rooms[resultIndex]) : '';
      if (resultIndex >= 0) {
        const previousPending = rooms[resultIndex].pendingOrderCount;
        rooms[resultIndex] = Object.assign({}, rooms[resultIndex], resultRoom, { pendingOrderCount: previousPending });
        delete rooms[resultIndex].__pendingAction;
      }
      state.indicator.version = Number(result.version || state.indicator.version);
      state.roommaidClose.loaded = false;
      state.roommaidClose.data = null;

      if (result.deferredNotification) {
        callServer('queueDeferredRoomOperationNotification', state.token, result.deferredNotification)
          .catch(error => console.error(`객실작업 후속 알림 등록 실패: ${error?.message || error}`));
      }

      const confirmedVisual = resultIndex >= 0 ? roomVisualSignature_(rooms[resultIndex]) : '';
      if (resultIndex >= 0 && optimisticVisual === confirmedVisual) {
        clearIndicatorRoomPendingMark_(resultRoomNo);
      } else {
        renderIndicatorRoomLocal_(resultRoomNo, resultRoomSite);
      }

      const totalMs = Math.round(performance.now() - clickedAt);
      const serverMs = Number(result.timing?.totalMs || result.performance?.elapsedMs || 0);
      const duplicateIgnored = action === 'CLEANING_COMPLETE' && result.alreadyCompleted === true;
      setSyncStatus(duplicateIgnored
        ? `${room.roomNo}호 중복 청소완료 요청 제외 · 화면 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`
        : `${room.roomNo}호 저장 완료 · 화면 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`);
      if (!fastAction) closeModal();
      showRoomActionToast_(duplicateIgnored
        ? `${room.roomNo}호는 이미 청소완료 처리되어 중복 요청을 제외했습니다.`
        : action === 'CLEANING_RESET'
          ? `${room.roomNo}호 청소완료 실적 ${Number(result.resetCompletionCount || 0)}건 초기화 완료`
          : `${room.roomNo}호 ${actionLabel} 완료`);
    } catch (error) {
      if (fastAction && index >= 0 && beforeRoom) {
        rooms[index] = beforeRoom;
        renderIndicatorRoomLocal_(room.roomNo, room.site);
        setSyncStatus(`${room.roomNo}호 저장 실패 · 기존 상태 복원`);
      }
      showRoomActionToast_(error?.message || '객실 작업 오류');
    } finally {
      delete state.indicator.roomActionInFlight[actionKey];
      if (sourceButton?.isConnected) {
        sourceButton.disabled = false;
        sourceButton.textContent = originalButtonText;
      }
    }
  }

  function removeOrderLocal_(orderId, roomNo) { // (저장 실패 임시오더 제거)
    const orders = state.indicator.data?.orders || [];
    const index = orders.findIndex(item => item.orderId === orderId);
    if (index >= 0) orders.splice(index, 1);
    recalculatePendingOrders_(roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function replacePendingOrderLocal_(pendingOrderId, order, version) { // (임시오더를 서버 확정오더로 교체)
    const orders = state.indicator.data?.orders || [];
    const pendingIndex = orders.findIndex(item => item.orderId === pendingOrderId);
    if (pendingIndex >= 0) orders.splice(pendingIndex, 1);
    const existingIndex = orders.findIndex(item => item.orderId === order.orderId);
    if (existingIndex >= 0) orders[existingIndex] = order; else orders.unshift(order);
    orders.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || String(b.registeredAt).localeCompare(String(a.registeredAt)));
    state.indicator.version = Number(version || state.indicator.version);
    recalculatePendingOrders_(order.roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function upsertOrderLocal_(order, version) { // (변경된 오더만 화면에 반영)
    const orders = state.indicator.data.orders || [];
    const index = orders.findIndex(item => item.orderId === order.orderId);
    if (index >= 0) orders[index] = order; else orders.unshift(order);
    orders.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || String(b.registeredAt).localeCompare(String(a.registeredAt)));
    state.indicator.version = Number(version || state.indicator.version);
    recalculatePendingOrders_(order.roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function recalculatePendingOrders_(roomNo) { // (해당 객실 미완료 오더수 재계산)
    const room = (state.indicator.data.rooms || []).find(item => item.roomNo === roomNo);
    if (!room) return;
    room.pendingOrderCount = (state.indicator.data.orders || []).filter(order => order.roomNo === roomNo && !['COMPLETED', 'UNABLE'].includes(order.statusCode)).length;
  }

  function startIndicatorSync() { // (지터 기반 통합 화면 동기화 + Realtime DB 보조조회 시작)
    stopIndicatorSync();
    scheduleIndicatorSync_();
    if (novaRealtimeIsEnabled_()) novaRealtimeStartIndicatorDbFallback_();
  }

  function scheduleIndicatorSync_() { // (사용자별 요청시점 분산)
    if (document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) return;
    const base = Number(state.bootstrap.app.indicatorSyncMs || 9000);
    state.indicator.syncTimer = window.setTimeout(async () => {
      state.indicator.syncTimer = null;
      await syncIndicatorDelta();
      scheduleIndicatorSync_();
    }, nextSyncDelay_(base));
  }

  function stopIndicatorSync() { // (통합 화면 동기화 중지)
    if (state.indicator.syncTimer) window.clearTimeout(state.indicator.syncTimer);
    state.indicator.syncTimer = null;
    novaRealtimeStopIndicatorDbFallback_();
  }

  async function syncIndicatorDelta() { // (변경된 경우에만 객실·오더 재조회)
    if (document.hidden || state.activeMenu !== 'indicator' || state.indicator.loading || state.indicator.syncInFlight || Object.keys(state.indicator.roomActionInFlight || {}).length || !state.indicator.loaded || isHousemanItemEditorOpen_()) return;
    state.indicator.syncInFlight = true;
    try {
      const result = await callReadServerWithRetry_('getIndicatorDelta', state.token, {
        businessDate: state.indicator.businessDate,
        site: state.indicator.site,
        sinceVersion: state.indicator.version
      });
      if (!result?.ok) throw new Error(result?.message || '동기화 실패');
      if (result.changed) applyIndicatorSnapshot(result);
      setSyncStatus(`${result.changed ? '변경 반영' : '정상 연결'} · ${result.serverTime || ''}`);
    } catch (error) {
      setSyncStatus(`연결 재시도 · ${error?.message || '오류'}`);
    } finally {
      state.indicator.syncInFlight = false;
    }
  }

  async function applyRoomUploadPreview_(resetExisting) { // (검증된 객실현황 유지 반영·초기화 후 교체)
    const previewId = state.indicator.uploadPreviewId;
    if (!previewId) return showToast('유효한 업로드 미리보기가 없습니다.');

    const resetMode = resetExisting === true;
    if (resetMode) {
      const confirmed = window.confirm(
        `${state.indicator.businessDate} / ${state.indicator.site}의 기존 객실현황을 초기화한 뒤 새 파일로 다시 업로드합니다.\n\n` +
        '같은 업무일자·사업장의 기존 객실행과 진행상태·기존 배정이 제거됩니다. 계속하시겠습니까?'
      );
      if (!confirmed) return;
    }

    const button = resetMode ? $('uploadResetApplyButton') : $('uploadApplyButton');
    const otherButton = resetMode ? $('uploadApplyButton') : $('uploadResetApplyButton');
    const originalText = button?.textContent || '';
    if (button) {
      button.disabled = true;
      button.textContent = resetMode ? '초기화 후 반영 중…' : '반영 중…';
    }
    if (otherButton) otherButton.disabled = true;
    try {
      const result = await callServer('applyRoomStatusUpload', state.token, previewId, {
        resetExisting: resetMode
      });
      if (!result?.ok) throw new Error(result?.message || '객실현황 반영에 실패했습니다.');
      closeModal();
      state.indicator.version = Number(result.version || 0);
      state.indicator.businessDate = result.businessDate || state.indicator.businessDate;
      state.indicator.site = result.site || state.indicator.site;
      if (Array.isArray(result.rooms)) {
        state.indicator.data = Object.assign({}, state.indicator.data || {}, { rooms: result.rooms });
        state.indicator.loaded = true;
        renderIndicatorSummary();
        renderRoomFilters();
        renderRoomGrid();
      }
      showToast(result.message || '객실현황을 반영했습니다.');
      await loadIndicatorSnapshot({ silent: true, force: true });
    } catch (error) {
      if (button) {
        button.disabled = false;
        button.textContent = originalText;
      }
      if (otherButton) otherButton.disabled = false;
      showToast(error?.message || '객실현황 반영 오류');
    }
  }

  function setUploadBusy_(busy, text) { // (업로드 중복 요청 방지)
    const button = $('uploadPreviewButton');

    if (button) {

    if (input) input.setAttribute('aria-busy', busy ? 'true' : 'false');
  }

  function formatFileSize_(bytes) { // (파일 크기 표시)
    const size = Number(bytes || 0);
    if (size < 1024) return `${size}B`;
    if (size < 1024 * 1024) return `${Math.round(size / 1024)}KB`;
    return `${(size / 1024 / 1024).toFixed(1)}MB`;
  }

  async function handleQmPlaceManagementClick_(event) { // (점검장소 변경·삭제)
    const save = event.target.closest('[data-place-save]');
    if (save) return saveQmChecklistPlace_(save.dataset.placeSave, save);
    const remove = event.target.closest('[data-place-delete]');
    if (!remove) return;
    const code = remove.dataset.placeDelete;
    const place = (state.qmChecklist.data?.places || []).find(row => row.code === code);
    if (!window.confirm(`${place?.label || '선택 장소'}를 삭제하시겠습니까?`)) return;
    remove.disabled = true;
    try {
      const result = await callServer('deleteQmChecklistPlace', state.token, { code });
      if (!result?.ok) throw new Error(result?.message || '삭제하지 못했습니다.');
      showToast(result.message || '삭제했습니다.');
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '삭제 오류'); remove.disabled = false; }
  }

  async function saveQmChecklistPlace_(code, button) { // (점검장소 신규·변경 저장)
    const card = code ? document.querySelector(`[data-place-code="${code}"]`) : null;
    const payload = code ? {
      code, label: card?.querySelector('[data-place-label]')?.value.trim(), order: card?.querySelector('[data-place-order]')?.value
    } : { label: $('qmPlaceNewLabel')?.value.trim(), order: $('qmPlaceNewOrder')?.value };

    try {
      const result = await callServer('saveQmChecklistPlace', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '저장하지 못했습니다.');
      showToast(result.message || '저장했습니다.');
      if (!code && $('qmPlaceNewLabel')) $('qmPlaceNewLabel').value = '';
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '저장 오류'); if (button) button.disabled = false; }
  }

  async function handleQmChecklistManagementClick_(event) { // (체크리스트 수정·삭제 버튼 처리)
    const saveButton = event.target.closest('[data-checklist-save]');
    if (saveButton) return saveQmChecklistManagementItem_(saveButton.dataset.checklistSave, saveButton);

    deleteButton.disabled = true;
    try {
      const result = await callServer('deleteQmChecklistItem', state.token, { code });
      if (!result?.ok) throw new Error(result?.message || '삭제하지 못했습니다.');
      showToast(result.message || '삭제했습니다.');
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '삭제 오류'); deleteButton.disabled = false; }
  }

  async function saveQmChecklistManagementItem_(code, button) { // (체크리스트 신규·변경 저장)
    const card = code ? document.querySelector(`[data-checklist-code="${code}"]`) : null;
    const payload = code ? {
      code,
      placeCode: card?.querySelector('[data-checklist-place]')?.value,
      label: card?.querySelector('[data-checklist-label]')?.value.trim(),
      order: card?.querySelector('[data-checklist-order]')?.value,
      required: Boolean(card?.querySelector('[data-checklist-required]')?.checked),
      photoRequired: Boolean(card?.querySelector('[data-checklist-photo]')?.checked)
    } : {
      placeCode: $('qmChecklistNewPlace')?.value,
      label: $('qmChecklistNewLabel')?.value.trim(),
      order: $('qmChecklistNewOrder')?.value,
      required: Boolean($('qmChecklistNewRequired')?.checked),
      photoRequired: Boolean($('qmChecklistNewPhoto')?.checked)
    };
    if (!payload.placeCode) return showToast('점검 장소를 선택하세요.');
    if (!payload.label) return showToast('점검 항목명을 입력하세요.');
    if (button) button.disabled = true;
    try {
      const result = await callServer('saveQmChecklistItem', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '저장하지 못했습니다.');
      showToast(result.message || '저장했습니다.');
      if (!code && $('qmChecklistNewLabel')) $('qmChecklistNewLabel').value = '';
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '저장 오류'); if (button) button.disabled = false; }
  }

  function bindQmQualityControls_() { // (QM 품질실적 조회조건)
    const now = new Date();
    $('qmQualityDate').value = state.qmChecklist.analyticsDate || formatClientDate_(now);
    $('qmQualityYear').innerHTML = Array.from({ length: 8 }, (_, index) => now.getFullYear() - 6 + index).map(year => `<option value="${year}">${year}년</option>`).join('');
    $('qmQualityMonth').innerHTML = Array.from({ length: 12 }, (_, index) => `<option value="${index + 1}">${index + 1}월</option>`).join('');
    $('qmQualityYear').value = String(state.qmChecklist.analyticsYear || now.getFullYear());
    $('qmQualityMonth').value = String(state.qmChecklist.analyticsMonth || now.getMonth() + 1);
    const sites = state.qmChecklist.data?.sites || [];
    $('qmQualitySite').innerHTML = ['<option value="">전체 사업장</option>'].concat((sites || []).map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`)).join('');
    $('qmQualitySite').value = state.qmChecklist.analyticsSite || '';

  function applyQmQualityPeriodUi_() { // (일별·월별 QM 실적 UI)
    const monthly = state.qmChecklist.analyticsPeriod === 'MONTHLY';
    document.querySelectorAll('[data-qm-period]').forEach(button => button.classList.toggle('active', button.dataset.qmPeriod === state.qmChecklist.analyticsPeriod));
    $('qmQualityDateField')?.classList.toggle('hidden', monthly);
    $('qmQualityYearField')?.classList.toggle('hidden', !monthly);
    $('qmQualityMonthField')?.classList.toggle('hidden', !monthly);

  async function loadQmInspectionAnalytics_() { // (QM·룸메이드 품질실적 조회)
    if (state.qmChecklist.analyticsLoading || !$('qmQualityContent')) return;
    state.qmChecklist.analyticsLoading = true;
    $('qmQualityContent').innerHTML = '<div class="settings-loading">점검실적을 불러오는 중입니다.</div>';
    state.qmChecklist.analyticsDate = $('qmQualityDate')?.value || state.qmChecklist.analyticsDate;
    state.qmChecklist.analyticsYear = Number($('qmQualityYear')?.value || state.qmChecklist.analyticsYear);
    state.qmChecklist.analyticsMonth = Number($('qmQualityMonth')?.value || state.qmChecklist.analyticsMonth);
    state.qmChecklist.analyticsSite = $('qmQualitySite')?.value || '';
    try {
      const result = await callServer('getQmInspectionAnalytics', state.token, {
        period: state.qmChecklist.analyticsPeriod,
        date: state.qmChecklist.analyticsDate,
        year: state.qmChecklist.analyticsYear,
        month: state.qmChecklist.analyticsMonth,
        site: state.qmChecklist.analyticsSite
      });
      if (!result?.ok) throw new Error(result?.message || '점검실적을 불러오지 못했습니다.');
      state.qmChecklist.analytics = result;
      renderQmInspectionAnalytics_();
    } catch (error) {
      $('qmQualityContent').innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '점검실적 조회 오류')}</div>`;
    } finally { state.qmChecklist.analyticsLoading = false; }
  }

      <div class="qm-quality-summary">
        ${[['점검수', summary.inspections || 0], ['양호', summary.passed || 0], ['재정비', summary.failed || 0], ['지적건수', summary.defectCount || 0], ['사진', summary.photoCount || 0], ['1실 평균', summary.averageMinutes == null ? '-' : `${summary.averageMinutes}분`]].map(([label,value]) => `<div><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join('')}

      <details open><summary>QM 매니저 실적</summary>${qm.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>QM</th><th>점검수량</th><th>재정비 객실</th><th>지적건수</th><th>1실 평균시간</th></tr></thead><tbody>${qm.map(item => `<tr><td>${escapeHtml(item.name || item.employeeNo)}</td><td>${Number(item.inspections || 0)}</td><td>${Number(item.failedInspections || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${item.averageMinutes == null ? '-' : `${item.averageMinutes}분`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">QM 점검실적이 없습니다.</div>'}</details>
      <details open><summary>룸메이드 품질실적</summary>${roommaids.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>룸메이드</th><th>점검건수</th><th>지적건수</th><th>주요 지적위치</th><th>주요 지적내용</th></tr></thead><tbody>${roommaids.map(item => `<tr><td>${escapeHtml(item.name || item.employeeNo)}</td><td>${Number(item.inspectionCount || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${escapeHtml(item.topLocations || '-')}</td><td>${escapeHtml((item.majorDefects || []).slice(0,3).map(row => `${row.roomNo} ${row.placeLabel}: ${row.note}`).join(' / ') || '-')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">룸메이드 점검실적이 없습니다.</div>'}</details>
      <details><summary>장소별 지적현황</summary>${locations.length ? `<div class="qm-location-chips">${locations.map(item => `<span>${escapeHtml(item.label)} <b>${Number(item.count || 0)}</b></span>`).join('')}</div>` : '<div class="daily-close-empty">지적 내역이 없습니다.</div>'}</details>
      <details><summary>점검이력 ${inspections.length}건</summary>${inspections.length ? `<div class="qm-inspection-history">${inspections.map(item => `<article><div><strong>${escapeHtml(item.roomNo)}</strong><span>${escapeHtml(item.businessDate)} · ${escapeHtml(item.site)} · QM ${escapeHtml(item.qmName || '-')}</span></div><div><b>${item.status === 'PASS' ? '양호' : `지적 ${item.defectCount}건`}</b><span>${item.durationMinutes == null ? '-' : `${item.durationMinutes}분`} · 룸메이드 ${escapeHtml((item.roommaidNames || []).join(' · ') || '-')}</span></div>${item.defects?.length ? `<ul>${item.defects.map(defect => `<li>${escapeHtml(defect.placeLabel || '기타')} · ${escapeHtml(defect.itemLabel || '하자')}: ${escapeHtml(defect.note || '')} ${(defect.photos || []).map(photo => `<button type="button" data-qm-photo-view="${escapeAttr(photo.fileId)}">사진</button>`).join('')}</li>`).join('')}</ul>` : ''}</article>`).join('')}</div>` : '<div class="daily-close-empty">점검이력이 없습니다.</div>'}</details>`;
    $('qmQualityContent').querySelectorAll('[data-qm-photo-view]').forEach(button => button.addEventListener('click', () => openQmPhotoViewer_(button.dataset.qmPhotoView)));
  }

  async function startQmInspection_(roomNo, button) { // (점검 시작 즉시 장소별 체크리스트 팝업)
    const local = state.qmChecklist.activeInspection;
    if (local?.roomNo === roomNo && local?.draft?.draftId) {
      openQmInspectionModal_();
      return;
    }
    if (button) button.disabled = true;
    try {
      const room = (state.mobile.data?.rooms || []).find(item => item.roomNo === roomNo);
      const result = await callServer('startQmInspection', state.token, { businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo, expectedVersion: Number(room?.version || 0) });
      if (!result?.ok) throw new Error(result?.message || '점검을 시작하지 못했습니다.');
      state.mobile.version = Number(result.version || state.mobile.version);
      state.mobile.data.qmChecklist = result.checklist || state.mobile.data.qmChecklist;
      state.qmChecklist.activeInspection = { roomNo, checklist: result.checklist, draft: result.draft, roomVersion: Number(result.room?.version || result.version || 0) };
      openQmInspectionModal_();
      await loadMobileSnapshot({ silent: true, force: true });
    } catch (error) { showToast(error?.message || '점검 시작 오류'); if (button) button.disabled = false; }
  }

  function openQmChecklistModal_(roomNo, button) { // (진행중 점검 다시 열기 호환)
    return startQmInspection_(roomNo, button);
  }

  function openQmInspectionModal_() { // (장소별 실시간 QM 체크리스트)
    const active = state.qmChecklist.activeInspection;
    if (!active) return;
    const checklist = active.checklist || state.mobile.data?.qmChecklist || {};
    const draft = active.draft || { answers: [], defects: [] };
    const answerMap = {};
    (draft.answers || []).forEach(answer => { answerMap[answer.code] = answer; });
    const defects = Array.isArray(draft.defects) ? draft.defects : [];
    openModal(`<div class="modal-card qm-checklist-modal rc3">
      <div class="modal-header"><div><small>QM 실시간 점검</small><h2>${escapeHtml(active.roomNo)} 장소별 체크리스트</h2><p>${escapeHtml(draft.startedAt || '')} 시작</p></div><button class="modal-close" data-close-modal>×</button></div>
      <div class="modal-body">
        <div class="qm-checklist-guide"><b>실시간 저장</b> · 장소별로 양호/불량을 선택하고, 하자는 사진과 함께 등록할 수 있습니다. 최종 저장 시 지적이 있으면 재정비로 전환됩니다.<span id="qmDraftSaveStatus">${escapeHtml(draft.savedAt ? `마지막 저장 ${draft.savedAt}` : '저장 대기')}</span></div>
        <div id="qmChecklistInspectionItems" class="qm-checklist-place-list">
          ${(checklist.groups || []).map(group => {
            const placeDefects = defects.filter(defect => defect.placeCode === group.place.code);
            return `<details class="qm-inspection-place" open data-qm-place="${escapeAttr(group.place.code)}"><summary><strong>${escapeHtml(group.place.label)}</strong><span>${group.items.length}개 · 하자 ${placeDefects.length}건</span></summary>
              <div class="qm-place-items">${group.items.map((item,index) => {
                const answer = answerMap[item.code] || {};
                return renderQmInspectionItem_(item, answer, index);
              }).join('')}</div>
              <div class="qm-custom-defects">${placeDefects.map(defect => renderQmCustomDefect_(defect, group.place)).join('')}</div>
              <button class="secondary-button qm-add-defect" type="button" data-qm-add-defect="${escapeAttr(group.place.code)}">+ ${escapeHtml(group.place.label)} 하자 등록</button>
            </details>`;
          }).join('')}
        </div>
        <div class="modal-actions sticky"><button id="qmInspectionSaveOnly" class="secondary-button" type="button">임시 저장</button><button id="qmChecklistSubmit" class="action-button primary" type="button">점검 완료·결과 저장</button></div>
      </div>
    </div>`);
    bindQmInspectionModalEvents_();
  }

  function renderQmInspectionItem_(item, answer, index) { // (장소별 체크리스트 한 항목)
    const photos = answer.photos || [];
    return `<article class="qm-checklist-inspection-item rc3" data-qm-check-code="${escapeAttr(item.code)}">
      <div class="qm-checklist-inspection-heading"><strong>${index + 1}. ${escapeHtml(item.label)}</strong><div>${item.required ? '<span class="required-badge">필수</span>' : '<span>선택</span>'}${item.photoRequired ? '<span class="photo-badge">사진 필수</span>' : ''}</div></div>
      <label><span>점검결과</span><select data-qm-result><option value="">선택</option><option value="PASS"${answer.result === 'PASS' ? ' selected' : ''}>양호</option><option value="FAIL"${answer.result === 'FAIL' ? ' selected' : ''}>불량</option>${item.required ? '' : `<option value="SKIP"${answer.result === 'SKIP' ? ' selected' : ''}>해당없음</option>`}</select></label>
      <label><span>불량내용·점검메모</span><textarea data-qm-note placeholder="불량 선택 시 위치와 내용을 입력하세요.">${escapeHtml(answer.note || '')}</textarea></label>
      <div class="qm-photo-control"><label><span>하자 사진</span><input data-qm-photo-input type="file" accept="image/*" capture="environment"></label><div class="qm-photo-list">${renderQmPhotoChips_(photos, 'ITEM', item.code)}</div></div>
    </article>`;
  }

  function renderQmCustomDefect_(defect, place) { // (추가 하자 카드)
    return `<article class="qm-custom-defect" data-qm-defect-id="${escapeAttr(defect.id)}"><div class="qm-custom-defect-head"><strong>${escapeHtml(place.label)} 추가 하자</strong><button type="button" data-qm-remove-defect="${escapeAttr(defect.id)}">삭제</button></div><label><span>하자내용</span><textarea data-qm-defect-note placeholder="하자 위치와 내용을 입력하세요.">${escapeHtml(defect.note || '')}</textarea></label><div class="qm-photo-control"><label><span>하자 사진(필수)</span><input data-qm-photo-input type="file" accept="image/*" capture="environment"></label><div class="qm-photo-list">${renderQmPhotoChips_(defect.photos || [], 'DEFECT', defect.id)}</div></div></article>`;
  }

  function renderQmPhotoChips_(photos, targetType, targetCode) { // (점검사진 칩)
    return (photos || []).map(photo => `<span class="qm-photo-chip"><button type="button" data-qm-photo-view="${escapeAttr(photo.fileId)}">사진보기</button><small>${escapeHtml(photo.name || '')}</small><button type="button" data-qm-photo-delete="${escapeAttr(photo.fileId)}" data-target-type="${targetType}" data-target-code="${escapeAttr(targetCode)}">×</button></span>`).join('');
  }

  function bindQmInspectionModalEvents_() { // (실시간 입력·사진·하자 이벤트)
    const root = $('qmChecklistInspectionItems');
    if (!root) return;
    root.addEventListener('input', scheduleQmInspectionAutosave_);
    root.addEventListener('change', event => {
      if (event.target.matches('[data-qm-photo-input]')) return uploadQmInspectionPhoto_(event.target);
      scheduleQmInspectionAutosave_();
    });
    root.addEventListener('click', event => {
      const add = event.target.closest('[data-qm-add-defect]');
      if (add) return addQmCustomDefect_(add.dataset.qmAddDefect);
      const remove = event.target.closest('[data-qm-remove-defect]');
      if (remove) return removeQmCustomDefect_(remove.dataset.qmRemoveDefect);
      const view = event.target.closest('[data-qm-photo-view]');
      if (view) return openQmPhotoViewer_(view.dataset.qmPhotoView);
      const del = event.target.closest('[data-qm-photo-delete]');
      if (del) return deleteQmInspectionPhoto_(del);
    });
    $('qmInspectionSaveOnly').addEventListener('click', () => saveQmInspectionDraftNow_(true));
    $('qmChecklistSubmit').addEventListener('click', submitQmInspectionFinal_);
  }

  function collectQmInspectionForm_() { // (화면의 실시간 답변을 초안 객체에 반영)
    const active = state.qmChecklist.activeInspection;
    if (!active) return null;
    const draft = active.draft || (active.draft = { answers: [], defects: [] });
    const oldAnswers = {};
    (draft.answers || []).forEach(answer => { oldAnswers[answer.code] = answer; });
    draft.answers = [...document.querySelectorAll('[data-qm-check-code]')].map(card => {
      const code = card.dataset.qmCheckCode;
      return Object.assign({}, oldAnswers[code] || {}, {
        code,
        result: card.querySelector('[data-qm-result]')?.value || '',
        note: card.querySelector('[data-qm-note]')?.value.trim() || '',
        photos: oldAnswers[code]?.photos || []
      });
    });
    const oldDefects = {};
    (draft.defects || []).forEach(defect => { oldDefects[defect.id] = defect; });
    draft.defects = [...document.querySelectorAll('[data-qm-defect-id]')].map(card => {
      const id = card.dataset.qmDefectId;
      const placeCode = card.closest('[data-qm-place]')?.dataset.qmPlace || oldDefects[id]?.placeCode || '';
      const place = (active.checklist?.places || []).find(row => row.code === placeCode);
      return Object.assign({}, oldDefects[id] || {}, {
        id, placeCode, placeLabel: place?.label || oldDefects[id]?.placeLabel || '', itemLabel: '추가 하자',
        note: card.querySelector('[data-qm-defect-note]')?.value.trim() || '', photos: oldDefects[id]?.photos || []
      });
    });
    return draft;
  }

  function scheduleQmInspectionAutosave_() { // (입력 후 0.8초 자동저장)
    collectQmInspectionForm_();
    const status = $('qmDraftSaveStatus');
    if (status) status.textContent = '변경사항 저장 대기…';
    if (state.qmChecklist.autosaveTimer) clearTimeout(state.qmChecklist.autosaveTimer);
    state.qmChecklist.autosaveTimer = setTimeout(() => saveQmInspectionDraftNow_(false), 800);
  }

  async function saveQmInspectionDraftNow_(showMessage) { // (점검 초안 서버 저장)
    const active = state.qmChecklist.activeInspection;
    if (!active?.draft?.draftId) return null;
    if (state.qmChecklist.autosaveTimer) clearTimeout(state.qmChecklist.autosaveTimer);
    state.qmChecklist.autosaveTimer = null;
    const draft = collectQmInspectionForm_() || active.draft;
    const status = $('qmDraftSaveStatus');
    if (status) status.textContent = '저장 중…';
    try {

  async function compressQmPhotoFile_(file) { // (모바일 사진 1600px JPEG 압축)
    if (!file.type.startsWith('image/')) throw new Error('이미지 파일만 등록할 수 있습니다.');
    const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('사진을 읽지 못했습니다.')); reader.readAsDataURL(file); });
    const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('지원하지 않는 사진 형식입니다.')); img.src = dataUrl; });
    const max = 1600;
    const scale = Math.min(1, max / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    const compressed = canvas.toDataURL('image/jpeg', 0.78);
    const base64 = compressed.split(',')[1] || '';
    if (Math.ceil(base64.length * 0.75) > 2500000) throw new Error('사진 용량이 큽니다. 더 낮은 해상도로 촬영해 주세요.');
    return { fileName: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', base64 };
  }

  async function submitQmInspectionFinal_(event) { // (QM 최종완료·재정비 저장)
    const button = event.currentTarget;
    button.disabled = true;
    const active = state.qmChecklist.activeInspection;
    const draft = collectQmInspectionForm_();
    const items = active.checklist?.items || [];
    const answerMap = {};
    (draft.answers || []).forEach(answer => { answerMap[answer.code] = answer; });
    const missing = items.find(item => !answerMap[item.code]?.result);
    if (missing) { showToast(`${missing.placeLabel} · ${missing.label} 점검결과를 선택하세요.`); button.disabled = false; return; }
    const failNoNote = items.find(item => answerMap[item.code]?.result === 'FAIL' && !answerMap[item.code]?.note);
    if (failNoNote) { showToast(`${failNoNote.placeLabel} 불량 내용을 입력하세요.`); button.disabled = false; return; }
    const invalidDefect = (draft.defects || []).find(defect => !defect.note || !(defect.photos || []).length);
    if (invalidDefect) { showToast('추가 하자는 내용과 사진을 모두 등록하세요.'); button.disabled = false; return; }
    try {
      await saveQmInspectionDraftNow_(false);

        businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo: active.roomNo,
        draftId: active.draft.draftId, revision: active.checklist.revision,

  async function loadMobileSnapshot(options = {}) { // (직무별 모바일 데이터 조회)
    if (state.mobile.loading && !options.force) return;
    state.mobile.loading = true;
    const previousY = window.scrollY;
    if (!options.silent && $('mobileList')) $('mobileList').innerHTML = '<div class="mobile-loading">업무를 불러오고 있습니다.</div>';
    try {
      const result = await callServer('getMobileSnapshot', state.token, {
        businessDate: state.mobile.businessDate || state.bootstrap.app.businessDate,
        site: state.mobile.site
      });
      if (!result?.ok) throw new Error(result?.message || '모바일 업무를 불러오지 못했습니다.');
      applyMobileSnapshot(result);
      if (options.silent) requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
      startMobileSync();
      setSyncStatus(`모바일 동기화 · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);
    } catch (error) {
      if ($('mobileList')) $('mobileList').innerHTML = `<div class="mobile-empty">${escapeHtml(error?.message || '업무를 불러오지 못했습니다.')}</div>`;
      setSyncStatus(`연결 오류 · ${error?.message || '모바일 조회 실패'}`);
    } finally {
      state.mobile.loading = false;
    }
  }

  function applyMobileSnapshot(result) { // (모바일 데이터 상태 반영)

    if (novaRealtimeIsEnabled_() && state.bootstrap?.user?.role === 'ROOMMAID' && Array.isArray(result.rooms) && previousRooms.length) {
      result.rooms = novaRealtimeProtectRoomArray_(result.rooms, previousRooms);
    }
    state.mobile.loaded = true;
    state.mobile.data = result;
    state.mobile.version = Number(result.version || 0);
    state.mobile.businessDate = result.selection?.businessDate || state.mobile.businessDate || state.bootstrap.app.businessDate;
    state.mobile.site = result.selection?.site ?? state.mobile.site;
    renderMobileData();
    if (novaRealtimeIsEnabled_() && state.bootstrap?.user?.role === 'ROOMMAID') {
      // 무료모드: 모바일은 DB hydrate만 하고 Realtime 채널은 열지 않습니다.
      void novaRealtimeHydrateCurrentView_();
    }
  }

  function compareRoommaidAssignedRooms_(a, b) { // (룸메이드 배정객실 상태우선·객실번호순 정렬)
    const rankDiff = roommaidAssignedRoomRank_(a) - roommaidAssignedRoomRank_(b);
    if (rankDiff) return rankDiff;
    return String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' });
  }

  function roommaidAssignedRoomRank_(room) { // (청소중→선배정→대기→D/S→퇴실예정 순위)
    const cleaningStatus = String(room.cleaningStatus || '').trim().toUpperCase();
    const roomStatus = String(room.roomStatus || '').trim().toUpperCase();
    const cleaningType = String(room.cleaningType || '').trim().toUpperCase();

    if (cleaningStatus === 'CLEANING') return 0;
    if (roomStatus === 'DUE_OUT') return 4;
    if (cleaningStatus === 'ASSIGNED' && cleaningType !== 'DS') return 1;
    if (['WAITING', 'REWORK'].includes(cleaningStatus) && cleaningType !== 'DS') return 2;
    if (cleaningType === 'DS') return 3;
    if (roomStatus === 'CHECKED_OUT') return 2;
    return 5;
  }

  function renderPublicRoomGroups_(rooms) { // (객실퍼블릭 동·층별 객실 묶음)
    const groups = new Map();
    rooms.forEach(room => {
      const building = String(room.building || '').trim() || '동 미지정';
      const floor = String(room.floor || '').trim();
      const key = `${building}__${floor}`;
      if (!groups.has(key)) groups.set(key, { building, floor, rooms: [] });
      groups.get(key).rooms.push(room);
    });
    return [...groups.values()].map(group => {
      const floorLabel = group.floor ? `${group.floor}층` : '층 미지정';
      return `<section class="mobile-room-group">
        <header class="mobile-room-group-header"><strong>${escapeHtml(group.building)} · ${escapeHtml(floorLabel)}</strong><span>${group.rooms.length}실</span></header>
        <div class="mobile-room-group-list">${group.rooms.map(room => renderMobileRoomCard_(room, 'PUBLIC')).join('')}</div>
      </section>`;
    }).join('');
  }

  function filterMobileOrder_(order, query) { // (모바일 하우스맨 오더 필터)
    const done = ['COMPLETED', 'UNABLE'].includes(order.statusCode);
    if (state.mobile.filter === 'ACTIVE' && done) return false;
    if (state.mobile.filter === 'DONE' && !done) return false;
    if (state.mobile.filter === 'IMPORTANT' && !order.important && !order.handover) return false;
    if (!query) return true;
    return [order.roomNo, order.itemSummary, order.note, order.unableReason, order.assignedName, ...(order.routeCandidateNames || []), order.statusLabel].join(' ').toLowerCase().includes(query);
  }

  function filterMobileRoom_(room, query, role) { // (모바일 객실 필터)
    if (role === 'PUBLIC') {
      if (state.mobile.building && room.building !== state.mobile.building) return false;
      if (state.mobile.floor && String(room.floor || '') !== state.mobile.floor) return false;
      if (state.mobile.filter === 'DELAYED' && !room.departureDelayed) return false;
      if (!['ALL', 'DELAYED'].includes(state.mobile.filter) && room.roomStatus !== state.mobile.filter) return false;
    } else {
      const doneStatuses = role === 'QM' ? ['QM_COMPLETED'] : ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'];
      const done = doneStatuses.includes(room.cleaningStatus);
      if (state.mobile.filter === 'ACTIVE' && done) return false;
      if (state.mobile.filter === 'DONE' && !done) return false;
    }
    if (!query) return true;
    return [room.roomNo, room.building, room.floor ? `${room.floor}층` : '', room.roomStatus, room.cleaningStatus, room.roommaidName, room.secondaryRoommaidName, room.qmName].join(' ').toLowerCase().includes(query);
  }

  function renderMobileOrderCard_(order) { // (하우스맨 공동 전달·접수고정 모바일 오더 카드)
    const employeeNo = state.bootstrap.user.employeeNo;
    const routeCandidates = Array.isArray(order.routeCandidateEmployeeNos) ? order.routeCandidateEmployeeNos : [];
    const sharedClaimable = order.statusCode === 'ASSIGNED' && order.routeLocked !== true && routeCandidates.includes(employeeNo);
    const mine = order.assignedEmployeeNo === employeeNo || sharedClaimable;
    const sharedRoute = order.statusCode === 'ASSIGNED' && order.routeLocked !== true
      && Array.isArray(order.routeCandidateNames) && order.routeCandidateNames.length > 1;
    const assigneeDisplay = sharedRoute ? `공동 전달 ${order.routeCandidateNames.join(' · ')}` : (order.assignedName || '미배정');
    let actions = '';
    if (!order.__pending) {
      if (mine && order.statusCode === 'ASSIGNED') actions = `<button data-order-action="ACCEPT" data-order-id="${escapeAttr(order.orderId)}">접수</button><button class="primary" data-order-action="ACCEPT_START" data-order-id="${escapeAttr(order.orderId)}">접수·바로 시작</button>`;
      else if (mine && order.statusCode === 'ACCEPTED') actions = `<button data-order-action="START" data-order-id="${escapeAttr(order.orderId)}">처리 시작</button>`;
      else if (mine && order.statusCode === 'PROCESSING') actions = `<button class="primary" data-order-action="COMPLETE" data-order-id="${escapeAttr(order.orderId)}">완료</button><button data-order-action="UNABLE" data-order-id="${escapeAttr(order.orderId)}">처리불가</button>`;
    }
    const unableReason = String(order.unableReason || '').trim();
    return `<article class="mobile-task-card ${order.important ? 'important' : ''}" data-mobile-order-id="${escapeAttr(order.orderId)}">
      <div class="mobile-card-top"><strong>${escapeHtml(order.roomNo || '공용')}</strong><span class="status-chip status-${escapeAttr(order.statusCode)}">${escapeHtml(order.statusLabel)}</span></div>
      <div class="mobile-task-title">${escapeHtml(order.itemSummary || '-')}</div>
      <div class="mobile-task-meta"><span>${escapeHtml(order.part || '-')}</span><span>${escapeHtml(assigneeDisplay)}</span></div>
      ${order.note ? `<p>${escapeHtml(order.note)}</p>` : ''}
      ${order.statusCode === 'UNABLE' && unableReason ? `<div class="mobile-unable-reason"><strong>처리불가 사유</strong><span>${escapeHtml(unableReason)}</span></div>` : ''}
      <div class="mobile-badges">${sharedRoute ? `<span>공동접수 ${order.routeCandidateNames.length}명</span>` : ''}${order.important ? '<span>중요</span>' : ''}${order.handover ? `<span>인수인계 ${escapeHtml(order.handoverTargetShift || '')}조</span>` : ''}</div>
      ${actions ? `<div class="mobile-actions">${actions}</div>` : ''}
    </article>`;
  }

  function roommaidMobileCardClass_(room, role) { // (룸메이드 청소가능 객실카드 색상)
    if (role !== 'ROOMMAID' || room.roomStatus === 'DUE_OUT') return '';
    const cleaningReady = ['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus);
    if (!cleaningReady) return '';
    return room.cleaningType === 'DS' ? ' roommaid-ds-ready' : ' roommaid-waiting-ready';
  }

  function renderMobileRoomCard_(room, role) { // (룸메이드·QM·퍼블릭 모바일 객실 카드)
    const roomStatus = codeLabel_(state.mobile.data.codes?.roomStatuses, room.roomStatus);
    const cleaningStatus = codeLabel_(state.mobile.data.codes?.cleaningStatuses, room.cleaningStatus);
    const cleaningTypeLabel = room.cleaningType === 'DS' ? 'D/S' : '일반정비';
    const assignmentTypeLabel = room.assignmentType === 'PAIR_TRAINING' ? '2인1조(교육)' : room.assignmentType === 'PAIR' ? '2인1조' : '1인 배정';
    const assignedNames = [room.roommaidName, room.secondaryRoommaidName].filter(Boolean).join(' · ');
    const operationBadges = [
      room.preassigned ? '<span class="mobile-operation-badge preassigned">선배정</span>' : '',
      room.vip ? '<span class="mobile-operation-badge vip">VIP</span>' : '',
      room.importantRoom ? '<span class="mobile-operation-badge important">중요</span>' : ''
    ].filter(Boolean).join('');
    let actions = '';
    const mobileCleaningActive = role === 'ROOMMAID' && isCleaningActiveStatus_(room.cleaningStatus, state.mobile.data?.codes?.cleaningStatuses);
    if (role === 'ROOMMAID') {
      if (!room.__pending) {
        if (['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus)) actions += `<button class="primary" data-room-action="START" data-room-no="${escapeAttr(room.roomNo)}">${room.cleaningType === 'DS' ? 'D/S 시작' : '청소 시작'}</button>`;
        if (mobileCleaningActive) actions += `<button class="primary" data-room-action="COMPLETE" data-room-no="${escapeAttr(room.roomNo)}">${room.cleaningType === 'DS' ? 'D/S 완료' : '청소 완료'}</button>`;
      }
      actions += `<button data-houseman-request="${escapeAttr(room.roomNo)}">하우스맨 요청</button>`;
    } else if (role === 'QM') {
      if (['QM_WAITING', 'COMPLETED'].includes(room.cleaningStatus)) actions += `<button class="primary" data-room-action="START" data-room-no="${escapeAttr(room.roomNo)}">점검 시작</button>`;
      if (room.cleaningStatus === 'QM_CHECKING') actions += `<button class="primary" data-room-action="CONTINUE" data-room-no="${escapeAttr(room.roomNo)}">점검 계속</button><button data-room-action="REWORK" data-room-no="${escapeAttr(room.roomNo)}">즉시 재정비</button>`;
      actions += `<button data-houseman-request="${escapeAttr(room.roomNo)}">하우스맨 요청</button>`;
    }
    return `<article class="mobile-room-card${roommaidMobileCardClass_(room, role)}${mobileCleaningActive ? ' mobile-card-cleaning' : ''}">
      <div class="mobile-card-top"><strong>${escapeHtml(room.roomNo)}</strong><span>${escapeHtml([room.building, room.floor ? `${room.floor}층` : ''].filter(Boolean).join(' · '))}</span></div>
      ${operationBadges ? `<div class="mobile-operation-badges">${operationBadges}</div>` : ''}
      <div class="mobile-room-status"><b>${escapeHtml(roomStatus)}</b><span>${escapeHtml(cleaningStatus)}</span></div>
      ${role === 'ROOMMAID' ? `<div class="mobile-cleaning-type ${room.cleaningType === 'DS' ? 'ds' : ''}">${escapeHtml(cleaningTypeLabel)} · ${escapeHtml(assignmentTypeLabel)}</div><div class="mobile-assigned-names">${escapeHtml(assignedNames)}</div>` : ''}
      ${role === 'PUBLIC' ? `<div class="mobile-public-result ${room.departureDelayed ? 'delayed' : room.roomStatus === 'CHECKED_OUT' ? 'checked-out' : ''}">${room.departureDelayed ? '퇴실지연' : room.roomStatus === 'CHECKED_OUT' ? '퇴실 확인' : room.roomStatus === 'DUE_OUT' ? '퇴실예정' : escapeHtml(roomStatus)}</div>` : ''}
      ${actions ? `<div class="mobile-actions">${actions}</div>` : ''}
    </article>`;
  }

  async function handleMobileListClick(event) { // (모바일 카드 작업 처리)
    const orderButton = event.target.closest('[data-order-action]');
    if (orderButton) {
      const action = orderButton.dataset.orderAction;
      const payload = { action, orderId: orderButton.dataset.orderId };
      if (action === 'UNABLE') return openMobileUnableModal_(payload.orderId);
      return runMobileAction_('updateHousemanOrder', payload, orderButton);
    }
    const roomButton = event.target.closest('[data-room-action]');
    if (roomButton) {
      const action = roomButton.dataset.roomAction;
      const roomNo = roomButton.dataset.roomNo;
      if (action === 'REWORK') return openMobileReworkModal_(roomNo);
      if (state.mobile.data?.role === 'QM' && ['START', 'CONTINUE', 'COMPLETE'].includes(action)) return startQmInspection_(roomNo, roomButton);
      return runMobileAction_('updateMobileRoomOperation', {
        businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo, action
      }, roomButton);
    }
    const requestButton = event.target.closest('[data-houseman-request]');
    if (requestButton) openMobileHousemanRequest_(requestButton.dataset.housemanRequest);
  }

  async function runMobileAction_(method, payload, button) { // (모바일 작업 무로딩 즉시반영·서버 단건 확정)
    const safePayload = Object.assign({}, payload || {});
    if (method === 'updateMobileRoomOperation') {
      const room = (state.mobile.data?.rooms || []).find(item => item.roomNo === safePayload.roomNo);
      if (!safePayload.expectedVersion) safePayload.expectedVersion = Number(room?.version || 0);
      if (!safePayload.rowNumber) safePayload.rowNumber = Number(room?.rowNumber || 0);
      if (!Object.prototype.hasOwnProperty.call(safePayload, 'qmEmployeeNo')) {
        safePayload.qmEmployeeNo = String(room?.qmEmployeeNo || '');
      }
    }
    if (method === 'updateHousemanOrder') {
      const order = (state.mobile.data?.orders || []).find(item => item.orderId === safePayload.orderId);
      if (!safePayload.expectedVersion) safePayload.expectedVersion = Number(order?.version || 0);
      if (!safePayload.rowNumber) safePayload.rowNumber = Number(order?.rowNumber || 0);
    }

    const previousY = window.scrollY;
    const role = state.mobile.data?.role;
    const action = String(safePayload.action || '').trim().toUpperCase();
    const housemanFastPath = method === 'updateHousemanOrder' && role === 'HOUSEMAN'
      && ['ACCEPT', 'ACCEPT_START', 'START', 'COMPLETE', 'UNABLE'].includes(action);
    const roommaidFastPath = method === 'updateMobileRoomOperation' && role === 'ROOMMAID'
      && ['START', 'COMPLETE'].includes(action);
    const housemanRollback = housemanFastPath ? applyOptimisticHousemanOrder_(safePayload) : null;
    const roommaidRollback = roommaidFastPath ? applyOptimisticRoommaidRoom_(safePayload) : null;

    state.mobile.actionInFlight = Number(state.mobile.actionInFlight || 0) + 1;
    if (button) {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      if (!housemanFastPath && !roommaidFastPath) {
        button.dataset.originalText = button.textContent;
        button.textContent = '반영 중…';
      }
    }

    try {
      const result = await saveRoomActionRealtimeOrLegacy_(method, safePayload);
      if (!result?.ok) throw new Error(result?.message || '처리하지 못했습니다.');
      state.mobile.version = Number(result.version || state.mobile.version);

      if (housemanFastPath && result.order) {
        upsertMobileHousemanOrderLocal_(result.order);
        refreshHousemanMobileSummaryLocal_();
        renderMobileSummary();
        patchMobileHousemanOrderCard_(result.order);
        setSyncStatus(`하우스맨 즉시 반영 · ${result.order.updatedAt || ''}`);
      } else if (roommaidFastPath && result.room) {
        upsertMobileRoommaidRoomLocal_(result.room);
        refreshRoommaidMobileSummaryLocal_();
        renderMobileSummary();
        renderMobileList();
        setSyncStatus(`룸메이드 즉시 저장 · ${result.room.updatedAt || ''}`);
      } else {
        await loadMobileSnapshot({ silent: true, force: true });
      }

      showToast(result.message || (housemanFastPath ? housemanActionMessage_(action) : roommaidActionMessage_(action)));
      requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
    } catch (error) {
      if (housemanRollback) restoreOptimisticHousemanOrder_(housemanRollback);
      if (roommaidRollback) restoreOptimisticRoommaidRoom_(roommaidRollback);
      showToast(error?.message || '처리 오류');
    } finally {
      state.mobile.actionInFlight = Math.max(0, Number(state.mobile.actionInFlight || 1) - 1);
      if (button && button.isConnected) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        if (button.dataset.originalText) button.textContent = button.dataset.originalText;
      }
    }
  }

  function applyOptimisticHousemanOrder_(payload) { // (하우스맨 버튼 선택 즉시 화면 선반영)
    const orders = state.mobile.data?.orders || [];
    const index = orders.findIndex(order => order.orderId === payload.orderId);
    if (index < 0) return null;
    const before = Object.assign({}, orders[index]);
    const action = String(payload.action || '').trim().toUpperCase();
    const statusByAction = { ACCEPT: 'ACCEPTED', ACCEPT_START: 'PROCESSING', START: 'PROCESSING', COMPLETE: 'COMPLETED', UNABLE: 'UNABLE' };
    const statusCode = statusByAction[action];
    if (!statusCode) return null;
    orders[index] = Object.assign({}, before, {
      statusCode,
      statusLabel: codeLabel_(state.mobile.data?.codes?.orderStatuses, statusCode),
      assignedEmployeeNo: ['ACCEPT', 'ACCEPT_START'].includes(action) ? state.bootstrap.user.employeeNo : before.assignedEmployeeNo,
      assignedName: ['ACCEPT', 'ACCEPT_START'].includes(action) ? state.bootstrap.user.name : before.assignedName,
      routeLocked: ['ACCEPT', 'ACCEPT_START'].includes(action) ? true : before.routeLocked,
      processorEmployeeNo: state.bootstrap.user.employeeNo,
      processorName: state.bootstrap.user.name,
      unableReason: action === 'UNABLE' ? String(payload.reason || '').trim() : (action === 'COMPLETE' ? '' : before.unableReason),
      __pending: true
    });
    sortMobileHousemanOrdersLocal_();
    refreshHousemanMobileSummaryLocal_();
    renderMobileSummary();
    patchMobileHousemanOrderCard_(orders[index]);
    setSyncStatus(`하우스맨 ${housemanActionMessage_(action)} 즉시 반영`);
    return { orderId: before.orderId, before };
  }

  function restoreOptimisticHousemanOrder_(rollback) { // (서버 오류 시 선반영 원상복구)
    if (!rollback?.before || !state.mobile.data?.orders) return;
    const index = state.mobile.data.orders.findIndex(order => order.orderId === rollback.orderId);
    if (index >= 0) state.mobile.data.orders[index] = rollback.before;
    else state.mobile.data.orders.push(rollback.before);
    sortMobileHousemanOrdersLocal_();
    refreshHousemanMobileSummaryLocal_();
    renderMobileSummary();
    patchMobileHousemanOrderCard_(rollback.before);
    setSyncStatus('하우스맨 반영 실패 · 기존 상태로 복원');
  }

  function patchMobileHousemanOrderCard_(order) { // (하우스맨 변경 오더 카드만 교체·필터순서 유지)
    const container = $('mobileList');
    if (!container || !order || state.mobile.data?.role !== 'HOUSEMAN') return false;
    const orderId = String(order.orderId || '').trim();
    if (!orderId) return false;

    const query = String(state.mobile.search || '').toLowerCase();
    const visibleOrders = (state.mobile.data?.orders || []).filter(item => filterMobileOrder_(item, query));
    const visibleIndex = visibleOrders.findIndex(item => item.orderId === orderId);
    const existing = container.querySelector(`[data-mobile-order-id="${cssEscape_(orderId)}"]`);

    if (visibleIndex < 0) {
      if (existing) existing.remove();
      if (!container.querySelector('[data-mobile-order-id]')) container.innerHTML = '<div class="mobile-empty">표시할 오더가 없습니다.</div>';
      return true;
    }

    const template = document.createElement('template');
    template.innerHTML = renderMobileOrderCard_(visibleOrders[visibleIndex]).trim();
    const nextCard = template.content.firstElementChild;
    if (!nextCard) return false;

    const empty = container.querySelector('.mobile-empty');
    if (empty) empty.remove();
    if (existing) existing.replaceWith(nextCard);

    const previousOrder = visibleOrders[visibleIndex - 1] || null;
    const nextOrder = visibleOrders[visibleIndex + 1] || null;
    const previousCard = previousOrder
      ? container.querySelector(`[data-mobile-order-id="${cssEscape_(previousOrder.orderId)}"]`)
      : null;
    const followingCard = nextOrder
      ? container.querySelector(`[data-mobile-order-id="${cssEscape_(nextOrder.orderId)}"]`)
      : null;

    if (previousCard) previousCard.after(nextCard);
    else if (followingCard) container.insertBefore(nextCard, followingCard);
    else if (!nextCard.isConnected) container.appendChild(nextCard);
    return true;
  }

  function upsertMobileHousemanOrderLocal_(order) { // (서버 확정 오더만 로컬 교체)
    if (!state.mobile.data) return;
    const orders = state.mobile.data.orders || (state.mobile.data.orders = []);
    const index = orders.findIndex(item => item.orderId === order.orderId);
    const confirmed = Object.assign({}, order);
    delete confirmed.__pending;
    if (index >= 0) orders[index] = confirmed;
    else orders.push(confirmed);
    sortMobileHousemanOrdersLocal_();
  }

  function applyOptimisticRoommaidRoom_(payload) { // (룸메이드 청소버튼 선택 즉시 객실카드 선반영)
    const rooms = state.mobile.data?.rooms || [];
    const index = rooms.findIndex(room => room.roomNo === payload.roomNo);
    if (index < 0) return null;
    const before = Object.assign({}, rooms[index]);
    const action = String(payload.action || '').trim().toUpperCase();
    const patch = { __pending: true };
    if (action === 'START') {
      patch.cleaningStatus = 'CLEANING';
    } else if (action === 'COMPLETE') {
      patch.cleaningStatus = before.qmEmployeeNo ? 'QM_WAITING' : 'COMPLETED';
      // 모바일 선반영에서도 객실상태를 공실로 바꾸지 않는다.
    } else {
      return null;
    }
    rooms[index] = Object.assign({}, before, patch);
    refreshRoommaidMobileSummaryLocal_();
    renderMobileSummary();
    renderMobileList();
    setSyncStatus(`룸메이드 ${roommaidActionMessage_(action)} 즉시 반영`);
    return { roomNo: before.roomNo, before };
  }

  function restoreOptimisticRoommaidRoom_(rollback) { // (룸메이드 저장 실패 시 객실카드 원상복구)
    if (!rollback?.before || !state.mobile.data?.rooms) return;
    const index = state.mobile.data.rooms.findIndex(room => room.roomNo === rollback.roomNo);
    if (index >= 0) state.mobile.data.rooms[index] = rollback.before;
    else state.mobile.data.rooms.push(rollback.before);
    refreshRoommaidMobileSummaryLocal_();
    renderMobileSummary();
    renderMobileList();
    setSyncStatus('룸메이드 반영 실패 · 기존 상태로 복원');
  }

  function upsertMobileRoommaidRoomLocal_(room) { // (서버 확정 객실 1건만 로컬 교체)
    if (!state.mobile.data) return;
    const rooms = state.mobile.data.rooms || (state.mobile.data.rooms = []);
    const index = rooms.findIndex(item => item.roomNo === room.roomNo);
    const confirmed = Object.assign({}, room);
    delete confirmed.__pending;
    if (index >= 0) rooms[index] = confirmed;
    else rooms.push(confirmed);
  }

  function refreshRoommaidMobileSummaryLocal_() { // (전체 재조회 없이 룸메이드 요약 즉시 계산)
    if (state.mobile.data?.role !== 'ROOMMAID') return;
    const rooms = state.mobile.data.rooms || [];
    state.mobile.data.summary = {
      total: rooms.length,
      waiting: rooms.filter(room => ['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus)).length,
      working: rooms.filter(room => room.cleaningStatus === 'CLEANING').length,
      completed: rooms.filter(room => ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'].includes(room.cleaningStatus)).length
    };
  }

  function roommaidActionMessage_(action) { // (룸메이드 모바일 즉시반영 안내문)
    const messages = { START: '청소를 시작했습니다.', COMPLETE: '청소를 완료했습니다.' };
    return messages[String(action || '').trim().toUpperCase()] || '처리했습니다.';
  }

  function sortMobileHousemanOrdersLocal_() { // (서버와 동일한 하우스맨 카드 우선순위)
    const orders = state.mobile.data?.orders || [];
    orders.sort((a, b) => {
      const aDone = ['COMPLETED', 'UNABLE'].includes(a.statusCode) ? 1 : 0;
      const bDone = ['COMPLETED', 'UNABLE'].includes(b.statusCode) ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      if (Boolean(a.important) !== Boolean(b.important)) return a.important ? -1 : 1;
      if (Boolean(a.handover) !== Boolean(b.handover)) return a.handover ? -1 : 1;
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    });
  }

  function refreshHousemanMobileSummaryLocal_() { // (전체 재조회 없이 하우스맨 요약 즉시 계산)
    if (state.mobile.data?.role !== 'HOUSEMAN') return;
    const orders = state.mobile.data.orders || [];
    const employeeNo = state.bootstrap.user.employeeNo;
    state.mobile.data.summary = {
      total: orders.length,

  async function syncMobileDelta() { // (모바일 변경 시에만 갱신)
    if (document.hidden || !['qm', 'houseman', 'cleaning', 'public'].includes(state.activeMenu) || state.mobile.loading || state.mobile.syncInFlight || state.mobile.actionInFlight || !state.mobile.loaded) return;

      const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').toUpperCase();

        const previousY = window.scrollY;

        requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
        setSyncStatus('룸메이드 DB 동기화 완료');

      const result = await callReadServerWithRetry_('getMobileDelta', state.token, {
        businessDate: state.mobile.businessDate,
        site: state.mobile.site,
        sinceVersion: state.mobile.version

      setSyncStatus(`모바일 반영 · ${result.serverTime || ''}`);

      setSyncStatus(`모바일 연결 오류 · ${error?.message || '재시도 예정'}`);

  function codeLabel_(codes, value) { // (코드 또는 표시명 변환)
    const text = String(value || '').trim();

    return found ? found.label : text || '-';
  }

  function codeValue_(codes, value) { // (상태 색상용 코드값 변환)
    const text = String(value || '').trim();
    const found = (codes || []).find(code => code.code === text || code.label === text);
    return String(found ? found.code : text || 'UNKNOWN').replace(/[^A-Za-z0-9_-]/g, '_').toUpperCase();
  }

  function isCleaningActiveStatus_(value, codes) { // (청소중 코드·표시명 통합 판정)
    const code = codeValue_(codes || [], value);
    const activeCodes = new Set(['CLEANING', 'IN_PROGRESS', 'WORKING', 'STARTED']);
    if (activeCodes.has(code)) return true;
    const normalize = text => String(text || '').trim().replace(/[\s_\-/]+/g, '').toUpperCase();
    const raw = normalize(value);
    const label = normalize(codeLabel_(codes || [], value));
    const activeLabels = new Set(['CLEANING', 'INPROGRESS', 'WORKING', 'STARTED', '청소중', '청소진행중', '청소진행', '정비중', '정비진행중']);
    return activeLabels.has(raw) || activeLabels.has(label);
  }

  function nextSyncDelay_(baseMs) { // (동시 폴링 집중 방지 지터)
    const base = Math.max(3000, Number(baseMs || 10000));
    const ratio = Math.max(0, Math.min(1, Number(state.bootstrap?.app?.syncJitterRatio ?? 1.0)));
    return Math.round(base + Math.random() * base * ratio);
  }

  function readRequestKey_(method, args) { // (동일 조회요청 병합키)
    let serialized = '';
    try { serialized = JSON.stringify(args || []); } catch (error) { serialized = String(args || ''); }
    return `${method}|${serialized}`;
  }

  async function callReadServerWithRetry_(method, ...args) { // (동일 조회 병합·제한적 지수 재시도)
    const requestKey = readRequestKey_(method, args);
    if (readRequestInflight_.has(requestKey)) return readRequestInflight_.get(requestKey);

    const task = (async () => {
      const delays = [0, 700, 1800];
      let lastError = null;
      for (let index = 0; index < delays.length; index += 1) {
        if (delays[index]) await wait_(delays[index] + Math.round(Math.random() * 300));
        if (document.hidden) throw new Error('백그라운드 화면에서는 동기화를 잠시 중지합니다.');
        try {
          const result = await callServer(method, ...args);
          if (result?.ok !== false) return result;
          const error = new Error(result?.message || '서버 조회 오류');
          error.code = result?.code || '';
          throw error;
        } catch (error) {
          lastError = error;
          if (!isTransientServerError_(error) || index === delays.length - 1) throw error;
        }
      }
      throw lastError || new Error('서버 조회 오류');
    })().finally(() => readRequestInflight_.delete(requestKey));

    readRequestInflight_.set(requestKey, task);
    return task;
  }

  function isTransientServerError_(error) { // (Apps Script 일시적 과부하 오류 판정)
    const code = String(error?.code || '').toUpperCase();
    const message = String(error?.message || error || '').toLowerCase();
    return code === 'BUSY_RETRY'
      || /too many|simultaneous|invoked too many|timed out|timeout|internal error|service unavailable|try again|잠시 후|동시 요청/.test(message);
  }

  function wait_(milliseconds) { // (조회 재시도 대기)
    return new Promise(resolve => window.setTimeout(resolve, Math.max(0, Number(milliseconds || 0))));
  }

  function callServer(method, ...args) { // (Apps Script 호출 Promise 변환)
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))));
      runner[method](...args);
    });
  }

  function escapeHtml(value) { // (화면 문자열 안전 처리)
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(value) { // (HTML 속성 문자열 안전 처리)
    return escapeHtml(value).replaceAll('`', '&#096;');
  }

        <section class="roommaid-performance-card"><div class="roommaid-performance-card-heading"><div><small>객실별 완료기록</small><h2>정비 상세</h2></div><span id="roommaidPerformanceDetailCount"></span></div><div id="roommaidPerformanceDetails" class="roommaid-performance-table-wrap"></div></section>
      </section>`;
    fillRoommaidPerformancePeriodInputs_();
    $('roommaidPerformancePeriod').addEventListener('click', event => {
      const button = event.target.closest('[data-rp-period]');

    $('roommaidPerformanceReload').addEventListener('click', () => loadRoommaidPerformance_({ force: true }));
    $('roommaidPerformanceYear').addEventListener('change', () => { state.roommaidStats.year = Number($('roommaidPerformanceYear').value); });

    $('roommaidPerformanceDate').addEventListener('change', () => { state.roommaidStats.date = $('roommaidPerformanceDate').value; });
