      state.mobile.qmBrowseLimit = 50;
      state.mobile.qmBrowseBuilding = '';
      state.mobile.qmBrowseFloor = '';
      renderQmBrowseTabs_();
      renderQmBrowseLocationFilters_();
      renderMobileSummary();
      renderMobileFilters();
      if (nextView === 'TARGETS') {
        renderMobileList();
        return;
      }
      await loadQmMobileBrowse_();
    }));
  }

  async function loadQmMobileBrowse_(options = {}) { // (QM 추가목록 탭 선택 시에만 지연조회)
    if (String(state.mobile.data?.role || '').trim().toUpperCase() !== 'QM') return;
    const view = qmMobileBrowseView_();
    if (view === 'TARGETS') return;
    const key = qmMobileBrowseKey_(view);
    const cached = state.mobile.qmBrowseData;
    if (!options.force && cached?.key === key && Array.isArray(cached.rooms)) {
      renderQmBrowseLocationFilters_();
      renderMobileSummary();
      renderMobileList();
      return;
    }
    const container = $('mobileList');
    if (container) container.innerHTML = '<div class="mobile-loading">객실을 불러오고 있습니다.</div>';
    try {
      const result = await callServer('getQmMobileBrowseRooms', state.token, {
        businessDate: state.mobile.businessDate || state.bootstrap.app.businessDate,
        site: state.mobile.site,
        view
      });
      if (!result?.ok) throw new Error(result?.message || 'QM 객실목록을 불러오지 못했습니다.');
      if (view !== qmMobileBrowseView_()) return;
      state.mobile.qmBrowseData = {
        key,
        view,
        rooms: Array.isArray(result.rooms) ? result.rooms : [],
        summary: result.summary || {},
        serverTime: result.serverTime || ''
      };
      renderQmBrowseLocationFilters_();
      renderMobileSummary();
      renderMobileList();
      setSyncStatus(`QM ${view === 'CLEANED' ? '당일 청소완료' : '공실'} 조회 · ${state.mobile.qmBrowseData.rooms.length}실`);
    } catch (error) {
      if (container) container.innerHTML = `<div class="mobile-empty">${escapeHtml(error?.message || 'QM 객실목록을 불러오지 못했습니다.')}</div>`;
      setSyncStatus(`QM 추가조회 오류 · ${error?.message || '조회 실패'}`);
    }
  }

  function renderQmBrowseLocationFilters_() { // (QM 추가탭 동·층 클라이언트 필터 · 서버 재조회 없음)
    const panel = $('qmBrowseLocationFilters');
    const buildingSelect = $('qmBrowseBuilding');
    const floorSelect = $('qmBrowseFloor');
    if (!panel || !buildingSelect || !floorSelect) return;
    const role = String(state.mobile.data?.role || '').trim().toUpperCase();
    const view = qmMobileBrowseView_();
    const visible = role === 'QM' && view !== 'TARGETS';
    panel.hidden = !visible;
    if (!visible) return;
    restoreQmBrowseLocationPreference_(); // MOBILE_LOCATION_FILTER_PERSIST_V1

    const key = qmMobileBrowseKey_(view);
    const browse = state.mobile.qmBrowseData;
    const rooms = browse?.key === key && Array.isArray(browse.rooms) ? browse.rooms : [];
    const buildings = [...new Set(rooms.map(room => String(room.building || '').trim()).filter(Boolean))]
      .sort((a, b) => Number(a.replace(/\D/g, '')) - Number(b.replace(/\D/g, '')) || a.localeCompare(b, 'ko'));
    if (state.mobile.qmBrowseBuilding && !buildings.includes(state.mobile.qmBrowseBuilding)) state.mobile.qmBrowseBuilding = '';
    buildingSelect.innerHTML = '<option value="">전체 동</option>' + buildings.map(building => `<option value="${escapeAttr(building)}">${escapeHtml(building)}</option>`).join('');
    buildingSelect.value = state.mobile.qmBrowseBuilding || '';

    const floors = [...new Set(rooms
      .filter(room => !state.mobile.qmBrowseBuilding || String(room.building || '') === state.mobile.qmBrowseBuilding)
      .map(room => String(room.floor || '').trim()).filter(Boolean))]
      .sort((a, b) => Number(a) - Number(b) || a.localeCompare(b, 'ko'));
    if (state.mobile.qmBrowseFloor && !floors.includes(state.mobile.qmBrowseFloor)) state.mobile.qmBrowseFloor = '';
    floorSelect.innerHTML = '<option value="">전체 층</option>' + floors.map(floor => `<option value="${escapeAttr(floor)}">${escapeHtml(floor)}층</option>`).join('');
    floorSelect.value = state.mobile.qmBrowseFloor || '';
  }

  function renderQmBrowseRoomCard_(room, view) { // (QM 추가탭 카드 · 안전 본인확보 후 기존 체크리스트 연결)
    const roomStatus = codeLabel_(state.mobile.data?.codes?.roomStatuses, room.roomStatus);
    const cleaningStatus = codeLabel_(state.mobile.data?.codes?.cleaningStatuses, room.cleaningStatus);
    const assignedNames = [room.roommaidName, room.secondaryRoommaidName].filter(Boolean).join(' · ') || '-';
    const qmName = String(room.qmName || '').trim();
    const qmNo = String(room.qmEmployeeNo || '').trim();
    const employeeNo = String(state.bootstrap?.user?.employeeNo || '').trim();
    const status = String(room.cleaningStatus || '').trim().toUpperCase();
    const operationBadges = [
      room.preassigned ? '<span class="mobile-operation-badge preassigned">선배정</span>' : '',
      room.vip ? '<span class="mobile-operation-badge vip">VIP</span>' : '',
      room.importantRoom ? '<span class="mobile-operation-badge important">중요</span>' : '',
      normalizeIndicatorRoomOperationalStatus_(room.operationalStatus) === 'REWORK' ? '<span class="mobile-operation-badge important">재정비</span>' : ''
    ].filter(Boolean).join('');
    const viewLabel = view === 'CLEANED' ? '당일 청소완료' : '공실';
    let actions = '';
    if (status === 'QM_COMPLETED') {
      actions = '<button type="button" disabled>점검완료</button>';
    } else if (qmNo && qmNo !== employeeNo) {
      actions = '<button type="button" disabled>다른 QM 배정</button>';
    } else if (status === 'QM_CHECKING' && qmNo === employeeNo) {
      actions = `<button type="button" class="primary" data-qm-browse-inspect="${escapeAttr(room.roomNo)}">점검 계속</button>`;
    } else if (['COMPLETED', 'QM_WAITING'].includes(status)) {
      actions = `<button type="button" class="primary" data-qm-browse-inspect="${escapeAttr(room.roomNo)}">점검 시작</button>`;
    }
    return `<article class="mobile-room-card qm-browse-inspection">
      <div class="mobile-card-top"><strong>${escapeHtml(room.roomNo)}</strong><span>${escapeHtml([room.building, room.floor ? `${room.floor}층` : ''].filter(Boolean).join(' · '))}</span></div>
      ${operationBadges ? `<div class="mobile-operation-badges">${operationBadges}</div>` : ''}
      <div class="mobile-room-status"><b>${escapeHtml(assignedNames)}</b><span>${escapeHtml(cleaningStatus || roomStatus)}</span></div>
      <div class="mobile-cleaning-type"><span>${escapeHtml(viewLabel)}</span>${qmName ? ` · QM ${escapeHtml(qmName)}` : ''}</div>
      ${actions ? `<div class="mobile-actions">${actions}</div>` : ''}
    </article>`;
  }

  function renderMobileSummary() { // (직무별 모바일 요약)
    const data = state.mobile.data;
    const summary = data?.summary || {};
    const role = data?.role;
    if (role === 'QM' && qmMobileBrowseView_() !== 'TARGETS') {
      const view = qmMobileBrowseView_();
      const browse = state.mobile.qmBrowseData;
      const key = qmMobileBrowseKey_(view);
      const count = browse?.key === key && Array.isArray(browse.rooms) ? browse.rooms.length : 0;
      const label = view === 'CLEANED' ? '당일 청소완료' : '공실';
      $('mobileSummary').innerHTML = `<div class="mobile-summary-card"><span>${escapeHtml(label)}</span><strong>${count}</strong></div>`;
      return;
    }
    if (role === 'HOUSEMAN' && $('mobileShiftInfo')) {
      const labels = (data.shift?.shifts || []).map(shift => `${shift.label} ${shift.start}~${shift.end}`);
      $('mobileShiftInfo').textContent = labels.length ? `내 근무조: ${labels.join(' · ')}` : '오늘 등록된 근무조가 없습니다.';
    }
    let cards = [];
    if (role === 'ROOMMAID') cards = [['전체', summary.total], ['대기', summary.waiting], ['청소중', summary.working], ['완료', summary.completed]];
    else if (role === 'QM') cards = [['전체', summary.total], ['점검대기', summary.waiting], ['점검중', summary.checking], ['재정비', summary.rework], ['완료', summary.completed]];
    else if (role === 'HOUSEMAN') cards = [['전체', summary.total], ['배정', summary.assigned], ['처리중', summary.working], ['완료', summary.completed]];
    else {
      const publicRooms = (data.rooms || []).filter(room =>
        (!state.mobile.building || room.building === state.mobile.building) &&
        (!state.mobile.floor || String(room.floor || '') === state.mobile.floor)
      );
      cards = [
        ['퇴실지연', publicRooms.filter(room => room.departureDelayed).length],
        ['퇴실예정', publicRooms.filter(room => room.roomStatus === 'DUE_OUT').length],
        ['퇴실', publicRooms.filter(room => room.roomStatus === 'CHECKED_OUT').length],
        ['투숙', publicRooms.filter(room => room.roomStatus === 'STAY').length]
      ];
    }
    $('mobileSummary').innerHTML = cards.map(([label, value]) => `<div class="mobile-summary-card"><span>${escapeHtml(label)}</span><strong>${Number(value || 0)}</strong></div>`).join('');
  }

  function renderMobileFilters() { // (직무별 모바일 필터)
    const role = state.mobile.data?.role;
    const filterPanel = $('mobileFilters');
    if (role === 'QM' && qmMobileBrowseView_() !== 'TARGETS') {
      if (filterPanel) { filterPanel.hidden = true; filterPanel.innerHTML = ''; }
      return;
    }
    if (filterPanel) filterPanel.hidden = false;
    const filters = role === 'PUBLIC'
      ? [['DELAYED', '퇴실지연'], ['DUE_OUT', '퇴실예정'], ['CHECKED_OUT', '퇴실'], ['ALL', '전체']]
      : role === 'HOUSEMAN'
        ? [['ACTIVE', '진행'], ['IMPORTANT', '중요·인계'], ['DONE', '완료'], ['ALL', '전체']]
        : [['ACTIVE', '진행'], ['DONE', '완료'], ['ALL', '전체']];
    if (!filters.some(item => item[0] === state.mobile.filter)) state.mobile.filter = filters[0][0];
    $('mobileFilters').innerHTML = filters.map(([code, label]) => `<button type="button" class="mobile-filter${state.mobile.filter === code ? ' active' : ''}" data-mobile-filter="${escapeAttr(code)}">${escapeHtml(label)}</button>`).join('');
    $('mobileFilters').querySelectorAll('[data-mobile-filter]').forEach(button => button.addEventListener('click', () => {
      state.mobile.filter = button.dataset.mobileFilter;
      saveMobileViewPreference_(); // MOBILE_VIEW_STATE_PERSIST_V2
      renderMobileFilters();
      renderMobileList();
    }));
  }

  function renderMobileList() { // (직무별 모바일 카드 목록)
    const data = state.mobile.data;
    const container = $('mobileList');
    if (!data || !container) return;
    const query = state.mobile.search.toLowerCase();
    if (data.role === 'QM' && qmMobileBrowseView_() !== 'TARGETS') {
      const view = qmMobileBrowseView_();
      const key = qmMobileBrowseKey_(view);
      const browse = state.mobile.qmBrowseData;
      if (!browse || browse.key !== key || !Array.isArray(browse.rooms)) {
        container.innerHTML = '<div class="mobile-loading">객실을 불러오고 있습니다.</div>';
        return;
      }
      const filtered = browse.rooms.filter(room => {
        if (state.mobile.qmBrowseBuilding && String(room.building || '') !== state.mobile.qmBrowseBuilding) return false;
        if (state.mobile.qmBrowseFloor && String(room.floor || '') !== state.mobile.qmBrowseFloor) return false;
        if (!query) return true;
        return [room.roomNo, room.building, room.floor ? `${room.floor}층` : '', room.roomStatus, room.cleaningStatus, room.roommaidName, room.secondaryRoommaidName, room.qmName]
          .join(' ').toLowerCase().includes(query);
      });
      const limit = Math.max(50, Number(state.mobile.qmBrowseLimit || 50));
      const visible = filtered.slice(0, limit);
      const remaining = Math.max(0, filtered.length - visible.length);
      container.innerHTML = visible.length
        ? visible.map(room => renderQmBrowseRoomCard_(room, view)).join('') + (remaining ? `<button type="button" class="secondary-button" data-qm-browse-more>더 보기 · ${remaining}실 남음</button>` : '')
        : '<div class="mobile-empty">표시할 객실이 없습니다.</div>';
      const moreButton = container.querySelector('[data-qm-browse-more]');
      if (moreButton) moreButton.addEventListener('click', () => {
        state.mobile.qmBrowseLimit = limit + 50;
        renderMobileList();
      });
      return;
    }
    if (data.role === 'HOUSEMAN') {
      const orders = (data.orders || []).filter(order => filterMobileOrder_(order, query));
      container.innerHTML = orders.length ? orders.map(renderMobileOrderCard_).join('') : '<div class="mobile-empty">표시할 오더가 없습니다.</div>';
      return;
    }
    const rooms = (data.rooms || []).filter(room => filterMobileRoom_(room, query, data.role));
    if (data.role === 'PUBLIC') {
      container.innerHTML = rooms.length ? renderPublicRoomGroups_(rooms) : '<div class="mobile-empty">선택한 동·층에 표시할 객실이 없습니다.</div>';
      return;
    }
    const orderedRooms = data.role === 'ROOMMAID' ? rooms.slice().sort(compareRoommaidAssignedRooms_) : rooms;
    container.innerHTML = orderedRooms.length ? orderedRooms.map(room => renderMobileRoomCard_(room, data.role)).join('') : '<div class="mobile-empty">표시할 객실이 없습니다.</div>';
  }

  function compareRoommaidAssignedRooms_(a, b) { // (룸메이드 배정객실 상태우선·객실번호순 정렬)
    const rankDiff = roommaidAssignedRoomRank_(a) - roommaidAssignedRoomRank_(b);
    if (rankDiff) return rankDiff;
    return String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' });
  }

  function roommaidAssignedRoomRank_(room) { // (청소중→선배정→대기→D/S→퇴실예정 순위)
    const cleaningStatus = String(room.cleaningStatus || '').trim().toUpperCase();
    const roomStatus = String(room.roomStatus || '').trim().toUpperCase();
    const cleaningType = String(room.cleaningType || '').trim().toUpperCase();

    if (cleaningStatus === 'CLEANING') return 0;
    if (roomStatus === 'DUE_OUT') return 4;
    if (cleaningStatus === 'ASSIGNED' && cleaningType !== 'DS') return 1;
    if (['WAITING', 'REWORK'].includes(cleaningStatus) && cleaningType !== 'DS') return 2;
    if (cleaningType === 'DS') return 3;
    if (roomStatus === 'CHECKED_OUT') return 2;
    return 5;
  }

  function renderPublicRoomGroups_(rooms) { // (객실퍼블릭 동·층별 객실 묶음)
    const groups = new Map();
    rooms.forEach(room => {
      const building = String(room.building || '').trim() || '동 미지정';
      const floor = String(room.floor || '').trim();
      const key = `${building}__${floor}`;
      if (!groups.has(key)) groups.set(key, { building, floor, rooms: [] });
      groups.get(key).rooms.push(room);
    });
    return [...groups.values()].map(group => {
      const floorLabel = group.floor ? `${group.floor}층` : '층 미지정';
      return `<section class="mobile-room-group">
        <header class="mobile-room-group-header"><strong>${escapeHtml(group.building)} · ${escapeHtml(floorLabel)}</strong><span>${group.rooms.length}실</span></header>
        <div class="mobile-room-group-list">${group.rooms.map(room => renderMobileRoomCard_(room, 'PUBLIC')).join('')}</div>
      </section>`;
    }).join('');
  }

  function filterMobileOrder_(order, query) { // (모바일 하우스맨 오더 필터)
    const done = ['COMPLETED', 'UNABLE'].includes(order.statusCode);
    if (state.mobile.filter === 'ACTIVE' && done) return false;
    if (state.mobile.filter === 'DONE' && !done) return false;
    if (state.mobile.filter === 'IMPORTANT' && !order.important && !order.handover) return false;
    if (!query) return true;
    return [order.roomNo, order.itemSummary, order.note, order.unableReason, order.assignedName, ...(order.routeCandidateNames || []), order.statusLabel].join(' ').toLowerCase().includes(query);
  }

  function filterMobileRoom_(room, query, role) { // (모바일 객실 필터) // MOBILE_LOCATION_FILTER_PERSIST_V1
    if (['PUBLIC', 'ROOMMAID', 'QM'].includes(String(role || '').toUpperCase())) {
      if (state.mobile.building && room.building !== state.mobile.building) return false;
      if (state.mobile.floor && String(room.floor || '') !== state.mobile.floor) return false;
    }
    if (role === 'PUBLIC') {
      if (state.mobile.filter === 'DELAYED' && !room.departureDelayed) return false;
      if (!['ALL', 'DELAYED'].includes(state.mobile.filter) && room.roomStatus !== state.mobile.filter) return false;
    } else {
      const doneStatuses = role === 'QM' ? ['QM_COMPLETED'] : ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'];
      const done = doneStatuses.includes(room.cleaningStatus);
      if (state.mobile.filter === 'ACTIVE' && done) return false;
      if (state.mobile.filter === 'DONE' && !done) return false;
    }
    if (!query) return true;
    return [room.roomNo, room.building, room.floor ? `${room.floor}층` : '', room.roomStatus, room.cleaningStatus, room.roommaidName, room.secondaryRoommaidName, room.qmName].join(' ').toLowerCase().includes(query);
  }

  function renderMobileOrderCard_(order) { // (하우스맨 공동 전달·접수고정 모바일 오더 카드)
    const employeeNo = state.bootstrap.user.employeeNo;
    const routeCandidates = Array.isArray(order.routeCandidateEmployeeNos) ? order.routeCandidateEmployeeNos : [];
    const sharedClaimable = order.statusCode === 'ASSIGNED' && order.routeLocked !== true && routeCandidates.includes(employeeNo);
    const mine = order.assignedEmployeeNo === employeeNo || sharedClaimable;
    const sharedRoute = order.statusCode === 'ASSIGNED' && order.routeLocked !== true
      && Array.isArray(order.routeCandidateNames) && order.routeCandidateNames.length > 1;
    const assigneeDisplay = sharedRoute ? `공동 전달 ${order.routeCandidateNames.join(' · ')}` : (order.assignedName || '미배정');
    let actions = '';
    if (!order.__pending) {
      if (mine && order.statusCode === 'ASSIGNED') actions = `<button data-order-action="ACCEPT" data-order-id="${escapeAttr(order.orderId)}">접수</button><button class="primary" data-order-action="ACCEPT_START" data-order-id="${escapeAttr(order.orderId)}">접수·바로 시작</button>`;
      else if (mine && order.statusCode === 'ACCEPTED') actions = `<button data-order-action="START" data-order-id="${escapeAttr(order.orderId)}">처리 시작</button>`;
      else if (mine && order.statusCode === 'PROCESSING') actions = `<button class="primary" data-order-action="COMPLETE" data-order-id="${escapeAttr(order.orderId)}">완료</button><button data-order-action="UNABLE" data-order-id="${escapeAttr(order.orderId)}">처리불가</button>`;
    }
    const unableReason = String(order.unableReason || '').trim();
    const registeredAtText = String(order.registeredAt || '').trim();
    const updatedAtText = String(order.updatedAt || '').trim();
    return `<article class="mobile-task-card houseman-card-v2 ${order.important ? 'important' : ''} ${mine ? 'mine' : 'shared'}" data-houseman-status="${escapeAttr(order.statusCode || '')}" data-mobile-order-id="${escapeAttr(order.orderId)}">
      <div class="mobile-card-top"><strong>${escapeHtml(order.roomNo || '공용')}</strong><span class="status-chip status-${escapeAttr(order.statusCode)}">${escapeHtml(order.statusLabel)}</span></div>
      <div class="mobile-task-title">${escapeHtml(order.itemSummary || '-')}</div>
      <div class="mobile-task-meta"><span>${escapeHtml(order.part || '-')}</span><span>${escapeHtml(assigneeDisplay)}</span></div>
      <div class="houseman-card-time"><span>등록 ${escapeHtml(registeredAtText.slice(5, 16) || '-')}</span>${updatedAtText && updatedAtText !== registeredAtText ? `<span>변경 ${escapeHtml(updatedAtText.slice(5, 16))}</span>` : ''}</div>
      ${order.note ? `<p>${escapeHtml(order.note)}</p>` : ''}
      ${order.statusCode === 'UNABLE' && unableReason ? `<div class="mobile-unable-reason"><strong>처리불가 사유</strong><span>${escapeHtml(unableReason)}</span></div>` : ''}
      <div class="mobile-badges">${sharedRoute ? `<span>공동접수 ${order.routeCandidateNames.length}명</span>` : ''}${order.important ? '<span>중요</span>' : ''}${order.handover ? `<span>인수인계 ${escapeHtml(order.handoverTargetShift || '')}조</span>` : ''}</div>
      ${actions ? `<div class="mobile-actions">${actions}</div>` : ''}
    </article>`;
  }

  function roommaidMobileCardClass_(room, role) { // (룸메이드 청소가능 객실카드 색상)
    if (role !== 'ROOMMAID' || room.roomStatus === 'DUE_OUT') return '';
    const cleaningReady = ['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus);
    if (!cleaningReady) return '';
    return room.cleaningType === 'DS' ? ' roommaid-ds-ready' : ' roommaid-waiting-ready';
  }

  function renderMobileRoomCard_(room, role) { // (룸메이드·QM·퍼블릭 모바일 객실 카드)
    const roomStatus = codeLabel_(state.mobile.data.codes?.roomStatuses, room.roomStatus);
    const cleaningStatus = codeLabel_(state.mobile.data.codes?.cleaningStatuses, room.cleaningStatus);
    const cleaningTypeLabel = room.cleaningType === 'DS' ? 'D/S' : '일반정비';
    const assignmentTypeLabel = room.assignmentType === 'PAIR_TRAINING' ? '2인1조(교육)' : room.assignmentType === 'PAIR' ? '2인1조' : '1인 배정';
    const assignedNames = [room.roommaidName, room.secondaryRoommaidName].filter(Boolean).join(' · ');
    const operationBadges = [
      room.preassigned ? '<span class="mobile-operation-badge preassigned">선배정</span>' : '',
      room.vip ? '<span class="mobile-operation-badge vip">VIP</span>' : '',
      room.importantRoom ? '<span class="mobile-operation-badge important">중요</span>' : '',
      normalizeIndicatorRoomOperationalStatus_(room.operationalStatus) === 'REWORK' ? '<span class="mobile-operation-badge important">재정비</span>' : ''
    ].filter(Boolean).join('');
    let actions = '';
    const mobileCleaningActive = role === 'ROOMMAID' && isCleaningActiveStatus_(room.cleaningStatus, state.mobile.data?.codes?.cleaningStatuses);
    const mobileRoomDueOut = role === 'ROOMMAID' && String(room.roomStatus || '').trim().toUpperCase() === 'DUE_OUT'; // ROOMMAID_DUE_OUT_START_GUARD_V2
    if (role === 'ROOMMAID') {
      if (!room.__pending) {
        if (['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus)) actions += `<button class="primary" data-room-action="START" data-room-no="${escapeAttr(room.roomNo)}"${mobileRoomDueOut ? ' disabled data-due-out-start-guard="Y" aria-disabled="true" title="퇴실 확인 후 청소를 시작할 수 있습니다."' : ''}>${room.cleaningType === 'DS' ? 'D/S 시작' : '청소 시작'}</button>`; // ROOMMAID_DUE_OUT_START_GUARD_V2
        if (mobileCleaningActive) actions += `<button class="primary" data-room-action="COMPLETE" data-room-no="${escapeAttr(room.roomNo)}">${room.cleaningType === 'DS' ? 'D/S 완료' : '청소 완료'}</button>`;
      }
      actions += `<button data-houseman-request="${escapeAttr(room.roomNo)}" data-houseman-request-menu="cleaning">하우스맨 요청</button>`;
    } else if (role === 'QM') {
      if (['QM_WAITING', 'COMPLETED'].includes(room.cleaningStatus)) actions += `<button class="primary" data-room-action="START" data-room-no="${escapeAttr(room.roomNo)}">점검 시작</button>`;
      if (room.cleaningStatus === 'QM_CHECKING' && normalizeIndicatorRoomOperationalStatus_(room.operationalStatus) !== 'REWORK') actions += `<button class="primary" data-room-action="CONTINUE" data-room-no="${escapeAttr(room.roomNo)}">점검 계속</button><button data-room-action="REWORK" data-room-no="${escapeAttr(room.roomNo)}">즉시 재정비</button>`;
      actions += `<button data-houseman-request="${escapeAttr(room.roomNo)}" data-houseman-request-menu="qm">하우스맨 요청</button>`;
    } else if (role === 'PUBLIC') { // PUBLIC_HOUSEMAN_REQUEST_V1
      actions += `<button data-houseman-request="${escapeAttr(room.roomNo)}" data-houseman-request-menu="public">하우스맨 요청</button>`;
    }
    // ROOMMAID_DUE_OUT_START_GUARD_V2 · 표시문구가 아니라 객실상태 코드로 가드합니다.
    return `<article class="mobile-room-card${roommaidMobileCardClass_(room, role)}${mobileCleaningActive ? ' mobile-card-cleaning' : ''}" data-room-status="${escapeAttr(String(room.roomStatus || '').trim().toUpperCase())}">
      <div class="mobile-card-top"><strong>${escapeHtml(room.roomNo)}</strong><span>${escapeHtml([room.building, room.floor ? `${room.floor}층` : ''].filter(Boolean).join(' · '))}</span></div>
      ${operationBadges ? `<div class="mobile-operation-badges">${operationBadges}</div>` : ''}
      <div class="mobile-room-status"><b>${escapeHtml(role === 'QM' ? (assignedNames || '-') : roomStatus)}</b><span>${escapeHtml(cleaningStatus)}</span></div>
      ${role === 'ROOMMAID' ? `<div class="mobile-cleaning-type ${room.cleaningType === 'DS' ? 'ds' : ''}">${escapeHtml(cleaningTypeLabel)} · ${escapeHtml(assignmentTypeLabel)}</div><div class="mobile-assigned-names">${escapeHtml(assignedNames)}</div>` : ''}
      ${role === 'PUBLIC' ? `<div class="mobile-public-result ${room.departureDelayed ? 'delayed' : room.roomStatus === 'CHECKED_OUT' ? 'checked-out' : ''}">${room.departureDelayed ? '퇴실지연' : room.roomStatus === 'CHECKED_OUT' ? '퇴실 확인' : room.roomStatus === 'DUE_OUT' ? '퇴실예정' : escapeHtml(roomStatus)}</div>` : ''}
      ${actions ? `<div class="mobile-actions">${actions}</div>` : ''}
    </article>`;
  }

  // QM_START_DB_FIRST_DIRECT_V1
  // 실제 Client IIFE 내부에서 실행되는 QM 추가조회 시작 경로입니다.
  // DB 상태확정은 Supabase RPC로 직접 처리하고 Sheet 이력 미러는 사용자 입력과 분리합니다.
  function novaQmSetStartPendingControls_(locked) {
    const modalRoot = $('modalRoot');
    if (!modalRoot) return;
    modalRoot.querySelectorAll(
      '.qm-checklist-modal [data-qm-photo-input], ' +
      '.qm-checklist-modal #qmInspectionSaveOnly, ' +
      '.qm-checklist-modal #qmChecklistSubmit, ' +
      '.qm-checklist-modal .qm-add-defect, ' +
      '.qm-checklist-modal [data-qm-photo-delete], ' +
      '.qm-checklist-modal [data-qm-remove-defect]'
    ).forEach(control => {
      control.disabled = Boolean(locked);
      if (locked) control.setAttribute('aria-disabled', 'true');
      else control.removeAttribute('aria-disabled');
    });
  }

  function novaQmMergePendingDraft_(serverDraft, localDraft) {
    const server = serverDraft || {};
    const local = localDraft || { answers: [], defects: [] };
    return Object.assign({}, server, local, {
      draftId: String(server.draftId || local.draftId || ''),
      rowNumber: Number(server.rowNumber || local.rowNumber || 0),
      businessDate: String(server.businessDate || local.businessDate || ''),
      site: String(server.site || local.site || ''),
      roomNo: String(server.roomNo || local.roomNo || ''),
      checklistRevision: String(server.checklistRevision || local.checklistRevision || ''),
      startedAt: String(server.startedAt || local.startedAt || ''),
      savedAt: String(server.savedAt || local.savedAt || ''),
      dbVersion: Number(server.dbVersion || local.dbVersion || 0)
    });
  }

  async function novaQmStartBrowseDbFirst_(room, view) {
    const normalizedView = String(view || '').trim().toUpperCase();
    if (!['TARGETS', 'CLEANED', 'VACANT'].includes(normalizedView)) return null; // QM_END_TO_END_ACCEL_V1
    if (!novaRealtimeIsEnabled_() || novaRealtime_.qmDraftDbFirstEnabled !== true) return null;

    let auth;
    try {
      auth = await novaQmDraftAuthBundle_();
    } catch (error) {
      // 인증 토큰 조회까지만 실패한 경우 DB 변경은 전혀 없으므로 기존 경로 fallback이 안전합니다.
      console.warn('[NOVA QM] DB-first 시작 인증 준비 실패 · 기존 경로 사용:', error?.message || error);
      return null;
    }
    if (!auth?.token || !auth?.supabaseUrl || !auth?.publishableKey) return null;

    const requestId = novaRealtimeRequestId_('QM_BEGIN_DB_FIRST', room?.roomNo || '');
    const body = {
      p_business_date: String(state.mobile.businessDate || state.bootstrap.app.businessDate || ''),
      p_site: String(room?.site || state.mobile.site || ''),
      p_room_no: String(room?.roomNo || ''),
      p_view: normalizedView,
      p_request_id: requestId
    };
    const startedAt = performance.now();

    const send = async attempt => {
      const endpoint = `${String(auth.supabaseUrl || '').replace(/\/+$/, '')}/rest/v1/rpc/nova_qm_begin_inspection_v1`;
      let response;
      try {
        response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': String(auth.publishableKey || ''),
            'Authorization': `Bearer ${String(auth.token || '')}`
          },
          body: JSON.stringify(body)
        });
      } catch (networkError) {
        // 요청 전송 뒤 결과만 유실됐을 수 있으므로 같은 requestId로만 재확인합니다.
        // 이 지점에서는 legacy 시작을 병행하지 않습니다.
        if (attempt < 2) {
          await novaRealtimeSleep_([140, 360, 800][attempt] || 800);
          return send(attempt + 1);
        }
        const error = new Error('QM 점검 시작 결과를 확인하지 못했습니다. 현재 객실상태를 다시 확인해 주세요.');
        error.code = 'QM_DB_RESULT_UNKNOWN';
        throw error;
      }

      let data = {};
      try { data = await response.json(); } catch (ignore) {}
      if (response.ok && data?.ok) return data;

      const code = String(data?.code || '').trim().toUpperCase();
      if (response.status === 401 && attempt < 2) {
        novaRealtime_.qmDraftAuthBundle = null;
        try { auth = await novaQmDraftAuthBundle_(); }
        catch (authError) {
          const error = new Error(authError?.message || 'QM DB 인증을 갱신하지 못했습니다.');
          error.code = 'QM_DB_AUTH_REFRESH_FAILED';
          throw error;
        }
        await novaRealtimeSleep_(160);
        return send(attempt + 1);
      }
      if ((response.status === 429 || response.status >= 500) && attempt < 2) {
        await novaRealtimeSleep_([140, 360, 800][attempt] || 800);
        return send(attempt + 1);
      }
      if (response.status === 404 || ['PGRST202', 'PGRST205'].includes(code)) {
        return { ok: false, legacyFallback: true, missingRpc: true };
      }

      const error = new Error(data?.message || data?.details || data?.hint || `QM DB 처리 오류 (${response.status})`);
      error.status = response.status;
      error.code = data?.code || '';
      throw error;
    };

    const result = await send(0);
    if (result?.legacyFallback) return result;
    if (result?.alreadyChecking === true && !result?.draft?.draftId) {
      // DB 전환 전부터 점검중인 기존 세션은 기존 Sheet 초안을 그대로 이어갑니다.
      return { ok: false, legacyFallback: true, existingSession: true };
    }
    if (!result?.draft?.draftId) throw new Error('QM 점검 초안을 준비하지 못했습니다.');

    return {
      ok: true,
      realtime: true,
      dbFirst: true,
      version: Number(result.version || result.room?.version || 0),
      room: Object.assign({}, result.room || {}, {
        rowNumber: Number(room?.rowNumber || 0),
        businessDate: String(state.mobile.businessDate || result.room?.businessDate || ''),
        site: String(result.room?.site || room?.site || state.mobile.site || ''),
        roomNo: String(result.room?.roomNo || room?.roomNo || ''),
        cleaningStatus: 'QM_CHECKING'
      }),
      draft: Object.assign({ answers: [], defects: [] }, result.draft || {}),
      checklist: null,
      requestId,
      alreadyChecking: Boolean(result.alreadyChecking),
      timing: { qmDbFirstClientMs: Math.round(performance.now() - startedAt) }
    };
  }

  function novaQmEnsureDbFirstMirror_(active) {
    if (!active?.dbFirst || !active?.draft?.draftId) return Promise.resolve(null);
    if (active.sheetMirrorReady) return Promise.resolve(active.sheetMirrorResult || null);
    if (active.sheetMirrorPromise) return active.sheetMirrorPromise;

    const task = (async () => {
      const delays = [0, 350, 900, 2200];
      let lastError = null;
      for (const delay of delays) {
        if (delay) await novaRealtimeSleep_(delay);
        try {
          const result = await callServer('ensureQmDbFirstDraftSheetMirror', state.token, {
            businessDate: active.draft.businessDate || state.mobile.businessDate,
            site: active.draft.site || state.mobile.site,
            roomNo: active.roomNo,
            rowNumber: Number(active.draft.rowNumber || 0),
            draftId: active.draft.draftId,
            draft: active.draft
          });
          if (result?.ok) {
            active.sheetMirrorReady = true;
            active.sheetMirrorResult = result;
            active.sheetExpectedVersion = Number(result.room?.sheetVersion || active.sheetExpectedVersion || 0);
            active.checklist = result.checklist || active.checklist;
            if (result.draft?.rowNumber) active.draft.rowNumber = Number(result.draft.rowNumber || 0);
            return result;
          }
          lastError = new Error(result?.message || 'QM 기존 이력 동기화 실패');
        } catch (error) {
          lastError = error;
        }
      }
      throw lastError || new Error('QM 기존 이력 동기화를 완료하지 못했습니다.');
    })();

    const tracked = task.finally(() => {
      if (active.sheetMirrorPromise === tracked) active.sheetMirrorPromise = null;
    });
    active.sheetMirrorPromise = tracked;
    return tracked;
  }

  async function startQmBrowseInspection_(roomNo, button) { // (QM 추가탭 체크리스트 즉시노출 v1)
    const view = qmMobileBrowseView_();
    const key = qmMobileBrowseKey_(view);
    const browse = state.mobile.qmBrowseData;
    const room = browse?.key === key && Array.isArray(browse.rooms)
      ? browse.rooms.find(item => String(item.roomNo || '') === String(roomNo || ''))
      : null;
    if (!room) {
      showToast('점검할 객실을 다시 불러와 주세요.');
      return;
    }

    const checklist = state.mobile.data?.qmChecklist || {};
    if (!(checklist.items || []).length && !(checklist.groups || []).length) {
      showToast('QM 체크리스트를 먼저 불러와 주세요.');
      return;
    }

    const originalText = button?.textContent || '';
    if (button) {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      button.textContent = '시작 중…';
    }

    // 서버 왕복 전에 체크리스트를 먼저 보여주고 결과선택·메모 입력은 즉시 허용합니다.
    // 사진·저장·완료처럼 서버 확정이 필요한 작업만 시작확정/이력미러 완료 전까지 잠급니다.
    const previewActive = {
      roomNo: String(room.roomNo || ''),
      checklist,
      draft: { answers: [], defects: [], startedAt: '', savedAt: '' },
      roomVersion: Number(room.version || 0),
      sheetExpectedVersion: 0,
      localDirty: false,
      realtime: true,
      initPromise: null,
      startPending: true
    };
    state.qmChecklist.activeInspection = previewActive;
    openQmInspectionModal_();
    novaQmSetStartPendingControls_(true);
    const pendingStatus = $('qmDraftSaveStatus');
    if (pendingStatus) pendingStatus.textContent = '점검 시작 처리 중 · 체크는 바로 가능합니다.';

    state.mobile.actionInFlight = Number(state.mobile.actionInFlight || 0) + 1;
    try {
      const startPayload = {
        businessDate: state.mobile.businessDate || state.bootstrap.app.businessDate,
        site: room.site || state.mobile.site,
        roomNo: room.roomNo,
        rowNumber: Number(room.rowNumber || 0),
        view
      };
      const directResult = await novaQmStartBrowseDbFirst_(room, view);
      const result = directResult?.legacyFallback
        ? await callServer('startQmMobileBrowseInspection', state.token, startPayload)
        : (directResult || await callServer('startQmMobileBrowseInspection', state.token, startPayload));
      if (!result?.ok) throw new Error(result?.message || 'QM 점검을 시작하지 못했습니다.');

      // 확인 중 입력한 결과/메모를 서버 응답으로 덮어쓰지 않습니다.
      const pendingDraft = collectQmInspectionForm_() || previewActive.draft;
      const hadLocalInput = Boolean(previewActive.localDirty);
      const confirmedChecklist = result.checklist || checklist;
      if (!(confirmedChecklist.items || []).length && !(confirmedChecklist.groups || []).length) {
        throw new Error('QM 체크리스트를 불러오지 못했습니다.');
      }

      const confirmed = Object.assign({}, room, result.room || {}, {
        rowNumber: Number(result.room?.rowNumber || room.rowNumber || 0),
        businessDate: state.mobile.businessDate || room.businessDate,
        site: String(result.room?.site || room.site || state.mobile.site || ''),
        roomNo: String(room.roomNo || ''),
        qmEmployeeNo: String(state.bootstrap?.user?.employeeNo || ''),
        qmName: String(state.bootstrap?.user?.name || ''),
        cleaningStatus: 'QM_CHECKING',
        version: Number(result.room?.version || result.version || 0)
      });
      const targetRooms = state.mobile.data.rooms || (state.mobile.data.rooms = []);
      const existingIndex = targetRooms.findIndex(item => String(item.site || '') === confirmed.site && String(item.roomNo || '') === confirmed.roomNo);
      if (existingIndex >= 0) targetRooms[existingIndex] = Object.assign({}, targetRooms[existingIndex], confirmed);
      else targetRooms.push(confirmed);
      state.mobile.data.qmChecklist = confirmedChecklist;

      Object.assign(previewActive, {
        checklist: confirmedChecklist,
        draft: hadLocalInput
          ? novaQmMergePendingDraft_(result.draft || {}, pendingDraft)
          : (result.draft || pendingDraft),
        roomVersion: Number(confirmed.version || result.version || 0),
        sheetExpectedVersion: 0,
        localDirty: hadLocalInput,
        realtime: true,
        dbFirst: result.dbFirst === true,
        sheetMirrorReady: result.dbFirst === true ? false : true,
        sheetMirrorResult: null,
        sheetMirrorPromise: null,
        startPending: false
      });

      // 시작 확정 후 기존 점검대상 흐름으로 복귀시켜 제출/재정비/완료를 그대로 사용합니다.
      state.mobile.qmView = 'TARGETS';
      saveMobileViewPreference_(); // MOBILE_VIEW_STATE_PERSIST_V2
      state.mobile.qmBrowseData = null;
      state.mobile.qmBrowseBuilding = '';
      state.mobile.qmBrowseFloor = '';
      state.mobile.qmBrowseLimit = 50;
      renderQmBrowseTabs_();
      renderQmBrowseLocationFilters_();
      renderMobileSummary();
      renderMobileFilters();
      renderMobileList();

      // 모달이 열려 있으면 입력값을 보존한 확정상태로 다시 렌더합니다.
      const modalStillOpen = Boolean($('modalRoot') && !$('modalRoot').classList.contains('hidden') && $('qmChecklistInspectionItems'));
      if (state.qmChecklist.activeInspection === previewActive && modalStillOpen) {
        openQmInspectionModal_();
      }
      const dbMs = Number(result?.timing?.qmDbFirstClientMs || 0);
      setSyncStatus(`${confirmed.roomNo}호 QM 점검 시작${dbMs ? ` · DB ${dbMs}ms` : ''}`);

      if (!previewActive.draft?.draftId) {
        void beginQmInspectionDraftInit_(previewActive).catch(error => {
          console.error('[NOVA QM] 추가탭 체크리스트 background 준비 실패:', error);
          if (state.qmChecklist.activeInspection === previewActive) {
            const status = $('qmDraftSaveStatus');
            if (status) status.textContent = `저장 준비 오류 · ${error?.message || ''}`;
            showToast('점검은 시작됐지만 체크리스트 저장준비가 지연되고 있습니다. 저장 시 자동 재시도합니다.');
          }
        });
      }
      void loadMobileSnapshot({ silent: true, force: true }).catch(error => console.warn('[NOVA QM] 추가탭 점검시작 후 화면갱신 실패:', error));
    } catch (error) {
      if (state.qmChecklist.activeInspection === previewActive) state.qmChecklist.activeInspection = null;
      const modalOpen = Boolean($('modalRoot') && !$('modalRoot').classList.contains('hidden'));
      if (modalOpen) closeModal();
      showToast(error?.message || 'QM 점검 시작 오류');
    } finally {
      state.mobile.actionInFlight = Math.max(0, Number(state.mobile.actionInFlight || 1) - 1);
      if (button && button.isConnected) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.textContent = originalText || '점검 시작';
      }
    }
  }

  async function handleMobileListClick(event) { // (모바일 카드 작업 처리)
    const qmBrowseButton = event.target.closest('[data-qm-browse-inspect]');
    if (qmBrowseButton) return startQmBrowseInspection_(qmBrowseButton.dataset.qmBrowseInspect, qmBrowseButton);
    const orderButton = event.target.closest('[data-order-action]');
    if (orderButton) {
      const action = orderButton.dataset.orderAction;
      const payload = { action, orderId: orderButton.dataset.orderId };
      if (action === 'UNABLE') return openMobileUnableModal_(payload.orderId);
      return runMobileAction_('updateHousemanOrder', payload, orderButton);
    }
    const roomButton = event.target.closest('[data-room-action]');
    if (roomButton) {
      const action = roomButton.dataset.roomAction;
      const roomNo = roomButton.dataset.roomNo;
      if (action === 'REWORK') return openMobileReworkModal_(roomNo);
      if (state.mobile.data?.role === 'QM' && ['START', 'CONTINUE', 'COMPLETE'].includes(action)) return startQmInspection_(roomNo, roomButton);
      return runMobileAction_('updateMobileRoomOperation', {
        businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo, action
      }, roomButton);
    }
    const requestButton = event.target.closest('[data-houseman-request]');
    if (requestButton) openMobileHousemanRequest_(requestButton.dataset.housemanRequest);
  }

  async function runMobileAction_(method, payload, button) { // (모바일 작업 무로딩 즉시반영·서버 단건 확정)
    const safePayload = Object.assign({}, payload || {});
    if (method === 'updateMobileRoomOperation') {
      const room = (state.mobile.data?.rooms || []).find(item => item.roomNo === safePayload.roomNo);
      const mobileRoomAction = String(safePayload.action || '').trim().toUpperCase();
      const mobileRoomRole = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
      if (mobileRoomRole === 'ROOMMAID' && mobileRoomAction === 'START'
          && String(room?.roomStatus || '').trim().toUpperCase() === 'DUE_OUT') { // ROOMMAID_DUE_OUT_START_GUARD_V2
        if (button) {
          button.disabled = true;
          button.dataset.dueOutStartGuard = 'Y';
          button.setAttribute('aria-disabled', 'true');
          button.setAttribute('title', '퇴실 확인 후 청소를 시작할 수 있습니다.');
        }
        showToast('퇴실예정 객실은 퇴실 전환 후 청소를 시작할 수 있습니다.');
        return;
      }
      const roommaidCleaningAction = mobileRoomRole === 'ROOMMAID'
        && ['START', 'COMPLETE'].includes(mobileRoomAction);
      // 룸메이드 청소시작/완료는 서버가 실제 배정자와 현재 청소상태를 잠금 상태에서 다시 검증한다.
      // DB 이벤트 미러/정방향 동기화 사이에 version 값만 달라지는 경우가 있으므로
      // 이 두 작업은 stale version 때문에 정상 작업이 거절되지 않도록 상태·권한 검증을 원본으로 사용한다.
      if (roommaidCleaningAction) safePayload.expectedVersion = 0;
      else if (!safePayload.expectedVersion) safePayload.expectedVersion = Number(room?.version || 0);
      if (!safePayload.rowNumber) safePayload.rowNumber = Number(room?.rowNumber || 0);
      if (!Object.prototype.hasOwnProperty.call(safePayload, 'qmEmployeeNo')) {
        safePayload.qmEmployeeNo = String(room?.qmEmployeeNo || '');
      }
    }
    if (method === 'updateHousemanOrder') {
      const order = (state.mobile.data?.orders || []).find(item => item.orderId === safePayload.orderId);
      if (!safePayload.expectedVersion) safePayload.expectedVersion = Number(order?.version || 0);
      if (!safePayload.rowNumber) safePayload.rowNumber = Number(order?.rowNumber || 0);
    }

    const previousY = window.scrollY;
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase(); // ROOM_STATE_SYNC_HARDENING_V1
    const action = String(safePayload.action || '').trim().toUpperCase();
    const housemanFastPath = method === 'updateHousemanOrder' && role === 'HOUSEMAN'
      && ['ACCEPT', 'ACCEPT_START', 'START', 'COMPLETE', 'UNABLE'].includes(action);
    const roommaidFastPath = method === 'updateMobileRoomOperation' && role === 'ROOMMAID'
      && ['START', 'COMPLETE'].includes(action);
    const qmReworkFastPath = method === 'updateMobileRoomOperation' && role === 'QM' && action === 'REWORK'; // QM_END_TO_END_ACCEL_V1
    const housemanRollback = housemanFastPath ? applyOptimisticHousemanOrder_(safePayload) : null;
    const roommaidRollback = roommaidFastPath ? applyOptimisticRoommaidRoom_(safePayload) : null;

    state.mobile.actionInFlight = Number(state.mobile.actionInFlight || 0) + 1;
    if (button) {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      if (!housemanFastPath && !roommaidFastPath) {
        button.dataset.originalText = button.textContent;
        button.textContent = '반영 중…';
      }
    }

    try {
      const result = await saveRoomActionRealtimeOrLegacy_(method, safePayload);
      if (!result?.ok) throw new Error(result?.message || '처리하지 못했습니다.');
      state.mobile.version = Number(result.version || state.mobile.version);

      if (housemanFastPath && result.order) {
        upsertMobileHousemanOrderLocal_(result.order);
        refreshHousemanMobileSummaryLocal_();
        renderMobileSummary();
        patchMobileHousemanOrderCard_(result.order);
        setSyncStatus(`하우스맨 즉시 반영 · ${result.order.updatedAt || ''}`);
      } else if (roommaidFastPath && result.room) {
        upsertMobileRoommaidRoomLocal_(result.room);
        refreshRoommaidMobileSummaryLocal_();
        renderMobileSummary();
        renderMobileList();
        setSyncStatus(`룸메이드 즉시 저장 · ${result.room.updatedAt || ''}`);
      } else if (qmReworkFastPath && result.room) {
        applyQmRealtimeRoomLocal_(safePayload.roomNo, result.room);
        setSyncStatus(`${safePayload.roomNo}호 재정비 요청 저장`);
      } else {
        await loadMobileSnapshot({ silent: true, force: true });
      }

      showToast(result.message || (housemanFastPath ? housemanActionMessage_(action) : roommaidActionMessage_(action)));
      requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
    } catch (error) {
      if (housemanRollback) restoreOptimisticHousemanOrder_(housemanRollback);
      if (roommaidRollback) restoreOptimisticRoommaidRoom_(roommaidRollback);
      showToast(error?.message || '처리 오류');
    } finally {
      state.mobile.actionInFlight = Math.max(0, Number(state.mobile.actionInFlight || 1) - 1);
      if (button && button.isConnected) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        if (button.dataset.originalText) button.textContent = button.dataset.originalText;
      }
      // ROOM_STATE_SYNC_HARDENING_V1 · 응답 유실/타임아웃으로 로컬을 복원했더라도 실제 DB가 성공했을 수 있습니다.
      // actionInFlight를 먼저 해제한 뒤 본인 배정목록을 즉시 재조회해 최종 DB 상태로 수렴시킵니다.
      if (roommaidFastPath && !document.hidden) {
        window.setTimeout(() => { void syncMobileDelta(); }, 80);
      }
    }
  }

  function applyOptimisticHousemanOrder_(payload) { // (하우스맨 버튼 선택 즉시 화면 선반영)
    const orders = state.mobile.data?.orders || [];
    const index = orders.findIndex(order => order.orderId === payload.orderId);
    if (index < 0) return null;
    const before = Object.assign({}, orders[index]);
    const action = String(payload.action || '').trim().toUpperCase();
    const statusByAction = { ACCEPT: 'ACCEPTED', ACCEPT_START: 'PROCESSING', START: 'PROCESSING', COMPLETE: 'COMPLETED', UNABLE: 'UNABLE' };
    const statusCode = statusByAction[action];
    if (!statusCode) return null;
    orders[index] = Object.assign({}, before, {
      statusCode,
      statusLabel: codeLabel_(state.mobile.data?.codes?.orderStatuses, statusCode),
      assignedEmployeeNo: ['ACCEPT', 'ACCEPT_START'].includes(action) ? state.bootstrap.user.employeeNo : before.assignedEmployeeNo,
      assignedName: ['ACCEPT', 'ACCEPT_START'].includes(action) ? state.bootstrap.user.name : before.assignedName,
      routeLocked: ['ACCEPT', 'ACCEPT_START'].includes(action) ? true : before.routeLocked,
      processorEmployeeNo: state.bootstrap.user.employeeNo,
      processorName: state.bootstrap.user.name,
      unableReason: action === 'UNABLE' ? String(payload.reason || '').trim() : (action === 'COMPLETE' ? '' : before.unableReason),
      __pending: true
    });
    sortMobileHousemanOrdersLocal_();
    refreshHousemanMobileSummaryLocal_();
    renderMobileSummary();
    patchMobileHousemanOrderCard_(orders[index]);
    setSyncStatus(`하우스맨 ${housemanActionMessage_(action)} 즉시 반영`);
    return { orderId: before.orderId, before };
  }

  function restoreOptimisticHousemanOrder_(rollback) { // (서버 오류 시 선반영 원상복구)
    if (!rollback?.before || !state.mobile.data?.orders) return;
    const index = state.mobile.data.orders.findIndex(order => order.orderId === rollback.orderId);
    if (index >= 0) state.mobile.data.orders[index] = rollback.before;
    else state.mobile.data.orders.push(rollback.before);
    sortMobileHousemanOrdersLocal_();
    refreshHousemanMobileSummaryLocal_();
    renderMobileSummary();
    patchMobileHousemanOrderCard_(rollback.before);
    setSyncStatus('하우스맨 반영 실패 · 기존 상태로 복원');
  }

  function patchMobileHousemanOrderCard_(order) { // (하우스맨 변경 오더 카드만 교체·필터순서 유지)
    const container = $('mobileList');
    if (!container || !order || state.mobile.data?.role !== 'HOUSEMAN') return false;
    const orderId = String(order.orderId || '').trim();
    if (!orderId) return false;

    const query = String(state.mobile.search || '').toLowerCase();
    const visibleOrders = (state.mobile.data?.orders || []).filter(item => filterMobileOrder_(item, query));
    const visibleIndex = visibleOrders.findIndex(item => item.orderId === orderId);
    const existing = container.querySelector(`[data-mobile-order-id="${cssEscape_(orderId)}"]`);

    if (visibleIndex < 0) {
      if (existing) existing.remove();
      if (!container.querySelector('[data-mobile-order-id]')) container.innerHTML = '<div class="mobile-empty">표시할 오더가 없습니다.</div>';
      return true;
    }

    const template = document.createElement('template');
    template.innerHTML = renderMobileOrderCard_(visibleOrders[visibleIndex]).trim();
    const nextCard = template.content.firstElementChild;
    if (!nextCard) return false;

    const empty = container.querySelector('.mobile-empty');
    if (empty) empty.remove();
    if (existing) existing.replaceWith(nextCard);

    const previousOrder = visibleOrders[visibleIndex - 1] || null;
    const nextOrder = visibleOrders[visibleIndex + 1] || null;
    const previousCard = previousOrder
      ? container.querySelector(`[data-mobile-order-id="${cssEscape_(previousOrder.orderId)}"]`)
      : null;
    const followingCard = nextOrder
      ? container.querySelector(`[data-mobile-order-id="${cssEscape_(nextOrder.orderId)}"]`)
      : null;

    if (previousCard) previousCard.after(nextCard);
    else if (followingCard) container.insertBefore(nextCard, followingCard);
    else if (!nextCard.isConnected) container.appendChild(nextCard);
    return true;
  }

  function upsertMobileHousemanOrderLocal_(order) { // (서버 확정 오더만 로컬 교체)
    if (!state.mobile.data) return;
    const orders = state.mobile.data.orders || (state.mobile.data.orders = []);
    const index = orders.findIndex(item => item.orderId === order.orderId);
    const confirmed = Object.assign({}, order);
    delete confirmed.__pending;
    if (index >= 0) orders[index] = confirmed;
    else orders.push(confirmed);
    sortMobileHousemanOrdersLocal_();
  }

  function applyOptimisticRoommaidRoom_(payload) { // (룸메이드 청소버튼 선택 즉시 객실카드 선반영)
    const rooms = state.mobile.data?.rooms || [];
    const index = rooms.findIndex(room => room.roomNo === payload.roomNo);
    if (index < 0) return null;
    const before = Object.assign({}, rooms[index]);
    const action = String(payload.action || '').trim().toUpperCase();
    const patch = { __pending: true, __pendingAction: action === 'START' ? 'CLEANING_START' : action === 'COMPLETE' ? 'CLEANING_COMPLETE' : '' }; // ROOM_STATE_SYNC_HARDENING_V1
    if (action === 'START') {
      patch.cleaningStatus = 'CLEANING';
    } else if (action === 'COMPLETE') {
      patch.cleaningStatus = before.qmEmployeeNo ? 'QM_WAITING' : 'COMPLETED';
      // 모바일 선반영에서도 객실상태를 공실로 바꾸지 않는다.
    } else {
      return null;
    }
    rooms[index] = Object.assign({}, before, patch);
    refreshRoommaidMobileSummaryLocal_();
    renderMobileSummary();
    renderMobileList();
    setSyncStatus(`룸메이드 ${roommaidActionMessage_(action)} 즉시 반영`);
    return { roomNo: before.roomNo, before };
  }

  function restoreOptimisticRoommaidRoom_(rollback) { // (룸메이드 저장 실패 시 객실카드 원상복구)
    if (!rollback?.before || !state.mobile.data?.rooms) return;
    const index = state.mobile.data.rooms.findIndex(room => room.roomNo === rollback.roomNo);
    if (index >= 0) state.mobile.data.rooms[index] = rollback.before;
    else state.mobile.data.rooms.push(rollback.before);
    refreshRoommaidMobileSummaryLocal_();
    renderMobileSummary();
    renderMobileList();
    setSyncStatus('룸메이드 반영 실패 · 기존 상태로 복원');
  }

  function upsertMobileRoommaidRoomLocal_(room) { // (서버 확정 객실 1건만 로컬 교체)
    if (!state.mobile.data) return;
    const rooms = state.mobile.data.rooms || (state.mobile.data.rooms = []);
    const index = rooms.findIndex(item => item.roomNo === room.roomNo);
    const confirmed = Object.assign({}, room);
    delete confirmed.__pending;
    delete confirmed.__pendingAction; // ROOM_STATE_SYNC_HARDENING_V1
    if (index >= 0) rooms[index] = confirmed;
    else rooms.push(confirmed);
  }

  function refreshRoommaidMobileSummaryLocal_() { // (전체 재조회 없이 룸메이드 요약 즉시 계산)
    if (state.mobile.data?.role !== 'ROOMMAID') return;
    const rooms = state.mobile.data.rooms || [];
    state.mobile.data.summary = {
      total: rooms.length,
      waiting: rooms.filter(room => ['ASSIGNED', 'WAITING', 'REWORK'].includes(room.cleaningStatus)).length,
      working: rooms.filter(room => room.cleaningStatus === 'CLEANING').length,
      completed: rooms.filter(room => ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'].includes(room.cleaningStatus)).length
    };
  }

  function roommaidActionMessage_(action) { // (룸메이드 모바일 즉시반영 안내문)
    const messages = { START: '청소를 시작했습니다.', COMPLETE: '청소를 완료했습니다.' };
    return messages[String(action || '').trim().toUpperCase()] || '처리했습니다.';
  }

  function sortMobileHousemanOrdersLocal_() { // (서버와 동일한 하우스맨 카드 우선순위)
    const orders = state.mobile.data?.orders || [];
    orders.sort((a, b) => {
      const aDone = ['COMPLETED', 'UNABLE'].includes(a.statusCode) ? 1 : 0;
      const bDone = ['COMPLETED', 'UNABLE'].includes(b.statusCode) ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone;
      if (Boolean(a.important) !== Boolean(b.important)) return a.important ? -1 : 1;
      if (Boolean(a.handover) !== Boolean(b.handover)) return a.handover ? -1 : 1;
      return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
    });
  }

  function refreshHousemanMobileSummaryLocal_() { // (전체 재조회 없이 하우스맨 요약 즉시 계산)
    if (state.mobile.data?.role !== 'HOUSEMAN') return;
    const orders = state.mobile.data.orders || [];
    const employeeNo = state.bootstrap.user.employeeNo;
    state.mobile.data.summary = {
      total: orders.length,
      assigned: orders.filter(order => order.statusCode === 'ASSIGNED' && (
        order.assignedEmployeeNo === employeeNo || (
          order.routeLocked !== true
          && Array.isArray(order.routeCandidateEmployeeNos)
          && order.routeCandidateEmployeeNos.includes(employeeNo)
        )
      )).length,
      working: orders.filter(order => ['ACCEPTED', 'PROCESSING'].includes(order.statusCode)).length,
      completed: orders.filter(order => ['COMPLETED', 'UNABLE'].includes(order.statusCode)).length
    };
  }

  function housemanActionMessage_(action) { // (하우스맨 모바일 즉시반영 안내문)
    const messages = { ACCEPT: '접수했습니다.', ACCEPT_START: '접수 후 처리를 시작했습니다.', START: '처리를 시작했습니다.', COMPLETE: '완료 처리했습니다.', UNABLE: '처리불가로 반영했습니다.' };
    return messages[String(action || '').trim().toUpperCase()] || '처리했습니다.';
  }

  function openMobileUnableModal_(orderId) { // (하우스맨 처리불가 사유 입력)
    openModal(`<div class="modal-card"><div class="modal-header"><h2>처리불가</h2><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><label class="modal-field"><span>처리불가 사유</span><textarea id="mobileUnableReason" placeholder="사유를 입력하세요."></textarea></label><div class="modal-actions"><button id="mobileUnableSubmit" class="action-button danger" type="button">처리불가 완료</button></div></div></div>`);

      if (!reason) return showToast('처리불가 사유를 입력하세요.');

  function openMobileReworkModal_(roomNo) { // (QM 재정비 사유 입력)
    openModal(`<div class="modal-card"><div class="modal-header"><h2>${escapeHtml(roomNo)} 재정비 요청</h2><button class="modal-close" data-close-modal>×</button></div><div class="modal-body"><label class="modal-field"><span>재정비 사유</span><textarea id="mobileReworkReason" placeholder="확인된 내용을 입력하세요."></textarea></label><div class="modal-actions"><button id="mobileReworkSubmit" class="action-button danger" type="button">재정비 요청</button></div></div></div>`);
    $('mobileReworkSubmit').addEventListener('click', async event => {
      const reason = $('mobileReworkReason').value.trim();
      if (!reason) return showToast('재정비 사유를 입력하세요.');
