        businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo, action: 'REWORK', reason
      }, event.currentTarget);
    });
  }

  async function mirrorRoommaidHousemanRequestToSheet_(mirrorPayload, attempt = 0) { // (Realtime 오더 기존 이력·Telegram 백그라운드 보존)
    try {
      const result = await callServer('createMobileHousemanRequest', state.token, mirrorPayload);
      if (!result?.ok) throw new Error(result?.message || '하우스맨 요청 이력 동기화에 실패했습니다.');
      return result;
    } catch (error) {
      if (attempt < 3) {
        await novaRealtimeSleep_([600, 1600, 3600, 7000][attempt] || 7000);
        return mirrorRoommaidHousemanRequestToSheet_(mirrorPayload, attempt + 1);
      }
      console.error('[NOVA Realtime] 룸메이드 하우스맨 오더 Sheet 미러 실패:', error);
      setSyncStatus('하우스맨 요청 DB 등록완료 · 기존 이력 동기화 재확인 필요');
      throw error;
    }
  }

  let novaPublicHousemanAssignmentPrefetch_ = null; // PUBLIC_HOUSEMAN_REQUEST_FAST_V2

  function publicHousemanAssignmentContext_(payload) { // (객실퍼블릭 담당동 사전조회 키)
    const selection = state.mobile.data?.selection || {};
    const roomNo = String(payload?.roomNo || '').trim();
    const businessDate = String(payload?.businessDate || selection.businessDate || '').trim();
    const site = String(payload?.site || selection.site || '').trim();
    const building = roomNo ? roomNo.charAt(0) : '';
    return { businessDate, site, roomNo, key: `${businessDate}|${site}|${building}` };
  }

  function getPublicHousemanAssignmentFast_(payload) { // (모달 사전조회 결과 재사용)
    const context = publicHousemanAssignmentContext_(payload);
    if (!context.businessDate || !context.site || !context.roomNo) {
      return Promise.reject(new Error('자동배정 확인에 업무일자·사업장·객실번호가 필요합니다.'));
    }
    const now = Date.now();
    if (novaPublicHousemanAssignmentPrefetch_
      && novaPublicHousemanAssignmentPrefetch_.key === context.key
      && now - novaPublicHousemanAssignmentPrefetch_.startedAt <= 30000
      && novaPublicHousemanAssignmentPrefetch_.promise) {
      return novaPublicHousemanAssignmentPrefetch_.promise;
    }

    const request = callServer('getMobilePublicHousemanAutoAssignment', state.token, {
      businessDate: context.businessDate,
      site: context.site,
      roomNo: context.roomNo
    }).then(result => {
      const assignment = result?.assignment || null;
      if (!assignment?.employeeNo) throw new Error('해당 동에 자동배정 가능한 하우스맨이 없습니다.');
      return assignment;
    });

    novaPublicHousemanAssignmentPrefetch_ = {
      key: context.key,
      startedAt: now,
      promise: request
    };
    request.catch(() => {
      if (novaPublicHousemanAssignmentPrefetch_?.promise === request) novaPublicHousemanAssignmentPrefetch_ = null;
    });
    return request;
  }

  function prefetchPublicHousemanAssignment_(roomNo) { // (요청창 진입 즉시 담당동 조회 시작)
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (role !== 'PUBLIC') return;
    const selection = state.mobile.data?.selection || {};
    void getPublicHousemanAssignmentFast_({
      businessDate: selection.businessDate,
      site: selection.site,
      roomNo
    }).catch(() => null);
  }

  async function createRoommaidHousemanRequestFast_(payload) { // (ROOMMAID·QM·PUBLIC 하우스맨 요청 PostgreSQL 선확정·Sheet 후행) // QM_HOUSEMAN_REQUEST_PARITY_V1 · PUBLIC_HOUSEMAN_REQUEST_V1
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!['ROOMMAID', 'QM', 'PUBLIC'].includes(role)) {
      const legacy = await callServer('createMobileHousemanRequest', state.token, payload);
      return Object.assign({}, legacy || {}, { realtime: false, mirrorPromise: Promise.resolve(legacy) });
    }

    if (!novaRealtime_.configLoaded) await initNovaRealtime_();
    if (!novaRealtimeIsEnabled_()) {
      const legacy = await callServer('createMobileHousemanRequest', state.token, payload);
      return Object.assign({}, legacy || {}, { realtime: false, mirrorPromise: Promise.resolve(legacy) });
    }

    let publicAssignment = null; // PUBLIC_HOUSEMAN_REQUEST_V1
    if (role === 'PUBLIC') {
      publicAssignment = await getPublicHousemanAssignmentFast_(payload); // PUBLIC_HOUSEMAN_REQUEST_FAST_V2
    }
    const realtimePayload = Object.assign({}, payload || {}, {
      assignmentMode: role === 'PUBLIC' ? 'AUTO' : 'UNASSIGNED',
      assignedEmployeeNo: '',
      realtimeAssignmentSnapshot: publicAssignment,
      requester: state.bootstrap?.user?.name || '',
      handover: false
    });
    let realtime;
    try {
      realtime = await novaRealtimeCreateHousemanOrder_(realtimePayload);
    } catch (error) {
      if (!['QM', 'PUBLIC'].includes(role)) throw error; // PUBLIC_HOUSEMAN_REQUEST_V1
      if (role === 'QM') {
        const status = Number(error?.status || 0);
        const code = String(error?.code || '').trim().toUpperCase();
        const rpcUnavailable = status === 404 && ['PGRST202', 'PGRST205'].includes(code);
        // QM_HOUSEMAN_DBFIRST_V1 · 권한/검증/네트워크 결과불명은 Sheet에 이중쓰기하지 않습니다.
        // RPC 자체가 미배포된 경우에만 기존 경로로 안전하게 후퇴합니다.
        if (!rpcUnavailable) throw error;
      }
      console.warn(`[NOVA ${role}] 하우스맨 DB 우선등록 실패 · 기존 모바일 요청으로 fallback`, error);
      const legacy = await callServer('createMobileHousemanRequest', state.token, Object.assign({}, payload || {}, {
        requestSource: role, createdFrom: 'MOBILE', assignmentMode: role === 'PUBLIC' ? 'AUTO' : 'UNASSIGNED',
        realtimeAssignmentSnapshot: publicAssignment, handover: false
      }));
      return Object.assign({}, legacy || {}, { realtime: false, fallback: true, mirrorPromise: Promise.resolve(legacy) });
    }
    const mirrorPayload = Object.assign({}, realtime.mirrorPayload || realtimePayload, {
      realtimeOrderId: realtime.orderId || realtime.order?.orderId || '',
      requester: state.bootstrap?.user?.name || '',
      requestSource: role, // QM_HOUSEMAN_REQUEST_PARITY_V1
      createdFrom: 'MOBILE',
      assignmentMode: 'UNASSIGNED',
      handover: false
    });
    const mirrorPromise = mirrorRoommaidHousemanRequestToSheet_(mirrorPayload);
    // 사진이 없는 일반 등록은 Sheet/Telegram 저장을 사용자 응답과 분리한다.
    void mirrorPromise.catch(() => null);
    return {
      ok: true,
      realtime: true,
      order: realtime.order,
      version: Number(realtime.order?.version || realtime.version || 0),
      timing: realtime.timing || {},
      mirrorPayload,
      mirrorPromise,
      message: '하우스맨 요청을 등록했습니다.'
    };
  }
  window.novaCreateRoommaidHousemanRequestFast_ = createRoommaidHousemanRequestFast_;

  function openMobileHousemanRequest_(roomNo) { // (모바일 하우스맨 요청 등록창) // PUBLIC_HOUSEMAN_REQUEST_V1
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    const rawParts = state.mobile.data?.codes?.orderParts || [];
    if (role === 'PUBLIC') prefetchPublicHousemanAssignment_(roomNo); // PUBLIC_HOUSEMAN_REQUEST_FAST_V2
    const parts = role === 'PUBLIC'
      ? [{ label: '습득물' }, { label: '기타' }]
      : rawParts;
    const itemSuggestions = state.mobile.data?.codes?.orderItems || [];
    const itemDatalist = `<datalist id="mobileHousemanItemSuggestions">${itemSuggestions.map(item => `<option value="${escapeAttr(item.label)}"></option>`).join('')}</datalist>`;
    openModal(`<div class="modal-card"><div class="modal-header"><h2>${escapeHtml(roomNo)} 하우스맨 요청</h2><button class="modal-close" data-close-modal>×</button></div><div class="modal-body">${itemDatalist}<div class="modal-grid"><label class="modal-field"><span>파트</span><select id="mobileRequestPart"><option value="">선택</option>${parts.map(part => `<option value="${escapeAttr(part.label)}">${escapeHtml(part.label)}</option>`).join('')}</select></label><label class="modal-field"><span>수량</span><input id="mobileRequestQty" type="number" min="1" max="99" value="1"></label><label class="modal-field full"><span>품목</span><input id="mobileRequestItem" list="mobileHousemanItemSuggestions" placeholder="예: 타월, 생수"></label><label class="modal-field full"><span>추가내용</span><textarea id="mobileRequestNote" placeholder="필요한 내용을 입력하세요."></textarea></label></div><div class="modal-actions"><button id="mobileRequestSubmit" class="action-button primary" type="button">요청 등록</button></div></div></div>`);
    $('mobileRequestSubmit').addEventListener('click', async event => {
      const part = $('mobileRequestPart').value;
      const item = $('mobileRequestItem').value.trim();
      if (!part || !item) return showToast('파트와 품목을 입력하세요.');
      const payload = {
        businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo, part,
        items: [{ name: item, quantity: clampQuantity($('mobileRequestQty').value) }],
        note: $('mobileRequestNote').value.trim(), requester: state.bootstrap.user.name,
        sourceLanguage: String(window.NOVA_I18N?.getLanguage?.() || 'ko').toLowerCase() // NOVA_I18N_V1
      };
      const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
      if (!['ROOMMAID', 'QM', 'PUBLIC'].includes(role)) { // QM_HOUSEMAN_REQUEST_PARITY_V1 · PUBLIC_HOUSEMAN_REQUEST_V1
        closeModal();
        await runMobileAction_('createMobileHousemanRequest', payload, event.currentTarget);
        return;
      }

      const button = event.currentTarget;
      const clickedAt = performance.now();
      button.disabled = true;
      button.textContent = '등록 중…';
      try {
        const result = await createRoommaidHousemanRequestFast_(payload);
        if (!result?.ok) throw new Error(result?.message || '하우스맨 요청을 등록하지 못했습니다.');
        closeModal();
        const elapsed = Math.round(performance.now() - clickedAt);
        showToast(result.message || '하우스맨 요청을 등록했습니다.');
        setSyncStatus(`룸메이드 오더 ${result.realtime ? 'Realtime' : '기존경로'} ${elapsed}ms`);
      } catch (error) {
        showToast(error?.message || '하우스맨 요청 등록 오류');
        if (button.isConnected) {
          button.disabled = false;
          button.textContent = '요청 등록';
        }
      }
    });
  }

  function startMobileSync() { // (지터 기반 모바일 동기화 시작)
    stopMobileSync();
    if (!['qm', 'houseman', 'cleaning', 'public'].includes(state.activeMenu)) return;
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    const realtimeMobileRole = novaRealtimeIsEnabled_() && (
      (role === 'ROOMMAID' && state.activeMenu === 'cleaning')
      || (role === 'QM' && state.activeMenu === 'qm')
      || (role === 'HOUSEMAN' && state.activeMenu === 'houseman')
    );
    if (realtimeMobileRole) {
      // ROOM_STATE_SYNC_HARDENING_V1 · Push 우선 + 3~3.7초 DB polling 이중화.
      void novaRealtimeEnsureSubscriptions_().catch(error => {
        console.warn(`[NOVA Realtime] ${role} Push 구독 실패 · DB 주기조회로 계속 동작합니다.`, error);
      });
      // 화면 진입/백그라운드 복귀 시 첫 3초를 기다리지 않고 현재 DB를 즉시 맞춥니다.
      window.setTimeout(() => { void syncMobileDelta(); }, 0);
    }
    scheduleMobileSync_();
  }

  function scheduleMobileSync_() { // (직원별 요청시점 분산)
    if (document.hidden || !['qm', 'houseman', 'cleaning', 'public'].includes(state.activeMenu) || !state.mobile.loaded) return;
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').toUpperCase();
    const roommaidRealtime = novaRealtimeIsEnabled_() && role === 'ROOMMAID' && state.activeMenu === 'cleaning';
    const qmRealtime = novaRealtimeIsEnabled_() && role === 'QM' && state.activeMenu === 'qm';
    const housemanRealtime = novaRealtimeIsEnabled_() && role === 'HOUSEMAN' && state.activeMenu === 'houseman';
    let delay;
    if (roommaidRealtime || qmRealtime || housemanRealtime) {
      // ROOMMAID/QM/HOUSEMAN 모두 본인 배정목록만 경량조회하므로
      // 3.0~3.7초로 분산해 정상 네트워크 기준 5초 미만 반영을 목표로 한다.
      delay = 3000 + Math.round(Math.random() * 700);
    } else {
      delay = nextSyncDelay_(Number(state.bootstrap.app.mobileSyncMs || 16000));
    }
    state.mobile.syncTimer = window.setTimeout(async () => {
      state.mobile.syncTimer = null;
      await syncMobileDelta();
      scheduleMobileSync_();
    }, delay);
  }

  function stopMobileSync() { // (모바일 동기화 중지)
    if (state.mobile.syncTimer) window.clearTimeout(state.mobile.syncTimer);
    state.mobile.syncTimer = null;
  }

  async function syncMobileDelta() { // (모바일 변경 시에만 갱신)
    if (document.hidden || !['qm', 'houseman', 'cleaning', 'public'].includes(state.activeMenu) || state.mobile.loading || state.mobile.syncInFlight || state.mobile.actionInFlight || !state.mobile.loaded) return;
    state.mobile.syncInFlight = true;
    try {
      const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').toUpperCase();
      if (novaRealtimeIsEnabled_() && role === 'HOUSEMAN' && state.activeMenu === 'houseman') {
        const previousY = window.scrollY;
        const businessDate = state.mobile.businessDate || state.bootstrap.app.businessDate;
        const site = state.mobile.site || state.bootstrap.user.defaultSite || '';
        const dbRows = await novaRealtimeLoadHousemanOrders_(businessDate, site);
        const existing = state.mobile.data?.orders || [];
        const dbIds = new Set(dbRows.map(raw => String(raw.order_id ?? raw.orderId ?? '')).filter(Boolean));
        const existingMap = new Map(existing.map(order => [String(order.orderId || ''), order]));

        // DB에서 한번 확인된 Realtime 오더가 더 이상 본인 목록에 없으면 재배정된 것이므로 제거한다.
        const kept = existing.filter(order => order.__dbAssignmentTracked !== true || dbIds.has(String(order.orderId || '')));
        const keptMap = new Map(kept.map(order => [String(order.orderId || ''), order]));
        dbRows.forEach(raw => {
          const mapped = novaRealtimeMapHousemanOrder_(raw);
          if (!mapped?.orderId) return;
          const previous = existingMap.get(String(mapped.orderId)) || keptMap.get(String(mapped.orderId));
          const dbUpdated = novaRealtimeUpdatedAtMs_(mapped.updatedAt);
          const sheetUpdated = novaRealtimeUpdatedAtMs_(previous?.updatedAt);
          let next;
          if (previous && sheetUpdated > dbUpdated) {
            // 접수·처리·완료 등 Sheet 액션이 DB의 배정시각보다 최신이면 그 상태를 보존한다.
            next = Object.assign({}, previous, {
              assignedEmployeeNo: mapped.assignedEmployeeNo || previous.assignedEmployeeNo,
              assignedName: mapped.assignedName || previous.assignedName,
              routeCandidateEmployeeNos: mapped.routeCandidateEmployeeNos || previous.routeCandidateEmployeeNos,
              routeCandidateNames: mapped.routeCandidateNames || previous.routeCandidateNames,
              routeCandidateSummary: mapped.routeCandidateSummary || previous.routeCandidateSummary,
              routeLocked: mapped.routeLocked,
              __dbAssignmentTracked: true,
              __dbVersion: Number(mapped.version || 0)
            });
          } else {
            next = Object.assign({}, mapped, {
              // Apps Script updateHousemanOrder의 version은 Sheet 도메인이다. DB version을 넘기지 않는다.
              rowNumber: Number(previous?.rowNumber || 0),
              version: Number(previous?.version || 0),
              __dbAssignmentTracked: true,
              __dbVersion: Number(mapped.version || 0)
            });
          }
          const idx = kept.findIndex(order => String(order.orderId || '') === String(next.orderId || ''));
          if (idx >= 0) kept[idx] = next; else kept.push(next);
        });
        state.mobile.data.orders = kept;
        sortMobileHousemanOrdersLocal_();
        refreshHousemanMobileSummaryLocal_();
        renderMobileSummary();
        renderMobileList();
        requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
        setSyncStatus('하우스맨 DB 배정 동기화 완료');
        return;
      }

      if (novaRealtimeIsEnabled_()
          && ((role === 'ROOMMAID' && state.activeMenu === 'cleaning')
            || (role === 'QM' && state.activeMenu === 'qm'))) {
        const previousY = window.scrollY;
        await novaRealtimeHydrateCurrentView_();
        requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
        setSyncStatus(role === 'QM' ? 'QM DB 배정 동기화 완료' : '룸메이드 DB 동기화 완료');
        return;
      }

      const result = await callReadServerWithRetry_('getMobileDelta', state.token, {
        businessDate: state.mobile.businessDate,
        site: state.mobile.site,
        sinceVersion: state.mobile.version
      });
      if (!result?.ok || !result.changed) return;
      const previousY = window.scrollY;
      applyMobileSnapshot(result);
      requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
      setSyncStatus(`모바일 반영 · ${result.serverTime || ''}`);
    } catch (error) {
      setSyncStatus(`모바일 연결 오류 · ${error?.message || '재시도 예정'}`);
    } finally {
      state.mobile.syncInFlight = false;
    }
  }

  function codeLabel_(codes, value) { // (코드 또는 표시명 변환)
    const text = String(value || '').trim();
    const found = (codes || []).find(code => code.code === text || code.label === text);
    return found ? found.label : text || '-';
  }

  function codeValue_(codes, value) { // (상태 색상용 코드값 변환)
    const text = String(value || '').trim();
    const found = (codes || []).find(code => code.code === text || code.label === text);
    return String(found ? found.code : text || 'UNKNOWN').replace(/[^A-Za-z0-9_-]/g, '_').toUpperCase();
  }

  function isCleaningActiveStatus_(value, codes) { // (청소중 코드·표시명 통합 판정)
    const code = codeValue_(codes || [], value);
    const activeCodes = new Set(['CLEANING', 'IN_PROGRESS', 'WORKING', 'STARTED']);
    if (activeCodes.has(code)) return true;
    const normalize = text => String(text || '').trim().replace(/[\s_\-/]+/g, '').toUpperCase();
    const raw = normalize(value);
    const label = normalize(codeLabel_(codes || [], value));
    const activeLabels = new Set(['CLEANING', 'INPROGRESS', 'WORKING', 'STARTED', '청소중', '청소진행중', '청소진행', '정비중', '정비진행중']);
    return activeLabels.has(raw) || activeLabels.has(label);
  }

  function clampQuantity(value) { // (수량 범위 정리)
    return Math.max(1, Math.min(99, Number(value || 1)));
  }

  function openModal(html) { // (모달 표시)
    $('modalRoot').innerHTML = html;
    $('modalRoot').classList.remove('hidden');
    $('modalRoot').setAttribute('aria-hidden', 'false');
  }

  function closeModal() { // (모달 닫기·QM 진행중 초안 보존)
    const active = state.qmChecklist?.activeInspection;
    const hasInspectionForm = Boolean(active?.draft?.draftId && $('qmChecklistInspectionItems'));
    if (hasInspectionForm) {
      const draft = collectQmInspectionForm_() || active.draft;
      active.draft = draft;
      if (state.qmChecklist.autosaveTimer) window.clearTimeout(state.qmChecklist.autosaveTimer);
      state.qmChecklist.autosaveTimer = null;
      callServer('saveQmInspectionDraft', state.token, {
        draftId: draft.draftId,
        answers: draft.answers || [],
        defects: draft.defects || []
      }).then(result => {
        if (result?.ok && state.qmChecklist.activeInspection?.draft?.draftId === draft.draftId) {
          state.qmChecklist.activeInspection.draft = Object.assign({}, state.qmChecklist.activeInspection.draft, result.draft || {}, {
            answers: draft.answers || [], defects: draft.defects || []
          });
        }
      }).catch(() => {});
    }
    $('modalRoot').classList.add('hidden');
    $('modalRoot').setAttribute('aria-hidden', 'true');
    $('modalRoot').innerHTML = '';
  }

  function showToast(message) { // (작업 결과 안내)
    const toast = $('toast');
    toast.textContent = message;
    toast.classList.remove('hidden');
    if (state.toastTimer) window.clearTimeout(state.toastTimer);
    state.toastTimer = window.setTimeout(() => toast.classList.add('hidden'), 2600);
  }

  function showConnectionError(message) { // (화면 유지형 연결 오류)
    if (state.bootstrap) {
      showView('mainView');
      setSyncStatus(`연결 오류 · ${message}`);
      return;
    }
    showView('loginView');
    $('loginMessage').textContent = message;
  }

  function handleLogout() { // (명시적 로그아웃 · 모바일 지속세션도 함께 폐기)
    saveUiState();
    stopIndicatorSync();
    stopMobileSync();
    void novaRealtimeDisconnect_();
    novaRealtime_.enabled = false;
    novaRealtime_.apiBase = '';
    novaRealtime_.configLoaded = false;
    if (persistentLoginRefreshTimer_) window.clearTimeout(persistentLoginRefreshTimer_);
    persistentLoginRefreshTimer_ = null;
    const persistentToken = persistentSessionToken_();
    setPersistentSessionToken_('');
    state.token = '';
    state.bootstrap = null;
    localStorage.removeItem('novaToken');
    showView('loginView');
    restoreRememberedLogin_(true);
    $('loginMessage').textContent = '';
    if (persistentToken) {
      void callServer('revokePersistentLogin', persistentToken)
        .catch(error => console.warn('[NOVA] 지속세션 서버 로그아웃 지연:', error));
    }
  }

  /* ORDER_SHARED_SITE_CONTEXT_V1
   * ORDER 계정은 통합 인디케이터에서 조회 확정한 사업장을 현재 업무사업장으로 공유합니다.
   * ADMIN 및 다른 역할에는 영향을 주지 않습니다.
   */
  function isOrderSharedSiteContext_() {
    return String(state.bootstrap?.user?.role || '').trim().toUpperCase() === 'ORDER';
  }

  function getOrderSharedSite_() { // ORDER_SHARED_SITE_CONTEXT_V2 · 기존 세션도 인디케이터 사업장 승계
    if (!isOrderSharedSiteContext_()) return '';
    const stored = String(sessionStorage.getItem('novaOrderWorkSite') || '').trim();
    if (stored) return stored;
    const indicatorSite = String(state.indicator?.site || '').trim();
    const persistedIndicatorSite = String(sessionStorage.getItem('novaIndicatorSite') || '').trim();
    const fallback = indicatorSite || persistedIndicatorSite;
    if (fallback) sessionStorage.setItem('novaOrderWorkSite', fallback);
    return fallback;
  }

  function setOrderSharedSite_(site) {
    if (!isOrderSharedSiteContext_()) return '';
    const nextSite = String(site || '').trim();
    if (!nextSite) return '';
    const previousSite = String(sessionStorage.getItem('novaOrderWorkSite') || '').trim();
    sessionStorage.setItem('novaOrderWorkSite', nextSite);

    const syncState = (bucket, options = {}) => {
      if (!bucket) return;
      const changed = String(bucket.site || '').trim() !== nextSite;
      bucket.site = nextSite;
      if (changed) {
        bucket.loaded = false;
        if (Object.prototype.hasOwnProperty.call(bucket, 'data')) bucket.data = null;
        if (options.resetZoneDraft) bucket.zoneDraft = { employeeNo: '', buildings: [] };
      }
    };

    syncState(state.departure);
    syncState(state.monthly);
    syncState(state.roommaidStats);
    syncState(state.roommaidClose);
    syncState(state.shifts, { resetZoneDraft: true });

    sessionStorage.setItem('novaMonthlySite', nextSite);
    sessionStorage.setItem('novaShiftSite', nextSite);
    if (previousSite && previousSite !== nextSite) {
      state.roommaidClose.attendanceDraft = [];
      state.roommaidClose.attendanceDirty = false;
    }
    return nextSite;
  }

  function applyOrderSharedSiteToMenu_(menuId) {
    if (!isOrderSharedSiteContext_()) return '';
    const site = getOrderSharedSite_();
    if (!site) return '';
    const targets = {
      departure: state.departure,
      monthly: state.monthly,
      roommaidStats: state.roommaidStats,
      roommaidClose: state.roommaidClose,
      shifts: state.shifts
    };
    const bucket = targets[menuId];
    if (!bucket) return site;
    const changed = String(bucket.site || '').trim() !== site;
    bucket.site = site;
    if (changed) {
      bucket.loaded = false;
      if (Object.prototype.hasOwnProperty.call(bucket, 'data')) bucket.data = null;
      if (menuId === 'shifts') bucket.zoneDraft = { employeeNo: '', buildings: [] };
    }
    if (menuId === 'monthly') sessionStorage.setItem('novaMonthlySite', site);
    if (menuId === 'shifts') sessionStorage.setItem('novaShiftSite', site);
    return site;
  }

  function lockOrderSharedSiteSelect_(menuId) {
    if (!isOrderSharedSiteContext_()) return;
    const site = getOrderSharedSite_();
    if (!site) return;
    const idByMenu = {
      departure: 'departureSite',
      monthly: 'monthlySite',
      roommaidStats: 'roommaidPerformanceSite',
      roommaidClose: 'roommaidCloseSite',
      shifts: 'shiftSite'
    };
    const select = $(idByMenu[menuId] || '');
    if (!select) return;
    if ([...select.options].some(option => option.value === site)) select.value = site;
    select.disabled = true;
    select.title = `통합 인디케이터 현재 사업장(${site})으로 고정됩니다.`;
  }

    const employeeNo = String(state.bootstrap?.user?.employeeNo || '').trim() || 'ANON';

  function readMobileViewPreference_() { // (현재 탭·필터·검색 안전조회)
    try {
      const parsed = JSON.parse(localStorage.getItem(mobileViewPreferenceKey_()) || 'null');
      if (!parsed || typeof parsed !== 'object') return null;
      return {
        filter: String(parsed.filter || '').trim().toUpperCase(),
        search: String(parsed.search || ''),
        qmView: String(parsed.qmView || '').trim().toUpperCase()

  }

  function restoreMobileViewPreference_() { // (새로고침 후 현재 모바일 화면상태 복원)
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!role) return;
    const saved = readMobileViewPreference_();
    if (!saved) return;
    if (saved.filter) state.mobile.filter = saved.filter;
    state.mobile.search = saved.search;
    if (role === 'QM' && ['TARGETS', 'CLEANED', 'VACANT'].includes(saved.qmView)) state.mobile.qmView = saved.qmView;
    const searchInput = $('mobileSearch');
    if (searchInput) searchInput.value = state.mobile.search;

  function saveMobileViewPreference_() { // (탭·필터·검색 변경 즉시 저장)
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!role) return;
    try {
      localStorage.setItem(mobileViewPreferenceKey_(), JSON.stringify({
        filter: String(state.mobile.filter || ''),
        search: String(state.mobile.search || ''),
        qmView: role === 'QM' ? String(state.mobile.qmView || 'TARGETS') : ''
      }));
    } catch (ignore) {}

  function mobileLocationPreferenceKey_(scope, view) { // (사용자·역할·업무일자·사업장별 동·층 저장키)
    const employeeNo = String(state.bootstrap?.user?.employeeNo || '').trim() || 'ANON';
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase() || 'UNKNOWN';
    const businessDate = String(state.mobile.businessDate || state.bootstrap?.app?.businessDate || '').trim() || 'NO_DATE';
    const site = String(state.mobile.site || state.bootstrap?.user?.defaultSite || '').trim() || 'ALL';
    const suffix = scope === 'QM_BROWSE' ? `:${String(view || qmMobileBrowseView_() || 'TARGETS').toUpperCase()}` : '';
    return `novaMobileLocation:${employeeNo}:${role}:${businessDate}:${site}:${scope || 'COMMON'}${suffix}`;

  function readMobileLocationPreference_(key) { // (동·층 설정 안전조회)
    try {
      const parsed = JSON.parse(localStorage.getItem(key) || 'null');
      if (!parsed || typeof parsed !== 'object') return null;
      return {
        building: String(parsed.building || '').trim(),
        floor: String(parsed.floor || '').trim()
      };
    } catch (ignore) {
      return null;
    }
  }

  function restoreMobileLocationPreference_() { // (PUBLIC·ROOMMAID·QM 점검대상 동·층 복원)
    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!['PUBLIC', 'ROOMMAID', 'QM'].includes(role)) return;
    if (role === 'QM' && qmMobileBrowseView_() !== 'TARGETS') return;
    const saved = readMobileLocationPreference_(mobileLocationPreferenceKey_('COMMON'));
    if (!saved) return;
    state.mobile.building = saved.building;

  function setSyncStatus(text) { // (우측 하단 연결상태 표시 · SYNC_STATUS_AUTO_HIDE_V1)
    const status = $('syncStatus');
    if (!status) return;

    const message = String(text || '').trim();
    if (status.__novaHideTimer) {
      window.clearTimeout(status.__novaHideTimer);
      status.__novaHideTimer = null;
    }

    status.textContent = message;
    status.classList.toggle('hidden', !message);
    if (!message) return;

    // 정상 안내는 잠깐만 보여주고, 사용자가 조치해야 할 오류·재시도 상태는 계속 표시합니다.
    const persistent = /오류|실패|재시도|재확인|확인 필요|복원|중단|비활성|처리불가|타임아웃|연결 끊김/.test(message);
    if (persistent) return;

    const expectedMessage = message;
    status.__novaHideTimer = window.setTimeout(() => {
      status.__novaHideTimer = null;
      if (status.textContent !== expectedMessage) return;
      status.classList.add('hidden');
      status.textContent = '';
    }, 3000);

  function nextSyncDelay_(baseMs) { // (동시 폴링 집중 방지 지터)
    const base = Math.max(3000, Number(baseMs || 10000));
    const ratio = Math.max(0, Math.min(1, Number(state.bootstrap?.app?.syncJitterRatio ?? 1.0)));
    return Math.round(base + Math.random() * base * ratio);
  }

  function readRequestKey_(method, args) { // (동일 조회요청 병합키)
    let serialized = '';
    try { serialized = JSON.stringify(args || []); } catch (error) { serialized = String(args || ''); }
    return `${method}|${serialized}`;
  }

  async function callReadServerWithRetry_(method, ...args) { // (동일 조회 병합·제한적 지수 재시도)
    const requestKey = readRequestKey_(method, args);
    if (readRequestInflight_.has(requestKey)) return readRequestInflight_.get(requestKey);

    const task = (async () => {
      const delays = [0, 700, 1800];
      let lastError = null;
      for (let index = 0; index < delays.length; index += 1) {
        if (delays[index]) await wait_(delays[index] + Math.round(Math.random() * 300));
        if (document.hidden) throw new Error('백그라운드 화면에서는 동기화를 잠시 중지합니다.');
        try {
          const result = await callServer(method, ...args);
          if (result?.ok !== false) return result;
          const error = new Error(result?.message || '서버 조회 오류');
          error.code = result?.code || '';
          throw error;
        } catch (error) {
          lastError = error;
          if (!isTransientServerError_(error) || index === delays.length - 1) throw error;
        }
      }
      throw lastError || new Error('서버 조회 오류');
    })().finally(() => readRequestInflight_.delete(requestKey));

    readRequestInflight_.set(requestKey, task);
    return task;
  }

  function isTransientServerError_(error) { // (Apps Script 일시적 과부하 오류 판정)
    const code = String(error?.code || '').toUpperCase();
    const message = String(error?.message || error || '').toLowerCase();
    return code === 'BUSY_RETRY'
      || /too many|simultaneous|invoked too many|timed out|timeout|internal error|service unavailable|try again|잠시 후|동시 요청/.test(message);
  }

  function wait_(milliseconds) { // (조회 재시도 대기)
    return new Promise(resolve => window.setTimeout(resolve, Math.max(0, Number(milliseconds || 0))));
  }

  function callServer(method, ...args) { // (Apps Script 호출 Promise 변환)
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(new Error(error?.message || String(error))));
      runner[method](...args);
    });
  }

  function escapeHtml(value) { // (화면 문자열 안전 처리)
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeAttr(value) { // (HTML 속성 문자열 안전 처리)
    return escapeHtml(value).replaceAll('`', '&#096;');
  }

  function filterRoommaidPerformanceEmployeeOptions_() { // (이름·사번 텍스트로 목록 필터)
    const select = $('roommaidPerformanceEmployee');
    if (!select) return;
    let options = [];
    try { options = JSON.parse(select.dataset.options || '[]'); } catch (error) { options = []; }
    const query = String($('roommaidPerformanceSearch')?.value || state.roommaidStats.employeeSearch || '').trim().toLowerCase();
    const selected = state.roommaidStats.employeeNo || select.value || '';
    const employmentCategory = String($('roommaidPerformanceEmployment')?.value || state.roommaidStats.employmentCategory || '');
    const employmentVendor = String($('roommaidPerformanceVendor')?.value || state.roommaidStats.employmentVendor || '');
    const filtered = options.filter(item => {
      if (query && !`${item.name} ${item.employeeNo}`.toLowerCase().includes(query)) return false;
      if (employmentCategory && item.employmentCategory !== employmentCategory) return false;
      if (employmentCategory === '외주업체' && employmentVendor && item.employmentVendor !== employmentVendor) return false;
      return true;
    });
    select.innerHTML = '<option value="">전체 룸메이드</option>' + filtered.map(item => `<option value="${escapeAttr(item.employeeNo)}">${escapeHtml(item.name)} (${escapeHtml(item.employeeNo)})</option>`).join('');
    if (selected && options.some(item => item.employeeNo === selected)) select.value = selected;
  }

  async function loadRoommaidCloseJournal_() { // (룸메이드 마감일지 조회)
    if (state.roommaidClose.loading) return;
    state.roommaidClose.loading = true;
    const loadButton = $('roommaidCloseLoad');
    if (loadButton) { loadButton.disabled = true; loadButton.textContent = '조회 중…'; }
    try {
      const result = await callReadServerWithRetry_('getRoommaidCloseJournal', state.token, {
        businessDate: String($('roommaidCloseDate')?.value || state.roommaidClose.businessDate || '').trim(),
        site: String($('roommaidCloseSite')?.value || state.roommaidClose.site || '').trim()
      });
      if (!result?.ok) throw new Error(result?.message || '룸메이드 마감일지를 불러오지 못했습니다.');
      state.roommaidClose.data = result;
      state.roommaidClose.loaded = true;
      state.roommaidClose.businessDate = result.businessDate;
      state.roommaidClose.site = result.site;
      state.roommaidClose.attendanceDraft = Array.from(new Set((result.attendanceEmployeeNos || []).map(String)));
      state.roommaidClose.attendanceDirty = false;
      renderRoommaidCloseData_();
    } catch (error) {
      showToast(error?.message || '룸메이드 마감일지 조회 오류');

    } finally {

  function roommaidCloseReportTypes_(journal) { // (첨부 양식 고정 타입)

      ? journal.reportMaintenanceTypes : ['F', 'T', 'R', 'G'];

  function roommaidCloseBuildingColumns_(journal) { // (동별 실제 타입 열)
    if (Array.isArray(journal?.buildingColumns) && journal.buildingColumns.length) {
      return journal.buildingColumns.map(item => ({
        building: String(item?.building || ''),
        types: Array.isArray(item?.types) && item.types.length ? item.types.map(type => String(type || '').trim().toUpperCase()) : ['']
      }));
    }
    const types = roommaidCloseReportTypes_(journal);
    return (journal?.buildings || []).map(building => ({ building, types: types.slice() }));
  }

  function roommaidCloseValue_(value) { // (0은 원본 양식처럼 빈칸 표시)
    const number = Number(value || 0);
    return number ? number.toLocaleString('ko-KR') : '';
  }

  function roommaidCloseBuildingCellValue_(row, column, reportTypes) { // (동 단일열·타입열 수량)
    const types = Array.isArray(column?.types) ? column.types : [];
    if (types.length === 1 && !types[0]) {
      return reportTypes.reduce((sum, type) => sum + Number(row?.cells?.[column.building]?.[type] || 0), 0);
    }
    const type = types[0] || '';
    return Number(row?.cells?.[column.building]?.[type] || 0);
  }

  function buildRoommaidCloseStaffBlocks_(journal) { // (개인현황 5개 가로구역 배치)
    const blockCount = Math.max(1, Number(journal?.staffBlockCount || 5));
    const configuredRows = Math.max(1, Number(journal?.staffRowsPerBlock || 20));
    const source = Array.isArray(journal?.staffRows) ? journal.staffRows : [];
    const people = source.filter(row => String(row?.rowType || 'PERSON') !== 'GROUP');
    const groups = source.filter(row => String(row?.rowType || '') === 'GROUP');
    const rowsPerBlock = Math.max(configuredRows, Math.ceil((people.length + groups.length) / blockCount));
    const slotCount = blockCount * rowsPerBlock;
    const slots = Array(slotCount).fill(null);
    const groupStart = Math.max(0, slotCount - groups.length);
    people.slice(0, groupStart).forEach((row, index) => { slots[index] = row; });
    groups.forEach((row, index) => { slots[groupStart + index] = row; });
    const blocks = Array.from({ length: blockCount }, (_, blockIndex) =>
      slots.slice(blockIndex * rowsPerBlock, (blockIndex + 1) * rowsPerBlock)
    );
    return { blockCount, rowsPerBlock, blocks };
  }

  function roommaidCloseBlockTotals_(blockRows, types) { // (개인 가로구역 소계)
    const normal = Object.fromEntries(types.map(type => [type, 0]));
    const ds = Object.fromEntries(types.map(type => [type, 0]));
    (blockRows || []).filter(Boolean).forEach(row => {
      types.forEach(type => {
        normal[type] += Number(row?.normal?.[type] || 0);
        ds[type] += Number(row?.ds?.[type] || 0);
      });
    });
    return { normal, ds };
  }

  function roommaidCloseSpecialColumnOrder_(journal) { // (특수 객실 열 순서 H/U → R/C 고정)
    const allowed = new Set(['HU', 'RC']);
    const supplied = Array.isArray(journal?.specialColumnOrder)
      ? journal.specialColumnOrder.map(value => String(value || '').trim().toUpperCase()).filter(value => allowed.has(value))
      : [];
    const unique = Array.from(new Set(supplied));
    return unique.length === 2 ? unique : ['HU', 'RC'];
  }

  function roommaidCloseSpecialColumnLabel_(bucket) { // (특수 객실 열 제목)
    return String(bucket || '').toUpperCase() === 'HU' ? 'H/U' : 'R/C';
  }

  function renderRoommaidCloseMatrix_() { // (첨부 이미지형 정비현황 표)
    const journal = state.roommaidClose.data?.journal || {};
    const reportTypes = roommaidCloseReportTypes_(journal);
    const buildingColumns = roommaidCloseBuildingColumns_(journal);
    const specialOrder = roommaidCloseSpecialColumnOrder_(journal);
    const rows = journal.matrixRows || [];
    if (!rows.length) {
      $('roommaidCloseMatrix').innerHTML = '<div class="daily-close-empty">정비현황 자료가 없습니다.</div>';
      return;
    }
    const firstHeader = buildingColumns.map(column => {
      const types = column.types || [''];
      return types.length > 1
        ? `<th colspan="${types.length}">${escapeHtml(column.building)}</th>`
        : `<th rowspan="2" class="single-building">${escapeHtml(column.building)}</th>`;
    }).join('');
    const secondHeader = buildingColumns.map(column => {
      const types = column.types || [''];
      return types.length > 1 ? types.map(type => `<th>${escapeHtml(type)}</th>`).join('') : '';
    }).join('');
    const body = rows.map(row => {
      const buildingCells = buildingColumns.map(column => {
        const types = column.types || [''];
        if (types.length === 1) {
          const value = types[0]
            ? Number(row?.cells?.[column.building]?.[types[0]] || 0)
            : roommaidCloseBuildingCellValue_(row, column, reportTypes);
          return `<td>${roommaidCloseValue_(value)}</td>`;
        }
        return types.map(type => `<td>${roommaidCloseValue_(row?.cells?.[column.building]?.[type])}</td>`).join('');
      }).join('');
      const specialCells = specialOrder.map(bucket =>
        reportTypes.map(type => `<td>${roommaidCloseValue_(row?.specialCells?.[bucket]?.[type])}</td>`).join('')
      ).join('');
      const totals = reportTypes.map(type => `<td class="total-cell">${roommaidCloseValue_(row?.totals?.[type])}</td>`).join('');
      return `<tr><th class="sticky-first">${escapeHtml(row.label || '')}</th>${buildingCells}${specialCells}${totals}<td class="conversion-cell">${roommaidCloseValue_(row?.conversion?.F)}</td><td class="conversion-cell">${roommaidCloseValue_(row?.conversion?.R)}</td><td class="note-cell">${escapeHtml(row?.note || '')}</td></tr>`;
    }).join('');
    $('roommaidCloseMatrix').innerHTML = `
      <table class="roommaid-close-matrix image-layout">
        <thead>
          <tr>
            <th rowspan="2" class="sticky-first">구분</th>
            ${firstHeader}
            ${specialOrder.map(bucket => `<th colspan="${reportTypes.length}">${roommaidCloseSpecialColumnLabel_(bucket)}</th>`).join('')}
            <th colspan="${reportTypes.length}">합계</th>
            <th colspan="2">환산</th>
            <th rowspan="2" class="note-head">비고</th>
          </tr>
          <tr>${secondHeader}${reportTypes.map(type => `<th>${escapeHtml(type)}</th>`).join('')}${reportTypes.map(type => `<th>${escapeHtml(type)}</th>`).join('')}${reportTypes.map(type => `<th>${escapeHtml(type)}</th>`).join('')}<th>F</th><th>R</th></tr>
        </thead>
        <tbody>${body}</tbody>
      </table>`;
  }

  function renderRoommaidCloseAttendance_() { // (출근인원 선택)
    const container = $('roommaidCloseAttendance');
    if (!container) return;
    const options = state.roommaidClose.data?.attendanceOptions || [];
    const selected = new Set(state.roommaidClose.attendanceDraft || []);
    const query = String(state.roommaidClose.attendanceSearch || '').toLowerCase();
    const filtered = options.filter(item => !query || `${item.name} ${item.employeeNo} ${item.job} ${item.groupLabel}`.toLowerCase().includes(query));
    container.innerHTML = `<div class="roommaid-close-attendance-summary"><strong>출근 ${selected.size}명</strong><span>배정·완료기록 인원은 자동 포함되며 추가 출근인원을 선택할 수 있습니다.</span></div><div class="roommaid-close-attendance-grid">${filtered.map(item => `<label class="roommaid-close-person${item.inferred ? ' inferred' : ''}"><input type="checkbox" data-rmc-attendance="${escapeAttr(item.employeeNo)}"${selected.has(item.employeeNo) ? ' checked' : ''}${item.inferred ? ' disabled' : ''}><span><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.employeeNo)} · ${escapeHtml(item.groupLabel || item.job || '룸메이드')}${item.inferred ? ' · 실적확인' : ''}</small></span></label>`).join('') || '<div class="daily-close-empty">검색 결과가 없습니다.</div>'}</div>`;
    container.querySelectorAll('[data-rmc-attendance]').forEach(input => input.addEventListener('change', event => {
      const set = new Set(state.roommaidClose.attendanceDraft || []);
      if (event.target.checked) set.add(event.target.dataset.rmcAttendance); else set.delete(event.target.dataset.rmcAttendance);
      state.roommaidClose.attendanceDraft = Array.from(set);
      state.roommaidClose.attendanceDirty = true;
      renderRoommaidCloseData_();
      rebuildRoommaidClosePreview_();
    }));
  }

    try {

  function renderRoommaidCloseStaff_() { // (첨부 이미지형 개인별 5구역 정비현황)
    const journal = state.roommaidClose.data?.journal || {};
    const types = roommaidCloseReportTypes_(journal);

    ).join('');
    const subHeaders = Array.from({ length: layout.blockCount }, () =>
      `${types.map(type => `<th>${escapeHtml(type)}</th>`).join('')}${types.map(type => `<th>${escapeHtml(type)}</th>`).join('')}`
    ).join('');
    const bodyRows = Array.from({ length: layout.rowsPerBlock }, (_, rowIndex) => {

      }).join('');

      <table class="roommaid-close-staff image-layout">

        <tbody>${bodyRows}<tr class="subtotal-row"><th class="sequence-cell">소계</th>${subtotalCells}</tr></tbody>
      </table>`;
  }

  async function validateRoommaidCloseDuplicateCompletions_() { // (중복 청소완료 검증 후 확정건 자동정리)
    const button = $('roommaidCloseValidateDuplicates');
    const data = state.roommaidClose.data;
    if (!button || !data?.site) return showToast('사업장을 선택하고 조회하세요.');
    const originalText = button.textContent || '중복이력 검증';
    button.disabled = true;
    button.textContent = '검증 중…';
    try {
      const validation = await callReadServerWithRetry_('validateRoommaidCloseDuplicateCompletions', state.token, {
        businessDate: data.businessDate,
        site: data.site
      });
      if (!validation?.ok) throw new Error(validation?.message || '중복 청소완료 이력을 검증하지 못했습니다.');
      const exact = Array.isArray(validation.exact) ? validation.exact : [];
      const review = Array.isArray(validation.review) ? validation.review : [];
      if (!exact.length) {
        if (review.length) {
          const reviewLines = review.slice(0, 12).map(item => `${item.roomNo}호 · ${item.firstCompletedAt || '-'} → ${item.duplicateCompletedAt || '-'}\n  ${item.reason || '관리자 확인 필요'}`);
          window.alert(`자동정리 가능한 확정 중복은 없습니다.\n\n관리자 확인 필요 ${validation.reviewCount || review.length}건\n\n${reviewLines.join('\n')}${validation.resultTruncated ? '\n\n일부 결과만 표시되었습니다.' : ''}`);
        } else {
          showToast('중복 청소완료 이력이 없습니다.');
        }
        return;
      }

      const exactLines = exact.slice(0, 12).map(item => `${item.roomNo}호 · ${item.firstCompletedAt || '-'} → ${item.duplicateCompletedAt || '-'} · ${Number(item.gapSeconds || 0)}초`);
      const reviewNotice = validation.reviewCount > 0
        ? `\n\n관리자 확인 필요 ${validation.reviewCount}건은 자동정리하지 않습니다.`
        : '';
      const confirmed = window.confirm(
        `${data.businessDate} ${data.site}\n확정 중복 청소완료 ${validation.exactCount || exact.length}건을 발견했습니다.\n\n${exactLines.join('\n')}${validation.resultTruncated ? '\n일부 결과만 표시되었습니다.' : ''}${reviewNotice}\n\n첫 번째 정상 완료는 유지하고 뒤의 중복 완료이력만 소프트삭제할까요?\n업무이력 행은 물리 삭제하지 않으며 보정이력을 남깁니다.`
      );
      if (!confirmed) return;

      button.textContent = '정리 중…';
      const result = await callServer('repairRoommaidCloseDuplicateCompletions', state.token, {
        businessDate: data.businessDate,
        site: data.site
      });
      if (!result?.ok) throw new Error(result?.message || '중복 청소완료 이력을 정리하지 못했습니다.');
      showToast(result.message || `중복 청소완료 ${Number(result.repairedCount || 0)}건을 정리했습니다.`);
      state.roommaidClose.loaded = false;
      await loadRoommaidCloseJournal_();
      if (Number(result.reviewCount || 0) > 0) {
        window.alert(`확정 중복은 정리했습니다.\n관리자 확인이 필요한 이력 ${result.reviewCount}건은 자동수정하지 않았습니다.`);
      }
    } catch (error) {
      showToast(error?.message || '중복 청소완료 검증 오류');
    } finally {
      if (button) {
        button.textContent = originalText;
        button.disabled = !Boolean(state.roommaidClose.data?.site);
      }
    }
  }

  async function resetRoommaidCloseJournal_() { // (저장 마감자료 초기화 후 실시간 재조회)
    const button = $('roommaidCloseReset');
    const saveButton = $('roommaidCloseSave');
    const data = state.roommaidClose.data;
    if (!button || !data?.site) return showToast('사업장을 선택하고 조회하세요.');
    if (!data.isClosed) return showToast('초기화할 저장 마감자료가 없습니다.');
    if (!window.confirm(`${data.businessDate} ${data.site}의 저장된 룸메이드 마감자료를 초기화할까요?\n\n객실현황·정비실적·업무이력은 삭제되지 않으며, 초기화 후 현재 자료를 확인하고 다시 마감해야 합니다.`)) return;

    button.disabled = true;
    button.textContent = '초기화 중…';
    if (saveButton) saveButton.disabled = true;
    try {
      const result = await callServer('resetRoommaidCloseJournal', state.token, {
        businessDate: data.businessDate,
        site: data.site
      });
      if (!result?.ok) throw new Error(result?.message || '마감자료를 초기화하지 못했습니다.');
      showToast(result.message || '룸메이드 마감자료를 초기화했습니다.');
      state.roommaidClose.loaded = false;
      state.roommaidClose.data = null;
      await loadRoommaidCloseJournal_();
    } catch (error) {
      showToast(error?.message || '룸메이드 마감 초기화 오류');
    } finally {
      if (button) {
        button.textContent = '마감 초기화';
        button.disabled = !Boolean(state.roommaidClose.data?.isClosed);
      }
      if (saveButton) saveButton.disabled = !Boolean(state.roommaidClose.data?.site);
    }
  }

  function downloadRoommaidCloseExcel_() { // (룸메이드 마감일지 Excel XML 다운로드)
    const data = state.roommaidClose.data;
    if (!data?.isClosed || data.isStale) return showToast('현재 자료를 마감 저장한 뒤 다운로드하세요.');
    const xml = buildRoommaidCloseExcelXml_(data);
    const filename = `NOVA_룸메이드마감일지_${data.businessDate}_${data.site}.xls`;
    downloadTextFile_(filename, xml, 'application/vnd.ms-excel;charset=utf-8');
    showToast('룸메이드 마감일지를 다운로드했습니다.');
  }

  function buildRoommaidCloseExcelXml_(data) { // (첨부 이미지와 동일한 Excel 2003 XML 생성)
    const journal = data.journal || {};
    const reportTypes = roommaidCloseReportTypes_(journal);
    const buildingColumns = roommaidCloseBuildingColumns_(journal);
    const specialOrder = roommaidCloseSpecialColumnOrder_(journal);
    const matrixRows = journal.matrixRows || [];
    const staffLayout = buildRoommaidCloseStaffBlocks_(journal);
    const matrixColumnCount = 1
      + buildingColumns.reduce((sum, column) => sum + Math.max(1, (column.types || []).length), 0)
      + reportTypes.length * 3 + 2 + 1;
    const staffColumnCount = 1 + staffLayout.blockCount * (1 + reportTypes.length * 2);
    const columnCount = Math.max(matrixColumnCount, staffColumnCount);
    const rows = [];

    const cell = (value, style='Cell', options={}) => {
      const attrs = [`ss:StyleID="${style}"`];
      if (options.index) attrs.push(`ss:Index="${options.index}"`);
      if (options.mergeAcross) attrs.push(`ss:MergeAcross="${options.mergeAcross}"`);
      if (options.mergeDown) attrs.push(`ss:MergeDown="${options.mergeDown}"`);
      const numeric = options.number === true && Number.isFinite(Number(value));
      return `<Cell ${attrs.join(' ')}><Data ss:Type="${numeric ? 'Number' : 'String'}">${excelXmlEscape_(numeric ? Number(value) : value)}</Data></Cell>`;
    };
    const numberCell = (value, style='Number', options={}) => {
      const number = Number(value || 0);
      return number ? cell(number, style, Object.assign({}, options, { number: true })) : cell('', style, options);
    };

    rows.push(`<Row ss:Height="21">${cell('1. 정비현황','Section',{mergeAcross:columnCount-1})}</Row>`);

    let firstHeader = cell('구분','Head',{mergeDown:1});
    let matrixColumnIndex = 2;
    buildingColumns.forEach(column => {
      const types = Array.isArray(column.types) && column.types.length ? column.types : [''];
      if (types.length > 1) firstHeader += cell(column.building,'Head',{mergeAcross:types.length-1});
      else firstHeader += cell(column.building,'Head',{mergeDown:1});
      matrixColumnIndex += types.length;
    });
    specialOrder.forEach(bucket => {
      firstHeader += cell(roommaidCloseSpecialColumnLabel_(bucket),'Head',{mergeAcross:reportTypes.length-1});
    });
    firstHeader += cell('합계','Head',{mergeAcross:reportTypes.length-1});
    firstHeader += cell('환산','Head',{mergeAcross:1});
    firstHeader += cell('비고','Head',{mergeDown:1});
    rows.push(`<Row ss:Height="22">${firstHeader}</Row>`);

    let secondHeader = '';
    let currentColumn = 2;
    buildingColumns.forEach(column => {
      const types = Array.isArray(column.types) && column.types.length ? column.types : [''];
      if (types.length > 1) {
        types.forEach(type => {
          secondHeader += cell(type,'SubHead',{index:currentColumn});
          currentColumn += 1;
        });
      } else {
        currentColumn += 1;
      }
    });
    [reportTypes, reportTypes, reportTypes, ['F','R']].forEach(typeSet => {
      typeSet.forEach(type => {
        secondHeader += cell(type,'SubHead',{index:currentColumn});
        currentColumn += 1;
      });
    });
    rows.push(`<Row ss:Height="20">${secondHeader}</Row>`);

    matrixRows.forEach(row => {
      let rowXml = cell(row.label,'RowHead');
      buildingColumns.forEach(column => {
        const types = Array.isArray(column.types) && column.types.length ? column.types : [''];
        if (types.length === 1) {
          const value = types[0]
            ? Number(row?.cells?.[column.building]?.[types[0]] || 0)
            : roommaidCloseBuildingCellValue_(row, column, reportTypes);
          rowXml += numberCell(value);
        } else {
          types.forEach(type => { rowXml += numberCell(row?.cells?.[column.building]?.[type]); });
        }
      });
      specialOrder.forEach(bucket => {
        reportTypes.forEach(type => { rowXml += numberCell(row?.specialCells?.[bucket]?.[type]); });
      });
      reportTypes.forEach(type => { rowXml += numberCell(row?.totals?.[type],'Total'); });
      rowXml += numberCell(row?.conversion?.F,'Conversion');
      rowXml += numberCell(row?.conversion?.R,'Conversion');
      rowXml += cell(row?.note || '','Note');
      rows.push(`<Row ss:Height="22">${rowXml}</Row>`);
    });

    rows.push('<Row ss:Height="10"></Row>');
    rows.push(`<Row ss:Height="21">${cell('2. 개인별정비현황','Section',{mergeAcross:columnCount-1})}</Row>`);

    let staffHeader = cell('구분','Head',{mergeDown:1});
    for (let blockIndex = 0; blockIndex < staffLayout.blockCount; blockIndex += 1) {
      staffHeader += cell('성명','Head',{mergeDown:1});
      staffHeader += cell('정비(재실정비)','Head',{mergeAcross:reportTypes.length-1});
      staffHeader += cell('D/S','Head',{mergeAcross:reportTypes.length-1});
    }
    rows.push(`<Row ss:Height="22">${staffHeader}</Row>`);

    let staffSubHeader = '';
    currentColumn = 2;
    for (let blockIndex = 0; blockIndex < staffLayout.blockCount; blockIndex += 1) {
      currentColumn += 1; // 성명 열
      reportTypes.forEach(type => {
        staffSubHeader += cell(type,'SubHead',{index:currentColumn});
        currentColumn += 1;
      });
      reportTypes.forEach(type => {
        staffSubHeader += cell(type,'SubHead',{index:currentColumn});
        currentColumn += 1;
      });
    }
    rows.push(`<Row ss:Height="20">${staffSubHeader}</Row>`);

    for (let rowIndex = 0; rowIndex < staffLayout.rowsPerBlock; rowIndex += 1) {
      let staffRowXml = cell(rowIndex + 1,'Sequence');
      staffLayout.blocks.forEach(block => {
        const row = block[rowIndex];
        if (!row) {
          staffRowXml += cell('','Name');
          reportTypes.forEach(() => { staffRowXml += cell('','Number'); });
          reportTypes.forEach(() => { staffRowXml += cell('','Number'); });
          return;
        }
        const isGroup = String(row.rowType || '') === 'GROUP';
        staffRowXml += cell(row.name || '', isGroup ? 'Group' : 'Name');
        reportTypes.forEach(type => { staffRowXml += numberCell(row?.normal?.[type], isGroup ? 'GroupNumber' : 'Number'); });
        reportTypes.forEach(type => { staffRowXml += numberCell(row?.ds?.[type], isGroup ? 'GroupNumber' : 'Number'); });
      });
      rows.push(`<Row ss:Height="19">${staffRowXml}</Row>`);
    }

    let subtotalXml = cell('소계','Subtotal');
    staffLayout.blocks.forEach(block => {
      const totals = roommaidCloseBlockTotals_(block, reportTypes);
      subtotalXml += cell('','Subtotal');
      reportTypes.forEach(type => { subtotalXml += numberCell(totals.normal[type],'Subtotal'); });
      reportTypes.forEach(type => { subtotalXml += numberCell(totals.ds[type],'Subtotal'); });
    });
    rows.push(`<Row ss:Height="20">${subtotalXml}</Row>`);

    const widths = Array(columnCount).fill(34);
    widths[0] = 58;
    for (let blockIndex = 0; blockIndex < staffLayout.blockCount; blockIndex += 1) {
      const nameIndex = 1 + blockIndex * (1 + reportTypes.length * 2);
      if (nameIndex < widths.length) widths[nameIndex] = 82;
    }
    if (matrixColumnCount - 1 < widths.length) widths[matrixColumnCount - 1] = 84;
    const columns = widths.map(width => `<Column ss:AutoFitWidth="0" ss:Width="${width}"/>`).join('');
    const styles = `
      <Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/><Borders/><Font ss:FontName="맑은 고딕" ss:Size="9"/><Interior/><NumberFormat/><Protection/></Style>
      <Style ss:ID="Section"><Alignment ss:Horizontal="Left" ss:Vertical="Center"/><Font ss:FontName="맑은 고딕" ss:Size="11" ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Head"><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Font ss:FontName="맑은 고딕" ss:Size="9" ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="SubHead"><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Font ss:FontName="맑은 고딕" ss:Size="8" ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Cell"><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="RowHead"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Sequence"><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Name"><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Number"><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Total"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Conversion"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Note"><Alignment ss:Horizontal="Left"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Group"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="GroupNumber"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Dot" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>
      <Style ss:ID="Subtotal"><Alignment ss:Horizontal="Center"/><Font ss:Bold="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>`;
    return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><DocumentProperties xmlns="urn:schemas-microsoft-com:office:office"><Title>NOVA 룸메이드 마감일지 ${excelXmlEscape_(data.businessDate)} ${excelXmlEscape_(data.site)}</Title></DocumentProperties><Styles>${styles}</Styles><Worksheet ss:Name="룸메이드마감"><Table ss:ExpandedColumnCount="${columnCount}" ss:ExpandedRowCount="${rows.length}" x:FullColumns="1" x:FullRows="1">${columns}${rows.join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><PageSetup><Layout x:Orientation="Landscape"/><PageMargins x:Bottom="0.3" x:Left="0.2" x:Right="0.2" x:Top="0.3"/></PageSetup><FitToPage/><Print><FitWidth>1</FitWidth><FitHeight>1</FitHeight><ValidPrinterInfo/></Print><Selected/></WorksheetOptions></Worksheet></Workbook>`;
  }


})();
</script>
