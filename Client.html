  async function saveAdminCodeFromRow_(code, button) { // (기존 코드행 저장)
    const row = document.querySelector(`[data-code-row="${cssEscape_(code)}"]`);
    if (!row) return;
    const payload = {
      group: state.settings.selectedGroup,
      code,
      label: row.querySelector('.code-label-input')?.value.trim(),
      order: row.querySelector('.code-order-input')?.value,
      enabled: row.querySelector('.code-enabled-input')?.value || 'Y',
      note: row.querySelector('.code-note-input')?.value.trim()
    };
    await executeCodeSave_(payload, button);
  }

  async function addAdminCode_() { // (신규 코드 추가)
    const button = $('newCodeAddButton');
    const payload = {
      group: state.settings.selectedGroup,
      code: $('newCodeCode').value.trim(),
      label: $('newCodeLabel').value.trim(),
      order: $('newCodeOrder').value,
      enabled: 'Y',
      note: $('newCodeNote').value.trim()
    };
    await executeCodeSave_(payload, button);
  }

  async function executeCodeSave_(payload, button) { // (코드 저장 공통)
    button.disabled = true;
    try {
      const result = await callServer('saveAdminCodeRow', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '코드를 저장하지 못했습니다.');
      showToast(result.message || '코드를 저장했습니다.');
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '코드 저장 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function loadUserAccountSettings_(options = {}) { // (사용자계정 등록자료 조회)
    if (state.settings.userAccountsLoading && !options.force) return;
    state.settings.userAccountsLoading = true;
    try {
      const result = await callServer('getAdminUserAccountRegistrationData', state.token);
      if (!result?.ok) throw new Error(result?.message || '사용자계정을 불러오지 못했습니다.');
      state.settings.userAccountsData = result;
      state.settings.userAccountsLoaded = true;
      if (state.activeMenu === 'settings' && state.settings.tab === 'users') renderUserAccountSettingsData_();
    } catch (error) {
      if ($('userAccountTableBody')) $('userAccountTableBody').innerHTML = `<tr><td colspan="9" class="table-empty error">${escapeHtml(error?.message || '사용자계정 조회 오류')}</td></tr>`;
      showToast(error?.message || '사용자계정 조회 오류');
    } finally {
      state.settings.userAccountsLoading = false;
    }
  }

  function filteredUserAccountSettingsUsers_() { // (등록계정 이름·채용구분 필터 적용)
    const users = state.settings.userAccountsData?.users || [];
    const nameQuery = String(state.settings.userAccountNameFilter || '').trim().toLocaleLowerCase('ko-KR');
    const employmentFilter = String(state.settings.userAccountEmploymentFilter || '').trim();
    return users.filter(user => {
      const name = String(user.name || '').trim().toLocaleLowerCase('ko-KR');
      if (nameQuery && !name.includes(nameQuery)) return false;
      const employmentCategory = String(user.employmentCategory || '정규직').trim();
      if (employmentFilter && employmentCategory !== employmentFilter) return false;
      return true;
    });
  }

      const location = [user.defaultSite, buildings].filter(Boolean).join(' · ') || '-';
      const employmentCategory = user.employmentCategory || '정규직';
      const employmentVendor = user.employmentVendor || '';
      const employmentNote = user.employmentInferred ? '<small>기존 정보 기준 자동판정</small>' : '';
      const canManage = user.canManage !== false;
      const manageButtons = canManage
        ? `<button type="button" data-user-account-edit>수정</button>

           ${user.canDelete ? '<button type="button" data-user-account-delete>삭제</button>' : ''}`
        : '<small>관리자 전용</small>';
      return `<tr class="${user.enabled ? '' : 'disabled-row'}" data-user-account-row="${escapeAttr(user.employeeNo)}">
        <td><strong>${escapeHtml(user.employeeNo)}</strong></td>
        <td style="min-width:120px;width:120px"><strong style="display:block;white-space:nowrap">${escapeHtml(user.name)}</strong><small style="display:block;margin-top:3px;white-space:nowrap">${escapeHtml(user.job || '-')}</small></td>
        <td>
          <select data-user-employment-category style="min-width:96px"${canManage ? '' : ' disabled'}>
            <option value="정규직"${employmentCategory === '정규직' ? ' selected' : ''}>정규직</option>
            <option value="아르바이트"${employmentCategory === '아르바이트' ? ' selected' : ''}>아르바이트</option>
            <option value="외주업체"${employmentCategory === '외주업체' ? ' selected' : ''}>외주업체</option>
          </select>
          <input data-user-employment-vendor maxlength="40" value="${escapeAttr(employmentVendor)}" placeholder="업체명"${canManage ? '' : ' disabled'} style="min-width:90px;${employmentCategory === '외주업체' ? '' : 'display:none'}">
          ${employmentNote}
        </td>
        <td>${escapeHtml(user.role || '-')}</td>
        <td>${enabledText}</td>
        <td>${escapeHtml(location)}</td>
        <td>${escapeHtml(telegramText)}</td>
        <td>${escapeHtml(user.updatedAt || '-')}</td>
        <td><div class="code-row-actions">${canManage ? '<button type="button" data-user-employment-save>채용구분 저장</button>' : ''}${manageButtons}</div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" class="table-empty">${hasFilter ? '조건에 맞는 등록계정이 없습니다.' : '등록된 사용자계정이 없습니다.'}</td></tr>`;

    document.querySelectorAll('[data-user-employment-category]').forEach(select => {
      select.addEventListener('change', () => toggleUserAccountEmploymentVendorRow_(select.closest('[data-user-account-row]')));
    });
    document.querySelectorAll('[data-user-employment-save]').forEach(button => {
      button.addEventListener('click', () => updateUserAccountEmploymentType_(button));
    });
    document.querySelectorAll('[data-user-account-edit]').forEach(button => {
      button.addEventListener('click', () => beginUserAccountEdit_(button));
    });
    document.querySelectorAll('[data-user-account-enabled]').forEach(button => {
      button.addEventListener('click', () => toggleUserAccountEnabled_(button));
    });
    document.querySelectorAll('[data-user-account-delete]').forEach(button => {
      button.addEventListener('click', () => deleteUserAccountFromSettings_(button));
    });
  }

  function toggleUserAccountEmploymentVendorField_() { // (신규 계정 외주업체명 입력 표시)
    const category = String($('userAccountEmploymentCategory')?.value || '정규직');
    const field = $('userAccountEmploymentVendorField');
    if (field) field.style.display = category === '외주업체' ? '' : 'none';
    if (category !== '외주업체' && $('userAccountEmploymentVendor')) $('userAccountEmploymentVendor').value = '';
  }

  function toggleUserAccountEmploymentVendorRow_(row) { // (기존 계정 외주업체명 입력 표시)
    if (!row) return;
    const category = String(row.querySelector('[data-user-employment-category]')?.value || '정규직');
    const vendor = row.querySelector('[data-user-employment-vendor]');
    if (!vendor) return;
    vendor.style.display = category === '외주업체' ? '' : 'none';
    if (category !== '외주업체') vendor.value = '';

  async function updateUserAccountEmploymentType_(button) { // (기존 계정 채용구분 저장)
    const row = button.closest('[data-user-account-row]');
    if (!row) return;
    const payload = {
      employeeNo: row.dataset.userAccountRow,
      employmentCategory: row.querySelector('[data-user-employment-category]')?.value || '정규직',
      employmentVendor: row.querySelector('[data-user-employment-vendor]')?.value.trim() || ''
    };
    button.disabled = true;
    try {
      const result = await callServer('updateAdminUserEmploymentType', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '채용구분을 저장하지 못했습니다.');
      showToast(result.message || '채용구분을 저장했습니다.');
      state.settings.userAccountsLoaded = false;
      invalidateUserAccountDependentClientCaches_();
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '채용구분 저장 오류');
    } finally {
      button.disabled = false;
    }
  }

  function beginUserAccountEdit_(button) { // (기존 사용자계정 수정폼 불러오기)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canManage === false) return showToast('이 계정은 현재 권한으로 수정할 수 없습니다.');
    const employeeInput = $('userAccountEmployeeNo');
    const saveButton = $('userAccountCreateButton');
    employeeInput.value = user.employeeNo || '';
    employeeInput.disabled = true;
    $('userAccountName').value = user.name || '';
    $('userAccountJob').value = user.job || '';
    $('userAccountEmploymentCategory').value = user.employmentCategory || '정규직';
    $('userAccountEmploymentVendor').value = user.employmentVendor || '';
    toggleUserAccountEmploymentVendorField_();
    $('userAccountRole').value = user.role || '';
    $('userAccountEnabled').value = user.enabled ? 'Y' : 'N';
    $('userAccountTelegramEnabled').value = user.telegramEnabled ? 'Y' : 'N';
    $('userAccountPhone').value = user.phone || '';
    $('userAccountDefaultSite').value = user.defaultSite || '';
    $('userAccountDefaultBuildings').value = Array.isArray(user.defaultBuildings) ? user.defaultBuildings.join(',') : String(user.defaultBuildings || '');
    $('userAccountNote').value = user.note || '';
    saveButton.dataset.editEmployeeNo = user.employeeNo;
    saveButton.textContent = '변경 저장';
    $('userAccountEditCancelButton').style.display = '';
    document.querySelector('.operation-form-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function toggleUserAccountEnabled_(button) { // (사용자계정 사용·사용중지 즉시 전환)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canManage === false) return showToast('이 계정은 현재 권한으로 변경할 수 없습니다.');
    const nextEnabled = user.enabled ? 'N' : 'Y';
    const actionText = nextEnabled === 'Y' ? '사용 상태로 전환' : '사용중지';
    if (!window.confirm(`${user.name}(${employeeNo}) 계정을 ${actionText}할까요?`)) return;
    button.disabled = true;
    try {
      const result = await callServer('setAdminUserAccountEnabled', state.token, { employeeNo, enabled: nextEnabled });
      if (!result?.ok) throw new Error(result?.message || '사용상태를 변경하지 못했습니다.');
      showToast(result.message || '사용상태를 변경했습니다.');
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '사용상태 변경 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function deleteUserAccountFromSettings_(button) { // (이력 없는 사용중지 계정 영구삭제)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canDelete !== true) return showToast('사용중지된 미사용 계정만 삭제할 수 있습니다.');
    if (!window.confirm(`${user.name}(${employeeNo}) 계정을 영구삭제할까요?\n\n객실 배정 또는 과거 업무이력이 있는 계정은 안전을 위해 서버에서 삭제가 차단됩니다.`)) return;
    button.disabled = true;
    try {
      const result = await callServer('deleteAdminUserAccount', state.token, { employeeNo });
      if (!result?.ok) throw new Error(result?.message || '사용자계정을 삭제하지 못했습니다.');
      showToast(result.message || '미사용 계정을 삭제했습니다.');
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '사용자계정 삭제 오류');
    } finally {
      button.disabled = false;
    }
  }

  function invalidateUserAccountDependentClientCaches_() { // (직원 등록·수정 즉시 후속 화면 직원목록 재조회)
    state.indicator.loaded = false;
    state.shifts.loaded = false;
    state.roommaidStats.loaded = false;
    state.roommaidClose.loaded = false;
    state.roommaidClose.data = null;
  }

  function suggestUserAccountRoleFromJob_() { // (직무명 기준 권한 자동 제안)
    const roleSelect = $('userAccountRole');
    if (!roleSelect || roleSelect.value) return;
    const job = String($('userAccountJob')?.value || '').trim().toUpperCase();
    let role = '';
    if (job.includes('관리자') || job.includes('ADMIN')) role = 'ADMIN';
    else if (job.includes('오더') || job.includes('ORDER')) role = 'ORDER';
    else if (job === 'QM' || job.includes('퀄리티')) role = 'QM';
    else if (job.includes('하우스맨') || job.includes('HOUSEMAN')) role = 'HOUSEMAN';
    else if (job.includes('룸메이드') || job.includes('ROOMMAID')) role = 'ROOMMAID';
    else if (job.includes('퍼블릭') || job.includes('PUBLIC')) role = 'PUBLIC';
    if (role && Array.from(roleSelect.options).some(option => option.value === role)) roleSelect.value = role;
  }

  async function createUserAccountFromSettings_() { // (사용자계정 신규 등록·기존정보 수정 실행)
    const button = $('userAccountCreateButton');
    const editingEmployeeNo = String(button.dataset.editEmployeeNo || '').trim();
    const payload = {
      employeeNo: editingEmployeeNo || $('userAccountEmployeeNo').value.trim(),
      name: $('userAccountName').value.trim(),
      job: $('userAccountJob').value.trim(),
      employmentCategory: $('userAccountEmploymentCategory').value,
      employmentVendor: $('userAccountEmploymentVendor').value.trim(),
      role: $('userAccountRole').value,
      enabled: $('userAccountEnabled').value,
      telegramEnabled: $('userAccountTelegramEnabled').value,
      phone: $('userAccountPhone').value.trim(),
      defaultSite: $('userAccountDefaultSite').value,
      defaultBuildings: $('userAccountDefaultBuildings').value.trim(),
      note: $('userAccountNote').value.trim()
    };

    button.disabled = true;
    button.textContent = editingEmployeeNo ? '수정 중…' : '등록 중…';
    try {
      const method = editingEmployeeNo ? 'updateAdminUserAccount' : 'createAdminUserAccount';
      const result = await callServer(method, state.token, payload);
      if (!result?.ok) throw new Error(result?.message || (editingEmployeeNo ? '사용자계정을 수정하지 못했습니다.' : '사용자계정을 등록하지 못했습니다.'));
      showToast(result.message || (editingEmployeeNo ? '사용자계정을 수정했습니다.' : '사용자계정을 등록했습니다.'));
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || (editingEmployeeNo ? '사용자계정 수정 오류' : '사용자계정 등록 오류'));
    } finally {
      button.disabled = false;
      button.textContent = button.dataset.editEmployeeNo ? '변경 저장' : '사용자 등록';
    }
  }

  function clearUserAccountSettingsForm_() { // (사용자계정 신규등록 모드로 입력 초기화)
    ['userAccountEmployeeNo', 'userAccountName', 'userAccountJob', 'userAccountEmploymentVendor', 'userAccountPhone', 'userAccountDefaultBuildings', 'userAccountNote']
      .forEach(id => { if ($(id)) $(id).value = ''; });
    if ($('userAccountEmployeeNo')) $('userAccountEmployeeNo').disabled = false;
    if ($('userAccountEmploymentCategory')) $('userAccountEmploymentCategory').value = '정규직';
    toggleUserAccountEmploymentVendorField_();
    if ($('userAccountRole')) $('userAccountRole').value = '';
    if ($('userAccountEnabled')) $('userAccountEnabled').value = 'Y';
    if ($('userAccountTelegramEnabled')) $('userAccountTelegramEnabled').value = 'Y';
    if ($('userAccountDefaultSite')) $('userAccountDefaultSite').value = state.settings.userAccountsData?.defaultSite || '';
    const saveButton = $('userAccountCreateButton');
    if (saveButton) {
      delete saveButton.dataset.editEmployeeNo;
      saveButton.textContent = '사용자 등록';
    }
    if ($('userAccountEditCancelButton')) $('userAccountEditCancelButton').style.display = 'none';
  }

      </section>`;

  async function loadTelegramSettings_() { // (텔레그램 직원 연결현황 조회)
    if (state.settings.telegramLoading) return;
    state.settings.telegramLoading = true;
    try {
      const result = await callServer('getTelegramConnectionAdminData', state.token);
      if (!result?.ok) throw new Error(result?.message || '텔레그램 연결현황을 불러오지 못했습니다.');
      state.settings.telegramData = result;
      state.settings.telegramLoaded = true;
      if (state.activeMenu === 'settings' && state.settings.tab === 'telegram') renderTelegramSettingsData_();
    } catch (error) {
      if ($('telegramUserTableBody')) $('telegramUserTableBody').innerHTML = `<tr><td colspan="6" class="table-empty error">${escapeHtml(error?.message || '조회 오류')}</td></tr>`;
      showToast(error?.message || '텔레그램 연결현황 조회 오류');
    } finally {
      state.settings.telegramLoading = false;
    }
  }

  function renderTelegramSettingsData_() { // (텔레그램 연결현황 표시)
    const data = state.settings.telegramData || {};
    if (!$('telegramSetupSummary')) return;
    const linkedCount = (data.users || []).filter(user => user.telegramLinked).length;
    const waitingCount = (data.users || []).filter(user => user.enabled && !user.telegramLinked).length;
    $('telegramSetupSummary').innerHTML = `
      <div class="telegram-summary-card"><span>봇</span><strong>${data.botUsername ? `@${escapeHtml(data.botUsername)}` : '미설정'}</strong></div>
      <div class="telegram-summary-card"><span>웹훅</span><strong>${data.webhookUrl ? '연결됨' : '미설정'}</strong><small>${escapeHtml(data.webhookSetAt || '')}</small></div>
      <div class="telegram-summary-card"><span>연결완료</span><strong>${linkedCount.toLocaleString('ko-KR')}명</strong></div>
      <div class="telegram-summary-card"><span>연결대기</span><strong>${waitingCount.toLocaleString('ko-KR')}명</strong></div>`;

    const users = data.users || [];
    $('telegramUserTableBody').innerHTML = users.length ? users.map(user => {
      const statusClass = user.telegramLinked ? 'linked' : (user.enabled ? 'waiting' : 'disabled');
      const linkButton = user.connectionLink ? `<button type="button" class="table-action" data-copy-telegram-link="${escapeAttr(user.connectionLink)}">링크 복사</button>` : '<span class="muted">초기 설정 필요</span>';
      const testButton = user.telegramLinked && user.role !== 'PUBLIC' ? `<button type="button" class="table-action" data-test-telegram="${escapeAttr(user.employeeNo)}">테스트</button>` : '';
      return `<tr><td><strong>${escapeHtml(user.employeeNo)}</strong></td><td><strong>${escapeHtml(user.name)}</strong><small>${escapeHtml(user.job || user.role || '-')}</small></td><td><span class="telegram-link-status ${statusClass}">${escapeHtml(user.connectionStatus || (user.telegramLinked ? '연결완료' : '연결대기'))}</span><small>${escapeHtml(user.linkedAt || '')}</small></td><td>${escapeHtml(user.telegramId || '-')}</td><td>${linkButton}</td><td><div class="telegram-row-actions">${testButton}<button type="button" class="table-action danger" data-reset-telegram="${escapeAttr(user.employeeNo)}">재연결</button></div></td></tr>`;
    }).join('') : '<tr><td colspan="6" class="table-empty">사용자계정에 등록된 직원이 없습니다.</td></tr>';
    document.querySelectorAll('[data-copy-telegram-link]').forEach(button => button.addEventListener('click', () => copyTelegramLink_(button.dataset.copyTelegramLink)));
    document.querySelectorAll('[data-test-telegram]').forEach(button => button.addEventListener('click', () => testTelegramConnection_(button.dataset.testTelegram, button)));
    document.querySelectorAll('[data-reset-telegram]').forEach(button => button.addEventListener('click', () => resetTelegramConnection_(button.dataset.resetTelegram, button)));
  }

  async function copyTelegramLink_(link) { // (개인 연결링크 복사)
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(link);
      else {
        const textarea = document.createElement('textarea');
        textarea.value = link;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      showToast('개인 연결링크를 복사했습니다.');
    } catch (error) {
      showToast('연결링크를 복사하지 못했습니다.');
    }
  }

  function novaMonthlyComposeHangulKeys_(rawText) { // (영문키를 두벌식 한글 음절로 조합)
    const raw = String(rawText || '');
    if (!raw) return '';
    const L = { r:0,R:1,s:2,e:3,E:4,f:5,a:6,q:7,Q:8,t:9,T:10,d:11,w:12,W:13,c:14,z:15,x:16,v:17,g:18 };
    const LJ = { r:'ㄱ',R:'ㄲ',s:'ㄴ',e:'ㄷ',E:'ㄸ',f:'ㄹ',a:'ㅁ',q:'ㅂ',Q:'ㅃ',t:'ㅅ',T:'ㅆ',d:'ㅇ',w:'ㅈ',W:'ㅉ',c:'ㅊ',z:'ㅋ',x:'ㅌ',v:'ㅍ',g:'ㅎ' };
    const V = { k:0,o:1,i:2,O:3,j:4,p:5,u:6,P:7,h:8,hk:9,ho:10,hl:11,y:12,n:13,nj:14,np:15,nl:16,b:17,m:18,ml:19,l:20 };
    const VJ = { k:'ㅏ',o:'ㅐ',i:'ㅑ',O:'ㅒ',j:'ㅓ',p:'ㅔ',u:'ㅕ',P:'ㅖ',h:'ㅗ',hk:'ㅘ',ho:'ㅙ',hl:'ㅚ',y:'ㅛ',n:'ㅜ',nj:'ㅝ',np:'ㅞ',nl:'ㅟ',b:'ㅠ',m:'ㅡ',ml:'ㅢ',l:'ㅣ' };
    const T = { r:1,R:2,rt:3,s:4,sw:5,sg:6,e:7,f:8,fr:9,fa:10,fq:11,ft:12,fx:13,fv:14,fg:15,a:16,q:17,qt:18,t:19,T:20,d:21,w:22,c:23,z:24,x:25,v:26,g:27 };
    const V_COMBINE = { 'h|k':'hk','h|o':'ho','h|l':'hl','n|j':'nj','n|p':'np','n|l':'nl','m|l':'ml' };
    const T_COMBINE = { 'r|t':'rt','s|w':'sw','s|g':'sg','f|r':'fr','f|a':'fa','f|q':'fq','f|t':'ft','f|x':'fx','f|v':'fv','f|g':'fg','q|t':'qt' };
    const normalizeKey = key => {
      if (Object.prototype.hasOwnProperty.call(L, key) || Object.prototype.hasOwnProperty.call(V, key)) return key;
      const lower = String(key || '').toLowerCase();
      return Object.prototype.hasOwnProperty.call(L, lower) || Object.prototype.hasOwnProperty.call(V, lower) ? lower : key;
    };
    const chars = Array.from(raw, normalizeKey);
    let out = '';
    let l = '';
    let v = '';
    let t = '';
    const syllable = (lk, vk, tk = '') => {
      if (!lk && vk) return VJ[vk] || vk;
      if (lk && !vk) return LJ[lk] || lk;
      if (!Object.prototype.hasOwnProperty.call(L, lk) || !Object.prototype.hasOwnProperty.call(V, vk)) {
        return `${LJ[lk] || lk}${VJ[vk] || vk}${tk ? (LJ[tk] || tk) : ''}`;
      }
      const finalIndex = tk && Object.prototype.hasOwnProperty.call(T, tk) ? T[tk] : 0;
      return String.fromCharCode(0xAC00 + ((L[lk] * 21 + V[vk]) * 28) + finalIndex);
    };
    const flush = () => {
      if (l || v) out += syllable(l, v, t);
      l = ''; v = ''; t = '';
    };

    chars.forEach(key => {
      const vowel = Object.prototype.hasOwnProperty.call(V, key);
      const consonant = Object.prototype.hasOwnProperty.call(L, key);
      if (!vowel && !consonant) {
        flush();
        out += key;
        return;
      }

      if (vowel) {
        if (!l) {
          if (!v) { v = key; return; }
          const combined = V_COMBINE[`${v}|${key}`] || '';
          if (combined) { v = combined; return; }
          flush();
          v = key;
          return;
        }
        if (!v) { v = key; return; }
        if (t) {
          let remainFinal = '';
          let movedInitial = t;
          if (t.length === 2) {
            remainFinal = t.charAt(0);
            movedInitial = t.charAt(1);
          }
          out += syllable(l, v, remainFinal);
          l = Object.prototype.hasOwnProperty.call(L, movedInitial) ? movedInitial : '';
          v = key;
          t = '';
          return;
        }
        const combined = V_COMBINE[`${v}|${key}`] || '';
        if (combined) { v = combined; return; }
        flush();
        v = key;
        return;
      }

      if (!l) {
        if (v) flush();
        l = key;
        return;
      }
      if (!v) {
        flush();
        l = key;
        return;
      }
      if (!t) {
        if (Object.prototype.hasOwnProperty.call(T, key)) {
          t = key;
        } else {
          flush();
          l = key;
        }
        return;
      }
      const compound = T_COMBINE[`${t}|${key}`] || '';
      if (compound) {
        t = compound;
      } else {
        flush();
        l = key;
      }
    });
    flush();
    return out;
  }

  function bindMonthlyKoreanItemInput_(input) { // (품목 영문키 입력도 한글로 자동변환)
    if (!input || input.dataset.novaKoreanBound === 'Y') return;
    input.dataset.novaKoreanBound = 'Y';
    input.setAttribute('lang', 'ko');
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'none');
    input.spellcheck = false;

    let rawKeys = '';
    let segmentStart = 0;
    let segmentEnd = 0;
    let internalChange = false;
    const reset = () => { rawKeys = ''; segmentStart = 0; segmentEnd = 0; };
    const renderRaw = () => {
      const composed = novaMonthlyComposeHangulKeys_(rawKeys);
      internalChange = true;
      input.setRangeText(composed, segmentStart, segmentEnd, 'end');
      internalChange = false;
      segmentEnd = segmentStart + composed.length;
    };

    input.addEventListener('compositionstart', reset);
    input.addEventListener('input', () => { if (!internalChange) reset(); });
    input.addEventListener('mousedown', reset);
    input.addEventListener('blur', reset);
    input.addEventListener('keydown', event => {
      if (event.isComposing || event.key === 'Process' || event.ctrlKey || event.metaKey || event.altKey) return;
      const selectionStart = Number(input.selectionStart ?? input.value.length);
      const selectionEnd = Number(input.selectionEnd ?? selectionStart);
      if (/^[A-Za-z]$/.test(event.key)) {
        if (!rawKeys || selectionStart !== segmentEnd || selectionEnd !== segmentEnd) {
          rawKeys = '';
          segmentStart = selectionStart;
          segmentEnd = selectionEnd;
        }
        event.preventDefault();
        rawKeys += event.key;
        renderRaw();
        return;
      }
      if (event.key === 'Backspace' && rawKeys && selectionStart === segmentEnd && selectionEnd === segmentEnd) {
        event.preventDefault();
        rawKeys = rawKeys.slice(0, -1);
        renderRaw();
        if (!rawKeys) reset();
        return;
      }
      reset();
    });
    input.addEventListener('paste', event => {
      const text = String(event.clipboardData?.getData('text') || '');
      if (!text || !/^[A-Za-z]+$/.test(text)) return;
      event.preventDefault();
      reset();
      const start = Number(input.selectionStart ?? input.value.length);
      const end = Number(input.selectionEnd ?? start);
      const converted = novaMonthlyComposeHangulKeys_(text);
      input.setRangeText(converted, start, end, 'end');
    });
  }

  function monthlyHousemanAssignmentKey_(payload) {
    return [payload?.businessDate, payload?.site, payload?.roomNo].map(value => String(value || '').trim()).join('|');
  }

  async function resolveMonthlyHousemanAutoAssignment_(payload) { // (입력 중 자동배정 후보 선조회·캐시)
    const key = monthlyHousemanAssignmentKey_(payload);
    if (!payload?.businessDate || !payload?.site || !/^\d{4}$/.test(String(payload?.roomNo || '').trim())) {
      throw new Error('자동배정 확인을 위해 사업장과 4자리 객실번호를 확인하세요.');
    }
    if (novaMonthlyHousemanAssignmentCache_.has(key)) {
      return await novaMonthlyHousemanAssignmentCache_.get(key);
    }
    const promise = callServer('getMonthlyHousemanAutoAssignment', state.token, {
      businessDate: payload.businessDate,
      site: payload.site,
      roomNo: payload.roomNo
    }).then(result => {
      if (!result?.ok || !result.assignment?.employeeNo) {
        throw new Error('담당 하우스맨 자동배정 정보를 확인할 수 없습니다.');
      }
      return result.assignment;
    }).catch(error => {
      novaMonthlyHousemanAssignmentCache_.delete(key);
      throw error;
    });
    novaMonthlyHousemanAssignmentCache_.set(key, promise);
    return await promise;
  }

  function queueMonthlyHousemanAssignmentPreload_() { // (객실번호 입력 중 서버후보를 미리 준비)
    window.clearTimeout(novaMonthlyHousemanAssignmentTimer_);
    novaMonthlyHousemanAssignmentTimer_ = window.setTimeout(() => {
      const mode = String($('monthlyOrderAssignmentMode')?.value || '').toUpperCase();
      const payload = {
        businessDate: String($('monthlyOrderDate')?.value || '').trim(),
        site: String($('monthlyOrderSite')?.value || '').trim(),
        roomNo: String($('monthlyOrderRoomNo')?.value || '').trim()
      };
      if (mode !== 'AUTO' || !/^\d{4}$/.test(payload.roomNo) || !payload.site) return;
      void resolveMonthlyHousemanAutoAssignment_(payload).catch(error => {
        console.warn('월별조회 하우스맨 자동배정 사전조회:', error?.message || error);
      });
    }, 120);
  }

  async function novaMonthlyRealtimeCreateHousemanOrder_(payload, assignment) { // (월별조회 PostgreSQL 선등록)
    if (!novaRealtimeIsEnabled_()) throw new Error('Realtime이 비활성화되어 있습니다.');
    const orderId = novaRealtimeHousemanOrderId_(payload.businessDate);
    const requestId = novaRealtimeRequestId_('HOUSEMAN_CREATE', payload.roomNo);
    const currentShift = String(assignment?.currentShift || '').trim().toUpperCase();
    const apiPayload = Object.assign({}, payload, {
      orderId,
      requestId,
      assignment: assignment || {},
      handoverTargetShift: payload.handover ? novaRealtimeNextShift_(currentShift) : ''
    });
    const result = await novaRealtimeFetch_('/v1/houseman-orders', {
      method: 'POST',
      headers: { 'X-Request-Id': requestId },
      body: JSON.stringify(apiPayload)
    });
    const order = novaRealtimeMapHousemanOrder_(result.order) || result.order;
    if (!order?.orderId) throw new Error('Realtime 오더 저장 응답이 올바르지 않습니다.');
    return {
      order,
      orderId,
      requestId,
      assignment,
      timing: result.timing || {},
      mirrorPayload: Object.assign({}, payload, {
        realtimeOrderId: orderId,
        realtimeAssignmentSnapshot: assignment
      })
    };
  }

  function monthlyHousemanRealtimeItem_(order, payload) { // (DB확정 오더를 현재 이력표에 즉시 추가)
    const assignedEmployeeNo = String(order?.assignedEmployeeNo || '').trim();
    const assignedName = String(order?.assignedName || '').trim();
    const itemSummary = String(order?.itemSummary || (payload.items || []).map(item => item.quantity > 1 ? `${item.name}×${item.quantity}` : item.name).join(', '));
    const part = String(order?.part || payload.part || '');
    const note = String(order?.note || payload.note || '');
    return {
      rowNumber: 0,
      recordId: String(order?.orderId || ''),
      typeCode: 'HOUSEMAN',
      typeLabel: '하우스맨',
      businessDate: String(order?.businessDate || payload.businessDate || ''),
      site: String(order?.site || payload.site || ''),
      roomNo: String(order?.roomNo || payload.roomNo || ''),
      employeeNos: assignedEmployeeNo ? [assignedEmployeeNo] : [],
      employeeNo: assignedEmployeeNo,
      employeeName: assignedName || assignedEmployeeNo || '-',
      employeeDisplay: assignedEmployeeNo ? `${assignedName || assignedEmployeeNo} (${assignedEmployeeNo})` : '-',
      registeredByEmployeeNo: String(state.bootstrap?.user?.employeeNo || ''), // MONTHLY_HOUSEMAN_COLUMNS_V1
      registeredByName: String(state.bootstrap?.user?.name || state.bootstrap?.user?.employeeNo || '-'),

  function insertMonthlyHousemanRealtimeItem_(order, payload) { // (기존 리스트 유지·신규 1건만 즉시 추가)
    if (state.activeMenu !== 'monthly' || state.monthly.period !== 'DAILY' || String(state.monthly.type || '').toUpperCase() !== 'HOUSEMAN') return;
    if (Number(state.monthly.page || 1) !== 1 || !state.monthly.data) return;
    const item = monthlyHousemanRealtimeItem_(order, payload);
    if (String(state.monthly.date || '') && item.businessDate !== String(state.monthly.date || '')) return;
    if (String(state.monthly.site || '') && item.site !== String(state.monthly.site || '')) return;
    if (String(state.monthly.employeeNo || '') && !item.employeeNos.includes(String(state.monthly.employeeNo || ''))) return;
    const statusFilter = String(state.monthly.status || '').trim();
    if (statusFilter && statusFilter !== '전체' && ![item.statusCode, item.statusLabel, '진행중'].includes(statusFilter)) return;
    const search = String(state.monthly.search || '').trim().toLowerCase();
    if (search) {
      const text = [item.roomNo, item.site, item.employeeDisplay, item.detailText, item.requester].join(' ').toLowerCase();
      if (!text.includes(search)) return;
    }
    const currentItems = Array.isArray(state.monthly.data.items) ? state.monthly.data.items : [];
    state.monthly.data.items = [item, ...currentItems.filter(row => String(row.recordId || '') !== item.recordId)].slice(0, 100);
    if (state.monthly.data.pagination) {
      state.monthly.data.pagination = Object.assign({}, state.monthly.data.pagination, {
        total: Number(state.monthly.data.pagination.total || 0) + (currentItems.some(row => String(row.recordId || '') === item.recordId) ? 0 : 1)
      });
    }
    renderMonthlyTable_(state.monthly.data.items);
    renderMonthlyPagination_(state.monthly.data.pagination || { page: 1, pageCount: 1, total: state.monthly.data.items.length });
  }

  async function novaMonthlyRealtimeCancelHousemanOrder_(orderId) { // (DB등록취소 선확정)
    const requestId = novaRealtimeRequestId_('HOUSEMAN_CANCEL', orderId);

  const novaMonthlyHousemanOptionPreload_ = { promise: null };

  function monthlyHousemanOptionSnapshot_() { // (월별조회 하우스맨 등록창 옵션 메모리 스냅샷)
    const options = state.monthly.data?.options || {};
    return {
      sites: Array.isArray(options.sites) ? options.sites.slice() : [],
      parts: Array.isArray(options.orderParts) ? options.orderParts.slice() : [],
      items: Array.isArray(options.orderItems) ? options.orderItems.slice() : [],
      housemen: Array.isArray(options.housemen) ? options.housemen.slice() : [] // MONTHLY_HOUSEMAN_MANAGEMENT_V1
    };
  }

  function mergeMonthlyHousemanOrderOptions_(fallback) { // (서버 코드옵션을 현재 월별조회 상태에 병합)
    const current = monthlyHousemanOptionSnapshot_();
    const sites = Array.from(new Set([
      ...current.sites,
      ...(Array.isArray(fallback?.sites) ? fallback.sites : [])
    ].map(value => String(value || '').trim()).filter(Boolean)));
    const parts = Array.isArray(fallback?.orderParts) && fallback.orderParts.length
      ? fallback.orderParts.slice()
      : current.parts;
    const items = Array.isArray(fallback?.orderItems) && fallback.orderItems.length
      ? fallback.orderItems.slice()
      : current.items;
    const housemen = Array.isArray(fallback?.housemen) && fallback.housemen.length
      ? fallback.housemen.slice()
      : current.housemen;
    if (state.monthly.data) {
      state.monthly.data.options = Object.assign({}, state.monthly.data.options || {}, {
        sites,
        orderParts: parts,
        orderItems: items,
        housemen
      });
    }
    return { sites, parts, items, housemen }; // MONTHLY_HOUSEMAN_MANAGEMENT_V1
  }

  function preloadMonthlyHousemanOrderOptions_() { // (하우스맨 화면 진입 즉시 파트·품목 백그라운드 사전조회)
    const current = monthlyHousemanOptionSnapshot_();
    if (current.parts.length && current.items.length && current.sites.length) {
      return Promise.resolve(current);
    }
    if (novaMonthlyHousemanOptionPreload_.promise) return novaMonthlyHousemanOptionPreload_.promise;
    const promise = callServer('getMonthlyHousemanOrderOptions', state.token)
      .then(result => {
        if (!result?.ok) throw new Error(result?.message || '하우스맨 등록 옵션을 불러오지 못했습니다.');
        return mergeMonthlyHousemanOrderOptions_(result);
      })
      .finally(() => {
        if (novaMonthlyHousemanOptionPreload_.promise === promise) {
          novaMonthlyHousemanOptionPreload_.promise = null;
        }
      });
    novaMonthlyHousemanOptionPreload_.promise = promise;
    return promise;
  }

  function applyMonthlyHousemanOptionsToOpenModal_(resolved) { // (이미 열린 등록창에 옵션만 비동기 채움)
    if (!$('monthlyOrderPart') || !$('monthlyOrderItem')) return;
    const parts = Array.isArray(resolved?.parts) ? resolved.parts : [];
    const items = Array.isArray(resolved?.items) ? resolved.items : [];
    const sites = Array.isArray(resolved?.sites) ? resolved.sites : [];

    const partSelect = $('monthlyOrderPart');
    const selectedPart = String(partSelect.value || '');
    partSelect.innerHTML = `<option value="">선택</option>${parts.map(part => {

      return `<option value="${escapeAttr(value)}">${escapeHtml(value)}</option>`;
    }).join('')}`;
    if (selectedPart && parts.some(part => String(part?.label || part?.code || '').trim() === selectedPart)) {
      partSelect.value = selectedPart;
    }

      datalist.innerHTML = items.map(item => {

    if (siteSelect) {

      siteSelect.innerHTML = `<option value="">사업장 선택</option>${sites.map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`).join('')}`;
      if (selectedSite && sites.includes(selectedSite)) siteSelect.value = selectedSite;
      siteSelect.disabled = false;

  async function submitMonthlyHousemanOrder_() { // (월별조회 하우스맨 오더 등록·DB 선확정)
    const button = $('monthlyOrderSubmit');
    if (!button) return;
    const payload = {
      businessDate: String($('monthlyOrderDate')?.value || state.monthly.date || '').trim(),
      site: String($('monthlyOrderSite')?.value || state.monthly.site || '').trim(),
      roomNo: String($('monthlyOrderRoomNo')?.value || '').trim(),
      part: String($('monthlyOrderPart')?.value || '').trim(),
      items: [{ name: String($('monthlyOrderItem')?.value || '').trim(), quantity: clampQuantity($('monthlyOrderQty')?.value) }],
      note: String($('monthlyOrderNote')?.value || '').trim(),
      requester: String($('monthlyOrderRequester')?.value || '오더테이커'),
      requestSource: 'MONTHLY_HISTORY',
      assignmentMode: String($('monthlyOrderAssignmentMode')?.value || 'AUTO'),
      important: Boolean($('monthlyOrderImportant')?.checked),
      handover: Boolean($('monthlyOrderHandover')?.checked)
    };
    if (!payload.businessDate) return showToast('업무일자를 선택하세요.');
    if (!payload.site) return showToast('사업장을 선택하세요.');
    if (!payload.roomNo) return showToast('객실번호를 입력하세요.');
    if (!payload.part) return showToast('파트를 선택하세요.');
    if (!payload.items[0].name) return showToast('품목을 입력하세요.');

    const original = button.textContent;
    const clickedAt = performance.now();
    button.disabled = true;
    button.textContent = '등록 중…';
    try {
      let realtimeFallbackReason = '';
      let assignment = null;
      if (String(payload.assignmentMode || '').toUpperCase() === 'AUTO') {
        assignment = await resolveMonthlyHousemanAutoAssignment_(payload);
      } else {
        assignment = {
          building: `${String(payload.roomNo || '').charAt(0)}동`,
          employeeNo: '', employeeNos: [], names: [], currentShift: '', activeShiftCodes: []
        };
      }

      if (!novaRealtime_.configLoaded) {
        const ready = await initNovaRealtime_();
        if (!ready && !novaRealtime_.configLoaded) realtimeFallbackReason = 'REALTIME_CONFIG_UNAVAILABLE';
      }

      if (novaRealtimeIsEnabled_()) {
        try {
          const realtime = await novaMonthlyRealtimeCreateHousemanOrder_(payload, assignment);
          const elapsed = Math.round(performance.now() - clickedAt);
          const dbMs = Math.max(0, Number(realtime.timing?.totalMs || 0));
          closeModal();
          insertMonthlyHousemanRealtimeItem_(realtime.order, payload);
          showToast(`${payload.roomNo}호 오더 등록 완료 · ${elapsed}ms`);
          setSyncStatus(`${payload.roomNo}호 DB 저장 ${dbMs}ms · 화면 ${elapsed}ms · 이력 동기화 중`);

          void mirrorRealtimeHousemanOrderToSheet_(realtime.mirrorPayload).then(mirrorResult => {
            if (!mirrorResult?.ok) return;
            if (state.activeMenu === 'monthly'
                && state.monthly.period === 'DAILY'
                && String(state.monthly.type || '').toUpperCase() === 'HOUSEMAN') {
              void loadMonthlyHistory({ page: Number(state.monthly.page || 1), preserveTable: true });
            }
          });
          return;
        } catch (realtimeError) {
          realtimeFallbackReason = String(realtimeError?.code || realtimeError?.message || 'REALTIME_ERROR')
            .replace(/\s+/g, ' ').trim().slice(0, 80);
          console.warn('[NOVA Realtime] 월별조회 하우스맨 등록은 기존 저장경로로 전환합니다.', realtimeError);
        }
      } else if (!realtimeFallbackReason) {
        realtimeFallbackReason = novaRealtime_.configLoaded ? 'REALTIME_DISABLED' : 'REALTIME_CONFIG_UNAVAILABLE';
      }

      payload.sourceLanguage = String(payload.sourceLanguage || window.NOVA_I18N?.getLanguage?.() || 'ko').toLowerCase(); // NOVA_I18N_V1
      const result = await callServer('createHousemanOrder', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '오더 등록에 실패했습니다.');
      const elapsed = Math.round(performance.now() - clickedAt);
      closeModal();
      showToast(`${payload.roomNo}호 오더 등록 완료 · ${elapsed}ms`);
      setSyncStatus(`${payload.roomNo}호 기존 저장경로 ${elapsed}ms · ${realtimeFallbackReason || 'LEGACY'}`);
      await loadMonthlyHistory({ page: 1, preserveTable: true });
    } catch (error) {
      showToast(error?.message || '오더 등록 오류');
      button.disabled = false;
      button.textContent = original;
    }
  }

  function applyMonthlySubcategoryUi_(type) { // (월별조회 하우스맨·룸메이드·QM 소분류 전환)
    const normalized = ['HOUSEMAN', 'CLEANING', 'QM'].includes(String(type || '').toUpperCase())
      ? String(type).toUpperCase()
      : 'HOUSEMAN';

      void preloadMonthlyHousemanOrderOptions_().catch(error => {
        console.warn('월별조회 하우스맨 등록 옵션 사전조회 실패:', error?.message || error);
      });

    document.querySelectorAll('#monthlySubcategoryMenu [data-monthly-section]').forEach(button => {
      const active = button.dataset.monthlySection === normalized;
      button.classList.toggle('active', active);
      button.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    const closePanel = $('dailyClosePanel');
    const qmPanel = $('monthlyQmQualityPanel');
    if (closePanel) closePanel.classList.toggle('hidden', normalized !== 'CLEANING');
    if (qmPanel) qmPanel.classList.toggle('hidden', normalized !== 'QM');

  function applyMonthlyPeriodUi_(period) { // (월별·일별 입력영역 전환)
    const daily = period === 'DAILY';
    state.monthly.period = daily ? 'DAILY' : 'MONTHLY';
    document.querySelectorAll('#monthlyPeriodToggle [data-period]').forEach(button => {
      button.classList.toggle('active', button.dataset.period === state.monthly.period);
      button.setAttribute('aria-selected', button.dataset.period === state.monthly.period ? 'true' : 'false');
    });
    $('monthlyYearField')?.classList.toggle('hidden', daily);
    $('monthlyMonthField')?.classList.toggle('hidden', daily);
    $('monthlyDateField')?.classList.toggle('hidden', !daily);
    $('monthlyDayNav')?.classList.toggle('hidden', !daily);
    $('monthlyControls')?.classList.toggle('daily-mode', daily);
    $('dailyCloseSaveButton')?.classList.toggle('hidden', !daily);
    $('monthlyHousemanOrderButton')?.classList.toggle('hidden', !daily || String(state.monthly.type || '').toUpperCase() !== 'HOUSEMAN');
    $('dailyCloseCancelButton')?.classList.toggle('hidden', state.bootstrap?.user?.role !== 'ADMIN' || !daily || !['CLOSED', 'MIXED'].includes(String(state.monthly.data?.close?.source || '').toUpperCase()));
    if ($('monthlyPageTitle')) {
      $('monthlyPageTitle').textContent = `${daily ? '일별' : '월별'} 룸메이드·QM·하우스맨 이력`;

  function moveMonthlyDay_(delta) { // (일별 이전·다음 날짜 이동)
    const current = String($('monthlyDate')?.value || state.monthly.date || formatClientDate_(new Date()));
    const match = current.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const date = match
      ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]) + Number(delta || 0), 12, 0, 0)
      : new Date();
    $('monthlyDate').value = formatClientDate_(date);
    state.monthly.date = $('monthlyDate').value;
    sessionStorage.setItem('novaMonthlyDate', state.monthly.date);
    loadMonthlyHistory({ page: 1 });
  }

  function formatClientDate_(date) { // (브라우저 현지 날짜 YYYY-MM-DD)
    const value = date instanceof Date ? date : new Date(date);
    const year = value.getFullYear();
    const month = String(value.getMonth() + 1).padStart(2, '0');
    const day = String(value.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function collectMonthlyFilters_(overrides = {}) { // (월별·일별 화면 조회조건 수집)
    const resetDetail = overrides.resetDetailFilters === true;
    const period = String(state.monthly.period || 'DAILY').toUpperCase() === 'MONTHLY' ? 'MONTHLY' : 'DAILY';
    return {
      period,
      date: String($('monthlyDate')?.value || state.monthly.date || formatClientDate_(new Date())),
      year: Number($('monthlyYear')?.value || state.monthly.year || new Date().getFullYear()),
      month: Number($('monthlyMonth')?.value || state.monthly.month || new Date().getMonth() + 1),
      site: resetDetail ? '' : String($('monthlySite')?.value ?? state.monthly.site ?? ''),
      type: String($('monthlyType')?.value || state.monthly.type || 'HOUSEMAN'),
      employeeNo: resetDetail ? '' : String($('monthlyEmployee')?.value ?? state.monthly.employeeNo ?? ''),
      status: resetDetail ? '' : String($('monthlyStatus')?.value ?? state.monthly.status ?? ''),
      search: String($('monthlySearch')?.value ?? state.monthly.search ?? '').trim(),
      page: Number(overrides.page || state.monthly.page || 1),
      pageSize: 100
    };
  }

  async function loadMonthlyHistory(overrides = {}) { // (월별·일별 이력 서버 조회)
    if (state.monthly.loading) return;
    state.monthly.loading = true;
    const preserveTable = Boolean(overrides && overrides.preserveTable);
    const filters = collectMonthlyFilters_(overrides);
    const periodLabel = filters.period === 'DAILY' ? '일별' : '월별';
    if (!preserveTable && $('monthlyTableBody')) $('monthlyTableBody').innerHTML = `<tr><td colspan="11" class="table-empty">${periodLabel} 데이터를 불러오는 중입니다.</td></tr>`;
    try {
      const result = await callServer('getMonthlyHistory', state.token, filters);
      if (!result?.ok) throw new Error(result?.message || '조회 데이터를 불러오지 못했습니다.');
      state.monthly.loaded = true;
      state.monthly.data = result;
      Object.assign(state.monthly, result.filters || {});
      sessionStorage.setItem('novaMonthlyPeriod', String(state.monthly.period || 'DAILY'));
      sessionStorage.setItem('novaMonthlyDate', String(state.monthly.date || ''));
      sessionStorage.setItem('novaMonthlySite', String(state.monthly.site || ''));
      sessionStorage.setItem('novaMonthlyType', String(state.monthly.type || 'HOUSEMAN'));
      renderMonthlyData_();
      lockOrderSharedSiteSelect_('monthly');
      const rangeText = state.monthly.period === 'DAILY'
        ? state.monthly.date
        : `${state.monthly.year}-${String(state.monthly.month).padStart(2, '0')}`;
      setSyncStatus(`${periodLabel}조회 ${rangeText} · ${Number(result.pagination?.total || 0).toLocaleString('ko-KR')}건 · ${result.serverTime || ''}`);
    } catch (error) {
      if ($('monthlyTableBody')) $('monthlyTableBody').innerHTML = `<tr><td colspan="11" class="table-empty error">${escapeHtml(error?.message || '통합조회 오류')}</td></tr>`;
      showToast(error?.message || '통합조회 오류');
    } finally {
      state.monthly.loading = false;
    }
  }

  function renderMonthlyData_() { // (월별·일별 조회 결과 전체 렌더링)
    const data = state.monthly.data;
    if (!data) return;
    applyMonthlyPeriodUi_(state.monthly.period);
    renderMonthlyFilterOptions_(data.options || {});
    renderMonthlySummary_(data.summary || {});
    applyMonthlySubcategoryUi_(state.monthly.type);
    if (state.monthly.type === 'CLEANING') renderDailyClosePanel_(data.close || {});
    else if ($('dailyClosePanel')) $('dailyClosePanel').innerHTML = '';
    if (state.monthly.type === 'QM') renderMonthlyQmQuality_(data.qmQuality || {});
    else if ($('monthlyQmQualityPanel')) $('monthlyQmQualityPanel').innerHTML = '';
    renderMonthlyStaffSummary_(data.staffSummary || []);
    renderMonthlyTable_(data.items || []);
    renderMonthlyPagination_(data.pagination || {});
  }

  function renderMonthlyFilterOptions_(options) { // (월별·일별 필터 선택값 반영)
    const preserve = { site: state.monthly.site || '', employeeNo: state.monthly.employeeNo || '', status: state.monthly.status || '' };
    const siteOptions = ['<option value="">전체 사업장</option>'].concat((options.sites || []).map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`));
    $('monthlySite').innerHTML = siteOptions.join('');
    $('monthlySite').value = preserve.site;

  function renderDailyClosePanel_(close) { // (공식 마감통계 패널 렌더링)
    const panel = $('dailyClosePanel');
    if (!panel) return;
    const summary = close?.summary || {};
    const daily = String(close?.period || state.monthly.period || '').toUpperCase() === 'DAILY';
    const source = String(close?.source || 'NONE').toUpperCase();
    const status = source === 'CLOSED' ? '마감 저장완료' : source === 'MIXED' ? '일부 사업장 저장' : source === 'LIVE' ? '실시간 미마감' : '마감자료 없음';
    const statusClass = source === 'CLOSED' ? 'closed' : source === 'MIXED' ? 'mixed' : 'live';
    const button = $('dailyCloseSaveButton');
    if (button && daily) button.textContent = source === 'CLOSED' ? '마감 갱신' : '마감 저장';
    const cancelButton = $('dailyCloseCancelButton');
    if (cancelButton) cancelButton.classList.toggle('hidden', state.bootstrap?.user?.role !== 'ADMIN' || !daily || !['CLOSED', 'MIXED'].includes(source));

    const cards = [
      ['전일재고', summary.previousStock || 0],
      ['당일퇴실', summary.scheduledDepartures || 0],
      ['청소완료', summary.cleaningCompleted || 0],
      ['인정 정비수', summary.recognizedUnits || 0],
      ['미완료 재고', summary.stockRemaining || 0],
      ['퇴실대기', Number(summary.dueOutRemaining || 0) + Number(summary.checkedOutWaiting || 0)],
      ['하우스맨 완료', summary.housemanCompleted || 0],
      ['퇴실지연', summary.departureDelayCount || 0]
    ];
    const siteItems = Array.isArray(close?.sites) ? close.sites : [];
    const buildingRows = daily ? siteItems.flatMap(site => (site.byBuilding || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const roommaidRows = daily ? siteItems.flatMap(site => (site.roommaidSummary || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const qmRows = daily ? siteItems.flatMap(site => (site.qmSummary || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const roommaidQualityRows = daily ? siteItems.flatMap(site => (site.roommaidQualitySummary || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const qmLocationRows = daily ? siteItems.flatMap(site => (site.qmLocationSummary || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const housemanRows = daily ? siteItems.flatMap(site => (site.housemanSummary || []).map(item => Object.assign({ site: site.site }, item))) : [];
    const issueCount = Number(summary.validationIssues || 0);

    panel.innerHTML = `
      <div class="daily-close-heading">
        <div><small>공식 마감통계</small><strong>${escapeHtml(daily ? (close.businessDate || state.monthly.date || '') : `${close.year || state.monthly.year}-${String(close.month || state.monthly.month || '').padStart(2, '0')}`)}</strong></div>
        <span class="daily-close-status ${statusClass}">${escapeHtml(status)}${closedText}</span>
      </div>
      <div class="daily-close-cards">${cards.map(([label, value]) => `<div><span>${escapeHtml(label)}</span><strong>${Number(value || 0).toLocaleString('ko-KR')}</strong></div>`).join('')}</div>
      ${issueCount ? `<div class="daily-close-warning">상태 정합성 확인 필요 ${issueCount.toLocaleString('ko-KR')}건</div>` : ''}

          <details><summary>룸메이드 실적</summary>${renderDailyCloseRoommaidTable_(roommaidRows)}</details>
          <details><summary>QM·하우스맨 실적</summary>${renderDailyCloseOperationsTable_(qmRows, housemanRows)}</details>
          <details><summary>룸메이드 점검품질</summary>${renderDailyCloseRoommaidQualityTable_(roommaidQualityRows, qmLocationRows)}</details>
        </div>` : `<div class="daily-close-empty">${escapeHtml(close?.message || (daily ? '선택한 날짜의 객실현황을 기준으로 실시간 집계합니다.' : '저장된 일일 마감자료를 월 단위로 합산합니다.'))}</div>`}
    `;
  }

    const qm = qmItems.length ? `<h4>QM</h4><div class="daily-close-table-wrap"><table><thead><tr><th>사업장</th><th>직원</th><th>점검완료</th><th>재정비</th><th>지적건수</th><th>1실 평균</th></tr></thead><tbody>${qmItems.map(item => `<tr><td>${escapeHtml(item.site || '-')}</td><td>${escapeHtml(item.name || item.employeeNo || '-')}</td><td>${Number(item.completed || 0)}</td><td>${Number(item.rework || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${item.averageMinutes == null ? '-' : `${item.averageMinutes}분`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">QM 실적이 없습니다.</div>';

    const table = items.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>사업장</th><th>룸메이드</th><th>점검건수</th><th>지적건수</th><th>주요 지적위치</th><th>주요 지적내용</th></tr></thead><tbody>${items.map(item => `<tr><td>${escapeHtml(item.site || '-')}</td><td>${escapeHtml(item.name || item.employeeNo || '-')}</td><td>${Number(item.inspectionCount || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${escapeHtml(item.topLocations || '-')}</td><td>${escapeHtml((item.majorDefects || []).slice(0,3).map(row => `${row.roomNo} ${row.placeLabel}: ${row.note}`).join(' / ') || '-')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">룸메이드 점검품질 실적이 없습니다.</div>';

  async function saveDailyCloseFromMonthly_() { // (일별 공식 마감 저장·갱신)
    const button = $('dailyCloseSaveButton');
    if (!button || state.monthly.period !== 'DAILY') return;
    const businessDate = String($('monthlyDate')?.value || state.monthly.date || '').trim();
    const site = String($('monthlySite')?.value || state.monthly.site || '').trim();
    if (!businessDate) return showToast('마감할 업무일자를 선택하세요.');
    const original = button.textContent;
    button.disabled = true;
    button.textContent = '마감 저장 중…';
    try {
      const result = await callServer('saveDailyCloseSnapshot', state.token, { businessDate, site });
      if (!result?.ok) throw new Error(result?.message || '마감자료를 저장하지 못했습니다.');
      showToast(result.message || '마감자료를 저장했습니다.');
      await loadMonthlyHistory({ page: 1 });
    } catch (error) {
      showToast(error?.message || '마감 저장 오류');
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function cancelDailyCloseFromMonthly_() { // (일별 공식 마감 취소)
    const button = $('dailyCloseCancelButton');
    if (!button || state.monthly.period !== 'DAILY') return;
    const businessDate = String($('monthlyDate')?.value || state.monthly.date || '').trim();
    const site = String($('monthlySite')?.value || state.monthly.site || '').trim();
    if (!businessDate) return showToast('취소할 업무일자를 선택하세요.');
    const target = site || '전체 사업장';
    if (!window.confirm(`${businessDate} ${target}의 저장된 마감자료를 취소할까요?`)) return;
    button.disabled = true;
    button.textContent = '취소 중…';
    try {
      const result = await callServer('cancelDailyCloseSnapshot', state.token, { businessDate, site });
      if (!result?.ok) throw new Error(result?.message || '마감을 취소하지 못했습니다.');
      showToast(result.message || '마감을 취소했습니다.');
      await loadMonthlyHistory({ page: 1 });
    } catch (error) {
      showToast(error?.message || '마감 취소 오류');
    } finally {
      button.disabled = false;
      button.textContent = '마감 취소';
    }
  }

  async function saveMonthlyHousemanManagedContent_(item, button) {
    const items = collectMonthlyHousemanManageItems_();
    if (!items.length) return showToast('품목을 1개 이상 입력하세요.');
    const part = String($('monthlyManagePart')?.value || '').trim();
    if (!part) return showToast('파트를 선택하세요.');
    const original = button.textContent;
    button.disabled = true;
    button.textContent = '저장 중…';
    try {
      const result = await callServer('updateHousemanOrder', state.token, {
        orderId: item.recordId,
        rowNumber: Number(item.rowNumber || 0),
        expectedVersion: Number(item.version || 0),
        action: 'EDIT',
        part,
        requester: String($('monthlyManageRequester')?.value || '').trim(),
        note: String($('monthlyManageNote')?.value || '').trim(),
        items,
        important: Boolean($('monthlyManageImportant')?.checked),
        handover: Boolean($('monthlyManageHandover')?.checked)
      });
      if (!result?.ok) throw new Error(result?.message || '오더 내용을 수정하지 못했습니다.');
      void syncRealtimeHousemanEditedContent_(result.order);
      closeModal();
      showToast(`${item.roomNo || ''}호 오더 내용을 수정했습니다.`);
      await loadMonthlyHistory({ page: Number(state.monthly.page || 1), preserveTable: true });
    } catch (error) {
      showToast(error?.message || '오더 수정 오류');
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function assignMonthlyHousemanManagedOrder_(item, button) {
    const employeeNo = String($('monthlyManageAssignee')?.value || '').trim();
    if (!employeeNo) return showToast('배정할 하우스맨을 선택하세요.');
    const original = button.textContent;
    button.disabled = true;
    button.textContent = '배정 중…';
    const sourceOrder = {
      orderId: item.recordId,
      rowNumber: Number(item.rowNumber || 0),
      version: Number(item.version || 0),
      roomNo: item.roomNo,
      businessDate: item.businessDate,
      site: item.site,
      assignedEmployeeNo: item.assignedEmployeeNo || ''
    };
    try {
      if (!novaRealtime_.configLoaded) await initNovaRealtime_();
      let mirrored = null;
      if (novaRealtimeIsEnabled_()) {
        try {
          await novaRealtimeAssignHousemanOrder_(sourceOrder, employeeNo);
          mirrored = await mirrorRealtimeHousemanAssignmentToSheet_(sourceOrder, employeeNo);
        } catch (realtimeError) {
          console.warn('[NOVA 월별조회] 하우스맨 DB 수동배정 실패 · Sheet 경로로 전환', realtimeError?.message || realtimeError);
        }
      }
      if (!mirrored?.ok) {
        mirrored = await callServer('assignHousemanOrderFast', state.token, {
          orderId: item.recordId,
          rowNumber: Number(item.rowNumber || 0),
          expectedVersion: Number(item.version || 0),
          employeeNo
        });
        if (!mirrored?.ok) throw new Error(mirrored?.message || '직원 배정에 실패했습니다.');
        void callServer('finalizeHousemanAssignmentAux', state.token, {
          orderId: mirrored.order.orderId,
          rowNumber: Number(mirrored.order.rowNumber || 0),
          employeeNo,
          version: Number(mirrored.version || 0)
        }).catch(error => console.warn('[NOVA 월별조회] 배정 후속처리 지연', error));
      }
      closeModal();
      showToast(`${item.roomNo || ''}호 담당직원을 변경했습니다.`);
      await loadMonthlyHistory({ page: Number(state.monthly.page || 1), preserveTable: true });
    } catch (error) {
      showToast(error?.message || '직원 배정 오류');
      button.disabled = false;
      button.textContent = original;
    }
  }

  async function loadMonthlyHousemanPhotoViewer_(item, index) { // (사진 한 장씩 지연 로드)
    const root = $('monthlyHousemanPhotoViewerBody');
    const photos = Array.isArray(item?.photos) ? item.photos : [];
    if (!root || !photos.length) return;
    const safeIndex = Math.max(0, Math.min(photos.length - 1, Number(index || 0)));
    const photo = photos[safeIndex];
    root.innerHTML = '<div class="settings-loading">사진을 불러오는 중입니다.</div>';
    try {
      const result = await callServer('getHousemanRequestPhoto', state.token, {
        orderId: item.recordId,
        rowNumber: Number(item.rowNumber || 0),
        fileId: photo.fileId
      });
      if (!result?.ok || !result.base64) throw new Error(result?.message || '사진을 불러오지 못했습니다.');
      if (!$('monthlyHousemanPhotoViewerBody')) return;
      const mimeType = String(result.photo?.mimeType || 'image/jpeg');
      const fileName = String(result.photo?.name || `houseman-photo-${safeIndex + 1}.jpg`);
      root.innerHTML = `
        <div class="monthly-photo-viewer-nav">
          <button id="monthlyPhotoPrev" class="secondary-button" type="button"${safeIndex <= 0 ? ' disabled' : ''}>이전</button>
          <strong>${safeIndex + 1} / ${photos.length}</strong>
          <button id="monthlyPhotoNext" class="secondary-button" type="button"${safeIndex >= photos.length - 1 ? ' disabled' : ''}>다음</button>
        </div>
        <div class="monthly-photo-viewer-image-wrap"><img class="monthly-photo-viewer-image" src="data:${escapeAttr(mimeType)};base64,${result.base64}" alt="${escapeAttr(fileName)}"></div>
        <div class="monthly-photo-viewer-meta"><span>${escapeHtml(fileName)}</span><button id="monthlyPhotoDownload" class="action-button primary" type="button">다운로드</button></div>`;
      $('monthlyPhotoPrev')?.addEventListener('click', () => loadMonthlyHousemanPhotoViewer_(item, safeIndex - 1));
      $('monthlyPhotoNext')?.addEventListener('click', () => loadMonthlyHousemanPhotoViewer_(item, safeIndex + 1));
      $('monthlyPhotoDownload')?.addEventListener('click', () => downloadMonthlyHousemanPhoto_(result));
    } catch (error) {
      if (root) root.innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '사진 조회 오류')}</div>`;
    }
  }

  function downloadMonthlyHousemanPhoto_(result) { // (조회한 사진파일 브라우저 다운로드)
    try {
      const binary = window.atob(String(result?.base64 || ''));
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      const blob = new Blob([bytes], { type: String(result?.photo?.mimeType || 'image/jpeg') });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = String(result?.photo?.name || 'houseman-request.jpg');
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1500);
    } catch (error) {
      showToast(error?.message || '사진 다운로드 오류');
    }
  }

    const button = $('monthlyExcelButton');

  function buildExcelXml_(headers, rows) { // (Excel 2003 XML 문서 생성)
    const allRows = [headers].concat(rows);
    const body = allRows.map((row, rowIndex) => `<Row>${row.map(value => {
      const isNumber = rowIndex > 0 && typeof value === 'number' && Number.isFinite(value);
      return `<Cell><Data ss:Type="${isNumber ? 'Number' : 'String'}">${excelXmlEscape_(value)}</Data></Cell>`;
    }).join('')}</Row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="통합조회"><Table>${body}</Table></Worksheet></Workbook>`;
  }

  function excelXmlEscape_(value) { // (Excel XML 문자열 처리)
    return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&apos;');
  }

  function downloadTextFile_(filename, content, mimeType) { // (브라우저 파일 저장)
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function formatMonthlyMinutes_(value) { // (월별 소요시간 표시)
    const minutes = Number(value);
    if (!Number.isFinite(minutes) || minutes < 0) return '-';
    if (minutes < 60) return `${minutes}분`;
    const hours = Math.floor(minutes / 60);
    const remain = Math.round((minutes - hours * 60) * 10) / 10;
    return remain ? `${hours}시간 ${remain}분` : `${hours}시간`;
  }

  async function loadIndicatorSnapshot(options = {}) { // (통합 화면 데이터 조회)
    if (state.indicator.loading && !options.force) return;
    state.indicator.loading = true;
    if (!options.silent) setSyncStatus('통합 화면 불러오는 중…');
    const startedAt = performance.now();
    try {
      const result = await callServer('getIndicatorSnapshot', state.token, {
        businessDate: state.indicator.businessDate || state.bootstrap.app.businessDate,
        site: state.indicator.site
      });
      if (!result?.ok) throw new Error(result?.message || '통합 화면을 불러오지 못했습니다.');
      applyIndicatorSnapshot(result);
      const elapsed = Math.round(performance.now() - startedAt);
      setSyncStatus(`동기화 ${elapsed}ms · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);
      startIndicatorSync();
    } catch (error) {
      showToast(error?.message || '통합 화면 조회 오류');
      setSyncStatus(`연결 오류 · ${error?.message || '조회 실패'}`);
    } finally {
      state.indicator.loading = false;
    }
  }

  function indicatorRoomSnapshotKey_(room) { // (객실 스냅샷 비교키)
    return `${String(room?.site || '')}|${String(room?.roomNo || '')}`;
  }

  function indicatorRoomSnapshotSignature_(room) { // (객실카드 시각 변경 비교)
    if (!room) return '';
    return JSON.stringify([
      room.roomStatus || '', room.displayBaseRoomStatus || '', room.cleaningStatus || '', room.cleaningType || '', room.assignmentType || '',
      room.roommaidEmployeeNo || '', room.roommaidName || '', room.secondaryRoommaidEmployeeNo || '', room.secondaryRoommaidName || '',
      room.qmEmployeeNo || '', room.qmName || '', Boolean(room.preassigned), Boolean(room.vip), Boolean(room.importantRoom),
      normalizeIndicatorRoomOperationalStatus_(room.operationalStatus), Number(room.pendingOrderCount || 0), Number(room.version || 0), room.previousCycle || null
    ]);
  }

  function indicatorOrdersSnapshotSignature_(orders) { // (오더목록 변경 비교)
    return JSON.stringify((orders || []).map(order => [
      order.orderId, order.statusCode, order.assignedEmployeeNo, order.processorEmployeeNo,
      order.updatedAt, order.itemSummary, Boolean(order.important), Boolean(order.handover)
    ]));
  }

  function novaRealtimeProtectOrderArray_(incomingOrders, currentOrders) { // (DB 선등록 오더를 지연된 Sheet 스냅샷으로부터 보호)
    if (!novaRealtimeIsEnabled_() || !Array.isArray(incomingOrders) || !Array.isArray(currentOrders)) return incomingOrders;
    const merged = incomingOrders.slice();
    const incomingIds = new Set(merged.map(order => String(order?.orderId || '')).filter(Boolean));
    const now = Date.now();
    currentOrders.forEach(order => {
      const orderId = String(order?.orderId || '');
      if (!orderId || incomingIds.has(orderId)) return;
      const protectedOrder = order?.__pendingSave === true
        || order?.__sheetMirrorPending === true
        || Number(order?.__localProtectUntil || 0) > now;
      if (protectedOrder) merged.unshift(order);
    });
    merged.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''))
      || String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')));
    return merged;
  }

  function isHousemanItemEditorOpen_() { // (품목 입력 중 백그라운드 전체 렌더링 방지)
    const root = $('modalRoot');
    return Boolean(root && !root.classList.contains('hidden') && $('itemEditorRows'));
  }

  function patchIndicatorChangedRooms_(previousRooms, nextRooms) { // (변경 객실카드만 교체)
    const grid = $('roomGrid');
    if (!grid) return false;
    const previousMap = new Map((previousRooms || []).map(room => [indicatorRoomSnapshotKey_(room), room]));
    const nextMap = new Map((nextRooms || []).map(room => [indicatorRoomSnapshotKey_(room), room]));
    if (previousMap.size !== nextMap.size) return false;
    for (const key of previousMap.keys()) if (!nextMap.has(key)) return false;

    const changed = [];
    nextMap.forEach((room, key) => {
      if (indicatorRoomSnapshotSignature_(previousMap.get(key)) !== indicatorRoomSnapshotSignature_(room)) changed.push(room);
    });
    if (changed.length > 40) return false;

    const cardByRoomNo = new Map(Array.from(grid.querySelectorAll('[data-room-no]')).map(card => [card.dataset.roomNo, card]));
    for (const room of changed) {
      const existing = cardByRoomNo.get(room.roomNo) || null;
      const visible = roomMatchesIndicatorFilter_(room);
      if (existing && visible) existing.outerHTML = roomCardHtml_(room);
      else if (existing && !visible) existing.remove();
      else if (!existing && visible) return false;
    }
    if (!grid.querySelector('[data-room-no]')) {
      grid.innerHTML = '<div class="room-empty">선택한 조건에 표시할 객실이 없습니다.</div>';
    }
    return true;
  }

  function applyIndicatorSnapshot(result) { // (통합 화면 스냅샷 차등 반영)
    const pageScroll = window.scrollY;
    const orderScrollTop = $('orderScroll')?.scrollTop || 0;
    const previousData = state.indicator.data;
    const previousRooms = previousData?.rooms || [];
    const previousOrdersSignature = indicatorOrdersSnapshotSignature_(previousData?.orders || []);
    const sameSelection = Boolean(previousData
      && String(previousData.selection?.businessDate || '') === String(result.selection?.businessDate || state.indicator.businessDate || '')
      && String(previousData.selection?.site || '') === String(result.selection?.site ?? state.indicator.site ?? ''));

    if (novaRealtimeIsEnabled_() && Array.isArray(result.rooms) && Array.isArray(previousRooms) && previousRooms.length) {
      result.rooms = novaRealtimeProtectRoomArray_(result.rooms, previousRooms);
    }
    if (novaRealtimeIsEnabled_() && sameSelection && Array.isArray(result.orders) && Array.isArray(previousData?.orders)) {
      result.orders = novaRealtimeProtectOrderArray_(result.orders, previousData.orders);
    }
    const deferUiRender = isHousemanItemEditorOpen_();
    state.indicator.loaded = true;
    state.indicator.queryApplied = true;
    state.indicator.queryDirty = false;
    state.indicator.version = Number(result.version || 0);
    state.indicator.businessDate = result.selection?.businessDate || state.indicator.businessDate;
    if (state.indicator.businessDate) sessionStorage.setItem('novaIndicatorBusinessDate', state.indicator.businessDate);
    state.indicator.site = result.selection?.site ?? state.indicator.site;
    sessionStorage.setItem('novaIndicatorSite', String(state.indicator.site || ''));
    if (state.indicator.site) setOrderSharedSite_(state.indicator.site); // ORDER_SHARED_SITE_CONTEXT_V2
    state.indicator.data = Object.assign({}, previousData || {}, result);

    if (deferUiRender) {
      if (novaRealtimeIsEnabled_()) void novaRealtimeEnsureSubscriptions_();
      return;
    }

    const canPatch = Boolean(sameSelection && $('indicatorPage') && previousData && Array.isArray(result.rooms));
    const patched = canPatch && patchIndicatorChangedRooms_(previousRooms, state.indicator.data.rooms || []);
    if (patched) {
      renderIndicatorSelects();
      renderIndicatorSummary();
      renderRoomFilters();
      if (previousOrdersSignature !== indicatorOrdersSnapshotSignature_(state.indicator.data.orders || [])) renderOrderList();
      updateItemPickerLabel();
      updateHousemanRoutingPreview_();
    } else {
      renderIndicatorData();
    }

    requestAnimationFrame(() => {
      window.scrollTo({ top: pageScroll, behavior: 'auto' });
      if ($('orderScroll')) $('orderScroll').scrollTop = orderScrollTop;
    });
    if (novaRealtimeIsEnabled_()) {
      void novaRealtimeHydrateCurrentView_();
      void novaRealtimeEnsureSubscriptions_();
    }
  }
