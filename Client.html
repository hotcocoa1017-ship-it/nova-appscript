    if (!state.indicator.site) {
      showToast('객실현황을 업로드할 사업장을 먼저 선택하세요.');
      $('indicatorSite')?.focus();
      return;
    }
    state.indicator.uploadPreviewId = '';
    openModal(`
      <div class="modal-card upload-modal-card">
        <div class="modal-header">
          <h2>객실현황 업로드</h2>
          <button class="modal-close" type="button" data-close-modal>×</button>
        </div>
        <div class="modal-body">
          <div class="upload-context">
            <strong>${escapeHtml(state.indicator.site)}</strong>
            <span>${escapeHtml(state.indicator.businessDate)}</span>
          </div>
          <div class="upload-guide">
            <strong>엑셀 필수 시트명</strong>
            <span>재고 · 재고RC · 재고HU · 투숙 · 퇴실예정 · 퇴실 · 재입실</span>
            <small>각 시트 전체 셀에서 객실마스터와 일치하는 객실번호를 수집합니다. 어느 시트에도 없는 객실은 객실상태 공실, 청소상태 청소완료로 반영됩니다.</small>
          </div>
          <form id="roomUploadForm" class="upload-form">
            <input type="hidden" name="token" value="${escapeAttr(state.token)}">
            <input type="hidden" name="businessDate" value="${escapeAttr(state.indicator.businessDate)}">
            <input type="hidden" name="site" value="${escapeAttr(state.indicator.site)}">
            <label class="upload-dropzone" for="roomUploadFile">
              <span>파일 선택</span>
              <small>XLSX, XLS, CSV, PDF · 최대 5MB</small>
              <input id="roomUploadFile" name="uploadFile" type="file" accept=".xlsx,.csv,.pdf" required>
            </label>
            <div id="uploadFileName" class="upload-file-name">선택된 파일이 없습니다.</div>
            <div class="modal-actions">
              <button id="uploadPreviewButton" class="action-button primary" type="submit">검증 및 미리보기</button>
              <button class="action-button" type="button" data-close-modal>취소</button>
            </div>
          </form>
          <div id="uploadResult"></div>
        </div>
      </div>`);

    $('roomUploadFile').addEventListener('change', event => {
      const file = event.target.files?.[0];
      $('uploadFileName').textContent = file ? `${file.name} · ${formatFileSize_(file.size)}` : '선택된 파일이 없습니다.';
      state.indicator.uploadPreviewId = '';
      $('uploadResult').innerHTML = '';
    });
    $('roomUploadForm').addEventListener('submit', handleRoomUploadPreview);
  }

  function handleRoomUploadPreview(event) { // (업로드 파일 서버 검증)
    event.preventDefault();
    const previewStartedAt = performance.now();
    const form = event.currentTarget;
    const file = $('roomUploadFile').files?.[0];
    if (!file) return showToast('업로드할 파일을 선택하세요.');
    setUploadBusy_(true, '파일 검증 중…');
    $('uploadResult').innerHTML = '<div class="upload-processing">파일을 분석하고 있습니다. 기존 객실현황은 변경되지 않습니다.</div>';
    google.script.run
      .withSuccessHandler(result => {
        setUploadBusy_(false);
        if (!result?.ok) {
          $('uploadResult').innerHTML = `<div class="upload-error">${escapeHtml(result?.message || '파일을 검증하지 못했습니다.')}</div>`;
          return;
        }
        state.indicator.uploadPreviewId = result.previewId || '';
        renderRoomUploadPreview_(result);
        const totalMs = Math.round(performance.now() - previewStartedAt);
        const serverMs = Number(result.performance?.elapsedMs || 0);
        const previewStatusText = `객실현황 검증 완료 · 총 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`;
        if ($('uploadPerformanceStatus')) $('uploadPerformanceStatus').textContent = previewStatusText;
        setSyncStatus(previewStatusText);
      })
      .withFailureHandler(error => {
        setUploadBusy_(false);
        $('uploadResult').innerHTML = `<div class="upload-error">${escapeHtml(error?.message || String(error))}</div>`;
      })
      .previewRoomStatusUpload(form);
  }

  function renderRoomUploadPreview_(result) { // (객실현황 검증결과 표시)
    const errors = [];
    if (result.missingSheets?.length) errors.push(`누락 시트: ${result.missingSheets.join(', ')}`);
    if (result.unknownRooms?.length) errors.push(`객실마스터 미등록: ${result.unknownRooms.join(', ')}`);
    if (result.duplicateRooms?.length) {
      errors.push(`상태 충돌: ${result.duplicateRooms.map(item => `${item.roomNo}(${item.statuses.join('/')})`).join(', ')}`);
    }
    const countCards = (result.counts || []).map(item => `
      <div class="upload-count-card"><span>${escapeHtml(item.label)}</span><strong>${Number(item.count || 0)}</strong></div>`).join('');
    $('uploadResult').innerHTML = `
      <section class="upload-preview ${result.canApply ? 'valid' : 'invalid'}">
        <div class="upload-preview-title">
          <strong>${escapeHtml(result.canApply ? '검증 완료' : '검증 오류')}</strong>
          <span>객실마스터 ${Number(result.totalMasterRooms || 0)}실 · 파일 인식 ${Number(result.matchedRooms || 0)}실</span>
        </div>
        <div class="upload-count-grid">
          ${countCards}
          <div class="upload-count-card vacant"><span>공실 / 청소완료</span><strong>${Number(result.vacantCleanRooms || 0)}</strong></div>
        </div>
        ${errors.length ? `<div class="upload-error-list">${errors.map(text => `<div>${escapeHtml(text)}</div>`).join('')}</div>` : ''}
        ${(result.warnings || []).length ? `<div class="upload-warning-list">${result.warnings.map(text => `<div>${escapeHtml(text)}</div>`).join('')}</div>` : ''}
        <p class="upload-message">${escapeHtml(result.message || '')}</p>
        <div id="uploadPerformanceStatus" class="upload-processing"></div>
        ${result.canApply ? `<div class="modal-actions">
          <button id="uploadResetApplyButton" class="action-button danger" type="button">초기화 후 반영</button>
          <button id="uploadApplyButton" class="action-button primary" type="button">기존 상태 유지 반영</button>
          <button class="action-button" type="button" data-close-modal>취소</button>
        </div>

      </section>`;
    if (result.canApply) {

  async function applyRoomUploadPreview_(resetExisting) { // (검증된 객실현황 유지 반영·초기화 후 교체)
    const clickedAt = performance.now();
    const previewId = state.indicator.uploadPreviewId;
    if (!previewId) return showToast('유효한 업로드 미리보기가 없습니다.');

    const resetMode = resetExisting === true;
    if (resetMode) {
      const confirmed = window.confirm(
        `${state.indicator.businessDate} / ${state.indicator.site}의 기존 객실현황을 초기화한 뒤 새 파일로 다시 업로드합니다.\n\n` +
        '같은 업무일자·사업장의 기존 객실행과 진행상태·기존 배정이 제거됩니다. 계속하시겠습니까?'
      );
      if (!confirmed) return;
    }

    const button = resetMode ? $('uploadResetApplyButton') : $('uploadApplyButton');
    const otherButton = resetMode ? $('uploadApplyButton') : $('uploadResetApplyButton');
    const originalText = button?.textContent || '';
    if (button) {
      button.disabled = true;
      button.textContent = resetMode ? '초기화 후 반영 중…' : '반영 중…';
    }
    if (otherButton) otherButton.disabled = true;
    if ($('uploadPerformanceStatus')) {
      $('uploadPerformanceStatus').textContent = resetMode
        ? '객실현황 초기화 후 반영 중…'
        : '객실현황 반영 중…';
    }
    try {
      const result = await callServer('applyRoomStatusUpload', state.token, previewId, {
        resetExisting: resetMode
      });
      if (!result?.ok) throw new Error(result?.message || '객실현황 반영에 실패했습니다.');
      closeModal();
      state.indicator.version = Number(result.version || 0);
      state.indicator.businessDate = result.businessDate || state.indicator.businessDate;
      state.indicator.site = result.site || state.indicator.site;
      if (Array.isArray(result.rooms)) {
        state.indicator.data = Object.assign({}, state.indicator.data || {}, { rooms: result.rooms });
        state.indicator.loaded = true;
        renderIndicatorSummary();
        renderRoomFilters();
        renderRoomGrid();
      }
      const totalMs = Math.round(performance.now() - clickedAt);
      const serverMs = Number(result.performance?.elapsedMs || result.timing?.totalMs || 0);
      const writeMs = Number(result.timing?.currentWriteMs || 0);
      const lockMs = Number(result.timing?.lockWaitMs || 0);
      const flushMs = Number(result.timing?.flushMs || 0);
      const applyStatusText =
        `객실현황 반영 완료 · 총 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`
        + `${writeMs ? ` · 저장 ${writeMs}ms` : ''}${lockMs ? ` · 잠금 ${lockMs}ms` : ''}${flushMs ? ` · flush ${flushMs}ms` : ''}`;
      showToast(applyStatusText);
      setSyncStatus(applyStatusText);

      // 서버가 이미 최신 객실목록을 반환했으므로 완료 응답 직후 동일 자료를 다시 전체조회하지 않습니다.
      // 보조 재조회는 사용자 응답 경로 밖에서 수행해 업로드 완료 체감을 지연시키지 않습니다.
      window.setTimeout(() => {
        if (state.activeMenu !== 'indicator' || !state.indicator.loaded) return;
        void loadIndicatorSnapshot({ silent: true, force: true })
          .catch(error => console.error('[NOVA] 업로드 후 보조 동기화 실패:', error));
      }, 1200);
    } catch (error) {
      if (button) {
        button.disabled = false;
        button.textContent = originalText;
      }
      if (otherButton) otherButton.disabled = false;
      if ($('uploadPerformanceStatus')) {
        $('uploadPerformanceStatus').textContent = `객실현황 반영 오류 · ${error?.message || '서버 처리 오류'}`;
      }
      showToast(error?.message || '객실현황 반영 오류');
    }
  }

  function setUploadBusy_(busy, text) { // (업로드 중복 요청 방지)
    const button = $('uploadPreviewButton');
    const input = $('roomUploadFile');
    if (button) {
      button.disabled = busy;
      button.textContent = busy ? (text || '처리 중…') : '검증 및 미리보기';

  function formatFileSize_(bytes) { // (파일 크기 표시)
    const size = Number(bytes || 0);
    if (size < 1024) return `${size}B`;
    if (size < 1024 * 1024) return `${Math.round(size / 1024)}KB`;
    return `${(size / 1024 / 1024).toFixed(1)}MB`;
  }

  async function loadQmChecklistManagement_(options = {}) { // (체크리스트 관리 데이터 조회)
    if (state.qmChecklist.loading && !options.force) return;
    state.qmChecklist.loading = true;
    try {
      const result = await callServer('getQmChecklistManagementData', state.token);
      if (!result?.ok) throw new Error(result?.message || '체크리스트를 불러오지 못했습니다.');
      state.qmChecklist.data = result;
      state.qmChecklist.loaded = true;
      if (state.activeMenu === 'qmChecklist') {
        renderQmChecklistManagementData_();
        if (!state.qmChecklist.analytics) loadQmInspectionAnalytics_();
      }
    } catch (error) {
      if ($('qmChecklistAdminList')) $('qmChecklistAdminList').innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '체크리스트 조회 오류')}</div>`;
      showToast(error?.message || '체크리스트 조회 오류');
    } finally {
      state.qmChecklist.loading = false;
    }
  }

  async function handleQmPlaceManagementClick_(event) { // (점검장소 변경·삭제)
    const save = event.target.closest('[data-place-save]');
    if (save) return saveQmChecklistPlace_(save.dataset.placeSave, save);
    const remove = event.target.closest('[data-place-delete]');
    if (!remove) return;
    const code = remove.dataset.placeDelete;
    const place = (state.qmChecklist.data?.places || []).find(row => row.code === code);
    if (!window.confirm(`${place?.label || '선택 장소'}를 삭제하시겠습니까?`)) return;
    remove.disabled = true;
    try {
      const result = await callServer('deleteQmChecklistPlace', state.token, { code });
      if (!result?.ok) throw new Error(result?.message || '삭제하지 못했습니다.');
      showToast(result.message || '삭제했습니다.');
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '삭제 오류'); remove.disabled = false; }
  }

  async function saveQmChecklistPlace_(code, button) { // (점검장소 신규·변경 저장)
    const card = code ? document.querySelector(`[data-place-code="${code}"]`) : null;
    const payload = code ? {
      code, label: card?.querySelector('[data-place-label]')?.value.trim(), order: card?.querySelector('[data-place-order]')?.value
    } : { label: $('qmPlaceNewLabel')?.value.trim(), order: $('qmPlaceNewOrder')?.value };
    if (!payload.label) return showToast('점검 장소명을 입력하세요.');
    if (button) button.disabled = true;
    try {
      const result = await callServer('saveQmChecklistPlace', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '저장하지 못했습니다.');
      showToast(result.message || '저장했습니다.');
      if (!code && $('qmPlaceNewLabel')) $('qmPlaceNewLabel').value = '';
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '저장 오류'); if (button) button.disabled = false; }
  }

  async function handleQmChecklistManagementClick_(event) { // (체크리스트 수정·삭제 버튼 처리)
    const saveButton = event.target.closest('[data-checklist-save]');
    if (saveButton) return saveQmChecklistManagementItem_(saveButton.dataset.checklistSave, saveButton);
    const deleteButton = event.target.closest('[data-checklist-delete]');
    if (!deleteButton) return;
    const code = deleteButton.dataset.checklistDelete;
    const item = (state.qmChecklist.data?.items || []).find(row => row.code === code);
    if (!window.confirm(`${item?.label || '선택 항목'}을 삭제하시겠습니까?\n과거 점검이력은 유지됩니다.`)) return;
    deleteButton.disabled = true;
    try {
      const result = await callServer('deleteQmChecklistItem', state.token, { code });
      if (!result?.ok) throw new Error(result?.message || '삭제하지 못했습니다.');
      showToast(result.message || '삭제했습니다.');
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '삭제 오류'); deleteButton.disabled = false; }
  }

  async function saveQmChecklistManagementItem_(code, button) { // (체크리스트 신규·변경 저장)

      order: card?.querySelector('[data-checklist-order]')?.value,

    if (!payload.label) return showToast('점검 항목명을 입력하세요.');
    if (button) button.disabled = true;
    try {
      const result = await callServer('saveQmChecklistItem', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '저장하지 못했습니다.');
      showToast(result.message || '저장했습니다.');
      if (!code && $('qmChecklistNewLabel')) $('qmChecklistNewLabel').value = '';
      await loadQmChecklistManagement_({ force: true });
    } catch (error) { showToast(error?.message || '저장 오류'); if (button) button.disabled = false; }

  async function loadQmInspectionAnalytics_() { // (QM·룸메이드 품질실적 조회)
    if (state.qmChecklist.analyticsLoading || !$('qmQualityContent')) return;
    state.qmChecklist.analyticsLoading = true;
    $('qmQualityContent').innerHTML = '<div class="settings-loading">점검실적을 불러오는 중입니다.</div>';
    state.qmChecklist.analyticsDate = $('qmQualityDate')?.value || state.qmChecklist.analyticsDate;
    state.qmChecklist.analyticsYear = Number($('qmQualityYear')?.value || state.qmChecklist.analyticsYear);
    state.qmChecklist.analyticsMonth = Number($('qmQualityMonth')?.value || state.qmChecklist.analyticsMonth);
    state.qmChecklist.analyticsSite = $('qmQualitySite')?.value || '';
    try {
      const result = await callServer('getQmInspectionAnalytics', state.token, {
        period: state.qmChecklist.analyticsPeriod,
        date: state.qmChecklist.analyticsDate,
        year: state.qmChecklist.analyticsYear,
        month: state.qmChecklist.analyticsMonth,
        site: state.qmChecklist.analyticsSite
      });
      if (!result?.ok) throw new Error(result?.message || '점검실적을 불러오지 못했습니다.');
      state.qmChecklist.analytics = result;
      renderQmInspectionAnalytics_();
    } catch (error) {
      $('qmQualityContent').innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '점검실적 조회 오류')}</div>`;
    } finally { state.qmChecklist.analyticsLoading = false; }
  }

  function renderQmInspectionAnalytics_() { // (QM·룸메이드 실적표)
    const data = state.qmChecklist.analytics || {};
    const summary = data.summary || {};
    const qm = data.qmManagers || [];
    const roommaids = data.roommaids || [];
    const locations = data.locations || [];
    const inspections = data.inspections || [];
    $('qmQualityContent').innerHTML = `
      <div class="qm-quality-summary">
        ${[['점검수', summary.inspections || 0], ['양호', summary.passed || 0], ['재정비', summary.failed || 0], ['지적건수', summary.defectCount || 0], ['사진', summary.photoCount || 0], ['1실 평균', summary.averageMinutes == null ? '-' : `${summary.averageMinutes}분`]].map(([label,value]) => `<div><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join('')}
      </div>
      <details open><summary>QM 매니저 실적</summary>${qm.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>QM</th><th>점검수량</th><th>재정비 객실</th><th>지적건수</th><th>1실 평균시간</th></tr></thead><tbody>${qm.map(item => `<tr><td>${escapeHtml(item.name || item.employeeNo)}</td><td>${Number(item.inspections || 0)}</td><td>${Number(item.failedInspections || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${item.averageMinutes == null ? '-' : `${item.averageMinutes}분`}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">QM 점검실적이 없습니다.</div>'}</details>
      <details open><summary>룸메이드 품질실적</summary>${roommaids.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>룸메이드</th><th>점검건수</th><th>지적건수</th><th>주요 지적위치</th><th>주요 지적내용</th></tr></thead><tbody>${roommaids.map(item => `<tr><td>${escapeHtml(item.name || item.employeeNo)}</td><td>${Number(item.inspectionCount || 0)}</td><td>${Number(item.defectCount || 0)}</td><td>${escapeHtml(item.topLocations || '-')}</td><td>${escapeHtml((item.majorDefects || []).slice(0,3).map(row => `${row.roomNo} ${row.placeLabel}: ${row.note}`).join(' / ') || '-')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="daily-close-empty">룸메이드 점검실적이 없습니다.</div>'}</details>
      <details><summary>장소별 지적현황</summary>${locations.length ? `<div class="qm-location-chips">${locations.map(item => `<span>${escapeHtml(item.label)} <b>${Number(item.count || 0)}</b></span>`).join('')}</div>` : '<div class="daily-close-empty">지적 내역이 없습니다.</div>'}</details>
      <details><summary>점검이력 ${inspections.length}건</summary>${inspections.length ? `<div class="qm-inspection-history">${inspections.map(item => `<article><div><strong>${escapeHtml(item.roomNo)}</strong><span>${escapeHtml(item.businessDate)} · ${escapeHtml(item.site)} · QM ${escapeHtml(item.qmName || '-')}</span></div><div><b>${item.status === 'PASS' ? '양호' : `지적 ${item.defectCount}건`}</b><span>${item.durationMinutes == null ? '-' : `${item.durationMinutes}분`} · 룸메이드 ${escapeHtml((item.roommaidNames || []).join(' · ') || '-')}</span></div>${item.defects?.length ? `<ul>${item.defects.map(defect => `<li>${escapeHtml(defect.placeLabel || '기타')} · ${escapeHtml(defect.itemLabel || '하자')}: ${escapeHtml(defect.note || '')} ${(defect.photos || []).map(photo => `<button type="button" data-qm-photo-view="${escapeAttr(photo.fileId)}">사진</button>`).join('')}</li>`).join('')}</ul>` : ''}</article>`).join('')}</div>` : '<div class="daily-close-empty">점검이력이 없습니다.</div>'}</details>`;
    $('qmQualityContent').querySelectorAll('[data-qm-photo-view]').forEach(button => button.addEventListener('click', () => openQmPhotoViewer_(button.dataset.qmPhotoView)));
  }

  function applyQmRealtimeRoomLocal_(roomNo, realtimeRoom) { // (QM Realtime 응답 즉시 모바일·추가조회 반영) // QM_BROWSE_REALTIME_STATE_SYNC_V1
    if (!realtimeRoom) return null;
    const mapped = novaRealtimeMapRow_(realtimeRoom);
    let resolvedRoom = null;

    const rooms = state.mobile.data?.rooms || [];
    const index = rooms.findIndex(item => String(item.roomNo || '') === String(roomNo || ''));
    if (index >= 0) {
      const previousRoom = rooms[index];
      rooms[index] = preserveQmMobileRoommaidNames_(previousRoom, novaRealtimeMergeRoom_(previousRoom, mapped));
      resolvedRoom = rooms[index];
    }

    const browse = state.mobile.qmBrowseData;
    if (browse && Array.isArray(browse.rooms)) {
      const browseIndex = browse.rooms.findIndex(item => String(item.roomNo || '') === String(roomNo || ''));
      if (browseIndex >= 0) {
        const previousBrowseRoom = browse.rooms[browseIndex];
        browse.rooms[browseIndex] = preserveQmMobileRoommaidNames_(
          previousBrowseRoom,
          novaRealtimeMergeRoom_(previousBrowseRoom, mapped)
        );
        resolvedRoom = resolvedRoom || browse.rooms[browseIndex];
      }
    }

    if (state.activeMenu === 'qm') {
      if (typeof renderQmBrowseLocationFilters_ === 'function') renderQmBrowseLocationFilters_();
      renderMobileSummary();
      renderMobileList();
    }
    return resolvedRoom;
  }

  function beginQmInspectionDraftInit_(active) { // (상태변경 후 체크리스트 초안은 background 준비)
    if (!active) return Promise.reject(new Error('점검정보가 없습니다.'));
    if (active.draft?.draftId) return Promise.resolve(active);
    if (active.initPromise) return active.initPromise;
    const payload = {
      businessDate: state.mobile.businessDate,
      site: state.mobile.site,
      roomNo: active.roomNo,
      expectedVersion: Number(active.sheetExpectedVersion || 0),
      realtimeStarted: true,
      realtimeVersion: Number(active.roomVersion || 0)
    };
    const promise = callServer('startQmInspection', state.token, payload).then(result => {
      if (!result?.ok) throw new Error(result?.message || '체크리스트 저장준비에 실패했습니다.');
      const serverDraft = result.draft || {};
      const currentDraft = active.draft || { answers: [], defects: [] };
      active.checklist = result.checklist || active.checklist;
      active.draft = active.localDirty
        ? Object.assign({}, serverDraft, currentDraft, {
            draftId: serverDraft.draftId,
            rowNumber: Number(serverDraft.rowNumber || 0),
            startedAt: serverDraft.startedAt || currentDraft.startedAt || '',
            savedAt: serverDraft.savedAt || currentDraft.savedAt || ''
          })
        : serverDraft;
      if (state.qmChecklist.activeInspection === active) {
        const modalOpen = Boolean(document.querySelector('.qm-checklist-modal'));
        if (modalOpen && !active.localDirty) openQmInspectionModal_();
        const status = $('qmDraftSaveStatus');
        if (status) status.textContent = active.localDirty ? '저장 준비 완료 · 변경사항 저장 대기…' : `저장 준비 완료 ${active.draft?.savedAt || ''}`;
        if (modalOpen && active.localDirty) scheduleQmInspectionAutosave_();
      }
      return active;
    });
    const trackedPromise = promise.finally(() => {
      if (active.initPromise === trackedPromise) active.initPromise = null;
    });
    active.initPromise = trackedPromise;
    return trackedPromise;
  }

  async function ensureQmInspectionDraftReady_(active) { // (사진/저장 시 background 초안 준비 완료 보장)
    const target = active || state.qmChecklist.activeInspection;
    if (!target) throw new Error('진행 중인 점검이 없습니다.');
    if (!target.draft?.draftId) await beginQmInspectionDraftInit_(target);
    if (!target.draft?.draftId) throw new Error('체크리스트 저장준비가 완료되지 않았습니다. 다시 시도하세요.');
    return target;
  }

  async function startQmInspection_(roomNo, button) { // (QM_END_TO_END_ACCEL_V1 · 전체 QM 시작경로 DB-first/즉시 체크리스트)
    const local = state.qmChecklist.activeInspection;
    if (local?.roomNo === roomNo) {
      openQmInspectionModal_();
      return;
    }

    const room = (state.mobile.data?.rooms || []).find(item => String(item.roomNo || '') === String(roomNo || ''));
    if (!room) return showToast('점검할 객실을 찾을 수 없습니다.');
    const checklist = state.mobile.data?.qmChecklist || {};
    if (!(checklist.items || []).length && !(checklist.groups || []).length) {
      return showToast('QM 체크리스트를 불러오지 못했습니다. 화면을 새로고침한 뒤 다시 시도하세요.');
    }

    const originalText = button?.textContent || '';
    if (button) {
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      button.textContent = '시작 중…';
    }

    // 네트워크 왕복보다 먼저 체크리스트를 열어 결과/메모 입력을 허용합니다.
    // 사진·저장·완료 등 서버 확정 작업만 시작 확정 전 잠급니다.
    const previewActive = {
      roomNo: String(roomNo || ''),
      checklist,
      draft: { answers: [], defects: [], startedAt: '', savedAt: '' },
      roomVersion: Number(room?.version || 0),
      sheetExpectedVersion: Number(room?.__sheetVersion || 0),
      localDirty: false,
      realtime: true,
      initPromise: null,
      startPending: true
    };
    state.qmChecklist.activeInspection = previewActive;
    openQmInspectionModal_();
    novaQmSetStartPendingControls_(true);
    const pendingStatus = $('qmDraftSaveStatus');
    if (pendingStatus) pendingStatus.textContent = '점검 시작 처리 중 · 체크는 바로 가능합니다.';

    try {
      if (!novaRealtime_.configLoaded) await initNovaRealtime_();
      let result = null;

      if (novaRealtimeIsEnabled_()) {
        // 신규 배정객실과 기존 DB-first 점검중 객실은 한 RPC에서 상태+초안을 함께 확정합니다.
        // 전환 전 QM_CHECKING인데 DB 초안이 없는 객실은 helper가 legacyFallback으로 보호합니다.
        const directResult = await novaQmStartBrowseDbFirst_(room, 'TARGETS');
        if (directResult && !directResult.legacyFallback) {
          result = directResult;
        } else {
          const realtime = await saveRoomActionRealtimeOrLegacy_('updateMobileRoomOperation', {
            businessDate: state.mobile.businessDate,
            site: state.mobile.site,
            roomNo,
            action: 'QM_START',
            expectedVersion: Number(room?.version || 0),
            expectedState: {
              cleaningStatus: String(room?.cleaningStatus || ''),
              qmEmployeeNo: String(room?.qmEmployeeNo || '')
            }
          });
          result = {
            ok: true,
            realtime: true,
            dbFirst: false,
            version: Number(realtime.version || realtime.room?.version || 0),
            room: realtime.room || null,
            checklist,
            draft: null
          };
        }
      } else {
        result = await callServer('startQmInspection', state.token, {
          businessDate: state.mobile.businessDate,
          site: state.mobile.site,
          roomNo,
          expectedVersion: Number(room?.__sheetVersion || room?.version || 0)
        });
      }

      if (!result?.ok) throw new Error(result?.message || '점검을 시작하지 못했습니다.');
      const pendingDraft = collectQmInspectionForm_() || previewActive.draft;
      const hadLocalInput = Boolean(previewActive.localDirty);
      const confirmedChecklist = result.checklist || checklist;
      if (!(confirmedChecklist.items || []).length && !(confirmedChecklist.groups || []).length) {
        throw new Error('QM 체크리스트를 불러오지 못했습니다.');
      }

      const confirmedRoom = Object.assign({}, room, result.room || {}, {
        roomNo: String(roomNo || ''),
        site: String(result.room?.site || room.site || state.mobile.site || ''),
        qmEmployeeNo: String(state.bootstrap?.user?.employeeNo || room.qmEmployeeNo || ''),
        qmName: String(state.bootstrap?.user?.name || room.qmName || ''),
        cleaningStatus: 'QM_CHECKING',
        version: Number(result.version || result.room?.version || room.version || 0)
      });
      applyQmRealtimeRoomLocal_(roomNo, confirmedRoom);
      state.mobile.data.qmChecklist = confirmedChecklist;

      Object.assign(previewActive, {
        checklist: confirmedChecklist,
        draft: result.draft?.draftId
          ? (hadLocalInput ? novaQmMergePendingDraft_(result.draft, pendingDraft) : result.draft)
          : pendingDraft,
        roomVersion: Number(confirmedRoom.version || 0),
        sheetExpectedVersion: result.dbFirst === true ? 0 : Number(room?.__sheetVersion || 0),
        localDirty: hadLocalInput,
        realtime: Boolean(novaRealtimeIsEnabled_()),
        dbFirst: result.dbFirst === true,
        sheetMirrorReady: result.dbFirst === true ? false : true,
        sheetMirrorResult: null,
        sheetMirrorPromise: null,
        startPending: false
      });

      const modalStillOpen = Boolean($('modalRoot') && !$('modalRoot').classList.contains('hidden') && $('qmChecklistInspectionItems'));
      if (state.qmChecklist.activeInspection === previewActive && modalStillOpen) openQmInspectionModal_();

      if (!previewActive.draft?.draftId) {
        void beginQmInspectionDraftInit_(previewActive).catch(error => {
          console.error('[NOVA QM] legacy 체크리스트 background 준비 실패:', error);
          if (state.qmChecklist.activeInspection === previewActive) {
            const status = $('qmDraftSaveStatus');
            if (status) status.textContent = `저장 준비 오류 · ${error?.message || ''}`;
            showToast('점검은 시작됐지만 저장 준비가 지연되고 있습니다. 저장 시 자동 재시도합니다.');
          }
        });
      } else if (previewActive.dbFirst) {
        // 기존 Sheet/품질이력 호환은 사용자 입력과 분리하여 후행합니다.
        void novaQmEnsureDbFirstMirror_(previewActive).catch(error => {
          console.warn('[NOVA QM] 점검시작 Sheet 이력 미러 지연:', error?.message || error);
        });
      }

      const dbMs = Number(result?.timing?.qmDbFirstClientMs || 0);
      setSyncStatus(`${roomNo}호 QM 점검 시작${dbMs ? ` · DB ${dbMs}ms` : ''}`);
      void loadMobileSnapshot({ silent: true, force: true }).catch(error => console.warn('[NOVA QM] 시작 후 화면갱신 실패:', error));
    } catch (error) {
      if (state.qmChecklist.activeInspection === previewActive) state.qmChecklist.activeInspection = null;
      const modalOpen = Boolean($('modalRoot') && !$('modalRoot').classList.contains('hidden'));
      if (modalOpen) closeModal();
      showToast(error?.message || '점검 시작 오류');
    } finally {
      if (button && button.isConnected) {
        button.disabled = false;
        button.removeAttribute('aria-busy');
        button.textContent = originalText || '점검 시작';
      }
    }
  }

  function openQmChecklistModal_(roomNo, button) { // (진행중 점검 다시 열기 호환)
    return startQmInspection_(roomNo, button);
  }

  function openQmInspectionModal_() { // (장소별 실시간 QM 체크리스트)
    const active = state.qmChecklist.activeInspection;
    if (!active) return;
    const checklist = active.checklist || state.mobile.data?.qmChecklist || {};
    const draft = active.draft || { answers: [], defects: [] };
    const answerMap = {};
    (draft.answers || []).forEach(answer => { answerMap[answer.code] = answer; });
    const defects = Array.isArray(draft.defects) ? draft.defects : [];
    openModal(`<div class="modal-card qm-checklist-modal rc3">
      <div class="modal-header"><div><small>QM 실시간 점검</small><h2>${escapeHtml(active.roomNo)} 장소별 체크리스트</h2><p>${escapeHtml(draft.startedAt || '')} 시작</p></div><button class="modal-close" data-close-modal>×</button></div>
      <div class="modal-body">
        <div class="qm-checklist-guide"><b>점검</b> · 양호/불량을 선택하세요. 불량은 내용을 입력하고, 사진 필수 항목만 사진을 등록하세요.<span id="qmDraftSaveStatus">${escapeHtml(draft.savedAt ? `마지막 저장 ${draft.savedAt}` : '저장 대기')}</span></div>
        <div id="qmChecklistInspectionItems" class="qm-checklist-place-list">
          ${(checklist.groups || []).map(group => {
            const placeDefects = defects.filter(defect => defect.placeCode === group.place.code);
            return `<details class="qm-inspection-place" open data-qm-place="${escapeAttr(group.place.code)}"><summary><strong>${escapeHtml(group.place.label)}</strong><span>${group.items.length}개 · 하자 ${placeDefects.length}건</span></summary>
              <div class="qm-place-items">${group.items.map((item,index) => {
                const answer = answerMap[item.code] || {};
                return renderQmInspectionItem_(item, answer, index);
              }).join('')}</div>
              <div class="qm-custom-defects">${placeDefects.map(defect => renderQmCustomDefect_(defect, group.place)).join('')}</div>
              <button class="secondary-button qm-add-defect" type="button" data-qm-add-defect="${escapeAttr(group.place.code)}">+ ${escapeHtml(group.place.label)} 하자 등록</button>
            </details>`;
          }).join('')}
        </div>
        <div class="modal-actions sticky"><button id="qmInspectionSaveOnly" class="secondary-button" type="button">임시 저장</button><button id="qmChecklistSubmit" class="action-button primary" type="button">점검 완료·결과 저장</button></div>
      </div>
    </div>`);
    bindQmInspectionModalEvents_();
    if (active.startPending || (active.dbFirst && !active.sheetMirrorReady)) {
      novaQmSetStartPendingControls_(true);
      const status = $('qmDraftSaveStatus');
      if (active.startPending) {
        if (status) status.textContent = '점검 시작 처리 중 · 체크는 바로 가능합니다.';
      } else if (active.dbFirst) {
        if (status) status.textContent = active.localDirty
          ? '점검 시작 완료 · 입력 보관 중 · 저장 준비 중…'
          : '점검 시작 완료 · 저장 준비 중…';
        void novaQmEnsureDbFirstMirror_(active).then(() => {
          if (state.qmChecklist.activeInspection !== active) return;
          novaQmSetStartPendingControls_(false);
          const readyStatus = $('qmDraftSaveStatus');
          if (readyStatus) readyStatus.textContent = active.localDirty ? '저장 준비 완료 · 변경사항 저장 대기…' : '저장 준비 완료';
          if (active.localDirty) scheduleQmInspectionAutosave_();
        }).catch(error => {
          console.error('[NOVA QM] DB-first 기존 이력 미러 실패:', error);
          if (state.qmChecklist.activeInspection !== active) return;
          const failedStatus = $('qmDraftSaveStatus');
          if (failedStatus) failedStatus.textContent = `저장 준비 오류 · ${error?.message || '재시도 필요'}`;
          showToast('점검 시작은 완료됐지만 저장 준비를 확인해야 합니다. 체크 입력은 보관됩니다.');
        });
      }
    }
  }

  function renderQmInspectionItem_(item, answer, index) { // (장소별 체크리스트 한 항목)
    const photos = answer.photos || [];
    return `<article class="qm-checklist-inspection-item rc3" data-qm-check-code="${escapeAttr(item.code)}">
      <div class="qm-checklist-inspection-heading"><strong>${index + 1}. ${escapeHtml(item.label)}</strong><div>${item.required ? '<span class="required-badge">필수</span>' : '<span>선택</span>'}${item.photoRequired ? '<span class="photo-badge">사진 필수</span>' : ''}</div></div>
      <label><span>점검결과</span><select data-qm-result><option value="">선택</option><option value="PASS"${answer.result === 'PASS' ? ' selected' : ''}>양호</option><option value="FAIL"${answer.result === 'FAIL' ? ' selected' : ''}>불량</option>${item.required ? '' : `<option value="SKIP"${answer.result === 'SKIP' ? ' selected' : ''}>해당없음</option>`}</select></label>
      <label><span>불량내용·점검메모</span><textarea data-qm-note placeholder="불량 선택 시 위치와 내용을 입력하세요.">${escapeHtml(answer.note || '')}</textarea></label>
      <div class="qm-photo-control"><label><span>하자 사진</span><input data-qm-photo-input type="file" accept="image/*" capture="environment"></label><div class="qm-photo-list">${renderQmPhotoChips_(photos, 'ITEM', item.code)}</div></div>
    </article>`;
  }

  function renderQmCustomDefect_(defect, place) { // (추가 하자 카드)
    return `<article class="qm-custom-defect" data-qm-defect-id="${escapeAttr(defect.id)}"><div class="qm-custom-defect-head"><strong>${escapeHtml(place.label)} 추가 하자</strong><button type="button" data-qm-remove-defect="${escapeAttr(defect.id)}">삭제</button></div><label><span>하자내용</span><textarea data-qm-defect-note placeholder="하자 위치와 내용을 입력하세요.">${escapeHtml(defect.note || '')}</textarea></label><div class="qm-photo-control"><label><span>하자 사진(필수)</span><input data-qm-photo-input type="file" accept="image/*" capture="environment"></label><div class="qm-photo-list">${renderQmPhotoChips_(defect.photos || [], 'DEFECT', defect.id)}</div></div></article>`;
  }

  function renderQmPhotoChips_(photos, targetType, targetCode) { // (점검사진 칩)
    return (photos || []).map(photo => `<span class="qm-photo-chip"><button type="button" data-qm-photo-view="${escapeAttr(photo.fileId)}">사진보기</button><small>${escapeHtml(photo.name || '')}</small><button type="button" data-qm-photo-delete="${escapeAttr(photo.fileId)}" data-target-type="${targetType}" data-target-code="${escapeAttr(targetCode)}">×</button></span>`).join('');

  function bindQmInspectionModalEvents_() { // (실시간 입력·사진·하자 이벤트)
    const root = $('qmChecklistInspectionItems');
    if (!root) return;
    root.addEventListener('input', scheduleQmInspectionAutosave_);

      if (event.target.matches('[data-qm-photo-input]')) return uploadQmInspectionPhoto_(event.target);

      const add = event.target.closest('[data-qm-add-defect]');

      if (remove) return removeQmCustomDefect_(remove.dataset.qmRemoveDefect);
      const view = event.target.closest('[data-qm-photo-view]');
      if (view) return openQmPhotoViewer_(view.dataset.qmPhotoView);

    $('qmInspectionSaveOnly').addEventListener('click', () => saveQmInspectionDraftNow_(true));

  function collectQmInspectionForm_() { // (화면의 실시간 답변을 초안 객체에 반영)
    const active = state.qmChecklist.activeInspection;
    if (!active) return null;
    const draft = active.draft || (active.draft = { answers: [], defects: [] });
    const oldAnswers = {};
    (draft.answers || []).forEach(answer => { oldAnswers[answer.code] = answer; });
    draft.answers = [...document.querySelectorAll('[data-qm-check-code]')].map(card => {
      const code = card.dataset.qmCheckCode;
      return Object.assign({}, oldAnswers[code] || {}, {
        code,
        result: card.querySelector('[data-qm-result]')?.value || '',
        note: card.querySelector('[data-qm-note]')?.value.trim() || '',
        photos: oldAnswers[code]?.photos || []
      });
    });
    const oldDefects = {};
    (draft.defects || []).forEach(defect => { oldDefects[defect.id] = defect; });
    draft.defects = [...document.querySelectorAll('[data-qm-defect-id]')].map(card => {
      const id = card.dataset.qmDefectId;
      const placeCode = card.closest('[data-qm-place]')?.dataset.qmPlace || oldDefects[id]?.placeCode || '';
      const place = (active.checklist?.places || []).find(row => row.code === placeCode);
      return Object.assign({}, oldDefects[id] || {}, {
        id, placeCode, placeLabel: place?.label || oldDefects[id]?.placeLabel || '', itemLabel: '추가 하자',
        note: card.querySelector('[data-qm-defect-note]')?.value.trim() || '', photos: oldDefects[id]?.photos || []
      });
    });
    return draft;
  }

  function scheduleQmInspectionAutosave_() { // (입력 후 0.8초 자동저장)
    const active = state.qmChecklist.activeInspection;
    if (active) active.localDirty = true;
    collectQmInspectionForm_();
    const status = $('qmDraftSaveStatus');
    if (active?.startPending) {
      if (status) status.textContent = '점검 시작 처리 중 · 입력 내용 임시 보관';
      return;
    }
    if (status) status.textContent = '변경사항 저장 대기…';
    if (state.qmChecklist.autosaveTimer) clearTimeout(state.qmChecklist.autosaveTimer);
    state.qmChecklist.autosaveTimer = setTimeout(() => saveQmInspectionDraftNow_(false), 800);
  }

  let novaQmDraftLegacyMirrorTimer_ = null;

  async function novaQmDraftAuthBundle_() { // QM_DRAFT_DB_FIRST_V1 · Cloud Run이 발급한 Supabase JWT 재사용
    if (novaRealtime_.qmDraftAuthBundle?.token) return novaRealtime_.qmDraftAuthBundle;
    const auth = await novaRealtimeGetAuth_();
    novaRealtime_.qmDraftAuthBundle = auth;
    return auth;
  }

  async function novaQmDraftDbFirstSave_(draft) { // QM_DRAFT_DB_FIRST_V1 · PostgreSQL row-level 저장
    const active = state.qmChecklist.activeInspection;
    if (!active || !draft?.draftId) throw new Error('QM 초안 정보가 없습니다.');
    const auth = await novaQmDraftAuthBundle_();
    const requestId = novaRealtimeRequestId_('QM_DRAFT_SAVE', draft.draftId);
    const expectedVersion = Number(active.draft?.dbVersion || 0);
    const send = async () => {
      const response = await fetch(`${String(auth.supabaseUrl || '').replace(/\/+$/, '')}/rest/v1/rpc/nova_save_qm_draft`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': String(auth.publishableKey || ''),
          'Authorization': `Bearer ${auth.token}`
        },
        body: JSON.stringify({
          p_draft_id: String(draft.draftId || ''),
          p_business_date: String(draft.businessDate || active.draft?.businessDate || state.mobile.businessDate || ''),
          p_site: String(draft.site || active.draft?.site || state.mobile.site || ''),
          p_room_no: String(draft.roomNo || active.draft?.roomNo || ''),
          p_checklist_revision: String(active.revision || active.draft?.revision || ''),
          p_answers: Array.isArray(draft.answers) ? draft.answers : [],
          p_defects: Array.isArray(draft.defects) ? draft.defects : [],
          p_expected_version: expectedVersion,
          p_request_id: requestId
        })
      });
      let data = null;
      try { data = await response.json(); } catch (_) {}
      return { response, data };
    };
    let { response, data } = await send(); // PUBLIC_QM_DBFIRST_ACCEL_20260905
    if (response.status === 401 && String(data?.code || '').trim().toUpperCase() === 'PGRST303') {
      await new Promise(resolve => window.setTimeout(resolve, 1200));
      ({ response, data } = await send());
    }
    if (!response.ok) {
      const error = new Error(data?.message || data?.details || `QM DB 자동저장 오류 (${response.status})`);
      error.status = response.status;
      error.code = data?.code || '';
      throw error;
    }
    const row = Array.isArray(data) ? data[0] : data;
    if (!row?.draft_id) throw new Error('QM DB 자동저장 응답을 확인할 수 없습니다.');
    active.draft.dbVersion = Number(row.version || expectedVersion || 0);
    active.draft.dbSavedAt = String(row.saved_at || '');
    return { ok: true, savedAt: active.draft.dbSavedAt, dbVersion: active.draft.dbVersion };
  }

  function novaQmScheduleLegacyDraftMirror_(draft) { // QM_DRAFT_DB_FIRST_V1 · 최종제출/기존 이력 호환용 저빈도 미러
    if (novaQmDraftLegacyMirrorTimer_) window.clearTimeout(novaQmDraftLegacyMirrorTimer_);
    const snapshot = JSON.parse(JSON.stringify({
      draftId: draft.draftId,
      draftRowNumber: Number(draft.rowNumber || 0),
      answers: draft.answers || [],
      defects: draft.defects || []
    }));
    novaQmDraftLegacyMirrorTimer_ = window.setTimeout(() => {
      novaQmDraftLegacyMirrorTimer_ = null;
      callServer('saveQmInspectionDraft', state.token, snapshot).catch(error => {
        console.warn('[NOVA QM] DB-first Sheet 미러 지연 · 최종제출은 기존 경로로 보호됩니다.', error);
      });
    }, 5000);
  }

  async function saveQmInspectionDraftNow_(showMessage) { // (점검 초안 서버 저장)
    const active = state.qmChecklist.activeInspection;
    if (!active) return null;
    if (!active?.draft?.draftId) {
      const status = $('qmDraftSaveStatus');
      if (status) status.textContent = '저장 준비 중…';
      try { await ensureQmInspectionDraftReady_(active); }
      catch (error) { if (status) status.textContent = `저장 준비 오류 · ${error?.message || ''}`; if (showMessage) showToast(error?.message || '임시 저장 준비 오류'); return null; }
    }
    if (state.qmChecklist.autosaveTimer) clearTimeout(state.qmChecklist.autosaveTimer);
    state.qmChecklist.autosaveTimer = null;
    const draft = collectQmInspectionForm_() || active.draft;
    const status = $('qmDraftSaveStatus');
    if (status) status.textContent = '저장 중…';
    try {
      let result;
      if (novaRealtime_.qmDraftDbFirstEnabled && novaRealtimeIsEnabled_()) {
        try {
          const dbResult = await novaQmDraftDbFirstSave_(draft);
          result = { ok: true, savedAt: dbResult.savedAt, draft: active.draft, dbFirst: true };
          active.draft = Object.assign({}, active.draft, { answers: draft.answers, defects: draft.defects, dbVersion: dbResult.dbVersion });
          novaQmScheduleLegacyDraftMirror_(Object.assign({}, active.draft, { answers: draft.answers, defects: draft.defects }));
        } catch (dbError) {
          console.warn('[NOVA QM] DB-first 자동저장 실패 · 기존 Sheet 저장으로 즉시 fallback', dbError);
          result = await callServer('saveQmInspectionDraft', state.token, { draftId: draft.draftId, draftRowNumber: Number(draft.rowNumber || 0), answers: draft.answers, defects: draft.defects });
        }
      } else {
        result = await callServer('saveQmInspectionDraft', state.token, { draftId: draft.draftId, draftRowNumber: Number(draft.rowNumber || 0), answers: draft.answers, defects: draft.defects });
      }
      if (!result?.ok) throw new Error(result?.message || '임시 저장하지 못했습니다.');
      active.draft = Object.assign({}, active.draft, result.draft || {}, { answers: draft.answers, defects: draft.defects });
      if (status) status.textContent = `${result.dbFirst ? 'DB 실시간 저장' : '실시간 저장'} ${result.savedAt || ''}`; // QM_DRAFT_DB_FIRST_V1
      if (showMessage) showToast('점검내용을 임시 저장했습니다.');
      return result;
    } catch (error) { if (status) status.textContent = `저장 오류 · ${error?.message || ''}`; if (showMessage) showToast(error?.message || '임시 저장 오류'); return null; }
  }

  function addQmCustomDefect_(placeCode) { // (장소별 추가 하자 카드)
    collectQmInspectionForm_();
    const active = state.qmChecklist.activeInspection;
    const place = (active.checklist?.places || []).find(row => row.code === placeCode);
    active.draft.defects = active.draft.defects || [];
    active.draft.defects.push({ id: `DEF-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, source: 'CUSTOM', placeCode, placeLabel: place?.label || '', itemLabel: '추가 하자', note: '', photos: [] });
    openQmInspectionModal_();
    scheduleQmInspectionAutosave_();

  function removeQmCustomDefect_(defectId) { // (추가 하자 삭제)
    collectQmInspectionForm_();
    const active = state.qmChecklist.activeInspection;
    const defect = (active.draft.defects || []).find(item => item.id === defectId);
    if (defect?.photos?.length) return showToast('등록된 사진을 먼저 삭제한 후 하자를 삭제하세요.');
    active.draft.defects = (active.draft.defects || []).filter(item => item.id !== defectId);
    openQmInspectionModal_();
    scheduleQmInspectionAutosave_();
  }

  // QM_END_TO_END_ACCEL_V1 · QM 하자사진 Supabase Storage 직접경로
  const NOVA_QM_PHOTO_EDGE_SLUG_ = 'nova-qm-photo-v1';

  function novaQmPhotoDirectEnabled_(active) {
    return Boolean(active?.dbFirst && active?.draft?.draftId
      && novaRealtimeIsEnabled_() && novaRealtime_.qmDraftDbFirstEnabled === true
      && window.supabase?.createClient);
  }

  function novaQmBase64Blob_(base64, mimeType) {
    const binary = atob(String(base64 || ''));
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
    return new Blob([bytes], { type: mimeType || 'image/jpeg' });
  }

  async function novaQmPhotoEdgeCall_(payload, retryAuth = true) {
    let auth = await novaQmDraftAuthBundle_();
    const send = async currentAuth => {
      const endpoint = `${String(currentAuth.supabaseUrl || '').replace(/\/+$/, '')}/functions/v1/${NOVA_QM_PHOTO_EDGE_SLUG_}`;
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${String(currentAuth.token || '')}`,
          'apikey': String(currentAuth.publishableKey || '')
        },
        body: JSON.stringify(payload || {})
      });
      const data = await response.json().catch(() => ({}));
      return { response, data };
    };
    let result = await send(auth);
    if (result.response.status === 401 && retryAuth) {
      novaRealtime_.qmDraftAuthBundle = null;
      await novaRealtimeSleep_(120);
      auth = await novaQmDraftAuthBundle_();
      result = await send(auth);
    }
    if (!result.response.ok || !result.data?.ok) {
      const error = new Error(result.data?.message || `QM 사진 Storage 오류 (${result.response.status})`);
      error.status = Number(result.response.status || 0);
      error.data = result.data || null;
      throw error;
    }
    return Object.assign({ __auth: auth }, result.data);
  }

  async function novaQmUploadPhotoDbFirst_(active, targetType, targetCode, image) {
    const clientPhotoId = window.crypto?.randomUUID
      ? `qm:${window.crypto.randomUUID()}`
      : `qm:${Date.now()}:${Math.random().toString(36).slice(2)}`;
    let prepared = null;
    try {
      prepared = await novaQmPhotoEdgeCall_({
        action: 'prepare',
        draftId: active.draft.draftId,
        targetType,
        targetCode,
        clientPhotoId,
        fileName: image.fileName,
        mimeType: 'image/jpeg',
        sizeBytes: Math.ceil(String(image.base64 || '').length * 0.75)
      });
      if (!prepared.ready) {
        const auth = prepared.__auth || await novaQmDraftAuthBundle_();
        const storage = window.supabase.createClient(auth.supabaseUrl, auth.publishableKey, {
          auth: { persistSession: false, autoRefreshToken: false }
        });
        const blob = novaQmBase64Blob_(image.base64, 'image/jpeg');
        const { error } = await storage.storage.from(prepared.bucket).uploadToSignedUrl(
          String(prepared.path || ''), String(prepared.token || ''), blob,
          { contentType: 'image/jpeg', upsert: false }
        );
        if (error) throw new Error(error.message || 'QM 사진 Storage 업로드에 실패했습니다.');
      }
      const finalized = await novaQmPhotoEdgeCall_({
        action: 'finalize',
        photoId: String(prepared.photoId || '')
      });
      const serverDraft = finalized.draft || {};
      active.draft = Object.assign({}, active.draft, serverDraft, {
        rowNumber: Number(active.draft?.rowNumber || 0),
        checklistRevision: String(active.draft?.checklistRevision || active.checklist?.revision || ''),
        dbVersion: Number(serverDraft.dbVersion || active.draft?.dbVersion || 0)
      });
      novaQmScheduleLegacyDraftMirror_(active.draft);
      return finalized;
    } catch (error) {
      // prepare 이후 실패한 PENDING 행은 best-effort 정리하고 검증된 Drive fallback으로 내려갑니다.
      if (prepared?.photoId && !prepared?.ready) {
        try { await novaQmPhotoEdgeCall_({ action: 'delete', photoId: String(prepared.photoId) }, false); }
        catch (cleanupError) { console.warn('[NOVA QM] 실패 사진 PENDING 정리 지연:', cleanupError?.message || cleanupError); }
      }
      throw error;
    }
  }

  async function uploadQmInspectionPhoto_(input) { // (QM_END_TO_END_ACCEL_V1 · DB-first Storage + Drive 안전 fallback)
    const file = input.files?.[0];
    if (!file) return;
    const card = input.closest('[data-qm-check-code], [data-qm-defect-id]');
    if (!card) return;
    const targetType = card.hasAttribute('data-qm-check-code') ? 'ITEM' : 'DEFECT';
    const targetCode = card.dataset.qmCheckCode || card.dataset.qmDefectId;
    input.disabled = true;
    try {
      const active = state.qmChecklist.activeInspection;
      if (!active) throw new Error('진행 중인 점검이 없습니다.');

      // 현재 체크내용 DB 저장과 사진 압축은 서로 독립이므로 병렬 처리합니다.
      const [saveResult, image] = await Promise.all([
        saveQmInspectionDraftNow_(false),
        compressQmPhotoFile_(file)
      ]);

      if (novaQmPhotoDirectEnabled_(active) && saveResult?.ok) {
        try {
          await novaQmUploadPhotoDbFirst_(active, targetType, targetCode, image);
          showToast('하자 사진을 빠르게 등록했습니다.');
          openQmInspectionModal_();
          return;
        } catch (directError) {
          console.warn('[NOVA QM] 하자사진 직접 Storage 실패 · Drive 안전경로 사용:', directError?.message || directError);
          // Drive fallback은 동일 draftId의 Sheet 이력이 준비된 뒤에만 실행합니다.
          await novaQmEnsureDbFirstMirror_(active);
        }
      }

      await ensureQmInspectionDraftReady_(active);
      const result = await callServer('uploadQmInspectionPhoto', state.token, {
        draftId: active.draft.draftId, targetType, targetCode,
        fileName: image.fileName, mimeType: image.mimeType, base64: image.base64
      });
      if (!result?.ok) throw new Error(result?.message || '사진을 등록하지 못했습니다.');
      active.draft = result.draft || active.draft;
      showToast('하자 사진을 등록했습니다.');
      openQmInspectionModal_();
    } catch (error) {
      showToast(error?.message || '사진 등록 오류');
      input.disabled = false;
      input.value = '';
    }
  }

  async function compressQmPhotoFile_(file) { // (모바일 사진 1600px JPEG 압축)
    if (!file.type.startsWith('image/')) throw new Error('이미지 파일만 등록할 수 있습니다.');
    const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('사진을 읽지 못했습니다.')); reader.readAsDataURL(file); });
    const image = await new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('지원하지 않는 사진 형식입니다.')); img.src = dataUrl; });
    const max = 1600;
    const scale = Math.min(1, max / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    const compressed = canvas.toDataURL('image/jpeg', 0.78);
    const base64 = compressed.split(',')[1] || '';
    if (Math.ceil(base64.length * 0.75) > 2500000) throw new Error('사진 용량이 큽니다. 더 낮은 해상도로 촬영해 주세요.');
    return { fileName: file.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', base64 };
  }

  async function deleteQmInspectionPhoto_(button) { // (QM_END_TO_END_ACCEL_V1 · Storage/Drive 사진 삭제 호환)
    const active = state.qmChecklist.activeInspection;
    if (!active?.draft?.draftId) return;
    const fileId = String(button.dataset.qmPhotoDelete || '').trim();
    button.disabled = true;
    try {
      if (fileId.startsWith('sbqm:') && novaRealtimeIsEnabled_()) {
        const result = await novaQmPhotoEdgeCall_({ action: 'delete', photoId: fileId });
        const serverDraft = result.draft || {};
        active.draft = Object.assign({}, active.draft, serverDraft, {
          rowNumber: Number(active.draft?.rowNumber || 0),
          checklistRevision: String(active.draft?.checklistRevision || active.checklist?.revision || ''),
          dbVersion: Number(serverDraft.dbVersion || active.draft?.dbVersion || 0)
        });
        novaQmScheduleLegacyDraftMirror_(active.draft);
        openQmInspectionModal_();
        return;
      }
      const result = await callServer('deleteQmInspectionPhoto', state.token, {
        draftId: active.draft.draftId, targetType: button.dataset.targetType,
        targetCode: button.dataset.targetCode, fileId
      });
      if (!result?.ok) throw new Error(result?.message || '사진을 삭제하지 못했습니다.');
      active.draft = result.draft || active.draft;
      openQmInspectionModal_();
    } catch (error) { showToast(error?.message || '사진 삭제 오류'); button.disabled = false; }
  }

  async function openQmPhotoViewer_(fileId) { // (QM_END_TO_END_ACCEL_V1 · Storage/Drive 사진 조회 호환)
    const safeFileId = String(fileId || '').trim();
    const win = window.open('', '_blank');
    if (!win) return showToast('브라우저에서 팝업을 허용해 주세요.');
    win.document.write('<title>QM 사진 불러오는 중</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}</style><p>사진을 불러오는 중입니다.</p>');
    win.document.close();
    try {
      let name = 'QM 사진';
      let src = '';
      if (safeFileId.startsWith('sbqm:') && novaRealtimeIsEnabled_()) {
        const result = await novaQmPhotoEdgeCall_({ action: 'view', photoId: safeFileId });
        name = result.photo?.name || name;
        src = String(result.signedUrl || '');
      } else {
        const result = await callServer('getQmInspectionPhoto', state.token, { fileId: safeFileId });
        if (!result?.ok) throw new Error(result?.message || '사진을 불러오지 못했습니다.');
        name = result.name || name;
        src = String(result.dataUrl || '');
      }
      if (!src) throw new Error('사진 조회 주소를 확인하지 못했습니다.');
      win.document.open();
      win.document.write(`<title>${escapeHtml(name)}</title><style>body{margin:0;background:#111;display:grid;place-items:center;min-height:100vh}img{max-width:100%;max-height:100vh;object-fit:contain}</style><img src="${src}">`);
      win.document.close();
    } catch (error) {
      try { win.close(); } catch (_) {}
      showToast(error?.message || '사진 조회 오류');
    }
  }


  async function submitQmInspectionDetailWithBusyRetry_(payload) { // LIVE_OPERATION_RETRY_RESILIENCE_V1 · QM 상세이력 BUSY_RETRY 전용 재시도
    const delays = [0, 500, 1300, 2600];
    let lastResult = null;
    for (let index = 0; index < delays.length; index += 1) {
      if (delays[index]) await wait_(delays[index] + Math.round(Math.random() * 180));
      const result = await callServer('submitQmChecklistInspection', state.token, payload);
      if (result?.ok !== false) return result;
      const code = String(result?.code || '').trim().toUpperCase();
      if (code !== 'BUSY_RETRY' || index === delays.length - 1) return result;
      lastResult = result;
    }
    return lastResult || { ok: false, code: 'BUSY_RETRY', message: 'QM 상세이력 저장이 지연되고 있습니다.' };
  }

  async function submitQmInspectionFinal_(event) { // (QM Realtime 최종상태 즉시반영·상세이력 background 저장)
    const button = event.currentTarget;
    button.disabled = true;
    const active = state.qmChecklist.activeInspection;
    if (!active) { button.disabled = false; return; }
    const draft = collectQmInspectionForm_();
    const items = active.checklist?.items || [];
    const answerMap = {};
    (draft.answers || []).forEach(answer => { answerMap[answer.code] = answer; });
    const missing = items.find(item => !answerMap[item.code]?.result);
    if (missing) { showToast(`${missing.placeLabel} · ${missing.label} 점검결과를 선택하세요.`); button.disabled = false; return; }
    const failNoNote = items.find(item => answerMap[item.code]?.result === 'FAIL' && !answerMap[item.code]?.note);
    if (failNoNote) { showToast(`${failNoNote.placeLabel} 불량 내용을 입력하세요.`); button.disabled = false; return; }
    const photoMissing = items.find(item => item.photoRequired && !(answerMap[item.code]?.photos || []).length);
    if (photoMissing) { showToast(`${photoMissing.placeLabel} · ${photoMissing.label} 항목의 사진을 등록하세요.`); button.disabled = false; return; }
    const invalidDefect = (draft.defects || []).find(defect => !defect.note || !(defect.photos || []).length);
    if (invalidDefect) { showToast('추가 하자는 내용과 사진을 모두 등록하세요.'); button.disabled = false; return; }

    if (state.qmChecklist.autosaveTimer) window.clearTimeout(state.qmChecklist.autosaveTimer);
    state.qmChecklist.autosaveTimer = null;
    const passed = !items.some(item => answerMap[item.code]?.result === 'FAIL') && !(draft.defects || []).length;
    const realtimeAction = 'QM_COMPLETE'; // QM_REWORK_OPERATIONAL_STATUS_V1 · FAIL은 품질자료만 기록
    const targetStatus = 'QM_COMPLETED';
    const requestId = novaRealtimeRequestId_(realtimeAction, active.roomNo);
    const room = (state.mobile.data?.rooms || []).find(item => String(item.roomNo || '') === String(active.roomNo || ''));

    try {
      if (!novaRealtime_.configLoaded) await initNovaRealtime_();
      if (!novaRealtimeIsEnabled_()) {
        await ensureQmInspectionDraftReady_(active);
        const result = await callServer('submitQmChecklistInspection', state.token, {
          businessDate: state.mobile.businessDate, site: state.mobile.site, roomNo: active.roomNo,
          draftId: active.draft.draftId, draftRowNumber: Number(active.draft.rowNumber || 0), revision: active.checklist.revision,
          answers: draft.answers, defects: draft.defects, expectedVersion: Number(active.roomVersion || 0)
        });
        if (!result?.ok) throw new Error(result?.message || '점검결과를 저장하지 못했습니다.');
        state.qmChecklist.activeInspection = null;
        closeModal();
        showToast(result.message || '점검결과를 저장했습니다.');
        loadMobileSnapshot({ silent: true, force: true }).catch(error => console.warn('[NOVA QM] 완료 후 화면갱신 실패:', error));
        return;
      }

      const realtime = await saveRoomActionRealtimeOrLegacy_('updateMobileRoomOperation', {
        businessDate: state.mobile.businessDate,
        site: state.mobile.site,
        roomNo: active.roomNo,
        action: realtimeAction,
        requestId,
        expectedVersion: Number(active.roomVersion || room?.version || 0),
        expectedState: {
          cleaningStatus: String(room?.cleaningStatus || 'QM_CHECKING'),
          qmEmployeeNo: String(room?.qmEmployeeNo || state.bootstrap?.user?.employeeNo || '')
        }
      });
      applyQmRealtimeRoomLocal_(active.roomNo, realtime.room);
      active.roomVersion = Number(realtime.version || realtime.room?.version || active.roomVersion || 0);
      state.qmChecklist.activeInspection = null;
      closeModal();
      showToast(passed ? 'QM 점검완료를 반영했습니다.' : `QM 점검완료 · 불량 ${(draft.defects || []).length + items.filter(item => answerMap[item.code]?.result === 'FAIL').length}건 기록`);

      // 무거운 Sheet 체크리스트/품질이력 저장은 사용자 응답 경로 밖에서 이어서 처리한다.
      const persistDetail = async () => {
        await ensureQmInspectionDraftReady_(active);
        if (active.dbFirst) await novaQmEnsureDbFirstMirror_(active);
        return submitQmInspectionDetailWithBusyRetry_({ // LIVE_OPERATION_RETRY_RESILIENCE_V1
          businessDate: state.mobile.businessDate,
          site: state.mobile.site,
          roomNo: active.roomNo,
          draftId: active.draft.draftId,
          draftRowNumber: Number(active.draft.rowNumber || 0),
          revision: active.checklist.revision,
          answers: draft.answers,
          defects: draft.defects,
          expectedVersion: Number(active.sheetExpectedVersion || 0),
          realtimeCommitted: true,
          realtimeTargetStatus: targetStatus,
          realtimeRequestId: requestId,
          realtimeVersion: Number(realtime.version || 0)
        });
      };
      void persistDetail().then(result => {
        if (!result?.ok) throw new Error(result?.message || 'QM 상세이력 저장 실패');
        loadMobileSnapshot({ silent: true, force: true }).catch(error => console.warn('[NOVA QM] 상세이력 저장 후 갱신 실패:', error));
      }).catch(error => {
        console.error('[NOVA QM] 상태 반영 후 상세이력 저장 실패:', error);
        showToast(`QM 상태는 반영됐지만 상세이력 저장을 확인해야 합니다. · ${error?.message || ''}`);
      });
    } catch (error) {
      showToast(error?.message || '체크리스트 저장 오류');
      button.disabled = false;
    }
  }

  async function loadMobileSnapshot(options = {}) { // (직무별 모바일 데이터 조회)
    if (state.mobile.loading && !options.force) return;
    state.mobile.loading = true;
    const previousY = window.scrollY;
    if (!options.silent && $('mobileList')) $('mobileList').innerHTML = '<div class="mobile-loading">업무를 불러오고 있습니다.</div>';
    try {
      const result = await callServer('getMobileSnapshot', state.token, {
        businessDate: state.mobile.businessDate || state.bootstrap.app.businessDate,
        site: state.mobile.site
      });
      if (!result?.ok) throw new Error(result?.message || '모바일 업무를 불러오지 못했습니다.');
      applyMobileSnapshot(result);
      const mobileRole = String(state.bootstrap?.user?.role || '').toUpperCase();
      if (mobileRole === 'QM' && qmMobileBrowseView_() !== 'TARGETS') {
        await loadQmMobileBrowse_({ force: Boolean(options.force) });
      }
      if (state.mobile.restoreScrollPending) {
        state.mobile.restoreScrollPending = false;
        requestAnimationFrame(() => window.scrollTo({ top: Number(state.scrollY || 0), behavior: 'auto' }));
      } else if (options.silent) {
        requestAnimationFrame(() => window.scrollTo({ top: previousY, behavior: 'auto' }));
      }
      startMobileSync();
      setSyncStatus(`모바일 동기화 · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);
    } catch (error) {
      if ($('mobileList')) $('mobileList').innerHTML = `<div class="mobile-empty">${escapeHtml(error?.message || '업무를 불러오지 못했습니다.')}</div>`;
      setSyncStatus(`연결 오류 · ${error?.message || '모바일 조회 실패'}`);
    } finally {
      state.mobile.loading = false;
    }
  }

  function applyMobileSnapshot(result) { // (모바일 데이터 상태 반영)
    const previousRooms = state.mobile.data?.rooms || [];
    if (novaRealtimeIsEnabled_() && state.bootstrap?.user?.role === 'ROOMMAID' && Array.isArray(result.rooms) && previousRooms.length) {
      result.rooms = novaRealtimeProtectRoomArray_(result.rooms, previousRooms);
    }
    state.mobile.loaded = true;
    state.mobile.data = result;
    state.mobile.version = Number(result.version || 0);
    state.mobile.businessDate = result.selection?.businessDate || state.mobile.businessDate || state.bootstrap.app.businessDate;
    if (state.mobile.businessDate) sessionStorage.setItem('novaMobileBusinessDate', state.mobile.businessDate);
    state.mobile.site = result.selection?.site ?? state.mobile.site;
    sessionStorage.setItem('novaMobileSite', String(state.mobile.site || ''));
    restoreMobileViewPreference_(); // MOBILE_VIEW_STATE_PERSIST_V2
    renderMobileData();
    const mobileRole = String(state.bootstrap?.user?.role || '').toUpperCase();
    if (novaRealtimeIsEnabled_() && ['ROOMMAID', 'QM'].includes(mobileRole)) {
      // ROOMMAID/QM은 Sheet 첫 화면 이후 DB의 본인 배정목록을 바로 보정한다.
      void novaRealtimeHydrateCurrentView_();
      // QM_END_TO_END_ACCEL_V1 · 점검버튼을 누르기 전에 DB-first 인증을 준비해 첫 왕복을 줄입니다.
      if (mobileRole === 'QM' && novaRealtime_.qmDraftDbFirstEnabled === true) {
        void novaQmDraftAuthBundle_().catch(error => console.warn('[NOVA QM] 인증 사전준비 지연:', error?.message || error));
      }
    } else if (novaRealtimeIsEnabled_() && mobileRole === 'HOUSEMAN') {
      // HOUSEMAN도 첫 Sheet 화면 직후 DB 배정목록을 바로 보조조회한다.
      window.setTimeout(() => { void syncMobileDelta(); }, 0);
    }
  }

  function renderMobileData() { // (모바일 화면 부분 렌더링)
    if (!$('mobilePage') || !state.mobile.data) return;
    ensureMobileSelectionControlsVisible_();
    const siteSelect = $('mobileSite');
    const sessionSite = String(state.bootstrap.user?.sessionSite || '').trim();
    const siteScopeLocked = Boolean(state.bootstrap.user?.siteScopeLocked && sessionSite);
    const selectedSite = siteScopeLocked ? sessionSite : String(state.mobile.site || '').trim();
    const sites = siteScopeLocked ? [sessionSite] : [...new Set([
      ...(state.mobile.data.sites || []),
      selectedSite,
      String(state.bootstrap.user.defaultSite || '').trim()
    ].map(site => String(site || '').trim()).filter(Boolean))];
    if (siteSelect) {
      siteSelect.innerHTML = siteScopeLocked
        ? sites.map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`).join('')
        : '<option value="">전체 사업장</option>' + sites.map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`).join('');
      siteSelect.value = selectedSite;
      siteSelect.disabled = siteScopeLocked;
      if (siteScopeLocked) {
        state.mobile.site = sessionSite;
        sessionStorage.setItem('novaMobileSite', sessionSite);
      }
    } // SITE_SCOPE_INDICATOR_CLOSE_V2
    const dateInput = $('mobileDate');
    if (dateInput) dateInput.value = state.mobile.businessDate || state.bootstrap.app.businessDate;
    renderMobileLocationFilters_();
    renderQmBrowseTabs_();
    renderQmBrowseLocationFilters_();
    renderMobileSummary();
    renderMobileFilters();
    renderMobileList();
  }

  function ensureMobileSelectionControlsVisible_() { // (모든 모바일 권한 날짜·사업장 선택영역 강제 노출)
    const panel = document.querySelector('[data-mobile-selection-controls]');
    if (!panel) return;
    panel.hidden = false;
    panel.classList.remove('hidden');
    panel.style.removeProperty('display');
    panel.style.removeProperty('visibility');
    panel.style.removeProperty('opacity');
    ['mobileDate', 'mobileSite'].forEach(id => {
      const control = $(id);
      if (!control) return;
      control.hidden = false;
      control.disabled = false;
      control.classList.remove('hidden');
      control.style.removeProperty('display');
      control.style.removeProperty('visibility');
      control.style.removeProperty('opacity');
    });
  }

  function renderMobileLocationFilters_() { // (PUBLIC·ROOMMAID·QM 점검대상 동·층 조회 필터) // MOBILE_LOCATION_FILTER_PERSIST_V1
    const panel = $('mobilePublicLocationFilters');
    const buildingSelect = $('mobileBuilding');
    const floorSelect = $('mobileFloor');
    if (!panel || !buildingSelect || !floorSelect) return;
    const role = String(state.mobile.data?.role || '').trim().toUpperCase();
    const visible = role === 'PUBLIC' || role === 'ROOMMAID' || (role === 'QM' && qmMobileBrowseView_() === 'TARGETS');
    panel.hidden = !visible;
    if (!visible) return;
    restoreMobileLocationPreference_();

    const rooms = state.mobile.data?.rooms || [];
    const buildings = [...new Set(rooms.map(room => String(room.building || '').trim()).filter(Boolean))]
      .sort((a, b) => Number(a.replace(/\D/g, '')) - Number(b.replace(/\D/g, '')) || a.localeCompare(b, 'ko'));
    if (state.mobile.building && !buildings.includes(state.mobile.building)) state.mobile.building = '';
    buildingSelect.innerHTML = '<option value="">전체 동</option>' + buildings.map(building => `<option value="${escapeAttr(building)}">${escapeHtml(building)}</option>`).join('');
    buildingSelect.value = state.mobile.building;

    const floors = [...new Set(rooms
      .filter(room => !state.mobile.building || room.building === state.mobile.building)
      .map(room => String(room.floor || '').trim()).filter(Boolean))]
      .sort((a, b) => Number(a) - Number(b) || a.localeCompare(b, 'ko'));
    if (state.mobile.floor && !floors.includes(state.mobile.floor)) state.mobile.floor = '';
    floorSelect.innerHTML = '<option value="">전체 층</option>' + floors.map(floor => `<option value="${escapeAttr(floor)}">${escapeHtml(floor)}층</option>`).join('');
    floorSelect.value = state.mobile.floor;
  }

  function qmMobileBrowseView_() { // (QM 추가조회 탭 · 기존 점검대상 화면 보존 · QM 추가탭 동·층 필터 + 안전 즉시점검)
    const role = String(state.mobile.data?.role || '').trim().toUpperCase();
    if (role !== 'QM') return 'TARGETS';
    const view = String(state.mobile.qmView || 'TARGETS').trim().toUpperCase();
    return ['TARGETS', 'CLEANED', 'VACANT'].includes(view) ? view : 'TARGETS';
  }

  function qmMobileBrowseKey_(view) { // (QM 추가조회 선택범위 캐시키)

    panel.querySelectorAll('[data-qm-browse-view]').forEach(button => button.addEventListener('click', async () => {
