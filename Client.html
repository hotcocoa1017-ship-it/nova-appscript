      if (event.key === 'Enter') loadMonthlyHistory({ page: 1 });
    });
    $('monthlyYear').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyMonth').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyDate').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyPrevDay').addEventListener('click', () => moveMonthlyDay_(-1));
    $('monthlyToday').addEventListener('click', () => {
      $('monthlyDate').value = formatClientDate_(new Date());
      loadMonthlyHistory({ page: 1 });
    });
    $('monthlyNextDay').addEventListener('click', () => moveMonthlyDay_(1));
    $('monthlyType').addEventListener('change', () => loadMonthlyHistory({ page: 1, resetDetailFilters: true }));
    $('monthlySite').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyEmployee').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyStatus').addEventListener('change', () => loadMonthlyHistory({ page: 1 }));
    $('monthlyExcelButton').addEventListener('click', downloadMonthlyExcel_);

  function applyMonthlyPeriodUi_(period) { // (월별·일별 입력영역 전환)
    const daily = period === 'DAILY';
    state.monthly.period = daily ? 'DAILY' : 'MONTHLY';
    document.querySelectorAll('#monthlyPeriodToggle [data-period]').forEach(button => {
      button.classList.toggle('active', button.dataset.period === state.monthly.period);
      button.setAttribute('aria-selected', button.dataset.period === state.monthly.period ? 'true' : 'false');
    });
    $('monthlyYearField')?.classList.toggle('hidden', daily);
    $('monthlyMonthField')?.classList.toggle('hidden', daily);
    $('monthlyDateField')?.classList.toggle('hidden', !daily);
    $('monthlyDayNav')?.classList.toggle('hidden', !daily);
    $('monthlyControls')?.classList.toggle('daily-mode', daily);
    $('dailyCloseSaveButton')?.classList.toggle('hidden', !daily);
    $('dailyCloseCancelButton')?.classList.toggle('hidden', state.bootstrap?.user?.role !== 'ADMIN' || !daily || !['CLOSED', 'MIXED'].includes(String(state.monthly.data?.close?.source || '').toUpperCase()));
    if ($('monthlyPageTitle')) {
      $('monthlyPageTitle').textContent = `${daily ? '일별' : '월별'} 룸메이드·QM·하우스맨 이력`;
    }
  }

  function moveMonthlyDay_(delta) { // (일별 이전·다음 날짜 이동)
    const current = String($('monthlyDate')?.value || state.monthly.date || formatClientDate_(new Date()));
    const match = current.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    const date = match
      ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]) + Number(delta || 0), 12, 0, 0)
      : new Date();
    $('monthlyDate').value = formatClientDate_(date);
    loadMonthlyHistory({ page: 1 });
  }

  function formatClientDate_(date) { // (브라우저 현지 날짜 YYYY-MM-DD)
    const value = date instanceof Date ? date : new Date(date);
    const year = value.getFullYear();
    const month = String(value.getMonth() + 1).padStart(2, '0');
    const day = String(value.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function collectMonthlyFilters_(overrides = {}) { // (월별·일별 화면 조회조건 수집)
    const resetDetail = overrides.resetDetailFilters === true;
    const period = String(state.monthly.period || 'MONTHLY').toUpperCase() === 'DAILY' ? 'DAILY' : 'MONTHLY';
    return {
      period,
      date: String($('monthlyDate')?.value || state.monthly.date || formatClientDate_(new Date())),
      year: Number($('monthlyYear')?.value || state.monthly.year || new Date().getFullYear()),
      month: Number($('monthlyMonth')?.value || state.monthly.month || new Date().getMonth() + 1),
      site: resetDetail ? '' : String($('monthlySite')?.value ?? state.monthly.site ?? ''),
      type: String($('monthlyType')?.value || state.monthly.type || 'ALL'),
      employeeNo: resetDetail ? '' : String($('monthlyEmployee')?.value ?? state.monthly.employeeNo ?? ''),
      status: resetDetail ? '' : String($('monthlyStatus')?.value ?? state.monthly.status ?? ''),
      search: String($('monthlySearch')?.value ?? state.monthly.search ?? '').trim(),
      page: Number(overrides.page || state.monthly.page || 1),
      pageSize: 100
    };
  }

  async function loadMonthlyHistory(overrides = {}) { // (월별·일별 이력 서버 조회)
    if (state.monthly.loading) return;
    state.monthly.loading = true;
    const filters = collectMonthlyFilters_(overrides);
    const periodLabel = filters.period === 'DAILY' ? '일별' : '월별';
    if ($('monthlyTableBody')) $('monthlyTableBody').innerHTML = `<tr><td colspan="10" class="table-empty">${periodLabel} 데이터를 불러오는 중입니다.</td></tr>`;
    try {
      const result = await callServer('getMonthlyHistory', state.token, filters);
      if (!result?.ok) throw new Error(result?.message || '조회 데이터를 불러오지 못했습니다.');
      state.monthly.loaded = true;
      state.monthly.data = result;
      Object.assign(state.monthly, result.filters || {});
      renderMonthlyData_();
      const rangeText = state.monthly.period === 'DAILY'
        ? state.monthly.date
        : `${state.monthly.year}-${String(state.monthly.month).padStart(2, '0')}`;
      setSyncStatus(`${periodLabel}조회 ${rangeText} · ${Number(result.pagination?.total || 0).toLocaleString('ko-KR')}건 · ${result.serverTime || ''}`);
    } catch (error) {
      if ($('monthlyTableBody')) $('monthlyTableBody').innerHTML = `<tr><td colspan="10" class="table-empty error">${escapeHtml(error?.message || '통합조회 오류')}</td></tr>`;
      showToast(error?.message || '통합조회 오류');
    } finally {
      state.monthly.loading = false;
    }
  }

  function renderMonthlyData_() { // (월별·일별 조회 결과 전체 렌더링)
    const data = state.monthly.data;
    if (!data) return;
    applyMonthlyPeriodUi_(state.monthly.period);
    renderMonthlyFilterOptions_(data.options || {});
    renderMonthlySummary_(data.summary || {});
    renderDailyClosePanel_(data.close || {});
    renderMonthlyQmQuality_(data.qmQuality || {});
    renderMonthlyStaffSummary_(data.staffSummary || []);
    renderMonthlyTable_(data.items || []);
    renderMonthlyPagination_(data.pagination || {});
  }

  function renderMonthlyFilterOptions_(options) { // (월별·일별 필터 선택값 반영)
    const preserve = { site: state.monthly.site || '', employeeNo: state.monthly.employeeNo || '', status: state.monthly.status || '' };
    const siteOptions = ['<option value="">전체 사업장</option>'].concat((options.sites || []).map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`));
    $('monthlySite').innerHTML = siteOptions.join('');
    $('monthlySite').value = preserve.site;
    $('monthlyEmployee').innerHTML = ['<option value="">전체 사업장</option>'].concat((options.employees || []).map(user => `<option value="${escapeAttr(user.employeeNo)}">${escapeHtml(user.name)} (${escapeHtml(user.employeeNo)})</option>`)).join('');
    $('monthlyEmployee').value = preserve.employeeNo;
    $('monthlyStatus').innerHTML = ['<option value="">전체 사업장</option>'].concat((options.statuses || []).map(status => `<option value="${escapeAttr(status.code)}">${escapeHtml(status.label)}</option>`)).join('');
    $('monthlyStatus').value = preserve.status;
    $('monthlyYear').value = String(state.monthly.year);
    $('monthlyMonth').value = String(state.monthly.month);
    $('monthlyDate').value = state.monthly.date || formatClientDate_(new Date());
    $('monthlyType').value = state.monthly.type;
    $('monthlySearch').value = state.monthly.search || '';
  }

  function renderMonthlySummary_(summary) { // (월별·일별 요약 카드)
    const average = summary.averageMinutes === null || summary.averageMinutes === undefined ? '-' : `${summary.averageMinutes}분`;
    const cards = [
      ['전체 기록', summary.total || 0], ['완료', summary.completed || 0], ['진행·기타', summary.active || 0],
      ['처리불가', summary.unable || 0], ['객실', summary.uniqueRooms || 0], ['인정 정비수', summary.recognizedUnits || 0], ['평균 처리', average]
    ];
    $('monthlySummary').innerHTML = cards.map(([label, value]) => `<div class="monthly-summary-card"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join('');
  }

  function renderMonthlyQmQuality_(quality) { // (월별·일별 QM 시간·룸메이드 지적실적)
    const panel = $('monthlyQmQualityPanel');

    const summary = quality?.summary || {};

      panel.innerHTML = '';
      panel.classList.add('hidden');
      return;
    }
    panel.classList.remove('hidden');
    const qm = quality.qmManagers || [];
    const roommaids = quality.roommaids || [];
    const locations = quality.locations || [];
    panel.innerHTML = `<div class="daily-close-heading"><div><small>QM 점검 품질</small><strong>${state.monthly.period === 'DAILY' ? escapeHtml(state.monthly.date) : `${state.monthly.year}년 ${state.monthly.month}월`}</strong></div><span class="daily-close-status closed">점검 ${Number(summary.inspections || 0)}실 · 평균 ${summary.averageMinutes == null ? '-' : `${summary.averageMinutes}분`}</span></div>
      <div class="qm-quality-summary compact">${[['양호',summary.passed||0],['재정비',summary.failed||0],['지적건수',summary.defectCount||0],['사진',summary.photoCount||0]].map(([label,value])=>`<div><span>${escapeHtml(label)}</span><strong>${Number(value||0)}</strong></div>`).join('')}</div>
      <div class="daily-close-details">
        <details><summary>QM 매니저 실적</summary>${qm.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>QM</th><th>점검수량</th><th>재정비</th><th>지적</th><th>1실 평균</th></tr></thead><tbody>${qm.map(item=>`<tr><td>${escapeHtml(item.name||item.employeeNo)}</td><td>${Number(item.inspections||0)}</td><td>${Number(item.failedInspections||0)}</td><td>${Number(item.defectCount||0)}</td><td>${item.averageMinutes==null?'-':`${item.averageMinutes}분`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="daily-close-empty">QM 실적이 없습니다.</div>'}</details>
        <details><summary>룸메이드 점검·지적 실적</summary>${roommaids.length ? `<div class="daily-close-table-wrap"><table><thead><tr><th>룸메이드</th><th>점검건수</th><th>지적건수</th><th>주요 위치</th><th>주요 내용</th></tr></thead><tbody>${roommaids.map(item=>`<tr><td>${escapeHtml(item.name||item.employeeNo)}</td><td>${Number(item.inspectionCount||0)}</td><td>${Number(item.defectCount||0)}</td><td>${escapeHtml(item.topLocations||'-')}</td><td>${escapeHtml((item.majorDefects||[]).slice(0,3).map(row=>`${row.roomNo} ${row.placeLabel}: ${row.note}`).join(' / ')||'-')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="daily-close-empty">룸메이드 품질실적이 없습니다.</div>'}</details>
        <details><summary>주요 지적위치</summary><div class="qm-location-chips">${locations.map(item=>`<span>${escapeHtml(item.label)} <b>${Number(item.count||0)}</b></span>`).join('')}</div></details>
      </div>`;
  }

  function renderDailyClosePanel_(close) { // (공식 마감통계 패널 렌더링)
    const panel = $('dailyClosePanel');
    if (!panel) return;
    const summary = close?.summary || {};
    const daily = String(close?.period || state.monthly.period || '').toUpperCase() === 'DAILY';
    const source = String(close?.source || 'NONE').toUpperCase();
    const status = source === 'CLOSED' ? '마감 저장완료' : source === 'MIXED' ? '일부 사업장 저장' : source === 'LIVE' ? '실시간 미마감' : '마감자료 없음';

  async function saveDailyCloseFromMonthly_() { // (일별 공식 마감 저장·갱신)
    const button = $('dailyCloseSaveButton');
    if (!button || state.monthly.period !== 'DAILY') return;
    const businessDate = String($('monthlyDate')?.value || state.monthly.date || '').trim();
    const site = String($('monthlySite')?.value || state.monthly.site || '').trim();
    if (!businessDate) return showToast('마감할 업무일자를 선택하세요.');
    const original = button.textContent;
    button.disabled = true;
    button.textContent = '마감 저장 중…';
    try {
      const result = await callServer('saveDailyCloseSnapshot', state.token, { businessDate, site });
      if (!result?.ok) throw new Error(result?.message || '마감자료를 저장하지 못했습니다.');
      showToast(result.message || '마감자료를 저장했습니다.');
      await loadMonthlyHistory({ page: 1 });
    } catch (error) {
      showToast(error?.message || '마감 저장 오류');
    } finally {
      button.disabled = false;
      button.textContent = original;
    }
  }

  function buildExcelXml_(headers, rows) { // (Excel 2003 XML 문서 생성)
    const allRows = [headers].concat(rows);
    const body = allRows.map((row, rowIndex) => `<Row>${row.map(value => {
      const isNumber = rowIndex > 0 && typeof value === 'number' && Number.isFinite(value);
      return `<Cell><Data ss:Type="${isNumber ? 'Number' : 'String'}">${excelXmlEscape_(value)}</Data></Cell>`;
    }).join('')}</Row>`).join('');
    return `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="통합조회"><Table>${body}</Table></Worksheet></Workbook>`;
  }

  function excelXmlEscape_(value) { // (Excel XML 문자열 처리)
    return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&apos;');
  }

  function downloadTextFile_(filename, content, mimeType) { // (브라우저 파일 저장)
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function formatMonthlyMinutes_(value) { // (월별 소요시간 표시)
    const minutes = Number(value);
    if (!Number.isFinite(minutes) || minutes < 0) return '-';
    if (minutes < 60) return `${minutes}분`;
    const hours = Math.floor(minutes / 60);
    const remain = Math.round((minutes - hours * 60) * 10) / 10;
    return remain ? `${hours}시간 ${remain}분` : `${hours}시간`;
  }

  async function loadIndicatorSnapshot(options = {}) { // (통합 화면 데이터 조회)
    if (state.indicator.loading && !options.force) return;
    state.indicator.loading = true;
    if (!options.silent) setSyncStatus('통합 화면 불러오는 중…');
    const startedAt = performance.now();
    try {
      const result = await callServer('getIndicatorSnapshot', state.token, {
        businessDate: state.indicator.businessDate || state.bootstrap.app.businessDate,
        site: state.indicator.site
      });
      if (!result?.ok) throw new Error(result?.message || '통합 화면을 불러오지 못했습니다.');
      applyIndicatorSnapshot(result);
      const elapsed = Math.round(performance.now() - startedAt);
      setSyncStatus(`동기화 ${elapsed}ms · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);
      startIndicatorSync();
    } catch (error) {
      showToast(error?.message || '통합 화면 조회 오류');
      setSyncStatus(`연결 오류 · ${error?.message || '조회 실패'}`);
    } finally {
      state.indicator.loading = false;
    }
  }

  function indicatorRoomSnapshotKey_(room) { // (객실 스냅샷 비교키)
    return `${String(room?.site || '')}|${String(room?.roomNo || '')}`;
  }

  function indicatorRoomSnapshotSignature_(room) { // (객실카드 시각 변경 비교)
    if (!room) return '';
    return JSON.stringify([
      room.roomStatus || '', room.displayBaseRoomStatus || '', room.cleaningStatus || '', room.cleaningType || '', room.assignmentType || '',
      room.roommaidEmployeeNo || '', room.roommaidName || '', room.secondaryRoommaidEmployeeNo || '', room.secondaryRoommaidName || '',
      room.qmEmployeeNo || '', room.qmName || '', Boolean(room.preassigned), Boolean(room.vip), Boolean(room.importantRoom),
      normalizeIndicatorRoomOperationalStatus_(room.operationalStatus), Number(room.pendingOrderCount || 0), Number(room.version || 0), room.previousCycle || null
    ]);
  }

  function indicatorOrdersSnapshotSignature_(orders) { // (오더목록 변경 비교)
    return JSON.stringify((orders || []).map(order => [
      order.orderId, order.statusCode, order.assignedEmployeeNo, order.processorEmployeeNo,
      order.updatedAt, order.itemSummary, Boolean(order.important), Boolean(order.handover)
    ]));
  }

  function novaRealtimeProtectOrderArray_(incomingOrders, currentOrders) { // (DB 선등록 오더를 지연된 Sheet 스냅샷으로부터 보호)
    if (!novaRealtimeIsEnabled_() || !Array.isArray(incomingOrders) || !Array.isArray(currentOrders)) return incomingOrders;
    const merged = incomingOrders.slice();
    const incomingIds = new Set(merged.map(order => String(order?.orderId || '')).filter(Boolean));
    const now = Date.now();
    currentOrders.forEach(order => {
      const orderId = String(order?.orderId || '');
      if (!orderId || incomingIds.has(orderId)) return;
      const protectedOrder = order?.__pendingSave === true
        || order?.__sheetMirrorPending === true
        || Number(order?.__localProtectUntil || 0) > now;
      if (protectedOrder) merged.unshift(order);
    });
    merged.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''))
      || String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')));
    return merged;
  }

  function isHousemanItemEditorOpen_() { // (품목 입력 중 백그라운드 전체 렌더링 방지)
    const root = $('modalRoot');
    return Boolean(root && !root.classList.contains('hidden') && $('itemEditorRows'));
  }

  function patchIndicatorChangedRooms_(previousRooms, nextRooms) { // (변경 객실카드만 교체)
    const grid = $('roomGrid');
    if (!grid) return false;
    const previousMap = new Map((previousRooms || []).map(room => [indicatorRoomSnapshotKey_(room), room]));
    const nextMap = new Map((nextRooms || []).map(room => [indicatorRoomSnapshotKey_(room), room]));
    if (previousMap.size !== nextMap.size) return false;
    for (const key of previousMap.keys()) if (!nextMap.has(key)) return false;

    const changed = [];
    nextMap.forEach((room, key) => {
      if (indicatorRoomSnapshotSignature_(previousMap.get(key)) !== indicatorRoomSnapshotSignature_(room)) changed.push(room);
    });
    if (changed.length > 40) return false;

    const cardByRoomNo = new Map(Array.from(grid.querySelectorAll('[data-room-no]')).map(card => [card.dataset.roomNo, card]));
    for (const room of changed) {
      const existing = cardByRoomNo.get(room.roomNo) || null;
      const visible = roomMatchesIndicatorFilter_(room);
      if (existing && visible) existing.outerHTML = roomCardHtml_(room);
      else if (existing && !visible) existing.remove();
      else if (!existing && visible) return false;
    }
    if (!grid.querySelector('[data-room-no]')) {
      grid.innerHTML = '<div class="room-empty">선택한 조건에 표시할 객실이 없습니다.</div>';
    }
    return true;
  }

  function applyIndicatorSnapshot(result) { // (통합 화면 스냅샷 차등 반영)
    const pageScroll = window.scrollY;
    const orderScrollTop = $('orderScroll')?.scrollTop || 0;
    const previousData = state.indicator.data;
    const previousRooms = previousData?.rooms || [];
    const previousOrdersSignature = indicatorOrdersSnapshotSignature_(previousData?.orders || []);
    const sameSelection = Boolean(previousData
      && String(previousData.selection?.businessDate || '') === String(result.selection?.businessDate || state.indicator.businessDate || '')
      && String(previousData.selection?.site || '') === String(result.selection?.site ?? state.indicator.site ?? ''));

    if (novaRealtimeIsEnabled_() && Array.isArray(result.rooms) && Array.isArray(previousRooms) && previousRooms.length) {
      result.rooms = novaRealtimeProtectRoomArray_(result.rooms, previousRooms);
    }
    if (novaRealtimeIsEnabled_() && sameSelection && Array.isArray(result.orders) && Array.isArray(previousData?.orders)) {
      result.orders = novaRealtimeProtectOrderArray_(result.orders, previousData.orders);
    }
    const deferUiRender = isHousemanItemEditorOpen_();
    state.indicator.loaded = true;
    state.indicator.version = Number(result.version || 0);
    state.indicator.businessDate = result.selection?.businessDate || state.indicator.businessDate;
    state.indicator.site = result.selection?.site ?? state.indicator.site;
    state.indicator.data = Object.assign({}, previousData || {}, result);

    if (deferUiRender) {
      if (novaRealtimeIsEnabled_()) void novaRealtimeEnsureSubscriptions_();
      return;
    }

    const canPatch = Boolean(sameSelection && $('indicatorPage') && previousData && Array.isArray(result.rooms));
    const patched = canPatch && patchIndicatorChangedRooms_(previousRooms, state.indicator.data.rooms || []);
    if (patched) {
      renderIndicatorSelects();
      renderIndicatorSummary();
      renderRoomFilters();
      if (previousOrdersSignature !== indicatorOrdersSnapshotSignature_(state.indicator.data.orders || [])) renderOrderList();
      updateItemPickerLabel();
      updateHousemanRoutingPreview_();
    } else {
      renderIndicatorData();
    }

    requestAnimationFrame(() => {
      window.scrollTo({ top: pageScroll, behavior: 'auto' });
      if ($('orderScroll')) $('orderScroll').scrollTop = orderScrollTop;
    });
    if (novaRealtimeIsEnabled_()) {
      void novaRealtimeHydrateCurrentView_();
      void novaRealtimeEnsureSubscriptions_();
    }
  }

  function renderIndicatorData() { // (통합 화면 데이터 렌더링)

  function renderOrderList() { // (처리현황 내부 스크롤 목록)

          order.statusCode === 'ASSIGNED' && order.routeLocked !== true && Array.isArray(order.routeCandidateNames) && order.routeCandidateNames.length > 1
            ? `${order.routeCandidateNames.join('·')} 공동`
            : (order.assignedName || order.processorName || '미배정')
        )}</span>
        <span class="status-chip status-${escapeAttr(order.statusCode)}">${escapeHtml(order.statusLabel)}</span>
      </div>`).join('');

  function renderRoomFilters() { // (객실상태별 수량·동·층 통합 필터)
    const filterContainer = $('roomFilters');
    const locationContainer = $('roomLocationFilters');
    if (!filterContainer || !locationContainer || !state.indicator.data) return;

    normalizeIndicatorLocationSelection_();
    const scopedRooms = getIndicatorLocationScopedRooms_();
    const counts = buildIndicatorStatusCounts_(scopedRooms);
    const filters = [
      { code: 'ALL', label: '전체' },
      { code: 'CLEANING_ONLY', label: '청소중' }
    ].concat(state.indicator.data?.codes?.roomStatuses || []).concat([
      { code: 'OPERATION_ROOM_CHECK', label: '객실확인' },
      { code: 'OPERATION_BROKEN', label: '고장객실' }
    ]);

    filterContainer.innerHTML = filters.map(filter => `
      <button type="button" class="filter-button room-status-filter${state.indicator.filter === filter.code ? ' active' : ''}" data-room-filter="${escapeAttr(filter.code)}">
        <span>${escapeHtml(filter.label)}</span><strong class="filter-count">${Number(counts[filter.code] || 0).toLocaleString('ko-KR')}</strong>
      </button>`).join('');

    const buildings = getIndicatorBuildings_();
    const floors = getIndicatorFloors_(state.indicator.building);
    locationContainer.innerHTML = `
      <label class="room-location-control" for="roomBuildingFilter">
        <span>동</span>
        <select id="roomBuildingFilter" aria-label="객실 동 필터">
          <option value="">전체 동</option>
          ${buildings.map(building => `<option value="${escapeAttr(building)}"${state.indicator.building === building ? ' selected' : ''}>${escapeHtml(building)}</option>`).join('')}
        </select>
      </label>
      <label class="room-location-control" for="roomFloorFilter">
        <span>층</span>
        <select id="roomFloorFilter" aria-label="객실 층 필터">
          <option value="">전체 층</option>
          ${floors.map(floor => `<option value="${escapeAttr(floor)}"${state.indicator.floor === floor ? ' selected' : ''}>${escapeHtml(floor)}층</option>`).join('')}
        </select>
      </label>
      <button id="roomFilterResetButton" class="filter-button room-filter-reset" type="button">초기화</button>`;

    filterContainer.querySelectorAll('[data-room-filter]').forEach(button => {
      button.addEventListener('click', () => {
        state.indicator.filter = button.dataset.roomFilter;
        renderRoomFilters();
        renderRoomGrid();
      });
    });
    $('roomBuildingFilter').addEventListener('change', event => {
      state.indicator.building = event.target.value;
      state.indicator.floor = '';
      renderRoomFilters();
      renderRoomGrid();
    });
    $('roomFloorFilter').addEventListener('change', event => {
      state.indicator.floor = event.target.value;
      renderRoomFilters();
      renderRoomGrid();
    });
    $('roomFilterResetButton').addEventListener('click', resetIndicatorRoomFilters_);
  }

  function buildIndicatorStatusCounts_(rooms) { // (현재 동·층 범위의 상태별 객실수 계산)
    const data = state.indicator.data || {};
    const counts = {
      ALL: (rooms || []).length,
      CLEANING_ONLY: 0,
      OPERATION_ROOM_CHECK: 0,
      OPERATION_BROKEN: 0
    };
    (data.codes?.roomStatuses || []).forEach(code => { counts[code.code] = 0; });
    (rooms || []).forEach(room => {
      const roomStatusCode = indicatorCodeValue_(data.codes?.roomStatuses, room.roomStatus);
      const cleaningStatusCode = indicatorCodeValue_(data.codes?.cleaningStatuses, room.cleaningStatus || 'WAITING').toUpperCase();
      const operationalStatusCode = normalizeIndicatorRoomOperationalStatus_(room.operationalStatus);
      if (cleaningStatusCode === 'CLEANING') counts.CLEANING_ONLY += 1;
      if (operationalStatusCode === 'ROOM_CHECK') counts.OPERATION_ROOM_CHECK += 1;
      if (operationalStatusCode === 'BROKEN') counts.OPERATION_BROKEN += 1;
      if (Object.prototype.hasOwnProperty.call(counts, roomStatusCode)) counts[roomStatusCode] += 1;
    });
    return counts;
  }

  function indicatorCodeValue_(codes, value) { // (인디게이터 필터용 원본 코드값 변환)
    const text = String(value || '').trim();
    const found = (codes || []).find(code => String(code.code || '').trim() === text || String(code.label || '').trim() === text);
    return found ? String(found.code || '').trim() : text;
  }

  function getIndicatorBuildings_() { // (현재 업무일자·사업장의 실제 동 목록)
    return Array.from(new Set((state.indicator.data?.rooms || [])
      .map(room => String(room.building || '').trim()).filter(Boolean)))
      .sort(compareIndicatorLocationText_);
  }

  function getIndicatorFloors_(building) { // (선택 동에 실제 존재하는 층 목록)
    const selectedBuilding = String(building || '').trim();
    return Array.from(new Set((state.indicator.data?.rooms || [])
      .filter(room => !selectedBuilding || String(room.building || '').trim() === selectedBuilding)
      .map(room => String(room.floor || '').trim()).filter(Boolean)))
      .sort(compareIndicatorLocationText_);
  }

  function compareIndicatorLocationText_(a, b) { // (동·층 숫자 우선 정렬)
    const aNumber = Number(String(a || '').replace(/\D/g, ''));
    const bNumber = Number(String(b || '').replace(/\D/g, ''));
    if (Number.isFinite(aNumber) && Number.isFinite(bNumber) && aNumber !== bNumber) return aNumber - bNumber;
    return String(a || '').localeCompare(String(b || ''), 'ko', { numeric: true, sensitivity: 'base' });
  }

  function normalizeIndicatorLocationSelection_() { // (데이터 변경 후 존재하지 않는 동·층 선택값 해제)
    const buildings = getIndicatorBuildings_();
    if (state.indicator.building && !buildings.includes(state.indicator.building)) {
      state.indicator.building = '';
      state.indicator.floor = '';
    }
    const floors = getIndicatorFloors_(state.indicator.building);
    if (state.indicator.floor && !floors.includes(state.indicator.floor)) state.indicator.floor = '';
  }

  function resetIndicatorRoomFilters_() { // (검색·상태·동·층 필터 초기화)
    state.indicator.filter = 'ALL';
    state.indicator.search = '';
    state.indicator.building = '';
    state.indicator.floor = '';
    if ($('roomSearch')) $('roomSearch').value = '';
    renderRoomFilters();
    renderRoomGrid();
  }

  function indicatorPrintRoomStatusCode_(room) { // (인쇄용 실제 객실상태 코드)
    return indicatorCodeValue_(state.indicator.data?.codes?.roomStatuses, room?.roomStatus || '').toUpperCase();
  }

  function indicatorPrintRoomCategory_(room) { // (인쇄용 퇴실예정·재고·투숙·공실·퇴실 구분)
    const code = indicatorPrintRoomStatusCode_(room);
    return {
      code,
      dueOut: code === 'DUE_OUT',
      stock: ['STOCK', 'STOCK_RC', 'STOCK_HU'].includes(code),
      stay: ['STAY', 'RECHECKIN'].includes(code),
      vacant: code === 'VACANT_CLEAN',
      checkedOut: ['CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU'].includes(code),
      variant: code.endsWith('_RC') ? 'R/C' : code.endsWith('_HU') ? 'H/U' : code === 'RECHECKIN' ? '재입실' : ''
    };
  }

  function indicatorPrintMarkHtml_(active, variant) { // (인쇄표 상태 체크표시)
    if (!active) return '';
    return `<span class="print-status-mark">●</span>${variant ? `<small>${escapeHtml(variant)}</small>` : ''}`;
  }

  function indicatorPrintCleaningLabel_(room) { // (인쇄용 정비상태 축약표시)
    const code = indicatorCodeValue_(state.indicator.data?.codes?.cleaningStatuses, room?.cleaningStatus || 'WAITING').toUpperCase();
    if (code === 'WAITING') return 'VD';
    if (code === 'NOT_REQUIRED') return 'N/R';
    if (code === 'ASSIGNED') return '배정';
    if (code === 'CLEANING') return '청소중';
    if (code === 'COMPLETED') return 'VC';
    if (code === 'QM_WAITING') return '점검대기';
    if (code === 'QM_CHECKING') return '점검중';
    if (code === 'QM_COMPLETED') return 'VC';
    return codeLabel_(state.indicator.data?.codes?.cleaningStatuses, room?.cleaningStatus || code || '-');
  }

  function getIndicatorPrintRooms_() { // (인쇄범위: 현재 사업장·동·층 전체 객실)
    return (state.indicator.data?.rooms || [])
      .filter(roomMatchesIndicatorLocation_)
      .slice()
      .sort((a, b) => {
        const siteCompare = String(a.site || '').localeCompare(String(b.site || ''), 'ko', { numeric: true, sensitivity: 'base' });
        if (siteCompare) return siteCompare;
        const buildingCompare = compareIndicatorLocationText_(a.building || '', b.building || '');
        if (buildingCompare) return buildingCompare;
        return String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' });
      });
  }

  function buildIndicatorPrintBlocks_(rooms) { // (인쇄용 사업장·동별 층 가로배치 그룹 구성)
    const grouped = new Map();
    const floorSet = new Set();
    (rooms || []).forEach(room => {
      const site = String(room.site || '').trim() || '사업장 미지정';
      const building = String(room.building || '').trim() || '동 미지정';
      const floor = String(room.floor || '').trim() || '층 미지정';
      floorSet.add(floor);
      const key = `${site}\u0000${building}`;
      if (!grouped.has(key)) grouped.set(key, { site, building, floors: new Map() });
      const group = grouped.get(key);
      if (!group.floors.has(floor)) group.floors.set(floor, []);
      group.floors.get(floor).push(room);
    });

    const floorOrder = Array.from(floorSet).sort(compareIndicatorLocationText_);
    const buildings = Array.from(grouped.values()).sort((a, b) => {
      const siteCompare = a.site.localeCompare(b.site, 'ko', { numeric: true, sensitivity: 'base' });
      if (siteCompare) return siteCompare;
      return compareIndicatorLocationText_(a.building, b.building);
    });

    buildings.forEach(group => {
      group.floorOrder = floorOrder.slice();
      group.maxRoomCount = 0;
      floorOrder.forEach(floor => {
        const floorRooms = group.floors.get(floor) || [];
        floorRooms.sort((a, b) => String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' }));
        group.maxRoomCount = Math.max(group.maxRoomCount, floorRooms.length);
      });
    });
    return buildings;
  }

  function indicatorPrintFloorHtml_(buildingGroup, floor, showSite) { // (인쇄용 한 동의 1개 층 블록)
    const rooms = buildingGroup.floors.get(floor) || [];
    if (!rooms.length) return '<div class="floor-block floor-block-empty" aria-hidden="true"></div>';
    const rows = rooms.map(room => {
      const category = indicatorPrintRoomCategory_(room);
      const statusLabel = category.dueOut ? '퇴실예정'
        : category.stock ? '재고'
          : category.stay ? '투숙'
            : category.vacant ? '공실'
              : category.checkedOut ? '퇴실'
                : (codeLabel_(state.indicator.data?.codes?.roomStatuses, room?.roomStatus || category.code || '-') || '-');
      return `<tr>
        <td class="room-no"><strong>${escapeHtml(room.roomNo || '-')}</strong></td>
        <td class="room-status">${escapeHtml(statusLabel)}</td>
      </tr>`;
    }).join('');
    const floorText = String(floor || '').trim();
    const floorLabel = floorText && floorText !== '층 미지정' ? `${floorText}층` : floorText;
    const titlePrefix = showSite ? `${escapeHtml(buildingGroup.site)} · ` : '';
    return `<section class="floor-block">
      <div class="floor-block-title">${titlePrefix}${escapeHtml(buildingGroup.building)} ${escapeHtml(floorLabel)}</div>
      <table>
        <colgroup><col class="c-room"><col class="c-status"></colgroup>
        <thead><tr><th>객실</th><th>상태</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
  }

  function indicatorPrintBlockHtml_(buildingGroup, showSite) { // (인쇄용 한 행에 한 동·층 가로배치)
    const floorOrder = buildingGroup.floorOrder || [];
    const floorCount = Math.max(1, floorOrder.length);
    return `<section class="building-row" style="--floor-count:${floorCount}">
      <div class="building-floor-grid">${floorOrder.map(floor => indicatorPrintFloorHtml_(buildingGroup, floor, showSite)).join('')}</div>
    </section>`;
  }

  function indicatorPrintBuildingNumber_(building) { // (인쇄 페이지 분리용 동 숫자 추출)
    const matched = String(building || '').match(/\d+/);
    return matched ? Number(matched[0]) : Number.POSITIVE_INFINITY;
  }

  function paginateIndicatorPrintBuildings_(buildings) { // (A3 세로: 1~5동 1페이지·6~9동 2페이지 고정 분리)
    const firstPage = [];
    const secondPage = [];
    const extra = [];
    (buildings || []).forEach(building => {
      const buildingNumber = indicatorPrintBuildingNumber_(building.building);
      if (buildingNumber >= 1 && buildingNumber <= 5) firstPage.push(building);
      else if (buildingNumber >= 6 && buildingNumber <= 9) secondPage.push(building);
      else extra.push(building);
    });

    const pages = [];
    if (firstPage.length) pages.push(firstPage);
    if (secondPage.length) pages.push(secondPage);
    for (let index = 0; index < extra.length; index += 5) pages.push(extra.slice(index, index + 5));
    return pages;
  }

  function openIndicatorPrintPreview_() { // (통합 인디게이터 A3 세로·1~5동/6~9동 페이지분리 인쇄 미리보기)
    if (!state.indicator.data) {
      showToast('먼저 통합 인디게이터를 불러와 주세요.');
      return;
    }
    const rooms = getIndicatorPrintRooms_();
    if (!rooms.length) {
      showToast('현재 사업장·동·층 범위에 출력할 객실이 없습니다.');
      return;
    }

    const printWindow = window.open('', '_blank');
    if (!printWindow) {
      showToast('인쇄 미리보기 창이 차단되었습니다. 브라우저 팝업을 허용해 주세요.');
      return;
    }

    const buildings = buildIndicatorPrintBlocks_(rooms);
    const pages = paginateIndicatorPrintBuildings_(buildings);
    const sites = Array.from(new Set(rooms.map(room => String(room.site || '').trim()).filter(Boolean)));
    const showSiteInBlock = sites.length > 1;
    const businessDate = String(state.indicator.businessDate || state.indicator.data?.selection?.businessDate || state.bootstrap?.app?.businessDate || '');
    const siteLabel = state.indicator.site || (sites.length === 1 ? sites[0] : '전체 사업장');
    const locationLabel = [state.indicator.building ? `${state.indicator.building}` : '전체 동', state.indicator.floor ? `${state.indicator.floor}층` : '전체 층'].join(' · ');
    const printedBy = String(state.bootstrap?.user?.name || '');
    const printedAt = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    const pageHtml = pages.map((pageBuildings, pageIndex) => `<section class="print-page">
      <header class="print-header">
        <div class="title-wrap"><strong>객실 현황</strong><span>${escapeHtml(siteLabel)} · ${escapeHtml(locationLabel)}</span></div>
        <div class="print-header-right"><strong>${escapeHtml(businessDate)}</strong><span>${escapeHtml(printedAt)}${printedBy ? ` · ${escapeHtml(printedBy)}` : ''} · ${pageIndex + 1}/${pages.length}</span></div>
      </header>
      <div class="building-list">${pageBuildings.map(building => indicatorPrintBlockHtml_(building, showSiteInBlock)).join('')}</div>
    </section>`).join('');

    printWindow.document.open();
    printWindow.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>NOVA 객실 현황 ${escapeHtml(businessDate)}</title><style>

      body{font-size:9px}
      .screen-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb}
      .screen-toolbar button{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
      .screen-toolbar .primary{background:#171717;color:#fff;border-color:#171717}
      .screen-note{max-width:1200px;margin:9px auto 0;padding:0 12px;color:#737373;font-size:11px}
      .print-page{width:285mm;min-height:408mm;margin:10px auto;background:#fff;padding:0;page-break-after:always}
      .print-page:last-of-type{page-break-after:auto}
      .print-header{height:11mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4d4d4;padding:0 1mm}
      .title-wrap,.print-header-right{display:flex;align-items:baseline;gap:3mm;min-width:0}
      .print-header strong{font-size:14px;letter-spacing:-.2px;white-space:nowrap}
      .print-header span{font-size:8.2px;color:#737373;white-space:nowrap}
      .print-header-right{justify-content:flex-end}.print-header-right strong{font-size:10px}
      .building-list{display:flex;flex-direction:column;gap:3mm;padding-top:2.5mm}
      .building-row{width:100%;break-inside:avoid;page-break-inside:avoid}
      .building-floor-grid{display:grid;grid-template-columns:repeat(var(--floor-count),minmax(0,1fr));gap:0 1.2mm;align-items:start}
      .floor-block{min-width:0}
      .floor-block-empty{min-height:1px}
      .floor-block-title{height:5mm;display:flex;align-items:center;padding:0 .8mm;font-size:8.8px;font-weight:800;border-bottom:1px solid #a3a3a3;color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.2px;line-height:1}
      .c-room{width:68%}.c-status{width:32%}
      th,td{border-bottom:.4px solid #e5e5e5;padding:0 .7mm;height:3.55mm;overflow:hidden}
      th{height:4.2mm;background:#fafafa;color:#8a8a8a;font-size:5.2px;font-weight:700;border-bottom:.6px solid #d4d4d4;text-align:left}
      td.room-no{text-align:left;white-space:nowrap}td.room-no strong{font-size:8.8px;font-weight:800;color:#171717}
      td.room-status{text-align:right;white-space:nowrap;font-size:7.6px!important;font-weight:800;color:#444;letter-spacing:-.15px}
      tbody tr:last-child td{border-bottom:1px solid #aaa}
      @media print{html,body{background:#fff}.screen-toolbar,.screen-note{display:none!important}.print-page{width:auto;min-height:0;margin:0}}
    </style></head><body>
      <div class="screen-toolbar"><button type="button" onclick="window.close()">닫기</button><button type="button" class="primary" onclick="window.print()">인쇄</button></div>
      <div class="screen-note">※ A3 세로 기준 · 1~5동은 1페이지, 6~9동은 2페이지로 분리합니다. 한 행에 한 동을 배치하고 층은 숫자순으로 정렬합니다. R/C·H/U는 재고 또는 퇴실로 단순 표기합니다.</div>
      ${pageHtml}
    </body></html>`);
    printWindow.document.close();
    printWindow.focus();
  }

  function renderRoomGrid() { // (객실카드 목록)
    const grid = $('roomGrid');
    if (!grid || !state.indicator.data) return;
    applyRoomGridColumns_();
    const rooms = getFilteredRooms_();
    if (!rooms.length) {
      grid.innerHTML = '<div class="room-empty">선택한 필터 조건에 표시할 객실이 없습니다.<br>업무일자·사업장·동·층·객실상태를 확인해 주세요.</div>';
      return;
    }
    grid.innerHTML = rooms.map(room => roomCardHtml_(room)).join('');
  }

  function applyRoomGridColumns_() { // (객실카드 열 수 즉시 적용)
    const grid = $('roomGrid');
    if (!grid) return;
    const columns = normalizeRoomColumns_(state.indicator.roomColumns);
    state.indicator.roomColumns = columns;
    grid.style.setProperty('--room-columns', String(columns));
    grid.classList.toggle('room-grid-dense', columns >= 11);
    const select = $('roomColumnSelect');
    if (select && Number(select.value) !== columns) select.value = String(columns);
  }

  function normalizeRoomColumns_(value) { // (객실카드 열 수 5~13 제한)
    const parsed = Number.parseInt(value, 10);
    return Number.isFinite(parsed) && parsed >= 5 && parsed <= 13 ? parsed : 9;
  }

  function roomMatchesIndicatorLocation_(room) { // (객실 동·층 필터 일치 확인)
    const building = String(state.indicator.building || '').trim();
    const floor = String(state.indicator.floor || '').trim();
    return (!building || String(room.building || '').trim() === building)
      && (!floor || String(room.floor || '').trim() === floor);
  }

  function roomMatchesIndicatorFilter_(room) { // (동·층·객실상태·검색 통합 필터)
    if (!roomMatchesIndicatorLocation_(room)) return false;
    const data = state.indicator.data || {};
    const roomStatusCode = indicatorCodeValue_(data.codes?.roomStatuses, room.roomStatus);
    const cleaningStatusCode = indicatorCodeValue_(data.codes?.cleaningStatuses, room.cleaningStatus || 'WAITING').toUpperCase();
    const operationalStatusCode = normalizeIndicatorRoomOperationalStatus_(room.operationalStatus);
    if (state.indicator.filter === 'CLEANING_ONLY') {
      if (cleaningStatusCode !== 'CLEANING') return false;
    } else if (state.indicator.filter === 'OPERATION_ROOM_CHECK') {
      if (operationalStatusCode !== 'ROOM_CHECK') return false;
    } else if (state.indicator.filter === 'OPERATION_BROKEN') {
      if (operationalStatusCode !== 'BROKEN') return false;
    } else if (state.indicator.filter !== 'ALL' && roomStatusCode !== state.indicator.filter) {
      return false;
    }
    const query = String(state.indicator.search || '').toLowerCase();
    if (!query) return true;
    const operationalSearchText = normalizeIndicatorRoomOperationalStatus_(room.operationalStatus) === 'BROKEN'
      ? '고장 (0.0.0)'
      : indicatorRoomOperationalStatusLabel_(room.operationalStatus);
    return [room.roomNo, room.building, room.floor, room.roommaidName, room.secondaryRoommaidName, room.qmName, room.roomStatus, room.displayBaseRoomStatus, indicatorRoomCardStatusLabel_(room), room.cleaningStatus, operationalSearchText]
      .some(value => String(value || '').toLowerCase().includes(query));
  }

  function getIndicatorLocationScopedRooms_() { // (상태 수량 계산용 동·층 범위 객실)
    return (state.indicator.data?.rooms || []).filter(roomMatchesIndicatorLocation_);
  }

  function getFilteredRooms_() { // (동·층·객실상태·검색 객실카드 필터 적용)
    return (state.indicator.data?.rooms || []).filter(roomMatchesIndicatorFilter_);
  }

  function normalizeIndicatorRoomOperationalStatus_(value) { // (통합 인디게이터 고장·객실확인 코드 정리)
    const raw = String(value || '').trim();
    const upper = raw.toUpperCase().replace(/\s+/g, '_');
    if (!raw) return '';
    if (['BROKEN', 'OUT_OF_ORDER', 'OOO', 'O.O.O', '0.0.0', '고장'].includes(upper) || raw === '고장') return 'BROKEN';
    if (['ROOM_CHECK', 'ROOMCHECK', 'CHECK_ROOM', '객실확인'].includes(upper) || raw === '객실확인') return 'ROOM_CHECK';
    return '';
  }

  function indicatorRoomOperationalStatusLabel_(value) { // (객실 조치상태 카드 표시명)
    const code = normalizeIndicatorRoomOperationalStatus_(value);
    if (code === 'BROKEN') return '(0.0.0)';
    if (code === 'ROOM_CHECK') return '객실확인';
    return '';
  }

  function indicatorRoomOperationalStatusClass_(value) { // (객실 조치상태 카드 클래스명)
    const code = normalizeIndicatorRoomOperationalStatus_(value);
    return code === 'BROKEN' ? 'broken' : code === 'ROOM_CHECK' ? 'room-check' : '';
  }

  function indicatorRoomCardBaseStatusCode_(room) { // (객실카드 현재 정비주기 기준 객실상태)
    const roomStatuses = state.indicator.data?.codes?.roomStatuses || [];
    const currentCode = codeValue_(roomStatuses, room?.roomStatus || '').toUpperCase();
    const storedCode = codeValue_(roomStatuses, room?.displayBaseRoomStatus || '').toUpperCase();
    const cleaningTargets = new Set(['STOCK', 'STOCK_RC', 'STOCK_HU', 'CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU']);
    if (cleaningTargets.has(currentCode)) return currentCode;
    if (currentCode === 'VACANT_CLEAN' && cleaningTargets.has(storedCode)) return storedCode;
    return currentCode;
  }

  function indicatorCycleCleaningLabel_(cycle) { // (정비주기별 청소상태 카드 전문표기)
    const code = codeValue_(state.indicator.data?.codes?.cleaningStatuses, cycle?.cleaningStatus || 'WAITING').toUpperCase();
    if (code === 'WAITING') return 'VD';
    if (code === 'NOT_REQUIRED') return 'N/R';
    if (code === 'ASSIGNED') return '배정';
    if (code === 'CLEANING') return '청소중';
    if (['COMPLETED', 'QM_COMPLETED'].includes(code)) return 'VC';
    return codeLabel_(state.indicator.data?.codes?.cleaningStatuses, cycle?.cleaningStatus || 'WAITING');
  }

  function indicatorCycleCleaningTooltip_(cycle) { // (VC·VD·N/R 마우스 한글 설명)
    const code = String(cycle?.cleaningStatusCode || codeValue_(state.indicator.data?.codes?.cleaningStatuses, cycle?.cleaningStatus || 'WAITING')).trim().toUpperCase();
    if (code === 'WAITING') return '미완료';
    if (code === 'NOT_REQUIRED') return '정비대상 아님';
    if (['COMPLETED', 'QM_COMPLETED'].includes(code)) return '청소완료';
    return '';
  }

  function isIndicatorCleaningCompletionLocked_(value) { // (청소완료 중복요청 화면 차단)
    const code = codeValue_(state.indicator.data?.codes?.cleaningStatuses, value || '').toUpperCase();
    return ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'].includes(code);
  }

  function indicatorRoomCycleView_(room, previous) { // (객실카드 1개 정비주기 표시정보)
    const source = previous ? (room.previousCycle || {}) : room;
    const roomStatuses = state.indicator.data?.codes?.roomStatuses || [];
    let roomStatusCode = previous
      ? codeValue_(roomStatuses, source.roomStatus || '').toUpperCase()
      : indicatorRoomCardBaseStatusCode_(room);

    // 청소완료로 현재 객실상태가 공실(VACANT_CLEAN)이 된 경우에도
    // 마지막 정비대상 상태(재고·퇴실·퇴실R/C·퇴실H/U)를 카드에 유지합니다.
    if (!previous && roomStatusCode === 'VACANT_CLEAN') {
      const preserved = codeValue_(roomStatuses, room?.displayBaseRoomStatus || '').toUpperCase();
      if (['STOCK', 'STOCK_RC', 'STOCK_HU', 'CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU'].includes(preserved)) {
        roomStatusCode = preserved;
      }
    }

    const roomStatusLabel = codeLabel_(roomStatuses, roomStatusCode || source.roomStatus || room.roomStatus || '');
    const cleaningStatusCode = codeValue_(state.indicator.data?.codes?.cleaningStatuses, source.cleaningStatus || 'WAITING').toUpperCase();
    const cleaningLabel = indicatorCycleCleaningLabel_(source);
    const names = [source.roommaidName, source.secondaryRoommaidName].filter(Boolean);
    return {
      label: `${roomStatusLabel}.${cleaningLabel}`,
      roomStatusCode,
      roomStatusLabel,
      cleaningStatusCode,
      cleaningLabel,
      assignee: names.join(' · ')
    };
  }

  function indicatorRoomCycleStatusHtml_(cycle) { // (객실상태·청소상태 색상 분리 표시)
    const cleaningLive = isCleaningActiveStatus_(cycle?.cleaningStatusCode || cycle?.cleaningLabel, state.indicator.data?.codes?.cleaningStatuses);
    const cleaningTooltip = indicatorCycleCleaningTooltip_(cycle);
    const tooltipAttrs = cleaningTooltip ? ` title="${escapeAttr(cleaningTooltip)}" aria-label="${escapeAttr(cleaningTooltip)}"` : '';

  function updateHousemanRoutingPreview_() { // (객실번호 담당동 자동배정 미리보기)
    const preview = $('orderRoutingPreview');
    if (!preview || !$('orderRoomNo') || !$('orderAssignmentMode')) return;
    const mode = $('orderAssignmentMode').value;
    if (mode === 'UNASSIGNED') {
      preview.textContent = '미배정 등록 · 하우스맨 텔레그램 미발송';
      preview.className = 'order-routing-preview muted';
      return;
    }
    const digits = $('orderRoomNo').value.replace(/\D/g, '');
    if (digits.length !== 4 || !/^[1-9]/.test(digits)) {
      preview.textContent = '4자리 객실번호 입력 시 담당동 자동배정';
      preview.className = 'order-routing-preview';
      return;
    }
    const building = `${digits.charAt(0)}동`;
    const candidates = state.indicator.data?.housemanRouting?.byBuilding?.[building] || [];
    if (!state.indicator.site) {
      preview.textContent = '사업장을 먼저 선택하세요.';
      preview.className = 'order-routing-preview warning';
      return;
    }
    if (!candidates.length) {
      const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
      const shiftText = activeShiftCodes.length
        ? `${activeShiftCodes.join('·')}조 `
        : ((state.indicator.data?.housemanRouting?.currentShift || '') ? `${state.indicator.data.housemanRouting.currentShift}조 ` : '');
      preview.textContent = `${building} ${shiftText}담당자 없음`;
      preview.className = 'order-routing-preview danger';
      return;
    }
    const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
    const shiftText = activeShiftCodes.length ? `${activeShiftCodes.join('·')}조 ` : '';
    const names = candidates.map(candidate => candidate.name).join(' · ');
    preview.textContent = candidates.length > 1
      ? `${building} ${shiftText}→ ${names} 공동 전달 · 접수자 1명으로 고정`
      : `${building} ${shiftText}→ ${names} 자동배정`;
    preview.className = 'order-routing-preview success';
  }

  function novaRealtimeHousemanOrderId_(businessDate) { // (기존 HO-YYYYMMDD-XXXXXXXX 형식 유지)
    const dateText = String(businessDate || '').replace(/-/g, '');
    let suffix = '';
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      suffix = window.crypto.randomUUID().replace(/-/g, '').slice(0, 8).toUpperCase();
    } else {
      suffix = `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`.replace(/[^a-z0-9]/gi, '').slice(-8).toUpperCase().padStart(8, '0');
    }
    return `HO-${dateText}-${suffix}`;
  }

  function novaRealtimeNextShift_(currentShift) { // (기존 A→B→C→A 인수인계 규칙)
    const code = String(currentShift || '').trim().toUpperCase();
    return code === 'A' ? 'B' : code === 'B' ? 'C' : 'A';
  }

  function novaRealtimeHousemanAssignmentSnapshot_(payload) { // (현재 화면 자동배정 후보를 동일하게 고정)
    const mode = String(payload.assignmentMode || '').trim().toUpperCase();
    if (mode === 'UNASSIGNED') return { building: `${String(payload.roomNo || '').charAt(0)}동`, employeeNo: '', employeeNos: [], names: [], currentShift: '', activeShiftCodes: [] };
    if (mode === 'MANUAL') {
      const employeeNo = String(payload.assignedEmployeeNo || '').trim();
      if (!employeeNo) return null;
      const user = (state.indicator.data?.staff?.housemen || []).find(item => item.employeeNo === employeeNo);
      return { building: `${String(payload.roomNo || '').charAt(0)}동`, employeeNo, employeeNos: [employeeNo], names: [user?.name || employeeNo], currentShift: '', activeShiftCodes: [] };
    }
    const digits = String(payload.roomNo || '').replace(/\D/g, '');
    if (digits.length !== 4 || !/^[1-9]/.test(digits)) return null;
    const building = `${digits.charAt(0)}동`;
    const candidates = state.indicator.data?.housemanRouting?.byBuilding?.[building] || [];
    if (!candidates.length) return null;
    const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
    const currentShift = String(state.indicator.data?.housemanRouting?.currentShift || '').trim().toUpperCase();
    return {
      building,
      employeeNo: String(candidates[0].employeeNo || ''),
      name: String(candidates[0].name || ''),
      employeeNos: candidates.map(candidate => String(candidate.employeeNo || '')).filter(Boolean),
      names: candidates.map(candidate => String(candidate.name || candidate.employeeNo || '')),
      currentShift,
      activeShiftCodes: activeShiftCodes.map(code => String(code || '').trim().toUpperCase()).filter(Boolean)
    };
  }

  async function novaRealtimeCreateHousemanOrder_(payload) { // (Cloud Run/PostgreSQL 등록 확정)
    if (!novaRealtimeIsEnabled_()) throw new Error('Realtime이 비활성화되어 있습니다.');
    const assignment = novaRealtimeHousemanAssignmentSnapshot_(payload);
    if (String(payload.assignmentMode || '').trim().toUpperCase() === 'AUTO' && !assignment?.employeeNo) {
      const error = new Error('현재 자동배정 정보를 확인할 수 없어 기존 저장경로를 사용합니다.');
      error.code = 'REALTIME_ASSIGNMENT_UNAVAILABLE';
      throw error;
    }
    const orderId = novaRealtimeHousemanOrderId_(payload.businessDate);
    const requestId = novaRealtimeRequestId_('HOUSEMAN_CREATE', payload.roomNo);
    const currentShift = String(assignment?.currentShift || '').trim().toUpperCase();
    const apiPayload = Object.assign({}, payload, {
      orderId,
      requestId,
      assignment,
      handoverTargetShift: payload.handover ? novaRealtimeNextShift_(currentShift) : ''
    });
    const result = await novaRealtimeFetch_('/v1/houseman-orders', {
      method: 'POST',
      headers: { 'X-Request-Id': requestId },
      body: JSON.stringify(apiPayload)
    });
    const order = novaRealtimeMapHousemanOrder_(result.order) || result.order;
    if (!order?.orderId) throw new Error('Realtime 오더 저장 응답이 올바르지 않습니다.');
    order.__sheetMirrorPending = true;
    return {
      ok: true,
      order,
      orderId,
      requestId,
      assignment,
      timing: result.timing || {},
      mirrorPayload: Object.assign({}, payload, {
        realtimeOrderId: orderId,
        realtimeAssignmentSnapshot: assignment
      })
    };
  }

  async function mirrorRealtimeHousemanOrderToSheet_(mirrorPayload, attempt = 0) { // (기존 이력·감사·Telegram 보존)
    try {
      const result = await callServer('createHousemanOrder', state.token, mirrorPayload);
      if (!result?.ok) throw new Error(result?.message || 'Sheet 오더 미러에 실패했습니다.');
      if (result.order?.orderId) {
        const confirmedOrder = Object.assign({}, result.order, { __localProtectUntil: Date.now() + 30000 });
        delete confirmedOrder.__sheetMirrorPending;
        upsertOrderLocal_(confirmedOrder, result.version);
      }
      const telegram = result.telegram || {};
      if (telegram.queued && telegram.queueRecordId) {
        void callServer('dispatchHousemanOrderTelegramFast', state.token, {
          recordId: telegram.queueRecordId,
          rowNumber: telegram.queueRowNumber || 0
        }).catch(error => {
          console.warn('하우스맨 오더 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
        });
      }
      if (result.timing) console.info('NOVA 하우스맨 Sheet 미러시간', result.timing);
      return result;
    } catch (error) {
      if (attempt < 3) {
        await novaRealtimeSleep_([800, 1800, 4000, 8000][attempt] || 8000);
        return mirrorRealtimeHousemanOrderToSheet_(mirrorPayload, attempt + 1);
      }
      console.error('[NOVA Realtime] 하우스맨 Sheet 미러 실패:', error);
      setSyncStatus('하우스맨 오더 DB 저장완료 · 기존 이력 동기화 재확인 필요');
      return null;
    }
  }

  async function handleCreateHousemanOrder(event) { // (상단 고정영역 오더 등록·Realtime 선저장)
    event.preventDefault();
    const items = state.indicator.draftItems
      .map((item, index) => ({ name: String(item.name || '').trim(), quantity: index === 0 ? clampQuantity($('orderQuickQty').value) : clampQuantity(item.quantity) }))
      .filter(item => item.name);
    const payload = {
      businessDate: state.indicator.businessDate,
      site: state.indicator.site,
      roomNo: $('orderRoomNo').value.trim(),
      part: $('orderPart').value,
      items,
      note: $('orderNote').value.trim(),
      requester: $('orderRequester').value,
      assignmentMode: $('orderAssignmentMode').value,
      important: $('orderImportant').checked,
      handover: $('orderHandover').checked
    };
    if (!payload.site) return showToast('사업장을 선택하세요.');
    if (!payload.roomNo) return showToast('객실번호를 입력하세요.');
    if (!payload.part) return showToast('파트를 선택하세요.');
    if (!payload.items.length) return showToast('품목을 한 개 이상 입력하세요.');

    const pendingOrder = buildPendingHousemanOrder_(payload);
    upsertOrderLocal_(pendingOrder, state.indicator.version);
    if ($('orderScroll')) $('orderScroll').scrollTop = 0;
    setOrderFormBusy(true);
    const clickedAt = performance.now();
    try {
      if (novaRealtimeIsEnabled_()) {
        try {
          const realtime = await novaRealtimeCreateHousemanOrder_(payload);
          replacePendingOrderLocal_(pendingOrder.orderId, realtime.order, state.indicator.version);
          // DB 확정 직후 기존 Sheet/감사/Telegram 저장을 백그라운드에서 즉시 시작합니다.
          void mirrorRealtimeHousemanOrderToSheet_(realtime.mirrorPayload);
          resetOrderForm(true);
          const elapsed = Math.round(performance.now() - clickedAt);
          showToast(realtime.order.assignedName
            ? `${realtime.order.roomNo}호 · ${realtime.order.assignedName}님에게 자동 배정했습니다.`
            : `${realtime.order.roomNo}호 미배정 오더를 등록했습니다.`);
          setSyncStatus(`${realtime.order.roomNo}호 오더 DB 저장 완료 · ${elapsed}ms`);
          return;
        } catch (realtimeError) {
          console.warn('[NOVA Realtime] 하우스맨 등록은 기존 저장경로로 자동 전환합니다.', realtimeError);
        }
      }

      // Realtime 비활성/오류 시 기존 동작을 그대로 유지합니다.
      const result = await callServer('createHousemanOrder', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '오더 등록에 실패했습니다.');
      replacePendingOrderLocal_(pendingOrder.orderId, result.order, result.version);
      resetOrderForm(true);
      showToast(result.order.assignedName
        ? `${result.order.roomNo}호 · ${result.order.assignedName}님에게 자동 배정했습니다.`
        : `${result.order.roomNo}호 미배정 오더를 등록했습니다.`);
      const telegram = result.telegram || {};
      if (telegram.queued && telegram.queueRecordId) {
        void callServer('dispatchHousemanOrderTelegramFast', state.token, {
          recordId: telegram.queueRecordId,
          rowNumber: telegram.queueRowNumber || 0
        }).catch(error => {
          console.warn('하우스맨 오더 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
        });
      }
      if (result.timing) console.info('NOVA 하우스맨 오더 저장시간', result.timing);
    } catch (error) {
      removeOrderLocal_(pendingOrder.orderId, payload.roomNo);
      showToast(error?.message || '오더 등록 오류');
    } finally {
      setOrderFormBusy(false);
    }
  }

  function buildPendingHousemanOrder_(payload) { // (오더 저장 중 처리현황 임시행 생성)
    const now = new Date().toISOString();
    const itemSummary = (payload.items || [])
      .map(item => Number(item.quantity || 1) > 1 ? `${item.name}×${item.quantity}` : item.name)
      .join(', ');
    return {
      orderId: `PENDING-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      businessDate: payload.businessDate,
      site: payload.site,
      roomNo: payload.roomNo,
      part: payload.part,
      items: payload.items || [],
      itemSummary,
      quantity: (payload.items || []).reduce((sum, item) => sum + Number(item.quantity || 1), 0),
      note: payload.note || '',
      requester: payload.requester || '',
      assignedEmployeeNo: '',
      assignedName: '저장중',
      processorEmployeeNo: '',
      processorName: '',
      statusCode: 'SAVING',
      statusLabel: '저장중',
      important: Boolean(payload.important),
      handover: Boolean(payload.handover),
      assignmentMode: payload.assignmentMode || 'AUTO',
      autoAssigned: false,
      routeCandidateEmployeeNos: [],
      routeCandidateNames: [],
      routeLocked: true,
      registeredAt: now,
      updatedAt: now,
      version: Number(state.indicator.version || 0),
      __pendingSave: true
    };
  }

  function openItemPickerModal() { // (복수 품목 편집창)
    if (state.indicator.draftItems.length && $('orderQuickQty')) {
      state.indicator.draftItems[0].quantity = clampQuantity($('orderQuickQty').value);

    const itemSuggestions = state.indicator.data?.codes?.orderItems || [];

        <div class="modal-body">

          <button id="addItemRow" class="action-button" type="button">+ 품목 추가</button>
          <div class="modal-actions">

            <button class="action-button" type="button" data-close-modal>취소</button>
          </div>
        </div>
      </div>`);

      $('itemEditorRows').innerHTML = items.map((item, index) => `

          <input class="item-name" list="housemanItemSuggestions" placeholder="품목명" value="${escapeAttr(item.name)}">

  function openOrderDetailModal(orderId) { // (하우스맨 오더 상세·처리)
    const order = (state.indicator.data?.orders || []).find(item => item.orderId === orderId);
    if (!order) return;
    const housemen = state.indicator.data?.staff?.housemen || [];
    const canReopen = ['COMPLETED', 'UNABLE'].includes(order.statusCode);
    const sharedRoute = order.statusCode === 'ASSIGNED' && order.routeLocked !== true
      && Array.isArray(order.routeCandidateNames) && order.routeCandidateNames.length > 1;
    const assigneeLabel = sharedRoute ? order.routeCandidateNames.join(' · ') : (order.assignedName || '미배정');
    const additionalDetailText = [ // (추가내용·처리불가 사유 통합 표시)
      String(order.note || '').trim(),

  async function runOrderAction(order, action) { // (오더 상태 변경 실행)
    if (order?.__sheetMirrorPending) {
      showToast('오더는 저장되었습니다. 기존 이력 동기화가 완료된 뒤 처리할 수 있습니다.');
      return;
    }
    const payload = { orderId: order.orderId, action, expectedVersion: Number(order.version || 0) };
    if (action === 'ASSIGN') payload.employeeNo = $('detailAssignee').value;
    if (action === 'UNABLE') {
      const reason = window.prompt('처리불가 사유를 입력하세요.');
      if (reason === null) return;
      payload.reason = reason.trim();
    }
    try {
      const result = await callServer('updateHousemanOrder', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '오더를 변경하지 못했습니다.');
      upsertOrderLocal_(result.order, result.version);
      closeModal();
      showToast(`${result.order.roomNo}호 오더: ${result.order.statusLabel}`);
    } catch (error) {
      showToast(error?.message || '오더 처리 오류');
    }
  }

    if (order?.__sheetMirrorPending) {
      showToast('오더는 저장되었습니다. 기존 이력 동기화가 완료된 뒤 수정할 수 있습니다.');

      <div class="modal-card">

          <div class="modal-grid">

      }));

      $('editOrderItems').querySelectorAll('[data-item-index]').forEach((row, index) => {

        const result = await callServer('updateHousemanOrder', state.token, {
          orderId: order.orderId,
          action: 'EDIT',
          expectedVersion: Number(order.version || 0),
          part: $('editOrderPart').value,
          requester: $('editOrderRequester').value,
          note: $('editOrderNote').value,
          items: items.filter(item => item.name),

        });

        upsertOrderLocal_(result.order, result.version);
        closeModal();

  function openBulkRoommaidAssignmentModal_() { // (최초 일괄배정 미배정·동층 선택)

      <div class="modal-card bulk-assignment-modal">
        <div class="modal-header"><h2>룸메이드 최초 일괄배정</h2><button class="modal-close" type="button" data-close-modal>×</button></div>
        <div class="modal-body">

            <select id="bulkFloorFilter" aria-label="층 선택"><option value="">전체 층</option></select>
            <input id="bulkRoomSearch" placeholder="객실번호 검색">
            <button id="bulkSelectVisible" class="action-button" type="button">현재 목록 전체선택</button>
            <button id="bulkClearSelection" class="action-button" type="button">선택해제</button>
            <strong id="bulkSelectedCount">0실 선택</strong>

        </div>
      </div>`);
    const selected = new Set();
    const filteredRooms = () => {
      const building = String($('bulkBuildingFilter')?.value || '').trim();
      const floor = String($('bulkFloorFilter')?.value || '').trim();
      const query = String($('bulkRoomSearch')?.value || '').trim().toLowerCase();
      return rooms.filter(room =>
        (!building || String(room.building || '') === building)
        && (!floor || String(room.floor || '') === floor)
        && (!query || String(room.roomNo || '').toLowerCase().includes(query))
      );
    };
    const refreshFloorOptions = () => {
      const building = String($('bulkBuildingFilter')?.value || '').trim();
      const current = String($('bulkFloorFilter')?.value || '').trim();
      const floors = Array.from(new Set(rooms
        .filter(room => !building || String(room.building || '') === building)
        .map(room => String(room.floor || '').trim()).filter(Boolean))).sort(compareNumberText);

      if (floors.includes(current)) $('bulkFloorFilter').value = current;
    };

      const visible = filteredRooms();
      $('bulkRoomAvailability').textContent = `미배정 ${rooms.length}실 · 현재 조건 ${visible.length}실`;
      $('bulkRoomList').innerHTML = visible.length

    };
    const syncPair = () => {
      const pair = ['PAIR', 'PAIR_TRAINING'].includes($('bulkAssignmentType').value);
      $('bulkSecondaryRoommaid').disabled = !pair;
      if (!pair) $('bulkSecondaryRoommaid').value = '';
    };
    $('bulkAssignmentType').addEventListener('change', syncPair);
    $('bulkBuildingFilter').addEventListener('change', () => { refreshFloorOptions(); renderList(); });
    $('bulkFloorFilter').addEventListener('change', renderList);
    $('bulkRoomSearch').addEventListener('input', renderList);
    $('bulkSelectVisible').addEventListener('click', () => {
      filteredRooms().forEach(room => selected.add(room.roomNo));
      $('bulkSelectedCount').textContent = `${selected.size}실 선택`; renderList();
    });
    $('bulkClearSelection').addEventListener('click', () => { selected.clear(); $('bulkSelectedCount').textContent = '0실 선택'; renderList(); });
    $('bulkAssignmentSubmit').addEventListener('click', async event => {
      const payload = {
        businessDate: state.indicator.businessDate,
        site: state.indicator.site,
        roomNos: Array.from(selected),
        expectedVersions: Object.fromEntries(Array.from(selected).map(roomNo => {
          const room = rooms.find(item => item.roomNo === roomNo);
          return [roomNo, Number(room?.version || 0)];
        })),
        cleaningType: $('bulkCleaningType').value,
        assignmentType: $('bulkAssignmentType').value,
        primaryEmployeeNo: $('bulkPrimaryRoommaid').value,
        secondaryEmployeeNo: $('bulkSecondaryRoommaid').value,
        preassigned: Boolean($('bulkPreassignedFlag')?.checked),
        vip: Boolean($('bulkVipFlag')?.checked),
        importantRoom: Boolean($('bulkImportantFlag')?.checked)
      };
      event.currentTarget.disabled = true;
      try {
        const result = await callServer('bulkAssignRoommaids', state.token, payload);
        if (!result?.ok) throw new Error(result?.message || '일괄배정에 실패했습니다.');
        (result.rooms || []).forEach(updated => {
          const index = state.indicator.data.rooms.findIndex(room => room.roomNo === updated.roomNo && room.site === updated.site);
          if (index >= 0) state.indicator.data.rooms[index] = Object.assign({}, state.indicator.data.rooms[index], updated);
        });
        state.indicator.version = Number(result.version || state.indicator.version);
        renderRoomGrid(); closeModal(); showToast(`${result.count}실을 일괄배정했습니다.`);
      } catch (error) {
        showToast(error?.message || '일괄배정 오류'); event.currentTarget.disabled = false;
      }
    });
    refreshFloorOptions(); syncPair(); renderList();
  }

  function roommaidAssignmentOptionsHtml_(roommaids, selectedEmployeeNo, query = '') { // (룸메이드 검색목록 옵션 구성)
    const staff = Array.isArray(roommaids) ? roommaids : [];
    const selected = String(selectedEmployeeNo || '').trim();
    const keyword = String(query || '').trim().toLowerCase();
    const filtered = keyword
      ? staff.filter(user => `${String(user.name || '')} ${String(user.employeeNo || '')}`.toLowerCase().includes(keyword))
      : staff;
    const selectedUser = selected ? staff.find(user => String(user.employeeNo || '') === selected) : null;
    const visible = selectedUser && !filtered.some(user => String(user.employeeNo || '') === selected)
      ? [selectedUser].concat(filtered)
      : filtered;
    return `<option value="">선택${keyword ? ` · 검색 ${visible.length}명` : ` · 전체 ${staff.length}명`}</option>${visible.map(user => `<option value="${escapeAttr(user.employeeNo)}"${String(user.employeeNo || '') === selected ? ' selected' : ''}>${escapeHtml(user.name)} (${escapeHtml(user.employeeNo)})</option>`).join('')}`;
  }

  function bindRoommaidAssignmentSearch_(inputId, selectId, roommaids) { // (룸메이드 이름·사번 검색 연결)
    const input = $(inputId);
    const select = $(selectId);
    if (!input || !select) return;
    const render = () => {
      const currentValue = String(select.value || '').trim();
      select.innerHTML = roommaidAssignmentOptionsHtml_(roommaids, currentValue, input.value);
      if (currentValue && Array.from(select.options).some(option => option.value === currentValue)) select.value = currentValue;
    };
    input.addEventListener('input', render);
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      select.focus();
      if (!select.value && select.options.length === 2) select.selectedIndex = 1;
    });
  }
