  function renderIndicatorSummary() { // (통합 화면 요약)
    const rooms = state.indicator.data?.rooms || [];
    const orders = state.indicator.data?.orders || [];
    const activeOrders = orders.filter(order => !['COMPLETED', 'UNABLE'].includes(order.statusCode)).length;
    $('indicatorSummary').innerHTML = `
      <span class="summary-pill">객실 ${rooms.length}</span>
      <span class="summary-pill">미완료 오더 ${activeOrders}</span>
      <span class="summary-pill">전체 오더 ${orders.length}</span>`;
  }

  function renderOrderList() { // (처리현황 내부 스크롤 목록)
    const container = $('orderScroll');
    if (!container) return;
    const scrollTop = container.scrollTop;
    const orders = [...(state.indicator.data?.orders || [])].sort((a, b) =>
      String(b.registeredAt || '').localeCompare(String(a.registeredAt || ''))
      || Number(b.rowNumber || 0) - Number(a.rowNumber || 0)
    ); // HOUSEMAN_LATEST_REGISTERED_LISTS_V1 · 통합인디케이터 최근 등록순 고정
    if (!orders.length) {
      container.innerHTML = '<div class="empty-order">등록된 하우스맨 오더가 없습니다.</div>';
      return;
    }
    container.innerHTML = orders.map(order => `
      <div class="order-mini-row" data-order-id="${escapeAttr(order.orderId)}" title="${escapeAttr(order.note || order.itemSummary)}">
        <span class="order-room">${escapeHtml(order.roomNo)}</span>
        <span class="order-item">${order.important ? '● ' : ''}${escapeHtml(order.itemSummary || '-')}</span>
        <span class="order-person">${escapeHtml(
          order.statusCode === 'ASSIGNED' && order.routeLocked !== true && Array.isArray(order.routeCandidateNames) && order.routeCandidateNames.length > 1
            ? `${order.routeCandidateNames.join('·')} 공동`
            : (order.assignedName || order.processorName || '미배정')
        )}</span>
        <span class="status-chip status-${escapeAttr(order.statusCode)}">${escapeHtml(order.statusLabel)}</span>
      </div>`).join('');
    container.scrollTop = scrollTop;
  }

  function renderRoomFilters() { // (객실상태별 수량·동·층 통합 필터)
    const filterContainer = $('roomFilters');
    const locationContainer = $('roomLocationFilters');
    if (!filterContainer || !locationContainer || !state.indicator.data) return;

    normalizeIndicatorLocationSelection_();
    const scopedRooms = getIndicatorLocationScopedRooms_();
    const counts = buildIndicatorStatusCounts_(scopedRooms);
    const filters = [
      { code: 'ALL', label: '전체' },
      { code: 'CLEANING_ONLY', label: '청소중' }
    ].concat(state.indicator.data?.codes?.roomStatuses || []).concat([
      { code: 'OPERATION_ROOM_CHECK', label: '객실확인' },
      { code: 'OPERATION_BROKEN', label: '고장객실' },
      { code: 'OPERATION_REWORK', label: '재정비' }
    ]);

    filterContainer.innerHTML = filters.map(filter => `
      <button type="button" class="filter-button room-status-filter${state.indicator.filter === filter.code ? ' active' : ''}" data-room-filter="${escapeAttr(filter.code)}">
        <span>${escapeHtml(filter.label)}</span><strong class="filter-count">${Number(counts[filter.code] || 0).toLocaleString('ko-KR')}</strong>
      </button>`).join('');

    const buildings = getIndicatorBuildings_();
    const floors = getIndicatorFloors_(state.indicator.building);
    locationContainer.innerHTML = `
      <label class="room-location-control" for="roomBuildingFilter">
        <span>동</span>
        <select id="roomBuildingFilter" aria-label="객실 동 필터">
          <option value="">전체 동</option>
          ${buildings.map(building => `<option value="${escapeAttr(building)}"${state.indicator.building === building ? ' selected' : ''}>${escapeHtml(building)}</option>`).join('')}
        </select>
      </label>
      <label class="room-location-control" for="roomFloorFilter">
        <span>층</span>
        <select id="roomFloorFilter" aria-label="객실 층 필터">
          <option value="">전체 층</option>
          ${floors.map(floor => `<option value="${escapeAttr(floor)}"${state.indicator.floor === floor ? ' selected' : ''}>${escapeHtml(floor)}층</option>`).join('')}
        </select>
      </label>
      <button id="roomFilterResetButton" class="filter-button room-filter-reset" type="button">초기화</button>`;

    filterContainer.querySelectorAll('[data-room-filter]').forEach(button => {
      button.addEventListener('click', () => {
        state.indicator.filter = button.dataset.roomFilter;
        renderRoomFilters();
        renderRoomGrid();
      });
    });
    $('roomBuildingFilter').addEventListener('change', event => {
      state.indicator.building = event.target.value;
      state.indicator.floor = '';
      renderRoomFilters();
      renderRoomGrid();
    });
    $('roomFloorFilter').addEventListener('change', event => {
      state.indicator.floor = event.target.value;
      renderRoomFilters();
      renderRoomGrid();
    });
    $('roomFilterResetButton').addEventListener('click', resetIndicatorRoomFilters_);
  }

  function buildIndicatorStatusCounts_(rooms) { // (현재 동·층 범위의 상태별 객실수 계산)
    const data = state.indicator.data || {};
    const counts = {
      ALL: (rooms || []).length,
      CLEANING_ONLY: 0,
      OPERATION_ROOM_CHECK: 0,
      OPERATION_BROKEN: 0,
      OPERATION_REWORK: 0
    };
    (data.codes?.roomStatuses || []).forEach(code => { counts[code.code] = 0; });
    (rooms || []).forEach(room => {
      const roomStatusCode = indicatorCodeValue_(data.codes?.roomStatuses, room.roomStatus);
      const cleaningStatusCode = indicatorCodeValue_(data.codes?.cleaningStatuses, room.cleaningStatus || 'WAITING').toUpperCase();
      const operationalStatusCode = normalizeIndicatorRoomOperationalStatus_(room.operationalStatus);
      if (cleaningStatusCode === 'CLEANING') counts.CLEANING_ONLY += 1;
      if (operationalStatusCode === 'ROOM_CHECK') counts.OPERATION_ROOM_CHECK += 1;
      if (operationalStatusCode === 'BROKEN') counts.OPERATION_BROKEN += 1;
      if (operationalStatusCode === 'REWORK') counts.OPERATION_REWORK += 1;
      if (Object.prototype.hasOwnProperty.call(counts, roomStatusCode)) counts[roomStatusCode] += 1;
    });
    return counts;
  }

  function indicatorCodeValue_(codes, value) { // (인디게이터 필터용 원본 코드값 변환)
    const text = String(value || '').trim();
    const found = (codes || []).find(code => String(code.code || '').trim() === text || String(code.label || '').trim() === text);
    return found ? String(found.code || '').trim() : text;
  }

  function getIndicatorBuildings_() { // (현재 업무일자·사업장의 실제 동 목록)
    return Array.from(new Set((state.indicator.data?.rooms || [])
      .map(room => String(room.building || '').trim()).filter(Boolean)))
      .sort(compareIndicatorLocationText_);
  }

  function getIndicatorFloors_(building) { // (선택 동에 실제 존재하는 층 목록)
    const selectedBuilding = String(building || '').trim();
    return Array.from(new Set((state.indicator.data?.rooms || [])
      .filter(room => !selectedBuilding || String(room.building || '').trim() === selectedBuilding)
      .map(room => String(room.floor || '').trim()).filter(Boolean)))
      .sort(compareIndicatorLocationText_);
  }

  function compareIndicatorLocationText_(a, b) { // (동·층 숫자 우선 정렬)
    const aNumber = Number(String(a || '').replace(/\D/g, ''));
    const bNumber = Number(String(b || '').replace(/\D/g, ''));
    if (Number.isFinite(aNumber) && Number.isFinite(bNumber) && aNumber !== bNumber) return aNumber - bNumber;
    return String(a || '').localeCompare(String(b || ''), 'ko', { numeric: true, sensitivity: 'base' });
  }

  function normalizeIndicatorLocationSelection_() { // (데이터 변경 후 존재하지 않는 동·층 선택값 해제)
    const buildings = getIndicatorBuildings_();
    if (state.indicator.building && !buildings.includes(state.indicator.building)) {
      state.indicator.building = '';
      state.indicator.floor = '';
    }
    const floors = getIndicatorFloors_(state.indicator.building);
    if (state.indicator.floor && !floors.includes(state.indicator.floor)) state.indicator.floor = '';
  }

  function resetIndicatorRoomFilters_() { // (검색·상태·동·층 필터 초기화)
    state.indicator.filter = 'ALL';
    state.indicator.search = '';
    state.indicator.building = '';
    state.indicator.floor = '';
    if ($('roomSearch')) $('roomSearch').value = '';
    renderRoomFilters();
    renderRoomGrid();
  }

  function indicatorPrintRoomStatusCode_(room) { // (인쇄용 실제 객실상태 코드)
    return indicatorCodeValue_(state.indicator.data?.codes?.roomStatuses, room?.roomStatus || '').toUpperCase();
  }

  function indicatorPrintRoomCategory_(room) { // (인쇄용 퇴실예정·재고·투숙·공실·퇴실 구분)
    const code = indicatorPrintRoomStatusCode_(room);
    return {
      code,
      dueOut: code === 'DUE_OUT',
      stock: ['STOCK', 'STOCK_RC', 'STOCK_HU'].includes(code),
      stay: ['STAY', 'RECHECKIN'].includes(code),
      vacant: code === 'VACANT_CLEAN',
      checkedOut: ['CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU'].includes(code),
      variant: code.endsWith('_RC') ? 'R/C' : code.endsWith('_HU') ? 'H/U' : code === 'RECHECKIN' ? '재입실' : ''
    };
  }

  function indicatorPrintMarkHtml_(active, variant) { // (인쇄표 상태 체크표시)
    if (!active) return '';
    return `<span class="print-status-mark">●</span>${variant ? `<small>${escapeHtml(variant)}</small>` : ''}`;
  }

  function indicatorPrintCleaningLabel_(room) { // (인쇄용 정비상태 축약표시)
    const code = indicatorCodeValue_(state.indicator.data?.codes?.cleaningStatuses, room?.cleaningStatus || 'WAITING').toUpperCase();
    if (code === 'WAITING') return 'VD';
    if (code === 'NOT_REQUIRED') return 'N/R';
    if (code === 'ASSIGNED') return '배정';
    if (code === 'CLEANING') return '청소중';
    if (code === 'COMPLETED') return 'VC';
    if (code === 'QM_WAITING') return '점검대기';
    if (code === 'QM_CHECKING') return '점검중';
    if (code === 'QM_COMPLETED') return 'VC';
    return codeLabel_(state.indicator.data?.codes?.cleaningStatuses, room?.cleaningStatus || code || '-');
  }

  function getIndicatorPrintRooms_() { // (인쇄범위: 현재 사업장·동·층 전체 객실)
    return (state.indicator.data?.rooms || [])
      .filter(roomMatchesIndicatorLocation_)
      .slice()
      .sort((a, b) => {
        const siteCompare = String(a.site || '').localeCompare(String(b.site || ''), 'ko', { numeric: true, sensitivity: 'base' });
        if (siteCompare) return siteCompare;
        const buildingCompare = compareIndicatorLocationText_(a.building || '', b.building || '');
        if (buildingCompare) return buildingCompare;
        return String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' });
      });
  }

  function buildIndicatorPrintBlocks_(rooms) { // (인쇄용 사업장·동별 층 가로배치 그룹 구성)
    const grouped = new Map();
    const floorSet = new Set();
    (rooms || []).forEach(room => {
      const site = String(room.site || '').trim() || '사업장 미지정';
      const building = String(room.building || '').trim() || '동 미지정';
      const floor = String(room.floor || '').trim() || '층 미지정';
      floorSet.add(floor);
      const key = `${site}\u0000${building}`;
      if (!grouped.has(key)) grouped.set(key, { site, building, floors: new Map() });
      const group = grouped.get(key);
      if (!group.floors.has(floor)) group.floors.set(floor, []);
      group.floors.get(floor).push(room);
    });

    const floorOrder = Array.from(floorSet).sort(compareIndicatorLocationText_);
    const buildings = Array.from(grouped.values()).sort((a, b) => {
      const siteCompare = a.site.localeCompare(b.site, 'ko', { numeric: true, sensitivity: 'base' });
      if (siteCompare) return siteCompare;
      return compareIndicatorLocationText_(a.building, b.building);
    });

    buildings.forEach(group => {
      group.floorOrder = floorOrder.slice();
      group.maxRoomCount = 0;
      floorOrder.forEach(floor => {
        const floorRooms = group.floors.get(floor) || [];
        floorRooms.sort((a, b) => String(a.roomNo || '').localeCompare(String(b.roomNo || ''), 'ko', { numeric: true, sensitivity: 'base' }));
        group.maxRoomCount = Math.max(group.maxRoomCount, floorRooms.length);
      });
    });
    return buildings;
  }

  function indicatorPrintFloorHtml_(buildingGroup, floor, showSite) { // (인쇄용 한 동의 1개 층 블록)
    const rooms = buildingGroup.floors.get(floor) || [];
    if (!rooms.length) return '<div class="floor-block floor-block-empty" aria-hidden="true"></div>';
    const rows = rooms.map(room => {
      const category = indicatorPrintRoomCategory_(room);
      const statusLabel = category.dueOut ? '퇴실예정'
        : category.stock ? '재고'
          : category.stay ? '투숙'
            : category.vacant ? '공실'
              : category.checkedOut ? '퇴실'
                : (codeLabel_(state.indicator.data?.codes?.roomStatuses, room?.roomStatus || category.code || '-') || '-');
      return `<tr>
        <td class="room-no"><strong>${escapeHtml(room.roomNo || '-')}</strong></td>
        <td class="room-status">${escapeHtml(statusLabel)}</td>
      </tr>`;
    }).join('');
    const floorText = String(floor || '').trim();
    const floorLabel = floorText && floorText !== '층 미지정' ? `${floorText}층` : floorText;
    const titlePrefix = showSite ? `${escapeHtml(buildingGroup.site)} · ` : '';
    return `<section class="floor-block">
      <div class="floor-block-title">${titlePrefix}${escapeHtml(buildingGroup.building)} ${escapeHtml(floorLabel)}</div>
      <table>
        <colgroup><col class="c-room"><col class="c-status"></colgroup>
        <thead><tr><th>객실</th><th>상태</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>`;
  }

  function indicatorPrintBlockHtml_(buildingGroup, showSite) { // (인쇄용 한 행에 한 동·층 가로배치)
    const floorOrder = buildingGroup.floorOrder || [];
    const floorCount = Math.max(1, floorOrder.length);
    return `<section class="building-row" style="--floor-count:${floorCount}">
      <div class="building-floor-grid">${floorOrder.map(floor => indicatorPrintFloorHtml_(buildingGroup, floor, showSite)).join('')}</div>
    </section>`;
  }

  function indicatorPrintBuildingNumber_(building) { // (인쇄 페이지 분리용 동 숫자 추출)
    const matched = String(building || '').match(/\d+/);
    return matched ? Number(matched[0]) : Number.POSITIVE_INFINITY;
  }

  function paginateIndicatorPrintBuildings_(buildings) { // (A3 세로: 1~5동 1페이지·6~9동 2페이지 고정 분리)
    const firstPage = [];
    const secondPage = [];
    const extra = [];
    (buildings || []).forEach(building => {
      const buildingNumber = indicatorPrintBuildingNumber_(building.building);
      if (buildingNumber >= 1 && buildingNumber <= 5) firstPage.push(building);
      else if (buildingNumber >= 6 && buildingNumber <= 9) secondPage.push(building);
      else extra.push(building);
    });

    const pages = [];
    if (firstPage.length) pages.push(firstPage);
    if (secondPage.length) pages.push(secondPage);
    for (let index = 0; index < extra.length; index += 5) pages.push(extra.slice(index, index + 5));
    return pages;
  }

  function openIndicatorPrintPreview_() { // (통합 인디게이터 A3 세로·1~5동/6~9동 페이지분리 인쇄 미리보기)
    if (!state.indicator.data) {
      showToast('먼저 통합 인디게이터를 불러와 주세요.');
      return;
    }
    const rooms = getIndicatorPrintRooms_();
    if (!rooms.length) {
      showToast('현재 사업장·동·층 범위에 출력할 객실이 없습니다.');
      return;
    }

    const printWindow = window.open('', '_blank');
    if (!printWindow) {
      showToast('인쇄 미리보기 창이 차단되었습니다. 브라우저 팝업을 허용해 주세요.');
      return;
    }

    const buildings = buildIndicatorPrintBlocks_(rooms);
    const pages = paginateIndicatorPrintBuildings_(buildings);
    const sites = Array.from(new Set(rooms.map(room => String(room.site || '').trim()).filter(Boolean)));
    const showSiteInBlock = sites.length > 1;
    const businessDate = String(state.indicator.businessDate || state.indicator.data?.selection?.businessDate || state.bootstrap?.app?.businessDate || '');
    const siteLabel = state.indicator.site || (sites.length === 1 ? sites[0] : '전체 사업장');
    const locationLabel = [state.indicator.building ? `${state.indicator.building}` : '전체 동', state.indicator.floor ? `${state.indicator.floor}층` : '전체 층'].join(' · ');
    const printedBy = String(state.bootstrap?.user?.name || '');
    const printedAt = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    const pageHtml = pages.map((pageBuildings, pageIndex) => `<section class="print-page">
      <header class="print-header">
        <div class="title-wrap"><strong>객실 현황</strong><span>${escapeHtml(siteLabel)} · ${escapeHtml(locationLabel)}</span></div>
        <div class="print-header-right"><strong>${escapeHtml(businessDate)}</strong><span>${escapeHtml(printedAt)}${printedBy ? ` · ${escapeHtml(printedBy)}` : ''} · ${pageIndex + 1}/${pages.length}</span></div>
      </header>
      <div class="building-list">${pageBuildings.map(building => indicatorPrintBlockHtml_(building, showSiteInBlock)).join('')}</div>
    </section>`).join('');

    printWindow.document.open();
    printWindow.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>NOVA 객실 현황 ${escapeHtml(businessDate)}</title><style>
      @page{size:A3 portrait;margin:6mm}

      body{font-size:9px}
      .screen-toolbar{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb}
      .screen-toolbar button{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}
      .screen-toolbar .primary{background:#171717;color:#fff;border-color:#171717}
      .screen-note{max-width:1200px;margin:9px auto 0;padding:0 12px;color:#737373;font-size:11px}
      .print-page{width:285mm;min-height:408mm;margin:10px auto;background:#fff;padding:0;page-break-after:always}
      .print-page:last-of-type{page-break-after:auto}
      .print-header{height:11mm;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d4d4d4;padding:0 1mm}
      .title-wrap,.print-header-right{display:flex;align-items:baseline;gap:3mm;min-width:0}
      .print-header strong{font-size:14px;letter-spacing:-.2px;white-space:nowrap}
      .print-header span{font-size:8.2px;color:#737373;white-space:nowrap}
      .print-header-right{justify-content:flex-end}.print-header-right strong{font-size:10px}
      .building-list{display:flex;flex-direction:column;gap:3mm;padding-top:2.5mm}
      .building-row{width:100%;break-inside:avoid;page-break-inside:avoid}
      .building-floor-grid{display:grid;grid-template-columns:repeat(var(--floor-count),minmax(0,1fr));gap:0 1.2mm;align-items:start}
      .floor-block{min-width:0}
      .floor-block-empty{min-height:1px}
      .floor-block-title{height:5mm;display:flex;align-items:center;padding:0 .8mm;font-size:8.8px;font-weight:800;border-bottom:1px solid #a3a3a3;color:#171717;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.2px;line-height:1}
      .c-room{width:68%}.c-status{width:32%}
      th,td{border-bottom:.4px solid #e5e5e5;padding:0 .7mm;height:3.55mm;overflow:hidden}
      th{height:4.2mm;background:#fafafa;color:#8a8a8a;font-size:5.2px;font-weight:700;border-bottom:.6px solid #d4d4d4;text-align:left}
      td.room-no{text-align:left;white-space:nowrap}td.room-no strong{font-size:8.8px;font-weight:800;color:#171717}
      td.room-status{text-align:right;white-space:nowrap;font-size:7.6px!important;font-weight:800;color:#444;letter-spacing:-.15px}
      tbody tr:last-child td{border-bottom:1px solid #aaa}
      @media print{html,body{background:#fff}.screen-toolbar,.screen-note{display:none!important}.print-page{width:auto;min-height:0;margin:0}}
    </style></head><body>
      <div class="screen-toolbar"><button type="button" onclick="window.close()">닫기</button><button type="button" class="primary" onclick="window.print()">인쇄</button></div>
      <div class="screen-note">※ A3 세로 기준 · 1~5동은 1페이지, 6~9동은 2페이지로 분리합니다. 한 행에 한 동을 배치하고 층은 숫자순으로 정렬합니다. R/C·H/U는 재고 또는 퇴실로 단순 표기합니다.</div>
      ${pageHtml}
    </body></html>`);
    printWindow.document.close();
    printWindow.focus();
  }

  function renderRoomGrid() { // (객실카드 목록)
    const grid = $('roomGrid');
    if (!grid || !state.indicator.data) return;
    applyRoomGridColumns_();
    const rooms = getFilteredRooms_();
    if (!rooms.length) {
      grid.innerHTML = '<div class="room-empty">선택한 필터 조건에 표시할 객실이 없습니다.<br>업무일자·사업장·동·층·객실상태를 확인해 주세요.</div>';
      return;
    }
    grid.innerHTML = rooms.map(room => roomCardHtml_(room)).join('');
  }

  function applyRoomGridColumns_() { // (객실카드 열 수 즉시 적용)
    const grid = $('roomGrid');
    if (!grid) return;
    const columns = normalizeRoomColumns_(state.indicator.roomColumns);
    state.indicator.roomColumns = columns;
    grid.style.setProperty('--room-columns', String(columns));
    grid.classList.toggle('room-grid-dense', columns >= 11);
    const select = $('roomColumnSelect');
    if (select && Number(select.value) !== columns) select.value = String(columns);
  }

      if (operationalStatusCode !== 'REWORK') return false;

    const operationalSearchText = normalizeIndicatorRoomOperationalStatus_(room.operationalStatus) === 'BROKEN'

    const raw = String(value || '').trim();
    const upper = raw.toUpperCase().replace(/\s+/g, '_');
    if (!raw) return '';
    if (['BROKEN', 'OUT_OF_ORDER', 'OOO', 'O.O.O', '0.0.0', '고장'].includes(upper) || raw === '고장') return 'BROKEN';
    if (['ROOM_CHECK', 'ROOMCHECK', 'CHECK_ROOM', '객실확인'].includes(upper) || raw === '객실확인') return 'ROOM_CHECK';
    if (['REWORK', '재정비'].includes(upper) || raw === '재정비') return 'REWORK';
    return '';

  function updateHousemanRoutingPreview_() { // (객실번호 담당동 자동배정 미리보기)
    const preview = $('orderRoutingPreview');
    if (!preview || !$('orderRoomNo') || !$('orderAssignmentMode')) return;
    const mode = $('orderAssignmentMode').value;
    if (mode === 'UNASSIGNED') {
      preview.textContent = '미배정 등록 · 하우스맨 텔레그램 미발송';
      preview.className = 'order-routing-preview muted';
      return;
    }
    const digits = $('orderRoomNo').value.replace(/\D/g, '');
    if (digits.length !== 4 || !/^[1-9]/.test(digits)) {
      preview.textContent = '4자리 객실번호 입력 시 담당동 자동배정';
      preview.className = 'order-routing-preview';
      return;
    }
    const building = `${digits.charAt(0)}동`;
    const candidates = state.indicator.data?.housemanRouting?.byBuilding?.[building] || [];
    if (!state.indicator.site) {
      preview.textContent = '사업장을 먼저 선택하세요.';
      preview.className = 'order-routing-preview warning';
      return;
    }
    if (!candidates.length) {
      const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
      const shiftText = activeShiftCodes.length
        ? `${activeShiftCodes.join('·')}조 `
        : ((state.indicator.data?.housemanRouting?.currentShift || '') ? `${state.indicator.data.housemanRouting.currentShift}조 ` : '');
      preview.textContent = `${building} ${shiftText}담당자 없음`;
      preview.className = 'order-routing-preview danger';
      return;
    }
    const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
    const shiftText = activeShiftCodes.length ? `${activeShiftCodes.join('·')}조 ` : '';
    const names = candidates.map(candidate => candidate.name).join(' · ');
    preview.textContent = candidates.length > 1
      ? `${building} ${shiftText}→ ${names} 공동 전달 · 접수자 1명으로 고정`
      : `${building} ${shiftText}→ ${names} 자동배정`;
    preview.className = 'order-routing-preview success';
  }

  function novaRealtimeHousemanOrderId_(businessDate) { // (기존 HO-YYYYMMDD-XXXXXXXX 형식 유지)
    const dateText = String(businessDate || '').replace(/-/g, '');
    let suffix = '';
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      suffix = window.crypto.randomUUID().replace(/-/g, '').slice(0, 8).toUpperCase();
    } else {
      suffix = `${Date.now().toString(36)}${Math.random().toString(36).slice(2)}`.replace(/[^a-z0-9]/gi, '').slice(-8).toUpperCase().padStart(8, '0');
    }
    return `HO-${dateText}-${suffix}`;
  }

  function novaRealtimeHousemanAssignmentSnapshot_(payload) { // (현재 화면 자동배정 후보를 동일하게 고정)
    const mode = String(payload.assignmentMode || '').trim().toUpperCase();
    const supplied = payload.realtimeAssignmentSnapshot && typeof payload.realtimeAssignmentSnapshot === 'object'
      ? payload.realtimeAssignmentSnapshot : null; // PUBLIC_HOUSEMAN_REQUEST_V1
    if (mode === 'AUTO' && supplied && String(supplied.employeeNo || '').trim()) {
      return {
        building: String(supplied.building || `${String(payload.roomNo || '').charAt(0)}동`),
        employeeNo: String(supplied.employeeNo || '').trim(),
        name: String(supplied.name || ''),
        employeeNos: Array.isArray(supplied.employeeNos) ? supplied.employeeNos.map(String).filter(Boolean) : [String(supplied.employeeNo || '').trim()].filter(Boolean),
        names: Array.isArray(supplied.names) ? supplied.names.map(String) : [String(supplied.name || supplied.employeeNo || '')],
        currentShift: String(supplied.currentShift || '').trim().toUpperCase(),
        activeShiftCodes: Array.isArray(supplied.activeShiftCodes) ? supplied.activeShiftCodes.map(code => String(code || '').trim().toUpperCase()).filter(Boolean) : []
      };
    }
    if (mode === 'UNASSIGNED') return { building: `${String(payload.roomNo || '').charAt(0)}동`, employeeNo: '', employeeNos: [], names: [], currentShift: '', activeShiftCodes: [] };
    if (mode === 'MANUAL') {
      const employeeNo = String(payload.assignedEmployeeNo || '').trim();
      if (!employeeNo) return null;
      const user = (state.indicator.data?.staff?.housemen || []).find(item => item.employeeNo === employeeNo);
      return { building: `${String(payload.roomNo || '').charAt(0)}동`, employeeNo, employeeNos: [employeeNo], names: [user?.name || employeeNo], currentShift: '', activeShiftCodes: [] };
    }
    const digits = String(payload.roomNo || '').replace(/\D/g, '');
    if (digits.length !== 4 || !/^[1-9]/.test(digits)) return null;
    const building = `${digits.charAt(0)}동`;
    const candidates = state.indicator.data?.housemanRouting?.byBuilding?.[building] || [];
    if (!candidates.length) return null;
    const activeShiftCodes = state.indicator.data?.housemanRouting?.activeShiftCodes || [];
    const currentShift = String(state.indicator.data?.housemanRouting?.currentShift || '').trim().toUpperCase();
    return {
      building,
      employeeNo: String(candidates[0].employeeNo || ''),
      name: String(candidates[0].name || ''),
      employeeNos: candidates.map(candidate => String(candidate.employeeNo || '')).filter(Boolean),
      names: candidates.map(candidate => String(candidate.name || candidate.employeeNo || '')),
      currentShift,
      activeShiftCodes: activeShiftCodes.map(code => String(code || '').trim().toUpperCase()).filter(Boolean)
    };
  }

  async function novaPublicHousemanDbFirstRpc_(apiPayload) { // PUBLIC_QM_DBFIRST_ACCEL_20260905
    if (!apiPayload?.orderId || !apiPayload?.requestId) throw new Error('객실퍼블릭 하우스맨 요청 정보를 확인하세요.');
    const auth = await novaRealtimeGetAuth_();
    const endpoint = `${String(auth.supabaseUrl || '').replace(/\/+$/, '')}/rest/v1/rpc/nova_create_public_houseman_order`;
    const send = async () => {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': String(auth.publishableKey || ''),
          'Authorization': `Bearer ${auth.token}`
        },
        body: JSON.stringify({ p_payload: apiPayload })
      });
      let data = null;
      try { data = await response.json(); } catch (_) {}
      return { response, data };
    };

    let { response, data } = await send();
    // 발급 직후 Supabase 노드 간 시각차로 PGRST303이 발생한 경우에만 같은 토큰으로 1회 재시도합니다.
    if (response.status === 401 && String(data?.code || '').trim().toUpperCase() === 'PGRST303') {
      await new Promise(resolve => window.setTimeout(resolve, 1200));
      ({ response, data } = await send());
    }
    if (!response.ok) {
      const error = new Error(data?.message || data?.details || `객실퍼블릭 DB 등록 오류 (${response.status})`);
      error.status = response.status;
      error.code = data?.code || '';
      throw error;
    }
    if (!data?.ok || !data?.order?.orderId) throw new Error('객실퍼블릭 DB 등록 응답을 확인할 수 없습니다.');
    return data;
  }

  // QM_HOUSEMAN_DBFIRST_V1 · QM 하우스맨 요청 PostgreSQL 직접확정
  async function novaQmHousemanDbFirstRpc_(apiPayload) {
    if (!apiPayload?.orderId || !apiPayload?.requestId) {
      throw new Error('QM 하우스맨 요청 정보를 확인하세요.');
    }

    let auth = await novaRealtimeGetAuth_();
    let lastNetworkError = null;
    const waits = [180, 520, 1100];

    for (let attempt = 0; attempt < 3; attempt += 1) {
      const endpoint = `${String(auth.supabaseUrl || '').replace(/\/+$/, '')}/rest/v1/rpc/nova_create_qm_houseman_order`;
      let response;
      try {
        response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'apikey': String(auth.publishableKey || ''),
            'Authorization': `Bearer ${String(auth.token || '')}`
          },
          body: JSON.stringify({ p_payload: apiPayload })
        });
      } catch (error) {
        lastNetworkError = error;
        if (attempt < 2) {
          await novaRealtimeSleep_(waits[attempt] || 520);
          continue;
        }
        const unknown = new Error('QM 하우스맨 요청의 DB 처리 결과를 확인할 수 없습니다. 같은 요청으로 다시 확인해 주세요.');
        unknown.code = 'QM_HOUSEMAN_DB_RESULT_UNKNOWN';
        unknown.status = 0;
        unknown.cause = lastNetworkError;
        throw unknown;
      }

      let data = {};
      try { data = await response.json(); } catch (ignore) {}
      if (response.ok && data?.ok && data?.order?.orderId) return data;

      const code = String(data?.code || data?.error?.code || '').trim().toUpperCase();
      if (response.status === 401 && attempt === 0) {
        auth = await novaRealtimeGetAuth_();
        continue;
      }

      if ((response.status === 429 || response.status >= 500) && attempt < 2) {
        await novaRealtimeSleep_(waits[attempt] || 520);
        continue;
      }

      const rawMessage = data?.message || data?.error?.message || data?.error || '';
      const message = typeof rawMessage === 'string' && rawMessage
        ? rawMessage
        : `QM 하우스맨 DB 등록 오류 (${response.status})`;
      const error = new Error(message);
      error.code = code;
      error.status = Number(response.status || 0);
      error.data = data;
      throw error;
    }

    const unknown = new Error('QM 하우스맨 요청의 DB 처리 결과를 확인할 수 없습니다. 같은 요청으로 다시 확인해 주세요.');
    unknown.code = 'QM_HOUSEMAN_DB_RESULT_UNKNOWN';
    unknown.status = 0;
    unknown.cause = lastNetworkError;
    throw unknown;
  }

  async function novaShiftZoneDbRpc_(rpcName, payload) { // SHIFT_ZONE_DBFIRST_HOUSEMAN_UI_V1
    if (!novaRealtimeIsEnabled_()) throw new Error('Realtime DB 연결이 준비되지 않았습니다.');
    const auth = await novaRealtimeGetAuth_();
    const endpoint = `${String(auth.supabaseUrl || '').replace(/\/+$/, '')}/rest/v1/rpc/${rpcName}`;
    const send = async () => {
      const response = await novaRealtimeBoundedFetch_(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': String(auth.publishableKey || ''),
          'Authorization': `Bearer ${auth.token}`
        },
        body: JSON.stringify(payload || {})
      }, 6500);
      let data = null;
      try { data = await response.json(); } catch (_) {}
      return { response, data };
    };
    let { response, data } = await send();
    if (response.status === 401 && String(data?.code || '').trim().toUpperCase() === 'PGRST303') {
      await novaRealtimeSleep_(1200);
      ({ response, data } = await send());
    }
    if (!response.ok || !data?.ok) {
      const error = new Error(data?.message || data?.details || `근무조 DB 처리 오류 (${response.status})`);
      error.status = response.status;
      error.code = data?.code || '';
      throw error;
    }
    return data;
  }

  function novaShiftZoneMirrorLater_(serverFunction, payload) {
    window.setTimeout(() => {

  async function novaShiftZoneSeedFromLegacy_(legacy, payload, dbSnapshot) {
    const businessDate = String(payload?.businessDate || legacy?.businessDate || '').trim();
    const site = String(payload?.site || legacy?.site || '').trim();
    const assignments = legacy?.assignments || { A: [], B: [], C: [] };
    await novaShiftZoneDbRpc_('nova_houseman_shift_save_v2', {
      p_business_date: businessDate,
      p_site: site,
      p_assignments: assignments,
      p_request_id: novaRealtimeRequestId_('SHIFT_SEED', site)
    });

    const zones = legacy?.zoneAssignments || {};
    for (const [employeeNo, zone] of Object.entries(zones)) {
      const buildings = Array.isArray(zone?.buildings) ? zone.buildings.filter(Boolean) : [];
      if (!employeeNo || !buildings.length) continue;
      const action = dbSnapshot?.zoneAssignments?.[employeeNo] ? 'UPDATE' : 'SAVE';
      await novaShiftZoneDbRpc_('nova_houseman_zone_save_v1', {
        p_business_date: businessDate,
        p_site: site,
        p_employee_no: employeeNo,
        p_buildings: buildings,
        p_action: action,
        p_request_id: novaRealtimeRequestId_(`ZONE_SEED_${action}`, employeeNo)
      });
    }
  }

  async function novaShiftZoneDbFirstLoad_(payload) {
    if (!novaRealtime_.shiftZoneDbFirstEnabled || !novaRealtimeIsEnabled_()) {
      return callServer('getShiftManagementData', state.token, payload);

    try {
      let result = await novaShiftZoneDbRpc_('nova_houseman_shift_zone_get_v2', {
        p_business_date: String(payload?.businessDate || ''),
        p_site: String(payload?.site || '')
      });
      if (result.initialized) return result;

      // 전환 직후에만 기존 Sheet 값을 1회 읽어 PostgreSQL을 초기화합니다.
      const legacy = await callServer('getShiftManagementData', state.token, payload);
      if (!legacy?.ok) throw new Error(legacy?.message || '기존 근무조 정보를 읽지 못했습니다.');
      await novaShiftZoneSeedFromLegacy_(legacy, payload, result);
      result = await novaShiftZoneDbRpc_('nova_houseman_shift_zone_get_v2', {

  async function novaRealtimeCreateHousemanOrder_(payload, authRetry = 0) { // (Cloud Run/PostgreSQL 등록 확정)
    // NOVA_I18N_V1 · Realtime 오더 번역: DB에는 한국어 운영값, Sheet JSON에는 원문 메타를 보존합니다.
    let preparedPayload = Object.assign({}, payload || {});
    preparedPayload.sourceLanguage = String(
      preparedPayload.sourceLanguage || window.NOVA_I18N?.getLanguage?.() || 'ko'
    ).trim().toLowerCase();
    if (preparedPayload.sourceLanguage !== 'ko'
        && !(preparedPayload.translation
          && String(preparedPayload.translation.translatedTo || '').toLowerCase() === 'ko'
          && String(preparedPayload.translation.status || '').toUpperCase() === 'SUCCESS')) {
      const translated = await callServer('translateNovaHousemanOrderPayload', state.token, preparedPayload);
      if (!translated?.ok || !translated.payload) {
        throw new Error(translated?.message || '오더 한국어 번역에 실패했습니다.');
      }
      preparedPayload = translated.payload;
    }
    payload = preparedPayload;
    if (!novaRealtimeIsEnabled_()) throw new Error('Realtime이 비활성화되어 있습니다.');
    const assignment = novaRealtimeHousemanAssignmentSnapshot_(payload);
    if (String(payload.assignmentMode || '').trim().toUpperCase() === 'AUTO' && !assignment?.employeeNo) {
      const error = new Error('현재 자동배정 정보를 확인할 수 없어 기존 저장경로를 사용합니다.');
      error.code = 'REALTIME_ASSIGNMENT_UNAVAILABLE';
      throw error;
    }
    const orderId = novaRealtimeHousemanOrderId_(payload.businessDate);
    const requestId = novaRealtimeRequestId_('HOUSEMAN_CREATE', payload.roomNo);
    const currentShift = String(assignment?.currentShift || '').trim().toUpperCase();
    const apiPayload = Object.assign({}, payload, {
      orderId,
      requestId,
      assignment,
      handoverTargetShift: payload.handover ? novaRealtimeNextShift_(currentShift) : ''
    });
    let result;
    try {
      const requestRole = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').trim().toUpperCase();
      result = requestRole === 'PUBLIC'
        ? await novaPublicHousemanDbFirstRpc_(apiPayload) // PUBLIC_QM_DBFIRST_ACCEL_20260905
        : requestRole === 'QM'
          ? await novaQmHousemanDbFirstRpc_(apiPayload) // QM_HOUSEMAN_DBFIRST_V1
          : await novaRealtimeFetch_('/v1/houseman-orders', {
              method: 'POST',
              headers: { 'X-Request-Id': requestId },
              body: JSON.stringify(apiPayload)
            });
    } catch (error) {
      // Apps Script 로그인은 정상인데 Realtime DB 사용자/서명이 뒤처진 경우 1회 자가복구합니다.
      // 기존 signed JIT sync가 현재 사용자와 객실을 PostgreSQL에 맞춘 뒤 동일 등록을 재시도합니다.
      if (authRetry < 1 && String(error?.code || '').trim().toUpperCase() === 'UNAUTHORIZED') {
        await callServer('syncNovaRealtimeRoomForAction', state.token, {
          businessDate: String(payload.businessDate || ''),
          site: String(payload.site || ''),
          roomNo: String(payload.roomNo || '')
        });
        return novaRealtimeCreateHousemanOrder_(payload, authRetry + 1);
      }
      throw error;
    }
    const order = novaRealtimeMapHousemanOrder_(result.order) || result.order;
    if (!order?.orderId) throw new Error('Realtime 오더 저장 응답이 올바르지 않습니다.');
    order.__sheetMirrorPending = true;
    return {
      ok: true,
      order,
      orderId,
      requestId,
      assignment,
      timing: result.timing || {},
      mirrorPayload: Object.assign({}, payload, {
        realtimeOrderId: orderId,
        realtimeAssignmentSnapshot: assignment
      })
    };
  }


  async function novaRealtimeAssignHousemanOrder_(order, employeeNo) { // (미배정 하우스맨 오더 Realtime 수동배정)
    if (!novaRealtimeIsEnabled_()) throw new Error('Realtime이 비활성화되어 있습니다.');
    const orderId = String(order?.orderId || '').trim();
    const assignedEmployeeNo = String(employeeNo || '').trim();
    if (!orderId || !assignedEmployeeNo) throw new Error('배정할 오더와 직원을 확인하세요.');

    const requestId = novaRealtimeRequestId_('houseman-assign');
    const result = await novaRealtimeFetch_(
      `/v1/houseman-orders/${encodeURIComponent(orderId)}/assign`,
      {
        method: 'POST',
        headers: { 'X-Request-Id': requestId },
        body: JSON.stringify({
          employeeNo: assignedEmployeeNo,
          requestId
        })
      }
    );

    const mapped = novaRealtimeMapHousemanOrder_(result.order) || result.order;
    return {
      ok: true,
      order: mapped,
      orderVersion: Number(result.orderVersion || result.order?.version || 0),
      timing: result.timing || {},
      requestId
    };
  }

  async function mirrorRealtimeHousemanAssignmentToSheet_(sourceOrder, employeeNo) { // (Realtime 수동배정 Sheet·감사·Telegram 백그라운드 미러)
    const payload = {
      orderId: String(sourceOrder?.orderId || '').trim(),
      action: 'ASSIGN',
      expectedVersion: Number(sourceOrder?.version || 0),
      rowNumber: Number(sourceOrder?.rowNumber || 0),
      employeeNo: String(employeeNo || '').trim()
    };

    try {
      const mirror = await callServer('assignHousemanOrderFast', state.token, payload);
      if (!mirror?.ok) throw new Error(mirror?.message || '수동배정 이력 동기화에 실패했습니다.');
      upsertOrderLocal_(mirror.order, mirror.version);

      const aux = await callServer('finalizeHousemanAssignmentAux', state.token, {
        orderId: mirror.order.orderId,
        employeeNo: mirror.order.assignedEmployeeNo,
        rowNumber: Number(mirror.order.rowNumber || 0),
        version: Number(mirror.version || mirror.order.version || 0)
      });
      const telegram = aux?.telegram || {};
      if (telegram.queued && telegram.queueRecordId) {
        void callServer('dispatchHousemanOrderTelegramFast', state.token, {
          recordId: telegram.queueRecordId,
          rowNumber: Number(telegram.queueRowNumber || 0)
        }).catch(error => {
          console.warn('Realtime 수동배정 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
        });
      }
      setSyncStatus(`${mirror.order.roomNo}호 배정 이력 동기화 완료`);
    } catch (error) {
      console.warn('Realtime 수동배정 Sheet 미러 실패', error?.message || error);
      setSyncStatus(`${sourceOrder?.roomNo || ''}호 Realtime 배정 완료 · 기존 이력 동기화 재확인 필요`);
    }
  }

  async function mirrorRealtimeHousemanOrderToSheet_(mirrorPayload, attempt = 0) { // (기존 이력·감사·Telegram 보존)
    try {
      const result = await callServer('createHousemanOrder', state.token, mirrorPayload);
      if (!result?.ok) throw new Error(result?.message || 'Sheet 오더 미러에 실패했습니다.');
      if (result.order?.orderId) {
        const confirmedOrder = Object.assign({}, result.order, { __localProtectUntil: Date.now() + 30000 });
        delete confirmedOrder.__sheetMirrorPending;
        upsertOrderLocal_(confirmedOrder, result.version);
      }
      const telegram = result.telegram || {};
      if (telegram.queued && telegram.queueRecordId) {
        void callServer('dispatchHousemanOrderTelegramFast', state.token, {
          recordId: telegram.queueRecordId,
          rowNumber: telegram.queueRowNumber || 0
        }).catch(error => {
          console.warn('하우스맨 오더 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
        });
      }
      if (result.timing) console.info('NOVA 하우스맨 Sheet 미러시간', result.timing);
      return result;
    } catch (error) {
      if (attempt < 3) {
        await novaRealtimeSleep_([800, 1800, 4000, 8000][attempt] || 8000);
        return mirrorRealtimeHousemanOrderToSheet_(mirrorPayload, attempt + 1);
      }
      console.error('[NOVA Realtime] 하우스맨 Sheet 미러 실패:', error);
      setSyncStatus('하우스맨 오더 DB 저장완료 · 기존 이력 동기화 재확인 필요');
      return null;
    }
  }

  async function handleCreateHousemanOrder(event) { // (상단 고정영역 오더 등록·Realtime 선저장)
    event.preventDefault();
    const items = state.indicator.draftItems
      .map((item, index) => ({ name: String(item.name || '').trim(), quantity: index === 0 ? clampQuantity($('orderQuickQty').value) : clampQuantity(item.quantity) }))
      .filter(item => item.name);
    const payload = {

      roomNo: $('orderRoomNo').value.trim(),
      part: $('orderPart').value,
      items,
      note: $('orderNote').value.trim(),
      requester: $('orderRequester').value,
      assignmentMode: $('orderAssignmentMode').value,
      important: $('orderImportant').checked,
      handover: $('orderHandover').checked
    };
    if (!payload.site) return showToast('사업장을 선택하세요.');
    if (!payload.roomNo) return showToast('객실번호를 입력하세요.');
    if (!payload.part) return showToast('파트를 선택하세요.');
    if (!payload.items.length) return showToast('품목을 한 개 이상 입력하세요.');

    const pendingOrder = buildPendingHousemanOrder_(payload);
    upsertOrderLocal_(pendingOrder, state.indicator.version);
    if ($('orderScroll')) $('orderScroll').scrollTop = 0;
    setOrderFormBusy(true);
    const clickedAt = performance.now();
    try {
      let realtimeFallbackReason = '';
      // 로그인 직후 Realtime 설정 비동기 초기화가 끝나기 전에 등록을 누르더라도
      // 느린 Apps Script 경로로 바로 추락하지 않고 설정 확인을 먼저 완료합니다.
      if (!novaRealtime_.configLoaded) {
        const realtimeReady = await initNovaRealtime_();
        if (!realtimeReady && !novaRealtime_.configLoaded) realtimeFallbackReason = 'REALTIME_CONFIG_UNAVAILABLE';
      }
      if (novaRealtimeIsEnabled_()) {
        try {
          const realtime = await novaRealtimeCreateHousemanOrder_(payload);
          replacePendingOrderLocal_(pendingOrder.orderId, realtime.order, state.indicator.version);
          // DB 확정 직후 기존 Sheet/감사/Telegram 저장을 백그라운드에서 즉시 시작합니다.
          void mirrorRealtimeHousemanOrderToSheet_(realtime.mirrorPayload);
          resetOrderForm(true);
          const elapsed = Math.round(performance.now() - clickedAt);
          const assignedDisplay = String(realtime.order.assignedName || realtime.order.assignedEmployeeNo || '').trim();
          const realtimeServerMs = Math.max(0, Number(realtime.timing?.totalMs || 0));
          const housemanCreatePathLabel = `Realtime ${elapsed}ms${realtimeServerMs > 0 ? ` · 서버 ${realtimeServerMs}ms` : ''}`;
          const registrationTimingMessage = realtime.order.autoAssigned
            ? `${realtime.order.roomNo}호 · ${assignedDisplay || '하우스맨'}님 자동배정 완료 · ${housemanCreatePathLabel}`
            : realtime.order.assignedEmployeeNo
              ? `${realtime.order.roomNo}호 · ${assignedDisplay || '하우스맨'}님 배정완료 · ${housemanCreatePathLabel}`
              : `${realtime.order.roomNo}호 · 오더 등록 완료 · ${housemanCreatePathLabel}`;
          showToast(registrationTimingMessage);
          setSyncStatus(`${realtime.order.roomNo}호 오더 DB 저장 완료 · ${housemanCreatePathLabel}`);
      return;
        } catch (realtimeError) {
          realtimeFallbackReason = String(realtimeError?.code || realtimeError?.message || 'REALTIME_ERROR')
            .replace(/\s+/g, ' ').trim().slice(0, 80);
          console.warn('[NOVA Realtime] 하우스맨 등록은 기존 저장경로로 자동 전환합니다.', realtimeError);
        }
      } else if (!realtimeFallbackReason) {
        realtimeFallbackReason = novaRealtime_.configLoaded ? 'REALTIME_DISABLED' : 'REALTIME_CONFIG_UNAVAILABLE';
      }

      // Realtime 비활성/오류 시 기존 동작을 그대로 유지합니다.
      payload.sourceLanguage = String(payload.sourceLanguage || window.NOVA_I18N?.getLanguage?.() || 'ko').toLowerCase(); // NOVA_I18N_V1
      const result = await callServer('createHousemanOrder', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '오더 등록에 실패했습니다.');
      replacePendingOrderLocal_(pendingOrder.orderId, result.order, result.version);
      resetOrderForm(true);
      const legacyElapsed = Math.round(performance.now() - clickedAt);
      const legacyServerMs = Math.max(0, Number(result.timing?.totalMs || result.performance?.elapsedMs || 0));
      const legacyPathLabel = `Apps Script ${legacyElapsed}ms${legacyServerMs > 0 ? ` · 서버 ${legacyServerMs}ms` : ''}`;
      const legacyTiming = result.timing || {};
      const legacyTimingDetails = [
        `잠금 ${Math.max(0, Number(legacyTiming.lockWaitMs || 0))}ms`,
        `자동배정 ${Math.max(0, Number(legacyTiming.autoAssignMs || 0))}ms`,
        `쓰기 ${Math.max(0, Number(legacyTiming.writeMs || 0))}ms`,
        `flush ${Math.max(0, Number(legacyTiming.flushMs || 0))}ms`
      ].join(' · ');
      const legacyDiagnosticLabel = `${legacyPathLabel} · 우회 ${realtimeFallbackReason || 'UNKNOWN'} · ${legacyTimingDetails}`;
      showToast(result.order.assignedName
        ? `${result.order.roomNo}호 · ${result.order.assignedName}님 자동배정 완료 · ${legacyDiagnosticLabel}`
        : `${result.order.roomNo}호 미배정 오더 등록 완료 · ${legacyDiagnosticLabel}`);
      setSyncStatus(`${result.order.roomNo}호 오더 저장 완료 · ${legacyDiagnosticLabel}`);
      const telegram = result.telegram || {};
      if (telegram.queued && telegram.queueRecordId) {
        void callServer('dispatchHousemanOrderTelegramFast', state.token, {
          recordId: telegram.queueRecordId,
          rowNumber: telegram.queueRowNumber || 0
        }).catch(error => {
          console.warn('하우스맨 오더 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
        });
      }
      if (result.timing) console.info('NOVA 하우스맨 오더 저장시간', result.timing);
    } catch (error) {
      removeOrderLocal_(pendingOrder.orderId, payload.roomNo);
      showToast(error?.message || '오더 등록 오류');
    } finally {
      setOrderFormBusy(false);
    }
  }

  function buildPendingHousemanOrder_(payload) { // (오더 저장 중 처리현황 임시행 생성)
    const now = new Date().toISOString();
    const itemSummary = (payload.items || [])
      .map(item => Number(item.quantity || 1) > 1 ? `${item.name}×${item.quantity}` : item.name)
      .join(', ');
    return {
      orderId: `PENDING-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      businessDate: payload.businessDate,
      site: payload.site,
      roomNo: payload.roomNo,
      part: payload.part,
      items: payload.items || [],
      itemSummary,
      quantity: (payload.items || []).reduce((sum, item) => sum + Number(item.quantity || 1), 0),
      note: payload.note || '',
      requester: payload.requester || '',
      assignedEmployeeNo: '',
      assignedName: '저장중',
      processorEmployeeNo: '',
      processorName: '',
      statusCode: 'SAVING',
      statusLabel: '저장중',
      important: Boolean(payload.important),
      handover: Boolean(payload.handover),
      assignmentMode: payload.assignmentMode || 'AUTO',
      autoAssigned: false,
      routeCandidateEmployeeNos: [],
      routeCandidateNames: [],
      routeLocked: true,
      registeredAt: now,
      updatedAt: now,
      version: Number(state.indicator.version || 0),
      __pendingSave: true
    };
  }

  async function runOrderAction(order, action) { // (오더 상태 변경 실행)
    if (order?.__sheetMirrorPending) {
      showToast('오더는 저장되었습니다. 기존 이력 동기화가 완료된 뒤 처리할 수 있습니다.');
      return;
    }
    const payload = {
      orderId: order.orderId,
      action,
      expectedVersion: Number(order.version || 0),
      rowNumber: Number(order.rowNumber || 0)
    };
    if (action === 'ASSIGN') payload.employeeNo = $('detailAssignee').value;
    if (action === 'UNABLE') {
      const reason = window.prompt('처리불가 사유를 입력하세요.');
      if (reason === null) return;
      payload.reason = reason.trim();
    }
    const actionStartedAt = performance.now();
    try {
      if (
        action === 'ASSIGN'
        && String(order?.statusCode || '').trim().toUpperCase() === 'REGISTERED'
        && novaRealtimeIsEnabled_()
      ) {
        try {
          const realtime = await novaRealtimeAssignHousemanOrder_(order, payload.employeeNo);
          const elapsed = Math.round(performance.now() - actionStartedAt);
          const serverElapsed = Number(realtime.timing?.totalMs || 0);
          const pendingOrder = Object.assign({}, realtime.order, {
            rowNumber: Number(order.rowNumber || 0),
            version: Number(order.version || 0),
            __sheetMirrorPending: true,
            __sheetMirrorStartedAt: Date.now()
          });
          upsertOrderLocal_(pendingOrder, state.indicator.version);
          closeModal();
          showToast(`${pendingOrder.roomNo}호 배정 완료 · Realtime ${elapsed}ms${serverElapsed ? ` · 서버 ${serverElapsed}ms` : ''}`);
          setSyncStatus(`하우스맨 배정 DB 확정 · ${elapsed}ms${serverElapsed ? ` · 서버 ${serverElapsed}ms` : ''}`);
          void mirrorRealtimeHousemanAssignmentToSheet_(order, payload.employeeNo);
          return;
        } catch (realtimeError) {
          console.warn('[NOVA Realtime] 미배정 수동배정은 기존 저장경로로 자동 전환합니다.', realtimeError?.message || realtimeError);
        }
      }

      const managerRole = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
      if (
        action !== 'ASSIGN'
        && ['ADMIN', 'ORDER'].includes(managerRole)
        && ['ACCEPT', 'START', 'COMPLETE', 'UNABLE', 'REOPEN'].includes(action)
        && novaRealtimeIsEnabled_()
      ) {
        try {
          const realtime = await novaRealtimeHousemanWorkerAction_(payload);
          upsertOrderLocal_(realtime.order, state.indicator.version);
          closeModal();
          const elapsed = Math.round(performance.now() - actionStartedAt);
          showToast(action === 'REOPEN' ? '오더를 다시 열었습니다.' : `${realtime.order?.roomNo || order.roomNo}호 ${housemanActionMessage_(action)}`);
          setSyncStatus(`하우스맨 관리자 DB 확정 · ${elapsed}ms`);
          return;
        } catch (realtimeError) {
          const code = String(realtimeError?.code || '').trim().toUpperCase();
          if (Number(realtimeError?.status || 0) !== 404 && code !== 'HOUSEMAN_ORDER_NOT_FOUND') throw realtimeError;
          console.warn('[NOVA Realtime] DB 미존재 관리자 하우스맨 오더는 기존 저장경로로 처리합니다.', realtimeError?.message || realtimeError);
        }
      }

      const result = action === 'ASSIGN'
        ? await callServer('assignHousemanOrderFast', state.token, payload)
        : await callServer('updateHousemanOrder', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '오더를 변경하지 못했습니다.');
      upsertOrderLocal_(result.order, result.version);
      closeModal();

      if (action === 'ASSIGN') {
        const elapsed = Math.round(performance.now() - actionStartedAt);
        const serverElapsed = Number(result.performance?.elapsedMs || 0);
        const telegram = result.telegram || {};
        showToast(`${result.order.roomNo}호 배정 완료 · ${elapsed}ms${serverElapsed ? ` · 서버 ${serverElapsed}ms` : ''}`);
        setSyncStatus(`하우스맨 배정 완료 · ${elapsed}ms${serverElapsed ? ` · 서버 ${serverElapsed}ms` : ''}`);
        if (telegram.deferred) {
          void callServer('finalizeHousemanAssignmentAux', state.token, {
            orderId: result.order.orderId,
            employeeNo: result.order.assignedEmployeeNo,
            rowNumber: Number(result.order.rowNumber || 0),
            version: Number(result.version || result.order.version || 0)
          }).then(aux => {
            const queued = aux?.telegram || {};
            if (queued.queued && queued.queueRecordId) {
              return callServer('dispatchHousemanOrderTelegramFast', state.token, {
                recordId: queued.queueRecordId,
                rowNumber: Number(queued.queueRowNumber || 0)
              });
            }
            return null;
          }).catch(error => {
            console.warn('하우스맨 배정 감사·텔레그램 후속처리는 큐 재확인이 필요합니다.', error?.message || error);
          });
        } else if (telegram.queued && telegram.queueRecordId) {
          void callServer('dispatchHousemanOrderTelegramFast', state.token, {
            recordId: telegram.queueRecordId,
            rowNumber: Number(telegram.queueRowNumber || 0)
          }).catch(error => {
            console.warn('하우스맨 배정 텔레그램 즉시발송은 큐 재시도로 전환됩니다.', error?.message || error);
          });
        }
      } else {
        showToast(`${result.order.roomNo}호 오더: ${result.order.statusLabel}`);
      }
    } catch (error) {
      showToast(error?.message || '오더 처리 오류');
    }
  }

        businessDate: state.indicator.businessDate,

        roomNos: Array.from(selected),

      };
      event.currentTarget.disabled = true;

        (result.rooms || []).forEach(updated => {
          const index = state.indicator.data.rooms.findIndex(room => room.roomNo === updated.roomNo && room.site === updated.site);

        renderRoomGrid(); closeModal(); showToast(`${result.count}실을 일괄배정했습니다.`);

  function validateRoomActionPayload_(payload) { // (즉시반영 전 필수 선택값 확인)
    const action = String(payload?.action || '').trim().toUpperCase();
    if (action === 'CHANGE_ROOM_STATUS' && !String(payload?.roomStatus || '').trim()) {
      return '변경할 객실상태를 선택하세요.';
    }
    if (action === 'ASSIGN_ROOMMAID') {
      if (!String(payload?.employeeNo || '').trim()) return '주담당 룸메이드를 선택하세요.';
      const assignmentType = String(payload?.assignmentType || 'SOLO').trim().toUpperCase();
      if (['PAIR', 'PAIR_TRAINING'].includes(assignmentType)) {
        if (!String(payload?.secondaryEmployeeNo || '').trim()) return '보조 룸메이드를 선택하세요.';
        if (String(payload.employeeNo) === String(payload.secondaryEmployeeNo)) return '2인1조는 서로 다른 룸메이드 2명을 선택해야 합니다.';
      }
    }
    if (action === 'QM_ASSIGN' && !String(payload?.employeeNo || '').trim()) {
      return '배정할 QM을 선택하세요.';
    }
    if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
      const rawOperationalStatus = String(payload?.operationalStatus || '').trim();
      if (rawOperationalStatus && !normalizeIndicatorRoomOperationalStatus_(rawOperationalStatus)) return '사용할 수 없는 객실 조치상태입니다.';
    }
    return '';
  }

  function emptyRoomAssignmentPatch_() { // (객실 배정정보 화면 초기화값)
    return {
      cleaningType: '',
      assignmentType: '',
      roommaidEmployeeNo: '',
      roommaidName: '',
      secondaryRoommaidEmployeeNo: '',
      secondaryRoommaidName: '',
      qmEmployeeNo: '',
      qmName: ''
    };
  }

  function buildOptimisticRoomPatch_(room, payload) { // (객실카드 전체 작업 즉시 화면 반영값)
    const action = String(payload?.action || '').trim().toUpperCase();
    const roomStatusCode = codeValue_(state.indicator.data?.codes?.roomStatuses, room.roomStatus || '');
    const cleaningStatusCode = codeValue_(state.indicator.data?.codes?.cleaningStatuses, room.cleaningStatus || 'WAITING');

    if (action === 'UPDATE_OPERATION_FLAGS') {
      return { preassigned: Boolean(payload.preassigned), vip: Boolean(payload.vip), importantRoom: Boolean(payload.importantRoom) };
    }

    if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
      return { operationalStatus: normalizeIndicatorRoomOperationalStatus_(payload.operationalStatus) };
    }

    if (action === 'CHANGE_ROOM_STATUS') {
      const nextRoomStatus = String(payload.roomStatus || '').trim().toUpperCase();
      const resetAssignment = emptyRoomAssignmentPatch_();
      const activeCleaningStatuses = new Set(['ASSIGNED', 'CLEANING', 'QM_WAITING', 'QM_CHECKING', 'REWORK']);
      if (nextRoomStatus === 'VACANT_CLEAN') {
        // 통합 인디게이터에서 공실을 직접 선택하면 이전 재고·퇴실 상태를 남기지 않는다.
        return Object.assign({
          roomStatus: nextRoomStatus,
          displayBaseRoomStatus: '',
          previousCycle: null,
          cleaningStatus: 'COMPLETED'
        }, resetAssignment);
      }
      if (nextRoomStatus === 'RECHECKIN') {
        return Object.assign({ roomStatus: nextRoomStatus, displayBaseRoomStatus: '', cleaningStatus: 'COMPLETED' }, resetAssignment);
      }
      if (['CHECKED_OUT', 'CHECKED_OUT_RC', 'CHECKED_OUT_HU', 'STOCK', 'STOCK_RC', 'STOCK_HU'].includes(nextRoomStatus)) {
        return { roomStatus: nextRoomStatus, displayBaseRoomStatus: nextRoomStatus, cleaningStatus: 'WAITING' };
      }
      if (['STAY', 'DUE_OUT'].includes(nextRoomStatus)) {
        return Object.assign({ roomStatus: nextRoomStatus, displayBaseRoomStatus: '', cleaningStatus: 'NOT_REQUIRED' }, resetAssignment);
      }
      if (activeCleaningStatuses.has(cleaningStatusCode)) {
        return { roomStatus: nextRoomStatus };
      }
      return Object.assign({ roomStatus: nextRoomStatus, cleaningStatus: 'WAITING' }, resetAssignment);
    }

    if (action === 'ASSIGN_ROOMMAID') {
      const staff = state.indicator.data?.staff?.roommaids || [];
      const primary = staff.find(user => user.employeeNo === payload.employeeNo);
      const secondary = staff.find(user => user.employeeNo === payload.secondaryEmployeeNo);
      return {
        cleaningType: payload.cleaningType || 'NORMAL',
        assignmentType: payload.assignmentType || 'SOLO',
        roommaidEmployeeNo: payload.employeeNo || '',
        roommaidName: primary?.name || '',
        secondaryRoommaidEmployeeNo: payload.secondaryEmployeeNo || '',
        secondaryRoommaidName: secondary?.name || '',
        cleaningStatus: 'ASSIGNED'
      };
    }

    if (action === 'CLEANING_START') {
      return { cleaningStatus: 'CLEANING' };
    }

    if (action === 'CLEANING_COMPLETE') {
      // 청소완료는 청소상태만 변경하고 재고·퇴실 계열 객실상태는 그대로 유지한다.
      return { cleaningStatus: 'COMPLETED' };
    }

    if (action === 'CLEANING_RESET') {
      // 해당 객실의 금일 완료실적 전체를 취소하므로 현재 배정도 미배정·미완료 상태로 되돌린다.
      return Object.assign({ cleaningStatus: 'WAITING' }, emptyRoomAssignmentPatch_());
    }

    if (action === 'QM_ASSIGN') {
      const staff = state.indicator.data?.staff?.qms || [];
      const qm = staff.find(user => user.employeeNo === payload.employeeNo);
      return {
        qmEmployeeNo: payload.employeeNo || '',
        qmName: qm?.name || '',
        cleaningStatus: 'QM_WAITING'
      };
    }

    if (action === 'QM_CLEAR') {
      return { qmEmployeeNo: '', qmName: '', cleaningStatus: 'COMPLETED' };
    }

    if (action === 'CLEAR_ASSIGNMENT') {
      return Object.assign({ cleaningStatus: 'WAITING' }, emptyRoomAssignmentPatch_());
    }

    return null;
  }

  function renderIndicatorRoomLocal_(roomNo, site) { // (변경 객실카드 1개만 즉시 갱신)
    const grid = $('roomGrid');
    const rooms = state.indicator.data?.rooms || [];
    const room = rooms.find(item => item.roomNo === roomNo && (!site || item.site === site));
    if (!grid || !room) return;
    const existing = Array.from(grid.querySelectorAll('[data-room-no]'))
      .find(card => card.dataset.roomNo === roomNo);
    const visible = roomMatchesIndicatorFilter_(room);
    if (existing && visible) {
      existing.outerHTML = roomCardHtml_(room);
    } else if (existing && !visible) {
      existing.remove();
      if (!grid.querySelector('[data-room-no]')) {
        grid.innerHTML = '<div class="room-empty">선택한 조건에 표시할 객실이 없습니다.</div>';
      }
    } else if (!existing && visible) {
      renderRoomGrid();
    }
    renderIndicatorSummary();
  }

    if (!room) return '';
    return JSON.stringify([
      room.roomStatus || '', room.displayBaseRoomStatus || '', room.cleaningStatus || '', room.cleaningType || '', room.assignmentType || '',

      room.secondaryRoommaidName || '', room.qmEmployeeNo || '', room.qmName || '', normalizeIndicatorRoomOperationalStatus_(room.operationalStatus), Number(room.pendingOrderCount || 0)

  function clearIndicatorRoomPendingMark_(roomNo) { // (화면 재구성 없이 저장중 표시만 해제)
    const grid = $('roomGrid');
    if (!grid) return;
    const card = Array.from(grid.querySelectorAll('[data-room-no]')).find(item => item.dataset.roomNo === roomNo);
    if (!card) return;
    card.classList.remove('room-card-saving');
    card.querySelector('.room-save-pending')?.remove();

  function showRoomActionToast_(message) { // (객실작업 전용 경량 안내·전체객실 재렌더 금지)
    const toast = $('toast');
    if (!toast) return;
    toast.textContent = message;
    toast.classList.remove('hidden');
    if (state.toastTimer) window.clearTimeout(state.toastTimer);
    state.toastTimer = window.setTimeout(() => toast.classList.add('hidden'), 1800);
  }

  function waitForUiPaint_() { // (서버 호출 전 화면 변경을 먼저 그리기)
    return new Promise(resolve => window.requestAnimationFrame(() => resolve()));
  }

  async function runRoomAction(room, action, forcedRoomStatus = '', sourceButton = null, forcedOperationalStatus = '') { // (객실 작업 즉시반영·서버확정)
    if (action === 'CLEANING_COMPLETE' && isIndicatorCleaningCompletionLocked_(room?.cleaningStatus)) {
      showRoomActionToast_(`${room.roomNo}호는 이미 청소완료 처리되었습니다.`);
      return;
    }
    if (action === 'CLEANING_RESET') {
      const confirmed = window.confirm(
        `${room.roomNo}호의 금일 청소완료 실적을 모두 초기화합니다.\n\n`
        + '일반정비와 정비유형(D/S·5S·평가원·직원숙소·딥크리닝 등)의 모든 완료이력이 취소되어 룸메이드 실적과 마감일지에서 제외됩니다.\n'
        + '현재 룸메이드·QM 배정도 취소되고 객실은 미배정·미완료 상태로 돌아갑니다.\n\n'
        + '계속하시겠습니까?'
      );
      if (!confirmed) return;
    }
    if (action === 'QM_CLEAR') {
      const confirmed = window.confirm(
        `${room.roomNo}호의 QM 배정을 초기화합니다.\n\n`
        + '룸메이드 배정과 청소완료 실적은 유지되고, QM 배정만 해제됩니다.\n'
        + '점검중인 경우 기존 체크리스트 초안·이력은 보존되며 해당 QM은 더 이상 완료할 수 없습니다.\n\n'
        + '계속하시겠습니까?'
      );
      if (!confirmed) return;
    }
    const clickedAt = performance.now();
    const payload = {
      businessDate: state.indicator.businessDate,
      site: room.site,
      roomNo: room.roomNo,
      rowNumber: Number(room.rowNumber || 0),
      action,
      employeeNo: action === 'QM_ASSIGN' ? $('qmSelect')?.value : $('roommaidSelect')?.value,
      secondaryEmployeeNo: action === 'ASSIGN_ROOMMAID' ? ($('secondaryRoommaidSelect')?.value || '') : '',
      assignmentType: action === 'ASSIGN_ROOMMAID' ? ($('assignmentTypeSelect')?.value || 'SOLO') : '',
      cleaningType: action === 'ASSIGN_ROOMMAID' ? ($('cleaningTypeSelect')?.value || 'NORMAL') : '',
      roomStatus: action === 'CHANGE_ROOM_STATUS' ? (forcedRoomStatus || $('roomStatusSelect')?.value || '') : '',
      preassigned: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomPreassignedFlag')?.checked) : Boolean(room.preassigned),
      vip: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomVipFlag')?.checked) : Boolean(room.vip),
      importantRoom: action === 'UPDATE_OPERATION_FLAGS' ? Boolean($('roomImportantFlag')?.checked) : Boolean(room.importantRoom),
      operationalStatus: action === 'UPDATE_ROOM_OPERATION_STATUS' ? normalizeIndicatorRoomOperationalStatus_(forcedOperationalStatus) : normalizeIndicatorRoomOperationalStatus_(room.operationalStatus),
      // Realtime 요청은 DB version을 사용하고, Realtime 비활성/장애 시 legacy CLEANING_RESET만
      // 별도로 보존한 Sheet version을 사용한다. 두 버전 도메인을 섞지 않는다.
      // CLEAR_ASSIGNMENT는 관리자가 현재 배정을 '없음'으로 만드는 멱등 작업이므로
      // 지연된 Realtime version 때문에 초기화가 거절되지 않도록 version 충돌검사를 사용하지 않는다.
      expectedVersion: ['CLEAR_ASSIGNMENT', 'UPDATE_ROOM_OPERATION_STATUS'].includes(action) ? 0 : Number(room.version || 0),
      // Cloud Run은 DB version을 사용하되, version이 달라졌을 때 실제로 이 작업과
      // 충돌하는 필드가 바뀌었는지 expectedState로 한 번 더 판정한다.
      expectedState: {
        roomStatus: String(room.roomStatus || ''),
        cleaningStatus: String(room.cleaningStatus || ''),
        cleaningType: String(room.cleaningType || 'NORMAL'),
        assignmentType: String(room.assignmentType || 'SOLO'),
        roommaidEmployeeNo: String(room.roommaidEmployeeNo || ''),
        secondaryRoommaidEmployeeNo: String(room.secondaryRoommaidEmployeeNo || ''),
        qmEmployeeNo: String(room.qmEmployeeNo || ''),
        operationalStatus: String(room.operationalStatus || '')
      },
      // Realtime 비활성/legacy 퇴실 경로에서는 반드시 Sheet version을 사용한다.
      sheetExpectedVersion: Number(room.__sheetVersion ?? room.version ?? 0)
    };
    const validationError = validateRoomActionPayload_(payload);
    if (validationError) {
      showRoomActionToast_(validationError);
      return;
    }

    const actionKey = `${room.site}|${room.roomNo}`;
    if (state.indicator.roomActionInFlight[actionKey]) return;

    const rooms = state.indicator.data?.rooms || [];
    const index = rooms.findIndex(item => item.roomNo === room.roomNo && item.site === room.site);
    const beforeRoom = index >= 0 ? Object.assign({}, rooms[index]) : null;
    const optimisticPatch = buildOptimisticRoomPatch_(room, payload);
    if (action === 'CHANGE_ROOM_STATUS'
        && String(payload.roomStatus || '').trim().toUpperCase() !== 'CHECKED_OUT'
        && optimisticPatch) {
      const realtimeRoomPatch = {};
      [
        'cleaningStatus', 'cleaningType', 'assignmentType',
        'roommaidEmployeeNo', 'secondaryRoommaidEmployeeNo', 'qmEmployeeNo'
      ].forEach(key => {
        if (Object.prototype.hasOwnProperty.call(optimisticPatch, key)) {
          realtimeRoomPatch[key] = optimisticPatch[key];
        }
      });
      payload.realtimeRoomPatch = realtimeRoomPatch;
    }
    const fastAction = Boolean(optimisticPatch) && action !== 'QM_ASSIGN'; // QM배정은 DB+Sheet 확정 후에만 화면반영
    const originalButtonText = sourceButton?.textContent || '';
    const actionLabel = {
      CHANGE_ROOM_STATUS: payload.roomStatus === 'CHECKED_OUT' ? '퇴실 전환' : '객실상태 변경',
      ASSIGN_ROOMMAID: '룸메이드 배정',
      CLEANING_START: '청소시작',
      CLEANING_COMPLETE: '청소완료',
      CLEANING_RESET: '청소 초기화',
      QM_ASSIGN: 'QM 배정',
      QM_CLEAR: 'QM 배정 초기화',
      CLEAR_ASSIGNMENT: '배정 초기화',
      UPDATE_OPERATION_FLAGS: '운영표시 저장',
      UPDATE_ROOM_OPERATION_STATUS: payload.operationalStatus === 'BROKEN' ? '고장 등록' : payload.operationalStatus === 'ROOM_CHECK' ? '객실확인 등록' : payload.operationalStatus === 'REWORK' ? '재정비 등록' : '객실조치 완료'
    }[action] || '객실 작업';

    state.indicator.roomActionInFlight[actionKey] = true;
    if (sourceButton) {
      sourceButton.disabled = true;
      sourceButton.textContent = '처리 중';
    }

    if (fastAction && index >= 0) {
      closeModal();
      rooms[index] = Object.assign({}, rooms[index], optimisticPatch, { __pendingAction: action });
      renderIndicatorRoomLocal_(room.roomNo, room.site);
      showRoomActionToast_(`${room.roomNo}호 ${actionLabel} 화면 반영`);
      setSyncStatus(`${room.roomNo}호 화면 반영 · 서버 저장 중`);
      await waitForUiPaint_();
    }

    try {
      const result = await saveRoomActionRealtimeOrLegacy_('updateRoomOperation', payload);
      if (!result?.ok) throw new Error(result?.message || '객실 작업을 저장하지 못했습니다.');
      const resultRoom = Object.assign({}, result.room || {});
      if (action === 'CLEAR_ASSIGNMENT' || action === 'CLEANING_RESET') {
        Object.assign(resultRoom, emptyRoomAssignmentPatch_(), { cleaningStatus: 'WAITING' });
      }
      if (action === 'QM_CLEAR') {
        Object.assign(resultRoom, { qmEmployeeNo: '', qmName: '', cleaningStatus: 'COMPLETED' });
      }
      if (action === 'UPDATE_ROOM_OPERATION_STATUS') {
        // 서버 저장 성공 응답에서는 요청한 조치상태를 화면 확정값으로 강제 병합한다.
        // stale delta/부분응답이 끼어도 '저장완료인데 표시 없음' 상태가 생기지 않게 한다.
        resultRoom.operationalStatus = normalizeIndicatorRoomOperationalStatus_(payload.operationalStatus);
      }
      if (action === 'CHANGE_ROOM_STATUS' && payload.roomStatus === 'CHECKED_OUT') {
        resultRoom.roomStatus = 'CHECKED_OUT';
      }
      const resultRoomNo = String(resultRoom.roomNo || room.roomNo);
      const resultRoomSite = String(resultRoom.site || room.site);
      const resultIndex = rooms.findIndex(item => item.roomNo === resultRoomNo && item.site === resultRoomSite);
      const optimisticVisual = resultIndex >= 0 ? roomVisualSignature_(rooms[resultIndex]) : '';
      if (resultIndex >= 0) {
        const previousPending = rooms[resultIndex].pendingOrderCount;
        rooms[resultIndex] = Object.assign({}, rooms[resultIndex], resultRoom, { pendingOrderCount: previousPending });
        delete rooms[resultIndex].__pendingAction;
      }
      state.indicator.version = Number(result.version || state.indicator.version);
      state.roommaidClose.loaded = false;
      state.roommaidClose.data = null;

      if (result.deferredNotification) {
        callServer('queueDeferredRoomOperationNotification', state.token, result.deferredNotification)
          .catch(error => console.error(`객실작업 후속 알림 등록 실패: ${error?.message || error}`));
      }

      const confirmedVisual = resultIndex >= 0 ? roomVisualSignature_(rooms[resultIndex]) : '';
      if (resultIndex >= 0 && optimisticVisual === confirmedVisual) {
        clearIndicatorRoomPendingMark_(resultRoomNo);
      } else {
        renderIndicatorRoomLocal_(resultRoomNo, resultRoomSite);
      }

      const totalMs = Math.round(performance.now() - clickedAt);
      const serverMs = Number(result.timing?.totalMs || result.performance?.elapsedMs || 0);
      const duplicateIgnored = action === 'CLEANING_COMPLETE' && result.alreadyCompleted === true;
      setSyncStatus(duplicateIgnored
        ? `${room.roomNo}호 중복 청소완료 요청 제외 · 화면 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`
        : `${room.roomNo}호 저장 완료 · 화면 ${totalMs}ms${serverMs ? ` · 서버 ${serverMs}ms` : ''}`);
      if (!fastAction) closeModal();
      showRoomActionToast_(duplicateIgnored
        ? `${room.roomNo}호는 이미 청소완료 처리되어 중복 요청을 제외했습니다.`
        : action === 'CLEANING_RESET'
          ? (result.mirrorPending === true
              ? `${room.roomNo}호 청소완료 실적 초기화 완료 · 이력 동기화 중`
              : `${room.roomNo}호 청소완료 실적 ${Number(result.resetCompletionCount || 0)}건 초기화 완료`)
          : `${room.roomNo}호 ${actionLabel} 완료`);
    } catch (error) {
      if (fastAction && index >= 0 && beforeRoom) {
        rooms[index] = beforeRoom;
        renderIndicatorRoomLocal_(room.roomNo, room.site);
        setSyncStatus(`${room.roomNo}호 저장 실패 · 기존 상태 복원`);
      }
      showRoomActionToast_(error?.message || '객실 작업 오류');
    } finally {
      delete state.indicator.roomActionInFlight[actionKey];
      if (sourceButton?.isConnected) {
        sourceButton.disabled = false;
        sourceButton.textContent = originalButtonText;
      }
    }
  }

  function removeOrderLocal_(orderId, roomNo) { // (저장 실패 임시오더 제거)
    const orders = state.indicator.data?.orders || [];
    const index = orders.findIndex(item => item.orderId === orderId);
    if (index >= 0) orders.splice(index, 1);
    recalculatePendingOrders_(roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function replacePendingOrderLocal_(pendingOrderId, order, version) { // (임시오더를 서버 확정오더로 교체)
    const orders = state.indicator.data?.orders || [];
    const pendingIndex = orders.findIndex(item => item.orderId === pendingOrderId);
    if (pendingIndex >= 0) orders.splice(pendingIndex, 1);
    const existingIndex = orders.findIndex(item => item.orderId === order.orderId);
    if (existingIndex >= 0) orders[existingIndex] = order; else orders.unshift(order);
    orders.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || String(b.registeredAt).localeCompare(String(a.registeredAt)));
    state.indicator.version = Number(version || state.indicator.version);
    recalculatePendingOrders_(order.roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function upsertOrderLocal_(order, version) { // (변경된 오더만 화면에 반영)
    const orders = state.indicator.data.orders || [];
    const index = orders.findIndex(item => item.orderId === order.orderId);
    if (index >= 0) orders[index] = order; else orders.unshift(order);
    orders.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)) || String(b.registeredAt).localeCompare(String(a.registeredAt)));
    state.indicator.version = Number(version || state.indicator.version);
    recalculatePendingOrders_(order.roomNo);
    renderOrderList();
    renderIndicatorSummary();
    renderRoomGrid();
  }

  function recalculatePendingOrders_(roomNo) { // (해당 객실 미완료 오더수 재계산)
    const room = (state.indicator.data.rooms || []).find(item => item.roomNo === roomNo);
    if (!room) return;
    room.pendingOrderCount = (state.indicator.data.orders || []).filter(order => order.roomNo === roomNo && !['COMPLETED', 'UNABLE'].includes(order.statusCode)).length;
  }

  function startIndicatorSync() { // (지터 기반 통합 화면 동기화 + Realtime DB 보조조회 시작)
    stopIndicatorSync();
    scheduleIndicatorSync_();
    if (novaRealtimeIsEnabled_()) novaRealtimeStartIndicatorDbFallback_();
  }

  function scheduleIndicatorSync_() { // (사용자별 요청시점 분산)
    if (document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) return;
    const base = Number(state.bootstrap.app.indicatorSyncMs || 9000);
    state.indicator.syncTimer = window.setTimeout(async () => {
      state.indicator.syncTimer = null;
      await syncIndicatorDelta();
      scheduleIndicatorSync_();
    }, nextSyncDelay_(base));
  }

  function stopIndicatorSync() { // (통합 화면 동기화 중지)
    if (state.indicator.syncTimer) window.clearTimeout(state.indicator.syncTimer);
    state.indicator.syncTimer = null;
    novaRealtimeStopIndicatorDbFallback_();
  }

  async function syncIndicatorDelta() { // (변경된 경우에만 객실·오더 재조회)
    if (document.hidden || state.activeMenu !== 'indicator' || state.indicator.loading || state.indicator.syncInFlight || Object.keys(state.indicator.roomActionInFlight || {}).length || !state.indicator.loaded || isHousemanItemEditorOpen_()) return;
    state.indicator.syncInFlight = true;
    try {
      const result = await callReadServerWithRetry_('getIndicatorDelta', state.token, {
        businessDate: state.indicator.businessDate,
        site: state.indicator.site,
        sinceVersion: state.indicator.version
      });
      if (!result?.ok) throw new Error(result?.message || '동기화 실패');
      if (result.changed) applyIndicatorSnapshot(result);
      setSyncStatus(`${result.changed ? '변경 반영' : '정상 연결'} · ${result.serverTime || ''}`);
    } catch (error) {
      setSyncStatus(`연결 재시도 · ${error?.message || '오류'}`);
    } finally {
      state.indicator.syncInFlight = false;
    }
  }
