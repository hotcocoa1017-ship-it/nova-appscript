<script>
(() => {
  'use strict';

  /* =========================
   * NOVA Realtime Phase 1 v3.3 FINAL
   * - 청소시작/청소완료: Cloud Run + PostgreSQL
   * - 관리자 인디케이터: Supabase Broadcast + PostgreSQL 이벤트 경량조회 이중화
   * - 기존 Sheet Delta는 하우스맨/QM 등 미전환 기능 때문에 유지
   * - Realtime 관리 객실 필드는 Sheet Delta가 덮어쓰지 못하게 보호
   * ========================= */
  const novaRealtime_ = {
    enabled: false,
    apiBase: '',
    supabase: null,
    channels: new Map(),
    tokenRefreshTimer: null,
    configLoaded: false,
    indicatorDbTimer: null,
    indicatorDbBusy: false,
    indicatorEventCursorTime: '',
    indicatorEventCursorRequestId: '',
    indicatorFullReconcileAt: 0, // ROOM_STATE_SYNC_HARDENING_V1
    roomStatusProtections: new Map(),
    qmDraftDbFirstEnabled: false,
    shiftZoneDbFirstEnabled: false, // SHIFT_ZONE_DBFIRST_HOUSEMAN_UI_V1
    qmDraftAuthBundle: null
  }; // QM_DRAFT_DB_FIRST_V1

  const NOVA_REALTIME_ROOM_FIELDS_ = Object.freeze([
    // Phase 1 Realtime owns cleaning progress and DB version metadata only.
    // 객실상태/배정/객실운영상태(고장·객실확인)는 기존 Sheets가 원본이므로
    // PostgreSQL의 지연·빈 값으로 덮어쓰지 않습니다.
    'cleaningStatus', 'cleaningType', 'assignmentType', 'roommaidEmployeeNo', 'secondaryRoommaidEmployeeNo', 'qmEmployeeNo', 'operationalStatus', 'preassigned', 'vip', 'importantRoom', 'version', 'updatedAt'
  ]);

  function novaRealtimeIsEnabled_() {
    return Boolean(novaRealtime_.enabled && novaRealtime_.apiBase);
  }

  function novaRealtimeSleep_(ms) {
    return new Promise(resolve => window.setTimeout(resolve, Math.max(0, Number(ms || 0))));
  }

  function novaRealtimeRequestId_(action, roomNo) {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return `NOVA-${Date.now()}-${String(action || '')}-${String(roomNo || '')}-${Math.random().toString(36).slice(2)}`;
  }

  function novaRealtimeBoundedFetch_(url, options = {}, timeoutMs = 7000) { // ROOM_STATE_SYNC_HARDENING_V1
    if (typeof AbortController !== 'function') return fetch(url, options);
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), Math.max(1000, Number(timeoutMs || 7000)));
    const requestOptions = Object.assign({}, options, { signal: controller.signal });
    return fetch(url, requestOptions).finally(() => window.clearTimeout(timeout));
  }

  async function novaRealtimeFetch_(path, options = {}, attempt = 0) {
    const response = await novaRealtimeBoundedFetch_(`${novaRealtime_.apiBase}${path}`, {
      method: options.method || 'GET',
      headers: Object.assign({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.token}`
      }, options.headers || {}),
      body: options.body
    }, Number(options.timeoutMs || 7000)).catch(error => {
      if (attempt < 2) return null;
      throw error;
    });

    if (!response) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeFetch_(path, options, attempt + 1);
    }

    let data = {};
    try { data = await response.json(); } catch (ignore) {}

    if (response.ok && data?.ok) return data;

    const retryable = (response.status === 429 || response.status >= 500) && options.noRetry !== true;
    if (retryable && attempt < 2) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeFetch_(path, options, attempt + 1);
    }

    const error = new Error(data?.message || `Realtime API 오류 (${response.status})`);
    error.code = data?.code || '';
    error.status = response.status;
    error.currentRoom = data?.currentRoom || null;
    throw error;
  }

  async function novaRealtimeRoomChangesFetch_(payload, attempt = 0) {
    const form = new URLSearchParams();
    Object.entries(payload || {}).forEach(([key, value]) => {
      form.set(key, value == null ? '' : String(value));
    });
    form.set('token', String(state.token || ''));

    const response = await novaRealtimeBoundedFetch_(`${novaRealtime_.apiBase}/v1/room-changes`, {
      method: 'POST',
      body: form
    }, 6500).catch(error => {
      if (attempt < 2) return null;
      throw error;
    });

    if (!response) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeRoomChangesFetch_(payload, attempt + 1);
    }

    let data = {};
    try { data = await response.json(); } catch (ignore) {}
    if (response.ok && data?.ok) return data;

    const retryable = response.status === 429 || response.status >= 500;
    if (retryable && attempt < 2) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeRoomChangesFetch_(payload, attempt + 1);
    }

    const error = new Error(data?.message || data?.error || `Realtime 변경조회 실패 (${response.status})`);
    error.status = response.status;
    error.code = data?.code || '';
    error.data = data;
    throw error;
  }

  async function initNovaRealtime_() { // (API 설정과 보조 Realtime 연결을 분리해 고속 API 유지)
    if (!state.token) return false;
    if (!novaRealtime_.configLoaded) {
      try {
        const config = await callServer('getNovaRealtimeClientConfig', state.token);
        novaRealtime_.configLoaded = true;
        novaRealtime_.enabled = Boolean(config?.ok && config?.enabled && config?.apiBase);
        novaRealtime_.apiBase = String(config?.apiBase || '').replace(/\/+$/, '');
        novaRealtime_.qmDraftDbFirstEnabled = Boolean(config?.qmDraftDbFirstEnabled); // QM_DRAFT_DB_FIRST_V1
        novaRealtime_.shiftZoneDbFirstEnabled = Boolean(config?.shiftZoneDbFirstEnabled); // SHIFT_ZONE_DBFIRST_HOUSEMAN_UI_V1
      } catch (error) {
        novaRealtime_.configLoaded = false;
        novaRealtime_.enabled = false;
        novaRealtime_.apiBase = '';
        console.error('[NOVA Realtime] 설정조회 실패:', error);
        setSyncStatus(`Realtime 연결 재시도 · ${error?.message || '설정 조회 오류'}`);
        return false;
      }
    }
    if (!novaRealtimeIsEnabled_()) return false;

    try {
      await novaRealtimeHydrateCurrentView_();
      const role = String(state.bootstrap?.user?.role || '').toUpperCase();
      if (['ADMIN', 'ORDER'].includes(role) && state.activeMenu === 'indicator' && state.indicator.queryApplied && state.indicator.loaded && !state.indicator.queryDirty) {
        try {
          await novaRealtimeEnsureSubscriptions_();
        } catch (subscriptionError) {
          console.warn('[NOVA Realtime] 구독 연결 실패 · DB 변경조회로 보조합니다.', subscriptionError);
        }
        novaRealtimeStartIndicatorDbFallback_();
        setSyncStatus('Realtime 관리자 연결 준비 완료');
      } else {
        setSyncStatus('고속 API 연결 준비 완료');
      }
    } catch (error) {
      // 화면 수화/구독 오류가 있어도 Cloud Run 고속 API 자체는 비활성화하지 않습니다.
      console.warn('[NOVA Realtime] 보조 연결 초기화 오류 · 고속 API는 유지합니다.', error);
      const role = String(state.bootstrap?.user?.role || '').toUpperCase();
      if (['ADMIN', 'ORDER'].includes(role) && state.activeMenu === 'indicator') novaRealtimeStartIndicatorDbFallback_();
      setSyncStatus('고속 API 연결 준비 완료 · Realtime 보조 연결 재시도');
    }
    return true;
  }

  function novaRealtimeMapRow_(row) {
    if (!row) return null;
    return {
      businessDate: String(row.business_date || row.businessDate || ''),
      site: String(row.site || ''),
      roomNo: String(row.room_no || row.roomNo || ''),
      building: String(row.building || ''),
      roomStatus: String(row.room_status ?? row.roomStatus ?? ''),
      cleaningStatus: String(row.cleaning_status ?? row.cleaningStatus ?? ''),
      cleaningType: String(row.cleaning_type ?? row.cleaningType ?? 'NORMAL'),
      assignmentType: String(row.assignment_type ?? row.assignmentType ?? 'SOLO'),
      roommaidEmployeeNo: String(row.roommaid_employee_no ?? row.roommaidEmployeeNo ?? ''),
      secondaryRoommaidEmployeeNo: String(row.secondary_roommaid_employee_no ?? row.secondaryRoommaidEmployeeNo ?? ''),
      qmEmployeeNo: String(row.qm_employee_no ?? row.qmEmployeeNo ?? ''),
      operationalStatus: String(row.operational_status ?? row.operationalStatus ?? ''),
      version: Number(row.version || 0),
      updatedAt: row.updated_at || row.updatedAt || ''
    };
  }

  function novaRealtimeMapPartialRoom_(row) {
    if (!row) return null;
    const mapped = {
      businessDate: String(row.business_date || row.businessDate || ''),
      site: String(row.site || ''),
      roomNo: String(row.room_no || row.roomNo || '')
    };
    const hasOwn = key => Object.prototype.hasOwnProperty.call(row, key);
    const putText = (target, snake, camel) => {
      if (!hasOwn(snake) && !hasOwn(camel)) return;
      mapped[target] = String(row[snake] ?? row[camel] ?? '');
    };
    putText('roomStatus', 'room_status', 'roomStatus');
    putText('cleaningStatus', 'cleaning_status', 'cleaningStatus');
    putText('cleaningType', 'cleaning_type', 'cleaningType');
    putText('assignmentType', 'assignment_type', 'assignmentType');
    putText('roommaidEmployeeNo', 'roommaid_employee_no', 'roommaidEmployeeNo');
    putText('secondaryRoommaidEmployeeNo', 'secondary_roommaid_employee_no', 'secondaryRoommaidEmployeeNo');
    putText('qmEmployeeNo', 'qm_employee_no', 'qmEmployeeNo');
    putText('operationalStatus', 'operational_status', 'operationalStatus');
    if (hasOwn('preassigned')) mapped.preassigned = row.preassigned === true;
    if (hasOwn('vip')) mapped.vip = row.vip === true;
    if (hasOwn('important_room') || hasOwn('importantRoom')) mapped.importantRoom = (row.important_room ?? row.importantRoom) === true;
    if (hasOwn('version')) mapped.version = Number(row.version || 0);
    if (hasOwn('updated_at') || hasOwn('updatedAt')) mapped.updatedAt = row.updated_at || row.updatedAt || '';
    if (hasOwn('building') && row.building) mapped.building = String(row.building);
    return mapped;
  }

  function novaRealtimeUpdatedAtMs_(value) { // (Sheet/DB 수정시각 비교용)
    const text = String(value || '').trim();
    if (!text) return 0;
    const local = text.match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}):(\d{2}):(\d{2})$/);
    const normalized = local
      ? `${local[1]}T${String(local[2]).padStart(2, '0')}:${local[3]}:${local[4]}+09:00`
      : text;
    const ms = Date.parse(normalized);
    return Number.isFinite(ms) ? ms : 0;
  }

  function novaRealtimeMergeRoom_(legacyRoom, realtimeRoom) {
    if (!legacyRoom) return realtimeRoom ? Object.assign({}, realtimeRoom) : legacyRoom;
    if (!realtimeRoom) return legacyRoom;
    const merged = Object.assign({}, legacyRoom);
    // Sheet snapshot version and Realtime DB version are separate domains.
    // Preserve the Sheet version before Realtime fields overwrite room.version.
    if (!Object.prototype.hasOwnProperty.call(merged, '__sheetVersion')) {
      merged.__sheetVersion = Number(legacyRoom.version || 0);
    }
    NOVA_REALTIME_ROOM_FIELDS_.forEach(key => {
      if (Object.prototype.hasOwnProperty.call(realtimeRoom, key)) merged[key] = realtimeRoom[key];
    });
    if (realtimeRoom.building) merged.building = realtimeRoom.building;

    // ROOM_STATE_SYNC_HARDENING_V1 · 청소시작/완료 optimistic 상태는 DB가 확정하거나 더 앞선 상태로 진행할 때까지 보호합니다.
    const pendingCleaningAction = String(legacyRoom?.__pendingAction || '').trim().toUpperCase();
    if (['CLEANING_START', 'CLEANING_COMPLETE'].includes(pendingCleaningAction)
        && Object.prototype.hasOwnProperty.call(realtimeRoom, 'cleaningStatus')) {
      const dbCleaningStatus = String(realtimeRoom.cleaningStatus || '').trim().toUpperCase();
      const startConfirmed = pendingCleaningAction === 'CLEANING_START'
        && ['CLEANING', 'COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'].includes(dbCleaningStatus);
      const completeConfirmed = pendingCleaningAction === 'CLEANING_COMPLETE'
        && ['COMPLETED', 'QM_WAITING', 'QM_CHECKING', 'QM_COMPLETED'].includes(dbCleaningStatus);
      if (startConfirmed || completeConfirmed) {
        delete merged.__pending;
        delete merged.__pendingAction;
      } else {
        merged.cleaningStatus = String(legacyRoom.cleaningStatus || merged.cleaningStatus || '');
        if (legacyRoom.__pending === true) merged.__pending = true;
        merged.__pendingAction = pendingCleaningAction;
      }
    }

    // QM을 Realtime으로 전환하기 전 생성된 과거행은 Sheet의 완료/재정비가 DB의
    // QM대기/점검중보다 최신일 수 있다. 이 경우에만 최신 Sheet 상태를 보존한다.
    const legacyCleaningStatus = String(legacyRoom?.cleaningStatus || '').trim().toUpperCase();
    const realtimeCleaningStatus = String(realtimeRoom?.cleaningStatus || '').trim().toUpperCase();
    const legacyQmTerminal = ['QM_COMPLETED', 'REWORK'].includes(legacyCleaningStatus);
    const realtimeQmPreTerminal = ['QM_WAITING', 'QM_CHECKING'].includes(realtimeCleaningStatus);
    if (legacyQmTerminal && realtimeQmPreTerminal) {
      const sheetUpdatedMs = novaRealtimeUpdatedAtMs_(legacyRoom?.updatedAt);
      const dbUpdatedMs = novaRealtimeUpdatedAtMs_(realtimeRoom?.updatedAt);
      if (sheetUpdatedMs && (!dbUpdatedMs || sheetUpdatedMs >= dbUpdatedMs)) {
        merged.cleaningStatus = legacyCleaningStatus;
      }
    }

    // 일반 객실상태 Realtime 저장 직후 Sheet 미러가 따라올 때까지만 상태를 보호한다.
    // CHECKED_OUT은 이 보호맵을 사용하지 않으므로 기존 Apps Script 퇴실 결과가 stale DB에 의해 되돌아가지 않는다.
    const protectionKey = `${String(merged.site || '').trim()}|${String(merged.roomNo || '').trim()}`;
    const statusProtection = novaRealtime_.roomStatusProtections.get(protectionKey);
    if (statusProtection) {
      if (Date.now() >= Number(statusProtection.expiresAt || 0)) {
        novaRealtime_.roomStatusProtections.delete(protectionKey);
      } else if (String(legacyRoom?.roomStatus || '').trim().toUpperCase() === String(statusProtection.roomStatus || '').trim().toUpperCase()) {
        // Sheet 미러가 새 상태를 따라오면 즉시 보호 해제.
        novaRealtime_.roomStatusProtections.delete(protectionKey);
      } else {
        merged.roomStatus = String(statusProtection.roomStatus || merged.roomStatus || '');
      }
    }

    if (Object.prototype.hasOwnProperty.call(realtimeRoom, 'roommaidEmployeeNo')
        || Object.prototype.hasOwnProperty.call(realtimeRoom, 'secondaryRoommaidEmployeeNo')) {
      const staff = state.indicator.data?.staff?.roommaids || [];
      const primaryNo = String(merged.roommaidEmployeeNo || '').trim();
      const secondaryNo = String(merged.secondaryRoommaidEmployeeNo || '').trim();
      const primary = staff.find(user => String(user.employeeNo || '').trim() === primaryNo);
      const secondary = staff.find(user => String(user.employeeNo || '').trim() === secondaryNo);
      merged.roommaidName = primaryNo ? String(primary?.name || primaryNo) : '';
      merged.secondaryRoommaidName = secondaryNo ? String(secondary?.name || secondaryNo) : '';
    }
    if (Object.prototype.hasOwnProperty.call(realtimeRoom, 'qmEmployeeNo')) {
      const staff = state.indicator.data?.staff?.qms || [];
      const qmNo = String(merged.qmEmployeeNo || '').trim();
      const qm = staff.find(user => String(user.employeeNo || '').trim() === qmNo);
      merged.qmName = qmNo ? String(qm?.name || qmNo) : '';
    }
    return merged;
  }

  function novaRealtimeProtectRoomArray_(incomingRooms, currentRooms) {
    if (!novaRealtimeIsEnabled_() || !Array.isArray(incomingRooms) || !Array.isArray(currentRooms)) return incomingRooms;
    const current = new Map(currentRooms.map(room => [`${room.site}|${room.roomNo}`, room]));
    return incomingRooms.map(room => {
      const previous = current.get(`${room.site}|${room.roomNo}`);
      return previous ? novaRealtimeMergeRoom_(room, previous) : room;
    });
  }

  function novaRealtimeRelevantSites_() {
    if (!state.bootstrap) return [];
    const role = String(state.bootstrap.user?.role || '').toUpperCase();
    if (state.activeMenu === 'indicator' && ['ADMIN', 'ORDER'].includes(role)) {
      if (!state.indicator.queryApplied || state.indicator.queryDirty || !state.indicator.loaded) return []; // SITE_SCOPE_INDICATOR_CLOSE_V2
      const selected = String(state.indicator.site || '').trim();
      if (selected) return [selected];
      return [...new Set((state.indicator.data?.sites || []).map(String).map(v => v.trim()).filter(Boolean))];
    }
    // 직원 모바일은 상시 Realtime 채널을 만들지 않고 현재 화면 진입/저빈도 조회로 hydrate 합니다.
    const mobileRealtimeRole = (state.activeMenu === 'cleaning' && role === 'ROOMMAID')
      || (state.activeMenu === 'qm' && role === 'QM')
      || (state.activeMenu === 'houseman' && role === 'HOUSEMAN'); // HOUSEMAN_REALTIME_PUSH_V1
    if (mobileRealtimeRole) {
      const selected = String(state.mobile.site || '').trim();
      if (selected) return [selected];
      return [...new Set([
        ...(state.mobile.data?.sites || []),
        String(state.bootstrap.user?.defaultSite || '').trim()
      ].map(String).map(v => v.trim()).filter(Boolean))];
    }
    return [];
  }

  async function novaRealtimeLoadRoomsForSite_(businessDate, site) {
    if (!businessDate || !site) return [];
    const query = new URLSearchParams({ businessDate: String(businessDate), site: String(site) });
    const result = await novaRealtimeFetch_(`/v1/rooms?${query.toString()}`);
    return Array.isArray(result.rooms) ? result.rooms : [];
  }

  async function novaRealtimeLoadHousemanOrders_(businessDate, site) { // (HOUSEMAN 본인 배정오더 DB 직접조회)
    if (!businessDate || !site) return [];
    const query = new URLSearchParams({ businessDate: String(businessDate), site: String(site) });
    const result = await novaRealtimeFetch_(`/v1/houseman-orders?${query.toString()}`);
    return Array.isArray(result.orders) ? result.orders : [];
  }

  async function novaRealtimeHydrateCurrentView_() {
    if (!novaRealtimeIsEnabled_() || !state.bootstrap) return;
    const role = String(state.bootstrap.user?.role || '').toUpperCase();

    if (state.activeMenu === 'indicator' && ['ADMIN', 'ORDER'].includes(role) && state.indicator.data) {
      const sites = novaRealtimeRelevantSites_();
      const lists = await Promise.all(sites.map(site =>
        novaRealtimeLoadRoomsForSite_(state.indicator.businessDate || state.bootstrap.app.businessDate, site)
          .catch(error => { console.error('[NOVA Realtime] 객실 조회 실패', site, error); return []; })
      ));
      const realtimeMap = new Map(lists.flat().map(room => [`${room.site}|${room.roomNo}`, room]));
      state.indicator.data.rooms = (state.indicator.data.rooms || []).map(room =>
        novaRealtimeMergeRoom_(room, realtimeMap.get(`${room.site}|${room.roomNo}`))
      );
      if (!isHousemanItemEditorOpen_()) renderIndicatorData();
      return;
    }

    const mobileRealtimeRole = (state.activeMenu === 'cleaning' && role === 'ROOMMAID')
      || (state.activeMenu === 'qm' && role === 'QM');
    if (mobileRealtimeRole && state.mobile.data) {
      const sites = novaRealtimeRelevantSites_();
      const lists = await Promise.all(sites.map(site =>
        novaRealtimeLoadRoomsForSite_(state.mobile.businessDate || state.bootstrap.app.businessDate, site)
          .catch(error => { console.error('[NOVA Realtime] 모바일 객실 조회 실패', site, error); return []; })
      ));
      const realtimeRows = lists.flat();

      const assignedRoomMobile = (role === 'ROOMMAID' && state.activeMenu === 'cleaning')
        || (role === 'QM' && state.activeMenu === 'qm');
      if (assignedRoomMobile) {
        // /v1/rooms는 ROOMMAID/QM 토큰이면 DB에서 본인 배정객실만 반환한다.
        // 신규 배정·재배정·배정취소를 Sheet 미러와 무관하게 반영하도록 목록 자체를 재구성한다.
        const employeeNo = String(state.bootstrap.user?.employeeNo || '').trim();
        const employeeName = String(state.bootstrap.user?.name || '').trim();
        const legacyMap = new Map((state.mobile.data.rooms || []).map(room => [`${room.site}|${room.roomNo}`, room]));
        state.mobile.data.rooms = realtimeRows.map(rawRoom => {
          const realtimeRoom = novaRealtimeMapPartialRoom_(rawRoom);
          const key = `${realtimeRoom.site}|${realtimeRoom.roomNo}`;
          const legacyRoom = legacyMap.get(key);
          if (legacyRoom) return preserveQmMobileRoommaidNames_(legacyRoom, novaRealtimeMergeRoom_(legacyRoom, realtimeRoom));

          const primaryNo = String(realtimeRoom.roommaidEmployeeNo || '').trim();
          const secondaryNo = String(realtimeRoom.secondaryRoommaidEmployeeNo || '').trim();
          const qmNo = String(realtimeRoom.qmEmployeeNo || '').trim();
          return Object.assign({
            rowNumber: 0,
            roommaidName: role === 'ROOMMAID' && primaryNo === employeeNo ? employeeName : primaryNo,
            secondaryRoommaidName: role === 'ROOMMAID' && secondaryNo === employeeNo ? employeeName : secondaryNo,
            qmName: role === 'QM' && qmNo === employeeNo ? employeeName : qmNo,
            pendingOrderCount: 0,
            __sheetVersion: 0
          }, realtimeRoom);
        });
      } else {
        const realtimeMap = new Map(realtimeRows.map(room => [`${room.site}|${room.roomNo}`, room]));
        state.mobile.data.rooms = (state.mobile.data.rooms || []).map(room =>
          novaRealtimeMergeRoom_(room, realtimeMap.get(`${room.site}|${room.roomNo}`))
        );
      }
      renderMobileData();
    }
  }

  async function novaRealtimeGetAuth_() {
    return novaRealtimeFetch_('/v1/auth/realtime-token', { method: 'POST', body: '{}' });
  }

  async function novaRealtimeEnsureClient_() {
    if (!window.supabase?.createClient) throw new Error('Supabase Realtime 라이브러리를 불러오지 못했습니다.');
    const auth = await novaRealtimeGetAuth_();

    if (!novaRealtime_.supabase) {
      novaRealtime_.supabase = window.supabase.createClient(auth.supabaseUrl, auth.publishableKey, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
    }
    await novaRealtime_.supabase.realtime.setAuth(auth.token); // REALTIME_SUBSCRIPTION_RESILIENCE_V1

    if (novaRealtime_.tokenRefreshTimer) window.clearTimeout(novaRealtime_.tokenRefreshTimer);
    novaRealtime_.tokenRefreshTimer = window.setTimeout(async () => {
      try {
        if (!novaRealtimeIsEnabled_() || !state.token || !novaRealtime_.supabase) return;
        const next = await novaRealtimeGetAuth_();
        await novaRealtime_.supabase.realtime.setAuth(next.token);
        await novaRealtimeEnsureSubscriptions_();
      } catch (error) {
        console.error('[NOVA Realtime] 토큰 갱신 실패:', error);
      }
    }, 10 * 60 * 1000);
  }

  async function novaRealtimeEnsureSubscriptions_() {
    if (!novaRealtimeIsEnabled_()) return;
    const sites = novaRealtimeRelevantSites_();
    if (!sites.length) return;

    await novaRealtimeEnsureClient_();

    const wanted = new Set(sites);
    for (const [site, channel] of novaRealtime_.channels.entries()) {
      if (wanted.has(site)) continue;
      try { await novaRealtime_.supabase.removeChannel(channel); } catch (ignore) {}
      novaRealtime_.channels.delete(site);
    }

    for (const site of sites) {
      if (novaRealtime_.channels.has(site)) continue;
      const topic = `nova:site:${site}:rooms`;
      const channel = novaRealtime_.supabase
        .channel(topic, { config: { private: true } })
        .on('broadcast', { event: 'UPDATE' }, payload => {
          novaRealtimeHandleBroadcast_(payload);
          novaRealtimeHandleHousemanOrderBroadcast_(payload);
        })
        .on('broadcast', { event: 'INSERT' }, payload => {
          novaRealtimeHandleBroadcast_(payload);
          novaRealtimeHandleHousemanOrderBroadcast_(payload);
        })
        .subscribe((status, error) => {
          if (status === 'SUBSCRIBED') {
            setSyncStatus(`Realtime 연결 · ${site}`);
            return;
          }
          const failed = Boolean(error) || ['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(String(status || '').toUpperCase());
          if (!failed) return;
          console.error(`[NOVA Realtime] ${site} 구독 실패 (${status || 'UNKNOWN'})`, error || '');
          if (novaRealtime_.channels.get(site) === channel) novaRealtime_.channels.delete(site);
          if (novaRealtime_.supabase) {
            void novaRealtime_.supabase.removeChannel(channel).catch(() => {});
          }
          window.setTimeout(() => {
            if (!state.token || document.hidden || !novaRealtimeIsEnabled_()) return;
            if (!novaRealtimeRelevantSites_().includes(site)) return;
            void novaRealtimeEnsureSubscriptions_().catch(retryError => {
              console.warn(`[NOVA Realtime] ${site} 구독 재시도 실패`, retryError);
            });
          }, 1200);
        });
      novaRealtime_.channels.set(site, channel);
    }

    // Broadcast 유실/지연과 관계없이 관리자 화면은 DB를 직접 확인하는 보조 경로를 유지한다.
    novaRealtimeStartIndicatorDbFallback_();
  }

  function novaRealtimeBroadcastRow_(payload) {
    return payload?.payload?.new
      || payload?.payload?.record
      || payload?.new
      || payload?.record
      || null;
  }

  function preserveQmMobileRoommaidNames_(previousRoom, mergedRoom) { // (QM 점검대상 정비자 이름 보존 v1)
    if (String(state.mobile.data?.role || '').trim().toUpperCase() !== 'QM' || !previousRoom || !mergedRoom) return mergedRoom;
    const next = Object.assign({}, mergedRoom);
    const previousPrimaryNo = String(previousRoom.roommaidEmployeeNo || '').trim();
    const nextPrimaryNo = String(next.roommaidEmployeeNo || '').trim();
    const previousSecondaryNo = String(previousRoom.secondaryRoommaidEmployeeNo || '').trim();
    const nextSecondaryNo = String(next.secondaryRoommaidEmployeeNo || '').trim();

    // Realtime DB에는 사번만 있으므로 같은 배정자라면 Sheet 스냅샷의 표시명을 유지합니다.
    // 배정 사번이 실제로 변경된 경우에는 기존 이름을 절대 이월하지 않습니다.
    if (nextPrimaryNo && previousPrimaryNo === nextPrimaryNo && String(previousRoom.roommaidName || '').trim()) {
      next.roommaidName = String(previousRoom.roommaidName || '').trim();
    }
    if (nextSecondaryNo && previousSecondaryNo === nextSecondaryNo && String(previousRoom.secondaryRoommaidName || '').trim()) {
      next.secondaryRoommaidName = String(previousRoom.secondaryRoommaidName || '').trim();
    }
    return next;
  }

  function novaRealtimeHandleBroadcast_(payload) {
    const raw = novaRealtimeBroadcastRow_(payload);
    // 같은 Realtime 채널을 공유하는 하우스맨 INSERT는 객실 변경으로 해석하지 않습니다.
    if (raw && (raw.order_id || raw.orderId)) return;
    const room = novaRealtimeMapRow_(raw);
    if (!room?.roomNo || !room?.site) return;

    const indicatorRooms = state.indicator.data?.rooms || [];
    const indicatorIndex = indicatorRooms.findIndex(item => item.site === room.site && item.roomNo === room.roomNo);
    if (indicatorIndex >= 0) {
      indicatorRooms[indicatorIndex] = novaRealtimeMergeRoom_(indicatorRooms[indicatorIndex], room);
      if (state.activeMenu === 'indicator') {
        renderIndicatorRoomLocal_(room.roomNo, room.site);
        renderIndicatorSummary();
      }
    }

    const mobileRooms = state.mobile.data?.rooms || [];
    const mobileIndex = mobileRooms.findIndex(item => item.site === room.site && item.roomNo === room.roomNo);
    if (mobileIndex >= 0) {
      const previousMobileRoom = mobileRooms[mobileIndex];
      mobileRooms[mobileIndex] = preserveQmMobileRoommaidNames_(previousMobileRoom, novaRealtimeMergeRoom_(previousMobileRoom, room));
      if (state.activeMenu === 'cleaning' && state.mobile.data?.role === 'ROOMMAID') {
        refreshRoommaidMobileSummaryLocal_();
        renderMobileSummary();
        renderMobileList();
      } else if (state.activeMenu === 'qm' && state.mobile.data?.role === 'QM') {
        renderMobileSummary();
        renderMobileList();
      }
    }
    setSyncStatus(`${room.roomNo}호 실시간 반영`);
  }

  function novaRealtimeOrderDateTimeText_(value) { // (DB timestamptz -> 기존 화면 날짜형식)
    if (!value) return '';
    const text = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(text)) return text;
    const date = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(date.getTime())) return String(value || '');
    try {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, hourCycle: 'h23'
      }).formatToParts(date).reduce((acc, part) => { acc[part.type] = part.value; return acc; }, {});
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    } catch (ignore) {
      return String(value || '');
    }
  }

  function novaRealtimeHousemanStatusLabel_(statusCode) { // (기존 NOVA.ORDER_STATUS 표시명 유지)
    const labels = {
      REGISTERED: '등록', ASSIGNED: '배정', ACCEPTED: '접수',
      PROCESSING: '처리중', COMPLETED: '완료', UNABLE: '처리불가'
    };
    const code = String(statusCode || '').trim().toUpperCase();
    return labels[code] || code || '-';
  }

  function novaRealtimeMapHousemanOrder_(row) { // (Realtime DB 오더 -> 기존 화면 오더 객체)
    if (!row || !(row.order_id || row.orderId)) return null;
    const statusCode = String(row.status_code ?? row.statusCode ?? 'REGISTERED').trim().toUpperCase();
    const candidateNames = Array.isArray(row.route_candidate_names ?? row.routeCandidateNames)
      ? (row.route_candidate_names ?? row.routeCandidateNames).map(String)
      : [];
    return {
      rowNumber: 0,
      orderId: String(row.order_id ?? row.orderId ?? ''),
      businessDate: String(row.business_date ?? row.businessDate ?? '').slice(0, 10),
      site: String(row.site ?? ''),
      roomNo: String(row.room_no ?? row.roomNo ?? ''),
      part: String(row.part ?? ''),
      items: Array.isArray(row.items) ? row.items : [],
      itemSummary: String(row.item_summary ?? row.itemSummary ?? ''),
      quantity: Number(row.quantity || 0),
      note: String(row.note ?? ''),
      requester: String(row.requester ?? ''),
      assignedEmployeeNo: String(row.assigned_employee_no ?? row.assignedEmployeeNo ?? ''),
      assignedName: String(row.assigned_name ?? row.assignedName ?? ''),
      processorEmployeeNo: String(row.processor_employee_no ?? row.processorEmployeeNo ?? ''),
      processorName: String(row.processor_name ?? row.processorName ?? ''),
      statusCode,
      statusLabel: String(row.status_label ?? row.statusLabel ?? '') || novaRealtimeHousemanStatusLabel_(statusCode),
      important: row.important === true,
      handover: row.handover === true,
      handoverTargetShift: String(row.handover_target_shift ?? row.handoverTargetShift ?? '').toUpperCase(),
      assignmentMode: String(row.assignment_mode ?? row.assignmentMode ?? 'UNASSIGNED').toUpperCase(),
      autoAssigned: row.auto_assigned === true || row.autoAssigned === true,
      assignedBuilding: String(row.assigned_building ?? row.assignedBuilding ?? ''),
      assignedShiftCode: String(row.assigned_shift_code ?? row.assignedShiftCode ?? '').toUpperCase(),
      assignedShiftCodes: Array.isArray(row.assigned_shift_codes ?? row.assignedShiftCodes) ? (row.assigned_shift_codes ?? row.assignedShiftCodes) : [],
      routeCandidateEmployeeNos: Array.isArray(row.route_candidate_employee_nos ?? row.routeCandidateEmployeeNos) ? (row.route_candidate_employee_nos ?? row.routeCandidateEmployeeNos).map(String) : [],
      routeCandidateNames: candidateNames,
      routeCandidateSummary: candidateNames.join(' · '),
      routeLocked: (row.route_locked ?? row.routeLocked) !== false,
      acceptedByEmployeeNo: String(row.accepted_by_employee_no ?? row.acceptedByEmployeeNo ?? ''),
      releasedCandidateEmployeeNos: Array.isArray(row.released_candidate_employee_nos ?? row.releasedCandidateEmployeeNos) ? (row.released_candidate_employee_nos ?? row.releasedCandidateEmployeeNos).map(String) : [],
      registeredBy: String(row.registered_by ?? row.registeredBy ?? ''),
      registeredAt: novaRealtimeOrderDateTimeText_(row.registered_at ?? row.registeredAt),
      acceptedAt: novaRealtimeOrderDateTimeText_(row.accepted_at ?? row.acceptedAt),
      startedAt: novaRealtimeOrderDateTimeText_(row.started_at ?? row.startedAt),
      completedAt: novaRealtimeOrderDateTimeText_(row.completed_at ?? row.completedAt),
      unableReason: String(row.unable_reason ?? row.unableReason ?? ''),
      updatedAt: novaRealtimeOrderDateTimeText_(row.updated_at ?? row.updatedAt),
      version: Number(row.version || 0),
      __localProtectUntil: Date.now() + 30000
    };
  }

  let novaHousemanPushRefreshTimer_ = null;

  function novaRealtimeScheduleHousemanPushRefresh_() { // HOUSEMAN_REALTIME_PUSH_V1 · Push 수신 즉시 안전 재조회
    if (novaHousemanPushRefreshTimer_) window.clearTimeout(novaHousemanPushRefreshTimer_);
    novaHousemanPushRefreshTimer_ = window.setTimeout(async () => {
      novaHousemanPushRefreshTimer_ = null;
      const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').toUpperCase();
      if (role !== 'HOUSEMAN' || state.activeMenu !== 'houseman' || document.hidden || !state.mobile.loaded) return;
      if (state.mobile.loading || state.mobile.syncInFlight || state.mobile.actionInFlight) {
        novaHousemanPushRefreshTimer_ = window.setTimeout(novaRealtimeScheduleHousemanPushRefresh_, 250);
        return;
      }
      try {
        await syncMobileDelta();
      } catch (error) {
        console.warn('[NOVA Realtime] 하우스맨 Push 즉시조회 실패 · 주기조회로 복구합니다.', error);
      }
    }, 80);
  }

  function novaRealtimeHandleHousemanOrderBroadcast_(payload) { // (관리자 + HOUSEMAN 신규/재배정 오더 즉시 전파 · HOUSEMAN_REALTIME_PUSH_V1)
    const raw = novaRealtimeBroadcastRow_(payload);
    if (!raw || !(raw.order_id || raw.orderId)) return;

    const role = String(state.mobile.data?.role || state.bootstrap?.user?.role || '').toUpperCase();
    if (role === 'HOUSEMAN' && state.activeMenu === 'houseman') {
      const selectedSite = String(state.mobile.site || state.bootstrap?.user?.defaultSite || '').trim();
      const selectedDate = String(state.mobile.businessDate || state.bootstrap?.app?.businessDate || '').trim();
      const rowSite = String(raw.site || '').trim();
      const rowDate = String(raw.business_date || raw.businessDate || '').trim();
      if ((!rowSite || !selectedSite || rowSite === selectedSite)
          && (!rowDate || !selectedDate || rowDate === selectedDate)) {
        novaRealtimeScheduleHousemanPushRefresh_();
      }
      return;
    }

    if (state.activeMenu !== 'indicator' || !state.indicator.data) return;
    const order = novaRealtimeMapHousemanOrder_(raw);
    if (!order?.orderId || !order.roomNo || !order.site) return;
    if (String(order.businessDate) !== String(state.indicator.businessDate || '')) return;
    if (state.indicator.site && String(order.site) !== String(state.indicator.site)) return;

    // Realtime DB version과 Sheet 변경버전은 서로 다른 버전 도메인입니다.
    // 이미 Sheet 이력이 확인된 오더는 rowNumber/Sheet version을 유지해야
    // 접수·처리·완료 및 재배정 시 기존 이력 동기화 대기 상태로 되돌아가지 않습니다.
    const existing = (state.indicator.data.orders || [])
      .find(item => String(item?.orderId || '') === String(order.orderId || ''));
    const existingRowNumber = Number(existing?.rowNumber || 0);

    if (existingRowNumber > 0) {
      order.rowNumber = existingRowNumber;
      order.version = Number(existing?.version || 0);
      delete order.__sheetMirrorPending;
      delete order.__sheetMirrorStartedAt;
    } else if (existing?.__sheetMirrorPending) {
      // 이 브라우저가 방금 Realtime 선저장을 시작한 경우에는
      // 실제 Sheet 미러 완료 전까지만 pending을 유지합니다.
      order.rowNumber = existingRowNumber;
      order.version = Number(existing?.version || order.version || 0);
      order.__sheetMirrorPending = true;
      order.__sheetMirrorStartedAt = Number(existing?.__sheetMirrorStartedAt || Date.now());
    } else {
      // 다른 브라우저에서 방금 생성/배정된 오더는 Sheet 행이 확인될 때까지만 보호합니다.
      order.__sheetMirrorPending = true;
      order.__sheetMirrorStartedAt = Date.now();
    }

    upsertOrderLocal_(order, state.indicator.version);
    setSyncStatus(`${order.roomNo}호 하우스맨 오더 실시간 반영`);
  }

  function novaRealtimeRoomSignature_(room) {
    if (!room) return '';
    return JSON.stringify(NOVA_REALTIME_ROOM_FIELDS_.map(key => room[key] ?? ''));
  }

  async function novaRealtimeReconcileIndicatorRooms_() { // ROOM_STATE_SYNC_HARDENING_V1 · Broadcast/event 누락 최종복구
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded || !state.indicator.data) return 0;
    const role = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return 0;
    const businessDate = String(state.indicator.businessDate || state.bootstrap?.app?.businessDate || '').trim();
    const sites = novaRealtimeRelevantSites_();
    if (!businessDate || !sites.length) return 0;

    const lists = await Promise.all(sites.map(site =>
      novaRealtimeLoadRoomsForSite_(businessDate, site)
        .catch(error => { console.warn('[NOVA Realtime] 인디게이터 전체상태 보정 실패', site, error); return []; })
    ));
    const dbMap = new Map();
    lists.flat().forEach(raw => {
      const mapped = novaRealtimeMapPartialRoom_(raw);
      if (mapped?.roomNo && mapped?.site) dbMap.set(`${mapped.site}|${mapped.roomNo}`, mapped);
    });

    const rooms = state.indicator.data.rooms || [];
    const touched = [];
    rooms.forEach((current, index) => {
      const dbRoom = dbMap.get(`${current.site}|${current.roomNo}`);
      if (!dbRoom) return;
      const before = novaRealtimeRoomSignature_(current);
      const merged = novaRealtimeMergeRoom_(current, dbRoom);
      if (before === novaRealtimeRoomSignature_(merged)) return;
      rooms[index] = merged;
      touched.push({ roomNo: merged.roomNo, site: merged.site });
    });

    touched.forEach(item => renderIndicatorRoomLocal_(item.roomNo, item.site));
    if (touched.length) renderIndicatorSummary();
    novaRealtime_.indicatorFullReconcileAt = Date.now();
    return touched.length;
  }

  async function novaRealtimeHydrateIndicatorHousemanOrders_() { // (ADMIN/ORDER 하우스맨 DB 상태 직접 보정)
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.data) return 0;
    const role = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return 0;
    const businessDate = String(state.indicator.businessDate || state.bootstrap?.app?.businessDate || '').trim();
    const sites = novaRealtimeRelevantSites_();
    if (!businessDate || !sites.length) return 0;

    const lists = await Promise.all(sites.map(site => novaRealtimeLoadHousemanOrders_(businessDate, site)
      .catch(error => { console.warn('[NOVA Realtime] 하우스맨 관리자 DB 조회 실패', site, error); return []; })));
    const orders = state.indicator.data.orders || (state.indicator.data.orders = []);
    let changed = 0;
    lists.flat().forEach(raw => {
      const mapped = novaRealtimeMapHousemanOrder_(raw);
      if (!mapped?.orderId) return;
      const index = orders.findIndex(item => String(item?.orderId || '') === mapped.orderId);
      if (index < 0) {
        mapped.__dbVersion = Number(mapped.version || 0);
        mapped.version = 0;
        mapped.rowNumber = 0;
        mapped.__sheetMirrorPending = true;
        mapped.__sheetMirrorStartedAt = Date.now();
        orders.unshift(mapped);
        changed += 1;
        return;
      }
      const previous = orders[index];
      const dbUpdatedMs = novaRealtimeUpdatedAtMs_(mapped.updatedAt);
      const previousUpdatedMs = novaRealtimeUpdatedAtMs_(previous.updatedAt);
      if (previousUpdatedMs && dbUpdatedMs && previousUpdatedMs > dbUpdatedMs) return;
      const next = Object.assign({}, previous, mapped, {
        rowNumber: Number(previous.rowNumber || 0),
        version: Number(previous.version || 0),
        __dbVersion: Number(mapped.version || 0)
      });
      if (Number(previous.rowNumber || 0) > 0) {
        delete next.__sheetMirrorPending;
        delete next.__sheetMirrorStartedAt;
      }
      const beforeSig = JSON.stringify([previous.statusCode, previous.assignedEmployeeNo, previous.processorEmployeeNo, previous.acceptedAt, previous.startedAt, previous.completedAt, previous.unableReason, previous.updatedAt]);
      const afterSig = JSON.stringify([next.statusCode, next.assignedEmployeeNo, next.processorEmployeeNo, next.acceptedAt, next.startedAt, next.completedAt, next.unableReason, next.updatedAt]);
      if (beforeSig !== afterSig) {
        orders[index] = next;
        changed += 1;
      }
    });
    if (changed) {
      orders.sort((a, b) => String(b.registeredAt || '').localeCompare(String(a.registeredAt || '')) || Number(b.rowNumber || 0) - Number(a.rowNumber || 0)); // HOUSEMAN_LATEST_FIRST_V1
      renderOrderList();
      renderIndicatorSummary();
    }
    return changed;
  }

  async function novaRealtimeHydrateIndicatorFallback_() {
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded || !state.indicator.data) return;
    if (novaRealtime_.indicatorDbBusy) return;
    const role = String(state.bootstrap?.user?.role || '').toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return;

    novaRealtime_.indicatorDbBusy = true;
    try {
      const businessDate = state.indicator.businessDate || state.bootstrap?.app?.businessDate || '';
      if (!businessDate) return;
      const query = new URLSearchParams({
        businessDate: String(businessDate),
        cursorTime: String(novaRealtime_.indicatorEventCursorTime || ''),
        cursorRequestId: String(novaRealtime_.indicatorEventCursorRequestId || ''),
        limit: '200'
      });
      const selectedSite = String(state.indicator.site || '').trim();
      if (selectedSite) query.set('site', selectedSite);

      let page = 0;
      let changedCount = 0;
      do {
        const result = await novaRealtimeRoomChangesFetch_({
          businessDate: query.get('businessDate') || '',
          cursorTime: query.get('cursorTime') || '',
          cursorRequestId: query.get('cursorRequestId') || '',
          limit: query.get('limit') || '200',
          site: query.get('site') || ''
        });
        const changes = Array.isArray(result?.changes) ? result.changes : [];
        const rooms = state.indicator.data.rooms || [];
        const touched = new Map();

        changes.forEach(change => {
          const dbRoom = novaRealtimeMapPartialRoom_(change?.room || {});
          if (!dbRoom?.roomNo || !dbRoom?.site) return;
          const index = rooms.findIndex(item => item.site === dbRoom.site && item.roomNo === dbRoom.roomNo);
          if (index < 0) return;
          const before = novaRealtimeRoomSignature_(rooms[index]);
          const merged = novaRealtimeMergeRoom_(rooms[index], dbRoom);
          if (before === novaRealtimeRoomSignature_(merged)) return;
          rooms[index] = merged;
          touched.set(`${merged.site}|${merged.roomNo}`, { roomNo: merged.roomNo, site: merged.site });
        });

        touched.forEach(item => renderIndicatorRoomLocal_(item.roomNo, item.site));
        changedCount += touched.size;
        novaRealtime_.indicatorEventCursorTime = String(result?.nextCursorTime || novaRealtime_.indicatorEventCursorTime || '');
        novaRealtime_.indicatorEventCursorRequestId = String(result?.nextCursorRequestId || '');
        query.set('cursorTime', novaRealtime_.indicatorEventCursorTime);
        query.set('cursorRequestId', novaRealtime_.indicatorEventCursorRequestId);
        page += 1;
        if (!result?.hasMore || page >= 3) break;
      } while (true);

      const housemanChanged = await novaRealtimeHydrateIndicatorHousemanOrders_();
      if (changedCount) {
        renderIndicatorSummary();
        setSyncStatus(`DB 변경확인 · ${changedCount}실 반영${housemanChanged ? ` · 오더 ${housemanChanged}건` : ''}`);
      } else if (housemanChanged) {
        setSyncStatus(`DB 변경확인 · 하우스맨 오더 ${housemanChanged}건 반영`);
      }
    } finally {
      novaRealtime_.indicatorDbBusy = false;
    }
  }

  function novaRealtimeStopIndicatorDbFallback_() {
    if (novaRealtime_.indicatorDbTimer) window.clearTimeout(novaRealtime_.indicatorDbTimer);
    novaRealtime_.indicatorDbTimer = null;
    novaRealtime_.indicatorDbBusy = false;
  }

  function novaRealtimeStartIndicatorDbFallback_() {
    novaRealtimeStopIndicatorDbFallback_();
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) return;
    const role = String(state.bootstrap?.user?.role || '').toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return;
    // ROOM_STATE_SYNC_HARDENING_V1 · 이벤트 커서만 믿지 않습니다.
    // 시작/복귀 즉시 현재 DB 전체상태를 1회 맞추고, 이후 Broadcast + 2.5초 이벤트 + 15초 전체보정을 병행합니다.
    novaRealtime_.indicatorEventCursorTime = '';
    novaRealtime_.indicatorEventCursorRequestId = '';
    novaRealtime_.indicatorFullReconcileAt = 0;
    const run = async () => {
      if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) {
        novaRealtime_.indicatorDbTimer = null;
        return;
      }
      try {
        const fullDue = !novaRealtime_.indicatorFullReconcileAt
          || Date.now() - Number(novaRealtime_.indicatorFullReconcileAt || 0) >= 15000;
        if (fullDue) {
          const fullChanged = await novaRealtimeReconcileIndicatorRooms_();
          if (fullChanged) setSyncStatus(`DB 전체확인 · ${fullChanged}실 보정`);
        }
        await novaRealtimeHydrateIndicatorFallback_();
      } catch (error) {
        console.warn('[NOVA Realtime] 관리자 DB 변경보조동기화 오류', error);
      }
      novaRealtime_.indicatorDbTimer = window.setTimeout(run, 2500);
    };
    novaRealtime_.indicatorDbTimer = window.setTimeout(run, 80);
  }

  async function novaRealtimeDisconnect_() {
    if (novaRealtime_.tokenRefreshTimer) window.clearTimeout(novaRealtime_.tokenRefreshTimer);
    novaRealtime_.tokenRefreshTimer = null;
    novaRealtimeStopIndicatorDbFallback_();
    if (novaRealtime_.supabase) {
      for (const channel of novaRealtime_.channels.values()) {
        try { await novaRealtime_.supabase.removeChannel(channel); } catch (ignore) {}
      }
    }
    novaRealtime_.channels.clear();
    novaRealtime_.supabase = null;
  }

  const novaRealtimeHousemanMirrorChains_ = new Map();

  async function novaRealtimeHousemanWorkerAction_(payload) { // (하우스맨 접수/처리 Cloud Run 전용)
    const safe = Object.assign({}, payload || {});
    const orderId = String(safe.orderId || '').trim();
    const action = String(safe.action || '').trim().toUpperCase();
    if (!orderId || !['ACCEPT', 'ACCEPT_START', 'START', 'COMPLETE', 'UNABLE', 'REOPEN'].includes(action)) {
      throw new Error('하우스맨 처리 요청을 확인하세요.');
    }
    const requestId = novaRealtimeRequestId_(`HOUSEMAN_${action}`, orderId);
    const result = await novaRealtimeFetch_(
      `/v1/houseman-orders/${encodeURIComponent(orderId)}/action`,
      {
        method: 'POST',
        headers: { 'X-Request-Id': requestId },
        body: JSON.stringify({ action, reason: String(safe.reason || ''), requestId })
      }
    );
    const mapped = novaRealtimeMapHousemanOrder_(result.order) || result.order || {};
    mapped.rowNumber = Number(safe.rowNumber || 0);
    mapped.__dbVersion = Number(result.orderVersion || result.order?.version || mapped.version || 0);
    mapped.version = Number(safe.expectedVersion || 0);
    mapped.__dbAssignmentTracked = true;
    mapped.__localProtectUntil = Date.now() + 30000;
    queueRealtimeHousemanWorkerMirror_(safe);
    return { ok: true, realtime: true, order: mapped, version: Number(safe.expectedVersion || 0), timing: result.timing || {}, requestId };
  }

  function queueRealtimeHousemanWorkerMirror_(payload) { // (동일 오더 Sheet 미러 순서 보장)
    const safe = Object.assign({}, payload || {});
    const orderId = String(safe.orderId || '').trim();
    if (!orderId) return;
    const previous = novaRealtimeHousemanMirrorChains_.get(orderId) || Promise.resolve();
    const next = previous.catch(() => null).then(() => mirrorRealtimeHousemanWorkerActionToSheet_(safe));
    novaRealtimeHousemanMirrorChains_.set(orderId, next);
    void next.finally(() => {
      if (novaRealtimeHousemanMirrorChains_.get(orderId) === next) novaRealtimeHousemanMirrorChains_.delete(orderId);
    });
  }

  async function mirrorRealtimeHousemanWorkerActionToSheet_(payload) { // (업무이력/감사 비동기 보완)
    const safe = Object.assign({}, payload || {}, { expectedVersion: 0 });
    const delays = [0, 650, 1600, 3600, 7000];
    let lastError = null;
    for (const delay of delays) {
      if (delay) await novaRealtimeSleep_(delay);
      try {
        const mirrored = await callServer('updateHousemanOrder', state.token, safe);
        if (!mirrored?.ok) throw new Error(mirrored?.message || '하우스맨 이력 동기화 실패');
        setSyncStatus(`${mirrored.order?.roomNo || ''}호 하우스맨 이력 동기화 완료`);
        return mirrored;
      } catch (error) {
        lastError = error;
      }
    }
    console.error('[NOVA Realtime] 하우스맨 상태 Sheet 미러 실패:', lastError);
    setSyncStatus(`${safe.orderId || ''} Realtime 처리 완료 · 기존 이력 동기화 재확인 필요`);
    return null;
  }

  async function syncRealtimeHousemanEditedContent_(order, attempt = 0) { // (EDIT 확정내용만 DB 보조동기화)
    if (!novaRealtimeIsEnabled_() || !order?.orderId) return null;
    const safe = {
      part: String(order.part || ''),
      items: Array.isArray(order.items) ? order.items : [],
      requester: String(order.requester || ''),
      note: String(order.note || ''),
      important: order.important === true,
      handover: order.handover === true,
      handoverTargetShift: String(order.handoverTargetShift || '')
    };
    try {
      return await novaRealtimeFetch_(
        `/v1/houseman-orders/${encodeURIComponent(String(order.orderId))}/content-sync`,
        { method: 'POST', body: JSON.stringify(safe) }
      );
    } catch (error) {
      const code = String(error?.code || '').trim().toUpperCase();
      if (Number(error?.status || 0) === 404 || code === 'HOUSEMAN_ORDER_NOT_FOUND') return null;
      if (attempt >= 2) {
        console.warn('[NOVA Realtime] 하우스맨 내용 DB 동기화 실패', error?.message || error);
        return null;
      }
      await novaRealtimeSleep_([700, 1800, 4000][attempt] || 1800);
      return syncRealtimeHousemanEditedContent_(order, attempt + 1);
    }
  }

  async function mirrorRealtimeClearAssignmentToSheet_(payload) { // (DB 배정초기화 성공 후 이력/Sheet 보조 미러)
    const safe = Object.assign({}, payload || {}, {
      action: 'CLEAR_ASSIGNMENT',
      expectedVersion: 0
    });
    delete safe.sheetExpectedVersion;
    const delays = [0, 700, 1800, 4000];
    let lastError = null;
    for (let index = 0; index < delays.length; index += 1) {
      if (delays[index]) await novaRealtimeSleep_(delays[index]);
      try {
        const mirrored = await callServer('updateRoomOperation', state.token, safe);
        if (!mirrored?.ok) throw new Error(mirrored?.message || '배정초기화 이력 동기화 실패');
        setSyncStatus(`${safe.roomNo}호 배정초기화 · 기존 이력 동기화 완료`);
        return mirrored;
      } catch (error) {
        lastError = error;
      }
    }
    console.error('[NOVA Realtime] 배정초기화 Sheet 미러 실패:', lastError);
    setSyncStatus(`${safe.roomNo}호 배정초기화 DB 완료 · 기존 이력 동기화 재확인 필요`);
    return null;
  }

  async function saveRoomActionRealtimeOrLegacy_(legacyMethod, payload) {
    const safe = Object.assign({}, payload || {});
    const rawAction = String(safe.action || '').trim().toUpperCase();
    // START/COMPLETE 명칭은 룸메이드 모바일과 하우스맨 오더가 함께 사용한다.
    // 객실 Realtime 액션으로의 변환은 룸메이드 모바일 작업에만 적용해야 한다.
    // 하우스맨 START/COMPLETE를 CLEANING_*으로 바꾸면 /v1/rooms/.../action으로 잘못 전송되어 404가 발생한다.
    const roommaidMobileOperation = legacyMethod === 'updateMobileRoomOperation';
    let mappedAction = roommaidMobileOperation && rawAction === 'START' ? 'CLEANING_START'
      : roommaidMobileOperation && rawAction === 'COMPLETE' ? 'CLEANING_COMPLETE'
      : rawAction;
    const legacySafe = Object.assign({}, safe);
    // Realtime room.version(DB)과 Sheet 마지막변경버전은 서로 다른 버전 도메인이다.
    // Apps Script legacy 경로(퇴실 포함)로 내려갈 때는 항상 별도 보존한 Sheet version을 사용한다.
    if (Number(safe.sheetExpectedVersion || 0) > 0) {
      legacySafe.expectedVersion = Number(safe.sheetExpectedVersion || 0);
    }
    delete legacySafe.sheetExpectedVersion;

    const currentRole = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
    if (roommaidMobileOperation && currentRole === 'QM' && rawAction === 'REWORK') mappedAction = 'QM_REWORK'; // QM_END_TO_END_ACCEL_V1
    const housemanWorkerAction = legacyMethod === 'updateHousemanOrder'
      && currentRole === 'HOUSEMAN'
      && ['ACCEPT', 'ACCEPT_START', 'START', 'COMPLETE', 'UNABLE'].includes(rawAction);
    if (housemanWorkerAction) {
      if (!novaRealtime_.configLoaded) await initNovaRealtime_();
      if (novaRealtimeIsEnabled_()) {
        try {
          return await novaRealtimeHousemanWorkerAction_(legacySafe);
        } catch (error) {
          const code = String(error?.code || '').trim().toUpperCase();
          if (Number(error?.status || 0) !== 404 && code !== 'HOUSEMAN_ORDER_NOT_FOUND') throw error;
          console.warn('[NOVA Realtime] DB 미존재 하우스맨 오더는 기존 경로로 처리합니다.', error?.message || error);
        }
      }
      return callServer(legacyMethod, state.token, legacySafe);
    }

    if (mappedAction === 'QM_REWORK') { // QM_REWORK_OPERATIONAL_STATUS_V1 · Cloud Run 청소상태 REWORK 경로 우회
      const directResult = await callServer(legacyMethod, state.token, legacySafe);
      if (!directResult?.ok) throw new Error(directResult?.message || '재정비 상태를 저장하지 못했습니다.');
      void callServer('syncNovaRealtimeRoomForAction', state.token, {
        businessDate: safe.businessDate,
        site: safe.site,
        roomNo: safe.roomNo,
        action: 'UPDATE_ROOM_OPERATION_STATUS'
      }).catch(syncError => {
        console.warn('[NOVA Realtime] 재정비 객실조치 DB 단건 동기화는 정기 동기화로 넘깁니다.', syncError);
      });
      return Object.assign({}, directResult, { reworkOperationalSafePath: true });
    }

    const realtimeAction = ['CLEANING_START', 'CLEANING_COMPLETE', 'CLEANING_RESET', 'ASSIGN_ROOMMAID', 'QM_ASSIGN', 'QM_START', 'QM_COMPLETE', 'QM_REWORK', 'UPDATE_ROOM_OPERATION_STATUS', 'UPDATE_OPERATION_FLAGS', 'CLEAR_ASSIGNMENT'].includes(mappedAction)
      || (mappedAction === 'CHANGE_ROOM_STATUS'
        && String(safe.roomStatus || '').trim().toUpperCase() !== 'CHECKED_OUT');

    if (!realtimeAction) {
      const retryableLegacyAction = mappedAction === 'UPDATE_ROOM_OPERATION_STATUS'
        || (mappedAction === 'CHANGE_ROOM_STATUS'
          && String(safe.roomStatus || '').trim().toUpperCase() === 'CHECKED_OUT');

      if (!retryableLegacyAction) return callServer(legacyMethod, state.token, legacySafe);

      // 고장·객실확인·퇴실은 서버가 동일상태 재요청을 멱등 처리하므로
      // Apps Script 일시적 과부하/잠금경합에 한해 짧게 자동 재시도한다.
      const delays = [0, 450, 1100];
      let lastError = null;
      for (let index = 0; index < delays.length; index += 1) {
        if (delays[index]) await wait_(delays[index] + Math.round(Math.random() * 250));
        try {
          const legacyResult = await callServer(legacyMethod, state.token, legacySafe); // LIVE_OPERATION_RETRY_RESILIENCE_V1
          if (legacyResult?.ok !== false) return legacyResult;
          if (!isTransientServerError_(legacyResult) || index === delays.length - 1) return legacyResult;
          lastError = legacyResult;
        } catch (error) {
          lastError = error;
          if (!isTransientServerError_(error) || index === delays.length - 1) throw error;
        }
      }
      if (lastError && typeof lastError === 'object' && Object.prototype.hasOwnProperty.call(lastError, 'ok')) return lastError;
      throw lastError || new Error('객실 작업 저장 오류');
    }

    // START/COMPLETE는 설정 확인이 끝나기 전 legacy Sheet 쓰기로 추락시키지 않는다.
    if (!novaRealtime_.configLoaded) await initNovaRealtime_();
    if (!novaRealtime_.configLoaded) {
      throw new Error('Realtime 설정을 확인하지 못했습니다. 잠시 후 다시 시도하세요.');
    }
    if (!novaRealtimeIsEnabled_()) {
      if (mappedAction === 'UPDATE_ROOM_OPERATION_STATUS') {
        const safeOperationalPayload = Object.assign({}, legacySafe, {
          expectedOperationalStatus: String(legacySafe?.expectedState?.operationalStatus || '')
        });
        return callServer('updateRoomOperationalStatusSafe', state.token, safeOperationalPayload);
      }
      return callServer(legacyMethod, state.token, legacySafe);
    }

    const operationalStatusReworkDirect = mappedAction === 'UPDATE_ROOM_OPERATION_STATUS'
      && String(safe.operationalStatus || '').trim().toUpperCase() === 'REWORK';
    if (operationalStatusReworkDirect) { // QM_CLEAR_REWORK_CONTROLS_V1 · 관리자 재정비 객실조치 안전경로
      const directPayload = Object.assign({}, legacySafe, {
        action: 'UPDATE_ROOM_OPERATION_STATUS',
        operationalStatus: 'REWORK',
        expectedVersion: 0,
        expectedOperationalStatus: String(safe?.expectedState?.operationalStatus || '')
      });
      delete directPayload.sheetExpectedVersion;
      const directResult = await callServer('updateRoomOperationalStatusSafe', state.token, directPayload);
      if (!directResult?.ok) throw new Error(directResult?.message || '재정비 객실조치를 저장하지 못했습니다.');
      void callServer('syncNovaRealtimeRoomForAction', state.token, {
        businessDate: safe.businessDate,
        site: safe.site,
        roomNo: safe.roomNo,
        action: 'UPDATE_ROOM_OPERATION_STATUS'
      }).catch(syncError => {
        console.warn('[NOVA Realtime] 관리자 재정비 객실조치 DB 단건 동기화는 정기 동기화로 넘깁니다.', syncError);
      });
      return Object.assign({}, directResult, { reworkOperationalSafePath: true });
    }

    const operationalStatusCompletionDirect = mappedAction === 'UPDATE_ROOM_OPERATION_STATUS'
      && !String(safe.operationalStatus || '').trim();
    if (operationalStatusCompletionDirect) {
      // 객실조치 완료는 Cloud Run 우회 · 안전경로 직접 저장
      // 화면은 이미 optimistic patch로 즉시 반영하고, 확정 저장만 안전경로 1회 호출합니다.
      const directPayload = Object.assign({}, legacySafe, {
        action: 'UPDATE_ROOM_OPERATION_STATUS',
        operationalStatus: '',
        expectedVersion: 0,
        expectedOperationalStatus: String(safe?.expectedState?.operationalStatus || '')
      });
      delete directPayload.sheetExpectedVersion;
      const directResult = await callServer('updateRoomOperationalStatusSafe', state.token, directPayload);
      if (!directResult?.ok) throw new Error(directResult?.message || '객실조치 완료를 저장하지 못했습니다.');
      void callServer('syncNovaRealtimeRoomForAction', state.token, {
        businessDate: safe.businessDate,
        site: safe.site,
        roomNo: safe.roomNo,
        action: 'UPDATE_ROOM_OPERATION_STATUS'
      }).catch(syncError => {
        console.warn('[NOVA Realtime] 객실조치 완료 후 DB 단건 재동기화는 정기 동기화로 넘깁니다.', syncError);
      });
      return Object.assign({}, directResult, { realtimeDirectSafePath: true });
    }

    delete safe.sheetExpectedVersion;
    safe.action = mappedAction;
    safe.requestId = safe.requestId || novaRealtimeRequestId_(mappedAction, safe.roomNo);
    const send = () => novaRealtimeFetch_(`/v1/rooms/${encodeURIComponent(String(safe.roomNo || ''))}/action`, {
      method: 'POST',
      headers: { 'X-Request-Id': safe.requestId },
      noRetry: mappedAction === 'UPDATE_ROOM_OPERATION_STATUS' && !String(safe.operationalStatus || '').trim(),
      timeoutMs: ['CLEANING_START', 'CLEANING_COMPLETE'].includes(mappedAction) ? 5000 : 7000, // ROOM_STATE_SYNC_HARDENING_V1
      body: JSON.stringify(safe)
    });

    let result;
    try {
      result = await send();
    } catch (error) {
      const code = String(error?.code || '').trim().toUpperCase();
      const errorStatus = Number(error?.status || 0);
      const operationalStatusCompletion = mappedAction === 'UPDATE_ROOM_OPERATION_STATUS'
        && !String(safe.operationalStatus || '').trim();

      // 객실조치 완료 Realtime 실패 · 안전경로로 자동 전환
      // 완료는 빈 상태값('')을 보내므로 Cloud Run 런타임이 5xx/네트워크 오류를 반환해도

  function setPersistentSessionToken_(token) {
    const value = String(token || '').trim();
    if (value) localStorage.setItem(NOVA_PERSISTENT_SESSION_KEY_, value);
    else localStorage.removeItem(NOVA_PERSISTENT_SESSION_KEY_);
  }

  function novaTokenExpiresAt_(token) { // (서명 검증은 서버가 담당, 클라이언트는 갱신시각 계산만)
    try {
      const body = String(token || '').split('.')[0] || '';
      if (!body) return 0;
      const base64 = body.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = window.atob(padded);
      const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
      const payload = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      return Number(payload.expiresAt || 0);
    } catch (error) {
      return 0;
    }
  }

  function schedulePersistentLoginRefresh_() { // (12시간 업무토큰 만료 30분 전 자동교체)
    if (persistentLoginRefreshTimer_) window.clearTimeout(persistentLoginRefreshTimer_);
    persistentLoginRefreshTimer_ = null;
    if (!isMobileLoginClient_() || !state.token || !persistentSessionToken_()) return;
    const expiresAt = novaTokenExpiresAt_(state.token);
    const fallbackDelay = 6 * 60 * 60 * 1000;
    const delay = expiresAt
      ? Math.max(60 * 1000, expiresAt - Date.now() - 30 * 60 * 1000)
      : fallbackDelay;
    persistentLoginRefreshTimer_ = window.setTimeout(() => {
      persistentLoginRefreshTimer_ = null;
      void refreshPersistentLogin_(false);
    }, Math.min(delay, 0x7fffffff));
  }

  async function refreshPersistentLogin_(applyBootstrap) { // (지속세션 → 새 일반 업무토큰)
    if (!isMobileLoginClient_()) return false;
    const persistentToken = persistentSessionToken_();
    if (!persistentToken) return false;
    if (persistentLoginRefreshInFlight_) return persistentLoginRefreshInFlight_;

    const task = (async () => {
      try {
        const result = await callServer('resumePersistentLogin', persistentToken, 'mobile');
        if (!result?.ok || !result.token) {
          const code = String(result?.code || '');
          if (code.startsWith('PERSISTENT_')) {

            state.token = '';

        state.token = result.token;
        localStorage.setItem('novaToken', result.token);
        if (result.persistentSessionToken) setPersistentSessionToken_(result.persistentSessionToken);

    })();
    persistentLoginRefreshInFlight_ = task;
    try { return await task; }
    finally {
      if (persistentLoginRefreshInFlight_ === task) persistentLoginRefreshInFlight_ = null;
    }
  }

  async function openMyTelegramConnection_() { // (홈 본인 텔레그램 자동연결 · TELEGRAM_SELF_CONNECT_V1)
    const button = $('homeTelegramConnectButton');
    if (!button || button.disabled) return;
    const popup = window.open('', '_blank');
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = '연결 준비 중…';

    try {
      const prepared = await callServer('prepareMyTelegramConnection', state.token);
      if (!prepared?.ok) {
        if (popup && !popup.closed) popup.close();
        throw new Error(prepared?.message || '텔레그램 연결을 준비하지 못했습니다.');
      }

      if (prepared.linked || prepared.alreadyLinked) {
        if (popup && !popup.closed) popup.close();
        state.bootstrap.user.telegramLinked = true;
        state.bootstrap.user.telegramConnectionStatus = '연결완료';
        if (state.activeMenu === 'home') renderContent('home');
        showToast(prepared.message || '텔레그램 연결이 완료되어 있습니다.');
        return;
      }

      if (!prepared.connectionLink) {
        if (popup && !popup.closed) popup.close();
        throw new Error('텔레그램 연결링크를 확인하지 못했습니다.');
      }

      if (popup && !popup.closed) {
        popup.location.replace(prepared.connectionLink);
      } else {
        // 팝업이 차단된 환경은 현재 탭에서 Telegram을 열며, 복귀 후 홈에서 상태를 다시 확인할 수 있습니다.
        window.location.href = prepared.connectionLink;
        return;
      }

      button.textContent = 'Telegram에서 START 후 자동확인 중…';
      const deadline = Date.now() + 90000;
      let linked = false;
      let lastStatus = null;

      while (Date.now() < deadline) {
        await novaRealtimeSleep_(3000);
        try {
          lastStatus = await callServer('getMyTelegramConnectionStatus', state.token);
        } catch (statusError) {
          console.warn('텔레그램 연결상태 자동확인 재시도', statusError?.message || statusError);
          continue;
        }

        if (lastStatus?.code === 'UNAUTHORIZED') {
          throw new Error(lastStatus?.message || '로그인 시간이 만료되었습니다. 다시 로그인해 주세요.');
        }
        if (lastStatus?.ok && lastStatus.linked) {
          linked = true;
          break;
        }
      }

      if (linked) {
        state.bootstrap.user.telegramLinked = true;
        state.bootstrap.user.telegramConnectionStatus = '연결완료';
        state.bootstrap.user.telegramEnabled = lastStatus?.telegramEnabled !== false;
        if (state.activeMenu === 'home') renderContent('home');
        showToast('텔레그램 연결이 완료되었습니다.');
      } else {
        showToast('자동 확인 시간이 끝났습니다. Telegram에서 START를 누른 뒤 홈에서 다시 확인해 주세요.');
      }
    } catch (error) {
      if (popup && !popup.closed) popup.close();
      showToast(error?.message || '텔레그램 연결 중 오류가 발생했습니다.');
    } finally {
      const currentButton = $('homeTelegramConnectButton');
      if (currentButton) {
        currentButton.disabled = false;
        currentButton.textContent = originalText;
      }
    }
  }

  async function loadShiftManagement_(options = {}) { // (근무조 조회)
    if (state.shifts.loading && !options.force) return;
    state.shifts.loading = true;
    try {
      const result = await novaShiftZoneDbFirstLoad_({ // SHIFT_ZONE_DBFIRST_HOUSEMAN_UI_V1
        businessDate: state.shifts.businessDate || state.bootstrap.app.businessDate,
        site: state.shifts.site
      });
      if (!result?.ok) throw new Error(result?.message || '근무조를 불러오지 못했습니다.');
      state.shifts.loaded = true;
      state.shifts.data = result;
      state.shifts.businessDate = result.businessDate;
      state.shifts.site = result.site;
      persistShiftManagementContext_();
      state.shifts.draft = {
        A: [...(result.assignments?.A || [])],
        B: [...(result.assignments?.B || [])],
        C: [...(result.assignments?.C || [])]
      };
      // 담당동 저장값은 브라우저 세션이 아니라 서버 저장자료를 원본으로 복원합니다.
      // 재로그인처럼 sessionStorage 편집대상이 사라진 경우에도 저장된 담당동이 있는
      // 출근직원을 자동 선택해 카드가 즉시 실제 저장상태(검정색)로 표시되게 합니다.
      const attendanceStaff = result.attendanceStaff || [];
      const requestedZoneEmployee = String(state.shifts.zoneDraft.employeeNo || '').trim();
      const selectedZoneEmployee = requestedZoneEmployee && attendanceStaff.some(item => item.employeeNo === requestedZoneEmployee)
        ? requestedZoneEmployee
        : String(attendanceStaff.find(item => result.zoneAssignments?.[item.employeeNo])?.employeeNo || '').trim();
      const selectedZone = selectedZoneEmployee ? result.zoneAssignments?.[selectedZoneEmployee] : null;
      state.shifts.zoneDraft = {
        employeeNo: selectedZoneEmployee,
        buildings: selectedZone ? [...(selectedZone.buildings || [])] : []
      };
      persistShiftManagementContext_();
      if (state.activeMenu === 'shifts') renderShiftManagementData_();
      setSyncStatus(`근무조 조회 · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);
    } catch (error) {
      if ($('shiftCards')) $('shiftCards').innerHTML = `<div class="mobile-empty">${escapeHtml(error?.message || '근무조 조회 오류')}</div>`;
      showToast(error?.message || '근무조 조회 오류');
    } finally {
      state.shifts.loading = false;
    }
  }

  let novaNotificationPreviewAudio_ = null; // NOVA_NOTIFICATION_PREVIEW_CLIENT_FALLBACK_V2

  async function previewNotificationSoundLocal_(prefs = {}) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) throw new Error('이 기기는 NOVA 알림음 미리듣기를 지원하지 않습니다.');
    try {
      novaNotificationPreviewAudio_ = novaNotificationPreviewAudio_ || new AudioCtor();
      if (novaNotificationPreviewAudio_.state !== 'running') await novaNotificationPreviewAudio_.resume();
      if (novaNotificationPreviewAudio_.state !== 'running') {
        throw new Error('오디오 재생이 차단되어 있습니다. 기기 미디어 음량과 브라우저 소리 권한을 확인해 주세요.');
      }
      const type = String(prefs.soundType || 'CHIME').toUpperCase();
      const volume = Math.max(0, Math.min(100, Number(prefs.volume ?? 70)));
      if (volume <= 0) throw new Error('알림 음량이 0%입니다. 음량을 올린 뒤 다시 눌러주세요.');
      const patterns = {
        CHIME: [[659, 0, .18, 'sine'], [880, .13, .22, 'sine'], [1047, .29, .28, 'sine']],
        BELL: [[880, 0, .34, 'sine'], [1320, .02, .42, 'sine']],
        DOUBLE: [[740, 0, .18, 'triangle'], [980, .16, .22, 'triangle']],
        ALERT: [[880, 0, .16, 'square'], [880, .20, .16, 'square'], [1175, .40, .24, 'square']]
      };
      const now = novaNotificationPreviewAudio_.currentTime;
      const peak = Math.max(.008, Math.min(.36, (volume / 100) * .36));
      (patterns[type] || patterns.CHIME).forEach(([frequency, delay, length, wave]) => {
        const oscillator = novaNotificationPreviewAudio_.createOscillator();
        const gain = novaNotificationPreviewAudio_.createGain();
        oscillator.type = wave;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, now + delay);
        gain.gain.exponentialRampToValueAtTime(peak, now + delay + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, now + delay + length);
        oscillator.connect(gain);
        gain.connect(novaNotificationPreviewAudio_.destination);
        oscillator.start(now + delay);
        oscillator.stop(now + delay + length + .03);
      });
      return true;
    } catch (error) {
      if (error?.message) throw error;
      throw new Error('알림음을 재생하지 못했습니다.');
    }
  }

  function readNotificationPreferencesPanel_() {
    return {
      soundEnabled: Boolean($('novaPrefSoundEnabled')?.checked),
      soundType: String($('novaPrefSoundType')?.value || 'CHIME'),
      volume: Math.max(0, Math.min(100, Number($('novaPrefVolume')?.value || 70)))
    };

  function applyNotificationPreferencesPanel_(prefs) {
    const enabled = $('novaPrefSoundEnabled'); if (enabled) enabled.checked = prefs?.soundEnabled !== false;
    const type = $('novaPrefSoundType'); if (type) type.value = ['CHIME','BELL','DOUBLE','ALERT'].includes(String(prefs?.soundType || '').toUpperCase()) ? String(prefs.soundType).toUpperCase() : 'CHIME';
    const volume = $('novaPrefVolume'); if (volume) volume.value = String(Math.max(0, Math.min(100, Number(prefs?.volume ?? 70))));
    const output = $('novaPrefVolumeValue'); if (output) output.textContent = `${Number(volume?.value || 70)}%`;

  function openSettingsTab_(tab) { // (권한별 설정 탭 전환)
    const role = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
    const allowedTabs = role === 'ADMIN' ? ['notifications', 'operations', 'codes', 'users', 'telegram', 'archive'] : (role === 'ORDER' ? ['notifications', 'users'] : ['notifications']);
    state.settings.tab = allowedTabs.includes(tab) ? tab : allowedTabs[0];
    document.querySelectorAll('[data-settings-tab]').forEach(button => button.classList.toggle('active', button.dataset.settingsTab === state.settings.tab));
    $('settingsPanel')?.classList.remove('settings-archive-host');
    if (state.settings.tab === 'notifications') { renderNotificationPreferencesPanel_(); void loadNotificationPreferencesSettings_(); return; }
    if (state.settings.tab === 'archive') { if (role === 'ADMIN') renderArchiveSettingsPanel_(); return; }
    if (state.settings.tab === 'users') {
      renderUserAccountSettingsPanel_();
      if (state.settings.userAccountsLoaded && state.settings.userAccountsData) renderUserAccountSettingsData_();
      else loadUserAccountSettings_();
      return;
    }
    if (role !== 'ADMIN') return;
    if (state.settings.tab === 'telegram') {
      renderTelegramSettingsPanel_();
      if (state.settings.telegramLoaded && state.settings.telegramData) renderTelegramSettingsData_();
      else loadTelegramSettings_();
      return;
    }
    renderAdminSettingsData_();
  }

  async function loadAdminSettings_() { // (관리자 설정 데이터 조회)
    if (String(state.bootstrap?.user?.role || '').trim().toUpperCase() !== 'ADMIN') return;
    if (state.settings.loading) return;
    state.settings.loading = true;
    try {
      const result = await callServer('getAdminSettingsData', state.token);
      if (!result?.ok) throw new Error(result?.message || '관리자 설정을 불러오지 못했습니다.');
      state.settings.data = result;
      state.settings.loaded = true;
      if (!state.settings.selectedGroup) {
        const first = (result.groups || []).find(group => group.code !== '운영설정' && group.code !== '텔레그램알림대상');
        state.settings.selectedGroup = first?.code || '사업장';
      }
      if (state.activeMenu === 'settings' && !['telegram', 'users'].includes(state.settings.tab)) renderAdminSettingsData_();
    } catch (error) {
      if ($('settingsPanel')) $('settingsPanel').innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '관리자 설정 조회 오류')}</div>`;
      showToast(error?.message || '관리자 설정 조회 오류');
    } finally {
      state.settings.loading = false;
    }
  }

          <div class="settings-card-heading"><div><small>업무 운영 기준</small><h2>시간·정비수·자동마감</h2></div><button id="operationSettingsSave" class="primary-button" type="button">설정 저장</button></div>

          <div class="settings-card-heading"><div><small>Apps Script 설치형 트리거</small><h2>자동 실행 상태</h2></div><button id="automaticCloseTest" class="secondary-button" type="button">자동마감 지금 시험</button></div>
          <div class="trigger-status-grid">
            ${renderTriggerStatusCard_('퇴실지연 점검', trigger.departureDelay)}

            <span>실행시각 ${escapeHtml(autoClose.closeTime || '-')} · 실패 알림 ${autoClose.notifyFailure ? '사용' : '미사용'}</span>
            ${autoClose.lastFailure ? `<small>마지막 오류: ${escapeHtml(autoClose.lastFailure)}</small>` : ''}

        </section>
      </div>`;

    $('automaticCloseTest').addEventListener('click', runAutomaticCloseTest_);

  function renderOperationSettingField_(definition, value) { // (운영설정 입력필드)
    const code = escapeAttr(definition.code);
    const safeValue = String(value ?? definition.defaultValue ?? '');
    let input = '';
    if (definition.type === 'yesno') {
      input = `<select id="operation_${code}"><option value="Y"${safeValue === 'Y' ? ' selected' : ''}>사용</option><option value="N"${safeValue !== 'Y' ? ' selected' : ''}>사용 안 함</option></select>`;
    } else if (definition.type === 'select') {
      input = `<select id="operation_${code}">${(definition.options || []).map(option => `<option value="${escapeAttr(option)}"${String(option) === safeValue ? ' selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select>`;
    } else {
      const attrs = definition.type === 'number' ? `min="${definition.min}" max="${definition.max}" step="${definition.step || 1}"` : '';
      input = `<input id="operation_${code}" type="${definition.type === 'time' ? 'time' : 'number'}" value="${escapeAttr(safeValue)}" ${attrs}>`;
    }
    return `<label class="operation-setting-field"><span>${escapeHtml(definition.label)}</span>${input}<small>${escapeHtml(definition.note || '')}</small></label>`;
  }

  function renderTriggerStatusCard_(label, info) { // (트리거 상태 카드)
    const active = Number(info?.count || 0) > 0;
    return `<div class="trigger-status-item ${active ? 'active' : 'inactive'}"><span>${escapeHtml(label)}</span><strong>${active ? '정상' : '미설치'}</strong><small>${active ? `${Number(info.intervalMinutes || 0)}분 간격` : '설정 저장으로 복구'}</small></div>`;
  }

  async function saveOperationSettings_() { // (운영설정 저장)
    const button = $('operationSettingsSave');
    const definitions = state.settings.data?.operationDefinitions || [];
    const values = {};
    definitions.forEach(def => { values[def.code] = String($(`operation_${def.code}`)?.value ?? '').trim(); });
    button.disabled = true;
    button.textContent = '저장 중…';
    try {
      const result = await callServer('saveAdminOperationSettings', state.token, { values });
      if (!result?.ok) throw new Error(result?.message || '운영 설정을 저장하지 못했습니다.');
      showToast(result.message || '운영 설정을 저장했습니다.');
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '운영 설정 저장 오류');
    } finally {
      button.disabled = false;
      button.textContent = '설정 저장';
    }
  }

  async function runAutomaticCloseTest_() { // (관리자 자동마감 즉시 시험)
    const button = $('automaticCloseTest');
    if (!window.confirm('현재 업무일자의 미마감 사업장을 지금 마감할까요?')) return;
    button.disabled = true;
    button.textContent = '실행 중…';
    try {
      const result = await callServer('runAutomaticDailyCloseNow', state.token);
      showToast(result.message || (result.skipped ? `자동마감 생략: ${result.reason}` : '자동마감을 실행했습니다.'));
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '자동마감 시험 오류');
    } finally {
      button.disabled = false;
      button.textContent = '자동마감 지금 시험';
    }
  }

  function renderCodeManagementPanel_() { // (코드·명칭·목록 관리)
    const groups = (state.settings.data?.groups || []).filter(group => group.code !== '운영설정');
    const selected = groups.find(group => group.code === state.settings.selectedGroup) || groups[0];

      $('settingsPanel').innerHTML = '<div class="settings-loading">관리할 코드그룹이 없습니다.</div>';

    $('settingsPanel').innerHTML = `
      <section class="settings-card code-management-card">
        <div class="settings-card-heading">

          <label class="code-group-select"><span>관리항목</span><select id="adminCodeGroup">${groups.map(group => `<option value="${escapeAttr(group.code)}"${group.code === selected.code ? ' selected' : ''}>${escapeHtml(group.label)}</option>`).join('')}</select></label>

  function renderAdminCodeRows_(group) { // (코드관리 행 렌더링)
    const items = group.items || [];
    if (!items.length) return '<tr><td colspan="6" class="table-empty">등록된 항목이 없습니다.</td></tr>';
    return items.map(item => `<tr data-code-row="${escapeAttr(item.code)}" class="${item.enabled === 'Y' ? '' : 'disabled-row'}">
      <td><strong>${escapeHtml(item.code)}</strong>${item.protected ? '<small>필수코드</small>' : ''}</td>
      <td><input class="code-label-input" value="${escapeAttr(item.label)}"></td>

      <td><select class="code-enabled-input"${item.protected ? ' disabled' : ''}><option value="Y"${item.enabled === 'Y' ? ' selected' : ''}>사용</option><option value="N"${item.enabled !== 'Y' ? ' selected' : ''}>중지</option></select></td>
      <td><input class="code-note-input" value="${escapeAttr(item.note || '')}"></td>
      <td><div class="code-row-actions"><button type="button" data-save-code="${escapeAttr(item.code)}">저장</button>${!item.protected && item.enabled === 'Y' ? `<button type="button" class="danger" data-disable-code="${escapeAttr(item.code)}">중지</button>` : ''}</div></td>
    </tr>`).join('');
