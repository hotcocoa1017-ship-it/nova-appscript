</style>
<script>
(() => {
  'use strict';

  /* =========================
   * NOVA Realtime Phase 1 v3.3 FINAL
   * - 청소시작/청소완료: Cloud Run + PostgreSQL
   * - 관리자 인디케이터: Supabase Broadcast + PostgreSQL 이벤트 경량조회 이중화
   * - 기존 Sheet Delta는 하우스맨/QM 등 미전환 기능 때문에 유지
   * - Realtime 관리 객실 필드는 Sheet Delta가 덮어쓰지 못하게 보호
   * ========================= */
  const novaRealtime_ = {
    enabled: false,
    apiBase: '',
    supabase: null,
    channels: new Map(),
    tokenRefreshTimer: null,
    configLoaded: false,
    indicatorDbTimer: null,
    indicatorDbBusy: false,
    indicatorEventCursorTime: '',
    indicatorEventCursorRequestId: ''
  };

  const NOVA_REALTIME_ROOM_FIELDS_ = Object.freeze([
    // Phase 1 Realtime owns cleaning progress and DB version metadata only.
    // 객실상태/배정/객실운영상태(고장·객실확인)는 기존 Sheets가 원본이므로
    // PostgreSQL의 지연·빈 값으로 덮어쓰지 않습니다.
    'cleaningStatus', 'version', 'updatedAt'
  ]);

  function novaRealtimeIsEnabled_() {
    return Boolean(novaRealtime_.enabled && novaRealtime_.apiBase);
  }

  function novaRealtimeSleep_(ms) {
    return new Promise(resolve => window.setTimeout(resolve, Math.max(0, Number(ms || 0))));
  }

  function novaRealtimeRequestId_(action, roomNo) {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
    return `NOVA-${Date.now()}-${String(action || '')}-${String(roomNo || '')}-${Math.random().toString(36).slice(2)}`;
  }

  async function novaRealtimeFetch_(path, options = {}, attempt = 0) {
    const response = await fetch(`${novaRealtime_.apiBase}${path}`, {
      method: options.method || 'GET',
      headers: Object.assign({
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.token}`
      }, options.headers || {}),
      body: options.body
    }).catch(error => {
      if (attempt < 2) return null;
      throw error;
    });

    if (!response) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeFetch_(path, options, attempt + 1);
    }

    let data = {};
    try { data = await response.json(); } catch (ignore) {}

    if (response.ok && data?.ok) return data;

    const retryable = response.status === 429 || response.status >= 500;
    if (retryable && attempt < 2) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeFetch_(path, options, attempt + 1);
    }

    const error = new Error(data?.message || `Realtime API 오류 (${response.status})`);
    error.code = data?.code || '';
    error.status = response.status;
    error.currentRoom = data?.currentRoom || null;
    throw error;
  }

  async function novaRealtimeRoomChangesFetch_(payload, attempt = 0) {
    const form = new URLSearchParams();
    Object.entries(payload || {}).forEach(([key, value]) => {
      form.set(key, value == null ? '' : String(value));
    });
    form.set('token', String(state.token || ''));

    const response = await fetch(`${novaRealtime_.apiBase}/v1/room-changes`, {
      method: 'POST',
      body: form
    }).catch(error => {
      if (attempt < 2) return null;
      throw error;
    });

    if (!response) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeRoomChangesFetch_(payload, attempt + 1);
    }

    let data = {};
    try { data = await response.json(); } catch (ignore) {}
    if (response.ok && data?.ok) return data;

    const retryable = response.status === 429 || response.status >= 500;
    if (retryable && attempt < 2) {
      await novaRealtimeSleep_([160, 420, 800][attempt] || 800);
      return novaRealtimeRoomChangesFetch_(payload, attempt + 1);
    }

    const error = new Error(data?.message || data?.error || `Realtime 변경조회 실패 (${response.status})`);
    error.status = response.status;
    error.code = data?.code || '';
    error.data = data;
    throw error;
  }

  async function initNovaRealtime_() { // (API 설정과 보조 Realtime 연결을 분리해 고속 API 유지)
    if (!state.token) return false;
    if (!novaRealtime_.configLoaded) {
      try {
        const config = await callServer('getNovaRealtimeClientConfig', state.token);
        novaRealtime_.configLoaded = true;
        novaRealtime_.enabled = Boolean(config?.ok && config?.enabled && config?.apiBase);
        novaRealtime_.apiBase = String(config?.apiBase || '').replace(/\/+$/, '');
      } catch (error) {
        novaRealtime_.configLoaded = false;
        novaRealtime_.enabled = false;
        novaRealtime_.apiBase = '';
        console.error('[NOVA Realtime] 설정조회 실패:', error);
        setSyncStatus(`Realtime 연결 재시도 · ${error?.message || '설정 조회 오류'}`);
        return false;
      }
    }
    if (!novaRealtimeIsEnabled_()) return false;

    try {
      await novaRealtimeHydrateCurrentView_();
      const role = String(state.bootstrap?.user?.role || '').toUpperCase();
      if (['ADMIN', 'ORDER'].includes(role) && state.activeMenu === 'indicator') {
        try {
          await novaRealtimeEnsureSubscriptions_();
        } catch (subscriptionError) {
          console.warn('[NOVA Realtime] 구독 연결 실패 · DB 변경조회로 보조합니다.', subscriptionError);
        }
        novaRealtimeStartIndicatorDbFallback_();
        setSyncStatus('Realtime 관리자 연결 준비 완료');
      } else {
        setSyncStatus('고속 API 연결 준비 완료');
      }
    } catch (error) {
      // 화면 수화/구독 오류가 있어도 Cloud Run 고속 API 자체는 비활성화하지 않습니다.
      console.warn('[NOVA Realtime] 보조 연결 초기화 오류 · 고속 API는 유지합니다.', error);
      const role = String(state.bootstrap?.user?.role || '').toUpperCase();
      if (['ADMIN', 'ORDER'].includes(role) && state.activeMenu === 'indicator') novaRealtimeStartIndicatorDbFallback_();
      setSyncStatus('고속 API 연결 준비 완료 · Realtime 보조 연결 재시도');
    }
    return true;
  }

  function novaRealtimeMapRow_(row) {
    if (!row) return null;
    return {
      businessDate: String(row.business_date || row.businessDate || ''),
      site: String(row.site || ''),
      roomNo: String(row.room_no || row.roomNo || ''),
      building: String(row.building || ''),
      roomStatus: String(row.room_status ?? row.roomStatus ?? ''),
      cleaningStatus: String(row.cleaning_status ?? row.cleaningStatus ?? ''),
      cleaningType: String(row.cleaning_type ?? row.cleaningType ?? 'NORMAL'),
      assignmentType: String(row.assignment_type ?? row.assignmentType ?? 'SOLO'),
      roommaidEmployeeNo: String(row.roommaid_employee_no ?? row.roommaidEmployeeNo ?? ''),
      secondaryRoommaidEmployeeNo: String(row.secondary_roommaid_employee_no ?? row.secondaryRoommaidEmployeeNo ?? ''),
      qmEmployeeNo: String(row.qm_employee_no ?? row.qmEmployeeNo ?? ''),
      operationalStatus: String(row.operational_status ?? row.operationalStatus ?? ''),
      version: Number(row.version || 0),
      updatedAt: row.updated_at || row.updatedAt || ''
    };
  }

  function novaRealtimeMapPartialRoom_(row) {
    if (!row) return null;
    const mapped = {
      businessDate: String(row.business_date || row.businessDate || ''),
      site: String(row.site || ''),
      roomNo: String(row.room_no || row.roomNo || '')
    };
    const hasOwn = key => Object.prototype.hasOwnProperty.call(row, key);
    const putText = (target, snake, camel) => {
      if (!hasOwn(snake) && !hasOwn(camel)) return;
      mapped[target] = String(row[snake] ?? row[camel] ?? '');
    };
    putText('roomStatus', 'room_status', 'roomStatus');
    putText('cleaningStatus', 'cleaning_status', 'cleaningStatus');
    putText('cleaningType', 'cleaning_type', 'cleaningType');
    putText('assignmentType', 'assignment_type', 'assignmentType');
    putText('roommaidEmployeeNo', 'roommaid_employee_no', 'roommaidEmployeeNo');
    putText('secondaryRoommaidEmployeeNo', 'secondary_roommaid_employee_no', 'secondaryRoommaidEmployeeNo');
    putText('qmEmployeeNo', 'qm_employee_no', 'qmEmployeeNo');
    putText('operationalStatus', 'operational_status', 'operationalStatus');
    if (hasOwn('version')) mapped.version = Number(row.version || 0);
    if (hasOwn('updated_at') || hasOwn('updatedAt')) mapped.updatedAt = row.updated_at || row.updatedAt || '';
    if (hasOwn('building') && row.building) mapped.building = String(row.building);
    return mapped;
  }

  function novaRealtimeMergeRoom_(legacyRoom, realtimeRoom) {
    if (!legacyRoom) return realtimeRoom ? Object.assign({}, realtimeRoom) : legacyRoom;
    if (!realtimeRoom) return legacyRoom;
    const merged = Object.assign({}, legacyRoom);
    NOVA_REALTIME_ROOM_FIELDS_.forEach(key => {
      if (Object.prototype.hasOwnProperty.call(realtimeRoom, key)) merged[key] = realtimeRoom[key];
    });
    if (realtimeRoom.building) merged.building = realtimeRoom.building;
    return merged;
  }

  function novaRealtimeProtectRoomArray_(incomingRooms, currentRooms) {
    if (!novaRealtimeIsEnabled_() || !Array.isArray(incomingRooms) || !Array.isArray(currentRooms)) return incomingRooms;
    const current = new Map(currentRooms.map(room => [`${room.site}|${room.roomNo}`, room]));
    return incomingRooms.map(room => {
      const previous = current.get(`${room.site}|${room.roomNo}`);
      return previous ? novaRealtimeMergeRoom_(room, previous) : room;
    });
  }

  function novaRealtimeRelevantSites_() {
    if (!state.bootstrap) return [];
    const role = String(state.bootstrap.user?.role || '').toUpperCase();
    if (state.activeMenu === 'indicator' && ['ADMIN', 'ORDER'].includes(role)) {
      const selected = String(state.indicator.site || '').trim();
      if (selected) return [selected];
      return [...new Set((state.indicator.data?.sites || []).map(String).map(v => v.trim()).filter(Boolean))];
    }
    // 무료모드: ROOMMAID는 Realtime 상시 연결을 만들지 않습니다.
    // 다만 현재 배정객실의 DB 상태를 화면 진입/30초 저빈도 조회로 hydrate 합니다.
    if (state.activeMenu === 'cleaning' && role === 'ROOMMAID') {
      const selected = String(state.mobile.site || '').trim();
      if (selected) return [selected];
      return [...new Set([
        ...(state.mobile.data?.sites || []),
        String(state.bootstrap.user?.defaultSite || '').trim()
      ].map(String).map(v => v.trim()).filter(Boolean))];
    }
    return [];
  }

  async function novaRealtimeLoadRoomsForSite_(businessDate, site) {
    if (!businessDate || !site) return [];
    const query = new URLSearchParams({ businessDate: String(businessDate), site: String(site) });
    const result = await novaRealtimeFetch_(`/v1/rooms?${query.toString()}`);
    return Array.isArray(result.rooms) ? result.rooms : [];
  }

  async function novaRealtimeHydrateCurrentView_() {
    if (!novaRealtimeIsEnabled_() || !state.bootstrap) return;
    const role = String(state.bootstrap.user?.role || '').toUpperCase();

    if (state.activeMenu === 'indicator' && ['ADMIN', 'ORDER'].includes(role) && state.indicator.data) {
      const sites = novaRealtimeRelevantSites_();
      const lists = await Promise.all(sites.map(site =>
        novaRealtimeLoadRoomsForSite_(state.indicator.businessDate || state.bootstrap.app.businessDate, site)
          .catch(error => { console.error('[NOVA Realtime] 객실 조회 실패', site, error); return []; })
      ));
      const realtimeMap = new Map(lists.flat().map(room => [`${room.site}|${room.roomNo}`, room]));
      state.indicator.data.rooms = (state.indicator.data.rooms || []).map(room =>
        novaRealtimeMergeRoom_(room, realtimeMap.get(`${room.site}|${room.roomNo}`))
      );
      if (!isHousemanItemEditorOpen_()) renderIndicatorData();
      return;
    }

    if (state.activeMenu === 'cleaning' && role === 'ROOMMAID' && state.mobile.data) {
      const sites = novaRealtimeRelevantSites_();
      const lists = await Promise.all(sites.map(site =>
        novaRealtimeLoadRoomsForSite_(state.mobile.businessDate || state.bootstrap.app.businessDate, site)
          .catch(error => { console.error('[NOVA Realtime] 모바일 객실 조회 실패', site, error); return []; })
      ));
      const realtimeMap = new Map(lists.flat().map(room => [`${room.site}|${room.roomNo}`, room]));
      state.mobile.data.rooms = (state.mobile.data.rooms || []).map(room =>
        novaRealtimeMergeRoom_(room, realtimeMap.get(`${room.site}|${room.roomNo}`))
      );
      renderMobileData();
    }
  }

  async function novaRealtimeGetAuth_() {
    return novaRealtimeFetch_('/v1/auth/realtime-token', { method: 'POST', body: '{}' });
  }

  async function novaRealtimeEnsureClient_() {
    if (!window.supabase?.createClient) throw new Error('Supabase Realtime 라이브러리를 불러오지 못했습니다.');
    const auth = await novaRealtimeGetAuth_();

    if (!novaRealtime_.supabase) {
      novaRealtime_.supabase = window.supabase.createClient(auth.supabaseUrl, auth.publishableKey, {
        auth: { persistSession: false, autoRefreshToken: false }
      });
    }
    novaRealtime_.supabase.realtime.setAuth(auth.token);

    if (novaRealtime_.tokenRefreshTimer) window.clearTimeout(novaRealtime_.tokenRefreshTimer);
    novaRealtime_.tokenRefreshTimer = window.setTimeout(async () => {
      try {
        if (!novaRealtimeIsEnabled_() || !state.token || !novaRealtime_.supabase) return;
        const next = await novaRealtimeGetAuth_();
        novaRealtime_.supabase.realtime.setAuth(next.token);
        await novaRealtimeEnsureSubscriptions_();
      } catch (error) {
        console.error('[NOVA Realtime] 토큰 갱신 실패:', error);
      }
    }, 10 * 60 * 1000);
  }

  async function novaRealtimeEnsureSubscriptions_() {
    if (!novaRealtimeIsEnabled_()) return;
    const sites = novaRealtimeRelevantSites_();
    if (!sites.length) return;

    await novaRealtimeEnsureClient_();

    const wanted = new Set(sites);
    for (const [site, channel] of novaRealtime_.channels.entries()) {
      if (wanted.has(site)) continue;
      try { await novaRealtime_.supabase.removeChannel(channel); } catch (ignore) {}
      novaRealtime_.channels.delete(site);
    }

    for (const site of sites) {
      if (novaRealtime_.channels.has(site)) continue;
      const topic = `nova:site:${site}:rooms`;
      const channel = novaRealtime_.supabase
        .channel(topic, { config: { private: true } })
        .on('broadcast', { event: 'UPDATE' }, payload => novaRealtimeHandleBroadcast_(payload))
        .on('broadcast', { event: 'INSERT' }, payload => {
          novaRealtimeHandleBroadcast_(payload);
          novaRealtimeHandleHousemanOrderBroadcast_(payload);
        })
        .subscribe((status, error) => {
          if (error) console.error(`[NOVA Realtime] ${site} 구독 오류`, error);
          if (status === 'SUBSCRIBED') setSyncStatus(`Realtime 연결 · ${site}`);
        });
      novaRealtime_.channels.set(site, channel);
    }

    // Broadcast 유실/지연과 관계없이 관리자 화면은 DB를 직접 확인하는 보조 경로를 유지한다.
    novaRealtimeStartIndicatorDbFallback_();
  }

  function novaRealtimeBroadcastRow_(payload) {
    return payload?.payload?.new
      || payload?.payload?.record
      || payload?.new
      || payload?.record
      || null;
  }

  function novaRealtimeHandleBroadcast_(payload) {
    const raw = novaRealtimeBroadcastRow_(payload);
    // 같은 Realtime 채널을 공유하는 하우스맨 INSERT는 객실 변경으로 해석하지 않습니다.
    if (raw && (raw.order_id || raw.orderId)) return;
    const room = novaRealtimeMapRow_(raw);
    if (!room?.roomNo || !room?.site) return;

    const indicatorRooms = state.indicator.data?.rooms || [];
    const indicatorIndex = indicatorRooms.findIndex(item => item.site === room.site && item.roomNo === room.roomNo);
    if (indicatorIndex >= 0) {
      indicatorRooms[indicatorIndex] = novaRealtimeMergeRoom_(indicatorRooms[indicatorIndex], room);
      if (state.activeMenu === 'indicator') {
        renderIndicatorRoomLocal_(room.roomNo, room.site);
        renderIndicatorSummary();
      }
    }

    const mobileRooms = state.mobile.data?.rooms || [];
    const mobileIndex = mobileRooms.findIndex(item => item.site === room.site && item.roomNo === room.roomNo);
    if (mobileIndex >= 0) {
      mobileRooms[mobileIndex] = novaRealtimeMergeRoom_(mobileRooms[mobileIndex], room);
      if (state.activeMenu === 'cleaning' && state.mobile.data?.role === 'ROOMMAID') {
        refreshRoommaidMobileSummaryLocal_();
        renderMobileSummary();
        renderMobileList();
      }
    }
    setSyncStatus(`${room.roomNo}호 실시간 반영`);
  }

  function novaRealtimeOrderDateTimeText_(value) { // (DB timestamptz -> 기존 화면 날짜형식)
    if (!value) return '';
    const text = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(text)) return text;
    const date = value instanceof Date ? value : new Date(value);
    if (Number.isNaN(date.getTime())) return String(value || '');
    try {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, hourCycle: 'h23'
      }).formatToParts(date).reduce((acc, part) => { acc[part.type] = part.value; return acc; }, {});
      return `${parts.year}-${parts.month}-${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
    } catch (ignore) {
      return String(value || '');
    }
  }

  function novaRealtimeHousemanStatusLabel_(statusCode) { // (기존 NOVA.ORDER_STATUS 표시명 유지)
    const labels = {
      REGISTERED: '등록', ASSIGNED: '배정', ACCEPTED: '접수',
      PROCESSING: '처리중', COMPLETED: '완료', UNABLE: '처리불가'
    };
    const code = String(statusCode || '').trim().toUpperCase();
    return labels[code] || code || '-';
  }

  function novaRealtimeMapHousemanOrder_(row) { // (Realtime DB 오더 -> 기존 화면 오더 객체)
    if (!row || !(row.order_id || row.orderId)) return null;
    const statusCode = String(row.status_code ?? row.statusCode ?? 'REGISTERED').trim().toUpperCase();
    const candidateNames = Array.isArray(row.route_candidate_names ?? row.routeCandidateNames)
      ? (row.route_candidate_names ?? row.routeCandidateNames).map(String)
      : [];
    return {
      rowNumber: 0,
      orderId: String(row.order_id ?? row.orderId ?? ''),
      businessDate: String(row.business_date ?? row.businessDate ?? '').slice(0, 10),
      site: String(row.site ?? ''),
      roomNo: String(row.room_no ?? row.roomNo ?? ''),
      part: String(row.part ?? ''),
      items: Array.isArray(row.items) ? row.items : [],
      itemSummary: String(row.item_summary ?? row.itemSummary ?? ''),
      quantity: Number(row.quantity || 0),
      note: String(row.note ?? ''),
      requester: String(row.requester ?? ''),
      assignedEmployeeNo: String(row.assigned_employee_no ?? row.assignedEmployeeNo ?? ''),
      assignedName: String(row.assigned_name ?? row.assignedName ?? ''),
      processorEmployeeNo: String(row.processor_employee_no ?? row.processorEmployeeNo ?? ''),
      processorName: String(row.processor_name ?? row.processorName ?? ''),
      statusCode,
      statusLabel: String(row.status_label ?? row.statusLabel ?? '') || novaRealtimeHousemanStatusLabel_(statusCode),
      important: row.important === true,
      handover: row.handover === true,
      handoverTargetShift: String(row.handover_target_shift ?? row.handoverTargetShift ?? '').toUpperCase(),
      assignmentMode: String(row.assignment_mode ?? row.assignmentMode ?? 'UNASSIGNED').toUpperCase(),
      autoAssigned: row.auto_assigned === true || row.autoAssigned === true,
      assignedBuilding: String(row.assigned_building ?? row.assignedBuilding ?? ''),
      assignedShiftCode: String(row.assigned_shift_code ?? row.assignedShiftCode ?? '').toUpperCase(),
      assignedShiftCodes: Array.isArray(row.assigned_shift_codes ?? row.assignedShiftCodes) ? (row.assigned_shift_codes ?? row.assignedShiftCodes) : [],
      routeCandidateEmployeeNos: Array.isArray(row.route_candidate_employee_nos ?? row.routeCandidateEmployeeNos) ? (row.route_candidate_employee_nos ?? row.routeCandidateEmployeeNos).map(String) : [],
      routeCandidateNames: candidateNames,
      routeCandidateSummary: candidateNames.join(' · '),
      routeLocked: (row.route_locked ?? row.routeLocked) !== false,
      acceptedByEmployeeNo: String(row.accepted_by_employee_no ?? row.acceptedByEmployeeNo ?? ''),
      releasedCandidateEmployeeNos: Array.isArray(row.released_candidate_employee_nos ?? row.releasedCandidateEmployeeNos) ? (row.released_candidate_employee_nos ?? row.releasedCandidateEmployeeNos).map(String) : [],
      registeredBy: String(row.registered_by ?? row.registeredBy ?? ''),
      registeredAt: novaRealtimeOrderDateTimeText_(row.registered_at ?? row.registeredAt),
      acceptedAt: novaRealtimeOrderDateTimeText_(row.accepted_at ?? row.acceptedAt),
      startedAt: novaRealtimeOrderDateTimeText_(row.started_at ?? row.startedAt),
      completedAt: novaRealtimeOrderDateTimeText_(row.completed_at ?? row.completedAt),
      unableReason: String(row.unable_reason ?? row.unableReason ?? ''),
      updatedAt: novaRealtimeOrderDateTimeText_(row.updated_at ?? row.updatedAt),
      version: Number(row.version || 0),
      __sheetMirrorPending: true,
      __localProtectUntil: Date.now() + 30000
    };
  }

  function novaRealtimeHandleHousemanOrderBroadcast_(payload) { // (관리자간 신규 오더 즉시 전파)
    if (state.activeMenu !== 'indicator' || !state.indicator.data) return;

  function novaRealtimeRoomSignature_(room) {
    if (!room) return '';
    return JSON.stringify(NOVA_REALTIME_ROOM_FIELDS_.map(key => room[key] ?? ''));

  async function novaRealtimeHydrateIndicatorFallback_() {
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded || !state.indicator.data) return;
    if (novaRealtime_.indicatorDbBusy) return;
    const role = String(state.bootstrap?.user?.role || '').toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return;

    novaRealtime_.indicatorDbBusy = true;
    try {
      const businessDate = state.indicator.businessDate || state.bootstrap?.app?.businessDate || '';
      if (!businessDate) return;
      const query = new URLSearchParams({
        businessDate: String(businessDate),
        cursorTime: String(novaRealtime_.indicatorEventCursorTime || ''),
        cursorRequestId: String(novaRealtime_.indicatorEventCursorRequestId || ''),
        limit: '200'
      });
      const selectedSite = String(state.indicator.site || '').trim();
      if (selectedSite) query.set('site', selectedSite);

      let page = 0;
      let changedCount = 0;
      do {
        const result = await novaRealtimeRoomChangesFetch_({
          businessDate: query.get('businessDate') || '',
          cursorTime: query.get('cursorTime') || '',
          cursorRequestId: query.get('cursorRequestId') || '',
          limit: query.get('limit') || '200',
          site: query.get('site') || ''
        });
        const changes = Array.isArray(result?.changes) ? result.changes : [];
        const rooms = state.indicator.data.rooms || [];
        const touched = new Map();

        changes.forEach(change => {
          const dbRoom = novaRealtimeMapPartialRoom_(change?.room || {});
          if (!dbRoom?.roomNo || !dbRoom?.site) return;
          const index = rooms.findIndex(item => item.site === dbRoom.site && item.roomNo === dbRoom.roomNo);
          if (index < 0) return;
          const before = novaRealtimeRoomSignature_(rooms[index]);
          const merged = novaRealtimeMergeRoom_(rooms[index], dbRoom);
          if (before === novaRealtimeRoomSignature_(merged)) return;
          rooms[index] = merged;
          touched.set(`${merged.site}|${merged.roomNo}`, { roomNo: merged.roomNo, site: merged.site });
        });

        touched.forEach(item => renderIndicatorRoomLocal_(item.roomNo, item.site));
        changedCount += touched.size;
        novaRealtime_.indicatorEventCursorTime = String(result?.nextCursorTime || novaRealtime_.indicatorEventCursorTime || '');
        novaRealtime_.indicatorEventCursorRequestId = String(result?.nextCursorRequestId || '');
        query.set('cursorTime', novaRealtime_.indicatorEventCursorTime);
        query.set('cursorRequestId', novaRealtime_.indicatorEventCursorRequestId);
        page += 1;
        if (!result?.hasMore || page >= 3) break;
      } while (true);

      if (changedCount) {
        renderIndicatorSummary();
        setSyncStatus(`DB 변경확인 · ${changedCount}실 반영`);
      }
    } finally {
      novaRealtime_.indicatorDbBusy = false;
    }
  }

  function novaRealtimeStopIndicatorDbFallback_() {
    if (novaRealtime_.indicatorDbTimer) window.clearTimeout(novaRealtime_.indicatorDbTimer);
    novaRealtime_.indicatorDbTimer = null;
    novaRealtime_.indicatorDbBusy = false;
  }

  function novaRealtimeStartIndicatorDbFallback_() {
    novaRealtimeStopIndicatorDbFallback_();
    if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) return;
    const role = String(state.bootstrap?.user?.role || '').toUpperCase();
    if (!['ADMIN', 'ORDER'].includes(role)) return;
    // 화면/업무일/사업장 전환 시 새 서버커서로 시작한다. 첫 호출은 서버가 최근 15초 이벤트를 보정한다.
    novaRealtime_.indicatorEventCursorTime = '';
    novaRealtime_.indicatorEventCursorRequestId = '';
    const run = async () => {
      if (!novaRealtimeIsEnabled_() || document.hidden || state.activeMenu !== 'indicator' || !state.indicator.loaded) {
        novaRealtime_.indicatorDbTimer = null;
        return;
      }
      try { await novaRealtimeHydrateIndicatorFallback_(); } catch (error) {
        console.warn('[NOVA Realtime] 관리자 DB 변경보조동기화 오류', error);
      }
      novaRealtime_.indicatorDbTimer = window.setTimeout(run, 2500);
    };
    novaRealtime_.indicatorDbTimer = window.setTimeout(run, 800);
  }

  async function saveRoomActionRealtimeOrLegacy_(legacyMethod, payload) {
    const safe = Object.assign({}, payload || {});
    const rawAction = String(safe.action || '').trim().toUpperCase();
    const mappedAction = rawAction === 'START' ? 'CLEANING_START'
      : rawAction === 'COMPLETE' ? 'CLEANING_COMPLETE'
      : rawAction;
    const realtimeAction = ['CLEANING_START', 'CLEANING_COMPLETE'].includes(mappedAction);

    if (!realtimeAction) {
      const retryableLegacyAction = mappedAction === 'UPDATE_ROOM_OPERATION_STATUS'
        || (mappedAction === 'CHANGE_ROOM_STATUS'
          && String(safe.roomStatus || '').trim().toUpperCase() === 'CHECKED_OUT');

      if (!retryableLegacyAction) return callServer(legacyMethod, state.token, safe);

      // 고장·객실확인·퇴실은 서버가 동일상태 재요청을 멱등 처리하므로
      // Apps Script 일시적 과부하/잠금경합에 한해 짧게 자동 재시도한다.
      const delays = [0, 450, 1100];
      let lastError = null;
      for (let index = 0; index < delays.length; index += 1) {
        if (delays[index]) await wait_(delays[index] + Math.round(Math.random() * 250));
        try {
          return await callServer(legacyMethod, state.token, safe);
        } catch (error) {
          lastError = error;
          if (!isTransientServerError_(error) || index === delays.length - 1) throw error;
        }
      }
      throw lastError || new Error('객실 작업 저장 오류');
    }

    // START/COMPLETE는 설정 확인이 끝나기 전 legacy Sheet 쓰기로 추락시키지 않는다.
    if (!novaRealtime_.configLoaded) await initNovaRealtime_();
    if (!novaRealtime_.configLoaded) {
      throw new Error('Realtime 설정을 확인하지 못했습니다. 잠시 후 다시 시도하세요.');
    }
    if (!novaRealtimeIsEnabled_()) {
      return callServer(legacyMethod, state.token, safe);
    }

    safe.action = mappedAction;
    safe.requestId = safe.requestId || novaRealtimeRequestId_(mappedAction, safe.roomNo);
    const send = () => novaRealtimeFetch_(`/v1/rooms/${encodeURIComponent(String(safe.roomNo || ''))}/action`, {
      method: 'POST',
      headers: { 'X-Request-Id': safe.requestId },
      body: JSON.stringify(safe)
    });

    let result;
    try {
      result = await send();
    } catch (error) {
      const code = String(error?.code || '').trim().toUpperCase();
      if (!['ROOM_NOT_FOUND', 'FORBIDDEN', 'INVALID_STATE'].includes(code)) throw error;
      // 업무일 생성/최근 배정·QM 변경이 DB에 아직 없을 때 해당 객실만 Sheets->DB 보정 후 동일 requestId로 1회 재시도.
      await callServer('syncNovaRealtimeRoomForAction', state.token, {
        businessDate: safe.businessDate,
        site: safe.site,
        roomNo: safe.roomNo,
        action: mappedAction
      });
      result = await send();
    }
    result.version = Number(result.version || result.room?.version || 0);
    result.message = result.message || (mappedAction === 'CLEANING_START' ? '청소를 시작했습니다.' : '청소완료 처리했습니다.');
    return result;
  }

      state.token = result.token;

      applyBootstrapResult_(result.bootstrap, networkElapsed, result.performance?.elapsedMs);

        showConnectionError(result?.message || '초기 화면을 불러오지 못했습니다.');
        return;
      }
      applyBootstrapResult_(result, networkElapsed, result.performance?.elapsedMs);

    button.textContent = '연결 준비 중…';

      const result = await callServer('getMyTelegramConnectionLink', state.token);

        if (popup && !popup.closed) popup.close();
        throw new Error(result?.message || '본인 텔레그램 연결링크가 없습니다.');
      }
      if (popup && !popup.closed) {
        popup.location.replace(result.connectionLink);
      } else {
        window.location.href = result.connectionLink;
      }
    } catch (error) {
      if (popup && !popup.closed) popup.close();
      showToast(error?.message || '텔레그램 연결링크를 열지 못했습니다.');
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  }

  async function loadShiftManagement_(options = {}) { // (근무조 조회)
    if (state.shifts.loading && !options.force) return;
    state.shifts.loading = true;
    try {
      const result = await callServer('getShiftManagementData', state.token, {
        businessDate: state.shifts.businessDate || state.bootstrap.app.businessDate,
        site: state.shifts.site
      });
      if (!result?.ok) throw new Error(result?.message || '근무조를 불러오지 못했습니다.');
      state.shifts.loaded = true;
      state.shifts.data = result;
      state.shifts.businessDate = result.businessDate;
      state.shifts.site = result.site;
      state.shifts.draft = {
        A: [...(result.assignments?.A || [])],
        B: [...(result.assignments?.B || [])],
        C: [...(result.assignments?.C || [])]
      };
      const selectedZoneEmployee = state.shifts.zoneDraft.employeeNo;
      const selectedZone = selectedZoneEmployee ? result.zoneAssignments?.[selectedZoneEmployee] : null;
      state.shifts.zoneDraft = {
        employeeNo: selectedZoneEmployee && (result.attendanceStaff || []).some(item => item.employeeNo === selectedZoneEmployee) ? selectedZoneEmployee : '',
        buildings: selectedZone ? [...(selectedZone.buildings || [])] : []
      };
      if (state.activeMenu === 'shifts') renderShiftManagementData_();
      setSyncStatus(`근무조 조회 · 서버 ${result.performance?.elapsedMs ?? '-'}ms`);

      showToast(error?.message || '근무조 조회 오류');
    } finally {
      state.shifts.loading = false;
    }
  }

  function renderShiftManagementData_() { // (근무조 카드 렌더링)
    const data = state.shifts.data;
    if (!data || !$('shiftCards')) return;
    const siteSelect = $('shiftSite');
    siteSelect.innerHTML = '<option value="">사업장 선택</option>' + (data.sites || []).map(site => `<option value="${escapeAttr(site)}">${escapeHtml(site)}</option>`).join('');

      const max = Number(data.maxStaff || 10);
      if ((state.shifts.draft[code] || []).length >= max) return showToast(`${code}조는 최대 ${max}명입니다.`);
      state.shifts.draft[code].push('');
      renderShiftManagementData_();
    }));
    $('shiftCards').querySelectorAll('[data-shift-remove]').forEach(button => button.addEventListener('click', () => {
      const [code, indexText] = button.dataset.shiftRemove.split('|');

      renderShiftManagementData_();
    }));
    $('shiftCards').querySelectorAll('[data-shift-select]').forEach(select => select.addEventListener('change', () => {
      const [code, indexText] = select.dataset.shiftSelect.split('|');
      state.shifts.draft[code][Number(indexText)] = select.value;
    }));
    renderZoneAssignmentManagement_();
  }

    const selected = state.shifts.draft[shift.code] || [];

    const options = employeeNo => '<option value="">직원 선택</option>' + staff.map(user => `<option value="${escapeAttr(user.employeeNo)}"${user.employeeNo === employeeNo ? ' selected' : ''}>${escapeHtml(user.name)} (${escapeHtml(user.employeeNo)})</option>`).join('');
    return `<article class="shift-card ${state.shifts.data.currentShift === shift.code ? 'current' : ''}">
      <div class="shift-card-title"><div><strong>${escapeHtml(shift.label)}</strong><span>${escapeHtml(shift.start)}~${escapeHtml(shift.end)}</span></div><em>${selected.filter(Boolean).length}/${Number(state.shifts.data.maxStaff || 10)}</em></div>
      <div class="shift-staff-list">${rows.map((employeeNo, index) => `<div class="shift-staff-row"><span>${index + 1}</span><select data-shift-select="${shift.code}|${index}">${options(employeeNo)}</select><button type="button" data-shift-remove="${shift.code}|${index}" aria-label="삭제">×</button></div>`).join('')}</div>
      <button class="shift-add-button" type="button" data-shift-add="${shift.code}">+ 직원 추가</button>
    </article>`;

  function renderZoneAssignmentManagement_() { // (담당동 배정 편집·현황 렌더링)
    const data = state.shifts.data;
    if (!data || !$('zoneEmployeeSelect')) return;
    const attendance = data.attendanceStaff || [];
    const employeeSelect = $('zoneEmployeeSelect');
    employeeSelect.innerHTML = '<option value="">출근 직원 선택</option>' + attendance.map(item => {
      const shifts = (item.shiftLabels || []).join('·');
      return `<option value="${escapeAttr(item.employeeNo)}">${escapeHtml(item.name)} (${escapeHtml(item.employeeNo)})${shifts ? ` · ${escapeHtml(shifts)}` : ''}</option>`;
    }).join('');
    employeeSelect.value = state.shifts.zoneDraft.employeeNo || '';
    employeeSelect.onchange = () => {
      const employeeNo = employeeSelect.value;
      const existing = data.zoneAssignments?.[employeeNo];
      state.shifts.zoneDraft = {
        employeeNo,
        buildings: existing ? [...(existing.buildings || [])] : []
      };
      renderZoneAssignmentManagement_();
    };

    const selectedSet = new Set(state.shifts.zoneDraft.buildings || []);
    $('zoneBuildingCards').innerHTML = (data.buildings || []).map(building => `
      <button class="zone-building-card${selectedSet.has(building) ? ' selected' : ''}" type="button" data-zone-building="${escapeAttr(building)}">
        <strong>${escapeHtml(building)}</strong>
        <span>${selectedSet.has(building) ? '선택됨' : '선택'}</span>
      </button>`).join('');
    $('zoneBuildingCards').querySelectorAll('[data-zone-building]').forEach(button => button.addEventListener('click', () => {
      if (!state.shifts.zoneDraft.employeeNo) return showToast('출근 직원을 먼저 선택하세요.');
      const building = button.dataset.zoneBuilding;
      const draft = new Set(state.shifts.zoneDraft.buildings || []);
      if (draft.has(building)) draft.delete(building); else draft.add(building);
      state.shifts.zoneDraft.buildings = Array.from(draft).sort((a, b) => Number(a.replace(/\D/g, '')) - Number(b.replace(/\D/g, '')));
      renderZoneAssignmentManagement_();
    }));

    const staffByNo = {};
    (data.staff || []).forEach(item => { staffByNo[item.employeeNo] = item; });
    const rows = Object.values(data.zoneAssignments || {})
      .filter(item => attendance.some(user => user.employeeNo === item.employeeNo))
      .sort((a, b) => String(staffByNo[a.employeeNo]?.name || a.employeeNo).localeCompare(String(staffByNo[b.employeeNo]?.name || b.employeeNo), 'ko'));
    $('zoneAssignmentSummary').innerHTML = rows.length ? rows.map(item => {
      const staff = staffByNo[item.employeeNo] || { name: item.employeeNo };
      const shiftCodes = data.assignments ? ['A', 'B', 'C'].filter(code => (data.assignments[code] || []).includes(item.employeeNo)) : [];
      return `<div class="zone-summary-row" data-zone-summary-employee="${escapeAttr(item.employeeNo)}">
        <div><strong>${escapeHtml(staff.name)}</strong><span>${escapeHtml(item.employeeNo)} · ${escapeHtml(shiftCodes.map(code => `${code}조`).join('·') || '-')}</span></div>
        <div class="zone-summary-buildings">${(item.buildings || []).map(building => `<em>${escapeHtml(building)}</em>`).join('')}</div>
        <button type="button" data-zone-load="${escapeAttr(item.employeeNo)}">선택</button>
      </div>`;
    }).join('') : '<div class="zone-empty">등록된 담당동 배정이 없습니다.</div>';
    $('zoneAssignmentSummary').querySelectorAll('[data-zone-load]').forEach(button => button.addEventListener('click', () => {
      const employeeNo = button.dataset.zoneLoad;
      const existing = data.zoneAssignments?.[employeeNo];
      state.shifts.zoneDraft = { employeeNo, buildings: [...(existing?.buildings || [])] };
      renderZoneAssignmentManagement_();
    }));

    const hasEmployee = Boolean(state.shifts.zoneDraft.employeeNo);
    const hasExisting = hasEmployee && Boolean(data.zoneAssignments?.[state.shifts.zoneDraft.employeeNo]);
    $('zoneSaveButton').disabled = !hasEmployee || hasExisting;
    $('zoneUpdateButton').disabled = !hasExisting;
    $('zoneCancelButton').disabled = !hasExisting;
  }

  async function saveHousemanZoneAssignment_(action) { // (담당동 저장·변경·취소 실행)
    const employeeNo = state.shifts.zoneDraft.employeeNo;
    if (!state.shifts.site) return showToast('사업장을 선택하세요.');
    if (!employeeNo) return showToast('출근 직원을 선택하세요.');
    if (action !== 'CANCEL' && !(state.shifts.zoneDraft.buildings || []).length) return showToast('담당동을 한 개 이상 선택하세요.');
    const button = action === 'SAVE' ? $('zoneSaveButton') : action === 'UPDATE' ? $('zoneUpdateButton') : $('zoneCancelButton');
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = '처리 중…';
    try {
      const result = await callServer('saveHousemanZoneAssignment', state.token, {
        businessDate: state.shifts.businessDate,
        site: state.shifts.site,
        employeeNo,
        buildings: state.shifts.zoneDraft.buildings,
        action
      });
      if (!result?.ok) throw new Error(result?.message || '담당동을 처리하지 못했습니다.');
      showToast(result.message || '담당동을 처리했습니다.');
      state.shifts.zoneDraft = { employeeNo: action === 'CANCEL' ? '' : employeeNo, buildings: action === 'CANCEL' ? [] : [...(result.buildings || [])] };
      await loadShiftManagement_({ force: true });
    } catch (error) {
      showToast(error?.message || '담당동 처리 오류');
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  }

  async function saveShiftManagement_() { // (근무조 저장)
    const button = $('shiftSaveButton');
    if (!state.shifts.site) return showToast('사업장을 선택하세요.');
    button.disabled = true;
    button.textContent = '저장 중…';
    try {
      const assignments = {};
      ['A', 'B', 'C'].forEach(code => {
        assignments[code] = Array.from(new Set((state.shifts.draft[code] || []).filter(Boolean)));
      });
      const result = await callServer('saveShiftAssignments', state.token, {
        businessDate: state.shifts.businessDate,
        site: state.shifts.site,
        assignments
      });
      if (!result?.ok) throw new Error(result?.message || '근무조를 저장하지 못했습니다.');
      showToast(result.message || '근무조를 저장했습니다.');
      await loadShiftManagement_({ force: true });
    } catch (error) {
      showToast(error?.message || '근무조 저장 오류');
    } finally {
      button.disabled = false;
      button.textContent = '저장';
    }
  }

      <section class="system-settings-page">
        <div class="system-settings-header">
          <div><small>${isAdmin ? '코드 수정 없이 운영기준 관리' : '현장 직원 계정 즉시 관리'}</small><h1>시스템 설정</h1></div>
          <div id="settingsVersion" class="settings-version">NOVA ${escapeHtml(state.bootstrap?.app?.version || '')}</div>
        </div>
        <div class="settings-tabs" role="tablist">${tabs}</div>
        <div id="settingsPanel" class="settings-panel"><div class="settings-loading">${isAdmin ? '관리자 설정' : '사용자계정'}을 불러오는 중입니다.</div></div>
      </section>`;
    document.querySelectorAll('[data-settings-tab]').forEach(button => button.addEventListener('click', () => openSettingsTab_(button.dataset.settingsTab)));
  }

  function openSettingsTab_(tab) { // (권한별 설정 탭 전환)
    const role = String(state.bootstrap?.user?.role || '').trim().toUpperCase();
    const allowedTabs = role === 'ADMIN' ? ['operations', 'codes', 'users', 'telegram'] : ['users'];
    state.settings.tab = allowedTabs.includes(tab) ? tab : allowedTabs[0];
    document.querySelectorAll('[data-settings-tab]').forEach(button => button.classList.toggle('active', button.dataset.settingsTab === state.settings.tab));
    if (state.settings.tab === 'users') {
      renderUserAccountSettingsPanel_();
      if (state.settings.userAccountsLoaded && state.settings.userAccountsData) renderUserAccountSettingsData_();
      else loadUserAccountSettings_();
      return;
    }
    if (role !== 'ADMIN') return;
    if (state.settings.tab === 'telegram') {
      renderTelegramSettingsPanel_();
      if (state.settings.telegramLoaded && state.settings.telegramData) renderTelegramSettingsData_();
      else loadTelegramSettings_();
      return;
    }
    renderAdminSettingsData_();
  }

  async function loadAdminSettings_() { // (관리자 설정 데이터 조회)
    if (String(state.bootstrap?.user?.role || '').trim().toUpperCase() !== 'ADMIN') return;
    if (state.settings.loading) return;
    state.settings.loading = true;
    try {
      const result = await callServer('getAdminSettingsData', state.token);
      if (!result?.ok) throw new Error(result?.message || '관리자 설정을 불러오지 못했습니다.');
      state.settings.data = result;
      state.settings.loaded = true;
      if (!state.settings.selectedGroup) {
        const first = (result.groups || []).find(group => group.code !== '운영설정' && group.code !== '텔레그램알림대상');
        state.settings.selectedGroup = first?.code || '사업장';
      }
      if (state.activeMenu === 'settings' && !['telegram', 'users'].includes(state.settings.tab)) renderAdminSettingsData_();
    } catch (error) {
      if ($('settingsPanel')) $('settingsPanel').innerHTML = `<div class="settings-loading error">${escapeHtml(error?.message || '관리자 설정 조회 오류')}</div>`;
      showToast(error?.message || '관리자 설정 조회 오류');
    } finally {
      state.settings.loading = false;
    }
  }

  function renderAdminSettingsData_() { // (운영설정 또는 코드목록 표시)
    if (!$('settingsPanel')) return;
    if (!state.settings.loaded || !state.settings.data) {
      $('settingsPanel').innerHTML = '<div class="settings-loading">관리자 설정을 불러오는 중입니다.</div>';
      return;
    }
    if (state.settings.tab === 'codes') renderCodeManagementPanel_();
    else renderOperationSettingsPanel_();
  }

  function renderOperationSettingsPanel_() { // (퇴실기준·D/S·자동마감 설정)
    const data = state.settings.data || {};
    const values = data.operationValues || {};
    const definitions = data.operationDefinitions || [];
    const trigger = data.triggers || {};
    const autoClose = data.autoClose || {};
    $('settingsPanel').innerHTML = `
      <div class="operation-settings-layout">
        <section class="settings-card operation-form-card">
          <div class="settings-card-heading"><div><small>업무 운영 기준</small><h2>시간·정비수·자동마감</h2></div><button id="operationSettingsSave" class="primary-button" type="button">설정 저장</button></div>
          <div class="operation-setting-grid">
            ${definitions.map(def => renderOperationSettingField_(def, values[def.code])).join('')}
          </div>
        </section>
        <section class="settings-card trigger-status-card">
          <div class="settings-card-heading"><div><small>Apps Script 설치형 트리거</small><h2>자동 실행 상태</h2></div><button id="automaticCloseTest" class="secondary-button" type="button">자동마감 지금 시험</button></div>
          <div class="trigger-status-grid">
            ${renderTriggerStatusCard_('퇴실지연 점검', trigger.departureDelay)}
            ${renderTriggerStatusCard_('일일 자동마감', trigger.automaticClose)}
            ${renderTriggerStatusCard_('텔레그램 큐', trigger.telegramQueue)}
          </div>
          <div class="auto-close-note ${autoClose.enabled ? 'enabled' : ''}">
            <strong>${autoClose.enabled ? '자동마감 사용 중' : '자동마감 사용 안 함'}</strong>
            <span>실행시각 ${escapeHtml(autoClose.closeTime || '-')} · 실패 알림 ${autoClose.notifyFailure ? '사용' : '미사용'}</span>
            ${autoClose.lastFailure ? `<small>마지막 오류: ${escapeHtml(autoClose.lastFailure)}</small>` : ''}
          </div>
        </section>
      </div>`;
    $('operationSettingsSave').addEventListener('click', saveOperationSettings_);
    $('automaticCloseTest').addEventListener('click', runAutomaticCloseTest_);
  }

  function renderOperationSettingField_(definition, value) { // (운영설정 입력필드)
    const code = escapeAttr(definition.code);
    const safeValue = String(value ?? definition.defaultValue ?? '');
    let input = '';
    if (definition.type === 'yesno') {
      input = `<select id="operation_${code}"><option value="Y"${safeValue === 'Y' ? ' selected' : ''}>사용</option><option value="N"${safeValue !== 'Y' ? ' selected' : ''}>사용 안 함</option></select>`;
    } else if (definition.type === 'select') {
      input = `<select id="operation_${code}">${(definition.options || []).map(option => `<option value="${escapeAttr(option)}"${String(option) === safeValue ? ' selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select>`;
    } else {
      const attrs = definition.type === 'number' ? `min="${definition.min}" max="${definition.max}" step="${definition.step || 1}"` : '';
      input = `<input id="operation_${code}" type="${definition.type === 'time' ? 'time' : 'number'}" value="${escapeAttr(safeValue)}" ${attrs}>`;
    }
    return `<label class="operation-setting-field"><span>${escapeHtml(definition.label)}</span>${input}<small>${escapeHtml(definition.note || '')}</small></label>`;
  }

  function renderTriggerStatusCard_(label, info) { // (트리거 상태 카드)
    const active = Number(info?.count || 0) > 0;
    return `<div class="trigger-status-item ${active ? 'active' : 'inactive'}"><span>${escapeHtml(label)}</span><strong>${active ? '정상' : '미설치'}</strong><small>${active ? `${Number(info.intervalMinutes || 0)}분 간격` : '설정 저장으로 복구'}</small></div>`;
  }

  async function saveOperationSettings_() { // (운영설정 저장)
    const button = $('operationSettingsSave');
    const definitions = state.settings.data?.operationDefinitions || [];
    const values = {};
    definitions.forEach(def => { values[def.code] = String($(`operation_${def.code}`)?.value ?? '').trim(); });
    button.disabled = true;
    button.textContent = '저장 중…';
    try {
      const result = await callServer('saveAdminOperationSettings', state.token, { values });
      if (!result?.ok) throw new Error(result?.message || '운영 설정을 저장하지 못했습니다.');
      showToast(result.message || '운영 설정을 저장했습니다.');
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '운영 설정 저장 오류');
    } finally {
      button.disabled = false;
      button.textContent = '설정 저장';
    }
  }

  async function runAutomaticCloseTest_() { // (관리자 자동마감 즉시 시험)
    const button = $('automaticCloseTest');
    if (!window.confirm('현재 업무일자의 미마감 사업장을 지금 마감할까요?')) return;
    button.disabled = true;
    button.textContent = '실행 중…';
    try {
      const result = await callServer('runAutomaticDailyCloseNow', state.token);
      showToast(result.message || (result.skipped ? `자동마감 생략: ${result.reason}` : '자동마감을 실행했습니다.'));
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '자동마감 시험 오류');
    } finally {
      button.disabled = false;
      button.textContent = '자동마감 지금 시험';
    }
  }

  function renderCodeManagementPanel_() { // (코드·명칭·목록 관리)
    const groups = (state.settings.data?.groups || []).filter(group => group.code !== '운영설정');
    const selected = groups.find(group => group.code === state.settings.selectedGroup) || groups[0];
    if (!selected) {
      $('settingsPanel').innerHTML = '<div class="settings-loading">관리할 코드그룹이 없습니다.</div>';
      return;
    }
    state.settings.selectedGroup = selected.code;
    $('settingsPanel').innerHTML = `
      <section class="settings-card code-management-card">
        <div class="settings-card-heading">
          <div><small>코드값은 유지하고 표시명·순서·사용여부 관리</small><h2>명칭·목록 관리</h2></div>
          <label class="code-group-select"><span>관리항목</span><select id="adminCodeGroup">${groups.map(group => `<option value="${escapeAttr(group.code)}"${group.code === selected.code ? ' selected' : ''}>${escapeHtml(group.label)}</option>`).join('')}</select></label>
        </div>
        <div class="code-table-wrap">
          <table class="code-admin-table"><thead><tr><th>코드</th><th>표시명</th><th>순서</th><th>사용</th><th>비고</th><th>관리</th></tr></thead>
          <tbody id="adminCodeTableBody">${renderAdminCodeRows_(selected)}</tbody></table>
        </div>
        ${selected.addable ? `<div class="code-add-row"><input id="newCodeCode" placeholder="신규 코드"><input id="newCodeLabel" placeholder="표시명"><input id="newCodeOrder" type="number" value="999"><input id="newCodeNote" placeholder="비고"><button id="newCodeAddButton" class="primary-button" type="button">항목 추가</button></div>` : '<div class="settings-help">이 그룹은 기존 항목의 표시명과 알림 사용여부만 변경할 수 있습니다.</div>'}
      </section>`;
    $('adminCodeGroup').addEventListener('change', event => { state.settings.selectedGroup = event.target.value; renderCodeManagementPanel_(); });
    document.querySelectorAll('[data-save-code]').forEach(button => button.addEventListener('click', () => saveAdminCodeFromRow_(button.dataset.saveCode, button)));
    document.querySelectorAll('[data-disable-code]').forEach(button => button.addEventListener('click', () => disableAdminCode_(button.dataset.disableCode, button)));
    $('newCodeAddButton')?.addEventListener('click', addAdminCode_);
  }

  function renderAdminCodeRows_(group) { // (코드관리 행 렌더링)
    const items = group.items || [];
    if (!items.length) return '<tr><td colspan="6" class="table-empty">등록된 항목이 없습니다.</td></tr>';
    return items.map(item => `<tr data-code-row="${escapeAttr(item.code)}" class="${item.enabled === 'Y' ? '' : 'disabled-row'}">
      <td><strong>${escapeHtml(item.code)}</strong>${item.protected ? '<small>필수코드</small>' : ''}</td>
      <td><input class="code-label-input" value="${escapeAttr(item.label)}"></td>
      <td><input class="code-order-input" type="number" value="${Number(item.order || 9999)}"></td>
      <td><select class="code-enabled-input"${item.protected ? ' disabled' : ''}><option value="Y"${item.enabled === 'Y' ? ' selected' : ''}>사용</option><option value="N"${item.enabled !== 'Y' ? ' selected' : ''}>중지</option></select></td>
      <td><input class="code-note-input" value="${escapeAttr(item.note || '')}"></td>
      <td><div class="code-row-actions"><button type="button" data-save-code="${escapeAttr(item.code)}">저장</button>${!item.protected && item.enabled === 'Y' ? `<button type="button" class="danger" data-disable-code="${escapeAttr(item.code)}">중지</button>` : ''}</div></td>
    </tr>`).join('');
  }

  async function saveAdminCodeFromRow_(code, button) { // (기존 코드행 저장)
    const row = document.querySelector(`[data-code-row="${cssEscape_(code)}"]`);
    if (!row) return;
    const payload = {
      group: state.settings.selectedGroup,
      code,
      label: row.querySelector('.code-label-input')?.value.trim(),
      order: row.querySelector('.code-order-input')?.value,
      enabled: row.querySelector('.code-enabled-input')?.value || 'Y',
      note: row.querySelector('.code-note-input')?.value.trim()
    };
    await executeCodeSave_(payload, button);
  }

  async function addAdminCode_() { // (신규 코드 추가)
    const button = $('newCodeAddButton');
    const payload = {
      group: state.settings.selectedGroup,
      code: $('newCodeCode').value.trim(),
      label: $('newCodeLabel').value.trim(),
      order: $('newCodeOrder').value,
      enabled: 'Y',
      note: $('newCodeNote').value.trim()
    };
    await executeCodeSave_(payload, button);
  }

  async function executeCodeSave_(payload, button) { // (코드 저장 공통)
    button.disabled = true;
    try {
      const result = await callServer('saveAdminCodeRow', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '코드를 저장하지 못했습니다.');
      showToast(result.message || '코드를 저장했습니다.');
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '코드 저장 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function disableAdminCode_(code, button) { // (코드 사용중지)
    if (!window.confirm(`${code} 항목을 사용중지할까요? 기존 이력은 유지됩니다.`)) return;
    button.disabled = true;
    try {
      const result = await callServer('disableAdminCodeRow', state.token, { group: state.settings.selectedGroup, code });
      if (!result?.ok) throw new Error(result?.message || '코드를 사용중지하지 못했습니다.');
      showToast(result.message || '코드를 사용중지했습니다.');
      await loadAdminSettingsForce_();
    } catch (error) {
      showToast(error?.message || '코드 사용중지 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function loadAdminSettingsForce_() { // (설정 강제 새로고침)
    state.settings.loaded = false;
    state.settings.loading = false;
    await loadAdminSettings_();
  }

  async function loadUserAccountSettings_(options = {}) { // (사용자계정 등록자료 조회)
    if (state.settings.userAccountsLoading && !options.force) return;
    state.settings.userAccountsLoading = true;
    try {
      const result = await callServer('getAdminUserAccountRegistrationData', state.token);
      if (!result?.ok) throw new Error(result?.message || '사용자계정을 불러오지 못했습니다.');
      state.settings.userAccountsData = result;
      state.settings.userAccountsLoaded = true;
      if (state.activeMenu === 'settings' && state.settings.tab === 'users') renderUserAccountSettingsData_();
    } catch (error) {
      if ($('userAccountTableBody')) $('userAccountTableBody').innerHTML = `<tr><td colspan="9" class="table-empty error">${escapeHtml(error?.message || '사용자계정 조회 오류')}</td></tr>`;
      showToast(error?.message || '사용자계정 조회 오류');
    } finally {
      state.settings.userAccountsLoading = false;
    }
  }

  function renderUserAccountSettingsData_() { // (사용자계정 등록자료·관리동작 표시)
    const data = state.settings.userAccountsData || {};
    if (!$('userAccountTableBody')) return;

    const roles = data.roles || [];
    $('userAccountRole').innerHTML = '<option value="">권한 선택</option>' + roles.map(role =>
      `<option value="${escapeAttr(role.code)}">${escapeHtml(role.label || role.code)} (${escapeHtml(role.code)})</option>`
    ).join('');

    const sites = data.sites || [];
    $('userAccountDefaultSite').innerHTML = '<option value="">미지정</option>' + sites.map(site =>
      `<option value="${escapeAttr(site)}"${site === data.defaultSite ? ' selected' : ''}>${escapeHtml(site)}</option>`
    ).join('');

    $('userAccountJobOptions').innerHTML = (data.jobs || []).map(job => `<option value="${escapeAttr(job)}"></option>`).join('');
    $('userAccountEmploymentVendorOptions').innerHTML = (data.employmentVendors || []).map(vendor => `<option value="${escapeAttr(vendor)}"></option>`).join('');
    toggleUserAccountEmploymentVendorField_();
    renderUserAccountSettingsTable_();
  }

  function filteredUserAccountSettingsUsers_() { // (등록계정 이름·채용구분 필터 적용)
    const users = state.settings.userAccountsData?.users || [];
    const nameQuery = String(state.settings.userAccountNameFilter || '').trim().toLocaleLowerCase('ko-KR');
    const employmentFilter = String(state.settings.userAccountEmploymentFilter || '').trim();
    return users.filter(user => {
      const name = String(user.name || '').trim().toLocaleLowerCase('ko-KR');
      if (nameQuery && !name.includes(nameQuery)) return false;
      const employmentCategory = String(user.employmentCategory || '정규직').trim();
      if (employmentFilter && employmentCategory !== employmentFilter) return false;
      return true;
    });
  }

  function renderUserAccountSettingsTable_() { // (등록계정 필터 결과·관리동작 표 갱신)
    if (!$('userAccountTableBody')) return;
    const allUsers = state.settings.userAccountsData?.users || [];
    const users = filteredUserAccountSettingsUsers_();
    const hasFilter = Boolean(String(state.settings.userAccountNameFilter || '').trim() || String(state.settings.userAccountEmploymentFilter || '').trim());
    if ($('userAccountCount')) {
      $('userAccountCount').textContent = hasFilter
        ? `${users.length.toLocaleString('ko-KR')} / ${allUsers.length.toLocaleString('ko-KR')}명`
        : `${allUsers.length.toLocaleString('ko-KR')}명`;
    }
    $('userAccountTableBody').innerHTML = users.length ? users.map(user => {
      const enabledText = user.enabled ? '사용' : '중지';
      const telegramText = user.telegramLinked ? '연결완료' : (user.telegramConnectionStatus || (user.enabled ? '연결대기' : '사용중지'));
      const buildings = Array.isArray(user.defaultBuildings) ? user.defaultBuildings.join(',') : String(user.defaultBuildings || '');
      const location = [user.defaultSite, buildings].filter(Boolean).join(' · ') || '-';
      const employmentCategory = user.employmentCategory || '정규직';
      const employmentVendor = user.employmentVendor || '';
      const employmentNote = user.employmentInferred ? '<small>기존 정보 기준 자동판정</small>' : '';
      const canManage = user.canManage !== false;
      const manageButtons = canManage
        ? `<button type="button" data-user-account-edit>수정</button>
           <button type="button" data-user-account-enabled>${user.enabled ? '사용중지' : '사용재개'}</button>
           ${user.canDelete ? '<button type="button" data-user-account-delete>삭제</button>' : ''}`
        : '<small>관리자 전용</small>';
      return `<tr class="${user.enabled ? '' : 'disabled-row'}" data-user-account-row="${escapeAttr(user.employeeNo)}">
        <td><strong>${escapeHtml(user.employeeNo)}</strong></td>
        <td style="min-width:120px;width:120px"><strong style="display:block;white-space:nowrap">${escapeHtml(user.name)}</strong><small style="display:block;margin-top:3px;white-space:nowrap">${escapeHtml(user.job || '-')}</small></td>
        <td>
          <select data-user-employment-category style="min-width:96px"${canManage ? '' : ' disabled'}>
            <option value="정규직"${employmentCategory === '정규직' ? ' selected' : ''}>정규직</option>
            <option value="아르바이트"${employmentCategory === '아르바이트' ? ' selected' : ''}>아르바이트</option>
            <option value="외주업체"${employmentCategory === '외주업체' ? ' selected' : ''}>외주업체</option>
          </select>
          <input data-user-employment-vendor maxlength="40" value="${escapeAttr(employmentVendor)}" placeholder="업체명"${canManage ? '' : ' disabled'} style="min-width:90px;${employmentCategory === '외주업체' ? '' : 'display:none'}">
          ${employmentNote}
        </td>
        <td>${escapeHtml(user.role || '-')}</td>
        <td>${enabledText}</td>
        <td>${escapeHtml(location)}</td>
        <td>${escapeHtml(telegramText)}</td>
        <td>${escapeHtml(user.updatedAt || '-')}</td>
        <td><div class="code-row-actions">${canManage ? '<button type="button" data-user-employment-save>채용구분 저장</button>' : ''}${manageButtons}</div></td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" class="table-empty">${hasFilter ? '조건에 맞는 등록계정이 없습니다.' : '등록된 사용자계정이 없습니다.'}</td></tr>`;

    document.querySelectorAll('[data-user-employment-category]').forEach(select => {
      select.addEventListener('change', () => toggleUserAccountEmploymentVendorRow_(select.closest('[data-user-account-row]')));
    });
    document.querySelectorAll('[data-user-employment-save]').forEach(button => {
      button.addEventListener('click', () => updateUserAccountEmploymentType_(button));
    });
    document.querySelectorAll('[data-user-account-edit]').forEach(button => {
      button.addEventListener('click', () => beginUserAccountEdit_(button));
    });
    document.querySelectorAll('[data-user-account-enabled]').forEach(button => {
      button.addEventListener('click', () => toggleUserAccountEnabled_(button));
    });
    document.querySelectorAll('[data-user-account-delete]').forEach(button => {
      button.addEventListener('click', () => deleteUserAccountFromSettings_(button));
    });
  }

  function toggleUserAccountEmploymentVendorField_() { // (신규 계정 외주업체명 입력 표시)
    const category = String($('userAccountEmploymentCategory')?.value || '정규직');
    const field = $('userAccountEmploymentVendorField');
    if (field) field.style.display = category === '외주업체' ? '' : 'none';
    if (category !== '외주업체' && $('userAccountEmploymentVendor')) $('userAccountEmploymentVendor').value = '';
  }

  function toggleUserAccountEmploymentVendorRow_(row) { // (기존 계정 외주업체명 입력 표시)
    if (!row) return;
    const category = String(row.querySelector('[data-user-employment-category]')?.value || '정규직');
    const vendor = row.querySelector('[data-user-employment-vendor]');
    if (!vendor) return;
    vendor.style.display = category === '외주업체' ? '' : 'none';
    if (category !== '외주업체') vendor.value = '';
  }

  async function updateUserAccountEmploymentType_(button) { // (기존 계정 채용구분 저장)
    const row = button.closest('[data-user-account-row]');
    if (!row) return;
    const payload = {
      employeeNo: row.dataset.userAccountRow,
      employmentCategory: row.querySelector('[data-user-employment-category]')?.value || '정규직',
      employmentVendor: row.querySelector('[data-user-employment-vendor]')?.value.trim() || ''
    };
    button.disabled = true;
    try {
      const result = await callServer('updateAdminUserEmploymentType', state.token, payload);
      if (!result?.ok) throw new Error(result?.message || '채용구분을 저장하지 못했습니다.');
      showToast(result.message || '채용구분을 저장했습니다.');
      state.settings.userAccountsLoaded = false;
      invalidateUserAccountDependentClientCaches_();
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '채용구분 저장 오류');
    } finally {
      button.disabled = false;
    }
  }

  function beginUserAccountEdit_(button) { // (기존 사용자계정 수정폼 불러오기)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canManage === false) return showToast('이 계정은 현재 권한으로 수정할 수 없습니다.');
    const employeeInput = $('userAccountEmployeeNo');
    const saveButton = $('userAccountCreateButton');
    employeeInput.value = user.employeeNo || '';
    employeeInput.disabled = true;
    $('userAccountName').value = user.name || '';
    $('userAccountJob').value = user.job || '';
    $('userAccountEmploymentCategory').value = user.employmentCategory || '정규직';
    $('userAccountEmploymentVendor').value = user.employmentVendor || '';
    toggleUserAccountEmploymentVendorField_();
    $('userAccountRole').value = user.role || '';
    $('userAccountEnabled').value = user.enabled ? 'Y' : 'N';
    $('userAccountTelegramEnabled').value = user.telegramEnabled ? 'Y' : 'N';
    $('userAccountPhone').value = user.phone || '';
    $('userAccountDefaultSite').value = user.defaultSite || '';
    $('userAccountDefaultBuildings').value = Array.isArray(user.defaultBuildings) ? user.defaultBuildings.join(',') : String(user.defaultBuildings || '');
    $('userAccountNote').value = user.note || '';
    saveButton.dataset.editEmployeeNo = user.employeeNo;
    saveButton.textContent = '변경 저장';
    $('userAccountEditCancelButton').style.display = '';
    document.querySelector('.operation-form-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  async function toggleUserAccountEnabled_(button) { // (사용자계정 사용·사용중지 즉시 전환)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canManage === false) return showToast('이 계정은 현재 권한으로 변경할 수 없습니다.');
    const nextEnabled = user.enabled ? 'N' : 'Y';
    const actionText = nextEnabled === 'Y' ? '사용 상태로 전환' : '사용중지';
    if (!window.confirm(`${user.name}(${employeeNo}) 계정을 ${actionText}할까요?`)) return;
    button.disabled = true;
    try {
      const result = await callServer('setAdminUserAccountEnabled', state.token, { employeeNo, enabled: nextEnabled });
      if (!result?.ok) throw new Error(result?.message || '사용상태를 변경하지 못했습니다.');
      showToast(result.message || '사용상태를 변경했습니다.');
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '사용상태 변경 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function deleteUserAccountFromSettings_(button) { // (이력 없는 사용중지 계정 영구삭제)
    const row = button.closest('[data-user-account-row]');
    const employeeNo = String(row?.dataset.userAccountRow || '').trim();
    const user = (state.settings.userAccountsData?.users || []).find(item => item.employeeNo === employeeNo);
    if (!user || user.canDelete !== true) return showToast('사용중지된 미사용 계정만 삭제할 수 있습니다.');
    if (!window.confirm(`${user.name}(${employeeNo}) 계정을 영구삭제할까요?\n\n객실 배정 또는 과거 업무이력이 있는 계정은 안전을 위해 서버에서 삭제가 차단됩니다.`)) return;
    button.disabled = true;
    try {
      const result = await callServer('deleteAdminUserAccount', state.token, { employeeNo });
      if (!result?.ok) throw new Error(result?.message || '사용자계정을 삭제하지 못했습니다.');
      showToast(result.message || '미사용 계정을 삭제했습니다.');
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || '사용자계정 삭제 오류');
    } finally {
      button.disabled = false;
    }
  }

  function invalidateUserAccountDependentClientCaches_() { // (직원 등록·수정 즉시 후속 화면 직원목록 재조회)
    state.indicator.loaded = false;
    state.shifts.loaded = false;
    state.roommaidStats.loaded = false;
    state.roommaidClose.loaded = false;
    state.roommaidClose.data = null;
  }

  function suggestUserAccountRoleFromJob_() { // (직무명 기준 권한 자동 제안)
    const roleSelect = $('userAccountRole');
    if (!roleSelect || roleSelect.value) return;
    const job = String($('userAccountJob')?.value || '').trim().toUpperCase();
    let role = '';
    if (job.includes('관리자') || job.includes('ADMIN')) role = 'ADMIN';
    else if (job.includes('오더') || job.includes('ORDER')) role = 'ORDER';
    else if (job === 'QM' || job.includes('퀄리티')) role = 'QM';
    else if (job.includes('하우스맨') || job.includes('HOUSEMAN')) role = 'HOUSEMAN';
    else if (job.includes('룸메이드') || job.includes('ROOMMAID')) role = 'ROOMMAID';
    else if (job.includes('퍼블릭') || job.includes('PUBLIC')) role = 'PUBLIC';
    if (role && Array.from(roleSelect.options).some(option => option.value === role)) roleSelect.value = role;
  }

  async function createUserAccountFromSettings_() { // (사용자계정 신규 등록·기존정보 수정 실행)
    const button = $('userAccountCreateButton');
    const editingEmployeeNo = String(button.dataset.editEmployeeNo || '').trim();
    const payload = {
      employeeNo: editingEmployeeNo || $('userAccountEmployeeNo').value.trim(),
      name: $('userAccountName').value.trim(),
      job: $('userAccountJob').value.trim(),
      employmentCategory: $('userAccountEmploymentCategory').value,
      employmentVendor: $('userAccountEmploymentVendor').value.trim(),
      role: $('userAccountRole').value,
      enabled: $('userAccountEnabled').value,
      telegramEnabled: $('userAccountTelegramEnabled').value,
      phone: $('userAccountPhone').value.trim(),
      defaultSite: $('userAccountDefaultSite').value,
      defaultBuildings: $('userAccountDefaultBuildings').value.trim(),
      note: $('userAccountNote').value.trim()
    };

    button.disabled = true;
    button.textContent = editingEmployeeNo ? '수정 중…' : '등록 중…';
    try {
      const method = editingEmployeeNo ? 'updateAdminUserAccount' : 'createAdminUserAccount';
      const result = await callServer(method, state.token, payload);
      if (!result?.ok) throw new Error(result?.message || (editingEmployeeNo ? '사용자계정을 수정하지 못했습니다.' : '사용자계정을 등록하지 못했습니다.'));
      showToast(result.message || (editingEmployeeNo ? '사용자계정을 수정했습니다.' : '사용자계정을 등록했습니다.'));
      clearUserAccountSettingsForm_();
      invalidateUserAccountDependentClientCaches_();
      state.settings.userAccountsLoaded = false;
      await loadUserAccountSettings_({ force: true });
    } catch (error) {
      showToast(error?.message || (editingEmployeeNo ? '사용자계정 수정 오류' : '사용자계정 등록 오류'));
    } finally {
      button.disabled = false;
      button.textContent = button.dataset.editEmployeeNo ? '변경 저장' : '사용자 등록';
    }
  }

  function clearUserAccountSettingsForm_() { // (사용자계정 신규등록 모드로 입력 초기화)
    ['userAccountEmployeeNo', 'userAccountName', 'userAccountJob', 'userAccountEmploymentVendor', 'userAccountPhone', 'userAccountDefaultBuildings', 'userAccountNote']
      .forEach(id => { if ($(id)) $(id).value = ''; });
    if ($('userAccountEmployeeNo')) $('userAccountEmployeeNo').disabled = false;
    if ($('userAccountEmploymentCategory')) $('userAccountEmploymentCategory').value = '정규직';
    toggleUserAccountEmploymentVendorField_();
    if ($('userAccountRole')) $('userAccountRole').value = '';
    if ($('userAccountEnabled')) $('userAccountEnabled').value = 'Y';
    if ($('userAccountTelegramEnabled')) $('userAccountTelegramEnabled').value = 'Y';
    if ($('userAccountDefaultSite')) $('userAccountDefaultSite').value = state.settings.userAccountsData?.defaultSite || '';
    const saveButton = $('userAccountCreateButton');
    if (saveButton) {
      delete saveButton.dataset.editEmployeeNo;
      saveButton.textContent = '사용자 등록';
    }
    if ($('userAccountEditCancelButton')) $('userAccountEditCancelButton').style.display = 'none';
  }

  function renderTelegramSettingsPanel_() { // (텔레그램 직원 자동연결 설정 패널)
    $('settingsPanel').innerHTML = `
      <section class="telegram-settings-page embedded">
        <div class="telegram-settings-header">
          <div><small>사용자계정 단일 기준</small><h2>텔레그램 직원 자동 연결</h2></div>
          <div class="telegram-settings-actions">
            <button id="telegramSetupButton" class="primary-button" type="button">텔레그램 초기 설정</button>
            <button id="telegramRefreshLinksButton" class="secondary-button" type="button">연결링크 일괄생성</button>
          </div>
        </div>
        <div id="telegramSetupSummary" class="telegram-setup-summary"><div class="settings-loading">텔레그램 연결현황을 불러오는 중입니다.</div></div>
        <div class="telegram-guide"><strong>직원 연결 순서</strong><span>사용자계정 직원 등록 → 개인 링크 전달 → 직원이 텔레그램 시작 선택 → 텔레그램ID·알림 Y 자동등록</span></div>
        <div class="telegram-user-table-wrap"><table class="telegram-user-table"><thead><tr><th>사번</th><th>이름·직무</th><th>연결상태</th><th>텔레그램ID</th><th>개인 연결링크</th><th>관리</th></tr></thead><tbody id="telegramUserTableBody"><tr><td colspan="6" class="table-empty">연결현황을 불러오는 중입니다.</td></tr></tbody></table></div>
      </section>`;
    $('telegramSetupButton').addEventListener('click', setupTelegramConnection_);
    $('telegramRefreshLinksButton').addEventListener('click', refreshTelegramLinks_);
  }

  async function loadTelegramSettings_() { // (텔레그램 직원 연결현황 조회)
    if (state.settings.telegramLoading) return;
    state.settings.telegramLoading = true;
    try {
      const result = await callServer('getTelegramConnectionAdminData', state.token);
      if (!result?.ok) throw new Error(result?.message || '텔레그램 연결현황을 불러오지 못했습니다.');
      state.settings.telegramData = result;
      state.settings.telegramLoaded = true;
      if (state.activeMenu === 'settings' && state.settings.tab === 'telegram') renderTelegramSettingsData_();
    } catch (error) {
      if ($('telegramUserTableBody')) $('telegramUserTableBody').innerHTML = `<tr><td colspan="6" class="table-empty error">${escapeHtml(error?.message || '조회 오류')}</td></tr>`;
      showToast(error?.message || '텔레그램 연결현황 조회 오류');
    } finally {
      state.settings.telegramLoading = false;
    }
  }

  function renderTelegramSettingsData_() { // (텔레그램 연결현황 표시)
    const data = state.settings.telegramData || {};
    if (!$('telegramSetupSummary')) return;
    const linkedCount = (data.users || []).filter(user => user.telegramLinked).length;
    const waitingCount = (data.users || []).filter(user => user.enabled && !user.telegramLinked).length;
    $('telegramSetupSummary').innerHTML = `
      <div class="telegram-summary-card"><span>봇</span><strong>${data.botUsername ? `@${escapeHtml(data.botUsername)}` : '미설정'}</strong></div>
      <div class="telegram-summary-card"><span>웹훅</span><strong>${data.webhookUrl ? '연결됨' : '미설정'}</strong><small>${escapeHtml(data.webhookSetAt || '')}</small></div>
      <div class="telegram-summary-card"><span>연결완료</span><strong>${linkedCount.toLocaleString('ko-KR')}명</strong></div>
      <div class="telegram-summary-card"><span>연결대기</span><strong>${waitingCount.toLocaleString('ko-KR')}명</strong></div>`;

    const users = data.users || [];
    $('telegramUserTableBody').innerHTML = users.length ? users.map(user => {
      const statusClass = user.telegramLinked ? 'linked' : (user.enabled ? 'waiting' : 'disabled');
      const linkButton = user.connectionLink ? `<button type="button" class="table-action" data-copy-telegram-link="${escapeAttr(user.connectionLink)}">링크 복사</button>` : '<span class="muted">초기 설정 필요</span>';
      const testButton = user.telegramLinked && user.role !== 'PUBLIC' ? `<button type="button" class="table-action" data-test-telegram="${escapeAttr(user.employeeNo)}">테스트</button>` : '';
      return `<tr><td><strong>${escapeHtml(user.employeeNo)}</strong></td><td><strong>${escapeHtml(user.name)}</strong><small>${escapeHtml(user.job || user.role || '-')}</small></td><td><span class="telegram-link-status ${statusClass}">${escapeHtml(user.connectionStatus || (user.telegramLinked ? '연결완료' : '연결대기'))}</span><small>${escapeHtml(user.linkedAt || '')}</small></td><td>${escapeHtml(user.telegramId || '-')}</td><td>${linkButton}</td><td><div class="telegram-row-actions">${testButton}<button type="button" class="table-action danger" data-reset-telegram="${escapeAttr(user.employeeNo)}">재연결</button></div></td></tr>`;
    }).join('') : '<tr><td colspan="6" class="table-empty">사용자계정에 등록된 직원이 없습니다.</td></tr>';
    document.querySelectorAll('[data-copy-telegram-link]').forEach(button => button.addEventListener('click', () => copyTelegramLink_(button.dataset.copyTelegramLink)));
    document.querySelectorAll('[data-test-telegram]').forEach(button => button.addEventListener('click', () => testTelegramConnection_(button.dataset.testTelegram, button)));
    document.querySelectorAll('[data-reset-telegram]').forEach(button => button.addEventListener('click', () => resetTelegramConnection_(button.dataset.resetTelegram, button)));
  }

  async function setupTelegramConnection_(event) { // (봇 웹훅·개인링크 초기 설정)
    const button = event.currentTarget;
    button.disabled = true;
    button.textContent = '설정 중…';
    try {
      const result = await callServer('setupNovaTelegramConnectionFromApp', state.token);
      showToast(result.message || '텔레그램 초기 설정을 완료했습니다.');
      state.settings.telegramLoaded = false;
      await loadTelegramSettings_();
    } catch (error) {
      showToast(error?.message || '텔레그램 초기 설정 오류');
    } finally {
      button.disabled = false;
      button.textContent = '텔레그램 초기 설정';
    }
  }

  async function refreshTelegramLinks_(event) { // (직원 개인링크 일괄 생성)
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const result = await callServer('refreshTelegramConnectionLinks', state.token);
      showToast(result.message || '연결링크를 생성했습니다.');
      state.settings.telegramLoaded = false;
      await loadTelegramSettings_();
    } catch (error) {
      showToast(error?.message || '연결링크 생성 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function resetTelegramConnection_(employeeNo, button) { // (직원 텔레그램 재연결 링크 발급)
    if (!window.confirm(`${employeeNo} 직원의 기존 텔레그램 연결을 해제하고 새 링크를 발급할까요?`)) return;
    button.disabled = true;
    try {
      const result = await callServer('regenerateTelegramConnectionLink', state.token, employeeNo, true);
      showToast(result.message || '재연결 링크를 발급했습니다.');
      state.settings.telegramLoaded = false;
      await loadTelegramSettings_();
    } catch (error) {
      showToast(error?.message || '재연결 처리 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function testTelegramConnection_(employeeNo, button) { // (직원 텔레그램 테스트 발송)
    button.disabled = true;
    try {
      const result = await callServer('sendTelegramConnectionTest', state.token, employeeNo);
      showToast(result.message || '테스트 메시지를 발송했습니다.');
    } catch (error) {
      showToast(error?.message || '테스트 발송 오류');
    } finally {
      button.disabled = false;
    }
  }

  async function copyTelegramLink_(link) { // (개인 연결링크 복사)
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(link);
      else {
        const textarea = document.createElement('textarea');
        textarea.value = link;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
      }
      showToast('개인 연결링크를 복사했습니다.');
    } catch (error) {
      showToast('연결링크를 복사하지 못했습니다.');
    }
  }

  function cssEscape_(value) { // (querySelector 코드값 안전처리)
    if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(String(value || ''));
    return String(value || '').replace(/(["\\])/g, '\\$1');
  }

  function bindMonthlyControls_() { // (월별·일별 조회 이벤트 연결)
    const currentYear = new Date().getFullYear();
    $('monthlyYear').innerHTML = Array.from({ length: 8 }, (_, index) => currentYear - 6 + index)
      .map(year => `<option value="${year}"${year === Number(state.monthly.year) ? ' selected' : ''}>${year}년</option>`).join('');
    $('monthlyMonth').innerHTML = Array.from({ length: 12 }, (_, index) => index + 1)
      .map(month => `<option value="${month}"${month === Number(state.monthly.month) ? ' selected' : ''}>${month}월</option>`).join('');
    $('monthlyDate').value = state.monthly.date || formatClientDate_(new Date());
    $('monthlyType').value = state.monthly.type || 'ALL';
    $('monthlySearch').value = state.monthly.search || '';
    applyMonthlyPeriodUi_(state.monthly.period);

    $('monthlyPeriodToggle').addEventListener('click', event => {
      const button = event.target.closest('[data-period]');
      if (!button) return;
      const period = button.dataset.period === 'DAILY' ? 'DAILY' : 'MONTHLY';
      if (state.monthly.period === period) return;
      state.monthly.period = period;
      if (period === 'DAILY' && !$('monthlyDate').value) $('monthlyDate').value = formatClientDate_(new Date());
      applyMonthlyPeriodUi_(period);
      loadMonthlyHistory({ page: 1 });
    });
