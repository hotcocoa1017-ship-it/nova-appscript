<script>
(() => {
  'use strict';

  // QM_FINALIZE_BUSINESS_DATE_GUARD_V3
  // Client.html의 state는 IIFE 내부 lexical state이므로 외부 스크립트에서 직접 대입할 수 없습니다.
  // 최종제출 직전 화면에 표시된 업무일자를 기존 mobileDate change 핸들러로 동기화하여
  // Client가 소유한 state.mobile.businessDate를 같은 실행 스택에서 먼저 갱신합니다.
  // state 갱신은 change 핸들러의 첫 단계에서 동기적으로 끝나므로 submit handler보다 먼저 확정됩니다.
  document.addEventListener('click', event => {
    const target = event.target?.closest?.('#qmChecklistSubmit');
    if (!target || target.disabled) return;

    const dateInput = document.getElementById('mobileDate');
    if (!dateInput) return;
    const businessDate = String(
      dateInput.value || sessionStorage.getItem('novaMobileBusinessDate') || ''
    ).trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(businessDate)) return;

    sessionStorage.setItem('novaMobileBusinessDate', businessDate);
    if (dateInput.value !== businessDate) dateInput.value = businessDate;

    // Client IIFE 내부의 기존 change handler를 통해 state.mobile.businessDate를 동기 갱신합니다.
    // 외부에서 state를 직접 참조하지 않습니다.
    dateInput.dispatchEvent(new Event('change', { bubbles: true }));
  }, true);
})();
</script>
