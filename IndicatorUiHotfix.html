<style>
/* NOVA 통합인디게이터 업무일자 폭 영구 보정 */
@media (min-width: 761px) {
  .indicator-controls {
    grid-template-columns: 194px 150px minmax(190px, 1fr) auto auto;
  }
  #indicatorDate {
    width: 136px;
    min-width: 136px;
  }
}

@media (max-width: 760px) {
  #indicatorDate {
    width: 100%;
    min-width: 0;
  }
}

/* 청소시작/청소완료 저장 중 표시 · 기존 버튼 구조/동작은 유지 */
.nova-cleaning-save-loading {
  pointer-events: none;
}
.nova-cleaning-save-loading::before {
  content: '';
  display: inline-block;
  width: 12px;
  height: 12px;
  margin-right: 6px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  vertical-align: -2px;
  animation: nova-cleaning-save-spin .65s linear infinite;
}
@keyframes nova-cleaning-save-spin {
  to { transform: rotate(360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .nova-cleaning-save-loading::before {
    animation-duration: 1.2s;
  }
}
</style>
<script>
(() => {
  'use strict';

  const loadingClass = 'nova-cleaning-save-loading';

  function isCleaningSaveButton_(button) {
    if (!button) return false;
    const action = String(button.dataset.roomAction || '').trim().toUpperCase();
    if (action === 'CLEANING_START' || action === 'CLEANING_COMPLETE') return true;
    if (!['START', 'COMPLETE'].includes(action)) return false;
    return /청소|D\/S/i.test(String(button.textContent || ''));
  }

  function clearCleaningLoading_(button) {
    if (button && !button.disabled) button.classList.remove(loadingClass);
  }

  document.addEventListener('click', event => {
    const button = event.target.closest?.('button[data-room-action]');
    if (!button || button.disabled || !isCleaningSaveButton_(button)) return;

    // 기존 Client의 roomActionInFlight/disabled 제어보다 먼저 시각 피드백을 시작합니다.
    button.classList.add(loadingClass);

    // 권한/상태 검증으로 서버 호출 전 종료된 경우에는 즉시 원복합니다.
    window.setTimeout(() => clearCleaningLoading_(button), 120);
  }, true);

  function observeCleaningButtons_() {
    if (!document.body) return;
    const observer = new MutationObserver(mutations => {
      mutations.forEach(mutation => {
        const button = mutation.target;
        if (!(button instanceof HTMLButtonElement) || !isCleaningSaveButton_(button)) return;
        if (!button.disabled) button.classList.remove(loadingClass);
      });
    });
    observer.observe(document.body, {
      subtree: true,
      attributes: true,
      attributeFilter: ['disabled']
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', observeCleaningButtons_, { once: true });
  } else {
    observeCleaningButtons_();
  }
})();
</script>
