<script>
(() => {
  'use strict';

  // QM_CHECKLIST_SELECT_STABILITY_V1
  // 모바일 native select가 열린 직후 비동기 QM 시작/미러 완료 콜백이
  // 체크리스트 모달 DOM을 다시 그리며 picker를 닫는 회귀를 막습니다.
  // 기존 input 핸들러를 한 번 미리 호출해 active.localDirty를 동기 설정하고,
  // 실제 값 변경/자동저장/판정 로직은 기존 Client가 그대로 처리합니다.
  const primed = new WeakSet();

  function primeResultSelect_(event) {
    const target = event && event.target;
    if (!(target instanceof Element)) return;
    const select = target.closest('.qm-checklist-modal [data-qm-result]');
    if (!select || primed.has(select)) return;
    primed.add(select);

    // 기본 동작/이벤트 전파는 차단하지 않습니다.
    // 기존 bindQmInspectionModalEvents_의 input listener가 localDirty를 먼저 세웁니다.
    select.dispatchEvent(new Event('input', { bubbles: true }));
  }

  document.addEventListener('pointerdown', primeResultSelect_, true);
  // PointerEvent 미지원 구형 WebView 보완. WeakSet으로 중복 priming 차단.
  document.addEventListener('touchstart', primeResultSelect_, true);
})();
</script>
